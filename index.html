d","p":"vt.vi.","c":"使混和，使混雜；使交融","es":"The chef will blend the fruit and ice to make a smoothie.","cs":"廚師將混合水果和冰塊來製作冰沙。","d":"To mix (a substance) with another substance so that they combine together."},{"id":1209,"l":4,"w":"blessing","k":"ˋbl ɛsɪŋ","p":"n.","c":"(上帝的 )賜福；祝福","es":"Their new baby was a welcome blessing to the family.","cs":"他們的新生兒對這個家庭來說是一個受歡迎的祝福。","d":"A prayer asking for divine favor; a beneficial thing."},{"id":1210,"l":4,"w":"blink","k":"bl ɪŋk","p":"vi.vt.n.","c":"眨眼睛；瞇著眼看","es":"He gave a quick blink to signal that he was ready.","cs":"他快速地眨眼，示意他準備好了。","d":"To shut and open the eyes quickly."},{"id":1211,"l":4,"w":"bloom","k":"blum","p":"n.vi.","c":"( 尤指觀賞的 )花；開花 (期) ；開花","es":"The desert flowers bloom only after the spring rains.","cs":"沙漠花朵只在春雨過後才開花。","d":"A flower, especially one cultivated for its beauty; to produce flowers."},{"id":1212,"l":4,"w":"blossom","k":"ˋbl ɑsəm","p":"n.vi.","c":"(尤指果樹的 )花;開 花(期) ；開花","es":"The cherry trees are in full blossom this week.","cs":"櫻花樹本週正盛開。","d":"A flower or mass of flowers on a tree or bush; to flourish."},{"id":1213,"l":4,"w":"blush","k":"bl ʌʃ","p":"vi.n.","c":"(因害羞，尷尬等而 )臉紅","es":"She couldn't help but blush when he complimented her dress.","cs":"當他稱讚她的裙子時，她不禁臉紅。","d":"To suddenly have a red face because of embarrassment or shame."},{"id":1214,"l":4,"w":"boast","k":"bost","p":"vi.n.","c":"自吹自擂；誇耀；吹牛","es":"She often boasts about her expensive holidays abroad.","cs":"她經常吹噓她在國外昂貴的假期。","d":"To talk with excessive pride and satisfaction about one's achievements."},{"id":1215,"l":4,"w":"bond","k":"b ɑnd","p":"n.vt.vi.","c":"結合力；聯結；契約，約定 ; 黏合；結合","es":"The two sisters share an unbreakable bond of love.","cs":"這兩姐妹分享著牢不可破的愛之聯繫。","d":"A link, tie, or fastening; a financial certificate promising repayment."},{"id":1216,"l":4,"w":"bounce","k":"ba ʊns","p":"vt.vi.n.","c":"( 球)彈起，彈回；蹦跳","es":"The basketball was able to bounce high off the court.","cs":"籃球可以從球場上高高彈跳。","d":"To spring back from a surface after hitting it."},{"id":1217,"l":4,"w":"bracelet","k":"ˋbresl ɪt","p":"n.","c":"手鐲；臂鐲","es":"She wore a delicate silver bracelet on her wrist.","cs":"她的手腕上戴著一個精緻的銀手鐲。","d":"An ornament worn around the wrist or arm."},{"id":1218,"l":4,"w":"brassiere","k":"br əˋzɪr","p":"n.","c":"胸罩 = bra","es":"She bought a new lace brassiere at the department store.","cs":"她在百貨公司買了一件新的蕾絲胸罩。","d":"A woman's undergarment worn to support the breasts; a bra."},{"id":1219,"l":4,"w":"breed","k":"brid","p":"vt.vi.","c":"( 動物 )產(子)，孵 (卵)；繁 殖；養育 n.品種","es":"This shelter aims to breed service dogs for the visually impaired.","cs":"這個收容所旨在繁殖導盲犬供視障人士使用。","d":"A stock of animals or plants within a species having a distinctive appearance; to reproduce."},{"id":1220,"l":4,"w":"bridegroom","k":"ˋbra ɪd͵grʊm","p":"n.","c":"新郎 (= groom)","es":"The bridegroom waited anxiously at the altar for his bride.","cs":"新郎焦急地在祭壇前等待著他的新娘。","d":"A man who is about to be or has just been married."},{"id":1221,"l":4,"w":"broil","k":"br ɔɪl","p":"vt.vi.n.","c":"烤，炙","es":"We will broil the fish fillets with some lemon and herbs.","cs":"我們將用一些檸檬和香草烤魚片。","d":"To cook (meat or vegetables) directly under or over a hot grill."},{"id":1222,"l":4,"w":"broke","k":"brok","p":"adj.","c":"【口】破了產的；一文不名的","es":"After buying the tickets, I was completely broke.","cs":"買完票之後，我徹底破產了。","d":"Having completely run out of money."},{"id":1223,"l":4,"w":"brutal","k":"ˋbrut!","p":"adj.","c":"殘忍的，冷酷的；野蠻的","es":"The soldiers were known for their brutal treatment of prisoners.","cs":"這些士兵以對囚犯的殘酷對待而聞名。","d":"Savagely violent; harsh and cruel."},{"id":1224,"l":4,"w":"bulletin","k":"ˋb ʊlətɪn","p":"n.","c":"公告；公報","es":"The school principal issued an important emergency bulletin.","cs":"校長發布了一份重要的緊急公告。","d":"A short official statement or summary of news."},{"id":1225,"l":4,"w":"cabinet","k":"ˋkæb ənɪt","p":"n.","c":"櫥，櫃 ；內閣；全體 閣員","es":"She kept the old family photos locked in a filing cabinet.","cs":"她把舊的家庭照片鎖在一個檔案櫃裡。","d":"A cupboard with shelves or drawers for storing things; a body of advisers to a president or monarch."},{"id":1226,"l":4,"w":"calculate","k":"ˋkælkj ə͵let","p":"vt.vi.","c":"計算","es":"Can you calculate the total cost of the trip for me?","cs":"您能為我計算這次旅行的總費用嗎？","d":"To determine (the amount or number of something) mathematically."},{"id":1227,"l":4,"w":"calculation","k":"͵kælkj əˋleʃən","p":"n.","c":"計算","es":"The final calculation showed a huge mistake in the budget.","cs":"最終的計算顯示預算中有一個巨大的錯誤。","d":"A mathematical determination of the amount or number of something."},{"id":1228,"l":4,"w":"calculator","k":"ˋkælkj ə͵letɚ","p":"n.","c":"計算者 (機)","es":"Students are allowed to use a scientific calculator during the exam.","cs":"學生在考試期間允許使用科學計算機。","d":"A small electronic device used for performing mathematical calculations."},{"id":1229,"l":4,"w":"calorie","k":"ˋkæl ərɪ","p":"n.","c":"卡，卡路里","es":"You should check the number of calories in that energy drink.","cs":"您應該檢查那種能量飲料中的卡路里數量。","d":"A unit of energy contained in food."},{"id":1230,"l":4,"w":"campaign","k":"kæmˋpen","p":"n.","c":"戰役；運動，活動 [(+for/against) ；競選活 動","es":"The charity launched a new public awareness campaign about recycling.","cs":"該慈善機構發起了一項關於回收的新的公共意識運動。","d":"A series of military operations or a planned set of activities to achieve a goal."},{"id":1231,"l":4,"w":"candidate","k":"ˋkænd ədet","p":"n.","c":"候選人；候補者；應 徵者","es":"She is the most qualified candidate for the open position.","cs":"她是這個空缺職位最合格的候選人。","d":"A person who applies for a job or is nominated for election."},{"id":1232,"l":4,"w":"capacity","k":"k əˋpæs ətɪ","p":"n.","c":"容量，容積；能力， 才能","es":"The stadium has a seating capacity of over 50,000 people.","cs":"體育場有超過 50,000 人的座位容量。","d":"The maximum amount that something can contain; the ability or power to do something."},{"id":1233,"l":4,"w":"cape","k":"kep","p":"n.","c":"披肩；斗篷；岬，海角","es":"The superhero wore a bright red cape that flew behind him.","cs":"這位超級英雄穿著一件在他身後飛舞的鮮紅色披風。","d":"A point of land extending into the sea; a cloak, typically without sleeves."},{"id":1234,"l":4,"w":"capital","k":"ˋkæp ət!","p":"n.adj.","c":"首都；大寫字母；資本 ；首要的；死刑的","es":"London is the capital city of the United Kingdom.","cs":"倫敦是英國的首都。","d":"The most important city or town of a country or region; wealth used to create more wealth."},{"id":1235,"l":4,"w":"capitalism","k":"ˋkæp ət!͵ɪzəm","p":"n.","c":"資本主義 (制 度)","es":"Critics argue that capitalism leads to massive economic inequality.","cs":"批評家認為，資本主義會導致巨大的經濟不平等。","d":"An economic and political system in which a country's trade and industry are controlled by private owners for profit."},{"id":1236,"l":4,"w":"capitalist","k":"ˋkæp ət!ɪst","p":"n.","c":"資本家；資本主義者","es":"The company is run by a wealthy capitalist from Silicon Valley.","cs":"這家公司由一位來自矽谷的富有資本家經營。","d":"A wealthy person who uses money to invest in trade and industry for profit."},{"id":1237,"l":4,"w":"career","k":"k əˋrɪr","p":"n.","c":"(終身的 )職業 ；生涯；歷 程","es":"He decided to pursue a career in film production.","cs":"他決定從事電影製作的事業。","d":"An occupation undertaken for a significant period of a person's life and with opportunities for progress."},{"id":1238,"l":4,"w":"cargo","k":"ˋkɑrgo","p":"n.","c":"(船、飛機、車輛裝載的 )貨 物","es":"The ship was loaded with valuable cargo bound for Asia.","cs":"這艘船裝滿了運往亞洲的貴重貨物。","d":"Goods carried on a ship, aircraft, or motor vehicle; freight."},{"id":1239,"l":4,"w":"carrier","k":"ˋkær ɪɚ","p":"n.","c":"運送人；送信人；航空母 艦","es":"The plane is a large military aircraft carrier.","cs":"這架飛機是一艘大型軍用航空母艦運輸機。","d":"A person or thing that carries or transports something."},{"id":1240,"l":4,"w":"carve","k":"k ɑrv","p":"vi.","c":"刻，雕刻","es":"The artist used a sharp tool to carve a statue from wood.","cs":"這位藝術家使用鋒利的工具從木頭上雕刻出一尊雕像。","d":"To cut (a solid material) in order to produce an object or design."},{"id":1241,"l":4,"w":"catalogue/catalog","k":"ˋkæt əlɔg","p":"n.","c":"(圖書，商品的 ) 目錄","es":"I ordered the book from the online library catalogue.","cs":"我從線上圖書館的目錄訂購了這本書。","d":"A complete list of items, typically in alphabetical or systematic order."},{"id":1242,"l":4,"w":"cease","k":"sis","p":"n.vt.vi.","c":"停止，終止","es":"The soldiers were ordered to cease fire immediately.","cs":"士兵們被命令立即停止射擊。","d":"To come to an end; stop."},{"id":1243,"l":4,"w":"celebration","k":"͵s ɛləˋbreʃən","p":"n.","c":"慶祝 ；慶祝活 動","es":"The town is planning a huge celebration for the New Year.","cs":"該鎮正計畫為新年舉行盛大的慶祝活動。","d":"The action of marking an important event or day with festivities."},{"id":1244,"l":4,"w":"cement","k":"s ɪˋmɛnt","p":"n.","c":"水泥","es":"Workers used bags of cement to mix the concrete.","cs":"工人使用一袋袋水泥來攪拌混凝土。","d":"A powdery substance used as a binder in mortar and concrete."},{"id":1245,"l":4,"w":"chamber","k":"ˋt ʃembɚ","p":"n.","c":"房間；寢室","es":"The old king died in his private bed chamber.","cs":"老國王在他的私人臥室裡去世了。","d":"A large room used for formal or public business; a private room."},{"id":1246,"l":4,"w":"championship","k":"ˋt ʃæ mp ɪən͵ʃɪp","p":"n.","c":"冠軍的地位 ；錦標賽","es":"She won the national tennis championship at age sixteen.","cs":"她在十六歲時贏得了全國網球冠軍。","d":"A contest for the position of champion in a sport or game."},{"id":1247,"l":4,"w":"characteristic","k":"͵kær əktəˋrɪstɪk","p":"n.adj.","c":"特性，特徵 ；特有的，獨特 的","es":"Patience is her most notable characteristic.","cs":"耐心是她最顯著的特徵。","d":"A distinguishing feature or quality."},{"id":1248,"l":4,"w":"charity","k":"ˋt ʃærətɪ","p":"n.","c":"慈悲；慈善 ；慈善團 體","es":"She donated a large sum of money to a local charity.","cs":"她向一家當地慈善機構捐贈了一大筆錢。","d":"The voluntary giving of help, typically money, to those in need; an organization set up to help the needy."},{"id":1249,"l":4,"w":"chemistry","k":"ˋk ɛmɪstrɪ","p":"n.","c":"化學；男女間的來電","es":"We performed an experiment in the chemistry laboratory.","cs":"我們在化學實驗室進行了一項實驗。","d":"The branch of science that deals with the composition, properties, and reactions of substances."},{"id":1250,"l":4,"w":"cherish","k":"ˋt ʃɛrɪʃ","p":"vt.","c":"珍愛；珍惜","es":"She will always cherish the memory of her grandmother.","cs":"她將永遠珍愛她祖母的記憶。","d":"To protect and care for (someone or something) lovingly; to hold (an idea or belief) dear."},{"id":1251,"l":4,"w":"chirp","k":"t ʃɝp","p":"vi.n.","c":"(小鳥 )發啁啾聲； (昆蟲 )發 唧唧聲","es":"We woke up to the sound of birds chirping outside the window.","cs":"我們被窗外鳥兒啁啾的聲音吵醒。","d":"(Of a small bird or insect) to make a short, sharp, high-pitched sound."},{"id":1252,"l":4,"w":"chore","k":"t ʃor","p":"n.","c":"家庭雜務；日常零星活兒","es":"Doing the dishes is my least favorite daily chore.","cs":"洗碗是我最不喜歡的日常雜務。","d":"A routine task, especially a household one."},{"id":1253,"l":4,"w":"chorus","k":"ˋkor əs","p":"n.vt.vi.","c":"合唱隊 ；合唱 ；副歌 ；合唱","es":"The entire audience joined in singing the song's chorus.","cs":"全體觀眾加入了合唱這首歌的副歌。","d":"A large group of singers; a part of a song that is repeated."},{"id":1254,"l":4,"w":"cigar","k":"s ɪˋgɑr","p":"n.","c":"雪茄","es":"He lit an expensive Cuban cigar after dinner.","cs":"他在晚餐後點燃了一支昂貴的古巴雪茄。","d":"A tightly rolled bundle of dried and fermented tobacco that is lit so that smoke can be drawn into the mouth."},{"id":1255,"l":4,"w":"cinema","k":"ˋs ɪnəmə","p":"n.","c":"【英】電影院 ；(一部 )電影 ；(總稱 )電影；電 影業","es":"They went to the cinema to see the new blockbuster film.","cs":"他們去電影院看新上映的賣座電影。","d":"A movie theater; the art or industry of making movies."},{"id":1256,"l":4,"w":"circular","k":"ˋs ɝkjəlɚ","p":"adj.","c":"圓形的；環形的","es":"The meeting table was perfectly circular.","cs":"會議桌是完全圓形的。","d":"Having the form of a circle; (of a document) intended for circulation."},{"id":1257,"l":4,"w":"circulate","k":"ˋs ɝkjə͵let","p":"vt.vi.","c":"循環；流通；發行","es":"The newspaper will circulate in the city every morning.","cs":"報紙每天早上都會在城市中流傳。","d":"To move continuously or freely through a closed system or area; to pass from person to person."},{"id":1258,"l":4,"w":"circulation","k":"͵s ɝkjəˋleʃən","p":"n.","c":"循環； (貨幣、消 息 等的 )流通； (報刊等的 )發行 量","es":"Regular exercise is good for blood circulation.","cs":"規律的運動對血液循環有益。","d":"The movement of blood around the body; the movement of money or information; the average number of copies of a newspaper or magazine sold."},{"id":1259,"l":4,"w":"circumstance","k":"ˋs ɝkəm͵stæns","p":"n.","c":"情況，環境","es":"I was unable to attend the meeting due to personal circumstances.","cs":"由於個人情況，我無法出席會議。","d":"A fact or condition connected with or relevant to an event or action."},{"id":1260,"l":4,"w":"civilian","k":"s ɪˋvɪljən","p":"n.","c":"(與軍、警相對的 )平民， 百姓","es":"Most of the passengers on the flight were civilians.","cs":"飛機上的大多數乘客都是平民。","d":"A person not in the armed services or the police force."},{"id":1261,"l":4,"w":"civilization","k":"͵s ɪv!əˋzeʃən","p":"n.","c":"教化 (過程 )；文明；文明世界","es":"Archaeologists are studying the remains of an ancient civilization.","cs":"考古學家正在研究一個古代文明的遺跡。","d":"The stage of human social and cultural development and organization considered most advanced."},{"id":1262,"l":4,"w":"clarify","k":"ˋklær ə͵faɪ","p":"vt.vi.","c":"澄清；闡明","es":"Could you please clarify the main point of your argument?","cs":"您能否澄清您論點的要點？","d":"To make (a statement or situation) less confused and more comprehensible."},{"id":1263,"l":4,"w":"clash","k":"klæʃ","p":"n.vi.vt.","c":"砰地相碰撞；衝突","es":"The protesters clashed with the police outside the building.","cs":"抗議者在建築物外與警方發生了衝突。","d":"A violent confrontation; or to come together and hit with a loud noise."},{"id":1264,"l":4,"w":"classification","k":"͵klæs əfəˋkeʃən","p":"n.","c":"分類；分級","es":"The library uses a numerical classification system for books.","cs":"圖書館使用數字分類系統來對書籍進行分類。","d":"The action or process of classifying something."},{"id":1265,"l":4,"w":"classify","k":"ˋklæs ə͵faɪ","p":"vt.","c":"將…分類；將 …分等 級","es":"We need to classify these documents by date and subject.","cs":"我們需要按日期和主題分類這些文件。","d":"To arrange (a group of people or things) in classes or categories."},{"id":1266,"l":4,"w":"cliff","k":"kl ɪf","p":"n.","c":"(尤指海邊的 )懸崖，峭壁","es":"They stood at the edge of the steep ocean cliff and looked down.","cs":"他們站在陡峭的海洋懸崖邊緣向下看。","d":"A steep rock face, especially at the edge of the sea."},{"id":1267,"l":4,"w":"climax","k":"ˋkla ɪmæ ks","p":"n.","c":"頂點，高潮","es":"The movie's thrilling climax involved a car chase through the city.","cs":"電影驚心動魄的高潮涉及一場穿過城市的汽車追逐。","d":"The most intense, exciting, or important point of something."},{"id":1268,"l":4,"w":"clumsy","k":"ˋkl ʌmzɪ","p":"adj.","c":"笨拙的，手腳不靈活的","es":"The child was too clumsy to carry the full glass of milk.","cs":"這個孩子太笨拙了，拿不住那杯滿滿的牛奶。","d":"Awkward in movement or handling things."},{"id":1269,"l":4,"w":"coarse","k":"kors","p":"adj.","c":"粗糙的；粗劣的","es":"The sand on this beach is very coarse and rough.","cs":"這個海灘上的沙子非常粗糙。","d":"Rough or harsh in texture; crude in manner or language."},{"id":1270,"l":4,"w":"code","k":"kod","p":"n.","c":"法典，法規；規則；代碼；密 碼","es":"The programmer spent hours writing the complex software code.","cs":"程式設計師花了好幾個小時編寫複雜的軟體代碼。","d":"A system of words, letters, figures, or symbols used to represent others; a set of rules."},{"id":1271,"l":4,"w":"collapse","k":"k əˋlæps","p":"vi.vt.n.","c":"倒塌","es":"The old wooden bridge threatened to collapse under the weight.","cs":"這座舊木橋威脅著要在重量下倒塌。","d":"To fall down or give way suddenly."},{"id":1272,"l":4,"w":"combination","k":"͵k ɑmbəˋneʃən","p":"n.","c":"結合 (體)；密 碼鎖","es":"The dish is a delicious combination of sweet and sour flavors.","cs":"這道菜是酸甜口味的美味組合。","d":"A joining or merging of different things or qualities."},{"id":1273,"l":4,"w":"comedy","k":"ˋk ɑmədɪ","p":"n.","c":"喜劇","es":"I prefer watching a lighthearted comedy to a serious drama.","cs":"我更喜歡看輕鬆的喜劇而不是嚴肅的戲劇。","d":"A play, movie, or program intended to make an audience laugh."},{"id":1274,"l":4,"w":"comic(s)2","k":"ˋk ɑmɪk","p":"adj.n.","c":"連環漫畫的 ；連環漫 畫","es":"My younger brother spends all his allowance on buying comics.","cs":"我弟弟把他所有的零用錢都花在買漫畫書上。","d":"A periodical containing comic strips or graphic stories."},{"id":1275,"l":4,"w":"comic1","k":"ˋk ɑmɪk","p":"adj.n.","c":"喜劇的 ；喜劇演員","es":"The popular comic performs stand-up shows every weekend.","cs":"這位受歡迎的喜劇演員每週末都會進行單口表演。","d":"Causing or meant to cause laughter."},{"id":1276,"l":4,"w":"commander","k":"k əˋmænd ɚ","p":"n.","c":"指揮官，司令官","es":"The army commander gave the order to advance.","cs":"陸軍指揮官下達了前進的命令。","d":"A person in authority, especially over a body of troops or a military operation."},{"id":1277,"l":4,"w":"comment","k":"ˋk ɑmɛnt","p":"n. vi.","c":"註釋，評註；批評， 評論","es":"She made a positive comment about the quality of the meal.","cs":"她對這頓飯的品質發表了一個正面的評論。","d":"A verbal or written remark expressing an opinion or reaction."},{"id":1278,"l":4,"w":"commerce","k":"ˋk ɑmɝs","p":"n.","c":"商業，貿易","es":"International commerce is essential for the global economy.","cs":"國際商業對於全球經濟至關重要。","d":"The activity of buying and selling, especially on a large scale."},{"id":1279,"l":4,"w":"commit","k":"k əˋmɪt","p":"vt.","c":"犯(罪)，做 (錯事等 )","es":"He was afraid to commit to a long-term relationship.","cs":"他害怕承諾一段長期的關係。","d":"To perpetrate or carry out (a mistake, crime, or illegal act); to pledge or devote."},{"id":1280,"l":4,"w":"communication","k":"k ə͵mjun əˋkeʃən","p":"n.","c":"溝通；傳 達；交流；通訊 (交通 ) 設施","es":"Clear communication is vital for any successful team.","cs":"清晰的溝通對於任何成功的團隊都至關重要。","d":"The imparting or exchanging of information by speaking, writing, or using some other medium."},{"id":1281,"l":4,"w":"community","k":"k əˋmjun ətɪ","p":"n.","c":"社區 ；(一般 )社會，公眾","es":"They are actively involved in improving their local community.","cs":"他們積極參與改善他們當地的社區。","d":"A group of people living in the same place or having a particular characteristic in common."},{"id":1282,"l":4,"w":"companion","k":"k əmˋpænj ən","p":"n.","c":"同伴，伴侶","es":"The elderly woman hired a travel companion for her trip.","cs":"這位年長的婦女為她的旅行聘請了一位旅行伴侶。","d":"A person or animal with whom one spends time or travels."},{"id":1283,"l":4,"w":"competition","k":"͵kɑmpəˋtɪʃən","p":"n.","c":"競爭，比賽，競 賽","es":"There is fierce competition among smartphone manufacturers.","cs":"智慧型手機製造商之間存在激烈的競爭。","d":"The activity or condition of striving to gain or win something by defeating or establishing superiority over others."},{"id":1284,"l":4,"w":"competitive","k":"k əmˋpɛtətɪv","p":"adj.","c":"競爭的；競爭激 烈的","es":"He is extremely competitive and hates to lose at anything.","cs":"他極具競爭力，討厭在任何事情上輸掉。","d":"Relating to or characterized by competition; having a strong desire to win."},{"id":1285,"l":4,"w":"competitor","k":"k əmˋpɛtətɚ","p":"n.","c":"競爭者；對手","es":"Their main competitor just released a similar product.","cs":"他們的主要競爭對手剛剛發布了一款類似的產品。","d":"A person who takes part in a competition; a rival."},{"id":1286,"l":4,"w":"complicate","k":"ˋk ɑmplə͵ket","p":"vt.","c":"使複雜化","es":"The sudden change in rules will only complicate the situation.","cs":"規則的突然改變只會使情況複雜化。","d":"To make (something) more difficult or confusing."},{"id":1287,"l":4,"w":"compose","k":"k əmˋpoz","p":"vt.","c":"作(詩，曲等 )；組成 (+of)","es":"The composer will compose a new symphony for the orchestra.","cs":"這位作曲家將為樂團創作一部新的交響樂。","d":"To write or create (a work of art, especially music or poetry)."},{"id":1288,"l":4,"w":"composer","k":"k əmˋpoz ɚ","p":"n.","c":"作曲者，作曲家","es":"Ludwig van Beethoven is one of the most famous classical composers.","cs":"路德維希·范·貝多芬是最著名的古典作曲家之一。","d":"A person who writes music."},{"id":1289,"l":4,"w":"composition","k":"͵k ɑmpəˋzɪʃən","p":"n.","c":"寫作；作曲 ；作品；作文； (大型 )樂曲","es":"The student's latest composition was a beautiful short story.","cs":"這位學生最新的作文是一篇優美的短篇小說。","d":"The way in which a whole or mixture is made up; a piece of writing or music."},{"id":1290,"l":4,"w":"concentrate","k":"ˋk ɑnsɛn͵tret","p":"vt.","c":"集中；聚集；濃 縮 vi.集中；專注","es":"I can't concentrate with all this noise going on.","cs":"在這些噪音的干擾下，我無法集中注意力。","d":"To focus all one's attention or mental effort on a particular object or activity."},{"id":1291,"l":4,"w":"concentration","k":"͵k ɑnsɛnˋtreʃən","p":"n.","c":"集中；專心；濃縮","es":"The chemical has a high concentration of salt.","cs":"這種化學物質含有高濃度的鹽分。","d":"The action of focusing all one's attention or mental effort; the relative amount of a substance in a mixture."},{"id":1292,"l":4,"w":"concept","k":"ˋk ɑnsɛpt","p":"n.","c":"概念，觀念","es":"The math teacher struggled to explain the abstract concept.","cs":"數學老師很難解釋這個抽象的概念。","d":"An abstract idea; a general notion."},{"id":1293,"l":4,"w":"concerning","k":"k ənˋsɝnɪŋ","p":"prep.","c":"關於 …","es":"I received an important email concerning the upcoming travel restrictions.","cs":"我收到了一封關於即將到來的旅行限制的重要電子郵件。","d":"About; regarding."},{"id":1294,"l":4,"w":"concrete","k":"ˋk ɑnkrit","p":"adj.","c":"有形的；具體的 n.混 凝土","es":"The skyscraper was built on a foundation of strong concrete.","cs":"這座摩天大樓是建立在堅固的混凝土基礎上的。","d":"A heavy, rough building material made from a mixture of broken stone, sand, cement, and water; existing in a material or physical form."},{"id":1295,"l":4,"w":"conductor","k":"k ənˋdʌktɚ","p":"n.","c":"管理人；指揮； 車 掌；避雷針","es":"The orchestra conductor raised his baton to begin the music.","cs":"樂團指揮舉起指揮棒開始演奏音樂。","d":"A person who directs an orchestra or chorus; a material that conducts heat or electricity."},{"id":1296,"l":4,"w":"conference","k":"ˋk ɑnfərəns","p":"n.","c":"(正式 )會議；(學校，教會，體育隊等的 ) 聯盟","es":"They are attending a business conference in Geneva next week.","cs":"他們下週將參加在日內瓦舉行的商業會議。","d":"A formal meeting for discussion."},{"id":1297,"l":4,"w":"confess","k":"k ənˋfɛs","p":"vt.","c":"坦白，承認 [+(that)","es":"The thief decided to confess to the crime after being caught.","cs":"這名小偷在被捕後決定承認罪行。","d":"To admit that one has committed a crime or done something wrong."},{"id":1298,"l":4,"w":"confidence","k":"ˋk ɑnfədəns","p":"n.","c":"自信，信心","es":"Her past successes gave her great confidence in her abilities.","cs":"她過去的成功讓她對自己的能力充滿信心。","d":"The feeling or belief that one can rely on someone or something; a firm trust."},{"id":1299,"l":4,"w":"confine","k":"k ənˋfaɪn","p":"vt.","c":"限制；使局限","es":"The prisoner was confined to a small cell for three weeks.","cs":"這名囚犯被限制在一個小牢房裡三週。","d":"To restrict (someone or something) within certain limits of space or time."},{"id":1300,"l":4,"w":"confusion","k":"k ənˋfju ʒən","p":"n.","c":"混亂；慌亂；困惑","es":"There was mass confusion when the fire alarm unexpectedly went off.","cs":"當火警警報意外響起時，引起了巨大的混亂。","d":"A situation of disorder and lack of understanding."},{"id":1301,"l":4,"w":"congratulate","k":"k ənˋgræt ʃə͵let","p":"vt.","c":"祝賀；恭禧","es":"I would like to congratulate you on your excellent exam results.","cs":"我想恭喜您的優異考試成績。","d":"To express one's pleasure to (someone) at that person's success or good fortune."},{"id":1302,"l":4,"w":"congress","k":"ˋk ɑŋgrəs","p":"n.","c":"(正式 )會議；代表大 會；(C-)美國國會","es":"The bill was passed by a narrow margin in Congress.","cs":"該法案在國會以微弱優勢通過。","d":"A formal meeting of delegates for discussion; the national legislative body of a country."},{"id":1303,"l":4,"w":"conjunction","k":"k ənˋdʒʌŋkʃən","p":"n.","c":"【文】 連接詞；結合","es":"The sentence uses the word 'but' as a coordinating conjunction.","cs":"這個句子使用「but」作為對等連接詞。","d":"A word used to connect clauses or sentences or to coordinate words in the same clause (e.g., and, but, if)."},{"id":1304,"l":4,"w":"conquer","k":"ˋk ɑŋkɚ","p":"vt.","c":"征服；攻克，攻取","es":"Julius Caesar was determined to conquer all of Gaul.","cs":"凱撒決心要征服整個高盧地區。","d":"To overcome and take control of (a place or people) by military force."},{"id":1305,"l":4,"w":"conscience","k":"ˋk ɑnʃəns","p":"n.","c":"良心；道義心","es":"He finally returned the wallet because his conscience bothered him.","cs":"他最終歸還了錢包，因為他的良心在譴責他。","d":"An inner feeling or voice viewed as acting as a guide to the rightness or wrongness of one's behavior."},{"id":1306,"l":4,"w":"consequence","k":"ˋk ɑnsə͵kwɛns","p":"n.","c":"結果，後果","es":"The heavy rain is a direct consequence of the unseasonal warm weather.","cs":"大雨是反常溫暖天氣的直接後果。","d":"A result or effect of an action or condition."},{"id":1307,"l":4,"w":"consequent","k":"ˋk ɑnsə͵kwɛnt","p":"adj.","c":"隨之發生 的","es":"The earthquake caused widespread damage and the consequent loss of power.","cs":"地震造成了廣泛的破壞以及隨之而來的電力損失。","d":"Following as a result or effect."},{"id":1308,"l":4,"w":"conservative","k":"k ənˋsɝvətɪv","p":"adj.n.","c":"保守的，守舊的 ；保守者；防腐劑","es":"She has very conservative views on social issues.","cs":"她對社會議題持有非常保守的觀點。","d":"Holding to traditional attitudes and values and cautious about change or innovation."},{"id":1309,"l":4,"w":"consist","k":"k ənˋsɪst","p":"vi.","c":"由..組成 ；在於 …","es":"Water consists of hydrogen and oxygen.","cs":"水由氫和氧組成。","d":"To be composed or made up of."},{"id":1310,"l":4,"w":"consistent","k":"k ənˋsɪstənt","p":"adj.","c":"始終如一的，前後 一致的","es":"You need to be consistent with your study habits to see results.","cs":"您的學習習慣需要一致才能看到成果。","d":"Acting or done in the same way over time; unchanging."},{"id":1311,"l":4,"w":"consonant","k":"ˋk ɑnsənənt","p":"n.","c":"【語】子音；子音 字母","es":"The letters 'b', 'c', and 'd' are examples of consonants.","cs":"字母 'b'、'c' 和 'd' 是子音的例子。","d":"A basic speech sound in which the breath is at least partly obstructed; a letter representing this sound."},{"id":1312,"l":4,"w":"constitute","k":"ˋk ɑnstə͵tjut","p":"vt.","c":"構成，組成","es":"Women constitute nearly half of the workforce in this industry.","cs":"女性構成了這個行業近一半的勞動力。","d":"To be (a part) of a whole; to establish (a body or organization)."},{"id":1313,"l":4,"w":"constitution","k":"͵k ɑnstəˋtjuʃən","p":"n.","c":"憲法；章程 體質，體格","es":"The constitution guarantees the right to freedom of speech.","cs":"憲法保障言論自由的權利。","d":"A body of fundamental principles according to which a state or organization is governed."},{"id":1314,"l":4,"w":"construct","k":"k ənˋstrʌkt","p":"vt.","c":"建造，構成","es":"The team will construct a temporary bridge over the river.","cs":"該團隊將在河上建造一座臨時橋樑。","d":"To build or erect something, typically a large structure such as a building, road, or bridge."},{"id":1315,"l":4,"w":"construction","k":"k ənˋstrʌkʃən","p":"n.","c":"建造，建設","es":"The new museum is currently under construction.","cs":"新博物館目前正在施工中。","d":"The action of building or making something."},{"id":1316,"l":4,"w":"constructive","k":"k ənˋstrʌktɪv","p":"adj.","c":"建設性的；結構 上的","es":"Please offer some constructive criticism on my essay.","cs":"請對我的作文提出一些建設性的批評。","d":"Serving a useful purpose; tending to build up or improve."},{"id":1317,"l":4,"w":"consult","k":"k ənˋsʌlt","p":"vt.","c":"與…商量；請教；查閱 (詞典，參考書等 )","es":"You should consult a doctor if the symptoms persist.","cs":"如果症狀持續存在，您應該諮詢醫生。","d":"To seek information or advice from (someone with expertise) or from a reference source."},{"id":1318,"l":4,"w":"consultant","k":"k ənˋsʌltənt","p":"n.","c":"顧問","es":"The company hired a financial consultant to advise them.","cs":"該公司聘請了一位財務顧問為他們提供建議。","d":"A person who provides expert advice professionally."},{"id":1319,"l":4,"w":"consume","k":"k ənˋsjum","p":"vt.","c":"消耗，花費","es":"The engine will consume less fuel at lower speeds.","cs":"引擎在較低的速度下將消耗更少的燃料。","d":"To eat, drink, or ingest (food or drink); to use up (a resource)."},{"id":1320,"l":4,"w":"consumer","k":"kənˋsjum ɚ","p":"n.","c":"消費者；消耗者","es":"New government policies are designed to protect consumers.","cs":"新的政府政策旨在保護消費者。","d":"A person who purchases goods and services for personal use."},{"id":1321,"l":4,"w":"container","k":"k ənˋten ɚ","p":"n.","c":"容器 (如箱、盒、罐等 )","es":"Please store the leftovers in an airtight container.","cs":"請將剩菜存放在密封的容器中。","d":"An object for holding or transporting something."},{"id":1322,"l":4,"w":"content","k":"k ənˋtɛnt","p":"adj.vt.n.","c":"滿足的，滿意的 ；滿足 ；滿足","es":"He felt happy and content with his simple life.","cs":"他對自己簡單的生活感到幸福和滿足。","d":"In a state of peaceful happiness or satisfaction."},{"id":1323,"l":4,"w":"content(s)","k":"ˋk ɑntɛnt","p":"n.","c":"含量；內容","es":"The package contents were clearly listed on the box.","cs":"包裹的內容物清楚地列在盒子上。","d":"The things that are held or included in something; the substance or material addressed in a book."},{"id":1324,"l":4,"w":"contentment","k":"k ənˋtɛntmənt","p":"n.","c":"滿足，知足；滿意","es":"A feeling of peace and contentment filled the room.","cs":"一種平和與滿足的感覺充滿了房間。","d":"A state of happiness and satisfaction."},{"id":1325,"l":4,"w":"contest","k":"ˋk ɑntɛst","p":"n.vt.vi.","c":"爭奪，競爭，比賽 ；爭奪；與 …競賽","es":"She entered a local singing contest for charity.","cs":"她參加了一個當地的慈善歌唱比賽。","d":"A competition in which people try to win something."},{"id":1326,"l":4,"w":"context","k":"ˋk ɑntɛkst","p":"n.","c":"【語】上下文","es":"You need to understand the historical context of the novel.","cs":"您需要理解這部小說的歷史背景。","d":"The circumstances that form the setting for an event, statement, or idea, and in terms of which it can be fully understood."},{"id":1327,"l":4,"w":"continual","k":"kənˈtɪnjuəl","p":"a.","c":"不間斷的，連續的","es":"We suffered from continual interruptions throughout the day.","cs":"我們整天都在忍受接二連三的打擾。","d":"Happening frequently or repeatedly, though usually with breaks in between."},{"id":1328,"l":4,"w":"continuous","k":"k ənˋtɪnjʊəs","p":"adj.","c":"連續的，不斷的","es":"The machine operates on a continuous cycle, 24 hours a day.","cs":"這台機器以連續的循環運作，每天 24 小時。","d":"Forming an unbroken whole; without interruption."},{"id":1329,"l":4,"w":"contrary","k":"ˋk ɑntrɛrɪ","p":"n.adj.","c":"相反；相反的事物 ；相反的，對立的","es":"Contrary to popular belief, the sun does not revolve around the Earth.","cs":"與大眾的信念相反，太陽並不繞著地球轉。","d":"Opposite in nature, direction, or meaning."},{"id":1330,"l":4,"w":"contrast","k":"ˋk ɑn͵træst","p":"n.vi.vt.","c":"對比，對照 ；使對比，使對照","es":"The old black and white photo shows a sharp contrast between light and shadow.","cs":"這張舊黑白照片顯示出光影之間強烈的對比。","d":"The state of being strikingly different from something else; to compare."},{"id":1331,"l":4,"w":"contribute","k":"k ənˋtrɪbjut","p":"vt.vi.","c":"捐(款)；捐獻；投(稿)","es":"We should all contribute to keeping the environment clean.","cs":"我們都應該貢獻力量來保持環境清潔。","d":"To give (something, especially money or time) in order to help achieve or provide something."},{"id":1332,"l":4,"w":"contribution","k":"͵k ɑntrəˋbjuʃən","p":"n.","c":"貢獻；投稿","es":"His research made a significant contribution to the field of medicine.","cs":"他的研究對醫學領域做出了重大的貢獻。","d":"A gift or payment to a common fund or collection; the part played by a person in bringing about a result."},{"id":1333,"l":4,"w":"convenience","k":"k ənˋvinj əns","p":"n.","c":"方便 ；便利設 施","es":"For your convenience, the office offers online scheduling.","cs":"為了您的方便，辦公室提供線上預約服務。","d":"The state of being able to proceed easily without effort or difficulty."},{"id":1334,"l":4,"w":"convention","k":"k ənˋvɛnʃən","p":"n.","c":"大會；全體與會者 ；慣例，習俗","es":"The medical convention will be held in New York next month.","cs":"醫學大會將於下個月在紐約舉行。","d":"A way in which something is usually done; a large meeting or conference."},{"id":1335,"l":4,"w":"conventional","k":"k ənˋvɛnʃən!","p":"adj.","c":"會議的；慣例的","es":"Their wedding was very conventional, with traditional vows and customs.","cs":"他們的婚禮非常傳統，有著傳統的誓詞和習俗。","d":"Based on or conforming to what is generally accepted or customary."},{"id":1336,"l":4,"w":"converse","k":"k ənˋvɝs","p":"vi.","c":"【書】交談","es":"We spent the entire evening in quiet converse about books.","cs":"我們整個晚上都在安靜地交談關於書籍的事情。","d":"To engage in conversation; the opposite or reverse of a fact or statement."},{"id":1337,"l":4,"w":"convey","k":"k ənˋve","p":"vt.","c":"運送；傳遞","es":"The painting attempts to convey a feeling of deep sadness.","cs":"這幅畫試圖傳達一種深深的悲傷感。","d":"To transport or carry (a person or object) to a place; to make (an idea or feeling) known or understandable."},{"id":1338,"l":4,"w":"convince","k":"k ənˋvɪns","p":"vt.","c":"使信服；說服","es":"The lawyer managed to convince the jury of his client's innocence.","cs":"律師設法說服了陪審團相信他客戶的清白。","d":"To cause (someone) to believe firmly in the truth of something."},{"id":1339,"l":4,"w":"cooperate","k":"koˋ ɑpə͵ret","p":"vt.","c":"合作，協作","es":"The two companies agreed to cooperate on the new project.","cs":"這兩家公司同意在新專案上合作。","d":"To work together toward a common end or purpose."},{"id":1340,"l":4,"w":"cooperation","k":"ko͵ ɑpəˋreʃən","p":"n.","c":"合作，協力 ；合作社","es":"The success of the team relies on good cooperation among members.","cs":"團隊的成功取決於成員之間的良好合作。","d":"The process of working together to the same end."},{"id":1341,"l":4,"w":"cooperative","k":"koˋ ɑpə͵retɪv","p":"adj.","c":"合作的；合作社 的","es":"The children were very cooperative during the class activity.","cs":"孩子們在課堂活動中非常合作。","d":"Involving cooperation; willing to work together."},{"id":1342,"l":4,"w":"cope","k":"kop","p":"vi.","c":"對付，妥善處理","es":"She is struggling to cope with the stress of her new job.","cs":"她正在努力應付新工作的壓力。","d":"To deal effectively with something difficult."},{"id":1343,"l":4,"w":"copper","k":"ˋk ɑpɚ","p":"n.","c":"銅","es":"The old wires were made of pure copper.","cs":"舊的電線是由純銅製成的。","d":"A reddish-brown malleable and ductile metal that is an excellent conductor of heat and electricity."},{"id":1344,"l":4,"w":"cord","k":"k ɔrd","p":"n.","c":"細繩，粗線； 【解】腱，韌帶","es":"Please unplug the appliance by pulling the plug, not the cord.","cs":"請拉插頭來拔掉電器插頭，而不是拉電線。","d":"Several strands twisted together to make a thick string or rope."},{"id":1345,"l":4,"w":"cork","k":"k ɔrk","p":"n.","c":"軟木 ；軟木塞","es":"The waiter used a small opener to remove the cork from the wine bottle.","cs":"服務生使用一個小的開瓶器來取出酒瓶上的軟木塞。","d":"A light, spongy substance that is the outer bark of a tree; a stopper for a bottle."},{"id":1346,"l":4,"w":"correspond","k":"͵k ɔrɪˋspɑnd","p":"vi.","c":"符合，一致；通 信","es":"The numbers on the list do not correspond with the numbers in the report.","cs":"清單上的數字與報告中的數字不一致。","d":"To be in agreement or conformity; to communicate by exchanging letters."},{"id":1347,"l":4,"w":"costume","k":"ˋk ɑstjum","p":"n.","c":"戲裝","es":"She won the prize for the best costume at the Halloween party.","cs":"她在萬聖節派對上贏得了最佳服裝獎。","d":"A set of clothes in a style typical of a particular country or period; an outfit worn to represent a character."},{"id":1348,"l":4,"w":"cottage","k":"ˋk ɑtɪdʒ","p":"n.","c":"農舍，小屋","es":"We rented a charming little cottage by the sea for the summer.","cs":"我們租了一棟迷人的海邊小村舍過暑假。","d":"A small, modest house, typically in the country."},{"id":1349,"l":4,"w":"council","k":"ˋka ʊns!","p":"n.","c":"會議；地方議會","es":"The city council voted on the new public transportation plan.","cs":"市議會就新的公共交通計畫進行了投票。","d":"An advisory, deliberative, or administrative body of people formally constituted and meeting regularly."},{"id":1350,"l":4,"w":"counter1","k":"ˋka ʊntɚ","p":"n.","c":"計算者；櫃臺","es":"He handed his ticket to the clerk at the check-in counter.","cs":"他在報到櫃檯將他的票遞給了職員。","d":"A long flat-topped fixture over which business is conducted; a calculating device."},{"id":1351,"l":4,"w":"counter2","k":"ˋka ʊntɚ","p":"adj.n.","c":"相反 (的)；反對 (的)","es":"He tried to counter her arguments with strong evidence.","cs":"他試圖用強有力的證據來反駁她的論點。","d":"To oppose or respond to something."},{"id":1352,"l":4,"w":"courageous","k":"k əˋredʒəs","p":"adj.","c":"英勇的，勇敢的","es":"It was a courageous decision to resign and start her own company.","cs":"辭職並創辦自己的公司是一個勇敢的決定。","d":"Not deterred by danger or pain; brave."},{"id":1353,"l":4,"w":"courteous","k":"ˋk ɝtjəs","p":"adj.","c":"殷勤的，謙恭的","es":"The airline staff were extremely courteous and helpful.","cs":"航空公司的員工非常有禮貌且樂於助人。","d":"Polite, respectful, or considerate in manner."},{"id":1354,"l":4,"w":"courtesy","k":"ˋk ɝtəsɪ","p":"n.","c":"禮貌；殷勤，好意","es":"He always treats his colleagues with great courtesy.","cs":"他總是對待他的同事懷著極大的禮貌。","d":"The showing of politeness in one's attitude and behavior toward others."},{"id":1355,"l":4,"w":"crack","k":"kræ k","p":"vi.vt.n.","c":"( 使)爆裂， (使)破裂 ； 裂縫","es":"A tiny crack appeared in the windshield after the stone hit it.","cs":"石頭撞擊後，擋風玻璃上出現了一條微小的裂縫。","d":"A line on the surface of something along which it has broken but not separated; a sharp, loud sound."},{"id":1356,"l":4,"w":"craft","k":"kræ ft","p":"n.","c":"工藝，手藝；船；飛機；","es":"She specializes in beautiful handmade leather crafts.","cs":"她專門從事精美手工皮革工藝品。","d":"An activity involving skill in making things by hand; a boat or air vehicle."},{"id":1357,"l":4,"w":"cram","k":"kræ m","p":"vt.","c":"把…塞進 ； (為應考 )死記硬背；填鴨式地教","es":"He tried to cram a year's worth of information into one night.","cs":"他試圖將一整年的資訊塞入一個晚上。","d":"To pack or crowd (something) tightly into a space; to study intensively over a short period."},{"id":1358,"l":4,"w":"creation","k":"kr ɪˋeʃən","p":"n.","c":"創造；創作 ；創作品","es":"The sculpture is a remarkable creation by a local artist.","cs":"這座雕塑是當地藝術家一件了不起的創作。","d":"The action or process of bringing something into existence."},{"id":1359,"l":4,"w":"creativity","k":"kr ɪeˋtɪvətɪ","p":"n.","c":"創造力","es":"The school encourages students to express their creativity through art.","cs":"學校鼓勵學生透過藝術表達他們的創造力。","d":"The use of imagination or original ideas to create something."},{"id":1360,"l":4,"w":"cripple","k":"ˋkr ɪp!","p":"n.vt.","c":"跛子；殘廢的人 ；使…殘 廢","es":"The accident will unfortunately cripple him for life.","cs":"這場事故不幸將使他終生殘廢。","d":"A person disabled in a way that prevents normal movement; to cause severe and disabling damage to."},{"id":1361,"l":4,"w":"critic","k":"ˋkr ɪtɪk","p":"n.","c":"批評家，評論家","es":"A food critic wrote a scathing review of the new restaurant.","cs":"一位美食評論家對這家新餐廳寫了一篇嚴厲的評論。","d":"A person who judges the merits of literary or artistic works; a person who expresses disapproval."},{"id":1362,"l":4,"w":"critical","k":"ˋkr ɪtɪk!","p":"adj.","c":"緊要的，關鍵危急的；批評的；愛挑剔的","es":"The situation is critical; we must act immediately.","cs":"情況很危急；我們必須立即行動。","d":"Expressing adverse or disapproving comments or judgments; using careful judgment in analysis."},{"id":1363,"l":4,"w":"criticism","k":"ˋkr ɪtɪ͵sizəm","p":"n.","c":"批評；評論","es":"He was unable to handle the negative criticism of his work.","cs":"他無法應付對他工作的負面批評。","d":"The act of judging the merits and faults of something; the expression of disapproval."},{"id":1364,"l":4,"w":"criticize","k":"ˋkr ɪtɪ͵saɪz","p":"vt.vi.","c":"批評；批判","es":"It's unfair to criticize someone without understanding their perspective.","cs":"在不了解某人的觀點的情況下批評他們是不公平的。","d":"To indicate the faults of (someone or something) in a disapproving way."},{"id":1365,"l":4,"w":"cruelty","k":"ˋkru əltɪ","p":"n.","c":"殘酷，殘忍","es":"The documentary highlighted the cruelty of factory farming.","cs":"這部紀錄片強調了工廠化農業的殘酷。","d":"Callous indifference to or pleasure in causing pain and suffering."},{"id":1366,"l":4,"w":"crush","k":"kr ʌʃ","p":"n.vt.vi.","c":"壓碎，壓壞；碾碎 ；迷 戀","es":"I watched the machine crush the metal cans into flat pieces.","cs":"我看著機器將金屬罐壓碎成扁平的碎片。","d":"To deform, pulverize, or destroy by pressing; a large crowd; an intense infatuation."},{"id":1367,"l":4,"w":"cube","k":"kjub","p":"n.","c":"立方體；方塊；三次方","es":"The children built a tower using wooden cubes.","cs":"孩子們用木製立方體建造了一座塔。","d":"A symmetrical three-dimensional shape bounded by six equal squares; the third power of a number."},{"id":1368,"l":4,"w":"cucumb er","k":"ˋkjuk əmbɚ","p":"n.","c":"黃瓜，胡瓜","es":"I like to add fresh sliced cucumber to my salad.","cs":"我喜歡在我的沙拉中加入新鮮切片的黃瓜。","d":"A long, green-skinned fruit with watery flesh, eaten as a salad vegetable."},{"id":1369,"l":4,"w":"cue","k":"kju","p":"n.vt.","c":"【戲】提示；信號 ；給…暗示","es":"She waited for her director's cue before stepping onto the stage.","cs":"她在登上舞台之前等待著導演的提示。","d":"A signal for action; a long, tapering stick used to strike the ball in billiards."},{"id":1370,"l":4,"w":"cunning","k":"ˋk ʌnɪŋ","p":"adj.","c":"狡猾的，奸詐的","es":"The fox is a very cunning animal, known for its clever tricks.","cs":"狐狸是一種非常狡猾的動物，以其聰明的詭計而聞名。","d":"Having or showing skill in achieving one's ends by deceit or evasion; sly."},{"id":1371,"l":4,"w":"curiosity","k":"͵kj ʊrɪˋɑsətɪ","p":"n.","c":"好奇心","es":"Her intense curiosity led her to explore the abandoned house.","cs":"她強烈的好奇心促使她去探索那棟廢棄的房子。","d":"A strong desire to know or learn something."},{"id":1372,"l":4,"w":"curl","k":"k ɝl","p":"n.vt.vi.","c":"卷毛，卷髮；捲曲","es":"Her long, brown hair began to curl in the humidity.","cs":"她的棕色長髮在濕度中開始捲曲。","d":"To form into a curve or spiral shape."},{"id":1373,"l":4,"w":"curse","k":"k ɝs","p":"n.vt.vi.","c":"詛咒，咒罵","es":"The ancient tomb was said to be protected by a powerful curse.","cs":"據說這座古墓受到一個強大詛咒的保護。","d":"A solemn utterance intended to invoke a supernatural power to inflict harm or punishment."},{"id":1374,"l":4,"w":"curve","k":"k ɝv","p":"n.vi.","c":"曲線，弧線； 【棒】曲球；彎曲","es":"The race car sped around the sharp curve on the track.","cs":"賽車在賽道上的急彎處加速通過。","d":"A line or outline that is smoothly bending and has no straight parts."},{"id":1375,"l":4,"w":"cushion","k":"ˋk ʊʃən","p":"n.","c":"坐墊；靠墊；避震器","es":"She arranged the soft cushions neatly on the sofa.","cs":"她把柔軟的坐墊整齊地排列在沙發上。","d":"A bag of cloth stuffed with soft material, used for sitting or leaning on; to soften the effect of a blow."},{"id":1376,"l":4,"w":"damn","k":"dæ m","p":"vt.int.","c":"罵…該死，咒罵 ；該死","es":"I don't give a damn what he thinks about my choices.","cs":"我一點也不在乎他對我的選擇有何看法。","d":"Used to express anger or frustration; to condemn."},{"id":1377,"l":4,"w":"damp","k":"dæ mp","p":"adj.vt.vi.","c":"有濕氣的；潮濕的 ；使潮濕","es":"The basement air felt cold and slightly damp.","cs":"地下室的空氣感覺又冷又有點潮濕。","d":"Slightly wet."},{"id":1378,"l":4,"w":"deadline","k":"ˋd ɛd͵laɪn","p":"n.","c":"截止期限，最後限期","es":"The students were rushing to meet the essay submission deadline.","cs":"學生們正趕著在論文提交截止日期前完成。","d":"The latest time or date by which something must be completed."},{"id":1379,"l":4,"w":"declare","k":"d ɪˋklɛr","p":"vt.","c":"宣布，宣告；聲明 ；申報 (納稅品等 )","es":"The government is expected to declare a state of emergency soon.","cs":"預計政府將很快宣布進入緊急狀態。","d":"To say something in a solemn and formal manner; to announce."},{"id":1380,"l":4,"w":"decoration","k":"͵d ɛkəˋreʃən","p":"n.","c":"裝飾 ；裝飾品","es":"The simple decorations gave the room an elegant feel.","cs":"簡單的裝飾品給房間帶來一種優雅的感覺。","d":"The process or art of decorating or adorning something; an ornament."},{"id":1381,"l":4,"w":"decrease","k":"ˋdikris","p":"n.vt.vi.","c":"減；減少，減小 ；減；減少，減小","es":"The company must decrease its spending to improve profits.","cs":"公司必須減少開支以提高利潤。","d":"To make or become smaller or fewer in size, amount, intensity, or degree."},{"id":1382,"l":4,"w":"defeat","k":"d ɪˋfit","p":"vt.n.","c":"戰勝，擊敗；失敗，挫敗","es":"The small army was unable to defeat the invading forces.","cs":"這支小部隊無法擊敗入侵的軍隊。","d":"To win a victory over (someone) in a battle or competition."},{"id":1383,"l":4,"w":"defend","k":"d ɪˋfɛnd","p":"vt.","c":"防禦 ;保衛；為 …辯護；【體】防守","es":"The lawyer was hired to defend the innocent man in court.","cs":"這位律師被聘請在法庭上為這位無辜的男子辯護。","d":"To resist an attack made on (someone or something); to protect."},{"id":1384,"l":4,"w":"defense","k":"d ɪˋfɛns","p":"n.","c":"防禦，保衛；辯護； 【體】 防守","es":"The military prepared a strong defense against the attack.","cs":"軍方準備了強大的防禦來對抗這次襲擊。","d":"The action of resisting an attack; the case presented by or on behalf of the party being accused."},{"id":1385,"l":4,"w":"defensible","k":"d ɪˋfɛnsəb!","p":"adj.","c":"可防禦的；可辯護 的","es":"The position is easily defensible because of the narrow path.","cs":"由於道路狹窄，這個位置很容易防守。","d":"Able to be protected against attack; justifiable by argument."},{"id":1386,"l":4,"w":"defensive","k":"d ɪˋfɛnsɪv","p":"adj.","c":"防禦的；保護的；保 衛的","es":"He became defensive when asked about his failed project.","cs":"當被問及他失敗的專案時，他變得很防禦性。","d":"Used or intended to defend or protect."},{"id":1387,"l":4,"w":"definite","k":"ˋd ɛfənɪt","p":"adj.","c":"明確的，確切的","es":"We need a definite answer by tomorrow morning, yes or no.","cs":"我們需要在明天早上得到一個明確的答覆，是或否。","d":"Clearly stated or decided; not vague or doubtful."},{"id":1388,"l":4,"w":"delicate","k":"ˋd ɛləkət","p":"adj.","c":"易碎的；嬌貴的；精美 的","es":"You need to handle the antique vase with delicate care.","cs":"您需要用精緻的小心來處理這個古董花瓶。","d":"Very fine in texture or structure; easily broken or damaged."},{"id":1389,"l":4,"w":"delight","k":"d ɪˋlaɪt","p":"n.vt.","c":"欣喜 ；樂事 ；使…高興","es":"The news of her promotion filled her with great delight.","cs":"她升職的消息讓她充滿了巨大的喜悅。","d":"Great pleasure; to please someone greatly."},{"id":1390,"l":4,"w":"delightful","k":"d ɪˋlaɪtfəl","p":"adj.","c":"令人愉快的，令人高 興的","es":"We had a delightful time at the picnic in the park.","cs":"我們在公園的野餐度過了一段令人愉快的時光。","d":"Highly pleasing or enjoyable."},{"id":1391,"l":4,"w":"demand","k":"d ɪˋmænd","p":"n.vt.","c":"要求，請求","es":"There is a high demand for housing in the city center.","cs":"市中心對住房有很高的需求。","d":"An insistent and peremptory request; to require."},{"id":1392,"l":4,"w":"demonstrate","k":"ˋd ɛmən͵stret","p":"vt.vi.","c":"( 用實驗、實例 等)證明；示範；示威","es":"The salesperson will demonstrate how the new coffee machine works.","cs":"銷售人員將示範這台新咖啡機是如何運作的。","d":"To show or prove (something) clearly; to exhibit a product."},{"id":1393,"l":4,"w":"demonstration","k":"ˌdemənˈstreɪʃn","p":"n.","c":"( 用實驗， 實例等 ) 證明；示範；示威","es":"The teacher gave a demonstration of how the chemical reaction works.","cs":"老師示範了這個化學反應是如何運作的。","d":"An act of showing that something is true or how something works; or a public meeting to protest."},{"id":1394,"l":4,"w":"dense","k":"d ɛns","p":"adj.","c":"密集的，稠密的","es":"The forest was so dense that sunlight barely reached the ground.","cs":"森林如此濃密，以至於陽光幾乎無法到達地面。","d":"Closely packed together; thick; (of a person) stupid."},{"id":1395,"l":4,"w":"depart","k":"d ɪˋpɑrt","p":"vi.","c":"【書】起程，出發；離開， 離去","es":"Our train is scheduled to depart from platform 4 at noon.","cs":"我們的火車預定在中午從第四月台出發。","d":"To leave, especially in order to start a journey."},{"id":1396,"l":4,"w":"departure","k":"d ɪˋpɑrtʃɚ","p":"n.","c":"離開；出發，起程","es":"We arrived at the airport two hours before our scheduled departure.","cs":"我們在預定的出發時間前兩個小時到達機場。","d":"The action of leaving a place."},{"id":1397,"l":4,"w":"dependable","k":"d ɪˋpɛndəb!","p":"adj.","c":"可靠的；可信任的","es":"We need a dependable car that won't break down often.","cs":"我們需要一輛可靠的汽車，它不會經常拋錨。","d":"Trustworthy and reliable."},{"id":1398,"l":4,"w":"dependent","k":"d ɪˋpɛndənt","p":"adj.","c":"依靠 (賴)的；取決 於…的","es":"The island's economy is highly dependent on tourism.","cs":"這個島嶼的經濟高度依賴旅遊業。","d":"Contingent on or determined by; requiring someone or something else for financial or emotional support."},{"id":1399,"l":4,"w":"depress","k":"d ɪˋprɛs","p":"vt.","c":"使…沮喪，使 …消沉；使…蕭條","es":"The lack of sunlight in winter can sometimes depress people.","cs":"冬天缺乏陽光有時會讓人感到沮喪。","d":"To make (someone) feel utterly unhappy or despondent; to press down."},{"id":1400,"l":4,"w":"depression","k":"d ɪˋprɛʃən","p":"n.","c":"沮喪，消沉；不景氣， 蕭條","es":"She sought therapy to help manage her severe depression.","cs":"她尋求治療來幫助控制她嚴重的抑鬱症。","d":"Severe despondency and dejection; a long-term economic decline; a sunken place or area."},{"id":1401,"l":4,"w":"deserve","k":"d ɪˋzɝv","p":"vt.","c":"應受，該得","es":"After all his hard work, he certainly deserves a long vacation.","cs":"經過他所有的努力工作，他當然值得一個長假。","d":"To be worthy of (something, esp. a reward or punishment)."},{"id":1402,"l":4,"w":"desperate","k":"ˋd ɛspərɪt","p":"adj.","c":"情急拼命的；極度渴 望的","es":"The survivors were desperate for food and clean water.","cs":"倖存者絕望地需要食物和乾淨的水。","d":"Feeling or showing a hopeless sense that a situation is so bad as to be impossible to deal with."},{"id":1403,"l":4,"w":"despite","k":"d ɪˋspaɪt","p":"n.prep.","c":"惡意；怨恨；不管，儘管","es":"Despite the heavy rain, the outdoor concert went ahead as planned.","cs":"儘管下著大雨，戶外音樂會仍按計畫進行。","d":"Without being affected by; in spite of."},{"id":1404,"l":4,"w":"destruction","k":"d ɪˋstrʌkʃən","p":"n.","c":"破壞；毀滅","es":"The tornado caused widespread destruction across the entire town.","cs":"龍捲風在整個城鎮造成了廣泛的破壞。","d":"The action or process of causing so much damage to something that it no longer exists or cannot be repaired."},{"id":1405,"l":4,"w":"detective","k":"d ɪˋtɛktɪv","p":"n.adj.","c":"偵探；私家偵探；偵探的","es":"The private detective was hired to find the missing documents.","cs":"這位私人偵探受雇尋找失蹤的文件。","d":"A person, especially a police officer, whose occupation is to investigate and solve crimes."},{"id":1406,"l":4,"w":"determination","k":"d ɪ͵tɝməˋneʃən","p":"n.","c":"堅定； 果斷；決心","es":"Her determination to succeed helped her overcome every obstacle.","cs":"她成功的決心幫助她克服了每一個障礙。","d":"Firmness of purpose; the process of establishing something exactly."},{"id":1407,"l":4,"w":"device","k":"d ɪˋvaɪs","p":"n.","c":"設備，儀器，裝置","es":"A smartphone is a multi-functional electronic device.","cs":"智慧型手機是一種多功能的電子設備。","d":"A thing made or adapted for a particular purpose, especially a mechanical or electronic one."},{"id":1408,"l":4,"w":"devise","k":"d ɪˋvaɪz","p":"vt.","c":"設計；發明；策劃","es":"Scientists are working to devise a new method of energy storage.","cs":"科學家們正在努力設計一種新的能量儲存方法。","d":"To plan or invent (a complex procedure, system, or mechanism) by careful thought."},{"id":1409,"l":4,"w":"devote","k":"d ɪˋvot","p":"vt.","c":"將…奉獻 (給)","es":"He decided to devote his life to helping the homeless.","cs":"他決定將他的一生奉獻給幫助無家可歸者。","d":"To give all or a large part of one's time or resources to (a person, activity, or cause)."},{"id":1410,"l":4,"w":"diaper","k":"ˋda ɪəpɚ","p":"n.","c":"【美】尿布","es":"Parents should change the baby's diaper frequently.","cs":"父母應該經常更換嬰兒的尿布。","d":"A piece of material wrapped around a baby's bottom to absorb and contain urine and feces."},{"id":1411,"l":4,"w":"differ","k":"ˋd ɪfɚ","p":"vi.","c":"不同，相異","es":"Their political opinions differ greatly from one another.","cs":"他們的政治觀點彼此大不相同。","d":"To be unlike or distinct in nature, size, or form."},{"id":1412,"l":4,"w":"digest1","k":"da ɪˋdʒɛst","p":"vt.","c":"消化 (食物 )；領悟，融 會貫通","es":"It takes time for the human body to digest a large meal.","cs":"人體需要時間來消化一頓大餐。","d":"A collection or summary of literary, historical, or scientific matter."},{"id":1413,"l":4,"w":"digest2","k":"ˋda ɪdʒɛst","p":"n.","c":"摘要；文摘","es":"The book is a brief digest of current events.","cs":"這本書是當前事件的簡要摘要。","d":"To break down (food) in the alimentary canal so that it can be absorbed."},{"id":1414,"l":4,"w":"digestion","k":"d əˋdʒɛstʃən","p":"n.","c":"消化； (知識等的 ) 領悟","es":"Eating too quickly can impair your digestion.","cs":"吃得太快會損害您的消化功能。","d":"The process of breaking down food into substances that can be used by the body."},{"id":1415,"l":4,"w":"digital","k":"ˋd ɪdʒɪt!","p":"adj.n.","c":"數位的；數字的；數字顯示式電子表 (或鐘 )","es":"Most modern cameras are digital, storing images electronically.","cs":"大多數現代相機都是數位的，以電子方式儲存圖像。","d":"Involving or relating to the use of computer technology; expressed as numerical digits."},{"id":1416,"l":4,"w":"dignity","k":"ˋd ɪgnətɪ","p":"n.","c":"尊嚴；莊嚴","es":"She faced the difficult situation with grace and dignity.","cs":"她以優雅和尊嚴面對了這個困難的局面。","d":"The state or quality of being worthy of honor or respect."},{"id":1417,"l":4,"w":"diligence","k":"ˋd ɪlədʒəns","p":"n.","c":"勤勉，勤奮","es":"Her promotion was a reward for her hard work and diligence.","cs":"她的晉升是對她辛勤工作和勤奮的獎勵。","d":"Careful and persistent work or effort."},{"id":1418,"l":4,"w":"diploma","k":"d ɪˋplom ə","p":"n.","c":"畢業文憑，學位證書","es":"After graduation, she received her high school diploma.","cs":"畢業後，她收到了她的高中文憑。","d":"A certificate awarded by an educational establishment to show that someone has successfully completed a course of study."},{"id":1419,"l":4,"w":"diplomat","k":"ˋd ɪpləmæ t","p":"n.","c":"外交官","es":"The diplomat was successful in negotiating a peace treaty.","cs":"這位外交官成功地談判達成了一項和平條約。","d":"An official representing a country abroad."},{"id":1420,"l":4,"w":"disadvantage","k":"͵d ɪsədˋvænt ɪdʒ","p":"n.","c":"不利；損害","es":"The small company was at a disadvantage when competing with large corporations.","cs":"這家小公司在與大公司競爭時處於劣勢。","d":"An unfavorable circumstance or condition that reduces the chances of success or effectiveness."},{"id":1421,"l":4,"w":"disaster","k":"d ɪˋzæst ɚ","p":"n.","c":"災害，災難，不幸","es":"The flood was a major natural disaster for the region.","cs":"這次洪水是該地區的一場重大自然災害。","d":"A sudden event, such as an accident or natural catastrophe, that causes great damage or loss of life."},{"id":1422,"l":4,"w":"discipline","k":"ˋd ɪsəplɪn","p":"n.vt.","c":"紀律，風紀；教養；訓練，訓導","es":"The school places a strong emphasis on student discipline.","cs":"學校非常強調學生的紀律。","d":"The practice of training people to obey rules or a code of behavior; a field of study."},{"id":1423,"l":4,"w":"disconnect","k":"͵d ɪskəˋnɛkt","p":"vt.","c":"使分離，分開","es":"Please disconnect the printer from the wall socket before cleaning it.","cs":"清潔印表機之前，請將其從牆壁插座上斷開。","d":"To break the connection of (something) with something else."},{"id":1424,"l":4,"w":"discourage","k":"d ɪsˋkɝɪdʒ","p":"vt.","c":"使洩氣；勸阻","es":"His parents tried to discourage him from dropping out of school.","cs":"他的父母試圖勸阻他不要輟學。","d":"To cause (someone) to lose confidence or enthusiasm."},{"id":1425,"l":4,"w":"discouragement","k":"d ɪsˋkɝɪdʒmənt","p":"n.","c":"沮喪，氣 餒；使人洩氣的 事物","es":"Despite the initial discouragement, he continued to pursue his dream.","cs":"儘管最初感到氣餒，他仍繼續追逐他的夢想。","d":"The loss of confidence or enthusiasm; a hindrance."},{"id":1426,"l":4,"w":"disguise","k":"d ɪsˋgaɪz","p":"n.vt.","c":"假扮，偽裝","es":"The spy wore a clever disguise to enter the enemy headquarters.","cs":"間諜穿著巧妙的偽裝進入敵人總部。","d":"To give (someone or oneself) a different appearance in order to conceal one's identity."},{"id":1427,"l":4,"w":"disgust","k":"d ɪsˋgʌst","p":"n.vt.","c":"作嘔；厭惡 ；使作嘔","es":"The sight of the rotting food filled her with disgust.","cs":"腐爛食物的景象讓她充滿了厭惡。","d":"A feeling of revulsion or profound disapproval aroused by something unpleasant or offensive."},{"id":1428,"l":4,"w":"dismiss","k":"d ɪsˋmɪs","p":"vt.","c":"讓…離開；解散；不考 慮","es":"The boss decided to dismiss the employee for repeated lateness.","cs":"老闆決定解僱這名屢次遲到的員工。","d":"To order or allow to leave; to treat as unworthy of serious consideration."},{"id":1429,"l":4,"w":"disorder","k":"d ɪsˋɔrdɚ","p":"n.","c":"混亂，無秩序","es":"The room was in complete disorder after the party.","cs":"派對結束後，房間裡一片完全的混亂。","d":"A state of confusion; a disruption of physical or mental function."},{"id":1430,"l":4,"w":"dispute","k":"d ɪˋspjut","p":"n.vt.vi.","c":"爭論；爭執","es":"The two neighbors are involved in a bitter land dispute.","cs":"這兩位鄰居捲入了一場激烈的土地糾紛。","d":"A disagreement or argument; to argue about something."},{"id":1431,"l":4,"w":"distinct","k":"d ɪˋstɪŋkt","p":"adj.","c":"與其他不同的，有區別 的","es":"The north and south regions have two distinct dialects.","cs":"南北地區有兩種截然不同的方言。","d":"Clearly separate and different; recognizable as being different."},{"id":1432,"l":4,"w":"distinguish","k":"d ɪˋstɪŋgwɪʃ","p":"vt.vi.","c":"區別；識別","es":"It is important to distinguish between fact and opinion.","cs":"區分事實和意見是很重要的。","d":"To recognize or treat (someone or something) as different."},{"id":1433,"l":4,"w":"distinguished","k":"d ɪˋstɪŋgwɪʃt","p":"adj.","c":"卓越的；著名的","es":"The university is home to many distinguished scholars.","cs":"這所大學有許多傑出的學者。","d":"Successful, authoritative, and commanding respect."},{"id":1434,"l":4,"w":"distribute","k":"d ɪˋstrɪbjʊt","p":"vt.","c":"分發；分配","es":"The charity plans to distribute food and water to the flood victims.","cs":"該慈善機構計畫向洪水災民分發食物和水。","d":"To give shares of (something) to a number of recipients."},{"id":1435,"l":4,"w":"distribution","k":"͵d ɪstrəˋbjuʃən","p":"n.","c":"分發；配給物","es":"The company controls the entire distribution of its products.","cs":"該公司控制其產品的整個分銷過程。","d":"The action of sharing something out among a number of recipients."},{"id":1436,"l":4,"w":"district","k":"ˋd ɪstrɪkt","p":"n.","c":"區，行政區；地區，區域","es":"She lives in the financial district of the city.","cs":"她住在這個城市的金融區。","d":"An area of a country or city, especially one characterized by a particular feature."},{"id":1437,"l":4,"w":"disturb","k":"d ɪsˋtɝb","p":"vt.vi.","c":"妨礙，打擾","es":"Please do not disturb me while I am working on this report.","cs":"當我正在處理這份報告時，請不要打擾我。","d":"To interrupt the sleep, relaxation, or privacy of (someone)."},{"id":1438,"l":4,"w":"divine","k":"d əˋvaɪn","p":"adj.","c":"神的，神性的","es":"The priest spoke of the nature of divine love and mercy.","cs":"牧師談論了神聖的愛和仁慈的本質。","d":"Of, from, or like God or a god; excellent or delightful."},{"id":1439,"l":4,"w":"divorce","k":"d əˋvors","p":"n.vt.vi.","c":"離婚","es":"They decided to get a divorce after ten years of marriage.","cs":"他們決定在結婚十年後離婚。","d":"The legal dissolution of a marriage."},{"id":1440,"l":4,"w":"dominant","k":"ˋd ɑmənənt","p":"adj.","c":"佔優勢的，支配的","es":"The lion is the dominant male in the pride.","cs":"這隻獅子是獅群中佔優勢的雄性。","d":"Most important, powerful, or influential."},{"id":1441,"l":4,"w":"dominate","k":"ˋd ɑmə͵net","p":"vt.vi.","c":"支配，統治，控 制","es":"The large company continues to dominate the smartphone market.","cs":"這家大公司繼續主導智慧型手機市場。","d":"To have commanding influence over; to be the most important or conspicuous element."},{"id":1442,"l":4,"w":"dormitory","k":"ˋd ɔrmə͵torɪ","p":"n.","c":"學生宿舍 (dorm)","es":"Most first-year students live in the university dormitory.","cs":"大多數一年級學生住在大學宿舍。","d":"A large bedroom for a number of people in an institution; a college or university residential hall."},{"id":1443,"l":4,"w":"download","k":"ˋdaʊn͵lod","p":"vt.","c":"下載","es":"You can download the app for free from the company website.","cs":"您可以從公司網站免費下載這個應用程式。","d":"To copy (data) from one computer system to another, typically over the internet."},{"id":1444,"l":4,"w":"doze","k":"doz","p":"vi.n.","c":"打瞌睡，打盹","es":"The old man would often doze off in his armchair after lunch.","cs":"這位老人經常在午飯後在他的扶手椅上打瞌睡。","d":"To sleep lightly; to nap."},{"id":1445,"l":4,"w":"draft","k":"dræ ft","p":"n.","c":"草稿 ； 【美】徵兵 vt.起草；徵兵","es":"This is just the first draft of the novel; I still have much work to do.","cs":"這只是這部小說的初稿；我還有很多工作要做。","d":"A preliminary version of a piece of writing; a current of air."},{"id":1446,"l":4,"w":"dread","k":"dr ɛd","p":"vt.vi.n.","c":"懼怕；擔心 ；懼怕；擔心","es":"I dread having to give a presentation in front of the whole class.","cs":"我害怕必須在全班面前做簡報。","d":"To anticipate with great apprehension or fear."},{"id":1447,"l":4,"w":"drift","k":"dr ɪft","p":"vi.vt.n.","c":"漂，漂流","es":"The small boat began to drift out to sea after the engine failed.","cs":"引擎故障後，小船開始向海上漂流。","d":"To be carried slowly by air or water."},{"id":1448,"l":4,"w":"drill","k":"dr ɪl","p":"vt.vi.n.","c":"鑽(孔)；操練；訓練 ；鑽，鑽頭；鑽床 ；操練","es":"We need to use a power drill to make holes in this concrete wall.","cs":"我們需要使用電鑽在這面混凝土牆上鑽孔。","d":"A tool or machine with a rotating cutting point; a rehearsal of an activity."},{"id":1449,"l":4,"w":"durable","k":"ˋdj ʊrəb!","p":"adj.","c":"經久的，耐用的","es":"The suitcase is made of highly durable and scratch-resistant material.","cs":"這個行李箱由高度耐用且抗刮擦的材料製成。","d":"Able to withstand wear, pressure, or damage; hard-wearing."},{"id":1450,"l":4,"w":"dusty","k":"ˋd ʌstɪ","p":"adj.","c":"滿是灰塵的，灰塵覆蓋的","es":"The old books in the attic were very dusty.","cs":"閣樓上的舊書非常多灰塵的。","d":"Covered with or full of fine, dry powder."},{"id":1451,"l":4,"w":"dye","k":"da ɪ","p":"n.","c":"染料，染色 vt.vi. 染(色)","es":"She used a dark brown hair dye to change her hair color.","cs":"她使用深棕色頭髮染料來改變她的髮色。","d":"A natural or synthetic substance used to add color to materials."},{"id":1452,"l":4,"w":"dynamic","k":"da ɪˋnæm ɪk","p":"adj.","c":"力學的；有活力的","es":"He has a dynamic personality that makes him a great leader.","cs":"他有充滿活力的個性，使他成為一位偉大的領導者。","d":"Characterized by constant change, activity, or progress; energetic."},{"id":1453,"l":4,"w":"dynasty","k":"ˋda ɪnəstɪ","p":"n.","c":"王朝；朝代","es":"The Ming dynasty ruled China for over 300 years.","cs":"明朝統治中國超過 300 年。","d":"A line of hereditary rulers of a country."},{"id":1454,"l":4,"w":"e-mail/email","k":"ˋiˋmel","p":"n.","c":"【電腦】電子郵件 (electronic mail)","es":"Please send me your travel itinerary by e-mail.","cs":"請通過電子郵件將您的旅行行程發送給我。","d":"Messages distributed by electronic means from one computer user to one or more recipients."},{"id":1455,"l":4,"w":"earnest","k":"ˋ ɝnɪst","p":"adj.","c":"認真的；誠摯的 n.認真， 誠摯","es":"He was very earnest in his efforts to raise money for the charity.","cs":"他為慈善機構籌款的努力非常認真。","d":"Resulting from or showing sincere and intense conviction."},{"id":1456,"l":4,"w":"earphone","k":"ˋ ɪr͵fon","p":"n.","c":"耳機；聽筒","es":"I can't hear the music because one of my earphones is broken.","cs":"我聽不到音樂，因為我的一個耳機壞了。","d":"A small listening device that fits in or over the ear."},{"id":1457,"l":4,"w":"economic","k":"͵ik əˋnɑmɪk","p":"adj.","c":"經濟上的；合算的","es":"The country is facing a period of slow economic growth.","cs":"該國正面臨一段緩慢的經濟增長時期。","d":"Relating to economics or the economy; profitable."},{"id":1458,"l":4,"w":"economical","k":"͵ik əˋnɑmɪk!","p":"adj.","c":"經濟的，節約的","es":"Buying food in bulk is more economical than buying small packages.","cs":"批量購買食物比買小包裝更節省的。","d":"Giving good value or utility in relation to the money, time, or effort spent."},{"id":1459,"l":4,"w":"economics","k":"͵ik əˋnɑmɪks","p":"n.","c":"經濟學","es":"She chose to study economics to understand global markets.","cs":"她選擇學習經濟學以了解全球市場。","d":"The branch of knowledge concerned with the production, consumption, and transfer of wealth."},{"id":1460,"l":4,"w":"economist","k":"iˋk ɑnəmɪst","p":"n.","c":"經濟學者；節儉的 人","es":"The government hired a respected economist for advice.","cs":"政府聘請了一位受人尊敬的經濟學家提供建議。","d":"An expert in economics."},{"id":1461,"l":4,"w":"economy","k":"ɪˋkɑnəmɪ","p":"n.","c":"經濟 (情況 )；節約；經濟艙","es":"The nation's economy relies heavily on exports.","cs":"這個國家的經濟嚴重依賴出口。","d":"The state of a country or region in terms of the production and consumption of goods and services and the supply of money."},{"id":1462,"l":4,"w":"efficiency","k":"ɪˋfɪʃənsɪ","p":"n.","c":"效率；效能","es":"The company implemented new software to increase efficiency.","cs":"該公司實施了新軟體以提高效率。","d":"The state or quality of achieving maximum output with minimum effort or waste."},{"id":1463,"l":4,"w":"elastic","k":"ɪˋlæst ɪk","p":"adj.n.","c":"有彈性的，有彈力的；橡皮帶，鬆緊帶","es":"The waistband of the pants is made of stretchy elastic.","cs":"褲子的腰帶是由有彈性的橡皮筋製成的。","d":"Able to return to its original shape or size after being stretched or squeezed."},{"id":1464,"l":4,"w":"electrician","k":"ɪˌlekˈtrɪʃn","p":"n.","c":"電工","es":"We need to call an electrician to fix the faulty wiring in the kitchen.","cs":"我們需要叫電工來修理廚房裡故障的線路。","d":"A person whose job is to install or repair electrical equipment."},{"id":1465,"l":4,"w":"electronics","k":"ɪlɛkˋtrɑnɪks","p":"n.","c":"電子學","es":"He is studying electronics engineering at university.","cs":"他正在大學學習電子工程。","d":"The branch of physics and technology concerned with the design and use of circuits using transistors and microchips."},{"id":1466,"l":4,"w":"elegant","k":"ˋ ɛləgənt","p":"adj.","c":"雅緻的，優美的","es":"She wore a stunningly elegant long black dress.","cs":"她穿著一件驚人優雅的黑色長裙。","d":"Graceful and stylish in appearance or manner."},{"id":1467,"l":4,"w":"elementary","k":"͵ ɛləˋmɛntərɪ","p":"adj.","c":"基本的； 初級的， 基礎的","es":"She teaches elementary school students, aged six to ten.","cs":"她教初級（小學）學生，年齡從六歲到十歲。","d":"Relating to the most rudimentary elements of a subject; basic."},{"id":1468,"l":4,"w":"eliminate","k":"ɪˋlɪmə͵net","p":"vt.","c":"排除]；(比賽中 )淘汰","es":"The team was eliminated from the competition in the first round.","cs":"該團隊在第一輪比賽中被淘汰了。","d":"To completely remove or get rid of (something)."},{"id":1469,"l":4,"w":"elsewhere","k":"ˋ ɛls͵hw ɛr","p":"advt.","c":"在別處；往別處","es":"I couldn't find the necessary documents here, so I looked elsewhere.","cs":"我在這裡找不到必要的文件，所以我到別處去找了。","d":"In or to some other place."},{"id":1470,"l":4,"w":"embarrass","k":"ɪmˋbær əs","p":"vt.","c":"使窘；使不好意思","es":"His loud singing in public used to embarrass his teenage daughter.","cs":"他在公共場合大聲唱歌曾讓他的十幾歲女兒感到尷尬。","d":"To cause (someone) to feel awkward, self-conscious, or ashamed."},{"id":1471,"l":4,"w":"embarrassment","k":"ɪmˋbær əsmənt","p":"n.","c":"窘；難堪 ；使人為難的人 (或事 物)","es":"She blushed in embarrassment when she tripped on the stairs.","cs":"當她在樓梯上絆倒時，她因為尷尬而臉紅。","d":"A feeling of self-consciousness, shame, or awkwardness."},{"id":1472,"l":4,"w":"embassy","k":"ˋ ɛmbəsɪ","p":"n.","c":"(常大寫 )大使館","es":"If you lose your passport, you should contact your country's embassy.","cs":"如果您丟失了護照，您應該聯繫您國家的大使館。","d":"The official residence or offices of an ambassador in a foreign country."},{"id":1473,"l":4,"w":"emerge","k":"ɪˋmɝdʒ","p":"vi.","c":"浮現；出現","es":"A small bear began to emerge from the cave after the winter.","cs":"一隻小熊在冬天過後開始從洞穴中出現。","d":"To move out of or away from something and come into view."},{"id":1474,"l":4,"w":"emotional","k":"ɪˋmoʃən!","p":"adj.","c":"感情 (上)的；易動情 的","es":"He found it difficult to express his deep emotional feelings.","cs":"他發現很難表達他深層次的情感。","d":"Relating to a person's emotions; showing strong feelings."},{"id":1475,"l":4,"w":"emphasis","k":"ˋ ɛmfəsɪs","p":"n.","c":"強調，重視，重點","es":"The teacher put strong emphasis on the importance of revision.","cs":"老師非常強調複習的重要性。","d":"Special importance, value, or prominence given to something."},{"id":1476,"l":4,"w":"empire","k":"ˋ ɛmpaɪr","p":"n.","c":"帝國 ；大企業","es":"The Roman Empire lasted for over a thousand years.","cs":"羅馬帝國持續了一千多年。","d":"An extensive group of states or countries ruled over by a single monarch or sovereign state."},{"id":1477,"l":4,"w":"enclose","k":"ɪnˋkloz","p":"vt.","c":"圍住；圈起","es":"Please enclose a stamped, self-addressed envelope with your application.","cs":"請在您的申請中附上一個蓋好郵票、寫好自己地址的信封。","d":"To surround or close off (something) on all sides."},{"id":1478,"l":4,"w":"encounter","k":"ɪnˋkaʊntɚ","p":"n.vt.","c":"遭遇 (敵人 )；遇到 (危險等 )；意外地遇見 (朋友等 )","es":"I had a strange encounter with a celebrity at the airport.","cs":"我在機場與一位名人在偶遇。","d":"To unexpectedly meet (someone) or be confronted with (something)."},{"id":1479,"l":4,"w":"endanger","k":"ɪnˋdend ʒɚ","p":"vt.","c":"危及；使遭到危險","es":"Smoking can seriously endanger your health.","cs":"吸煙會嚴重危及您的健康。","d":"To put (someone or something) at risk or in peril."},{"id":1480,"l":4,"w":"endure","k":"ɪnˋdjʊr","p":"vt.","c":"忍耐，忍受；容忍","es":"The soldiers had to endure freezing temperatures for weeks.","cs":"士兵們必須忍受數週的冰凍溫度。","d":"To suffer (something painful or difficult) patiently; to remain in existence."},{"id":1481,"l":4,"w":"enforce","k":"ɪnˋfors","p":"vt.","c":"實施，執行","es":"It is difficult to enforce this new law without more police officers.","cs":"在沒有更多警察的情況下，很難實施這項新法律。","d":"To compel observance of or compliance with (a law, rule, or obligation)."},{"id":1482,"l":4,"w":"enforcement","k":"ɪnˋforsm ənt","p":"n.","c":"實施，執行；強 制","es":"The city needs stricter enforcement of recycling regulations.","cs":"城市需要更嚴格地執行回收規定。","d":"The act of compelling observance of or compliance with a law, rule, or obligation."},{"id":1483,"l":4,"w":"engineering","k":"͵ ɛndʒəˋnɪrɪŋ","p":"n.","c":"工程；工程學","es":"He is pursuing a degree in civil engineering.","cs":"他正在攻讀土木工程學位。","d":"The branch of science and technology concerned with the design, building, and use of engines, machines, and structures."},{"id":1484,"l":4,"w":"enlarge","k":"ɪnˋlɑrdʒ","p":"vt.","c":"放大；擴大；擴展","es":"The photographer used a machine to enlarge the picture.","cs":"攝影師使用一台機器來放大照片。","d":"To make something bigger."},{"id":1485,"l":4,"w":"enlargement","k":"ɪnˋlɑrdʒmənt","p":"n.","c":"放大；擴大；擴展","es":"The map is too small; we need a bigger enlargement.","cs":"地圖太小了；我們需要更大的放大圖。","d":"The action or process of making something larger."},{"id":1486,"l":4,"w":"enormous","k":"ɪˋnɔrməs","p":"adj.","c":"巨大的，龐大的","es":"The company spent an enormous amount of money on advertising.","cs":"這家公司在廣告上花費了巨大的金額。","d":"Extremely large."},{"id":1487,"l":4,"w":"entertain","k":"͵ ɛntɚˋten","p":"vt.","c":"娛樂；招待，款待","es":"The singer was hired to entertain the guests at the wedding.","cs":"這位歌手被聘請在婚禮上娛樂賓客。","d":"To provide (someone) with amusement or enjoyment."},{"id":1488,"l":4,"w":"entertainment","k":"͵ ɛntɚˋtenm ənt","p":"n.","c":"娛樂；餘興；演藝","es":"Movies and concerts are forms of popular entertainment.","cs":"電影和音樂會是流行的娛樂形式。","d":"The action of providing or being provided with amusement or enjoyment."},{"id":1489,"l":4,"w":"enthusiasm","k":"ɪnˋθjuz ɪ͵æzəm","p":"n.","c":"熱情，熱忱","es":"She showed great enthusiasm for her new role at work.","cs":"她對她的新工作展現出巨大的熱忱。","d":"Intense and eager enjoyment, interest, or approval."},{"id":1490,"l":4,"w":"envious","k":"ˋ ɛnvɪəs","p":"adj.","c":"嫉妒的；羨慕的","es":"He was envious of his brother's success and wealth.","cs":"他嫉妒他哥哥的成功和財富。","d":"Feeling or showing envy."},{"id":1491,"l":4,"w":"equality","k":"iˋkw ɑlətɪ","p":"n.","c":"相等；平等； 【數】等 式","es":"The movement advocates for complete gender equality in the workplace.","cs":"這項運動倡導在工作場所實現完全的性別平等。","d":"The state of being equal, especially in status, rights, or opportunities."},{"id":1492,"l":4,"w":"equip","k":"ɪˋkwɪp","p":"vt.","c":"裝備，配備","es":"The hospital needs to equip its operating rooms with new machines.","cs":"醫院需要為其手術室配備新機器。","d":"To supply with the necessary items for a particular purpose."},{"id":1493,"l":4,"w":"equipment","k":"ɪˋkwɪpmənt","p":"n.","c":"配備，裝備；設備；器械","es":"The gym has all the necessary equipment for weightlifting.","cs":"這家健身房擁有所有必要的舉重設備。","d":"The necessary items for a particular purpose."},{"id":1494,"l":4,"w":"era","k":"ˋ ɪrə","p":"n.","c":"時代；年代","es":"We are living in a digital era dominated by smartphones.","cs":"我們生活在一個由智慧型手機主導的數位時代。","d":"A long and distinct period of history."},{"id":1495,"l":4,"w":"errand","k":"ˋ ɛrənd","p":"n.","c":"差事，差使","es":"I need to run a quick errand to the post office.","cs":"我需要趕緊跑一趟郵局差事。","d":"A short journey undertaken in order to deliver or collect something."},{"id":1496,"l":4,"w":"escalator","k":"ˋ ɛskə͵letɚ","p":"n.","c":"電扶梯","es":"It's faster to take the escalator than the stairs to the fifth floor.","cs":"乘電扶梯比走樓梯到五樓更快。","d":"A moving staircase consisting of a continuously circulating belt of steps."},{"id":1497,"l":4,"w":"essay","k":"ˋ ɛse","p":"n.","c":"論說文；散文","es":"The students were asked to write a three-page essay on climate change.","cs":"學生們被要求寫一篇關於氣候變化的三頁文章。","d":"A short piece of writing on a particular subject."},{"id":1498,"l":4,"w":"essential","k":"ɪˋsɛnʃəl","p":"adj.","c":"必要的，不可缺的 ；本質的，基本的","es":"Water is essential for all forms of life on Earth.","cs":"水對於地球上所有生命形式來說都是不可或缺的。","d":"Absolutely necessary or important."},{"id":1499,"l":4,"w":"establish","k":"əˋstæbl ɪʃ","p":"vt.","c":"建立，設立；確定， 證實","es":"The organization was established in 1950 to promote peace.","cs":"該組織於 1950 年建立，旨在促進和平。","d":"To set up (an organization, system, or set of rules) on a firm or permanent basis."},{"id":1500,"l":4,"w":"establishment","k":"ɪsˋtæbl ɪʃmənt","p":"n.","c":"建立，設立 ；建立的機構，公司","es":"The restaurant is a highly-rated dining establishment.","cs":"這家餐廳是一家評價很高的餐飲機構。","d":"The action of establishing something; a business organization."},{"id":1501,"l":4,"w":"estimate","k":"ˋ ɛstə͵met","p":"vt.vi.n.","c":"估計，估量","es":"Can you give me an estimate of the repair costs?","cs":"您能給我一個維修費用的估計嗎？","d":"To roughly calculate or judge the value, number, or quantity of."},{"id":1502,"l":4,"w":"evaluate","k":"ɪˋvælj ʊ͵et","p":"vt.","c":"估…的價；對 …評價","es":"The professor needs to evaluate the students' final projects.","cs":"教授需要評估學生的最終專案。","d":"To form an idea of the amount, number, or value of; to assess."},{"id":1503,"l":4,"w":"evaluation","k":"ɪ͵væ ljʊˋeʃən","p":"n.","c":"估價，評價；估 算","es":"The annual performance evaluation determines raises and bonuses.","cs":"年度績效評估決定了加薪和獎金。","d":"The making of a judgment about the amount, number, or value of something; assessment."},{"id":1504,"l":4,"w":"eve","k":"iv","p":"n.","c":"(通常大寫 )(節日等的 )前夜，前夕","es":"We stayed up late on New Year's Eve to watch the fireworks.","cs":"我們在除夕夜熬夜觀看煙火。","d":"The day or evening before a religious or secular festival."},{"id":1505,"l":4,"w":"eventual","k":"ɪˋvɛntʃʊəl","p":"adj.","c":"最終發生的；最後的","es":"The eventual result of the hard work was a great success.","cs":"辛勤工作的最終結果是巨大的成功。","d":"Occurring at the end of a series of events or a period of time; ultimate."},{"id":1506,"l":4,"w":"evidence","k":"ˋ ɛvədəns","p":"n.","c":"證據；證詞；證人；物證","es":"The police found strong evidence linking the suspect to the crime.","cs":"警方找到了將嫌疑人與犯罪聯繫起來的有力證據。","d":"The available body of facts or information indicating whether a belief or proposition is true or valid."},{"id":1507,"l":4,"w":"evident","k":"ˋ ɛvədənt","p":"adj.","c":"明顯的；明白的","es":"It was evident from her expression that she was upset.","cs":"從她的表情可以明顯地看出她很心煩。","d":"Plain or obvious; clearly seen or understood."},{"id":1508,"l":4,"w":"exaggerate","k":"ɪgˋzæd ʒə͵ret","p":"vt.vi.","c":"誇張，誇大","es":"He tends to exaggerate the difficulties of his job.","cs":"他傾向於誇大他工作的困難。","d":"To represent (something) as being larger, better, or worse than it really is."},{"id":1509,"l":4,"w":"examinee","k":"ɪg͵zæm əˋni","p":"n.","c":"應試者；受檢查者","es":"The examinees waited nervously for their names to be called.","cs":"應試者緊張地等待著自己的名字被叫到。","d":"A person who is being tested in an examination."},{"id":1510,"l":4,"w":"examiner","k":"ɪgˋzæm ɪnɚ","p":"n.","c":"主考人；檢查人；審查員","es":"The driving examiner asked her to parallel park.","cs":"駕駛考官要求她進行路邊停車。","d":"A person who tests or assesses candidates in an examination."},{"id":1511,"l":4,"w":"exception","k":"ɪkˋsɛpʃən","p":"n.","c":"例外 ；除外，除去","es":"Everyone must attend the meeting, with no exceptions.","cs":"每個人都必須參加會議，無一例外。","d":"A person or thing that is excluded from a general statement or rule."},{"id":1512,"l":4,"w":"exhaust","k":"ɪgˋzɔst","p":"vt.n.","c":"耗盡；使精疲力盡 ；排出；排氣 (水)；排出的氣","es":"The long hike will certainly exhaust the beginner hikers.","cs":"這次長途徒步旅行肯定會使初學者筋疲力盡。","d":"To use up (resources or reserves) completely; to make (someone) very tired."},{"id":1513,"l":4,"w":"exhibit","k":"ɪgˋzɪbɪt","p":"n.vt.","c":"展示，陳列； (在法庭 ) 提出 (證據 ) ；展示品","es":"The museum plans to exhibit the newly discovered dinosaur fossil.","cs":"博物館計畫展出新發現的恐龍化石。","d":"To publicly display (a work of art or item of interest) in an art gallery or museum."},{"id":1514,"l":4,"w":"expand","k":"ɪkˋspænd","p":"vt.vi.","c":"展開，張開 (帆，翅 )；使膨脹","es":"The company plans to expand its business into the Asian market.","cs":"該公司計畫將業務擴展到亞洲市場。","d":"To make or become larger or more extensive."},{"id":1515,"l":4,"w":"expansion","k":"ɪkˋspæn ʃən","p":"n.","c":"擴展；擴張；膨脹","es":"The recent expansion of the airport included a new terminal.","cs":"機場最近的擴建包括一個新的航廈。","d":"The action of becoming larger or more extensive."},{"id":1516,"l":4,"w":"explanation","k":"͵ ɛkspləˋneʃən","p":"n.","c":"說明，解釋","es":"We need a clear explanation for why the schedule changed.","cs":"我們需要一個明確的解釋，說明為什麼時間表改變了。","d":"A statement or account that makes something clear."},{"id":1517,"l":4,"w":"explore","k":"ɪkˋsplo r","p":"vt.vi.","c":"探測；探勘；探索","es":"Scientists will explore the deep-sea trench for new marine life.","cs":"科學家將探索深海海溝尋找新的海洋生物。","d":"To travel in or through (an unfamiliar area) in order to learn about it."},{"id":1518,"l":4,"w":"explosion","k":"ɪkˋsplo ʒən","p":"n.","c":"爆發；爆炸；擴張， 劇增","es":"The sudden explosion from the factory shattered windows miles away.","cs":"工廠傳來的突然爆炸震碎了數英里外的窗戶。","d":"A sudden and violent outbreak; the action of exploding."},{"id":1519,"l":4,"w":"explosive","k":"ɪkˋsplos ɪv","p":"adj.n.","c":"爆炸 (性)的 ；爆炸物；炸藥","es":"Dynamite is a highly dangerous explosive material.","cs":"炸藥是一種高度危險的爆炸性物質。","d":"Able or likely to shatter violently or burst apart; a substance that causes an explosion."},{"id":1520,"l":4,"w":"expose","k":"ɪkˋspoz","p":"vt.","c":"使暴露於；使接觸到；揭 發","es":"The journalist threatened to expose the politician's corruption.","cs":"這名記者威脅要揭露這位政治家的腐敗。","d":"To make (something) visible by uncovering it; to subject to danger or risk."},{"id":1521,"l":4,"w":"exposure","k":"ɪkˋspo ʒɚ","p":"n.","c":"暴露；暴曬 ；揭發","es":"Too much sun exposure can lead to skin damage.","cs":"過度的陽光曝曬會導致皮膚損傷。","d":"The state of being exposed to contact with something; the public presentation of something."},{"id":1522,"l":4,"w":"extend","k":"ɪkˋstɛnd","p":"vt.vi.","c":"延長，延伸；擴大， 擴展","es":"We decided to extend our vacation by two extra days.","cs":"我們決定將我們的假期延長兩天。","d":"To stretch out or spread forth; to make (something) longer."},{"id":1523,"l":4,"w":"extent","k":"ɪkˋstɛnt","p":"n.","c":"廣度，寬度；程度；限度；範圍","es":"The extent of the damage from the fire was not yet known.","cs":"火災造成的損害程度尚不清楚。","d":"The degree or range over which something extends; the scope of something."},{"id":1524,"l":4,"w":"facial","k":"ˋfe ʃəl","p":"adj.n.","c":"臉的；面 部的；臉部按摩","es":"She booked a relaxing facial treatment at the spa.","cs":"她在水療中心預訂了一次放鬆的臉部護理。","d":"Of or relating to the face."},{"id":1525,"l":4,"w":"facility","k":"f əˋsɪlətɪ","p":"n.","c":"能力，技能 ；設備， 設施","es":"The new gym boasts excellent sports facilities.","cs":"新健身房擁有優良的體育設施。","d":"A place, amenity, or piece of equipment provided for a particular purpose; ease or capability."},{"id":1526,"l":4,"w":"faithful","k":"ˋfeθf əl","p":"adj.","c":"忠實的；忠誠的","es":"The dog was incredibly faithful to its owner until the end.","cs":"這隻狗對牠的主人直到最後都非常忠實。","d":"Loyal, constant, and steadfast; accurate or true in detail."},{"id":1527,"l":4,"w":"fame","k":"fem","p":"n.","c":"聲譽，名望","es":"The singer achieved international fame at a very young age.","cs":"這位歌手在非常年輕的時候就取得了國際名聲。","d":"The state of being widely known or recognized."},{"id":1528,"l":4,"w":"fantastic","k":"fænˋtæst ɪk","p":"adj.","c":"【口】極好的，了不 起的；難以置信的，驚人的","es":"We had a fantastic time hiking in the mountains.","cs":"我們在山裡遠足度過了一段極好的時光。","d":"Extraordinarily good or attractive; based on fantasy."},{"id":1529,"l":4,"w":"fantasy","k":"ˋfænt əsɪ","p":"n.","c":"空想；幻想；夢想；空想的產物","es":"The book is a beautiful fantasy story about dragons and magic.","cs":"這本書是一個關於龍和魔法的美麗幻想故事。","d":"The faculty or activity of imagining impossible or improbable things."},{"id":1530,"l":4,"w":"farewell","k":"ˋf ɛrˋwɛl","p":"int.n.a.","c":"再會！別了 ! ；告別 ；告別的","es":"The company threw a large farewell party for the retiring CEO.","cs":"公司為即將退休的執行長舉辦了一場盛大的告別派對。","d":"An expression of good wishes when someone is leaving."},{"id":1531,"l":4,"w":"fatal","k":"ˋfet!","p":"adj.","c":"命運的；致命的，生 死攸關的","es":"The car crash resulted in two fatal injuries.","cs":"這場車禍造成了兩起致命的傷亡。","d":"Causing death."},{"id":1532,"l":4,"w":"favorable","k":"ˋfev ərəb!","p":"adj.","c":"贊同的；有利的，適 合的","es":"We received a favorable response to our proposal from the clients.","cs":"我們收到了客戶對我們提案的有利的回應。","d":"Expressing approval; to the advantage of someone or something."},{"id":1533,"l":4,"w":"feast","k":"fist","p":"n.","c":"盛宴，筵席","es":"The whole village gathered for a huge harvest feast.","cs":"整個村莊聚集在一起舉行盛大的豐收宴會。","d":"A large meal, typically one in celebration; an annual religious festival."},{"id":1534,"l":4,"w":"ferry","k":"ˋf ɛrɪ","p":"n.","c":"渡輪","es":"We took a ferry across the bay to visit the small island.","cs":"我們乘渡輪穿過海灣去參觀那個小島。","d":"A boat or ship for conveying passengers and goods, especially as a regular service."},{"id":1535,"l":4,"w":"fertile","k":"ˋf ɝt!","p":"adj.","c":"(動植物 )多產的； (土地 )肥沃 的","es":"The fertile soil is perfect for growing grapes.","cs":"這片肥沃的土壤非常適合種植葡萄。","d":"(Of land or soil) capable of producing abundant vegetation or crops; (of a person or animal) able to conceive."},{"id":1536,"l":4,"w":"fetch","k":"f ɛtʃ","p":"vt.","c":"去拿 …；(去)拿來","es":"Please fetch the newspaper from the mailbox for me.","cs":"請幫我從信箱裡取報紙。","d":"To go for and then bring back (someone or something)."},{"id":1537,"l":4,"w":"fiction","k":"ˋf ɪkʃən","p":"n.","c":"(總稱 )小說 ；虛構，想 像","es":"I prefer reading non-fiction books, such as history and science.","cs":"我更喜歡閱讀非小說類書籍，例如歷史和科學。","d":"Literature that describes imaginary events and people."},{"id":1538,"l":4,"w":"fierce","k":"f ɪrs","p":"adj.","c":"兇猛的；殘酷的；猛烈的，激 烈的","es":"The army met fierce resistance from the defending forces.","cs":"該軍隊遭到了防禦部隊猛烈的抵抗。","d":"Having or displaying an intense or ferocious aggressiveness."},{"id":1539,"l":4,"w":"finance","k":"fa ɪˋnæns","p":"n.","c":"財政；金融；財政學","es":"She is studying corporate finance at business school.","cs":"她正在商學院學習企業財務。","d":"The management of
