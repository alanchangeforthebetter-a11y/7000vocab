between working on the report and the presentation.","cs":"我們將交替進行報告和簡報的準備工作。","d":"Occurring or succeeding by turns; a person who acts as a substitute."},{"id":2224,"l":5,"w":"altitude","k":"`æ lt ə͵tjud","p":"n.","c":"海拔","es":"Mountain climbers often experience breathlessness at high altitudes.","cs":"登山者在高海拔地區經常會感到呼吸困難。","d":"The height of an object or point in relation to sea level or ground level."},{"id":2225,"l":5,"w":"ample","k":"`æ mp!","p":"adj.","c":"足夠的","es":"There is ample evidence to support the scientist's theory.","cs":"有充足的證據支持這位科學家的理論。","d":"Enough or more than enough; plentiful."},{"id":2226,"l":5,"w":"anchor","k":"`æŋk ɚ","p":"n.","c":"錨","es":"The ship dropped anchor near the quiet bay.","cs":"這艘船在安靜的海灣附近拋下了錨。","d":"A heavy object attached to a rope or chain, used to moor a vessel to the sea bottom."},{"id":2227,"l":5,"w":"anthem","k":"ˋænθ əm","p":"n.","c":"讚美詩；聖歌；國歌","es":"The crowd stood up for the national anthem before the game.","cs":"賽前，群眾為國歌起立。","d":"A rousing or uplifting song identified with a particular group, body, or nation."},{"id":2228,"l":5,"w":"antique","k":"æ n`tik","p":"n.","c":"骨董","es":"She collects beautiful French antiques from the 18th century.","cs":"她收藏美麗的 18 世紀法國古董。","d":"A collectible object that has high value because of its considerable age and quality."},{"id":2229,"l":5,"w":"applaud","k":"ə`plɔd","p":"vt.vi.","c":"鼓掌","es":"The audience began to applaud enthusiastically after the performance.","cs":"演出結束後，觀眾開始熱烈鼓掌。","d":"To show approval or praise by clapping the hands."},{"id":2230,"l":5,"w":"applause","k":"ə`plɔz","p":"n.","c":"掌聲","es":"The speaker bowed to the loud applause from the crowd.","cs":"演講者向群眾熱烈的掌聲鞠躬。","d":"Approval or praise expressed by clapping."},{"id":2231,"l":5,"w":"apt","k":"æ pt","p":"adj.","c":"有…傾向的；聰明的","es":"His comments were very apt and summarized the problem perfectly.","cs":"他的評論非常恰當，完美地總結了問題。","d":"Appropriate or suitable in the circumstances; having a tendency to do something."},{"id":2232,"l":5,"w":"architect","k":"` ɑrkə͵tɛkt","p":"n.","c":"建築師","es":"The famous architect designed the city's new museum.","cs":"這位著名建築師設計了這座城市的新博物館。","d":"A person who designs buildings and often supervises their construction."},{"id":2233,"l":5,"w":"architecture","k":"`ɑrkəˌtɛktʃɚ","p":"n.","c":"建築","es":"The city is famous for its stunning modern architecture.","cs":"這座城市以其令人驚嘆的現代建築風格而聞名。","d":"The art or practice of designing and constructing buildings."},{"id":2234,"l":5,"w":"arena","k":"ə`rinə","p":"n.","c":"競技場","es":"The pop concert was held in the city's largest sports arena.","cs":"這場流行音樂會是在該市最大的體育場地舉行的。","d":"A level area surrounded by seating, in which sports, entertainments, and other public events are held."},{"id":2235,"l":5,"w":"armor","k":"` ɑrmɚ","p":"n.","c":"盔甲","es":"The knight wore heavy metal armor for protection in battle.","cs":"這位騎士穿著沉重的金屬盔甲在戰鬥中保護自己。","d":"The metal coverings formerly worn by soldiers or warriors to protect the body in battle."},{"id":2236,"l":5,"w":"ascend","k":"ə`sɛnd","p":"vt.vi.","c":"上升","es":"The climber began to ascend the sheer rock face.","cs":"攀登者開始攀登陡峭的岩壁。","d":"To go up or climb."},{"id":2237,"l":5,"w":"ass","k":"æ s","p":"n.","c":"驢子；笨蛋；屁股","es":"He slipped and fell flat on his ass.","cs":"他滑倒了，一屁股跌坐在地上。","d":"A hoofed mammal of the horse family; a foolish or stupid person."},{"id":2238,"l":5,"w":"assault","k":"ə`sɔlt","p":"vt.n.","c":"攻擊 vi.動武","es":"The security guard suffered a violent physical assault.","cs":"這位保安遭受了一次暴力的身體襲擊。","d":"To make a physical attack on; a physical attack."},{"id":2239,"l":5,"w":"asset","k":"`æ s ɛt","p":"n.","c":"資產","es":"Fluency in two languages is a valuable asset in this job.","cs":"精通兩種語言在這份工作中是一項寶貴的資產。","d":"A useful or valuable thing, person, or quality."},{"id":2240,"l":5,"w":"astonish","k":"ə`stɑnɪʃ","p":"vt.","c":"震驚","es":"The news of her sudden resignation is going to astonish everyone.","cs":"她突然辭職的消息將會使所有人感到驚訝。","d":"To surprise or impress someone greatly."},{"id":2241,"l":5,"w":"astonishment","k":"ə`stɑnɪʃmənt","p":"n.","c":"震驚","es":"To my astonishment, she won the major lottery prize.","cs":"令我驚訝的是，她贏得了大樂透獎。","d":"Great surprise or amazement."},{"id":2242,"l":5,"w":"astray","k":"ə`stre","p":"advt.","c":"迷路地","es":"The dog went astray after running out of the yard.","cs":"這隻狗跑出院子後迷路了。","d":"Away from the correct path or direction."},{"id":2243,"l":5,"w":"astronaut","k":"`æ str ə͵nɔt","p":"n.","c":"太空人","es":"The astronaut spent six months aboard the space station.","cs":"這位太空人在太空站上待了六個月。","d":"A person who is trained to travel in a spacecraft."},{"id":2244,"l":5,"w":"astronomer","k":"ə`strɑnəmɚ","p":"n.","c":"天文學家","es":"The astronomer discovered a new comet in the night sky.","cs":"這位天文學家在夜空中發現了一顆新彗星。","d":"An expert in or student of astronomy."},{"id":2245,"l":5,"w":"astronomy","k":"əs`trɑnəmɪ","p":"n.","c":"天文學","es":"She chose to major in astronomy at college.","cs":"她選擇在大學主修天文學。","d":"The branch of science that deals with celestial objects, space, and the physical universe as a whole."},{"id":2246,"l":5,"w":"attendance","k":"ə`tɛndəns","p":"n.","c":"出席","es":"The conference had a record high attendance this year.","cs":"今年的會議出席人數創下歷史新高。","d":"The action or state of going regularly to or being present at a place or event."},{"id":2247,"l":5,"w":"attendant","k":"ə`tɛndənt","p":"n.","c":"服務員","es":"A flight attendant showed me where to put my luggage.","cs":"一位空服員指示我把行李放在哪裡。","d":"A person employed to provide a service to the public in a particular place."},{"id":2248,"l":5,"w":"auditorium","k":"͵ ɔdə`torɪəm","p":"n.","c":"禮堂","es":"The school play will be performed in the main auditorium.","cs":"學校的戲劇將在主禮堂演出。","d":"The part of a theater, concert hall, or other public building in which the audience sits."},{"id":2249,"l":5,"w":"auxiliary","k":"ɔg`zɪljərɪ","p":"adj.n.","c":"輔助的；輔助者；助手；助動詞","es":"We installed an auxiliary power unit in case of an outage.","cs":"我們安裝了一個輔助的電源裝置以防停電。","d":"Providing supplementary or additional help and support; a person or thing providing such support."},{"id":2250,"l":5,"w":"awe","k":"ɔ","p":"n.vt.","c":"敬畏；使...敬畏","es":"The vastness of the Grand Canyon filled the tourists with awe.","cs":"大峽谷的浩瀚讓遊客充滿了敬畏。","d":"A feeling of reverential respect mixed with fear or wonder; to inspire such a feeling."},{"id":2251,"l":5,"w":"awhile","k":"ə`hwa ɪl","p":"advt.","c":"片刻","es":"Please wait awhile; the doctor will see you shortly.","cs":"請等一下；醫生很快就會見您。","d":"For a short time."},{"id":2252,"l":5,"w":"bachelor","k":"`bæ t ʃəlɚ","p":"n.","c":"單身漢","es":"After college, he earned a bachelor's degree in Engineering.","cs":"大學畢業後，他獲得了工程學的學士學位。","d":"A man who is not and has never been married."},{"id":2253,"l":5,"w":"backbone","k":"`bæk͵bon","p":"n.","c":"脊椎","es":"The project manager is the backbone of the entire team.","cs":"專案經理是整個團隊的中堅力量。","d":"The series of vertebrae extending from the skull to the pelvis; the spine or strength of character."},{"id":2254,"l":5,"w":"badge","k":"bæ d ʒ","p":"n.","c":"徽章","es":"All employees must wear their identification badge at all times.","cs":"所有員工必須隨時佩戴他們的識別徽章。","d":"A small patch, tile, or emblem worn to signify membership, employment, or honor."},{"id":2255,"l":5,"w":"ballot","k":"`bæ l ət","p":"n.","c":"選票","es":"The names of all candidates were listed on the ballot.","cs":"所有候選人的名字都列在選票上。","d":"A system of voting, usually in secret; a paper sheet used to cast a vote."},{"id":2256,"l":5,"w":"ban","k":"bæ n","p":"n.vt.","c":"禁止","es":"The city decided to place a ban on smoking in public parks.","cs":"市政府決定禁止在公共公園吸菸。","d":"To officially or legally prohibit something."},{"id":2257,"l":5,"w":"bandit","k":"`bæ nd ɪt","p":"n.","c":"土匪","es":"The traveler was robbed by a masked bandit on the mountain road.","cs":"這位旅客在山路上被一個蒙面強盜搶劫了。","d":"A robber or outlaw, especially one operating in a wild or remote area."},{"id":2258,"l":5,"w":"banner","k":"`bæ n ɚ","p":"n.","c":"旗幟","es":"Supporters held up a large banner with the team's logo.","cs":"支持者高舉著印有隊伍標誌的巨大橫幅。","d":"A long strip of cloth bearing a slogan or design, displayed publicly."},{"id":2259,"l":5,"w":"banquet","k":"`bæŋkw ɪt","p":"n.","c":"宴會","es":"A grand banquet was held to celebrate the company's anniversary.","cs":"舉辦了一場盛大的宴會來慶祝公司週年紀念。","d":"A formal elaborate dinner for many people in honor of a person or event."},{"id":2260,"l":5,"w":"barbarian","k":"b ɑr`bɛrɪən","p":"n.adj.","c":"野蠻人；野蠻人 的","es":"Historians refer to the invading tribes as barbarians.","cs":"歷史學家將入侵的部落稱為野蠻人。","d":"An uncivilized, wild, or uncultured person; primitive."},{"id":2261,"l":5,"w":"barbershop","k":"`b ɑrbɚ͵ʃɑp","p":"n.","c":"(男)理髮廳","es":"He goes to the local barbershop for a trim every month.","cs":"他每個月都去當地的理髮店修剪頭髮。","d":"A shop where a barber cuts hair and shaves beards."},{"id":2262,"l":5,"w":"barefoot","k":"`b ɛr͵fʊt","p":"adj.","c":"赤腳的","es":"The children ran barefoot across the sandy beach.","cs":"孩子們赤著腳跑過沙灘。","d":"Wearing nothing on the feet."},{"id":2263,"l":5,"w":"barren","k":"`bæ r ən","p":"adj.","c":"貧瘠的；不孕的","es":"The desert landscape was mostly barren and lifeless.","cs":"這片沙漠景觀大多是貧瘠且了無生氣的。","d":"Too poor to produce vegetation; unable to bear children."},{"id":2264,"l":5,"w":"bass","k":"bes","p":"n.","c":"低音樂器；男低音；鱸魚","es":"The song has a very deep and powerful bass line.","cs":"這首歌有一個非常深沉且強勁的低音線。","d":"Low in pitch; the lowest adult male singing voice; a type of edible fish."},{"id":2265,"l":5,"w":"batch","k":"bæ t ʃ","p":"n.","c":"一批","es":"She baked a fresh batch of cookies this morning.","cs":"她今天早上烤了一批新鮮的餅乾。","d":"A quantity of goods produced at one time or treated as a group."},{"id":2266,"l":5,"w":"batter","k":"`bæ t ɚ","p":"vt.vi.","c":"猛擊","es":"The old lighthouse was heavily battered by the storm waves.","cs":"那座舊燈塔被暴風雨的海浪猛烈地衝擊。","d":"To strike repeatedly with hard blows."},{"id":2267,"l":5,"w":"bazaar","k":"b ə`zɑr","p":"n.","c":"市場","es":"We bought some handmade crafts at the charity bazaar.","cs":"我們在慈善義賣會上買了一些手工藝品。","d":"A market in a Middle Eastern country; a fundraising sale of goods."},{"id":2268,"l":5,"w":"beautify","k":"`bjut ə͵faɪ","p":"vt.vi.","c":"美化","es":"Volunteers helped to beautify the park with new flowers.","cs":"志工們幫忙用新的花卉美化公園。","d":"To make or become beautiful."},{"id":2269,"l":5,"w":"beforehand","k":"b ɪ`for͵hænd","p":"advt.","c":"預先地","es":"You should call the restaurant to reserve a table beforehand.","cs":"你應該事先打電話給餐廳預訂一張桌子。","d":"Before an action or event takes place; in advance."},{"id":2270,"l":5,"w":"behalf","k":"b ɪ`hæ f","p":"n.","c":"代表","es":"On behalf of the team, I would like to thank you for your support.","cs":"我謹代表團隊，感謝您的支持。","d":"In the interest of or as a representative of a person or group."},{"id":2271,"l":5,"w":"belongings","k":"b ə`lɔŋɪŋz","p":"n.","c":"財產","es":"Travelers must keep a close watch on their personal belongings.","cs":"旅客必須密切留意他們的個人隨身物品。","d":"A person's movable possessions and personal effects."},{"id":2272,"l":5,"w":"beloved","k":"b ɪ`lʌvɪd","p":"adj.","c":"心愛的","es":"She returned to her beloved hometown after many years away.","cs":"她在離家多年後回到了她摯愛的家鄉。","d":"Dearly loved; a much-loved person."},{"id":2273,"l":5,"w":"beneficial","k":"͵b ɛnə`fɪʃəl","p":"adj.","c":"有益 (利)的","es":"Regular exercise is highly beneficial to your overall health.","cs":"規律運動對您的整體健康非常有益。","d":"Resulting in good; favorable or advantageous."},{"id":2274,"l":5,"w":"beware","k":"b ɪ`wɛr","p":"vt.","c":"當心","es":"Beware of the dog; it can be very protective of the property.","cs":"當心這隻狗；牠可能會非常保護這個財產。","d":"To be cautious and alert to potential danger."},{"id":2275,"l":5,"w":"bid","k":"b ɪd","p":"vt.n.","c":"命令；吩咐；向 …表示；出價；出價；努力","es":"An anonymous collector made the highest bid for the painting.","cs":"一位匿名收藏家為這幅畫提出了最高出價。","d":"To offer a certain price for something; an attempt to achieve something."},{"id":2276,"l":5,"w":"blacksmith","k":"`blæk͵sm ɪθ","p":"n.","c":"鐵匠","es":"The village blacksmith was busy shaping metal tools.","cs":"村裡的鐵匠正忙著打造金屬工具。","d":"A person who makes and repairs iron objects by hand."},{"id":2277,"l":5,"w":"blast","k":"blæ st","p":"n.v.","c":"強風；爆炸；爆炸","es":"The construction crew used a controlled blast to demolish the old building.","cs":"施工隊使用了受控爆破來拆除舊建築物。","d":"A destructive wave of air from an explosion; a strong gust of wind."},{"id":2278,"l":5,"w":"blaze","k":"blez","p":"n.v.","c":"火焰；燃燒","es":"Firefighters quickly brought the forest blaze under control.","cs":"消防員迅速控制了森林大火。","d":"A large, fierce, or bright fire."},{"id":2279,"l":5,"w":"bleach","k":"blit ʃ","p":"vt.vi.n.","c":"漂白 (劑)","es":"She used bleach to remove the stubborn stains from the white shirt.","cs":"她使用漂白劑去除白襯衫上頑固的污漬。","d":"A chemical used to whiten materials; to make white or pale."},{"id":2280,"l":5,"w":"blizzard","k":"`bl ɪzɚd","p":"n.","c":"暴風雪","es":"A sudden blizzard trapped many drivers on the highway.","cs":"一場突如其來的暴風雪將許多駕駛困在高速公路上。","d":"A severe snowstorm with high winds and low visibility."},{"id":2281,"l":5,"w":"blond/blonde","k":"bl ɑnd","p":"adj.n.","c":"金髮的；金髮人","es":"The little girl has curly blond hair and blue eyes.","cs":"這個小女孩有捲曲的金色的頭髮和藍色的眼睛。","d":"Having pale yellow or gold hair."},{"id":2282,"l":5,"w":"blot","k":"bl ɑt","p":"n.","c":"汙漬 (同stain )","es":"She used a napkin to gently soak up the ink blot on the paper.","cs":"她用一張餐巾紙輕輕地吸去紙上的墨水污點。","d":"A spot or stain made by ink or another substance."},{"id":2283,"l":5,"w":"blues","k":"bluz","p":"n.","c":"憂鬱","es":"The musician played a slow, soulful melody in the style of the blues.","cs":"這位音樂家用藍調的風格演奏了一段緩慢、深情的旋律。","d":"A state of sadness or depression; a genre of music."},{"id":2284,"l":5,"w":"blur","k":"bl ɝ","p":"n.v.","c":"模糊 ；使…模糊","es":"The photo was just a blur because the camera moved.","cs":"由於相機移動，這張照片只是一團模糊。","d":"A shape that cannot be seen clearly; to make or become unclear."},{"id":2285,"l":5,"w":"bodily","k":"`b ɑdɪlɪ","p":"adj.","c":"身體的","es":"He suffered severe bodily injury in the car crash.","cs":"他在車禍中遭受了嚴重的身體傷害。","d":"Relating to the human body."},{"id":2286,"l":5,"w":"bodyguard","k":"`b ɑdɪ͵gɑrd","p":"n.","c":"保鑣","es":"A famous actor rarely travels without his personal bodyguard.","cs":"一位著名演員旅行時很少沒有他的私人保鏢。","d":"A person or group employed to protect someone."},{"id":2287,"l":5,"w":"bog","k":"b ɑg","p":"n.v.","c":"沼澤；(使) 陷入泥淖","es":"The explorers had to wade slowly through the thick forest bog.","cs":"探險者必須緩慢地涉過茂密森林中的沼澤。","d":"An area of wet, muddy ground; to become stuck."},{"id":2288,"l":5,"w":"bolt","k":"bolt","p":"n.v.","c":"門閂；閃電 ;閂住","es":"A sudden flash of lightning, a thunder bolt, lit up the night sky.","cs":"一道突然的閃光，一個雷電，照亮了夜空。","d":"A sliding bar used to fasten a door; a flash of lightning; to fasten."},{"id":2289,"l":5,"w":"bonus","k":"`bon əs","p":"n.","c":"紅利","es":"All employees received a year-end bonus for their hard work.","cs":"所有員工都因他們的辛勤工作而收到了年終獎金。","d":"An extra sum of money given as a reward or incentive."},{"id":2290,"l":5,"w":"boom","k":"bum","p":"n.vi.vt.","c":"(發出 )隆隆聲； (使)興旺","es":"The tech industry is currently experiencing an economic boom.","cs":"科技產業目前正在經歷一場經濟繁榮。","d":"A loud, deep sound; a period of rapid economic growth."},{"id":2291,"l":5,"w":"booth","k":"buθ","p":"n.","c":"小亭","es":"We reserved a quiet corner booth at the restaurant.","cs":"我們在餐廳預訂了一個安靜的角落雅座。","d":"A small enclosed structure, stall, or seating area."},{"id":2292,"l":5,"w":"boredom","k":"`bord əm","p":"n.","c":"無聊","es":"To relieve the boredom of the journey, she read a book.","cs":"為了減輕旅途的無聊，她讀了一本書。","d":"The state of feeling weary and restless through lack of interest."},{"id":2293,"l":5,"w":"bosom","k":"`b ʊzəm","p":"n.","c":"胸；乳房","es":"She held the puppy close to her bosom to keep it warm.","cs":"她把小狗緊緊抱在她的胸前以保持溫暖。","d":"A person's chest or heart, especially regarded as the seat of emotions."},{"id":2294,"l":5,"w":"botany","k":"`b ɑtənɪ","p":"n.","c":"植物學","es":"She is studying botany and plans to become a plant scientist.","cs":"她正在研究植物學，並計畫成為一名植物科學家。","d":"The scientific study of plants."},{"id":2295,"l":5,"w":"boulevard","k":"`bul ə͵vɑrd","p":"n.","c":"林蔭大道","es":"We took a scenic drive down the main city boulevard.","cs":"我們沿著主要的城市大道進行了一次風景優美的駕駛。","d":"A wide street in a town or city, often lined with trees."},{"id":2296,"l":5,"w":"bound","k":"ba ʊnd","p":"vi.vt.","c":"( 使)跳躍","es":"The deer bounded across the meadow and into the forest.","cs":"鹿跳過草地進入了森林。","d":"To leap or spring forward; restricted by or headed toward."},{"id":2297,"l":5,"w":"boundary","k":"`ba ʊndrɪ","p":"n.","c":"邊界","es":"A high fence marks the boundary between the two properties.","cs":"一道高高的柵欄標示著兩個物業之間的邊界。","d":"A line that marks the limits of an area; a dividing line."},{"id":2298,"l":5,"w":"bowel","k":"`ba ʊəl","p":"n.","c":"腸","es":"The doctor advised him to take medicine to regulate his bowel movements.","cs":"醫生建議他服藥來調節他的腸道蠕動。","d":"An intestine, especially the large intestine."},{"id":2299,"l":5,"w":"boxer","k":"`b ɑksɚ","p":"n.","c":"拳擊手","es":"The young boxer won the championship title in the final round.","cs":"這位年輕的拳擊手在最後一回合贏得了冠軍頭銜。","d":"A person who takes part in the sport of boxing."},{"id":2300,"l":5,"w":"boxing","k":"`b ɑksɪŋ","p":"n.","c":"拳擊","es":"He trains every day to improve his skills in boxing.","cs":"他每天都訓練以提升他的拳擊技巧。","d":"The sport or practice of fighting with fists in padded gloves."},{"id":2301,"l":5,"w":"boyhood","k":"`b ɔɪhʊd","p":"n.","c":"少年時期","es":"He often tells stories about his adventurous boyhood in the countryside.","cs":"他經常講述他在鄉村度過的充滿冒險的少年時期的故事。","d":"The period or state of being a boy."},{"id":2302,"l":5,"w":"brace","k":"bres","p":"n.","c":"支撐物；矯正器；大括號","es":"She wore a knee brace to support her injured leg during the hike.","cs":"她在徒步旅行時戴著膝蓋支架來支撐她受傷的腿。","d":"A device used to support, strengthen, or align parts of the body or structures."},{"id":2303,"l":5,"w":"braid","k":"bred","p":"n.","c":"辮子","es":"She wore her long hair in a tight French braid.","cs":"她把她的長髮編成一條緊緊的法式辮子。","d":"A length of hair or material formed by interweaving three or more strands."},{"id":2304,"l":5,"w":"breadth","k":"br ɛdθ","p":"n.","c":"寬度","es":"The painting's unusual breadth makes it difficult to display.","cs":"這幅畫不尋常的寬度使它難以展示。","d":"The distance or measurement from side to side of something; width."},{"id":2305,"l":5,"w":"bribe","k":"bra ɪb","p":"n.vt.vi.","c":"賄賂","es":"The official was arrested for accepting a large bribe.","cs":"這位官員因接受巨額賄賂而被捕。","d":"Money or favors given to persuade someone to act in one's favor."},{"id":2306,"l":5,"w":"briefcase","k":"`brif͵kes","p":"n.","c":"公事包","es":"He carried his laptop and documents in a leather briefcase.","cs":"他用一個皮革公事包攜帶他的筆記型電腦和文件。","d":"A flat, rectangular case used for carrying documents and papers."},{"id":2307,"l":5,"w":"broaden","k":"`br ɔdn","p":"vi.vt.","c":"拓寬","es":"Traveling to new countries can broaden your horizons.","cs":"旅行到新的國家可以拓寬你的視野。","d":"To expand or become wider in range or distance."},{"id":2308,"l":5,"w":"bronze","k":"br ɑnz","p":"n.","c":"青銅","es":"The statue was cast in shining bronze and placed in the square.","cs":"這座雕像由閃亮的青銅鑄造而成，並放置在廣場上。","d":"A yellowish-brown metal alloy of copper and tin."},{"id":2309,"l":5,"w":"brooch","k":"brot ʃ","p":"n.","c":"胸針","es":"She wore an elegant diamond brooch pinned to her jacket.","cs":"她的夾克上別著一枚優雅的鑽石胸針。","d":"An ornamental jewelry piece pinned to clothing."},{"id":2310,"l":5,"w":"brood","k":"brud","p":"n.v.","c":"一窩 (卵、蟲、鳥 ) ；孵出","es":"The mother hen protected her large brood of chicks.","cs":"母雞保護著牠的一大窩小雞。","d":"A family of young animals produced at one hatching; to worry moodily."},{"id":2311,"l":5,"w":"broth","k":"br ɔθ","p":"n.","c":"湯","es":"She made a comforting chicken broth with vegetables.","cs":"她用蔬菜做了一碗令人慰藉的雞湯。","d":"A thin soup of meat or fish stock with vegetables."},{"id":2312,"l":5,"w":"brotherhood","k":"`br ʌðɚ͵hʊd","p":"n.","c":"兄弟情誼","es":"The group promoted a sense of brotherhood and mutual respect.","cs":"這個團體宣揚一種兄弟情誼和相互尊重的感覺。","d":"The feeling of kinship, friendship, and solidarity A young bovine animal, especially a domestic cow or bull in its first year."},{"id":2322,"l":5,"w":"calligraphy","k":"k ə`lɪgrəfɪ","p":"n.","c":"書法","es":"The artist is famous for his elegant Chinese calligraphy.","cs":"這位藝術家以他優雅的中文書法而聞名。","d":"The art of producing decorative handwriting or lettering with a pen or brush."},{"id":2323,"l":5,"w":"canal","k":"k ə`næ l","p":"n.","c":"運河","es":"The city is known for its beautiful network of interconnecting canals.","cs":"這座城市以其美麗的相互連接的運河網絡而聞名。","d":"An artificial waterway constructed to allow the passage of boats or ships inland."},{"id":2324,"l":5,"w":"cannon","k":"`kæ n ən","p":"n.","c":"大砲","es":"The fortress still has an old cannon displayed on the wall.","cs":"這座堡壘的牆上仍然展示著一門舊大砲。","d":"A large, heavy piece of artillery, typically mounted on wheels, used in warfare."},{"id":2325,"l":5,"w":"carbon","k":"`kɑrbən","p":"n.","c":"炭","es":"Diamond and graphite are both pure forms of carbon.","cs":"鑽石和石墨都是碳的純淨形態。","d":"A chemical element (symbol C) that is present in all living things, coal, and diamonds."},{"id":2326,"l":5,"w":"cardboard","k":"`k ɑrd͵bord","p":"n.","c":"硬紙板","es":"We packed our books in sturdy cardboard boxes for the move.","cs":"我們用堅固的紙板箱裝書，以便搬家。","d":"Stiff, thick, and heavy paper used especially for making boxes."},{"id":2327,"l":5,"w":"carefree","k":"`k ɛr͵fri","p":"adj.","c":"無憂無慮的","es":"They enjoyed a carefree summer vacation filled with laughter.","cs":"他們享受了一個充滿歡笑、無憂無慮的暑假。","d":"Free from anxiety or responsibility."},{"id":2328,"l":5,"w":"caretaker","k":"`k ɛr͵tek ɚ","p":"n.","c":"照顧者","es":"The school caretaker is responsible for maintaining the building.","cs":"學校管理員負責維護校舍。","d":"A person employed to look after a public building or a person who looks after someone sick or young."},{"id":2329,"l":5,"w":"carnation","k":"k ɑr`neʃən","p":"n.","c":"康乃馨","es":"She gave her mother a bouquet of red carnations for Mother's Day.","cs":"母親節那天，她送給母親一束紅色康乃馨。","d":"A cultivated variety of clove pink flower, with fringed petals and a sweet scent."},{"id":2330,"l":5,"w":"carnival","k":"`k ɑrnəv!","p":"n.","c":"嘉年華會","es":"The entire town celebrated at the annual spring carnival.","cs":"全鎮的人都在一年一度的春季嘉年華會上慶祝。","d":"An annual public festival with music, procession, and dancing."},{"id":2331,"l":5,"w":"carp","k":"k ɑrp","p":"n.","c":"鯉魚","es":"We saw several large carp swimming near the bottom of the pond.","cs":"我們看到幾條大鯉魚在池塘底部附近游動。","d":"A deep-bodied freshwater fish typically found in lakes and slow rivers."},{"id":2332,"l":5,"w":"carton","k":"`k ɑrtn","p":"n.","c":"紙盒；紙箱","es":"Please remember to recycle the empty milk carton.","cs":"請記得回收空的牛奶紙盒。","d":"A light box or container, typically made of cardboard or plastic."},{"id":2333,"l":5,"w":"category","k":"`kæ t ə͵gorɪ","p":"n.","c":"種類；分類","es":"The books are organized into different categoryies by genre.","cs":"這些書按類型被組織成不同的類別。","d":"A class or division of people or things having particular shared characteristics."},{"id":2334,"l":5,"w":"cathedral","k":"k ə`θidrəl","p":"n.","c":"大教堂","es":"The city is dominated by the tall spires of the ancient cathedral.","cs":"這座城市被古老大教堂高聳的尖塔所主宰。","d":"The principal church of a diocese, with which the bishop is officially associated."},{"id":2335,"l":5,"w":"caution","k":"`k ɔʃən","p":"n.","c":"小心；謹慎","es":"Drive with extreme caution on the icy roads.","cs":"在結冰的道路上開車要極度小心。","d":"Care taken to avoid danger or mistakes."},{"id":2336,"l":5,"w":"cautious","k":"`k ɔʃəs","p":"adj.","c":"小心的；謹慎的","es":"He is a cautious driver who always obeys the speed limit.","cs":"他是一個謹慎的駕駛員，總是遵守速限。","d":"Careful to avoid potential problems or dangers."},{"id":2337,"l":5,"w":"celebrity","k":"s ɪ`lɛbrətɪ","p":"n.","c":"名人；名流；名聲","es":"The restaurant is often visited by local and international celebrityies.","cs":"這間餐廳經常有本地和國際名人光顧。","d":"A famous person, especially in entertainment or sport; the state of being well known."},{"id":2338,"l":5,"w":"celery","k":"`s ɛlərɪ","p":"n.","c":"芹菜","es":"She added chopped celery to the soup for extra flavor.","cs":"她在湯裡加入了切碎的芹菜以增加風味。","d":"A cultivated plant of the parsley family, with closely packed succulent leafstalks eaten as a vegetable."},{"id":2339,"l":5,"w":"cell-phone","k":"`sɛlfon","p":"n.","c":"手機","es":"I accidentally left my cell phone at home this morning.","cs":"我今天早上不小心把手機忘在家裡了。","d":"A portable telephone that can make and receive calls over a radio frequency link."},{"id":2340,"l":5,"w":"cellar","k":"`s ɛlɚ","p":"n.","c":"地窖；地下室；酒窖","es":"We keep our vintage wine bottles stored in the cool cellar.","cs":"我們把陳年葡萄酒瓶儲存在涼爽的地窖裡。","d":"A room below ground level in a house, typically used for storing wine or coal."},{"id":2341,"l":5,"w":"cello","k":"`t ʃɛlo","p":"n.","c":"大提琴","es":"She plays the cello beautifully in the city orchestra.","cs":"她在城市管弦樂團中優美地演奏大提琴。","d":"A bass instrument of the violin family, held upright on the floor between the legs of the seated player."},{"id":2342,"l":5,"w":"ceremony","k":"`s ɛrə͵monɪ","p":"n.","c":"典禮；儀式","es":"The wedding ceremony took place in a beautiful garden.","cs":"婚禮儀式在一個美麗的花園裡舉行。","d":"A formal religious or public occasion, typically one celebrating a particular event."},{"id":2343,"l":5,"w":"certificate","k":"s ɚ`tɪfəkɪt","p":"n.","c":"證書","es":"He proudly displayed his diving certificate on the wall.","cs":"他驕傲地將他的潛水證書展示在牆上。","d":"A formal document confirming a certain fact, qualification, or achievement."},{"id":2344,"l":5,"w":"chairman","k":"`t ʃɛrmən","p":"n.","c":"主席","es":"The chairman opened the meeting with a welcoming speech.","cs":"主席以一段歡迎詞開始了會議。","d":"A person chosen to preside over a meeting or direct a committee."},{"id":2345,"l":5,"w":"chairperson","k":"`t ʃɛr͵pɝsn","p":"n.","c":"議長；主席 (無性別歧視 )","es":"The board elected a new chairperson to lead the committee.","cs":"董事會選出一位新的主席來領導委員會。","d":"A person who presides over a meeting, committee, or board (gender-neutral)."},{"id":2346,"l":5,"w":"chairwoman","k":"`t ʃɛr͵wʊmən","p":"n.","c":"女主席","es":"The company's first
