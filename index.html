c":"噴鼻息","es":"The horse gave a loud snort of annoyance.","cs":"馬發出了一聲表示惱怒的響亮噴鼻息。","d":"An explosive sound made by the sudden forcing of breath through one's nose, used to express indignation, derision, or incredulity."},{"id":3059,"l":5,"w":"soak","k":"sok","p":"vt.vi.n.","c":"浸泡","es":"I had to soak the dirty clothes overnight.","cs":"我不得不將髒衣服浸泡一整夜。","d":"To make or allow (something) to become thoroughly wet by immersing it in liquid."},{"id":3060,"l":5,"w":"sober","k":"`sob ɚ","p":"adj.","c":"清醒的","es":"He was completely sober after a night's sleep.","cs":"睡了一晚後，他完全清醒的。","d":"Not affected by alcohol; not drunk."},{"id":3061,"l":5,"w":"soften","k":"`sɔfn","p":"vt.vi.","c":"( 使)變柔軟","es":"Adding lotion will soften your dry skin.","cs":"塗抹乳液會使你的乾燥皮膚變柔軟。","d":"To make or become soft or softer."},{"id":3062,"l":5,"w":"sole (1)","k":"sol","p":"n.adj.","c":"鞋底；單獨的","es":"The cobbler repaired the worn sole of the shoe.","cs":"鞋匠修復了鞋子上磨損的鞋底。","d":"The undersurface of a person's foot; one and only."},{"id":3063,"l":5,"w":"solemn","k":"`sɑləm","p":"adj.","c":"莊嚴的","es":"The ceremony had a very solemn atmosphere.","cs":"儀式有一個非常莊嚴的氣氛。","d":"Formal and dignified."},{"id":3064,"l":5,"w":"solitary","k":"`sɑlə͵tɛrɪ","p":"adj.","c":"獨自的","es":"The hermit lived a solitary life in the mountains.","cs":"隱士在山中過著獨自的生活。","d":"Done or existing alone."},{"id":3065,"l":5,"w":"solo","k":"`solo","p":"n.adj.","c":"獨唱；單飛 ；單獨的","es":"The musician performed a complex piano solo.","cs":"這位音樂家演奏了一首複雜的鋼琴獨唱（獨奏）。","d":"For or done by one person alone; unaccompanied."},{"id":3066,"l":5,"w":"sovereign","k":"`sɑvrɪn","p":"adj.","c":"具獨立主權的","es":"The UN recognizes all independent nations as sovereign states.","cs":"聯合國承認所有獨立國家為具獨立主權的國家。","d":"Possessing supreme or ultimate power."},{"id":3067,"l":5,"w":"sow","k":"so","p":"vt.vi.n.","c":"播種；母豬","es":"We will sow the seeds in the spring.","cs":"我們將在春天播種。","d":"To plant (seed) by scattering it on or in the earth; an adult female pig, especially one that has farrowed."},{"id":3068,"l":5,"w":"spacecraft","k":"`spes͵kræft","p":"n.","c":"太空船","es":"The spacecraft is scheduled to launch next month.","cs":"這艘太空船計畫在下個月發射。","d":"A vehicle used for traveling in space."},{"id":3069,"l":5,"w":"spaceship","k":"`spes͵ ʃɪp","p":"n.","c":"太空船","es":"They watched the spaceship lift off from the launchpad.","cs":"他們看著太空船從發射臺升空。","d":"A manned spacecraft."},{"id":3070,"l":5,"w":"specialist","k":"`spɛʃəlɪst","p":"n.","c":"專家","es":"She is a specialist in tropical diseases.","cs":"她是熱帶疾病的專家。","d":"A person who concentrates primarily on a particular subject or activity; a person highly skilled in a specific and restricted field."},{"id":3071,"l":5,"w":"specimen","k":"`spɛsəmən","p":"n.","c":"標本","es":"The museum has a valuable specimen of an ancient fossil.","cs":"博物館有一個古代化石的寶貴標本。","d":"An individual animal, plant, piece of a mineral, etc., used as an example of its species or type for scientific study or display."},{"id":3072,"l":5,"w":"spectacle","k":"`spɛktək!","p":"n.","c":"奇觀；眼鏡 (+s)","es":"The fireworks display was a magnificent spectacle.","cs":"煙火表演是一個宏偉的奇觀。","d":"A visually striking performance or display; (spectacles) glasses."},{"id":3073,"l":5,"w":"spectator","k":"spɛk`tetɚ","p":"n.","c":"觀眾","es":"The stadium was packed with enthusiastic spectators.","cs":"體育場裡擠滿了熱情的觀眾。","d":"A person who watches at a show, game, or other event."},{"id":3074,"l":5,"w":"spine","k":"spaɪn","p":"n.","c":"脊椎","es":"Be careful not to injure your spine while lifting heavy objects.","cs":"搬運重物時，請小心不要傷到你的脊椎。","d":"A series of vertebrae extending from the skull to the small of the back, enclosing the spinal cord and providing support for the thorax and abdomen; the backbone."},{"id":3075,"l":5,"w":"splendor","k":"`splɛndɚ","p":"n.","c":"壯麗","es":"The ballroom was decorated with breathtaking splendor.","cs":"舞廳裝飾得壯麗非凡。","d":"Magnificent and splendid appearance; grandeur."},{"id":3076,"l":5,"w":"sponge","k":"spʌndʒ","p":"n.","c":"海綿","es":"Use the sponge to wipe down the counter.","cs":"用海綿擦拭櫃檯。","d":"A piece of a soft, light, porous substance originally consisting of the fibrous skeleton of an invertebrate but now usually made of synthetic material, used for washing and cleaning."},{"id":3077,"l":5,"w":"spotlight","k":"`spɑt͵laɪt","p":"n.","c":"聚光燈","es":"The actor stood under the bright spotlight on stage.","cs":"演員站在舞台上明亮的聚光燈下。","d":"A lamp projecting a narrow, intense beam of light directly onto a place or person, especially a performer on stage."},{"id":3078,"l":5,"w":"sprint","k":"sprɪnt","p":"vi.n.","c":"衝刺","es":"The runner began a full sprint towards the finish line.","cs":"跑者開始朝著終點線全力衝刺。","d":"Run at full speed over a short distance."},{"id":3079,"l":5,"w":"spur","k":"spɝ","p":"n.v.","c":"靴刺；激勵","es":"The rider dug his spurs into the horse's flanks.","cs":"騎手將他的靴刺刺入馬的兩側。","d":"A device with a small spike or a spiked wheel that is worn on a rider's heel and used for urging a horse forward; to give an incentive or encouragement to (someone)."},{"id":3080,"l":5,"w":"squash","k":"skw ɑʃ","p":"n.vt.vi.","c":"南瓜；回力球；擠壓","es":"The children enjoyed playing a game of squash.","cs":"孩子們喜歡玩壁球（南瓜）。","d":"Crush or squeeze (something) with force so that it becomes flat, soft, or out of shape; an edible gourd, the flesh of which may be baked or mashed."},{"id":3081,"l":5,"w":"squat","k":"skw ɑt","p":"vi.n.","c":"蹲","es":"He had to squat down to look under the car.","cs":"他不得不蹲下來看車底下。","d":"Crouch or sit with one's knees bent and one's heels close to or touching one's buttocks or the back of one's thighs."},{"id":3082,"l":5,"w":"stack","k":"stæ k","p":"n.","c":"(乾草 )堆","es":"The worker placed the boxes in a neat stack.","cs":"工人將箱子整齊地堆成一堆。","d":"A pile of objects, typically one that is neatly arranged."},{"id":3083,"l":5,"w":"stagger","k":"`stæ g ɚ","p":"vi.vt.n.","c":"( 使)蹣跚","es":"He began to stagger after drinking too much alcohol.","cs":"喝了太多酒後，他開始蹣跚。","d":"Walk or move unsteadily, as if about to fall."},{"id":3084,"l":5,"w":"stain","k":"sten","p":"n.","c":"沾汙；汙點","es":"Be careful not to stain the new carpet with wine.","cs":"小心不要用酒沾汙新的地毯。","d":"Mark (something) with colored patches or dirty marks that are not easily removed."},{"id":3085,"l":5,"w":"stake","k":"stek","p":"n.","c":"樁；賭注；危險","es":"The company is placing a large stake on the success of this product.","cs":"這家公司在這個產品的成功上押下了很大的賭注。","d":"A strong wooden or metal post with a point at one end, driven into the ground to support a tree, form part of a fence, act as a boundary mark, etc.; a sum of money or something else of value gambled on the outcome of a risky game or venture."},{"id":3086,"l":5,"w":"stalk","k":"stɔk","p":"n.v.n.","c":"莖；葉柄；悄悄追蹤","es":"The farmer left the dry corn stalks in the field.","cs":"農民將乾燥的玉米莖留在田裡。","d":"The main stem of a herbaceous plant; pursue or approach stealthily."},{"id":3087,"l":5,"w":"stall","k":"stɔl","p":"n.","c":"(牲畜的 )欄；廄","es":"The horse was led back to its stall for the night.","cs":"馬被帶回它的廄過夜。","d":"A stand, booth, or compartment for the sale of goods in a market or large covered area."},{"id":3088,"l":5,"w":"stanza","k":"`stæ nz ə","p":"n.","c":"詩節","es":"The poem consisted of four four-line stanzas.","cs":"這首詩由四個四行詩節組成。","d":"A group of lines forming the basic recurring metrical unit in a poem; a verse."},{"id":3089,"l":5,"w":"startle","k":"`stɑrt!","p":"vt.vi.n.","c":"( 使)驚嚇","es":"The sudden explosion made everyone startle.","cs":"突然的爆炸讓每個人都驚嚇。","d":"Cause (a person or animal) to feel sudden shock or alarm."},{"id":3090,"l":5,"w":"statesman","k":"`stetsm ən","p":"n.","c":"政治家","es":"Abraham Lincoln is remembered as a great American statesman.","cs":"亞伯拉罕·林肯被譽為一位偉大的美國政治家。","d":"A skilled, experienced, and respected political leader or figure."},{"id":3091,"l":5,"w":"statist ical","k":"stə`tɪstɪk!","p":"adj.","c":"統計數字的","es":"The report is based on rigorous statistical analysis.","cs":"這份報告是基於嚴謹的統計數字的分析。","d":"Relating to the use of statistics."},{"id":3092,"l":5,"w":"statistic(s)","k":"stə`tɪstɪks","p":"n.","c":"統計數字","es":"The latest statistics show an increase in employment.","cs":"最新的統計數字顯示就業率有所增加。","d":"A fact or piece of data from a study of a large quantity of numerical data."},{"id":3093,"l":5,"w":"steamer","k":"`stim ɚ","p":"n.","c":"汽船；蒸籠","es":"We took a relaxing ride on an old river steamer.","cs":"我們乘著一艘古老的河流汽船進行了一次輕鬆的旅行。","d":"A ship, boat, or locomotive powered by steam."},{"id":3094,"l":5,"w":"steer","k":"stɪr","p":"vt.vi.","c":"駕駛","es":"He carefully steered the boat around the buoy.","cs":"他小心翼翼地駕駛船繞過浮標。","d":"Guide or control the movement of (a vehicle, vessel, or aircraft), for example by turning a wheel or operating a rudder."},{"id":3095,"l":5,"w":"stereotype","k":"`stɛrɪə͵taɪp","p":"n.","c":"刻板印象","es":"We must challenge harmful gender stereotypes.","cs":"我們必須挑戰有害的性別刻板印象。","d":"A widely held but fixed and oversimplified image or idea of a particular type of person or thing."},{"id":3096,"l":5,"w":"stern","k":"stɝn","p":"adj.","c":"嚴厲的","es":"The headmaster gave a stern warning to the disruptive students.","cs":"校長對搗亂的學生發出了嚴厲的警告。","d":"(Of a person or their manner) serious and unrelenting, especially in the assertion of authority and exercise of discipline."},{"id":3097,"l":5,"w":"stew","k":"stju","p":"vt.vi.n.","c":"燉；燉肉","es":"She made a hearty beef stew for dinner.","cs":"她做了豐盛的牛肉燉肉作為晚餐。","d":"A dish of meat and vegetables cooked slowly in liquid in a closed dish or pan."},{"id":3098,"l":5,"w":"steward","k":"`stjuw ɚd","p":"n.","c":"(火車等的 )男服務員","es":"The steward efficiently served drinks on the flight.","cs":"這位男服務員在航班上高效地提供飲料。","d":"A person who looks after the passengers on a ship, aircraft, or train and brings them meals."},{"id":3099,"l":5,"w":"stewardess","k":"`stjuw ɚdɪs","p":"n.","c":"女服務員","es":"The friendly stewardess helped me find my seat.","cs":"友善的女服務員幫我找到了我的座位。","d":"A woman who looks after the passengers on a ship, aircraft, or train and brings them meals."},{"id":3100,"l":5,"w":"stink","k":"stɪŋk","p":"vi.n.","c":"發臭；爛透了；惡臭","es":"The rotten garbage began to stink terribly.","cs":"腐爛的垃圾開始發出可怕的惡臭。","d":"Have a strong unpleasant smell."},{"id":3101,"l":5,"w":"stock","k":"stɑk","p":"n.","c":"股票；存貨","es":"The store keeps a large stock of winter coats.","cs":"這家商店儲存了大量的冬季外套存貨。","d":"The goods or merchandise kept on the premises of a business or warehouse and available for sale or distribution; the capital raised by a business or corporation through the issue and subscription of shares."},{"id":3102,"l":5,"w":"stoop","k":"stup","p":"vi.n.","c":"俯身","es":"He had to stoop to tie his shoe laces.","cs":"他不得不俯身繫鞋帶。","d":"Bend one's head or body forward and downward."},{"id":3103,"l":5,"w":"storage","k":"`stor ɪdʒ","p":"n.","c":"貯藏","es":"We need more storage space for all these files.","cs":"我們需要更多的貯藏空間來存放所有這些文件。","d":"The action or method of storing something for future use."},{"id":3104,"l":5,"w":"stout","k":"staʊt","p":"adj.","c":"堅固的","es":"The old oak tree was still stout despite the storm.","cs":"儘管有暴風雨，這棵老橡樹仍然堅固。","d":"(Of a person) somewhat fat or of heavy build; (of an object) strong and thick."},{"id":3105,"l":5,"w":"straighten","k":"`stretn","p":"vt.vi.","c":"弄直；好轉","es":"Please straighten the picture on the wall.","cs":"請弄直牆上的那幅畫。","d":"Make or become straight."},{"id":3106,"l":5,"w":"straightforward","k":"͵stret`f ɔrwɚd","p":"adj.","c":"直率的","es":"His instructions were clear and straightforward.","cs":"他的指示清晰且直率的。","d":"Uncomplicated and easy to do or understand; (of a person) honest and frank."},{"id":3107,"l":5,"w":"strain","k":"stren","p":"vt.vi.n.","c":"拉緊","es":"The constant noise began to strain my nerves.","cs":"持續的噪音開始拉緊我的神經。","d":"Force (a part of one's body or oneself) to make a strenuous or unusually great effort."},{"id":3108,"l":5,"w":"strait","k":"stret","p":"n.","c":"海峽","es":"The ship sailed through the narrow strait.","cs":"船隻穿過了狹窄的海峽。","d":"A narrow passage of water connecting two seas or two large areas of water."},{"id":3109,"l":5,"w":"strand","k":"stræ nd","p":"n.vt.","c":"線；繩；絞(繩索等 )；使 …擱淺","es":"A single strand of hair fell across her forehead.","cs":"一線頭髮垂落在她的額頭上。","d":"Drive or leave (a boat, sailor, or sea creature) aground on a shore; a single thin length of something such as thread, fiber, or wire, especially as twisted together with others."},{"id":3110,"l":5,"w":"strap","k":"stræ p","p":"n.","c":"帶子","es":"The heavy suitcase had a thick leather strap.","cs":"這個沉重的行李箱有一條厚厚的皮革帶子。","d":"A strip of leather, cloth, or other flexible material, often with a buckle, used to fasten, secure, or carry something or to hold onto something."},{"id":3111,"l":5,"w":"stray","k":"stre","p":"vi.adj.n.","c":"迷路 (的)；流浪 (的) ；迷路者；流浪者","es":"A stray dog was wandering near the park entrance.","cs":"一隻流浪的狗在公園入口附近徘徊。","d":"Move away aimlessly from a group or from the right course or place."},{"id":3112,"l":5,"w":"streak","k":"strik","p":"n.","c":"條紋","es":"The zebra has distinctive black and white streaks.","cs":"斑馬有獨特的黑白條紋。","d":"A long, thin line or mark of a different substance or color from its surroundings."},{"id":3113,"l":5,"w":"stride","k":"straɪd","p":"vi.vt.n.","c":"大步走","es":"She walked with a confident stride into the room.","cs":"她邁著自信的大步走進房間。","d":"Walk with long, decisive steps in a specified direction."},{"id":3114,"l":5,"w":"stripe","k":"straɪp","p":"n.","c":"條紋","es":"The flag has red, white, and blue stripes.","cs":"旗幟有紅色、白色和藍色的條紋。","d":"A long narrow band or strip, typically of the same width throughout its length, differing in color or texture from the surface on either side of it."},{"id":3115,"l":5,"w":"stroll","k":"strol","p":"vi.vt.n.","c":"閒逛","es":"They went for a relaxing stroll along the beach.","cs":"他們沿著海灘進行了一次輕鬆的閒逛。","d":"Walk in a leisurely way."},{"id":3116,"l":5,"w":"structural","k":"`strʌktʃərəl","p":"adj.","c":"結構的","es":"The bridge's structural integrity was checked by engineers.","cs":"橋樑的結構的完整性得到了工程師的檢查。","d":"Of, relating to, or forming part of the structure of a building or other item."},{"id":3117,"l":5,"w":"stumble","k":"`stʌmb!","p":"vi.vt.","c":"絆倒","es":"He tends to stumble over his words when nervous.","cs":"緊張時，他容易絆倒（口吃）。","d":"Trip or momentarily lose one's balance; almost fall."},{"id":3118,"l":5,"w":"stump","k":"stʌmp","p":"n.vi.","c":"殘幹；根株；笨重地走","es":"The woodcutter sat down on a large tree stump.","cs":"樵夫坐在一塊大樹殘幹上。","d":"The bottom part of a tree left projecting from the ground after most of the trunk has fallen or been cut down."},{"id":3119,"l":5,"w":"stun","k":"stʌn","p":"vt.","c":"使昏厥","es":"The unexpected news seemed to stun the whole crowd.","cs":"這個突如其來的消息似乎使整個群眾昏厥（震驚）。","d":"Knock unconscious or into a dazed or semiconscious state."},{"id":3120,"l":5,"w":"sturdy","k":"`stɝdɪ","p":"adj.","c":"結實的","es":"The chair is very sturdy and can hold heavy weights.","cs":"這把椅子非常結實，可以承受重物。","d":"(Of a person or their body) strongly and solidly built."},{"id":3121,"l":5,"w":"stutter","k":"`stʌtɚ","p":"vi.vt.n.","c":"結巴","es":"The little boy tends to stutter when he is excited.","cs":"這個小男孩興奮時容易結巴。","d":"Talk with continued involuntary repetition of sounds, especially initial consonants."},{"id":3122,"l":5,"w":"stylish","k":"`staɪlɪʃ","p":"adj.","c":"流行的","es":"She is always wearing the most stylish and fashionable clothes.","cs":"她總是穿著最流行的和時尚的衣服。","d":"Fashionably elegant and sophisticated."},{"id":3123,"l":5,"w":"submit","k":"səb`mɪt","p":"vt.","c":"(使…)順服；提交","es":"All employees must submit to the new company policy.","cs":"所有員工都必須順服新的公司政策。","d":"Accept or yield to a superior force or to the authority or will of another person; present (a proposal, application, or other document) to a person or body for consideration or judgment."},{"id":3124,"l":5,"w":"substantial","k":"səb`stæ n ʃəl","p":"adj.","c":"真實的； 大量的","es":"The construction project requires a substantial investment.","cs":"這個建設項目需要大量的投資。","d":"Of considerable importance, size, or worth."},{"id":3125,"l":5,"w":"substitute","k":"`sʌbstə͵tjut","p":"n.v.adj.","c":"替代物；代 替 ；代替的","es":"The coach used a temporary substitute player in the game.","cs":"教練在比賽中使用了臨時替代物（替補球員）。","d":"A person or thing acting or serving in place of another."},{"id":3126,"l":5,"w":"suitcase","k":"`sut͵kes","p":"n.","c":"手提箱","es":"She packed her clothes into a large suitcase.","cs":"她把衣服裝進了一個大手提箱。","d":"A case with a handle and a hinged lid, used for carrying clothes and other personal possessions."},{"id":3127,"l":5,"w":"sulfur","k":"`sʌlfɚ","p":"n.","c":"硫磺","es":"Sulfur is a yellow chemical element.","cs":"硫磺是一種黃色化學元素。","d":"A yellow combustible nonmetal."},{"id":3128,"l":5,"w":"summon","k":"`sʌmən","p":"vt.","c":"召喚","es":"The general decided to summon his troops for a meeting.","cs":"將軍決定召喚他的部隊開會。","d":"Authoritatively or urgently call on (someone) to be present, especially as a defendant or witness in a law court."},{"id":3129,"l":5,"w":"superficial","k":"`sup ɚ`fɪʃəl","p":"adj.","c":"膚淺的","es":"The discussion remained at a superficial level.","cs":"討論一直停留在膚淺的層面。","d":"Existing or occurring at or on the surface."},{"id":3130,"l":5,"w":"superstition","k":"͵sup ɚ`stɪʃən","p":"n.","c":"迷信","es":"Believing that a black cat brings bad luck is a superstition.","cs":"相信黑貓帶來厄運是一種迷信。","d":"Excessively credulous belief in and reverence for supernatural beings."},{"id":3131,"l":5,"w":"supervise","k":"`sup ɚvaɪz","p":"vt.vi.","c":"監督","es":"She was hired to supervise the team's work.","cs":"她被僱來監督團隊的工作。","d":"Observe and direct the execution of (a task, project, or activity)."},{"id":3132,"l":5,"w":"supervisor","k":"`supɚˌvaɪzɚ","p":"n.","c":"監督者","es":"You need to get approval from your supervisor before taking a day off.","cs":"請假前你需要先獲得主管的批准。","d":"A person who supervises a person or an activity."},{"id":3133,"l":5,"w":"suppress","k":"sə`prɛs","p":"vt.","c":"鎮壓","es":"The government acted quickly to suppress the rebellion.","cs":"政府迅速採取行動鎮壓叛亂。","d":"Forcibly put an end to."},{"id":3134,"l":5,"w":"supreme","k":"sə`prim","p":"adj.","c":"最高的","es":"She holds the supreme position in the organization.","cs":"她在組織中擁有最高的職位。","d":"(Of authority or an office, or someone holding it) superior to all others."},{"id":3135,"l":5,"w":"surge","k":"sɝdʒ","p":"vi.n.","c":"洶湧；急升","es":"A large surge of electricity damaged the equipment.","cs":"一股巨大的電流急升（衝擊）損壞了設備。","d":"A sudden powerful forward or upward movement, especially by a crowd or by a natural force such as the waves or tide."},{"id":3136,"l":5,"w":"suspend","k":"sə`spɛnd","p":"vt.vi.","c":"懸掛；使 …中止","es":"They decided to suspend the project due to lack of funds.","cs":"他們決定因缺乏資金而使項目中止。","d":"Temporarily prevent from continuing or being in force or effect; hang (something) from somewhere."},{"id":3137,"l":5,"w":"sustain","k":"sə`sten","p":"vt.","c":"支撐","es":"The pillars sustain the weight of the roof.","cs":"柱子支撐著屋頂的重量。","d":"Strengthen or support physically or mentally."},{"id":3138,"l":5,"w":"swamp","k":"swɑmp","p":"n.","c":"沼澤","es":"The explorers had to navigate through the dense swamp.","cs":"探險家們必須穿過茂密的沼澤。","d":"An area of low-lying, uncultivated ground where water collects; a bog or marsh."},{"id":3139,"l":5,"w":"swarm","k":"swɔrm","p":"n.","c":"(蟲、蜂 )群","es":"A large swarm of bees attacked the hive.","cs":"一大群蜜蜂襲擊了蜂巢。","d":"A large or dense group of insects, especially flying ones."},{"id":3140,"l":5,"w":"sympathize","k":"`sɪmpə͵θaɪz","p":"vi.","c":"同情","es":"I truly sympathize with your situation.","cs":"我真心同情你的處境。","d":"Feel or express sympathy."},{"id":3141,"l":5,"w":"tackle","k":"`tæ k!","p":"vt.vi.","c":"解決；擒抱","es":"We need to tackle this problem immediately.","cs":"我們需要立即解決這個問題。","d":"The equipment required for a task or sport; make determined efforts to deal with (a problem or difficult task)."},{"id":3142,"l":5,"w":"tan","k":"tæ n","p":"n.","c":"古銅色","es":"He got a nice, even tan during his beach vacation.","cs":"他在海灘度假期間曬了一個漂亮、均勻的古銅色。","d":"A yellowish-brown color; a golden-brown shade of skin developed by pale-skinned people after exposure to the sun."},{"id":3143,"l":5,"w":"tangle","k":"`tæŋg!","p":"vt.vi.n.","c":"纏繞；糾結","es":"The fishing line got into a complicated tangle.","cs":"釣魚線纏成了一個複雜的糾結。","d":"Twist together into a confused mass."},{"id":3144,"l":5,"w":"tar","k":"tɑr","p":"n.","c":"焦油","es":"The road construction crew used hot tar.","cs":"道路施工隊使用了熱焦油。","d":"A dark, thick, flammable liquid distilled from wood or coal, consisting of a mixture of hydrocarbons, resins, alcohols, and other compounds. It is used in roadmaking and for coating and preserving timber."},{"id":3145,"l":5,"w":"tart","k":"tɑrt","p":"n.adj.","c":"水果蛋糕；酸的","es":"She baked a delicious lemon tart for dessert.","cs":"她烤了一個美味的檸檬水果蛋糕作為甜點。","d":"An open pastry case containing a filling; sharp or acid in taste."},{"id":3146,"l":5,"w":"taunt","k":"tɔnt","p":"vt.n.","c":"嘲弄","es":"He decided to taunt his younger brother until he cried.","cs":"他決定嘲弄他的弟弟直到他哭泣。","d":"A remark made in order to anger, wound, or provoke someone."},{"id":3147,"l":5,"w":"tavern","k":"`tæ v ɚn","p":"n.","c":"酒館","es":"The old village tavern is a popular meeting spot.","cs":"這個古老的村莊酒館是一個受歡迎的聚會點。","d":"An establishment for the sale of beer and other drinks to be consumed on the premises, sometimes also serving food."},{"id":3148,"l":5,"w":"teller","k":"`tɛlɚ","p":"n.","c":"敘述者；出納員","es":"The bank teller processed my withdrawal request.","cs":"銀行出納員處理了我的提款請求。","d":"A person who tells something; a person employed to deal with customers' transactions in a bank."},{"id":3149,"l":5,"w":"tempo","k":"`tɛmpo","p":"n.","c":"拍子","es":"The song has a very fast tempo.","cs":"這首歌有一個非常快的拍子。","d":"The speed at which a passage of music is or should be played."},{"id":3150,"l":5,"w":"tempt","k":"tɛmpt","p":"vt.","c":"誘惑","es":"The sweet smell of the cake was enough to tempt anyone.","cs":"蛋糕的甜美氣味足以誘惑任何人。","d":"Entice or attempt to entice (someone) to do or acquire something that they find attractive but know to be wrong or not beneficial."},{"id":3151,"l":5,"w":"temptation","k":"tɛmp`te ʃən","p":"n.","c":"誘惑","es":"He resisted the temptation to eat the whole cake.","cs":"他抵抗住了吃掉整個蛋糕的誘惑。","d":"A desire to do something, especially something wrong or unwise."},{"id":3152,"l":5,"w":"tenant","k":"`tɛnənt","p":"n.","c":"租戶","es":"The tenant is responsible for paying the utility bills.","cs":"租戶負責支付水電費。","d":"A person who occupies land or property rented from a landlord."},{"id":3153,"l":5,"w":"tentative","k":"`tɛntətɪv","p":"adj.","c":"暫時的","es":"The meeting has been scheduled for a tentative date.","cs":"會議已經安排了一個暫時的日期。","d":"Not certain or fixed; provisional."},{"id":3154,"l":5,"w":"terminal","k":"`tɝmən!","p":"adj.n.","c":"末端的；總站","es":"We arrived at the airport terminal just in time.","cs":"我們剛好及時到達機場總站。","d":"Of, forming, or situated at the end or extremity of something; the end of a railroad or other transport route, or a station at such a point."},{"id":3155,"l":5,"w":"terrace","k":"`tɛrəs","p":"n.","c":"露臺；階梯看台；梯田","es":"We sat on the outdoor terrace to enjoy the view.","cs":"我們坐在戶外露臺上欣賞風景。","d":"A level paved area or platform next to a building; a patio or veranda."},{"id":3156,"l":5,"w":"thigh","k":"θaɪ","p":"n.","c":"大腿","es":"He injured his thigh muscle while running.","cs":"他跑步時拉傷了他的大腿肌肉。","d":"The part of the human leg between the hip and the knee."},{"id":3157,"l":5,"w":"thorn","k":"θɔrn","p":"n.","c":"刺","es":"Be careful of the sharp thorns on the rose bush.","cs":"小心玫瑰叢上鋒利的刺。","d":"A stiff, sharp-pointed, straight or curved woody projection on the stem or other part of a plant."},{"id":3158,"l":5,"w":"thrill","k":"θrɪl","p":"vt.vi.n.","c":"( 使)激動","es":"The adventure film was a great thrill to watch.","cs":"這部冒險電影看得很激動人心。","d":"A sudden feeling of excitement and pleasure."},{"id":3159,"l":5,"w":"thriller","k":"`θrɪlɚ","p":"n.","c":"驚悚作品","es":"She enjoys reading psychological thrillers.","cs":"她喜歡閱讀心理驚悚作品。","d":"A novel, play, or movie with an exciting plot, typically involving crime or espionage."},{"id":3160,"l":5,"w":"throne","k":"θron","p":"n.","c":"王位","es":"The new queen sat on the ancient throne.","cs":"新女王坐在古老的王位上。","d":"A ceremonial chair for a sovereign, bishop, or similar figure."},{"id":3161,"l":5,"w":"throng","k":"θrɔŋ","p":"n.","c":"群眾","es":"A large throng of fans gathered outside the stadium.","cs":"一大群粉絲聚集在體育場外。","d":"A large, densely packed crowd of people or animals."},{"id":3162,"l":5,"w":"thrust","k":"θrʌst","p":"vt.vi.n.","c":"猛推；刺","es":"He gave the door a hard thrust with his shoulder.","cs":"他用肩膀用力猛推門。","d":"Push (something or someone) suddenly or violently in the specified direction."},{"id":3163,"l":5,"w":"tick","k":"tɪk","p":"n.vi.vt.","c":"( 發)滴答聲","es":"I could hear the tick of the clock in the quiet room.","cs":"我能聽到時鐘在安靜的房間裡發出滴答聲。","d":"A regular short, sharp sound, especially that made by a clock or watch."},{"id":3164,"l":5,"w":"tile","k":"taɪl","p":"n.","c":"磁磚，瓦片","es":"They chose a beautiful blue tile for the kitchen floor.","cs":"他們為廚房地板選擇了一塊漂亮的藍色磁磚。","d":"A thin rectangular slab of baked clay, concrete, or other material, used in overlapping rows for covering roofs."},{"id":3165,"l":5,"w":"tilt","k":"tɪlt","p":"vt.vi.n.","c":"( 使)傾斜","es":"The strong wind caused the mast to tilt.","cs":"強風導致桅杆傾斜。","d":"Move or cause to move into a sloping position."},{"id":3166,"l":5,"w":"tin","k":"tɪn","p":"n.","c":"錫","es":"Old cans are often made of tin.","cs":"舊罐子通常是用錫製成的。","d":"A silvery-white metal, the chemical element of atomic number 50."},{"id":3167,"l":5,"w":"tiptoe","k":"`tɪp͵to","p":"n.vi.","c":"腳尖；踮腳走","es":"She stood on tiptoe to reach the top shelf.","cs":"她踮腳站著去拿頂層架子上的東西。","d":"Walk quietly and carefully with one's heels raised and one's weight on the balls of the feet."},{"id":3168,"l":5,"w":"toad","k":"tod","p":"n.","c":"蟾蜍","es":"The garden is home to several small toads.","cs":"這個花園裡有幾隻小蟾蜍。","d":"A tailless amphibian with a short stout body and short legs, typically having dry warty skin that can exude poison."},{"id":3169,"l":5,"w":"toil","k":"tɔɪl","p":"n.vi.","c":"辛勞；苦幹","es":"Years of hard toil finally paid off.","cs":"多年的辛勤辛勞終於得到了回報。","d":"Work extremely hard or incessantly."},{"id":3170,"l":5,"w":"token","k":"`tok ən","p":"n.","c":"象徵","es":"The small gift was a token of her appreciation.","cs":"這個小禮物是她感謝的象徵。","d":"A thing serving as a visible or tangible representation of a fact, quality, feeling, etc."},{"id":3171,"l":5,"w":"torch","k":"tɔrtʃ","p":"n.","c":"火炬","es":"The runner carried the Olympic torch into the stadium.","cs":"跑者將奧運火炬帶進了體育場。","d":"A portable means of illumination such as a piece of wood or cloth soaked in tallow or an oil lamp on a pole, sometimes carried ceremonially."},{"id":3172,"l":5,"w":"torment","k":"tɔr`mɛnt","p":"n.","c":"痛苦","es":"The loss of his home caused him great torment.","cs":"失去家園給他帶來了巨大的痛苦。","d":"Severe physical or mental suffering."},{"id":3173,"l":5,"w":"torrent","k":"`tɔrənt","p":"n.","c":"急流","es":"A heavy downpour created a muddy torrent.","cs":"一場大暴雨造成了一股泥濘的急流。","d":"A strong and fast-moving stream of water or other liquid."},{"id":3174,"l":5,"w":"torture","k":"`tɔrtʃɚ","p":"n.","c":"痛苦","es":"The prisoners endured terrible torture during the war.","cs":"戰俘們在戰爭期間忍受了可怕的痛苦（酷刑）。","d":"The action or practice of inflicting severe pain on someone as a punishment or to force them to do or say something, or for the pleasure of the person inflicting the pain."},{"id":3175,"l":5,"w":"tournament","k":"`tɝnəmənt","p":"n.","c":"錦標賽","es":"The team advanced to the final round of the tournament.","cs":"該隊伍晉級了錦標賽的最後一輪。","d":"A sporting competition in which contestants play a series of games to decide the winner."},{"id":3176,"l":5,"w":"toxic","k":"`tɑksɪk","p":"adj.","c":"有毒的","es":"Be careful when handling this material as it is highly toxic.","cs":"處理這種材料時要小心，因為它具有高度有毒的。","d":"Poisonous."},{"id":3177,"l":5,"w":"trademark","k":"`tred͵m ɑrk","p":"n.","c":"商標","es":"The company registered its new logo as a trademark.","cs":"該公司將其新標誌註冊為商標。","d":"A symbol, word, or words legally registered or established by use as representing a company or product."},{"id":3178,"l":5,"w":"traitor","k":"`tret ɚ","p":"n.","c":"叛逆者","es":"He was labeled a traitor for betraying his country.","cs":"他因背叛國家而被貼上叛逆者的標籤。","d":"A person who betrays a friend, country, principle, etc."},{"id":3179,"l":5,"w":"tramp","k":"træ mp","p":"n.v.","c":"流浪漢；沉重的走","es":"A lonely tramp was sleeping on a park bench.","cs":"一個孤獨的流浪漢睡在公園的長椅上。","d":"Walk heavily or noisily; a person who travels from place to place on foot in search of work or as a vagrant or beggar."},{"id":3180,"l":5,"w":"trample","k":"`træ mp!","p":"vt.n.","c":"踐踏","es":"The elephants began to trample the dry grass.","cs":"大象開始踐踏乾燥的草地。","d":"Tread on and crush."},{"id":3181,"l":5,"w":"transparent","k":"træ ns`p ɛrənt","p":"adj.","c":"透明的","es":"The glass is completely transparent.","cs":"玻璃是完全透明的。","d":"(Of a material or article) allowing light to pass through so that objects behind can be distinctly seen."},{"id":3182,"l":5,"w":"treasury","k":"`trɛʒərɪ","p":"n.","c":"寶庫","es":"The government keeps its gold reserves in the national treasury.","cs":"政府將其黃金儲備保存在國家寶庫。","d":"The funds or revenue of a government, corporation, or institution."},{"id":3183,"l":5,"w":"treaty","k":"`tritɪ","p":"n.","c":"條約","es":"The two nations signed a peace treaty.","cs":"這兩個國家簽署了一份和平條約。","d":"A formally concluded and ratified agreement between countries."},{"id":3184,"l":5,"w":"trench","k":"trɛntʃ","p":"n.","c":"壕溝","es":"The soldiers dug a deep trench for protection.","cs":"士兵們挖了一條深壕溝進行防護。","d":"A long, narrow ditch."},{"id":3185,"l":5,"w":"tribute","k":"`trɪbjut","p":"n.","c":"貢品；尊崇","es":"The memorial statue is a tribute to the war heroes.","cs":"這座紀念雕像向戰爭英雄們表達了尊崇（貢品）。","d":"An act, statement, or gift that is intended to show gratitude, respect, or admiration."},{"id":3186,"l":5,"w":"trifle","k":"`traɪf!","p":"n.","c":"瑣事","es":"Don't worry about such a small trifle.","cs":"不要擔心這麼小的瑣事。","d":"A thing of little value or importance."},{"id":3187,"l":5,"w":"trim","k":"trɪm","p":"vt.vi.n.","c":"修剪；調整","es":"She asked the barber to trim her hair just a little.","cs":"她要求理髮師只是稍微修剪她的頭髮。","d":"Make (something) neat or of the required size or form by cutting away irregular or unwanted parts."},{"id":3188,"l":5,"w":"triple","k":"`trɪp!","p":"adj.","c":"三倍的","es":"The special offer allows customers to get a triple discount.","cs":"這個特別優惠允許顧客獲得三倍的折扣。","d":"Consisting of or involving three parts, things, or people."},{"id":3189,"l":5,"w":"trot","k":"trɑt","p":"n.vi.vt.","c":"快步走； (使)小跑","es":"The horse started to move at a brisk trot.","cs":"馬開始以輕快的快步走移動。","d":"(With reference to a horse or other quadruped) proceed or cause to proceed at a pace faster than a walk, lifting each diagonal pair of legs alternately."},{"id":3190,"l":5,"w":"trout","k":"traʊt","p":"n.","c":"鱒魚","es":"He enjoys fishing for trout in mountain streams.","cs":"他喜歡在山間溪流中釣鱒魚。","d":"A chiefly freshwater fish of the salmon family, found in both Eurasia and North America and highly valued as food and game."},{"id":3191,"l":5,"w":"tuck","k":"tʌk","p":"vt.vi.","c":"塞","es":"She had to tuck the loose sheets under the mattress.","cs":"她不得不將鬆散的床單塞到床墊下。","d":"Push, fold, or turn (the edges or ends of something, especially a garment or bedclothes) so as to hide them or hold them in place."},{"id":3192,"l":5,"w":"tuition","k":"tju`ɪʃən","p":"n.","c":"學費","es":"University tuition fees have increased again this year.","cs":"大學學費今年又增加了。","d":"A sum of money charged for teaching or instruction by a school, college, or university."},{"id":3193,"l":5,"w":"tuna","k":"`tun ə","p":"n.","c":"鮪魚","es":"Fresh tuna is a popular choice for sushi.","cs":"新鮮鮪魚是壽司的熱門選擇。","d":"A large and active predatory schooling fish of the mackerel family. Found in warm seas, it is extensively fished commercially and is popular as a game fish."},{"id":3194,"l":5,"w":"tyrant","k":"`taɪrənt","p":"n.","c":"暴君","es":"The people suffered under the harsh rule of the tyrant.","cs":"人民在暴君的嚴酷統治下受苦。","d":"A cruel and oppressive ruler."},{"id":3195,"l":5,"w":"umpire","k":"`ʌmpaɪr","p":"n.","c":"裁判 (棒球、網球、板球 )","es":"The umpire ruled the tennis ball was out.","cs":"裁判（網球）裁定網球出界了。","d":"(In some sports) an official who watches a game or match closely to enforce the rules and arbitrate on matters arising from the play."},{"id":3196,"l":5,"w":"undergraduate","k":"͵ʌndɚ`græ d ʒʊɪt","p":"n.","c":"大學生","es":"She is an undergraduate student majoring in history.","cs":"她是一位主修歷史的大學生。","d":"A student at a college or university who has not yet earned a bachelor's or equivalent degree."},{"id":3197,"l":5,"w":"underline","k":"͵ʌndɚ`laɪn","p":"vt.","c":"劃底線； 強調","es":"The teacher asked us to underline the key vocabulary.","cs":"老師要求我們劃底線（強調）關鍵詞彙。","d":"Draw a line under (a word or phrase) to give emphasis or indicate special type."},{"id":3198,"l":5,"w":"underneath","k":"͵ʌndɚ`niθ","p":"prep.","c":"在…下方","es":"The secret passage was located underneath the large rug.","cs":"秘密通道位於大地毯的下方。","d":"Situated directly below (something else)."},{"id":3199,"l":5,"w":"understandable","k":"͵ʌndɚ`stæ nd əb!","p":"adj.","c":"可理解 的","es":"His mistake was completely understandable under the circumstances.","cs":"在這種情況下，他的錯誤是完全可理解的。","d":"Able to be understood."},{"id":3200,"l":5,"w":"undoubtedly","k":"ʌn`daʊtɪdlɪ","p":"advt.","c":"毫無疑問地","es":"It was undoubtedly the best concert of the year.","cs":"這毫無疑問地是今年最好的一場音樂會。","d":"Without doubt; certainly."},{"id":3201,"l":5,"w":"update","k":"ʌp`det","p":"vt.n.","c":"更新","es":"Please update your personal information in the system.","cs":"請在系統中更新你的個人資訊。","d":"Make (something) more modern or up to date."},{"id":3202,"l":5,"w":"upright","k":"`ʌp͵raɪt","p":"adj.","c":"直立的；正直的","es":"The tall pole was held upright by strong ropes.","cs":"這根高高的桿子被結實的繩子直立的固定著。","d":"(Of a person or their behavior) strictly honorable or honest; strictly vertical or straight up and down."},{"id":3203,"l":5,"w":"upward","k":"`ʌpwɚd","p":"adj.advt.","c":"向上的","es":"The balloon drifted upward into the sky.","cs":"氣球向上飄向天空。","d":"Moving, pointing, or leading to a higher place, point, or level."},{"id":3204,"l":5,"w":"upward(s)","k":"`ʌpwɚd(z)","p":"advt.","c":"向上地","es":"He looked upwards at the airplane passing overhead.","cs":"他向上地看著頭頂飛過的飛機。","d":"Toward a higher place, point, or level."},{"id":3205,"l":5,"w":"utter","k":"`ʌtɚ","p":"adj.vt.","c":"全然的；說","es":"The speech was an utter disaster.","cs":"這場演講是全然的災難。","d":"Complete; absolute; make (a sound) with one's voice."},{"id":3206,"l":5,"w":"vacancy","k":"`vek ənsɪ","p":"n.","c":"空缺","es":"There is a vacancy for a marketing assistant.","cs":"有一個行銷助理的空缺。","d":"An unoccupied position or job."},{"id":3207,"l":5,"w":"vacuum","k":"`væ kj ʊəm","p":"n.","c":"真空","es":"She used a vacuum cleaner to clean the floor.","cs":"她使用真空吸塵器清潔地板。","d":"A space entirely devoid of matter."},{"id":3208,"l":5,"w":"vague","k":"veg","p":"adj.","c":"模糊的","es":"The memory of the accident remains vague in her mind.","cs":"事故的記憶在她腦海中仍然是模糊的。","d":"Of uncertain, indefinite, or unclear character or meaning."},{"id":3209,"l":5,"w":"vanity","k":"`væ n ətɪ","p":"n.","c":"虛榮","es":"Her excessive concern with appearance is a sign of vanity.","cs":"她過度關注外表是虛榮的表現。","d":"Excessive pride in or admiration of one's own appearance or achievements."},{"id":3210,"l":5,"w":"vapor","k":"`vep ɚ","p":"n.","c":"蒸氣","es":"The hot water produced a lot of steam or vapor.","cs":"熱水產生了大量的蒸汽或蒸氣。","d":"A substance diffused or suspended in the air, especially one normally liquid or solid."},{"id":3211,"l":5,"w":"vegetation","k":"͵vɛdʒə`teʃən","p":"n.","c":"植物","es":"The hillside was covered in lush, green vegetation.","cs":"山坡上覆蓋著茂盛、綠色的植物。","d":"Plants considered collectively, especially those found in a particular area or habitat."},{"id":3212,"l":5,"w":"veil","k":"vel","p":"n.","c":"面紗","es":"The bride wore a beautiful lace veil over her face.","cs":"新娘臉上戴著一塊漂亮的蕾絲面紗。","d":"A piece of fine material worn by women to protect or conceal the face."},{"id":3213,"l":5,"w":"vein","k":"ven","p":"n.","c":"靜脈；血管；葉脈","es":"The doctor took a blood sample from a vein in her arm.","cs":"醫生從她手臂上的靜脈抽取了血樣。","d":"Any of the tubes forming part of the blood circulation system of the body, carrying in most cases oxygen-depleted blood toward the heart."},{"id":3214,"l":5,"w":"velvet","k":"`vɛlvɪt","p":"n.","c":"天鵝絨","es":"She wrapped herself in a soft velvet blanket.","cs":"她用一條柔軟的天鵝絨毯子裹住自己。","d":"A closely woven fabric of silk, cotton, or nylon, that has a thick short pile on one side."},{"id":3215,"l":5,"w":"venture","k":"`vɛntʃɚ","p":"vt.vi.n.","c":"冒險","es":"He decided to venture into the dense forest alone.","cs":"他決定獨自冒險進入茂密的森林。","d":"A risky or daring journey or undertaking."},{"id":3216,"l":5,"w":"verbal","k":"`vɝb!","p":"adj.","c":"口頭的","es":"The contract includes a verbal agreement, which is often difficult to prove.","cs":"合同包括一項口頭的協議。","d":"Relating to or in the form of words."},{"id":3217,"l":5,"w":"versus","k":"`vɝsəs","p":"prep.","c":"與…相對","es":"The next game is the champion versus the challenger.","cs":"下一場比賽是冠軍與挑戰者的對決。","d":"Against (especially in sports and legal use)."},{"id":3218,"l":5,"w":"vertical","k":"`vɝtɪk!","p":"adj.","c":"垂直的","es":"The window blinds have vertical slats.","cs":"窗簾有垂直的板條。","d":"At right angles to a horizontal plane; in a direction, or having an alignment, such that the top is directly above the bottom."},{"id":3219,"l":5,"w":"veto","k":"`vito","p":"n.vt.","c":"否決","es":"The president has the power to veto the bill.","cs":"總統有權否決這項法案。","d":"A constitutional right to reject a decision or proposal made by a law-making body."},{"id":3220,"l":5,"w":"via","k":"`vaɪə","p":"prep.","c":"透過 …","es":"We will send the documents via email.","cs":"我們將透過電子郵件發送文件。","d":"Traveling through (a place) en route to a destination."},{"id":3221,"l":5,"w":"vibrate","k":"`vaɪbret","p":"vi.","c":"震動","es":"The old bridge would vibrate when a truck passed over it.","cs":"當卡車經過時，這座舊橋會震動。","d":"Move or cause to move continuously and rapidly to and fro."},{"id":3222,"l":5,"w":"videotape","k":"`vɪdɪo`tep","p":"n.","c":"錄影帶","es":"The movie was recorded on an old videotape.","cs":"這部電影錄製在一卷舊錄影帶上。","d":"Magnetic tape for recording and reproducing visual images and sound."},{"id":3223,"l":5,"w":"viewer","k":"`vju ɚ","p":"n.","c":"觀眾","es":"The television viewers rated the show highly.","cs":"電視觀眾對這個節目評價很高。","d":"A person who looks at or inspects something."},{"id":3224,"l":5,"w":"vigor","k":"`vɪgɚ","p":"n.","c":"活力","es":"He tackled the task with renewed vigor.","cs":"他以重新獲得的活力處理這項任務。","d":"Physical strength and good health."},{"id":3225,"l":5,"w":"vigorous","k":"`vɪgərəs","p":"adj.","c":"有活力的","es":"She maintains a vigorous exercise routine.","cs":"她保持著一個有活力的日常鍛鍊。","d":"Strong, healthy, and full of energy."},{"id":3226,"l":5,"w":"villain","k":"`vɪlən","p":"n.","c":"惡徒","es":"The main villain of the story was defeated in the end.","cs":"故事中的主要惡徒最終被擊敗了。","d":"(In a film, novel, or play) a character whose evil actions or motives are important to the plot."},{"id":3227,"l":5,"w":"vine","k":"vaɪn","p":"n.","c":"藤蔓","es":"Grapes grow on long, twisting vines.","cs":"葡萄生長在長而扭曲的藤蔓上。","d":"A climbing or trailing woody-stemmed plant of the grape family."},{"id":3228,"l":5,"w":"violinist","k":"͵vaɪə`lɪnɪst","p":"n.","c":"小提琴家","es":"The famous violinist gave a stunning performance.","cs":"這位著名的小提琴家進行了一場精彩的表演。","d":"A person who plays the violin."},{"id":3229,"l":5,"w":"visa","k":"`viz ə","p":"n.","c":"簽證","es":"She needed a student visa to study abroad.","cs":"她需要一份學生簽證才能出國留學。","d":"An endorsement on a passport indicating that the holder is allowed to enter, leave, or stay for a specified period of time in a country."},{"id":3230,"l":5,"w":"vow","k":"vaʊ","p":"n.","c":"誓言 vt.vi發誓","es":"They made a solemn vow to love each other forever.","cs":"他們立下了永遠愛對方的莊嚴誓言。","d":"A solemn promise."},{"id":3231,"l":5,"w":"wade","k":"wed","p":"vi.vt.","c":"涉水","es":"We had to wade across the shallow river.","cs":"我們不得不涉水穿過淺河。","d":"Walk with effort through water or another liquid or viscous substance."},{"id":3232,"l":5,"w":"wail","k":"wel","p":"vi.vt.n.","c":"慟哭；嚎啕","es":"The bereaved mother began to wail uncontrollably.","cs":"痛失親人的母親開始無法控制地慟哭。","d":"A prolonged high-pitched cry of pain, grief, or anger."},{"id":3233,"l":5,"w":"ward","k":"wɔrd","p":"n.vt.","c":"(1) 病房 (2)躲開","es":"After the surgery, he was moved to a general ward to recover.","cs":"手術後，他被移至普通病房休養。","d":"A separate room in a hospital, typically one allocated to a particular type of patient; admit to or care for in a hospital ward."},{"id":3234,"l":5,"w":"ware","k":"wɛr","p":"n.","c":"…的製品","es":"The shop sells ceramic ware from Italy.","cs":"這家店出售來自義大利的陶瓷製品。","d":"Articles offered for sale."},{"id":3235,"l":5,"w":"warehouse","k":"`wɛr͵haʊs","p":"n.","c":"倉庫","es":"The company stores its products in a large warehouse.","cs":"該公司將其產品儲存在一個大倉庫。","d":"A large building where raw materials or manufactured goods may be stored before their export or distribution for sale."},{"id":3236,"l":5,"w":"warrior","k":"`wɔrɪɚ","p":"n.","c":"戰士","es":"The ancient warrior was skilled in many forms of combat.","cs":"這位古代戰士精通多種戰鬥形式。","d":"(Especially in former times) a brave or experienced soldier or fighter."},{"id":3237,"l":5,"w":"wary","k":"`wɛrɪ","p":"adj.","c":"小心的；謹防的","es":"Be wary of strangers offering you free gifts.","cs":"對於向你提供免費禮物的陌生人要保持小心的。","d":"Feeling or showing caution about possible dangers or problems."},{"id":3238,"l":5,"w":"weary","k":"`wɪrɪ","p":"adj.","c":"疲倦的","es":"After a long day of work, I felt completely weary.","cs":"經過一整天的工作，我感到完全疲倦的。","d":"Feeling or showing tiredness, especially as a result of excessive exertion or lack of sleep."},{"id":3239,"l":5,"w":"weird","k":"wɪrd","p":"adj.","c":"怪異的","es":"She told me a weird story about aliens.","cs":"她告訴了我一個關於外星人的怪異的故事。","d":"Suggesting something supernatural; uncanny."},{"id":3240,"l":5,"w":"wharf","k":"hwɔrf","p":"n.","c":"碼頭","es":"The fisherman tied his boat to the wharf.","cs":"漁夫將他的船繫在碼頭上。","d":"A level quayside area to which a ship may be moored to load and unload."},{"id":3241,"l":5,"w":"wheelchair","k":"`hwil`t ʃɛr","p":"n.","c":"輪椅","es":"The old man needed a wheelchair to get around.","cs":"老人需要一張輪椅來四處走動。","d":"A chair fitted with wheels for use as a means of transport by a person who is unable to walk as a result of illness, injury, or disability."},{"id":3242,"l":5,"w":"whereabouts","k":"`hw ɛrə`baʊts","p":"advt.n.","c":"哪處；下 落","es":"The police are still investigating his whereabouts.","cs":"警方仍在調查他的下落。","d":"Where or approximately where."},{"id":3243,"l":5,"w":"whereas","k":"hwɛr`æ z","p":"conj.","c":"然而","es":"He is a vegetarian, whereas his brother eats meat.","cs":"他是素食者，然而他的兄弟吃肉。","d":"In contrast or comparison with the fact that."},{"id":3244,"l":5,"w":"whine","k":"hwa ɪn","p":"vi.vt.n.","c":"發牢騷","es":"The dog began to whine piteously for food.","cs":"狗開始可憐地發牢騷（嗚咽）乞食。","d":"A long, high-pitched complaining cry."},{"id":3245,"l":5,"w":"whirl","k":"hwɝl","p":"vi.vt.n.","c":"旋轉","es":"The wind caused the autumn leaves to whirl in the air.","cs":"風使秋葉在空中旋轉。","d":"Move or cause to move rapidly around and around."},{"id":3246,"l":5,"w":"whisk","k":"hwɪsk","p":"vt.vi.n.","c":"拂去；飛奔","es":"She used a cloth to whisk the dust off the shelf.","cs":"她用一塊布拂去架子上的灰塵。","d":"Beat or stir (a substance, especially cream or eggs) with a light, rapid movement."},{"id":3247,"l":5,"w":"whiskey/whisky","k":"`hw ɪskɪ","p":"n.","c":"威士忌","es":"He ordered a glass of fine Scotch whiskey.","cs":"他點了一杯優質的蘇格蘭威士忌。","d":"A spirit distilled from malted grain, especially barley or rye."},{"id":3248,"l":5,"w":"wholesale","k":"`hol͵sel","p":"n.adj.","c":"批發 (的)","es":"The company deals in wholesale distribution of goods.","cs":"該公司從事商品的批發分銷。","d":"The selling of goods in large quantities to be retailed by others."},{"id":3249,"l":5,"w":"wholesome","k":"`hols əm","p":"adj.","c":"合乎衛生的； 有益 的","es":"Eating a balanced diet is part of a wholesome lifestyle.","cs":"吃均衡飲食是合乎衛生的生活方式的一部分。","d":"Conducive to or suggestive of good health and physical well-being."},{"id":3250,"l":5,"w":"widespread","k":"`waɪd͵spr ɛd","p":"adj.","c":"廣布的","es":"The rumor quickly became widespread throughout the town.","cs":"這個謠言很快在整個鎮上廣布的（傳播開來）。","d":"Found or distributed over a large area or number of people."},{"id":3251,"l":5,"w":"widow","k":"`wɪdo","p":"n.","c":"寡婦","es":"The widow inherited her husband's estate.","cs":"這位寡婦繼承了她丈夫的遺產。","d":"A woman who has lost her spouse by death and has not married again."},{"id":3252,"l":5,"w":"widower","k":"`wɪdoɚ","p":"n.","c":"鰥夫","es":"After his wife passed away, he became a widower.","cs":"他的妻子去世後，他成了一個鰥夫。","d":"A man who has lost his spouse by death and has not married again."},{"id":3253,"l":5,"w":"wig","k":"wɪg","p":"n.","c":"假髮","es":"The actor wore a theatrical white wig.","cs":"演員戴著一頂戲劇性的白色假髮。","d":"A covering for the head made of real or artificial hair, typically worn by judges and barristers in law courts or by people trying to conceal their baldness."},{"id":3254,"l":5,"w":"wilderness","k":"`wɪldɚnɪs","p":"n.","c":"荒地","es":"They got lost in the vast, untamed wilderness.","cs":"他們迷失在廣闊、未被馴服的荒地中。","d":"An uncultivated, uninhabited, and inhospitable region."},{"id":3255,"l":5,"w":"wildlife","k":"`waɪld͵laɪf","p":"n.","c":"野生動物","es":"Protecting the wildlife in the national park is crucial.","cs":"保護國家公園裡的野生動物至關重要。","d":"Wild animals collectively; the native fauna (and sometimes flora) of a region."},{"id":3256,"l":5,"w":"wither","k":"`wɪðɚ","p":"vi.vt.","c":"枯萎","es":"The flowers began to wither in the intense heat.","cs":"花朵在強烈的熱度下開始枯萎。","d":"(Of a plant) become dry and shriveled."},{"id":3257,"l":5,"w":"woe","k":"wo","p":"n.int.","c":"悲痛；哎喲","es":"The news brought great woe to the whole family.","cs":"這個消息給全家帶來了巨大的悲痛。","d":"Great sorrow or distress."},{"id":3258,"l":5,"w":"woodpecker","k":"`wʊd͵pɛkɚ","p":"n.","c":"啄木鳥","es":"The sound of a woodpecker tapping on a tree echoed.","cs":"啄木鳥敲擊樹木的聲音迴響著。","d":"A bird with a strong bill and a stiff tail, that climbs tree trunks to find insects and drums on dead wood to mark territory."},{"id":3259,"l":5,"w":"workshop","k":"`wɝk͵ʃɑp","p":"n.","c":"工廠；研討會","es":"They held a training workshop on digital marketing.","cs":"他們舉辦了一個關於數位行銷的培訓研討會。","d":"A room or building in which goods are manufactured or repaired."},{"id":3260,"l":5,"w":"worship","k":"`wɝʃɪp","p":"n.vt.vi.","c":"崇拜","es":"They gather on Sundays to worship at the temple.","cs":"他們在星期天聚集在寺廟進行崇拜。","d":"The feeling or expression of reverence and adoration for a deity."},{"id":3261,"l":5,"w":"worthwhile","k":"`wɝθ`hwa ɪl","p":"adj.","c":"值得做的","es":"The experience was difficult but ultimately worthwhile.","cs":"這次經歷很艱難，但最終是值得做的。","d":"Worth the time, money, or effort spent; of value or importance."},{"id":3262,"l":5,"w":"worthy","k":"`wɝðɪ","p":"adj.","c":"值得的","es":"The volunteer is a truly worthy recipient of the award.","cs":"這位志願者是這個獎項一位真正值得的（受獎者）。","d":"Having or showing the qualities or abilities that merit recognition in a specified way."},{"id":3263,"l":5,"w":"wreath","k":"riθ","p":"n.","c":"花環","es":"She placed a beautiful flower wreath on the grave.","cs":"她將一個美麗的鮮花花環放在墳墓上。","d":"An arrangement of flowers, leaves, or stems fastened in a ring and used for decoration or for laying on a grave."},{"id":3264,"l":5,"w":"wring","k":"rɪŋ","p":"vt.n.vi.","c":"擰；蠕動","es":"She began to wring her hands nervously during the wait.","cs":"在等待期間，她開始緊張地擰她的手。","d":"Squeeze and twist (something) to force liquid from it."},{"id":3265,"l":5,"w":"yacht","k":"jɑt","p":"n.","c":"遊艇","es":"The millionaire bought a luxurious new yacht.","cs":"這位百萬富翁買了一艘豪華的新遊艇。","d":"A medium-sized sailboat equipped for cruising or racing."},{"id":3266,"l":5,"w":"yarn","k":"jɑrn","p":"n.","c":"紗線","es":"She used a thick wool yarn to knit a sweater.","cs":"她用一團粗羊毛紗線編織毛衣。","d":"Spun thread used for knitting, weaving, or sewing."},{"id":3267,"l":5,"w":"yeast ":"The aborigines are the original inhabitants of this area.","cs":"原住民是這個地區的原始居民。","d":""},{"id":3286,"l":6,"w":"abound","k":"ə`baʊnd","p":"vi.","c":"充滿","es":"Wildflowers abound in the meadows during the spring.","cs":"春天時，草地上開滿了野花。","d":""},{"id":3287,"l":6,"w":"absentminded","k":"`æ bsnt`ma ɪndɪd","p":"adj.","c":"心不在焉的","es":"He is so absentminded that he often forgets where he put his keys.","cs":"他非常心不在焉，經常忘記把鑰匙放在哪裡。","d":""},{"id":3288,"l":6,"w":"abstraction","k":"æ b`stræ k ʃən","p":"n.","c":"抽象","es":"Abstract art is often characterized by simplification and abstraction.","cs":"抽象藝術通常以簡化和抽象為特徵。","d":""},{"id":3289,"l":6,"w":"abundance","k":"ə`bʌndəns","p":"n.","c":"充裕","es":"The abundance of resources in the region supported a large population.","cs":"該地區資源的充裕支持了大量人口。","d":""},{"id":3290,"l":6,"w":"abuse","k":"ə`bjus","p":"n.vt.","c":"虐待","es":"Child abuse is a serious crime that needs to be addressed.","cs":"虐待兒童是一種需要解決的嚴重罪行。","d":""},{"id":3291,"l":6,"w":"accelerate","k":"æ k`sɛlə͵ret","p":"vt.vi.","c":"加速","es":"The car accelerated quickly when the light turned green.","cs":"綠燈亮時，汽車迅速加速。","d":""},{"id":3292,"l":6,"w":"acceleration","k":"æk͵s ɛlə`reʃən","p":"n.","c":"加速","es":"The acceleration of technological change is transforming society.","cs":"技術變革的加速正在改變社會。","d":""},{"id":3293,"l":6,"w":"accessible","k":"æ k`s ɛsəb!","p":"adj.","c":"易接近的","es":"The building is easily accessible by public transportation.","cs":"這棟建築物搭乘公共交通工具很方便。","d":""},{"id":3294,"l":6,"w":"accessory","k":"æ k`s ɛsərɪ","p":"n.","c":"配件","es":"She bought a new handbag as an accessory for her outfit.","cs":"她買了一個新手提包作為她服裝的配件。","d":""},{"id":3295,"l":6,"w":"accommodate","k":"ə`kɑmə͵det","p":"vt.","c":"容納","es":"The hotel can accommodate up to 200 guests.","cs":"這家飯店最多可容納 200 位客人。","d":""},{"id":3296,"l":6,"w":"accommodation","k":"ə͵kɑmə`deʃən","p":"n.","c":"住宿","es":"We are looking for temporary accommodation near the university.","cs":"我們正在尋找大學附近的臨時住宿。","d":""},{"id":3297,"l":6,"w":"accord","k":"ə`kɔrd","p":"vt.vi.n.","c":"( 使…)一致","es":"His actions did not accord with his stated beliefs.","cs":"他的行為與他聲稱的信仰不一致。","d":""},{"id":3298,"l":6,"w":"accordance","k":"ə`kɔrdəns","p":"n.","c":"一致","es":"The project was completed in accordance with the original plan.","cs":"該專案是按照原始計劃完成的。","d":""},{"id":3299,"l":6,"w":"accordingly","k":"ə`kɔrdɪŋlɪ","p":"advt.","c":"因此","es":"She missed the bus, and accordingly, she was late for work.","cs":"她錯過了公車，因此上班遲到了。","d":""},{"id":3300,"l":6,"w":"accountable","k":"ə`kaʊntəb!","p":"adj.","c":"負責任的","es":"Managers are accountable for the performance of their teams.","cs":"經理們對其團隊的績效負有責任。","d":""},{"id":3301,"l":6,"w":"accounting","k":"ə`kaʊntɪŋ","p":"n.","c":"會計","es":"He works in the accounting department of a major firm.","cs":"他在一家大公司的會計部門工作。","d":""},{"id":3302,"l":6,"w":"accumulate","k":"ə`kjumj ə͵let","p":"vt.vi.","c":"累積","es":"Dust tends to accumulate in the corners of the room.","cs":"灰塵容易累積在房間的角落。","d":""},{"id":3303,"l":6,"w":"accumulation","k":"ə͵kjumj ə`leʃən","p":"n.","c":"累積","es":"The accumulation of evidence led to the suspect's arrest.","cs":"證據的累積導致了嫌疑人的逮捕。","d":""},{"id":3304,"l":6,"w":"accusation","k":"͵ækj ə`zeʃən","p":"n.","c":"控訴","es":"The politician denied the accusation of corruption.","cs":"這位政治人物否認了腐敗的控訴。","d":""},{"id":3305,"l":6,"w":"acquisition","k":"͵ækw ə`zɪʃən","p":"n.","c":"獲得","es":"The company's latest acquisition is a smaller tech startup.","cs":"該公司最新的獲得是一家較小的科技新創公司。","d":""},{"id":3306,"l":6,"w":"activist","k":"`æ kt əvɪst","p":"n.","c":"激進份子；活動家","es":"She is a dedicated activist for environmental protection.","cs":"她是一位致力於環境保護的激進份子。","d":""},{"id":3307,"l":6,"w":"acute","k":"ə`kjut","p":"adj.","c":"急性的 (chronic)","es":"The patient was suffering from acute appendicitis.","cs":"這位病人患有急性盲腸炎。","d":""},{"id":3308,"l":6,"w":"adaptation","k":"͵ædæp`te ʃən","p":"n.","c":"適應","es":"The film is an adaptation of a best-selling novel.","cs":"這部電影是一部暢銷小說的改編。","d":""},{"id":3309,"l":6,"w" nform","k":"k ən`fɔrm","p":"vi.","c":"遵守；符合","es":"Students are expected to conform to the school's rules.","cs":"學生們被要求遵守學校的規則。","d":""},{"id":3479,"l":6,"w":"confrontation","k":"͵k ɑnfrʌn`teʃən","p":"n.","c":"對抗","es":"The confrontation between the two leaders ended in a stalemate.","cs":"兩位領導人之間的對抗以僵局告終。","d":""},{"id":3480,"l":6,"w":"congressman","k":"`k ɑŋgrəsmən","p":"n.","c":"美國國會議員","es":"The congressman delivered a speech to his constituents.","cs":"這位美國國會議員向他的選民發表了演講。","d":""},{"id":3481,"l":6,"w":"congresswoman","k":"`k ɑŋgrəs͵wʊmən","p":"n.","c":"美國國會女議員","es":"She was elected as a congresswoman for her district.","cs":"她當選為她所在選區的美國國會議員。","d":""},{"id":3482,"l":6,"w":"conquest","k":"`k ɑŋkwɛst","p":"n.","c":"征服","es":"The Roman conquest of Britain lasted for many years.","cs":"羅馬對英國的征服持續了多年。","d":""},{"id":3483,"l":6,"w":"conscientious","k":"͵k ɑnʃɪ`ɛnʃəs","p":"adj.","c":"憑良心的","es":"She is a conscientious student who always completes her assignments carefully.","cs":"她是一位憑良心的學生，總是仔細完成作業。","d":""},{"id":3484,"l":6,"w":"consensus","k":"k ən`sɛnsəs","p":"n.","c":"一致；合意","es":"There is a general consensus on the need for reform.","cs":"對於改革的必要性存在普遍的一致。","d":""},{"id":3485,"l":6,"w":"conservation","k":"͵k ɑnsɚ`veʃən","p":"n.","c":"保育","es":"Wildlife conservation is important for biodiversity.","cs":"野生動物保育對於生物多樣性很重要。","d":""},{"id":3486,"l":6,"w":"consolation","k":"͵k ɑnsə`leʃən","p":"n.","c":"安慰","es":"Receiving the award was a small consolation after losing the competition.","cs":"獲得這個獎項是在輸掉比賽後的一個小小的安慰。","d":""},{"id":3487,"l":6,"w":"conspiracy","k":"k ən`spɪrəsɪ","p":"n.","c":"陰謀","es":"They uncovered a conspiracy to overthrow the government.","cs":"他們揭露了一個推翻政府的陰謀。","d":""},{"id":3488,"l":6,"w":"constituent","k":"k ən`stɪtʃʊənt","p":"adj.","c":"組成的 n.選民，選舉人","es":"The constituent parts of the mixture separated over time.","cs":"混合物的組成部分隨著時間分離。","d":""},{"id":3489,"l":6,"w":"consultation","k":"͵k ɑnsəl`teʃən","p":"n.","c":"諮詢","es":"He had a consultation w rical","k":"h ɪs`tɛrɪk!","p":"adj.","c":"歇斯底里的","es":"The crowd became hysterical when the band took the stage.","cs":"樂隊上台時，人群變得歇斯底里的。","d":""},{"id":3763,"l":6,"w":"illuminate","k":"ɪ`lumə͵net","p":"vt.vi.","c":"照亮","es":"Streetlights illuminate the path at night.","cs":"街燈在夜間照亮道路。","d":""},{"id":3764,"l":6,"w":"illusion","k":"ɪ`ljuʒən","p":"n.","c":"幻覺；假象","es":"The magician's trick created the illusion of a disappearing coin.","cs":"魔術師的把戲製造了硬幣消失的幻覺。","d":""},{"id":3765,"l":6,"w":"immune","k":"ɪ`mjun","p":"adj.","c":"免疫的","es":"The children were immune to the common cold after getting the vaccine.","cs":"孩子們在接種疫苗後對普通感冒免疫了。","d":""},{"id":3766,"l":6,"w":"imperative","k":"ɪm`pɛrətɪv","p":"adj.","c":"必要的；命令式的","es":"It is imperative that we act quickly to prevent further damage.","cs":"我們必須迅速行動以防止進一步的損害是必要的。","d":""},{"id":3767,"l":6,"w":"implement","k":"` ɪmpləmənt","p":"n.","c":"器具 vt.實施","es":"The new policy will be difficult to implement without adequate resources.","cs":"如果沒有足夠的資源，這個新政策將難以實施。","d":""},{"id":3768,"l":6,"w":"implication","k":"͵ ɪmplɪ`keʃən","p":"n.","c":"暗示；牽連","es":"The implication of the study is that sleep quality affects learning.","cs":"這項研究的暗示是睡眠品質會影響學習。","d":""},{"id":3769,"l":6,"w":"implicit","k":"ɪm`pl ɪsɪt","p":"adj.","c":"含蓄的","es":"There was an implicit agreement that he would cover the costs.","cs":"有一個含蓄的協議，他將支付費用。","d":""},{"id":3770,"l":6,"w":"imposing","k":"ɪm`poz ɪŋ","p":"adj.","c":"壯觀的；","es":"The cathedral is an imposing structure that dominates the skyline.","cs":"這座大教堂是一個壯觀的建築，主宰了天際線。","d":""},{"id":3771,"l":6,"w":"imprison","k":"ɪm`pr ɪzn","p":"vt.","c":"監禁","es":"He was sentenced to five years to imprison for the crime.","cs":"他因這項罪行被判處五年監禁。","d":""},{"id":3772,"l":6,"w":"imprisonment","k":"ɪm`pr ɪznmənt","p":"n.","c":"監禁","es":"The judge ordered the immediate imprisonment of the defendant.","cs":"法官命令立即監禁被告。","d":""},{"id":3773,"l":6,"w":"incentive","k":"ɪn`sɛntɪv","p":"n.","c":"動機","es":"The bonus serves as a strong incentive for employees to work harder.","cs":"獎金是激勵員工更努力工作的強大動機。","d":""},{"id":3774,"l":6,"w":"incidental","k":"͵ ɪnsə`dɛnt!","p":"adj.","c":"附帶的；偶然發生的","es":"Any incidental costs should be covered by the travel allowance.","cs":"任何附帶的費用應由差旅津貼支付。","d":""},{"id":3775,"l":6,"w":"incline","k":"ɪn`kla ɪn","p":"vi.vt.","c":"傾斜；心裡傾向","es":"He has a natural incline toward classical music.","cs":"他心裡傾向古典音樂。","d":""},{"id":3776,"l":6,"w":"inclusive","k":"ɪn`klus ɪv","p":"adj.","c":"包含的","es":"The price is inclusive of all taxes and service charges.","cs":"這個價格是包含所有稅費和服務費的。","d":""},{"id":3777,"l":6,"w":"indignation","k":"͵ ɪndɪg`neʃən","p":"n.","c":"憤慨 inevitable adj.不可避免的","es":"She expressed her indignation at the unfair treatment.","cs":"她表達了對不公平待遇的憤慨。","d":""},{"id":3778,"l":6,"w":"infectious","k":"ɪn`fɛkʃəs","p":"adj.","c":"傳染性的","es":"The laughter in the room was infectious, and soon everyone was smiling.","cs":"房間裡的笑聲是傳染性的，很快每個人都笑了。","d":""},{"id":3779,"l":6,"w":"infer","k":"ɪn`fɝ","p":"vt.vi.","c":"推論；意味著 …","es":"We can infer from his silence that he is unhappy.","cs":"我們可以從他的沉默推論出他不高興。","d":""},{"id":3780,"l":6,"w":"inference","k":"` ɪnfərəns","p":"n.","c":"推論","es":"The report draws a clear inference between diet and health.","cs":"這份報告在飲食和健康之間做出了明確的推論。","d":""},{"id":3781,"l":6,"w":"ingenious","k":"ɪn`dʒinjəs","p":"adj.","c":"巧妙的；心靈手巧的；足智多謀的","es":"The inventor came up with an ingenious solution to the problem.","cs":"這位發明家提出了對這個問題巧妙的解決方案。","d":""},{"id":3782,"l":6,"w":"ingenuity","k":"͵ ɪndʒə`nuətɪ","p":"n.","c":"足智多謀；巧妙；精巧的裝置","es":"The team showed great ingenuity in fixing the broken machine.","cs":"團隊在修復損壞的機器方面展現了足智多謀。","d":""},{"id":3783,"l":6,"w":"inhabit","k":"ɪn`hæ b ɪt","p":"vt.","c":"棲息於 …","es":"Various species of birds inhabit this marshland.","cs":"各種鳥類棲息於這片沼澤地。","d":""},{"id":3784,"l":6,"w":"inhabitant","k":"ɪn`hæ b ətənt","p":"n.","c":"居民；居住者","es":"The ancient inhabitants of this region were farmers.","cs":"這個地區的古代居民是農民。","d":""},{"id":3785,"l":6,"w":"inherent","k":"ɪn`hɪrənt","p":"adj.","c":"固有的；與生俱來的","es":"There is an inherent risk in all financial investments.","cs":"所有金融投資都存在固有的風險。","d":""},{"id":3786,"l":6,"w":"initiative","k":"ɪ`nɪʃətɪv","p":"adj.","c":"創始的 n.倡議；進取心","es":"The government launched a new initiative to promote renewable energy.","cs":"政府發起了一項新的倡議來推廣再生能源。","d":""},{"id":3787,"l":6,"w":"inject","k":"ɪn`dʒɛkt","p":"vt.","c":"注射 (藥液等 )","es":"The nurse had to inject the vaccine into the patient's arm.","cs":"護士不得不將疫苗注射到病人的手臂中。","d":""},{"id":3788,"l":6,"w":"injection","k":"ɪn`dʒɛkʃən","p":"n.","c":"注射","es":"The patient received an injection to ease the pain.","cs":"病人接受了注射以減輕疼痛。","d":""},{"id":3789,"l":6,"w":"injustice","k":"ɪn`dʒʌstɪs","p":"n.","c":"不正義","es":"The group is protesting against the social injustice in the community.","cs":"這個團體正在抗議社區中的不正義。","d":""},{"id":3790,"l":6,"w":"innovation","k":"͵ ɪnə`veʃən","p":"n.","c":"改革；創新","es":"The company is known for its constant innovation in technology.","cs":"這家公司以其在技術上的不斷改革而聞名。","d":""},{"id":3791,"l":6,"w":"innovative","k":"` ɪno͵vet ɪv","p":"adj.","c":"創新的","es":"They developed an innovative approach to waste management.","cs":"他們開發了一種創新的廢物管理方法。","d":""},{"id":3792,"l":6,"w":"inquiry","k":"ɪn`kwa ɪrɪ","p":"n.","c":"詢問；調查；探索","es":"The police launched an inquiry into the cause of the fire.","cs":"警方對火災原因展開了調查。","d":""},{"id":3793,"l":6,"w":"insight","k":"` ɪn͵saɪt","p":"n.","c":"洞察力","es":"Her deep insight into human nature made her a great writer.","cs":"她對人性的深刻洞察力使她成為一位偉大的作家。","d":""},{"id":3794,"l":6,"w":"insistence","k":"ɪn`sɪstəns","p":"n.","c":"堅持","es":"At his insistence, they changed the meeting date.","cs":"在他的堅持下，他們改變了會議日期。","d":""},{"id":3795,"l":6,"w":"installation","k":"͵ ɪnstə`leʃən","p":"n.","c":"就任；安裝裝置","es":"The installation of the new security system will take two days.","cs":"新安全系統的安裝裝置將需要兩天。","d":""},{"id":3796,"l":6,"w":"installment","k":"ɪn`stɔlmənt","p":"n.","c":"分期付款","es":"He agreed to pay for the car in twelve monthly installments.","cs":"他同意以十二期分期付款的方式支付汽車費用。","d":""},{"id":3797,"l":6,"w":"institution","k":"͵ ɪnstə`tjuʃən","p":"n.","c":"制度；公共團體；機構；建立","es":"The university is a highly respected educational institution.","cs":"這所大學是一個備受尊敬的教育機構。","d":""},{"id":3798,"l":6,"w":"intact","k":"ɪn`tæ kt","p":"adj.","c":"完整無缺的","es":"Despite the storm, the ancient ruins remained intact.","cs":"儘管有暴風雨，古代遺跡仍然完整無缺的。","d":""},{"id":3799,"l":6,"w":"integrate","k":"` ɪntə͵gret","p":"vt.vi.","c":"使結合；使完整","es":"The school is trying to integrate technology into the curriculum.","cs":"學校正試圖使科技與課程結合。","d":""},{"id":3800,"l":6,"w":"integration","k":"͵ ɪntə`greʃən","p":"n.","c":"整合","es":"The social integration of immigrants is a complex process.","cs":"移民的社會整合是一個複雜的過程。","d":""},{"id":3801,"l":6,"w":"integrity","k":"ɪn`tɛgrətɪ","p":"n.","c":"正直；完善","es":"She is a woman of great integrity and is always honest.","cs":"她是一位正直的女性，總是誠實。","d":""},{"id":3802,"l":6,"w":"intellect","k":"` ɪnt!͵ɛkt","p":"n.","c":"智力","es":"His sharp intellect allows him to solve complex problems quickly.","cs":"他敏銳的智力使他能快速解決複雜的問題。","d":""},{"id":3803,"l":6,"w":"intersection","k":"͵ ɪntɚ`sɛkʃən","p":"n.","c":"十字路口","es":"The accident occurred at the busy intersection of two main roads.","cs":"事故發生在兩條主要道路繁忙的十字路口。","d":""},{"id":3804,"l":6,"w":"interval","k":"` ɪntɚv!","p":"n.","c":"間隔；距離","es":"There will be a 15-minute interval between the two acts of the play.","cs":"戲劇的兩幕之間將有 15 分鐘的間隔。","d":""},{"id":3805,"l":6,"w":"intervene","k":"͵ ɪntɚ`vin","p":"vi.","c":"干涉；打擾","es":"The teacher had to intervene to stop the fight between the students.","cs":"老師不得不干涉來阻止學生之間的爭吵。","d":""},{"id":3806,"l":6,"w":"intervention","k":"͵ ɪntɚ`vɛnʃən","p":"n.","c":"干涉","es":"Military intervention was considered a last resort.","cs":"軍事干涉被視為最後的手段。","d":""},{"id":3807,"l":6,"w":"intimacy","k":"` ɪntəməsɪ","p":"n.","c":"親密；私下","es":"The old friends shared a quiet intimacy built over years.","cs":"這對老朋友分享著多年來建立的安靜親密。","d":""},{"id":3808,"l":6,"w" itimate","k":"l ɪ`dʒɪtəmɪt","p":"adj.","c":"合法的；正統的","es":"The police determined that the claim was legitimate.","cs":"警方確定這項索賠是合法的。","d":""},{"id":3821,"l":6,"w":"lengthy","k":"`l ɛŋθɪ","p":"adj.","c":"長的","es":"The negotiation process was a lengthy and complicated one.","cs":"談判過程是一個長的且複雜的過程。","d":""},{"id":3822,"l":6,"w":"liable","k":"`la ɪəb!","p":"adj.","c":"易...的；有義務的","es":"If you break the vase, you will be liable for the cost of replacement.","cs":"如果你打碎花瓶，你將有義務支付更換費用。","d":""},{"id":3823,"l":6,"w":"liberate","k":"`l ɪbə͵ret","p":"vt.","c":"解放；使獲自由","es":"The army was ordered to liberate the occupied territory.","cs":"軍隊被命令解放被佔領的領土。","d":""},{"id":3824,"l":6,"w":"liberation","k":"͵l ɪbə`reʃən","p":"n.","c":"解放","es":"The day of the city's liberation was celebrated with a parade.","cs":"該市解放的日子舉行了遊行慶祝。","d":""},{"id":3825,"l":6,"w":"likewise","k":"`la ɪk͵wa ɪz","p":"advt.","c":"同樣地","es":"She did well on the exam, and likewise, her brother scored high.","cs":"她考試考得很好，同樣地，她的弟弟也得了高分。","d":""},{"id":3826,"l":6,"w":"limousine","k":"`l ɪmə͵zin","p":"n.","c":"大型豪華轎車 (limo)","es":"The celebrity arrived at the event in a black limousine.","cs":"這位名人在一輛黑色的大型豪華轎車 (limo) 中抵達活動現場。","d":""},{"id":3827,"l":6,"w":"liner","k":"`la ɪnɚ","p":"n.","c":"班機","es":"He booked a first-class ticket on a transatlantic ocean liner.","cs":"他預訂了一艘橫跨大西洋的豪華班機頭等艙機票。","d":""},{"id":3828,"l":6,"w":"linguist","k":"`l ɪŋgwɪst","p":"n.","c":"語言學者","es":"A linguist can speak and analyze several different languages.","cs":"語言學者可以說和分析幾種不同的語言。","d":""},{"id":3829,"l":6,"w":"liter","k":"`lit ɚ","p":"n.","c":"公升","es":"The recipe calls for two liters of milk.","cs":"這個食譜需要兩公升的牛奶。","d":""},{"id":3830,"l":6,"w":"literacy","k":"`l ɪtərəsɪ","p":"n.","c":"識字","es":"The government launched a campaign to improve adult literacy rates.","cs":"政府發起了一場運動來提高成人識字率。","d":""},{"id":3831,"l":6,"w":"literal","k":"`l ɪtərəl","p":"adj.","c":"照字面的","es":"She took the instructions in the literal sense.","cs":"她按照字面的意思理解了 y","k":"m ɛn`tæ l ətɪ","p":"n.","c":"智力","es":"The team needs to adopt a winning mentality to succeed.","cs":"團隊需要採取一種勝利的智力才能成功。","d":""},{"id":3856,"l":6,"w":"merchandise","k":"`m ɝtʃən͵daɪz","p":"n.","c":"商品","es":"The store sells official team merchandise.","cs":"這家商店出售官方團隊商品。","d":""},{"id":3857,"l":6,"w":"merge","k":"m ɝdʒ","p":"vt.vi.","c":"合併","es":"The two small companies decided to merge into a larger corporation.","cs":"這兩家小公司決定合併成一家更大的公司。","d":""},{"id":3858,"l":6,"w":"metaphor","k":"`m ɛtəfɚ","p":"n.","c":"隱喻","es":"The author used the ocean as a metaphor for life's challenges.","cs":"作者使用海洋作為隱喻來比喻人生的挑戰。","d":""},{"id":3859,"l":6,"w":"metropolitan","k":"͵m ɛtrə`pɑlətn","p":"n.","c":"大都市的","es":"She prefers the fast-paced life of a metropolitan area.","cs":"她更喜歡大都市地區快節奏的生活。","d":""},{"id":3860,"l":6,"w":"migrate","k":"`ma ɪ͵gret","p":"vi.","c":"遷移","es":"Birds migrate south for the winter to find warmer climates.","cs":"鳥類向南遷移過冬以尋找更溫暖的氣候。","d":""},{"id":3861,"l":6,"w":"migration","k":"ma ɪ`greʃən","p":"n.","c":"遷移","es":"The annual migration of wildebeest across the plains is a spectacular sight.","cs":"角馬每年橫越平原的遷移是一個壯觀的景象。","d":""},{"id":3862,"l":6,"w":"militant","k":"`m ɪlətənt","p":"adj.","c":"好戰的 n.好戰者","es":"The government condemned the actions of the militant group.","cs":"政府譴責了這群好戰者的行動。","d":""},{"id":3863,"l":6,"w":"miller","k":"`m ɪlɚ","p":"n.","c":"磨坊主","es":"The miller grinds the wheat into flour at the local mill.","cs":"磨坊主在當地的磨坊裡將小麥磨成麵粉。","d":""},{"id":3864,"l":6,"w":"mimic","k":"`m ɪmɪk","p":"vt.","c":"模仿 n.善模仿的人；小丑","es":"The parrot is able to mimic human speech perfectly.","cs":"這隻鸚鵡能夠完美地模仿人類的言語。","d":""},{"id":3865,"l":6,"w":"miniature","k":"`m ɪnɪətʃɚ","p":"adj.","c":"小型的","es":"He collects miniature trains and models.","cs":"他收集小型的火車和模型。","d":""},{"id":3866,"l":6,"w":"minimize","k":"`m ɪnə͵maɪz","p":"vt.","c":"使縮到最小","es":"The company is trying to minimize its environmental impact.","cs":"該公司正試圖使對環境的影響縮到最小。","d":""},{"id":3867,"l":6,"w 6,"w":"profound","k":"pr ə`faʊnd","p":"adj.","c":"深刻的；完全的","es":"The movie had a profound impact on my perspective on life.","cs":"這部電影對我的人生觀產生了深刻的影響。","d":""},{"id":3997,"l":6,"w":"progressiv e","k":"prə`grɛsɪv","p":"adj.","c":"進步的；革新的","es":"The country has a progressive tax system that taxes higher earners more.","cs":"這個國家有一個進步的稅收制度，對收入較高的人徵收更多稅。","d":""},{"id":3998,"l":6,"w":"prohibit","k":"pr ə`hɪbɪt","p":"vt.","c":"禁止","es":"Smoking is strictly prohibit in all indoor public spaces.","cs":"在所有室內公共場所嚴格禁止吸菸。","d":""},{"id":3999,"l":6,"w":"prohibition","k":"͵pro ə`bɪʃən","p":"n.","c":"禁止","es":"The prohibition of alcohol led to a rise in illegal activities.","cs":"對酒精的禁止導致非法活動的增加。","d":""},{"id":4000,"l":6,"w":"projection","k":"pr ə`dʒɛkʃən","p":"n.","c":"設計；發射；預測","es":"The company's projection for next year's sales is optimistic.","cs":"該公司對明年銷售額的預測是樂觀的。","d":""},{"id":4001,"l":6,"w":"prone","k":"pron","p":"adj.","c":"易於 ...的；傾斜的","es":"He is prone to catching colds in the winter.","cs":"他易於在冬天患感冒。","d":""},{"id":4002,"l":6,"w":"propaganda","k":"pr ɑpə`gæ nd ə","p":"n.","c":"宣傳","es":"The government used propaganda to control public opinion.","cs":"政府利用宣傳來控制公眾輿論。","d":""},{"id":4003,"l":6,"w":"propel","k":"pr ə`pɛl","p":"vt.","c":"推進","es":"The boat is propelled by a powerful outboard motor.","cs":"這艘船由一個強大的舷外馬達推進。","d":""},{"id":4004,"l":6,"w":"propeller","k":"prə`pɛlɚ","p":"n.","c":"螺旋槳；推進器","es":"The airplane's propeller began to spin faster as it taxied for takeoff.","cs":"飛機的螺旋槳在滑行準備起飛時開始轉得更快。","d":""},{"id":4005,"l":6,"w":"prose","k":"proz","p":"n.","c":"散文","es":"She writes excellent poetry, but her prose is not as strong.","cs":"她寫的詩歌很棒，但她的散文沒有那麼強。","d":""},{"id":4006,"l":6,"w":"prosecute","k":"`pr ɑsɪ͵kjut","p":"vt.","c":"起訴","es":"The district attorney decided to prosecute the case vigorously.","cs":"地方檢察官決定積極起訴這宗案件。","d":""},{"id":4007,"l":6,"w":"prosecution","k":"͵pr ɑsɪ`kjuʃən","p":"n.","c":"起訴","es":"The prosecution presented strong evidence against the defendant.","cs":"起訴方提出了對被告不利的有力證據。","d":""},{"id":4008,"l":6,"w":"prospective","k":"pr ə`spɛktɪv","p":"adj.","c":"預期的","es":"The company is interviewing prospective candidates for the CEO position.","cs":"該公司正在面試預期的執行長職位候選人。","d":""},{"id":4009,"l":6,"w":"provincial","k":"pr ə`vɪnʃəl","p":"adj.","c":"省的；地方性的","es":"He was often teased for his provincial accent and manners.","cs":"他經常因為他的地方性的口音和舉止而被取笑。","d":""},{"id":4010,"l":6,"w":"provoke","k":"pr ə`vok","p":"vt.","c":"對...挑釁；煽動","es":"The demonstrators hoped to provoke a reaction from the police.","cs":"示威者希望對警察挑釁一個反應。","d":""},{"id":4011,"l":6,"w":"prowl","k":"pra ʊl","p":"vi.vt.","c":"潛行 (於)","es":"The cat would prowl around the garden at night, looking for mice.","cs":"這隻貓會在晚上潛行於花園，尋找老鼠。","d":""},{"id":4012,"l":6,"w":"punctual","k":"`p ʌŋktʃʊəl","p":"adj.","c":"準時的","es":"She is very punctual and always arrives exactly on time.","cs":"她非常準時的，總是準時到達。","d":""},{"id":4013,"l":6,"w":"purify","k":"`pj ʊrə͵faɪ","p":"vt.","c":"淨化；精煉","es":"This device can purify air and remove most allergens.","cs":"這個設備可以淨化空氣並去除大部分過敏原。","d":""},{"id":4014,"l":6,"w":"purity","k":"`pj ʊrətɪ","p":"n.","c":"純淨","es":"The water was tested for purity before being deemed safe to drink.","cs":"在被認為可以安全飲用之前，水經過了純淨的測試。","d":""},{"id":4015,"l":6,"w":"qualification","k":"͵kw ɑləfə`keʃən","p":"n.","c":"資格","es":"Having a degree is a basic qualification for this job.","cs":"擁有學位是這份工作的基本資格。","d":""},{"id":4016,"l":6,"w":"quarrelsome","k":"`kw ɔrəlsəm","p":"adj.","c":"喜歡爭吵的","es":"The quarrelsome neighbor always complains about small issues.","cs":"這個喜歡爭吵的鄰居總是抱怨小問題。","d":""},{"id":4017,"l":6,"w":"quench","k":"kw ɛntʃ","p":"vt.vi.","c":"熄滅 vt.解(渴)；壓制","es":"The cold water was perfect to quench his thirst after the run.","cs":"跑完步後，冷水是解渴的完美選擇。","d":""},{"id":4018,"l":6,"w":"query","k":"`kw ɪrɪ","p":"n.vt.vi.","c":"詢問","es":"The customer service representative answered my query promptly.","cs":"客戶服務代表迅速回答了我的詢問。","d":""},{"id":4019,"l":6,"w":"questionnaire","k":"͵kw ɛstʃən`ɛr","p":"n.","c":"問卷","es":"We asked employees to fill out a brief questionnaire about job satisfaction.","cs":"我們要求員工填寫一份關於工作滿意度的簡短問卷。","d":""},{"id":4020,"l":6,"w":"racism","k":"`res ɪzəm","p":"n.","c":"種族主義","es":"We must actively fight against all forms of racism in society.","cs":"我們必須積極對抗社會中所有形式的種族主義。","d":""},{"id":4021,"l":6,"w":"radiant","k":"`redj ənt","p":"adj.","c":"光芒四射的 ；容光煥發的","es":"Her face was radiant with joy as she accepted the award.","cs":"當她接受獎項時，她的臉光芒四射的充滿喜悅。","d":""},{"id":4022,"l":6,"w":"radiate","k":"`red ɪ͵et","p":"vi.","c":"輻射 vi.vt.散發；流露","es":"Heat can radiate from a fire and warm the surrounding area.","cs":"熱量可以從火中輻射，溫暖周圍的區域。","d":""},{"id":4023,"l":6,"w":"radiation","k":"͵red ɪ`eʃən","p":"n.","c":"輻射；發光","es":"The hospital uses radiation therapy to treat certain types of cancer.","cs":"醫院使用輻射治療來治療某些類型的癌症。","d":""},{"id":4024,"l":6,"w":"radiator","k":"`red ɪ͵etɚ","p":"n.","c":"散熱器；輻射體","es":"The car's engine overheated because the radiator was broken.","cs":"汽車的引擎過熱是因為散熱器壞了。","d":""},{"id":4025,"l":6,"w":"radical","k":"`ræ d ɪk!","p":"adj.","c":"根本的；激進的 n.根(號)；部首；激進份子","es":"The political party proposed a radical change to the healthcare system.","cs":"這個政黨對醫療保健系統提出了根本的改變。","d":""},{"id":4026,"l":6,"w":"raft","k":"ræ ft","p":"n.","c":"橡皮艇；木筏 vt.vi.乘筏 (渡河 )","es":"We used an inflatable raft to cross the small lake.","cs":"我們使用了一個充氣橡皮艇來穿過這個小湖。","d":""},{"id":4027,"l":6,"w":"raid","k":"red","p":"n.vt.vi.","c":"襲擊 ,劫掠","es":"The police carried out a surprise raid on the suspected illegal gambling den.","cs":"警方對涉嫌非法賭窩進行了一次突擊襲擊。","d":""},{"id":4028,"l":6,"w":"random","k":"`ræ nd əm","p":"n.","c":"任意行動 adj.隨機的","es":"We selected the participants in a random fashion.","cs":"我們以隨機的方式選擇了參與者。","d":""},{"id":4029,"l":6,"w":"ransom","k":"`ræ ns əm","p":"n.","c":"贖金","es":"The kidnappers demanded a large ransom for the safe return of the hostage.","cs":"綁架者要求一筆巨額贖金以安全歸還人質。","d":""},{"id":4030,"l":6,"w":"rash","k":"ræ ʃ ":""},{"id":4204,"l":6,"w":"superiority","k":"s ə͵pɪrɪ`ɔrətɪ","p":"n.","c":"優越","es":"The team's victory proved their clear superiority over their opponents.","cs":"該隊的勝利證明了他們對對手明顯的優越。","d":""},{"id":4205,"l":6,"w":"supersonic","k":"͵sup ɚ`sɑnɪk","p":"adj.n.","c":"超音波 (的)","es":"The military jet was capable of flying at supersonic speeds.","cs":"這架軍用噴射機有能力以超音波的速度飛行。","d":""},{"id":4206,"l":6,"w":"superstitious","k":"͵sup ɚ`stɪʃəs","p":"adj.","c":"迷信的","es":"He is superstitious and avoids walking under ladders.","cs":"他是迷信的，避免從梯子下走過。","d":""},{"id":4207,"l":6,"w":"supervision","k":"͵sup ɚ`vɪʒən","p":"n.","c":"監督","es":"Children under the age of 12 must be under adult supervision at all times.","cs":"12 歲以下的兒童必須始終在成人的監督下。","d":""},{"id":4208,"l":6,"w":"supplement","k":"`s ʌpləmənt","p":"n.","c":"增補；補給品","es":"I take a vitamin D supplement every morning.","cs":"我每天早上服用維生素 D 的補給品。","d":""},{"id":4209,"l":6,"w":"surpass","k":"s ɚ`pæ s","p":"vt.","c":"勝過","es":"The runner hoped to surpass the world record in the marathon.","cs":"這位跑者希望在馬拉松中勝過世界紀錄。","d":""},{"id":4210,"l":6,"w":"surplus","k":"`s ɝpləs","p":"n.adj.","c":"過剩 (的)；剩餘物","es":"The company sold off its surplus inventory at a reduced price.","cs":"該公司以降低的價格出售了過剩的庫存。","d":""},{"id":4211,"l":6,"w":"suspense","k":"s ə`spɛns","p":"n.","c":"懸而不決；暫停","es":"The movie builds incredible suspense as the hero chases the villain.","cs":"英雄追逐反派時，電影營造了令人難以置信的懸而不決。","d":""},{"id":4212,"l":6,"w":"suspension","k":"s ə`spɛnʃən","p":"n.","c":"懸吊；暫停","es":"The new car features an improved suspension system for a smoother ride.","cs":"這輛新車具有改進的懸吊系統，可實現更平穩的乘坐。","d":""},{"id":4213,"l":6,"w":"swap","k":"sw ɑp","p":"vt.vi.n.","c":"交換","es":"I offered to swap my dessert for his appetizer.","cs":"我提議交換我的甜點和他的開胃菜。","d":""},{"id":4214,"l":6,"w":"symbolic","k":"s ɪm`bɑlɪk","p":"adj.","c":"象徵的","es":"The dove is symbolic of peace and hope.","cs":"鴿子是象徵和平與希望的。","d":""},{"id":4215,"l":6,"w":"symbolize","k":"`s ɪmb!͵a ɪz","p":"vt.vi.","c":"象徵","es":"The crown and scepter symbolize the power of the monarch.","cs":"皇冠和權杖象徵著君主的權力。","d":""},{"id":4216,"l":6,"w":"symmetry","k":"`s ɪmɪtrɪ","p":"n.","c":"對稱 (性)","es":"The artist carefully ensured the perfect symmetry of the statue.","cs":"這位藝術家仔細確保了雕像的完美對稱性。","d":""},{"id":4217,"l":6,"w":"symptom","k":"`s ɪmptəm","p":"n.","c":"症狀","es":"A high fever is a common symptom of the flu.","cs":"高燒是流感的常見症狀。","d":""},{"id":4218,"l":6,"w":"synonym","k":"`s ɪnə͵nɪm","p":"n.","c":"同義字","es":"\"Happy\" is a synonym for \"joyful.\"","cs":"「Happy」是「joyful」的同義字。","d":""},{"id":4219,"l":6,"w":"synthetic","k":"s ɪn`θɛtɪk","p":"adj.","c":"合成的","es":"The jacket is made of a waterproof synthetic material.","cs":"這件夾克是由防水的合成材料製成的。","d":""},{"id":4220,"l":6,"w":"tact","k":"tæ kt","p":"n.","c":"老練；機智；圓滑","es":"He handled the sensitive situation with great tact and diplomacy.","cs":"他以極大的老練和外交手腕處理了這個敏感的情況。","d":""},{"id":4221,"l":6,"w":"tactic","k":"`tæ kt ɪk","p":"n.","c":"戰術；策略","es":"The coach devised a new tactic for the second half of the game.","cs":"教練為比賽的下半場設計了一個新的戰術。","d":""},{"id":4222,"l":6,"w":"tariff","k":"`tæ r ɪf","p":"n.","c":"關稅；稅率","es":"The government plans to impose a new tariff on imported goods.","cs":"政府計劃對進口商品徵收新的關稅。","d":""},{"id":4223,"l":6,"w":"tedious","k":"`tid ɪəs","p":"adj.","c":"冗長乏味的","es":"I found the process of filling out the forms to be extremely tedious.","cs":"我發現填寫表格的過程是極其冗長乏味的。","d":""},{"id":4224,"l":6,"w":"temperament","k":"`t ɛmprəmənt","p":"n.","c":"氣質；性情","es":"She has a calm and patient temperament, which makes her a good teacher.","cs":"她具有平靜和耐心的氣質，這使她成為一名好老師。","d":""},{"id":4225,"l":6,"w":"tempest","k":"`t ɛmpɪst","p":"n.","c":"暴風雨；騷動","es":"The small fishing boat was tossed violently in the sudden tempest.","cs":"這艘小漁船在突然的暴風雨中被猛烈地拋擲。","d":""},{"id":4226,"l":6,"w":"terminate","k":"`t ɝmə͵net","p":"vt.vi.","c":"( 使)終止","es":"The company decided to terminate the contract due to repeated breaches.","cs":"由於屢次違約，該公司決定終止合約。","d":""},{"id":4227,"l":6,"w":"textile","k":"`t ɛkstaɪl","p":"n.","c":"紡織品 adj.紡織的","es":"The city has a long history as a center for textile manufacturing.","cs":"這座城市作為紡織品製造中心有著悠久的歷史。","d":""},{"id":4228,"l":6,"w":"texture","k":"`t ɛkstʃɚ","p":"n.","c":"質地；構造","es":"The cake had a light and fluffy texture.","cs":"這個蛋糕有輕盈蓬鬆的質地。","d":""},{"id":4229,"l":6,"w":"theatrical","k":"θ ɪ`æ trɪk!","p":"adj.","c":"戲劇的；誇張的","es":"The performance was very dramatic and theatrical.","cs":"這場表演非常戲劇的且誇張的。","d":""},{"id":4230,"l":6,"w":"theft","k":"θ ɛft","p":"n.","c":"偷竊","es":"He reported the theft of his wallet to the police.","cs":"他向警方報告了他的錢包被偷竊。","d":""},{"id":4231,"l":6,"w":"theoretical","k":"͵θi ə`rɛtɪk!","p":"adj.","c":"理論的","es":"The students discussed the theoretical implications of the scientific finding.","cs":"學生們討論了這項科學發現的理論的影響。","d":""},{"id":4232,"l":6,"w":"therapist","k":"`θ ɛrəpɪst","p":"n.","c":"特定療法技師","es":"He is seeing a physical therapist to recover from his knee injury.","cs":"他正在看一位物理治療技師以從膝蓋受傷中恢復。","d":""},{"id":4233,"l":6,"w":"therapy","k":"`θ ɛrəpɪ","p":"n.","c":"治療；療法","es":"Art therapy can be helpful for people dealing with emotional trauma.","cs":"藝術療法對處理情緒創傷的人來說可能是有幫助的。","d":""},{"id":4234,"l":6,"w":"thereafter","k":"ð ɛr`æ ft ɚ","p":"advt.","c":"之後","es":"He graduated from college and thereafter began his career in law.","cs":"他大學畢業，之後開始了他的法律生涯。","d":""},{"id":4235,"l":6,"w":"thereby","k":"ð ɛr`baɪ","p":"advt.","c":"由此；從而","es":"He saved a significant amount of money, thereby allowing him to travel more.","cs":"他節省了大量金錢，從而使他能夠旅行更多。","d":""},{"id":4236,"l":6,"w":"thermometer","k":"θ ɚ`mɑmətɚ","p":"n.","c":"溫度計","es":"I used a thermometer to check the child's temperature.","cs":"我用溫度計檢查孩子的溫度。","d":""},{"id":4237,"l":6,"w":"threshold","k":"`θr ɛʃhold","p":"n.","c":"門檻；開端","es":"The company is on the threshold of a major breakthrough.","cs":"這家公司處於一項重大突破的門檻。","d":""},{"id":4238,"l":6,"w":"thrift","k":"θr ɪft","p":"n.","c":"節儉","es":"His habit of thrift allowed him to save enough money to buy a house.","cs":"他節儉的習慣使他能夠存夠錢買房子。","d":""},{"id":4239,"l":6,"w":"thrifty","k":"`θr ɪftɪ","p":"adj.","c":"節儉的；茂盛的","es":"She is a thrifty shopper who always looks for discounts.","cs":"她是一位節儉的購物者，總是尋找折扣。","d":""},{"id":4240,"l":6,"w":"thrive","k":"θra ɪv","p":"vi.","c":"興旺；繁榮","es":"The small business continued to thrive despite the economic downturn.","cs":"這家小企業儘管經濟衰退仍繼續興旺。","d":""},{"id":4241,"l":6,"w":"throb","k":"θr ɑb","p":"vi.n.","c":"跳動；悸動","es":"His head began to throb with a dull, persistent pain.","cs":"他的頭開始伴隨著一種遲鈍、持續的疼痛悸動。","d":""},{"id":4242,"l":6,"w":"toll","k":"tol","p":"n.","c":"通行費；傷亡人數；鐘聲 vt.vi徵稅； (緩慢而反覆地 )敲(鐘)","es":"The hurricane took a heavy toll on the coastal communities, causing many injuries and deaths.","cs":"颶風對沿海社區造成了沉重的傷亡人數。","d":""},{"id":4243,"l":6,"w":"topple","k":"`t ɑp!","p":"vt.vi.","c":"( 使) 倒塌","es":"The strong wind might topple the old, unstable fence.","cs":"強風可能會使不穩定的舊圍欄倒塌。","d":""},{"id":4244,"l":6,"w":"tornado","k":"t ɔr`nedo","p":"n.","c":"龍捲風","es":"The sudden tornado caused widespread destruction across the plain.","cs":"突然的龍捲風在平原上造成了廣泛的破壞。","d":""},{"id":4245,"l":6,"w":"trait","k":"tret","p":"n.","c":"特徵；少許","es":"Honesty is an important trait in a friend.","cs":"誠實是朋友的一個重要特徵。","d":""},{"id":4246,"l":6,"w":"tranquil","k":"`træŋkw ɪl","p":"adj.","c":"平靜的","es":"The cabin is located beside a tranquil mountain stream.","cs":"小木屋位於一條平靜的山間溪流旁。","d":""},{"id":4247,"l":6,"w":"tranquilizer","k":"`træŋkw ɪ͵laɪzɚ","p":"n.","c":"鎮定劑","es":"The veterinarian gave the nervous animal a tranquilizer before the procedure.","cs":"獸醫在手術前給這隻緊張的動物服用了鎮定劑。","d":""},{"id":4248,"l":6,"w":"transaction","k":"træ n`zæ k ʃən","p":"n.","c":"交易；辦理","es":"All credit card transactions must be approved instantly.","cs":"所有信用卡交易必須立即辦理。","d":""},{"id":4249,"l":6,"w":"transcript","k":"`træn͵skr ɪpt","p":"n.","c":"抄本；成績單","es":"I need to order an official transcript of my university grades.","cs":"我需要訂購一份我大學成績的官方抄本。","d":""},{"id":4250,"l":
