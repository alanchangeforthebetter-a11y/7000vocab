."},{"id":822,"l":3,"w":"rust","k":"rʌst","p":"n.vt.vi.","c":"鏽，鐵鏽 ；生鏽","es":"The old bicycle chain was covered in rust.","cs":"舊自行車鏈條上覆蓋著鐵鏽。","d":"A reddish- or yellowish-brown flaky coating of iron oxide formed on iron or steel by oxidation."},{"id":823,"l":3,"w":"rusty","k":"ˋrʌstɪ","p":"adj.","c":"生鏽的；變遲鈍的","es":"The abandoned car was entirely rusty.","cs":"這輛被遺棄的汽車完全生鏽了。","d":"Affected by rust; impaired in skill by lack of practice."},{"id":824,"l":3,"w":"sack","k":"sæ k","p":"n.","c":"粗布袋；麻袋","es":"The farmer filled the sack with potatoes.","cs":"農夫用馬鈴薯裝滿了這個麻袋。","d":"A large bag made of coarse woven material; to dismiss from employment."},{"id":825,"l":3,"w":"sake","k":"sek","p":"n.","c":"理由；緣故","es":"We should do this for the sake of our children.","cs":"為了我們的緣故，我們應該這麼做。","d":"For the purpose or benefit of; Japanese alcoholic drink made from rice."},{"id":826,"l":3,"w":"satisfactory","k":"͵sæ tɪsˋfækt ərɪ","p":"adj.","c":"令人滿意的","es":"The test results were satisfactory but not excellent.","cs":"考試結果是令人滿意的，但並不優秀。","d":"Fulfilling expectations or needs; adequate."},{"id":827,"l":3,"w":"saucer","k":"ˋsɔsɚ","p":"n.","c":"淺碟","es":"The teacup sat neatly on the small saucer.","cs":"茶杯整齊地放在小茶碟上。","d":"A small, shallow dish on which a cup stands."},{"id":828,"l":3,"w":"sausage","k":"ˋsɔsɪdʒ","p":"n.","c":"香腸，臘腸","es":"We grilled some sausages for the backyard barbecue.","cs":"我們烤了一些香腸作為後院燒烤。","d":"A food typically made from ground meat, fat, and spices packed in a cylindrical casing."},{"id":829,"l":3,"w":"savings","k":"ˋsevɪŋz","p":"n.","c":"儲金，存款","es":"He used his life savings to start his own business.","cs":"他用他畢生的積蓄開創了自己的事業。","d":"The money one has saved, especially through a bank or other official scheme."},{"id":830,"l":3,"w":"scale","k":"skel","p":"n.","c":"刻度；尺度；大小；規模","es":"The map had a scale of one centimeter to one kilometer.","cs":"這張地圖的比例尺是一公分比一公里。","d":"A series of marks at regular intervals for measuring; a set of levels; overlapping protective plates on a fish."},{"id":831,"l":3,"w":"scarce","k":"skɛrs","p":"adj.","c":"缺乏的；不足的","es":"Water is a scarce resource in the desert region.","cs":"在沙漠地區，水是一種稀缺的資源。","d":"(Especially of food, money, or resources) insufficient for the demand; rare."},{"id":832,"l":3,"w":"scarecrow","k":"ˋskɛr͵kro","p":"n.","c":"稻草人","es":"A scarecrow stood in the field to protect the crops.","cs":"一個稻草人站在田裡保護莊稼。","d":"An effigy (figure) in a field to frighten birds away from crops."},{"id":833,"l":3,"w":"scarf","k":"skɑrf","p":"n.","c":"圍巾；披巾","es":"She wrapped a warm woolen scarf around her neck.","cs":"她用一條溫暖的羊毛圍巾圍住了脖子。","d":"A length or square of fabric worn around the neck or head for warmth or decoration."},{"id":834,"l":3,"w":"scary","k":"ˋskɛrɪ","p":"adj.","c":"可怕的﹐駭人的","es":"The movie was too scary for the young children.","cs":"這部電影對年幼的孩子來說太嚇人了。","d":"Frightening; causing fear."},{"id":835,"l":3,"w":"scatter","k":"ˋskæt ɚ","p":"n.vt.vi.","c":"撒；使分散","es":"The children loved to scatter crumbs for the birds.","cs":"孩子們喜歡撒麵包屑給鳥吃。","d":"To throw in various random directions; disperse."},{"id":836,"l":3,"w":"schedule","k":"ˋskɛdʒʊl","p":"n.","c":"時間表；課程表","es":"We need to schedule a meeting for next Tuesday.","cs":"我們需要安排下週二的會議。","d":"A plan for carrying out a process or sequence of activities, specifying the expected times."},{"id":837,"l":3,"w":"scholar","k":"ˋskɑlɚ","p":"n.","c":"學者","es":"He is a respected scholar of ancient history.","cs":"他是一位受人尊敬的古代歷史學者。","d":"A specialist in a particular branch of study, especially the humanities; an academic."},{"id":838,"l":3,"w":"scholarship","k":"ˋskɑlɚ͵ʃɪp","p":"n.","c":"獎學金","es":"She received a full scholarship to attend the university.","cs":"她獲得全額獎學金上大學。","d":"Academic study or achievement; a grant or payment made to support a student's education."},{"id":839,"l":3,"w":"scientific","k":"͵saɪənˋtɪfɪk","p":"adj.","c":"科學的","es":"We need to find a scientific explanation for this phenomenon.","cs":"我們需要為這種現象找到一個科學的解釋。","d":"Based on or characterized by the methods and principles of science."},{"id":840,"l":3,"w":"scoop","k":"skup","p":"n.vt.","c":"勺子；舀；鏟 ；用勺舀，用鏟子鏟","es":"I'll have a double scoop of chocolate ice cream.","cs":"我要兩球巧克力冰淇淋。","d":"A deep, rounded long-handled spoon used for serving; to gather up."},{"id":841,"l":3,"w":"scout","k":"skaʊt","p":"n.","c":"偵察兵；偵察機；童子軍；球探，星探","es":"The boy scout learned how to build a fire without matches.","cs":"男童軍學會了如何在沒有火柴的情況下生火。","d":"A person sent out ahead of a main body of troops or travelers to gather information; to search."},{"id":842,"l":3,"w":"scream","k":"skrim","p":"n.vt.vi.","c":"尖叫","es":"She let out a loud scream when she saw the mouse.","cs":"她看到老鼠時發出了一聲大尖叫。","d":"A long, loud, piercing cry expressing extreme emotion or pain."},{"id":843,"l":3,"w":"screw","k":"skru","p":"n. vt.vi.","c":"螺釘；旋，擰","es":"You need a screwdriver to tighten this loose screw.","cs":"你需要一把螺絲刀來擰緊這個鬆動的螺絲。","d":"A short, slender, sharp-pointed metal pin with a raised helical thread running around it."},{"id":844,"l":3,"w":"scrub","k":"skrʌb","p":"vt.vi.","c":"用力擦洗","es":"I need to scrub the kitchen floor until it shines.","cs":"我需要刷洗廚房地板直到它發光。","d":"To rub (someone or something) hard to clean them."},{"id":845,"l":3,"w":"seal1","k":"sil","p":"n.","c":"海豹","es":"He licked the envelope and pressed down to seal it.","cs":"他舔了信封並按下去封好。","d":"A marine mammal with flippers, living mainly in cold regions."},{"id":846,"l":3,"w":"seal2","k":"sil","p":"n.vt.","c":"印章；封 (印) ；封，密封；蓋章","es":"We saw a large seal basking on the rocks by the sea.","cs":"我們看到一隻大海豹在海邊的岩石上曬太陽。","d":"A device or material used to close or fasten something to prevent fluid or air from passing through."},{"id":847,"l":3,"w":"secondary","k":"ˋsɛkən͵dɛrɪ","p":"adj.","c":"第二的；次要的；(教育、學校等 )中等的","es":"My secondary concern is the budget, after the safety issues.","cs":"在安全問題之後，我次要的擔憂是預算。","d":"Coming after, less important than, or resulting from someone or something else."},{"id":848,"l":3,"w":"security","k":"sɪˋkjʊrətɪ","p":"n.","c":"安全；保安；證券","es":"Airport security checked everyone's bags carefully.","cs":"機場安全部門仔細檢查了每個人的行李。","d":"The state of being free from danger or threat."},{"id":849,"l":3,"w":"seek","k":"sik","p":"vt.vi.","c":"尋找；探索","es":"He decided to seek professional advice from a lawyer.","cs":"他決定向律師尋求專業建議。","d":"To attempt to find or obtain (something)."},{"id":850,"l":3,"w":"seize","k":"siz","p":"vt.vi.","c":"抓住；捉住","es":"The police were ordered to seize all illegal goods.","cs":"警察被命令沒收所有非法物品。","d":"To take hold of (something) suddenly and forcibly."},{"id":851,"l":3,"w":"seldom","k":"ˋsɛldəm","p":"advt.","c":"不常，很少","es":"Because of her busy schedule, she seldom goes out.","cs":"由於日程繁忙，她很少外出。","d":"Not often; rarely."},{"id":852,"l":3,"w":"sensible","k":"ˋsɛnsəb!","p":"adj.","c":"明智的；可注意到的","es":"It was a sensible decision to save money for a rainy day.","cs":"存錢以備不時之需是一個明智的決定。","d":"Done or chosen in accordance with wisdom or prudence; practical."},{"id":853,"l":3,"w":"sensitive","k":"ˋsɛnsətɪv","p":"adj.","c":"敏感的；靈敏的","es":"My skin is very sensitive to direct sunlight.","cs":"我的皮膚對陽光直射非常敏感。","d":"Quick to detect or respond to slight changes, signals, or influences; easily offended or hurt."},{"id":854,"l":3,"w":"separation","k":"͵sɛpəˋreʃən","p":"n.","c":"分開；分離；分居","es":"The couple announced their legal separation last week.","cs":"這對夫婦上週宣布了他們的合法分居。","d":"The action or state of moving apart."},{"id":855,"l":3,"w":"sew","k":"sew","p":"vt.vi.","c":"縫合；縫上","es":"My grandmother taught me how to sew a button onto a shirt.","cs":"我奶奶教我如何將鈕扣縫到襯衫上。","d":"To join, mend, or fasten (something) by making stitches with a needle and thread."},{"id":856,"l":3,"w":"sex","k":"sɛks","p":"n.","c":"性別；性，色情；性行為","es":"The form asks for the applicant's sex and age.","cs":"表格要求填寫申請人的性別和年齡。","d":"Either of the two main categories (male and female) into which humans and animals are divided, based on reproductive function."},{"id":857,"l":3,"w":"sexual","k":"ˋsɛkʃʊəl","p":"adj.","c":"性的；性慾的","es":"The company has a strict policy against sexual harassment.","cs":"該公司對性騷擾有嚴格的政策。","d":"Relating to the sexes or to the relations between them."},{"id":858,"l":3,"w":"sexy","k":"ˋsɛksɪ","p":"adj.","c":"性感的","es":"The pop star wore a very sexy outfit for her performance.","cs":"這位流行歌星在表演時穿了一套非常性感的服裝。","d":"Sexually attractive or exciting."},{"id":859,"l":3,"w":"shade","k":"ʃed","p":"n.","c":"蔭；陰涼處","es":"Let's sit in the shade of the tree to avoid the sun.","cs":"我們坐在樹的陰影下以避開陽光。","d":"Comparative darkness and coolness caused by shelter from direct sunlight."},{"id":860,"l":3,"w":"shadow","k":"ˋʃæ do","p":"n.","c":"影子；陰影；幽靈","es":"His shadow stretched long behind him in the setting sun.","cs":"在夕陽下，他的影子在他身後拉得很長。","d":"A dark shape or area produced by an opaque object blocking light."},{"id":861,"l":3,"w":"shady","k":"ˋʃedɪ","p":"adj.","c":"多蔭的","es":"It's pleasant to walk down the shady path in the summer.","cs":"夏天在陰涼的小路上散步很愜意。","d":"Situated in or full of shade; disreputable or dishonest."},{"id":862,"l":3,"w":"shallow","k":"ˋʃæ lo","p":"adj.","c":"淺的膚淺的","es":"The water in the pool's children's area is very shallow.","cs":"游泳池兒童區的水非常淺。","d":"Having only a short distance between the top and the bottom; not deep."},{"id":863,"l":3,"w":"shame","k":"ʃem","p":"n.","c":"羞恥 (心)；恥辱；憾事","es":"It's a shame that the event had to be cancelled.","cs":"這件事不得不取消真是可惜。","d":"A painful feeling of humiliation or distress caused by the consciousness of wrong or foolish behavior."},{"id":864,"l":3,"w":"shampoo","k":"ʃæmˋpu","p":"n.","c":"洗髮精","es":"She bought a new bottle of herbal shampoo.","cs":"她買了一瓶新的草本洗髮精。","d":"A liquid preparation for washing the hair."},{"id":865,"l":3,"w":"shave","k":"ʃev","p":"vt.vi.","c":"刮(鬍)；剃 …毛","es":"He needs to shave his beard before the meeting.","cs":"會議前他需要刮他的鬍子。","d":"To cut the hair off (one's face or body) with a razor."},{"id":866,"l":3,"w":"shepherd","k":"ˋʃɛpɚd","p":"n.","c":"牧羊人","es":"The shepherd led his flock of sheep to the pasture.","cs":"牧羊人將他的羊群趕到牧場。","d":"A person who herds, tends, and guards sheep."},{"id":867,"l":3,"w":"shiny","k":"ˋʃaɪnɪ","p":"adj.","c":"發光的；晴朗的；擦亮的","es":"The new car had a very shiny, polished surface.","cs":"這輛新車有一個非常閃亮、拋光的表面。","d":"Reflecting light, typically because of being smooth or polished."},{"id":868,"l":3,"w":"shorten","k":"ˋʃɔrtn","p":"vt.vi.","c":"變短；縮短","es":"I need to ask the tailor to shorten my trousers.","cs":"我需要請裁縫改短我的褲子。","d":"To make or become shorter."},{"id":869,"l":3,"w":"shortly","k":"ˋʃɔrtlɪ","p":"advt.","c":"立刻，馬上，不久","es":"The train will be arriving shortly.","cs":"火車將很快抵達。","d":"In a short time; soon."},{"id":870,"l":3,"w":"shovel","k":"ˋʃʌv!","p":"n. vt.","c":"鏟子，鐵鍬；用鏟鏟 (起)；用鐵鍬挖","es":"He used a shovel to dig the snow off the driveway.","cs":"他用一把鏟子鏟除車道上的雪。","d":"A tool for lifting and moving loose material (such as snow or soil)."},{"id":871,"l":3,"w":"shrink","k":"ʃrɪŋk","p":"vt.vi.","c":"收縮，縮短；縮水","es":"Be careful not to wash this wool sweater in hot water, or it will shrink.","cs":"小心不要用熱水洗這件羊毛衫，否則它會縮水。","d":"To become or make smaller in size or amount."},{"id":872,"l":3,"w":"sigh","k":"saɪ","p":"n.vi.vt.","c":"嘆氣，嘆息","es":"She let out a deep sigh of relief.","cs":"她長長地嘆了一口氣，鬆了口氣。","d":"To emit a long, deep, audible breath expressing sadness, relief, tiredness, or the like."},{"id":873,"l":3,"w":"signal","k":"ˋsɪgn!","p":"n.","c":"信號；暗號","es":"The traffic light turned green, giving the signal to go.","cs":"紅綠燈變綠，發出了通行的信號。","d":"A gesture, sound, or action used to convey information or instructions."},{"id":874,"l":3,"w":"significant","k":"sɪgˋnɪfəkənt","p":"adj.","c":"有意義的；重要的","es":"The discovery of the new planet is a significant event.","cs":"新行星的發現是一個重要的事件。","d":"Sufficiently important to demand attention; noteworthy."},{"id":875,"l":3,"w":"similarity","k":"͵sɪməˋlærətɪ","p":"n.","c":"相似 ；相似點","es":"There is a strong similarity between the two paintings.","cs":"這兩幅畫之間有很強的相似性。","d":"The state or fact of being similar; resemblance."},{"id":876,"l":3,"w":"sin","k":"sɪn","p":"n.","c":"(宗教或道德上的 )罪","es":"In many religions, greed is considered a sin.","cs":"在許多宗教中，貪婪被認為是一種罪惡。","d":"An immoral act considered to be a transgression against divine law."},{"id":877,"l":3,"w":"sincere","k":"sɪnˋsɪr","p":"adj.","c":"衷心的，真誠的","es":"I offer my sincere apologies for the mistake.","cs":"我為這個錯誤獻上真誠的歉意。","d":"Genuine; proceeding from genuine feelings."},{"id":878,"l":3,"w":"sip","k":"sɪp","p":"n.vi.vt.","c":"啜飲","es":"He took a careful sip of the hot tea.","cs":"他小心翼翼地啜飲了一口熱茶。","d":"To drink (something) by taking small mouthfuls."},{"id":879,"l":3,"w":"situation","k":"͵sɪtʃʊˋeʃən","p":"n.","c":"形勢；情況","es":"The political situation in the region is unstable.","cs":"該地區的政治局勢不穩定。","d":"A set of circumstances in which one finds oneself; a state of affairs."},{"id":880,"l":3,"w":"skate","k":"sket","p":"n.vi.","c":"冰鞋；溜冰","es":"She loves to skate at the outdoor ice rink in winter.","cs":"她喜歡在冬天到戶外溜冰場溜冰。","d":"To glide across a surface on skates (bladed footwear)."},{"id":881,"l":3,"w":"ski","k":"ski","p":"n.vt.vi.","c":"滑雪屐；滑雪板 ；滑雪","es":"We plan to go skiing in the Alps next month.","cs":"我們計畫下個月去阿爾卑斯山滑雪。","d":"One of a pair of long, narrow pieces of wood, plastic, or metal attached to the feet for gliding over snow."},{"id":882,"l":3,"w":"skip","k":"skɪp","p":"vt.vi.","c":"跳躍；跳繩；略過；漏掉","es":"He decided to skip breakfast because he was late.","cs":"他因為遲到了，決定跳過早餐。","d":"To move along lightly, stepping from one foot to the other with a hop; to omit."},{"id":883,"l":3,"w":"skyscraper","k":"ˋskaɪ͵skrep ɚ","p":"n.","c":"摩天樓","es":"New York City is famous for its tall skyscrapers.","cs":"紐約市以其高聳的摩天大樓而聞名。","d":"A very tall building of many stories."},{"id":884,"l":3,"w":"slave","k":"slev","p":"n.","c":"奴隸","es":"Historically, many people were forced to live as slaves.","cs":"歷史上，許多人被迫過著奴隸的生活。","d":"A person who is the legal property of another and is forced to obey them."},{"id":885,"l":3,"w":"sleeve","k":"sliv","p":"n.","c":"袖子；袖套","es":"He rolled up the sleeves of his shirt to do the work.","cs":"他捲起襯衫的袖子來工作。","d":"The part of a garment that covers the arm."},{"id":886,"l":3,"w":"slice","k":"slaɪs","p":"n.vt.","c":"薄片，切片 ；把…切成薄片","es":"I'll have a slice of chocolate cake, please.","cs":"請給我一片巧克力蛋糕。","d":"A thin, broad piece cut from a larger object."},{"id":887,"l":3,"w":"slippery","k":"ˋslɪpərɪ","p":"adj.","c":"滑的；容易滑的","es":"Be careful, the floor is very slippery after the rain.","cs":"小心，下雨後地板很滑。","d":"Difficult to hold or to stand on because of being smooth, wet, or oily."},{"id":888,"l":3,"w":"slope","k":"slop","p":"n.","c":"斜坡；傾斜；坡度","es":"We slowly climbed the steep slope of the hill.","cs":"我們緩慢爬上山丘陡峭的斜坡。","d":"A surface of which one end or side is at a higher level than another; a gradient."},{"id":889,"l":3,"w":"smooth","k":"smuð","p":"adj.","c":"平滑的，光滑的；流暢的","es":"The artist gave the wood a perfectly smooth finish.","cs":"藝術家給木頭一個完全光滑的飾面。","d":"Having an even and regular surface; free from lumps or irregularities."},{"id":890,"l":3,"w":"snap","k":"snæ p","p":"n.vi.vt.","c":"猛咬；突然折斷；快照拍攝","es":"The dry branch made a loud snap when I stepped on it.","cs":"當我踩上去時，乾燥的樹枝發出了一聲響亮的折斷聲。","d":"To break suddenly and completely, typically with a sharp cracking sound."},{"id":891,"l":3,"w":"solid","k":"ˋsɑlɪd","p":"adj. n.","c":"固體的；結實的；固體","es":"The walls of the old fortress are made of solid stone.","cs":"這座古老堡壘的牆壁是由堅固的石頭製成的。","d":"Firm and stable in shape; not liquid or gaseous; strong."},{"id":892,"l":3,"w":"someday","k":"ˋsʌm͵de","p":"advt.","c":"將來有一天","es":"Someday I hope to travel around the world.","cs":"總有一天我希望環遊世界。","d":"At some unspecified time in the future."},{"id":893,"l":3,"w":"somehow","k":"ˋsʌm͵ha ʊ","p":"advt.","c":"以某種方式；不知怎麼的","es":"We lost the key, but we have to get into the house somehow.","cs":"我們弄丟了鑰匙，但我們必須想辦法進屋。","d":"In a way that is not known or specified; by some means."},{"id":894,"l":3,"w":"sometime","k":"ˋsʌm͵taɪm","p":"advt.","c":"在(將來或過去 ) 某一時候","es":"Let's get together for lunch sometime next week.","cs":"我們下週某個時候一起吃午飯吧。","d":"At an unknown or unspecified time."},{"id":895,"l":3,"w":"somewhat","k":"ˈsʌmwɑːt","p":"adv.","c":"有點，稍微","es":"I was somewhat surprised by his sudden decision.","cs":"我對他突然的決定有點驚訝。","d":"To some degree or extent; a little."},{"id":896,"l":3,"w":"sore","k":"sor","p":"adj.","c":"痛的；疼痛發炎的","es":"My throat is very sore from the cold.","cs":"我的喉嚨因為感冒而非常痛。","d":"Painful or aching; a painful, often infected, injury on the body."},{"id":897,"l":3,"w":"sorrow","k":"ˋsɑro","p":"n.","c":"悲痛，悲哀","es":"The family felt great sorrow after the loss of their pet.","cs":"這家人在失去寵物後感到極大的悲傷。","d":"A feeling of deep distress caused by loss, disappointment, or other misfortune; sadness."},{"id":898,"l":3,"w":"spade","k":"sped","p":"n.","c":"鏟；鍬； (撲克牌中的 )黑桃","es":"He used a garden spade to turn the soil.","cs":"他用一把花園鏟翻土。","d":"A tool for digging, with a long handle and a flat blade."},{"id":899,"l":3,"w":"spaghetti","k":"spəˋgɛtɪ","p":"n.","c":"義大利麵條","es":"We had a delicious plate of spaghetti with meat sauce.","cs":"我們吃了一盤美味的肉醬義大利麵。","d":"Pasta in the form of long, thin strings."},{"id":900,"l":3,"w":"specific","k":"spɪˋsɪfɪk","p":"adj.","c":"特殊的，特定的；明確的","es":"The teacher asked for specific examples in the essay.","cs":"老師要求文章中要有具體的例子。","d":"Clearly defined or identified."},{"id":901,"l":3,"w":"spice","k":"spaɪs","p":"n.","c":"香料，調味品","es":"Curry powder is a spice commonly used in Indian cuisine.","cs":"咖哩粉是一種常用於印度菜中的香料。","d":"An aromatic or pungent vegetable substance used to flavor food."},{"id":902,"l":3,"w":"spill","k":"spɪl","p":"vt.vi.n.","c":"溢出；濺出","es":"Be careful not to spill your coffee on the keyboard.","cs":"小心不要把咖啡灑在鍵盤上。","d":"To cause or allow (liquid) to flow over the edge of a container."},{"id":903,"l":3,"w":"spin","k":"spɪn","p":"n.vi.vt.","c":"紡；作 (繭)，結 (網)；使(陀螺等 )旋轉","es":"The dancer gave a graceful spin on one foot.","cs":"舞者單腳優雅地旋轉。","d":"To turn or cause to turn rapidly around an axis."},{"id":904,"l":3,"w":"spit","k":"spɪt","p":"vi.vi.n.","c":"吐口水；吐痰 ；唾液，口水","es":"It is rude to spit in public places.","cs":"在公共場所吐痰是不禮貌的。","d":"To eject saliva forcibly from one's mouth."},{"id":905,"l":3,"w":"spite","k":"spaɪt","p":"n.","c":"惡意；怨恨","es":"He refused to help her out of pure spite.","cs":"他純粹是出於惡意而拒絕幫助她。","d":"A desire to hurt, annoy, or offend someone."},{"id":906,"l":3,"w":"splash","k":"splæʃ","p":"n.vi.vt.","c":"濺，潑","es":"The children loved to splash in the puddles.","cs":"孩子們喜歡在水坑裡潑水。","d":"To cause (liquid) to strike or fall onto something in irregular drops."},{"id":907,"l":3,"w":"spoil","k":"spɔɪl","p":"vt.vi.","c":"損壞；寵壞，溺愛 ；(食物等 )變壞","es":"Don't tell me the ending; don't spoil the movie for me.","cs":"不要告訴我結局；不要破壞我的觀影樂趣。","d":"To diminish or destroy the quality or value of; to harm the character of (a child) by being too lenient."},{"id":908,"l":3,"w":"sprain","k":"spren","p":"n.vt.","c":"扭傷","es":"She managed to sprain her ankle while playing soccer.","cs":"她在踢足球時不小心扭傷了腳踝。","d":"To wrench or twist the ligaments of (an ankle, wrist, or other joint) violently so as to cause pain and swelling."},{"id":909,"l":3,"w":"spray","k":"spre","p":"n.vt.vi.","c":"浪花，水花；噴霧；噴灑","es":"He used a spray bottle to water the plants.","cs":"他用一個噴霧瓶給植物澆水。","d":"Liquid that is forced out of a container in a fine stream or mist; a device that produces such a mist."},{"id":910,"l":3,"w":"sprinkle","k":"ˋsprɪŋk!","p":"vt.vi.","c":"灑，噴淋","es":"She likes to sprinkle cinnamon on her coffee.","cs":"她喜歡在咖啡上撒肉桂粉。","d":"To scatter small drops or particles of a substance over (an object or surface)."},{"id":911,"l":3,"w":"spy","k":"spaɪ","p":"n.vi.vt.","c":"間諜 ；暗中監視","es":"The secret agent worked as a spy for the government.","cs":"這位特工為政府擔任間諜。","d":"A person who secretly obtains information about an enemy or competitor."},{"id":912,"l":3,"w":"squeeze","k":"skwiz","p":"vt.vi.","c":"榨，擠，壓","es":"Squeeze the lemon to get all the juice out.","cs":"擠壓檸檬以榨出所有汁液。","d":"To firmly press (something soft or pliable)."},{"id":913,"l":3,"w":"stab","k":"stæ b","p":"vt.vi.n.","c":"刺，戳","es":"The victim was wounded by a single stab to the shoulder.","cs":"受害者因肩膀上的單一刺傷而受傷。","d":"To thrust a knife or other sharp weapon into (someone)."},{"id":914,"l":3,"w":"stable","k":"ˋsteb!","p":"n.","c":"馬棚；畜舍","es":"The table is not very stable; it wobbles a little.","cs":"這張桌子不太穩固；它有點晃動。","d":"Not likely to change or fail; firmly fixed."},{"id":915,"l":3,"w":"stadium","k":"ˋsted ɪəm","p":"n.","c":"體育場，運動場","es":"The concert will be held at the city's largest stadium.","cs":"音樂會將在該市最大的體育場舉行。","d":"A large, typically open-air structure for sports or entertainment."},{"id":916,"l":3,"w":"staff","k":"stæ f","p":"n.","c":"(全體 )職員， (全體 )工作人員","es":"The hotel staff was very friendly and helpful.","cs":"飯店的員工非常友善和樂於助人。","d":"All the people employed by a particular organization."},{"id":917,"l":3,"w":"stale","k":"stel","p":"adj.","c":"不新鮮的；陳舊的，無新意的","es":"Don't eat that bread; it's gone stale.","cs":"不要吃那個麵包；它已經不新鮮了。","d":"(Of food) no longer fresh or palatable; dry and hard."},{"id":918,"l":3,"w":"stare","k":"stɛr","p":"n.vi.","c":"盯，凝視","es":"It's impolite to stare at people you don't know.","cs":"盯著你不認識的人看是不禮貌的。","d":"To look fixedly or vacantly at someone or something with one's eyes wide open."},{"id":919,"l":3,"w":"starve","k":"stɑrv","p":"vt.vi.","c":"餓死；挨餓","es":"The poor family was close to starving during the winter.","cs":"這個貧困的家庭在冬天差點挨餓。","d":"To suffer or die from hunger."},{"id":920,"l":3,"w":"statue","k":"ˋstæt ʃʊ","p":"n.","c":"雕像，塑像","es":"The bronze statue of the general stands in the town square.","cs":"這尊將軍的青銅雕像矗立在城鎮廣場。","d":"A carved or cast figure of a person or animal, especially one that is life-size or larger."},{"id":921,"l":3,"w":"steady","k":"ˋstɛdɪ","p":"adj.","c":"穩固的，平穩的","es":"She has a steady job with a good salary.","cs":"她有一份薪水不錯的穩定工作。","d":"Firmly fixed, supported, or balanced; not shaking or moving."},{"id":922,"l":3,"w":"steep","k":"stip","p":"adj.","c":"陡峭的","es":"The path up the mountain was very steep.","cs":"上山的路非常陡峭。","d":"(Of a slope or angle) rising or falling sharply; (of a price) unreasonably high."},{"id":923,"l":3,"w":"stepchild","k":"ˋstɛp͵tʃaɪld","p":"n.","c":"前配偶所生的孩子","es":"She treats her stepchild just like her own children.","cs":"她對她的繼子/女就像對待自己的孩子一樣。","d":"A child of one's husband or wife from a previous marriage."},{"id":924,"l":3,"w":"stepfather","k":"ˋstɛp͵fɑðɚ","p":"n.","c":"繼父，後父","es":"My stepfather is a very kind and supportive person.","cs":"我的繼父是一個非常善良和支持我的人。","d":"The husband of one's mother who is not one's biological father."},{"id":925,"l":3,"w":"stepmother","k":"ˋstɛp͵mʌðɚ","p":"n.","c":"繼母，後母","es":"The girl's stepmother helped her with her homework.","cs":"這個女孩的繼母幫助她做功課。","d":"The wife of one's father who is not one's biological mother."},{"id":926,"l":3,"w":"stereo","k":"ˋstɛrɪo","p":"n.adj.","c":"立體音響裝置 ；立體聲的","es":"We listened to the music on the old stereo system.","cs":"我們用舊的立體音響系統聽音樂。","d":"Sound that is directed through two or more speakers to give the listener the impression of spread and depth."},{"id":927,"l":3,"w":"sticky","k":"ˋstɪkɪ","p":"adj.","c":"黏的","es":"The spilled soda made the floor feel sticky.","cs":"灑出來的汽水讓地板感覺很黏。","d":"Tending to adhere to other things; covered with a sticky substance."},{"id":928,"l":3,"w":"stiff","k":"stɪf","p":"adj.","c":"(手足等 )僵直的，僵硬的","es":"My neck feels stiff after sleeping in a strange position.","cs":"睡姿奇怪之後，我的脖子感到僵硬。","d":"Not easily bent or changed in shape; rigid."},{"id":929,"l":3,"w":"sting","k":"stɪŋ","p":"n.vt.vi.","c":"刺，螫，叮","es":"Be careful not to get too close, as the bee might sting you.","cs":"小心不要靠太近，因為蜜蜂可能會刺你。","d":"To wound or pierce with a sharp point or venom; a sharp, painful sensation."},{"id":930,"l":3,"w":"stir","k":"stɝ","p":"vt.vi.","c":"攪拌，攪動；煽動","es":"Stir the soup until all the ingredients are mixed.","cs":"攪拌湯直到所有食材混合均勻。","d":"To mix (a substance) by moving a spoon or implement around in it."},{"id":931,"l":3,"w":"stitch","k":"stɪtʃ","p":"n.","c":"一針；針腳； (縫合傷口的 )針線","es":"The doctor put three stitches in her cut.","cs":"醫生在她的傷口上縫了三針。","d":"A single turn or loop of thread or yarn in sewing or knitting."},{"id":932,"l":3,"w":"stocking(s)","k":"ˋstɑkɪŋ","p":"n.","c":"長襪","es":"Santa Claus fills the children's stockings with gifts.","cs":"聖誕老人會用禮物填滿孩子們的長襪。","d":"A long, elastic garment covering the foot and leg, often reaching to the knee or thigh."},{"id":933,"l":3,"w":"stool","k":"stul","p":"n.","c":"凳子","es":"He sat on a small wooden stool at the counter.","cs":"他坐在櫃檯旁的一個小木凳上。","d":"A single seat without a back or armrests."},{"id":934,"l":3,"w":"stormy","k":"ˋstɔrmɪ","p":"adj.","c":"暴風雨的；暴躁的","es":"We stayed home because of the stormy weather.","cs":"因為暴風雨天氣，我們待在家裡。","d":"Characterized by or involving a storm; full of angry or violent outbursts."},{"id":935,"l":3,"w":"strategy","k":"ˋstræt ədʒɪ","p":"n.","c":"戰略；策略","es":"The military commander devised a new combat strategy.","cs":"這位軍事指揮官制定了新的戰鬥策略。","d":"A plan of action or policy designed to achieve a major or overall aim."},{"id":936,"l":3,"w":"strength","k":"strɛŋθ","p":"n.","c":"力，力量","es":"Lifting weights helps build physical strength.","cs":"舉重有助於增強身體力量。","d":"The quality or state of being physically strong; the power to resist force."},{"id":937,"l":3,"w":"strip1","k":"strɪp","p":"vt.vi.","c":"剝去；剝奪","es":"She tore the cloth into long, narrow strips.","cs":"她將布撕成又長又窄的條狀物。","d":"A long, narrow piece of something."},{"id":938,"l":3,"w":"strip2","k":"strɪp","p":"n.","c":"條，帶； (報紙等 )連環漫畫","es":"The sign said not to strip the bark from the trees.","cs":"標誌說不要剝下樹上的樹皮。","d":"To remove all covering from."},{"id":939,"l":3,"w":"structure","k":"ˋstrʌktʃɚ","p":"n.","c":"結構；構造","es":"The bridge has a unique steel structure.","cs":"這座橋有一個獨特的鋼結構。","d":"The arrangement of and relations between the parts or elements of a complex whole."},{"id":940,"l":3,"w":"stubborn","k":"ˋstʌbɚn","p":"adj.","c":"固執的，頑固的","es":"He is too stubborn to admit he was wrong.","cs":"他太固執了，不肯承認自己錯了。","d":"Having or showing determined resistance to change; obstinate."},{"id":941,"l":3,"w":"studio","k":"ˋstjud ɪ͵o","p":"n.","c":"(畫家等的 )工作室；攝影棚；製片廠","es":"The artist works in a small studio located downtown.","cs":"這位藝術家在市中心的一個小工作室裡工作。","d":"The workroom of a painter, sculptor, or photographer; a place where films or broadcasts are made."},{"id":942,"l":3,"w":"stuff1","k":"stʌf","p":"n.","c":"物品，東東【口】","es":"The drawer is full of useful stuff like pens and paper clips.","cs":"這個抽屜裡裝滿了筆和迴紋針等有用的東西。","d":"A substance, material, or group of objects; to fill (a space or container) tightly."},{"id":943,"l":3,"w":"stuff2","k":"stʌf","p":"n. vt.","c":"填充物；裝；填；塞","es":"She likes to stuff the turkey with bread and herbs.","cs":"她喜歡用麵包和香草填塞火雞。","d":"A substance, material, or group of objects; to fill (a space or container) tightly."},{"id":944,"l":3,"w":"style","k":"staɪl","p":"n.","c":"風格，作風；種類，型","es":"The new clothing line has a very modern style.","cs":"這個新服裝系列有非常現代的風格。","d":"A distinctive manner of doing something or of presenting oneself; fashion."},{"id":945,"l":3,"w":"substance","k":"ˋsʌbstəns","p":"n.","c":"物質","es":"Scientists analyzed the unknown substance found at the scene.","cs":"科學家們分析了在現場發現的未知物質。","d":"Matter with a particular composition; the real physical matter of which a person or thing consists."},{"id":946,"l":3,"w":"suburb","k":"ˋsʌbɝb","p":"n.","c":"郊區","es":"They live in a quiet suburb just outside the city center.","cs":"他們住在市中心外一個安靜的郊區。","d":"An outlying district of a city, especially a residential one."},{"id":947,"l":3,"w":"suck","k":"sʌk","p":"vt. vi.","c":"吸，吮；吸，吮； 【俚】爛；令人討厭","es":"The baby likes to suck his thumb when he is tired.","cs":"嬰兒疲倦時喜歡吸吮他的拇指。","d":"To draw (something) into the mouth by contracting the muscles of the lips and cheeks."},{"id":948,"l":3,"w":"suffer","k":"ˋsʌfɚ","p":"vt. vi.","c":"遭受；受苦；患病","es":"Many people suffer from allergies in the spring.","cs":"許多人在春天遭受過敏之苦。","d":"To experience or be subjected to (something bad or unpleasant)."},{"id":949,"l":3,"w":"sufficient","k":"səˋfɪʃənt","p":"adj.","c":"足夠的，充分的","es":"We have sufficient time to finish the project before the deadline.","cs":"我們有足夠的時間在截止日期前完成這個專案。","d":"Enough; adequate."},{"id":950,"l":3,"w":"suggest","k":"səˋdʒɛst","p":"vt.","c":"建議；暗示","es":"I suggest we take a break now and continue later.","cs":"我建議我們現在休息一下，稍後再繼續。","d":"To put forward for consideration."},{"id":951,"l":3,"w":"suicide","k":"ˋsuə͵saɪd","p":"n.vt.vi.","c":"自殺","es":"The police ruled the death a suicide.","cs":"警方裁定這起死亡事件為自殺。","d":"The act of intentionally causing one's own death."},{"id":952,"l":3,"w":"suitable","k":"ˋsutəb!","p":"adj.","c":"適當的；合適的","es":"This film is not suitable for young children.","cs":"這部電影不適合年幼的兒童觀看。","d":"Right or appropriate for a particular person, purpose, or situation."},{"id":953,"l":3,"w":"sum","k":"sʌm","p":"n. vt.","c":"總數，總和；概要；合計；總結","es":"We need to calculate the sum of all the expenses.","cs":"我們需要計算所有費用的總和。","d":"The total amount resulting from the addition of two or more numbers."},{"id":954,"l":3,"w":"summary","k":"ˋsʌmərɪ","p":"n.","c":"總結，摘要","es":"Please provide a short summary of the meeting minutes.","cs":"請提供一份簡短的會議記錄摘要。","d":"A brief statement or account of the main points of something."},{"id":955,"l":3,"w":"summit","k":"ˋsʌmɪt","p":"n.","c":"(山等 )尖峰，峰頂","es":"The climbers reached the summit of the mountain at dawn.","cs":"登山者在黎明時到達了山頂。","d":"The highest point of a hill or mountain; a meeting between heads of government."},{"id":956,"l":3,"w":"superior","k":"səˋpɪrɪɚ","p":"adj.","c":"較高的，上級的；較好的，優秀的","es":"This model is technically superior to its predecessor.","cs":"這個型號在技術上優於其前身。","d":"Higher in rank, status, or quality."},{"id":957,"l":3,"w":"suppose","k":"səˋpoz","p":"vt.vi.","c":"猜想，以為；假定","es":"I suppose it's going to rain later, but I'm not certain.","cs":"我猜想等一下可能會下雨，但我不確定。","d":"To assume that something is true or certain."},{"id":958,"l":3,"w":"surround","k":"səˋraʊnd","p":"vt.","c":"圍繞；包圍","es":"A high fence was built to surround the construction site.","cs":"建造了一道高高的圍牆來環繞施工現場。","d":"To be all around (someone or something)."},{"id":959,"l":3,"w":"survey","k":"sɚˋve","p":"n.vt.vi.","c":"測量，勘測；調查","es":"We conducted a survey to find out customer satisfaction.","cs":"我們進行了一項調查以了解客戶滿意度。","d":"To look at or examine comprehensively; to collect data on an area or subject."},{"id":960,"l":3,"w":"survival","k":"sɚˋvaɪv!","p":"n.","c":"倖存","es":"The documentary showed the difficult survival in the desert.","cs":"紀錄片展示了在沙漠中艱難的生存。","d":"The state or fact of continuing to live or exist, typically in spite of an accident or ordeal."},{"id":961,"l":3,"w":"survivor","k":"sɚˋvaɪvɚ","p":"n.","c":"倖存者，生還者","es":"There was only one survivor of the plane crash.","cs":"飛機失事中只有一名生還者。","d":"A person who remains alive after an event or ordeal."},{"id":962,"l":3,"w":"suspect","k":"səˋspɛkt","p":"vt.n.","c":"懷疑 ；嫌疑犯","es":"The police have a new suspect in the case.","cs":"警方在這起案件中有一個新的嫌疑犯。","d":"A person thought to be guilty of a crime or offense."},{"id":963,"l":3,"w":"suspicion","k":"səˋspɪʃən","p":"n.","c":"懷疑，疑心","es":"He resigned amid suspicion of fraud.","cs":"他在懷疑詐欺的聲浪中辭職了。","d":"A feeling or belief that someone is guilty of an illegal or dishonest act without having proof."},{"id":964,"l":3,"w":"swear","k":"swɛr","p":"vt.vi.","c":"發誓；罵髒話","es":"I promise I will tell the truth; I swear it.","cs":"我保證我會說實話；我發誓。","d":"To use offensive language; to make a solemn promise."},{"id":965,"l":3,"w":"sweat","k":"swɛt","p":"n.vi.","c":"汗，汗水；出汗","es":"He was covered in sweat after running the marathon.","cs":"跑完馬拉松後，他全身都是汗水。","d":"Moisture excreted through the pores of the skin, typically in response to heat or exertion."},{"id":966,"l":3,"w":"swell","k":"swɛl","p":"vt.vi.","c":"腫起，腫脹","es":"Her ankle began to swell after she twisted it.","cs":"她的腳踝扭傷後開始腫脹。","d":"To become larger or rounder in size, typically as a result of an accumulation of fluid."},{"id":967,"l":3,"w":"swift","k":"swɪft","p":"adj.","c":"快速的，快捷的","es":"The deer was too swift for the hunters to catch.","cs":"這隻鹿太迅速了，獵人抓不到它。","d":"Happening or moving quickly or immediately."},{"id":968,"l":3,"w":"switch","k":"swɪtʃ","p":"n.vt.","c":"開關；交換 ；打開 (或關掉 )…的開關","es":"Please switch off the lights when you leave the room.","cs":"離開房間時請關掉燈。","d":"A device for making and breaking the connection in an electric circuit; a change or transfer."},{"id":969,"l":3,"w":"sword","k":"sord","p":"n.","c":"劍，刀","es":"The knight pulled his sharp sword from its sheath.","cs":"騎士從劍鞘中拔出了他鋒利的劍。","d":"A weapon with a long metal blade and a hilt."},{"id":970,"l":3,"w":"system","k":"ˋsɪstəm","p":"n.","c":"系統；制度","es":"The company introduced a new filing system.","cs":"公司引入了一個新的檔案系統。","d":"A set of principles or procedures according to which something is done; an organized scheme."},{"id":971,"l":3,"w":"tablet","k":"ˋtæbl ɪt","p":"n.","c":"刻寫板；匾；碑","es":"The doctor prescribed one tablet three times a day.","cs":"醫生開了一天三次，一次一片藥。","d":"A small, flat mass of medicine; a flat piece of stone or wood used for inscription; a portable computer."},{"id":972,"l":3,"w":"tack","k":"tæ k","p":"n.","c":"大頭釘；圖釘","es":"She used a thumb tack to pin the note to the board.","cs":"她用一個大頭釘將便條釘在板子上。","d":"A small, sharp-pointed nail with a broad flat head; a long stitch used for holding fabric temporarily."},{"id":973,"l":3,"w":"tag","k":"tæ g","p":"n. vt.","c":"標籤，貨籤；給…加標籤","es":"The new shirt still had the price tag attached.","cs":"這件新襯衫仍然附有價格標籤。","d":"A label attached to something for identification or to give information."},{"id":974,"l":3,"w":"tailor","k":"ˋtelɚ","p":"n.vt.","c":"裁縫師 ；裁製 (衣服，衣料等 )","es":"I took my new suit to the tailor for adjustments.","cs":"我把我的新西裝拿給裁縫修改。","d":"A person whose job is to make, mend, or alter clothes, especially suits."},{"id":975,"l":3,"w":"tame","k":"tem","p":"adj.","c":"馴服的；溫順的","es":"The lion at the circus was surprisingly tame.","cs":"馬戲團裡的獅子出奇地溫順。","d":"(Especially of an animal) not dangerous or frightened of people; domesticated."},{"id":976,"l":3,"w":"tap1","k":"tæ p","p":"n.","c":"龍頭；塞子","es":"The water from the tap is safe to drink.","cs":"水龍頭裡的水可以安全飲用。","d":"To strike lightly and quickly."},{"id":977,"l":3,"w":"tap2","k":"tæ p","p":"n.vt.vi.","c":"輕拍，輕叩","es":"She gave a quick tap on the window to get his attention.","cs":"她在窗戶上輕輕地敲了一下以引起他的注意。","d":"A device giving control over the flow of a liquid from a pipe or container (faucet)."},{"id":978,"l":3,"w":"tax","k":"tæ ks","p":"n.vt.","c":"稅；稅金；向…課稅","es":"The government plans to increase the sales tax.","cs":"政府計畫提高銷售稅。","d":"A compulsory contribution to state revenue, levied by the government on workers' income and business profits."},{"id":979,"l":3,"w":"tease","k":"tiz","p":"vt.vi.n.","c":"戲弄，逗弄","es":"The older children liked to tease the younger ones.","cs":"年紀較大的孩子喜歡戲弄年紀較小的孩子。","d":"To make fun of or attempt to provoke (someone) in a playful or unkind way."},{"id":980,"l":3,"w":"technical","k":"ˋtɛknɪk!","p":"adj.","c":"技術的；科技的","es":"The machine requires technical knowledge to operate.","cs":"這台機器需要技術知識才能操作。","d":"Relating to a particular subject, art, or craft, or its techniques."},{"id":981,"l":3,"w":"technique","k":"tɛkˋnik","p":"n.","c":"技巧；技術","es":"He learned a new painting technique in the art class.","cs":"他在藝術課上學會了一種新的繪畫技巧。","d":"A skillful or efficient way of doing something."},{"id":982,"l":3,"w":"technology","k":"tɛkˋnɑlədʒɪ","p":"n.","c":"技術；科技","es":"Advancements in technology are changing the way we live.","cs":"科技的進步正在改變我們的生活方式。","d":"The application of scientific knowledge for practical purposes."},{"id":983,"l":3,"w":"temper","k":"ˋtɛmpɚ","p":"n.","c":"性情，脾氣","es":"He has a bad temper and gets angry easily.","cs":"他的脾氣很差，很容易生氣。","d":"A person's state of mind as reflected in their manner and behavior; anger."},{"id":984,"l":3,"w":"temperature","k":"ˋtɛmprətʃɚ","p":"n.","c":"溫度，氣溫；體溫","es":"The temperature dropped quickly after sunset.","cs":"日落後溫度迅速下降。","d":"The degree or intensity of heat present in a substance or object."},{"id":985,"l":3,"w":"temporary","k":"ˋtɛmpə͵rɛrɪ","p":"adj.","c":"臨時的；暫時的","es":"The bridge closure is only temporary for repairs.","cs":"橋樑關閉只是為了維修的暫時措施。","d":"Lasting for only a limited period of time; not permanent."},{"id":986,"l":3,"w":"tend1","k":"tɛnd","p":"vt.vi.","c":"照管，照料 ；服侍； 【口】注意，關心","es":"People who eat less meat tend to be healthier.","cs":"吃較少肉的人傾向於更健康。","d":"To care for or look after; to move in a particular direction."},{"id":987,"l":3,"w":"tend2","k":"tɛnd","p":"vi.","c":"傾向；易於","es":"The farmer will tend to his livestock in the barn.","cs":"農夫將照顧穀倉裡的牲畜。","d":"To care for or look after; to move in a particular direction."},{"id":988,"l":3,"w":"tender","k":"ˋtɛndɚ","p":"adj.","c":"嫩的；柔軟的；溫柔的","es":"The meat was slow-cooked and wonderfully tender.","cs":"這塊肉是慢煮的，吃起來非常嫩。","d":"Easily damaged; sensitive; gentle or kind."},{"id":989,"l":3,"w":"territory","k":"ˈterɪtɔːri","p":"n.","c":"領土，版圖；領域，範圍","es":"The country is prepared to defend its territory.","cs":"這個國家準備好捍衛它的領土。","d":"An area of land, a region, or a domain over which a state or ruler has jurisdiction."},{"id":990,"l":3,"w":"text","k":"tɛkst","p":"n.","c":"正文，本文","es":"The main text of the book is very informative.","cs":"這本書的主要內容提供了很多資訊。","d":"A book or other written or printed work; the main body of a document."},{"id":991,"l":3,"w":"thankful","k":"ˋθæŋkf əl","p":"adj.","c":"感謝的，感激的","es":"I am very thankful for all your support.","cs":"我對您所有的支持感到非常感謝。","d":"Pleased and grateful for something."},{"id":992,"l":3,"w":"theory","k":"ˋθiərɪ","p":"n.","c":"理論；學理","es":"Scientists are working to prove the new theory.","cs":"科學家正在努力證明這個新的理論。","d":"A set of ideas intended to explain something, especially one based on general principles independent of the thing to be explained."},{"id":993,"l":3,"w":"thirst","k":"θɝst","p":"n.","c":"渴，口渴；渴望","es":"The long hike in the desert gave me a burning thirst.","cs":"在沙漠中長途跋涉讓我覺得口渴難耐。","d":"A feeling of needing or wanting to drink."},{"id":994,"l":3,"w":"thread","k":"θrɛd","p":"n.","c":"線","es":"She used a needle and thread to mend the torn shirt.","cs":"她用針和線來修補撕破的襯衫。","d":"A long, thin strand of cotton, nylon, or other fibers used in sewing or weaving."},{"id":995,"l":3,"w":"threat","k":"θrɛt","p":"n.","c":"威脅，恐嚇","es":"The storm poses a serious threat to coastal areas.","cs":"這場風暴對沿海地區構成了嚴重的威脅。","d":"A statement of an intention to inflict pain, injury, or damage."},{"id":996,"l":3,"w":"threaten","k":"ˋθrɛtn","p":"vt.vi.","c":"威脅，恐嚇","es":"The dark clouds began to threaten rain.","cs":"烏雲開始預示著即將下雨。","d":"To state one's intention to take hostile action against (someone) in retribution for something."},{"id":997,"l":3,"w":"tickle","k":"ˋtɪk!","p":"n.vt.vi.","c":"呵…癢；使發癢","es":"I tried to tickle the baby, and he laughed.","cs":"我試著搔寶寶的癢，他笑了。","d":"To lightly touch or stroke (a person or part of the body) in a way that causes a slight tingling sensation and often laughter."},{"id":998,"l":3,"w":"tide","k":"taɪd","p":"n.","c":"潮汐；潮水","es":"We went for a walk on the beach when the tide was low.","cs":"我們在潮水低的時候去海灘散步。","d":"The alternate rising and falling of the sea, usually twice in each lunar day."},{"id":999,"l":3,"w":"tidy","k":"ˋtaɪdɪ","p":"adj.","c":"整潔的，整齊的","es":"Please tidy up your room before your grandmother arrives.","cs":"在你奶奶來之前，請整理好你的房間。","d":"Arranged neatly and in order."},{"id":1000,"l":3,"w":"tight","k":"taɪt","p":"adj.","c":"緊的，緊身的；緊湊的；密封的","es":"These new shoes are too tight for me.","cs":"這雙新鞋對我來說太緊了。","d":"Fixed, fastened, or closed firmly; closely fitting."},{"id":1001,"l":3,"w":"tighten","k":"ˋtaɪtn","p":"vt.vi.","c":"(使)變緊， (使)繃緊","es":"He used a wrench to tighten the loose bolt.","cs":"他用扳手擰緊鬆動的螺栓。","d":"To make or become tighter."},{"id":1002,"l":3,"w":"timber","k":"ˋtɪmbɚ","p":"n.","c":"木材，木料","es":"The house was built using locally sourced timber."," ,"d":"To find or discover by investigation; a mark or sign of something."},{"id":1012,"l":3,"w":"trader","k":"ˋtred ɚ","p":"n.","c":"商人；交易人","es":"He works as a stock trader on Wall Street.","cs":"他在華爾街擔任股票交易員。","d":"A person who buys and sells goods."},{"id":1013,"l":3,"w":"trail","k":"trel","p":"n.vt.vi.","c":"痕跡；蹤跡；小道 ；拖，曳；跟蹤；落後於 …","es":"We followed a narrow hiking trail up the mountain.","cs":"我們沿著一條狹窄的徒步小徑上山。","d":"A path or track made across a rough or wild region; to follow the track of."},{"id":1014,"l":3,"w":"transport","k":"ˋtræns͵p ɔrt","p":"n.","c":"運輸；交通工具","es":"The ferry is used to transport cars across the river.","cs":"渡輪用於運輸汽車過河。","d":"To take or carry (people or goods) from one place to another by means of a vehicle, aircraft, or ship."},{"id":1015,"l":3,"w":"trash","k":"træʃ","p":"n.","c":"廢物，垃圾","es":"Please take out the trash before you leave.","cs":"請在離開前將垃圾拿出去。","d":"Discarded matter; worthless material; garbage."},{"id":1016,"l":3,"w":"traveler","k":"ˋtrævl ɚ","p":"n.","c":"旅行者，旅客","es":"The experienced traveler always carries a small backpack.","cs":"經驗豐富的旅行者總是攜帶一個小背包。","d":"A person who is traveling or who often travels."},{"id":1017,"l":3,"w":"tray","k":"tre","p":"n.","c":"托盤","es":"He carried the drinks on a silver tray.","cs":"他用一個銀色托盤端著飲料。","d":"A flat, shallow container with a raised rim, used for carrying food or serving."},{"id":1018,"l":3,"w":"tremble","k":"ˋtrɛmb!","p":"vi.n.","c":"發抖；震顫","es":"Her voice began to tremble with fear.","cs":"她的聲音開始因恐懼而顫抖。","d":"To shake involuntarily, typically as a result of anxiety, excitement, or cold."},{"id":1019,"l":3,"w":"trend","k":"trɛnd","p":"n.","c":"趨勢；時尚","es":"The company follows the latest market trends.","cs":"這家公司緊隨最新的市場趨勢。","d":"A general direction in which something is developing or changing."},{"id":1020,"l":3,"w":"tribe","k":"traɪb","p":"n.","c":"部落；種族","es":"The anthropologist studied the customs of the isolated tribe.","cs":"這位人類學家研究了這個與世隔絕的部落的習俗。","d":"A social division in a  tumble down the grassy hill.","cs":"孩子開始沿著長滿草的山丘跌落。","d":"To fall suddenly, clumsily, or headlong."},{"id":1030,"l":3,"w":"tune","k":"tjun","p":"n.vt.vi.","c":"曲調；歌曲；協調","es":"The musician played a cheerful, familiar tune.","cs":"音樂家演奏了一首歡快、熟悉的曲子。","d":"A sequence of notes that is musically effective or memorable; a melody."},{"id":1031,"l":3,"w":"tutor","k":"ˋtjutɚ","p":"n. vt.","c":"家庭教師；當…的家教","es":"She hired a private math tutor to help her with homework.","cs":"她請了一位私人數學家教來幫她做功課。","d":"A private teacher, typically one who teaches a single student or a very small group."},{"id":1032,"l":3,"w":"twig","k":"twɪg","p":"n.","c":"細枝，嫩枝","es":"A small bird landed on a thin twig.","cs":"一隻小鳥落在了一根細小的嫩枝上。","d":"A small, thin terminal branch of a woody plant."},{"id":1033,"l":3,"w":"twin","k":"twɪn","p":"n.","c":"雙胞胎之一","es":"My brother and I are identical twins.","cs":"我哥哥和我是同卵雙胞胎。","d":"One of two children or animals born at the same birth."},{"id":1034,"l":3,"w":"twist","k":"twɪst","p":"n.vt.","c":"扭轉；扭彎","es":"The dancer gave a final twist and finished the performance.","cs":"舞者做了最後一個轉身，結束了表演。","d":"To bend, shape, or turn (something) into a contorted form."},{"id":1035,"l":3,"w":"typewriter","k":"ˋtaɪp͵raɪtɚ","p":"n.","c":"打字機","es":"The old-fashioned typewriter is now used as a decoration.","cs":"這台老式的打字機現在被用作裝飾品。","d":"A machine for writing in characters similar to those produced by printing."},{"id":1036,"l":3,"w":"typical","k":"ˋtɪpɪk!","p":"adj.","c":"典型的，有代表性的","es":"It was a typical cloudy morning in London.","cs":"那是倫敦一個典型的陰天早晨。","d":"Having the distinguishing characteristics of a particular type or group; representative."},{"id":1037,"l":3,"w":"union","k":"ˋjunj ən","p":"n.","c":"結合；合併；工會；聯合會","es":"The workers formed a strong labor union.","cs":"工人們組成了一個強大的工會。","d":"The action or fact of joining or being joined; an organized association of workers."},{"id":1038,"l":3,"w":"unite","k":"juˋna ɪt","p":"vt.vi.","c":"(使)聯合；統一； (使)團結","es":"The countries agreed to unite for a common cause.","cs":"這些國家同意聯合起來為了一個共同的事業。","d":"To come or bring together for a common purpose or action."},{"id":1039,"l":3,"w":"unity","k":"ˋjunətɪ","p":"n.","c":"單一 (性)；團結；聯合；統一 (性)","es":"The group's unity helped them overcome the challenge.","cs":"團隊的團結幫助他們克服了挑戰。","d":"The state of being united or joined as a whole."},{"id":1040,"l":3,"w":"universe","k":"ˋjunə͵vɝs","p":"n.","c":"宇宙","es":"Scientists study the vastness of the universe.","cs":"科學家研究宇宙的浩瀚無垠。","d":"All matter and energy, including the Earth, the galaxies, and everything in space."},{"id":1041,"l":3,"w":"unless","k":"ʌnˋlɛs","p":"conj.","c":"除非","es":"We will go to the park unless it rains.","cs":"除非下雨，否則我們會去公園。","d":"Except if (used to introduce a case in which a statement is not true)."},{"id":1042,"l":3,"w":"upset","k":"ʌpˋsɛt","p":"vt.adj.","c":"弄翻；使心煩意亂 ；翻倒的；心煩的","es":"The bad news will upset her greatly.","cs":"這個壞消息會讓她非常難過。","d":"Unsettled or distressed; to overturn."},{"id":1043,"l":3,"w":"vacant","k":"ˋvekənt","p":"adj.","c":"空的；空白的； (職位 )空缺的","es":"The office building has many vacant spaces for rent.","cs":"這棟辦公大樓有許多空置的空間可供出租。","d":"Empty; not filled or occupied."},{"id":1044,"l":3,"w":"valuable","k":"ˋvælj ʊəb!","p":"adj.n.","c":"值錢的，貴重的 ；貴重物品","es":"The watch is old but still very valuable.","cs":"這隻手錶很舊，但仍然非常有價值。","d":"Worth a great deal of money; very useful or important."},{"id":1045,"l":3,"w":"van","k":"væ n","p":"n.","c":"箱形客貨兩用車","es":"We rented a small van to move the furniture.","cs":"我們租了一輛小廂型車來搬運傢俱。","d":"A medium-sized motor vehicle, typically without side windows, used for transporting goods or people."},{"id":1046,"l":3,"w":"vanish","k":"ˋvæn ɪʃ","p":"vi.","c":"消失","es":"The magician made the rabbit vanish from the hat.","cs":"魔術師讓兔子從帽子裡消失了。","d":"To disappear suddenly and completely."},{"id":1047,"l":3,"w":"variety","k":"vəˋraɪətɪ","p":"n.","c":"多樣化，變化；種類","es":"The store sells a wide variety of fresh fruits.","cs":"這家商店出售各種各樣的新鮮水果。","d":"The quality or state o nity is working to reduce street violence.","cs":"社區正在努力減少街頭暴力。","d":"Behavior involving physical force intended to hurt, damage, or kill someone or something."},{"id":1057,"l":3,"w":"violent","k":"ˋvaɪələnt","p":"adj.","c":"激烈的；暴力的；狂暴的","es":"The earthquake caused a sudden and violent shaking.","cs":"地震造成了突然且猛烈的搖晃。","d":"Using or involving physical force intended to hurt, damage, or kill."},{"id":1058,"l":3,"w":"violet","k":"ˋvaɪəlɪt","p":"adj.","c":"紫蘿蘭","es":"She painted the sky with shades of blue and violet.","cs":"她用藍色和紫羅蘭色的色調描繪了天空。","d":"A small, low-growing plant with purple, blue, or white flowers; a bluish-purple color."},{"id":1059,"l":3,"w":"visible","k":"ˋvɪzəb!","p":"adj.","c":"可看見的","es":"The moon was clearly visible in the night sky.","cs":"月亮在夜空中清晰可見。","d":"Able to be seen."},{"id":1060,"l":3,"w":"vision","k":"ˋvɪʒən","p":"n.","c":"視力；視覺；洞察力，眼光","es":"She has excellent artistic vision for the new project.","cs":"她對新專案具有出色的藝術眼光。","d":"The faculty or state of being able to see; the ability to think about or plan the future with imagination."},{"id":1061,"l":3,"w":"vitamin","k":"ˋvaɪtəmɪn","p":"n.","c":"維他命，維生素","es":"Eating fruits and vegetables gives you essential vitamins.","cs":"吃水果和蔬菜可以為你提供必需的維生素。","d":"Any of a group of organic compounds that are essential for normal growth and nutrition."},{"id":1062,"l":3,"w":"vivid","k":"ˋvɪvɪd","p":"adj.","c":"鮮豔的；生動的；逼真的","es":"I have a vivid memory of my first day of school.","cs":"我對我上學的第一天有著生動的記憶。","d":"Producing powerful feelings or strong, clear images in the mind; bright."},{"id":1063,"l":3,"w":"volume","k":"ˋvɑljəm","p":"n.","c":"卷，冊；體積；容積；音量","es":"Please turn down the volume on the television.","cs":"請把電視的音量調低。","d":"The amount of space that a substance or object occupies; a book forming part of a work or series."},{"id":1064,"l":3,"w":"wag","k":"wæ g","p":"vt.vi.n.","c":"搖，搖擺，搖動","es":"The dog began to wag its tail happily.","cs":"狗開始開心地搖尾巴。","d":"To move (a tail or finger) repeatedly from side to a wealthy businessman after starting his company.","cs":"創辦公司後，他成為了一名富裕的商人。","d":"Having a great deal of money or assets; rich."},{"id":1075,"l":3,"w":"weave","k":"wiv","p":"vt.vi.","c":"織；編，","es":"She uses a loom to weave traditional patterns into the fabric.","cs":"她用織布機將傳統圖案編織到布料中。","d":"To form (fabric or a basket) by interlacing threads or strips of material."},{"id":1076,"l":3,"w":"web","k":"wɛb","p":"n.","c":"蜘蛛網；網狀物","es":"The spider spun a delicate web between the branches.","cs":"蜘蛛在樹枝間結了一個精緻的網。","d":"A network of fine threads constructed by a spider; the interconnected system of the World Wide Web."},{"id":1077,"l":3,"w":"weed","k":"wid","p":"n.","c":"雜草；野草","es":"I spent the morning pulling up weeds in the garden.","cs":"我花了整個早上在花園裡拔雜草。","d":"A wild plant growing where it is not wanted and in competition with cultivated plants."},{"id":1078,"l":3,"w":"weep","k":"wip","p":"n.vt.vi.","c":"哭泣，流淚","es":"The little girl began to weep when she lost her toy.","cs":"小女孩弄丟了玩具後開始哭泣。","d":"To shed tears; cry."},{"id":1079,"l":3,"w":"wheat","k":"hwit","p":"n.","c":"小麥","es":"The farmer harvested a large field of golden wheat.","cs":"農夫收穫了一大片金黃色的小麥田。","d":"A cereal plant that is the most important kind grown in temperate countries, its grain is ground to make flour."},{"id":1080,"l":3,"w":"whip","k":"hwɪp","p":"n.vt.vi.","c":"鞭笞，抽打","es":"The cowboy used his whip to control the cattle.","cs":"牛仔用他的鞭子來控制牛群。","d":"A strip of leather or cord fastened to a handle, used for flogging or urging on animals."},{"id":1081,"l":3,"w":"whistle","k":"ˋhwɪs!","p":"n.vt.vi.","c":"口哨；警笛；吹口哨；鳴笛","es":"The referee blew his whistle to start the game.","cs":"裁判吹響哨子開始比賽。","d":"A clear, high-pitched sound made by forcing air through a small hole between one's lips."},{"id":1082,"l":3,"w":"wicked","k":"ˋwɪkɪd","p":"adj.","c":"壞的；邪惡的","es":"The story is about a cruel and wicked queen.","cs":"這個故事是關於一位殘酷而邪惡的女王。","d":"Evil or morally wrong."},{"id":1083,"l":3,"w":"willow","k":"ˋwɪlo","p":"n.","c":"柳，柳樹","es":"We sat beneath the beautiful weeping willow tree.","cs":"我們坐在美麗的垂柳樹下。","d":"A tree or shrub of temperate climates with narrow leaves and flexible branches."},{"id":1084,"l":3,"w":"wink","k":"wɪŋk","p":"n.vt.vi.","c":"眨眼","es":"He gave her a quick wink to show he was joking.","cs":"他對她眨了一下眼，表示他在開玩笑。","d":"To close and open one eye quickly, typically as a signal or sign."},{"id":1085,"l":3,"w":"wipe","k":"waɪp","p":"vt.vi.n.","c":"擦；揩","es":"Please wipe your feet before you come inside.","cs":"進屋前請擦你的腳。","d":"To clean or dry (something) by rubbing it with a cloth or a piece of soft material."},{"id":1086,"l":3,"w":"wisdom","k":"ˋwɪzdəm","p":"n.","c":"智慧，才智","es":"Old age is often associated with great wisdom.","cs":"年老通常與巨大的智慧聯繫在一起。","d":"The quality of having experience, knowledge, and good judgment."},{"id":1087,"l":3,"w":"wrap","k":"ræ p","p":"vt.vi.n.","c":"包，裹 ；包裹物，覆蓋物","es":"Remember to wrap the gifts before the party.","cs":"記得在派對前包裝禮物。","d":"To cover (something) by winding or folding a piece of material around it."},{"id":1088,"l":3,"w":"wrist","k":"rɪst","p":"n.","c":"手腕；腕關節","es":"He wore a leather band around his wrist.","cs":"他的手腕上戴著一條皮帶。","d":"The joint connecting the hand with the forearm."},{"id":1089,"l":3,"w":"yawn","k":"jɔn","p":"n.vi.","c":"呵欠","es":"He couldn't stop himself from letting out a big yawn.","cs":"他忍不住打了個大哈欠。","d":"To involuntarily open one's mouth wide and inhale deeply due to tiredness or boredom."},{"id":1090,"l":3,"w":"yell","k":"jɛl","p":"n.vt.vi.","c":"叫喊；吼叫","es":"Please don't yell; I can hear you clearly.","cs":"請不要喊叫；我可以清楚地聽到你說話。","d":"To cry out in a loud, sharp, or piercing way."},{"id":1091,"l":3,"w":"yolk","k":"jok","p":"n.","c":"蛋黃","es":"The yolk of the egg is yellow and nutritious.","cs":"雞蛋的蛋黃是黃色的，營養豐富。","d":"The yellow internal part of an egg."},{"id":1092,"l":3,"w":"youngster","k":"ˋjʌŋstɚ","p":"n.","c":"小孩；年輕人","es":"The tennis club welcomes players of all ages, including youngsters.","cs":"網球俱樂部歡迎所有年齡層的球員，包括年輕人。","d":"A child or young person."},{"id":1093,"l":3,"w":"zipper","k":"ˋzɪpɚ","p":"n.vi.vt.","c":"拉鍊 ；拉上拉鍊","es":"The zipper on my jacket is broken.","cs":"我夾克上的拉鍊壞了。","d":"A device consisting of two flexible strips of metal or plastic with interlocking teeth, used for fastening clothes or bags."},{"id":1094,"l":3,"w":"zone","k":"zon","p":"n.","c":"地帶；地區","es":"The school is located in a quiet residential zone.","cs":"學校位於一個安靜的住宅區。","d":"An area or stretch of land having a particular characteristic, purpose, or use."},{"id":1095,"l":4,"w":"AIDS","k":"edz","p":"n.","c":"愛滋病 (acquired immune deficiency syndrome)","es":"The foundation raises money for AIDS research and treatment.","cs":"該基金會為 愛滋病 的研究和治療籌集資金。","d":"Acquired Immunodeficiency Syndrome; a severe, life-threatening condition caused by the HIV virus which damages the immune system."},{"id":1096,"l":4,"w":"ATM","k":"","p":"n.","c":"自動存提款機 (automatic teller machine)","es":"I need to stop at the ATM to withdraw some cash.","cs":"我需要到 自動提款機 提領一些現金。","d":"Automated Teller Machine; a machine that dispenses cash and performs other banking services when an account holder inserts a card."},{"id":1097,"l":4,"w":"CD","k":"","p":"n.","c":"光碟 = compact disk","es":"The band is releasing their new album on CD next week.","cs":"該樂團下週將發行他們的全新 光碟 專輯。","d":"Compact Disc; a small plastic disc on which music or other digital information is stored."},{"id":1098,"l":4,"w":"DVD","k":"","p":"n.","c":"DVD 碟片 (digital video disk)","es":"We spent the evening watching a classic film on DVD.","cs":"我們晚上花時間看了張經典電影 數位影音光碟。","d":"Digital Versatile Disc (or Digital Video Disc); a type of compact disc holding large amounts of data, especially high-resolution video and sound."},{"id":1099,"l":4,"w":"Internet","k":"ˋ ɪntɚnɛt","p":"n.","c":"【電腦】網際網路 (internet)","es":"You can find a vast amount of information on the Internet.","cs":"您可以在 網際網路 上找到大量的資訊。","d":"A global computer network providing a variety of information and communication facilities."},{"id":1100,"l":4,"w":"MTV","k":"","p":"n.","c":"音樂電視 (= Music Television)","es":"In the 80s, MTV played a crucial role in popularizing music videos.","cs":"在 80 年代，音樂電視頻道 在推廣音樂影片方面發揮了關鍵作用。","d":"Music Television; a popular cable channel launched in the 1980s, primarily airing music videos and music-related programming."},{"id":1101,"l":4,"w":"abandon","k":"əˋbænd ən","p":"vt.","c":"放棄，中止","es":"The captain ordered the crew to abandon the sinking ship.","cs":"船長命令船員遺棄正在下沉的船隻。","d":"To leave (a place or thing) permanently or prematurely; to give up."},{"id":1102,"l":4,"w":"abdomen","k":"ˋæbd əmən","p":"n.","c":"腹；腹部","es":"The surgeon made a small incision in the patient's abdomen.","cs":"外科醫生在病人的腹部做了一個小切口。","d":"The part of the body between the chest and the hips; the belly."},{"id":1103,"l":4,"w":"absolute","k":"ˋæbs ə͵lut","p":"adj.","c":"絕對的；完全的","es":"She is the absolute ruler of the small island nation.","cs":"她是這個小島國的絕對統治者。","d":"Total and complete; not qualified or limited in any way."},{"id":1104,"l":4,"w":"absorb","k":"əbˋsɔrb","p":"vt.","c":"吸收；吸引 (注意等 )；使 專注","es":"The towel was able to absorb the spilled water quickly.","cs":"這條毛巾能夠快速吸收灑出的水。","d":"To take in or soak up (energy, liquid, or another substance)."},{"id":1105,"l":4,"w":"abstract","k":"ˋæbstrækt","p":"adj.","c":"抽象的 n.摘要，梗概","es":"His lecture covered a very complex and abstract concept.","cs":"他的演講涵蓋了一個非常複雜和抽象的概念。","d":"Existing in thought or as an idea but not having a physical or concrete existence."},{"id":1106,"l":4,"w":"academic","k":"͵æk əˋdɛmɪk","p":"adj.","c":"學術的","es":"She left her academic career to start a business.","cs":"她放棄了她的學術生涯去創業。","d":"Relating to education and scholarship."},{"id":1107,"l":4,"w":"accent","k":"ˋæks ɛnt","p":"n.","c":"口音，腔調；重音；強調","es":"He speaks English with a charming French accent.","cs":"他說英語帶有迷人的法國口音。","d":"A distinctive way of pronouncing a language, especially one associated with a particular country, area, or social class."},{"id":1108,"l":4,"w":"acceptance","k":"əkˋsɛptəns","p":"n.","c":"接受；歡迎","es":"The university sent him a letter of acceptance.","cs":"大學寄給了他一封錄取通知書。","d":"The action or process of being accepted or accepting something; agreement."},{"id":1109,"l":4,"w":"access","k":"ˋæks ɛs","p":"n. vt.","c":"接近，進入；通道，入口；使用；接近","es":"You need a key card to access the restricted area.","cs":"您需要一張門禁卡才能進入限制區域。","d":"The means or opportunity to approach or enter a place; the right or opportunity to use or obtain something."},{"id":1110,"l":4,"w":"accidental","k":"͵æks əˋdɛnt!","p":"adj.","c":"偶然的；意外的","es":"Their meeting was completely accidental; they hadn't planned it.","cs":"他們的相遇是完全偶然的；他們沒有計畫。","d":"Happening by chance, unintentionally, or unexpectedly."},{"id":1111,"l":4,"w":"accompany","k":"əˋkʌmpənɪ","p":"vt.","c":"陪伴；為 …伴奏","es":"I would be delighted to accompany you to the gallery opening.","cs":"我很樂意陪伴您參加畫廊開幕式。","d":"To go somewhere with (someone) as a companion or escort."},{"id":1112,"l":4,"w":"accomplish","k":"əˋkɑmplɪʃ","p":"vt.","c":"完成，實現，達到","es":"We managed to accomplish the task ahead of schedule.","cs":"我們設法完成了提前的任務。","d":"To achieve or complete successfully."},{"id":1113,"l":4,"w":"accomplishment","k":"əˋkɑmplɪʃmənt","p":"n.","c":"成就；成 績","es":"Winning the championship was a major accomplishment for the team.","cs":"贏得冠軍是這個團隊的一項重大成就。","d":"Something that has been achieved successfully; a skill or ability."},{"id":1114,"l":4,"w":"accountant","k":"əˋkaʊntənt","p":"n.","c":"會計師；會計人員","es":"I hired an accountant to help with my tax return.","cs":"我聘請了一位會計師來幫我處理報稅。","d":"A person whose job is to keep or inspect financial accounts."},{"id":1115,"l":4,"w":"accuracy","k":"ˋækj ərəsɪ","p":"n.","c":"正確 (性)；準確 (性)","es":"We must check the report again to ensure its accuracy.","cs":"我們必須再次檢查報告以確保其準確性。","d":"The quality or state of being correct or precise."},{"id":1116,"l":4,"w":"accuse","k":"əˋkjuz","p":"vt.","c":"指控，控告；譴責","es":"She accused her neighbor of stealing her package.","cs":"她指控她的鄰居偷了她的包裹。","d":"To charge (someone) with an offense or crime."},{"id":1117,"l":4,"w":"acid","k":"ˋæs ɪd","p":"adj.n.","c":"酸的，有酸味的；【化】酸","es":"Lemon juice is known for its high acid content.","cs":"檸檬汁以其高酸含量而聞名。","d":"A chemical substance that typically has a sour taste, reacts with metals, and can be corrosive."},{"id":1118,"l":4,"w":"acquaint","k":"əˋkwent","p":"vt.","c":"使認識；使熟悉","es":"You should acquaint yourself with the company's safety rules.","cs":"您應該使自己熟悉公司的安全規定。","d":"To make (someone) aware of or familiar with something."},{"id":1119,"l":4,"w":"acquaintance","k":"əˋkwent əns","p":"n.","c":"(與人 )相識 ；相識的人，熟 人","es":"He is not a close friend, just a business acquaintance.","cs":"他不是親密的朋友，只是業務熟人。","d":"A person one knows slightly but is not a close friend; knowledge or experience of something."},{"id":1120,"l":4,"w":"acquire","k":"əˋkwa ɪr","p":"vt.","c":"取得，獲得；學到","es":"The museum hopes to acquire the rare artifact at auction.","cs":"博物館希望在拍賣會上購得這件稀有文物。","d":"To buy or obtain (an asset or object) for oneself."},{"id":1121,"l":4,"w":"acre","k":"ˋek ɚ","p":"n.","c":"英畝","es":"The farm spans over a hundred acres of land.","cs":"這個農場佔地超過一百英畝。","d":"A unit of land area equal to 4,840 square yards."},{"id":1122,"l":4,"w":"adapt","k":"əˋdæpt","p":"vt.","c":"使適應，使適合；改編， 改寫","es":"Animals must adapt to their environment to survive.","cs":"動物必須適應牠們的環境才能生存。","d":"To make (something) suitable for a new use or purpose; to adjust to new conditions."},{"id":1123,"l":4,"w":"adequate","k":"ˋæd əkwɪt","p":"adj.","c":"適當的；足夠的","es":"The food supply is adequate for the entire camping trip.","cs":"食物供應足夠應付整個露營旅行。","d":"Satisfactory or acceptable in quality or quantity."},{"id":1124,"l":4,"w":"adjective","k":"ˋæd ʒɪktɪv","p":"n.adj.","c":"形容詞；形容詞的","es":"In the sentence, \"blue\" is an adjective modifying \"car.\"","cs":"在這個句子中，「藍色的」是一個修飾「汽車」的形容詞。","d":"A word or phrase naming an attribute, added to a noun to modify or describe it."},{"id":1125,"l":4,"w":"adjust","k":"əˋdʒʌst","p":"vt.","c":"調節；校準；調整","es":"Please adjust your seat belt before the car starts moving.","cs":"請在汽車啟動前調整您的安全帶。","d":"To alter or move (something) slightly in order to achieve the desired fit or result."},{"id":1126,"l":4,"w":"adjustment","k":"əˋdʒʌstmənt","p":"n.","c":"調節；調整；校 正","es":"I had to make a slight adjustment to the height of the monitor.","cs":"我必須對顯示器的高度做一點調整。","d":"A small alteration or movement made to achieve a desired fit or result."},{"id":1127,"l":4,"w":"admirable","k":"ˋædm ərəb!","p":"adj.","c":"值得讚揚的；令人 欽佩的","es":"Her dedication to charity work is truly admirable.","cs":"她對慈善工作的奉獻精神確實令人欽佩。","d":"Deserving respect and approval."},{"id":1128,"l":4,"w":"admiration","k":"æ dm əˋreʃən","p":"n.","c":"欽佩，讚美，羨 慕","es":"I have great admiration for his courage and determination.","cs":"我對他的勇氣和決心懷有極大的敬佩。","d":"Respect and warm approval."},{"id":1129,"l":4,"w":"admission","k":"ədˋmɪʃən","p":"n.","c":"進入許可；入場費 ；入場券 ；承認","es":"The theater refused her admission because she was late.","cs":"劇院因為她遲到而拒絕她進入。","d":"The process or fact of entering or being allowed to enter a place or institution."},{"id":1130,"l":4,"w":"adverb","k":"ˋædv ɚb","p":"n.adj.","c":"副詞 ；副詞的","es":"The word \"quickly\" in the sentence is an adverb.","cs":"句子中的「迅速地」這個詞是一個副詞。","d":"A word or phrase that modifies an adjective, verb, or other adverb and expresses a relation of place, time, manner, degree, or cause."},{"id":1131,"l":4,"w":"agency","k":"ˋed ʒənsɪ","p":"n.","c":"代辦處，經銷處","es":"He works for a government agency that handles foreign policy.","cs":"他為一個處理外交政策的政府機構工作。","d":"A business or organization providing a particular service on behalf of another."},{"id":1132,"l":4,"w":"agent","k":"ˋed ʒənt","p":"n.","c":"代理人；代理商；仲介人","es":"The famous actor fired his old agent and hired a new one.","cs":"這位著名演員解雇了他的老經紀人並聘請了一位新的。","d":"A person who acts on behalf of another person or group."},{"id":1133,"l":4,"w":"aggressive","k":"əˋgrɛsɪv","p":"adj.","c":"侵略的，有進取精神 的","es":"The company took an aggressive approach to expanding its market share.","cs":"該公司採取了積極的策略來擴大其市場份額。","d":"Ready or likely to attack or confront; characterized by hostility."},{"id":1134,"l":4,"w":"agreeable","k":"əˋgriəb!","p":"adj.","c":"令人愉快的，宜人的","es":"We spent an agreeable afternoon relaxing by the pool.","cs":"我們在泳池旁度過了一個宜人的下午。","d":"Enjoyable and pleasurable; willing to agree."},{"id":1135,"l":4,"w":"alcohol","k":"ˋælk ə͵hɔl","p":"n.","c":"酒精；含酒精飲料；酒","es":"The doctor advised him to stop drinking alcohol completely.","cs":"醫生建議他完全停止飲用酒精。","d":"A colorless, volatile, flammable liquid that is the intoxicating agent in wine, beer, and spirits."},{"id":1136,"l":4,"w":"alert","k":"əˋlɝt","p":"adj.n.vt.","c":"警覺的；警 惕的 ；警報 ；使警覺","es":"A sudden noise put the guard immediately on alert.","cs":"突然的噪音使警衛立刻保持警覺。","d":"The state of being watchful for danger; a warning or signal."},{"id":1137,"l":4,"w":"allowance","k":"əˋlaʊəns","p":"n.","c":"零用錢；津貼，補貼 同： pocket money","es":"His parents gave him an increased weekly allowance for chores.","cs":"他的父母增加了他每週做家事的零用錢。","d":"An amount of money paid regularly to a person, often a minor; a permitted amount of something."},{"id":1138,"l":4,"w":"aluminum","k":"əˋlum ɪnəm","p":"n.","c":"鋁","es":"Soda cans are typically made from lightweight aluminum.","cs":"汽水罐通常由輕質鋁製成。","d":"A light, silvery-grey metal that is resistant to rust."},{"id":1139,"l":4,"w":"amateur","k":"ˋæm ə͵tʃʊr","p":"n.","c":"業餘從事者","es":"He is an amateur photographer but his photos are professional quality.","cs":"他是個業餘的攝影師，但他的照片卻有專業水準。","d":"A person who engages in a pursuit, especially a sport, as a pastime rather than a profession."},{"id":1140,"l":4,"w":"ambitious","k":"æmˋb ɪʃəs","p":"adj.","c":"有雄心的；野心勃勃 的","es":"The young CEO has ambitious plans for global expansion.","cs":"這位年輕的執行長有雄心勃勃的全球擴張計畫。","d":"Having or showing a strong desire and determination to succeed."},{"id":1141,"l":4,"w":"amid","k":"əˋmɪd","p":"prep.","c":"在…之間；在 …之中 (amidst)","es":"The house stood beautifully amid the tall pine trees.","cs":"這棟房子美麗地矗立在環繞的松樹之間。","d":"In the middle of or surrounded by."},{"id":1142,"l":4,"w":"amuse","k":"əˋmjuz","p":"vt.","c":"使歡樂，逗 …高興","es":"The clown performed tricks to amuse the children.","cs":"小丑表演了把戲來逗樂孩子們。","d":"To cause (someone) to find something funny; to entertain."},{"id":1143,"l":4,"w":"amusement","k":"əˋmjuzm ənt","p":"n.","c":"樂趣；娛樂，消 遣","es":"The children screamed with amusement on the roller coaster.","cs":"孩子們在雲霄飛車上興奮地尖叫著。","d":"The state or experience of finding something funny or entertaining."},{"id":1144,"l":4,"w":"analysis","k":"əˋnæləsɪs","p":"n.","c":"分析；分解；解析","es":"The detailed analysis of the market showed a clear trend.","cs":"對市場的詳細分析顯示出一個明確的趨勢。","d":"Detailed examination of the elements or structure of something."},{"id":1145,"l":4,"w":"analyze","k":"ˋæn!͵a ɪz","p":"vt.","c":"分析；解析","es":"Scientists will analyze the rock samples collected from the moon.","cs":"科學家將分析從月球採集的岩石樣本。","d":"To examine (something) systematically and in detail, typically in order to explain it."},{"id":1146,"l":4,"w":"ancestor","k":"ˋæns ɛstɚ","p":"n.","c":"祖宗，祖先","es":"My ancestors came to this country from Italy in the 19th century.","cs":"我的祖先在 19 世紀從義大利來到這個國家。","d":"A person, typically one more remote than a grandparent, from whom one is descended."},{"id":1147,"l":4,"w":"anniversary","k":"͵æn əˋvɝsərɪ","p":"n.","c":"週年紀念日","es":"They celebrated their tenth wedding anniversary with a dinner party.","cs":"他們舉辦了晚宴慶祝他們的十週年結婚紀念日。","d":"The date on which an event took place in a previous year, especially one of historical or cultural importance."},{"id":1148,"l":4,"w":"annoy","k":"əˋnɔɪ","p":"vt.","c":"惹惱，使生氣","es":"The constant dripping of the faucet began to seriously annoy me.","cs":"水龍頭持續不斷的滴水開始讓我感到嚴重惱火。","d":"To make (someone) a little angry or irritated."},{"id":1149,"l":4,"w":"annual","k":"ˋænj ʊəl","p":"adj.","c":"一年的；一年一次的","es":"The company holds its annual holiday party every December.","cs":"該公司每年十二月舉行年度假日派對。","d":"Occurring once every year."},{"id":1150,"l":4,"w":"anxiety","k":"æŋˋza ɪətɪ","p":"n.","c":"焦慮，掛念","es":"His high anxiety prevents him from speaking in public.","cs":"他高度的焦慮使他無法在公共場合講話。","d":"A feeling of worry, nervousness, or unease about an imminent event or something with an uncertain outcome."},{"id":1151,"l":4,"w":"anxious","k":"ˋæŋk ʃəs","p":"adj.","c":"焦慮的，掛念的","es":"I am anxious to hear the results of the interview.","cs":"我急切地想知道面試的結果。","d":"Feeling or showing worry, nervousness, or unease about something uncertain."},{"id":1152,"l":4,"w":"apologize","k":"əˋpɑlə͵dʒaɪz","p":"vi.","c":"道歉；認錯","es":"He called his mother to apologize for missing her birthday.","cs":"他打電話給他母親，為錯過她的生日而道歉。","d":"To express regret for something one has done wrong."},{"id":1153,"l":4,"w":"apology","k":"əˋpɑlədʒɪ","p":"n.","c":"道歉；陪罪","es":"She offered a sincere apology for her rude remarks.","cs":"她為她的粗魯言論提供了真誠的道歉。","d":"A regretful acknowledgment of an offense or failure."},{"id":1154,"l":4,"w":"appliance","k":"əˋplaɪəns","p":"n.","c":"器具，用具；裝置， 設備","es":"A microwave is a common kitchen appliance.","cs":"微波爐是一種常見的廚房電器。","d":"A device or piece of equipment designed to perform a specific task, typically a domestic one."},{"id":1155,"l":4,"w":"applicant","k":"ˋæpl əkənt","p":"n.","c":"申請人","es":"The company received over 200 applicants for the job.","cs":"該公司收到了超過 200 名申請人的求職申請。","d":"A person who applies for a job or position."},{"id":1156,"l":4,"w":"application","k":"͵æpl əˋkeʃən","p":"n.","c":"應用，適用；申請；申請書","es":"You need to fill out a formal application to rent the apartment.","cs":"您需要填寫一份正式的申請表才能租賃這間公寓。","d":"A formal request for something; the action of putting something into operation."},{"id":1157,"l":4,"w":"appoint","k":"əˋpɔɪnt","p":"vt.","c":"任命，指派","es":"The board decided to appoint a new CEO next month.","cs":"董事會決定下個月任命一位新的執行長。","d":"To assign a job or role to (someone); to decide on (a time or place)."},{"id":1158,"l":4,"w":"appointment","k":"əˋpɔɪntmənt","p":"n.","c":"(尤指正式的 )約 會；任命，委派","es":"I have an appointment with the dentist at 3:00 PM.","cs":"我下午三點與牙醫有一個預約。","d":"An arrangement to meet someone at a particular time and place; the action of appointing someone to a job."},{"id":1159,"l":4,"w":"appreciation","k":"ə͵priʃɪˋeʃən","p":"n.","c":"欣賞；賞識；感 謝","es":"He showed his appreciation with a small gift.","cs":"他用一份小禮物表達了他的感謝。","d":"The recognition and enjoyment of the good qualities of someone or something."},{"id":1160,"l":4,"w":"appropriate","k":"əˋpropr ɪ͵et","p":"adj.","c":"適當的，恰當的","es":"Casual dress is not appropriate for a formal wedding.","cs":"便裝不適合正式婚禮。","d":"Suitable or proper in the circumstances."},{"id":1161,"l":4,"w":"approval","k":"əˋpruv!","p":"n.","c":"批准；認可；贊成；同 意","es":"The project requires final approval from the director.","cs":"這個專案需要主任的最終批准。","d":"The action of officially agreeing to something; a feeling of admiration."},{"id":1162,"l":4,"w":"arch","k":"ɑrtʃ","p":"n.","c":"拱，拱門，牌樓","es":"The Roman Emperor's triumph was celebrated with a massive stone arch.","cs":"羅馬皇帝的勝利是透過一座巨大的石拱門來慶祝的。","d":"A curved structure spanning an opening and typically supporting the weight of something above it."},{"id":1163,"l":4,"w":"arise","k":"əˋraɪz","p":"vi.","c":"上升；產生，出現； 【舊】起 立","es":"Several difficult questions arose during the debate.","cs":"在辯論中出現了幾個困難的問題。","d":"To emerge; become apparent; to get up from a sitting or lying position."},{"id":1164,"l":4,"w":"arms","k":"ɑrmz","p":"n.","c":"武器","es":"The tiny baby was comfortable in his mother's arms.","cs":"這個小嬰兒在他的母親的懷裡很舒服。","d":"Weapons and ammunition; the two upper limbs of the human body."},{"id":1165,"l":4,"w":"arouse","k":"əˋraʊz","p":"vt.","c":"喚起；使奮發","es":"The strange music served to arouse our curiosity.","cs":"奇怪的音樂喚起了我們的好奇心。","d":"To evoke or awaken (a feeling, emotion, or reaction)."},{"id":1166,"l":4,"w":"article1","k":"ˋ ɑrtɪk!","p":"n.","c":"冠詞；文章；物品；條文","es":"The newspaper published a front-page article about the election.","cs":"報紙刊登了一篇關於選舉的頭版文章。","d":"A particular item or object; a piece of writing in a newspaper or magazine."},{"id":1167,"l":4,"w":"artificial","k":"͵ ɑrtəˋfɪʃəl","p":"adj.","c":"人工的，人造的；假 的","es":"The park uses artificial turf instead of real grass.","cs":"公園使用人造草皮而不是真草。","d":"Made or produced by human beings rather than occurring naturally, especially as a copy of something natural."},{"id":1168,"l":4,"w":"artistic","k":"ɑrˋtɪstɪk","p":"adj.","c":"藝術的；美術的","es":"She has a strong artistic talent for painting and drawing.","cs":"她在繪畫和素描方面有很強的藝術天賦。","d":"Having or revealing creative skill; relating to art or artists."},{"id":1169,"l":4,"w":"ashamed","k":"əˋʃemd","p":"adj.","c":"羞愧的，感到難為情的","es":"He felt ashamed that he had forgotten his friend's birthday.","cs":"他為自己忘記朋友生日而感到羞愧。","d":"Embarrassed or guilty because of one's actions, characteristics, or associations."},{"id":1170,"l":4,"w":"aspect","k":"ˋæsp ɛkt","p":"n.","c":"方面，觀點","es":"We discussed every aspect of the business plan thoroughly.","cs":"我們徹底討論了業務計畫的每一個方面。","d":"A particular part or feature of something."},{"id":1171,"l":4,"w":"aspirin","k":"ˋæsp ərɪn","p":"n.","c":"阿斯匹靈 (解熱鎮痛藥 )","es":"I took an aspirin to help relieve my headache.","cs":"我吃了阿斯匹靈來幫助緩解頭痛。","d":"A synthetic compound used as a pain reliever and to reduce fever and inflammation."},{"id":1172,"l":4,"w":"assemble","k":"əˋsɛmb!","p":"vt.","c":"集合，召集；組合， 配裝","es":"The factory workers assemble cars on the production line.","cs":"工廠工人組裝生產線上的汽車。","d":"To gather together in one place for a common purpose; to fit together the parts of."},{"id":1173,"l":4,"w":"assembly","k":"əˋsɛmblɪ","p":"n.","c":"集會；集合","es":"The whole school attended the morning assembly in the gym.","cs":"全體學生參加了在體育館舉行的早晨集會。","d":"A group of people gathered together in one place for a common purpose; the action of fitting together the parts of a machine."},{"id":1174,"l":4,"w":"assign","k":"əˋsaɪn","p":"vt.","c":"分配，分派；指定","es":"The teacher will assign homework that is due next Monday.","cs":"老師將指派下週一到期的作業。","d":"To designate or formally appoint (someone) to a task or position."},{"id":1175,"l":4,"w":"assignment","k":"əˋsaɪnmənt","p":"n.","c":"(分派的 )任務；工 作;(課外 )作業， 功課","es":"My next writing assignment is a 2000-word essay.","cs":"我的下一個寫作任務是一篇 2000 字的論文。","d":"A task or piece of work assigned to someone as part of a job or course of study."},{"id":1176,"l":4,"w":"assistance","k":"əˋsɪstəns","p":"n.","c":"援助，幫助","es":"The old woman needed assistance crossing the busy street.","cs":"這位老婦人需要幫助穿過繁忙的街道。","d":"The action of helping someone with a job or task."},{"id":1177,"l":4,"w":"associate","k":"əˋsoʃɪɪt","p":"n.adj.vt.","c":"同事；合夥人；夥伴的； 共事的 ；聯想","es":"I generally associate coffee with waking up in the morning.","cs":"我通常將咖啡與早晨醒來聯繫起來。","d":"To connect (someone or something) with something else in one's mind; a partner or colleague."},{"id":1178,"l":4,"w":"association","k":"ə͵sosɪˋeʃən","p":"n.","c":"協(公)會；聯想， 聯想物","es":"She volunteers for a local non-profit association.","cs":"她在一個當地的非營利協會做志工。","d":"A group of people organized for a joint purpose; a link or connection."},{"id":1179,"l":4,"w":"assume","k":"əˋsjum","p":"vt.","c":"以為；假定為；承擔；就 任","es":"I assume you'll be joining us for dinner, right?","cs":"我假設你會加入我們的晚餐，對吧？","d":"To suppose to be the case, without proof."},{"id":1180,"l":4,"w":"assurance","k":"əˋʃʊrəns","p":"n.","c":"保證","es":"The mechanic gave me his assurance that the car was safe to drive.","cs":"修理工向我保證這輛車開起來是安全的。","d":"A positive declaration intended to give confidence; confidence or certainty in one's own abilities."},{"id":1181,"l":4,"w":"assure","k":"əˋʃʊr","p":"vt.","c":"向…保證，擔保；使確信，使放心","es":"I can assure you that your secret is safe with me.","cs":"我可以向您保證您的秘密在我這裡很安全。","d":"To tell someone something positively to remove any doubt."},{"id":1182,"l":4,"w":"athletic","k":"æθˋl ɛtɪk","p":"adj.","c":"運動的，體育的","es":"She has an athletic build from years of playing soccer.","cs":"多年的足球運動使她有著運動員般的身材。","d":"Physically strong, fit, and active; relating to sports."},{"id":1183,"l":4,"w":"atmosphere","k":"ˋætm əs͵fɪr","p":"n.","c":"大氣層；氣氛","es":"The Earth's atmosphere protects us from solar radiation.","cs":"地球的大氣層保護我們免受太陽輻射的影響。","d":"The envelope of gases surrounding the earth or another planet; the pervading tone or mood of a place."},{"id":1184,"l":4,"w":"atom","k":"ˋæt əm","p":"n.","c":"原子","es":"Every molecule of water contains two hydrogen atoms and one oxygen atom.","cs":"每個水分子含有兩個氫原子和一個氧原子。","d":"The basic unit of a chemical element."},{"id":1185,"l":4,"w":"atomic","k":"əˋtɑmɪk","p":"adj.","c":"原子的","es":"The explosion released a massive amount of atomic energy.","cs":"爆炸釋放了大量的原子能。","d":"Relating to an atom or atoms; using energy from nuclear fission."},{"id":1186,"l":4,"w":"attach","k":"əˋtætʃ","p":"vt.","c":"裝上，貼上，繫上","es":"Please attach your resume to the email application.","cs":"請將您的履歷表附加到電子郵件申請中。","d":"To fasten, join, or connect (something) to something else."},{"id":1187,"l":4,"w":"attachment","k":"əˋtætʃmənt","p":"n.","c":"連接；附著 ；附屬物；附件","es":"I couldn't open the large attachment on the email.","cs":"我無法打開電子郵件上的大型附件。","d":"An extra part or extension that is added to something to perform a particular function; a feeling of affection or liking."},{"id":1188,"l":4,"w":"attraction","k":"əˋtræk ʃən","p":"n.","c":"吸引；吸引力 ；吸 引物","es":"The Eiffel Tower is a major tourist attraction in Paris.","cs":"艾菲爾鐵塔是巴黎的一個主要旅遊景點。","d":"The action or power of attracting; a characteristic that makes something appealing."},{"id":1189,"l":4,"w":"audio","k":"ˋ ɔdɪ͵o","p":"adj.n.","c":"聽覺的，聲音的；(電視等的 )音響裝置","es":"The microphone is used to record the audio for the podcast.","cs":"麥克風用於錄製播客的音訊。","d":"Relating to sound or the reproduction of sound."},{"id":1190,"l":4,"w":"authority","k":"əˋθɔrətɪ","p":"n.","c":"權力；職權 ；官方， 當局；權威人士；專家","es":"The police have the authority to enforce traffic laws.","cs":"警察有權力執行交通法規。","d":"The power or right to give orders and enforce obedience; a person or organization having power."},{"id":1191,"l":4,"w":"autobiography","k":"͵ ɔtəbaɪˋɑgrəfɪ","p":"n.","c":"自傳","es":"I am reading the fascinating autobiography of a famous explorer.","cs":"我正在閱讀一位著名探險家引人入勝的自傳。","d":"An account of a person's life written by that person."},{"id":1192,"l":4,"w":"await","k":"əˋwe","p":"vt.","c":"等候，期待","es":"We will await your decision before proceeding with the next steps.","cs":"在繼續下一步之前，我們將等待您的決定。","d":"To wait for (an event)."},{"id":1193,"l":4,"w":"awkward","k":"ˋ ɔkwɚd","p":"adj.","c":"笨拙的 ；尷尬 的","es":"The situation became awkward when they realized they were wearing the same outfit.","cs":"當他們意識到自己穿著相同的服裝時，情況變得很尷尬。","d":"Difficult to use or handle; causing embarrassment or difficulty."},{"id":1194,"l":4,"w":"backpack","k":"ˋbæk͵pæk","p":"n.","c":"登山、遠足用的背包","es":"He packed a sandwich and a water bottle in his backpack.","cs":"他在他的背包裡裝了一個三明治和一瓶水。","d":"A sack carried on one's back and typically fastened with straps."},{"id":1195,"l":4,"w":"bald","k":"b ɔld","p":"adj.","c":"禿頭的；無草木的","es":"His father started going bald in his early twenties.","cs":"他的父親在二十歲出頭就開始禿頭了。","d":"Having little or no hair on the head."},{"id":1196,"l":4,"w":"ballet","k":"ˋbæle","p":"n.","c":"芭蕾舞","es":"She has been practicing ballet since she was four years old.","cs":"她從四歲起就一直在練習芭蕾舞。","d":"An artistic dance form performed to music using precise and highly formalized set steps and gestures."},{"id":1197,"l":4,"w":"bankrupt","k":"ˋbæŋkr ʌpt","p":"adj.vt.n.","c":"破產的；使破產；破產者","es":"The company went bankrupt after years of poor management.","cs":"經過多年的管理不善，這家公司破產了。","d":"Declared in law unable to pay outstanding debts."},{"id":1198,"l":4,"w":"bargain","k":"ˋb ɑrgɪn","p":"vt.n.","c":"討價還價 ；買賣，交易；特價商品","es":"I managed to bargain the price of the souvenir down to ten dollars.","cs":"我設法將紀念品的價格討價還價到十美元。","d":"An agreement between two or more parties as to what each party will do for the other; a thing bought for a good price."},{"id":1199,"l":4,"w":"barrier","k":"ˈbæriər","p":"n.","c":"障礙物；路障，柵欄","es":"The police set up a barrier to block the road.","cs":"警方設置了障礙物來封鎖道路。","d":"A fence or other obstacle that prevents movement or access; or a circumstance that prevents progress or access."},{"id":1200,"l":4,"w":"basin","k":"ˋbesn","p":"n.","c":"盆；臉盆；盆地","es":"She washed her hands in the ceramic basin.","cs":"她在陶瓷盆裡洗了手。","d":"A wide, round container for liquids; an area drained by a river."},{"id":1201,"l":4,"w":"battery","k":"ˋbæt ərɪ","p":"n.","c":"電池","es":"The flashlight isn't working because the battery is dead.","cs":"手電筒不亮了，因為電池沒電了。","d":"A container consisting of one or more cells, in which chemical energy is converted into electricity and used as a source of power."},{"id":1202,"l":4,"w":"beak","k":"bik","p":"n.","c":"鳥嘴","es":"The parrot used its strong beak to crack nuts.","cs":"這隻鸚鵡用它強壯的鳥喙來敲開堅果。","d":"The horny projecting jaws of a bird."},{"id":1203,"l":4,"w":"beam2","k":"bim","p":"n.vt.vi.","c":"笑容，喜色 ；流露；發出 ；眉開眼笑","es":"A powerful beam of light shot out from the lighthouse.","cs":"一道強大的光束從燈塔中射出。","d":"A long, sturdy piece of squared timber or metal used as a horizontal support; a ray of light."},{"id":1204,"l":4,"w":"behavior","k":"b ɪˋhevj ɚ","p":"n.","c":"行為，舉止","es":"The children's polite behavior impressed their hosts.","cs":"孩子們有禮貌的行為給主人留下了深刻印象。","d":"The way in which one acts or conducts oneself, especially toward others."},{"id":1205,"l":4,"w":"biography","k":"ba ɪˋɑgrəfɪ","p":"n.","c":"傳記","es":"I'm reading a new biography of the Queen of England.","cs":"我正在閱讀一本關於英國女王的新傳記。","d":"An account of someone's life written by someone else."},{"id":1206,"l":4,"w":"biology","k":"ba ɪˋɑlədʒɪ","p":"n.","c":"生物學","es":"She decided to major in biology at university.","cs":"她決定在大學主修生物學。","d":"The study of living organisms."},{"id":1207,"l":4,"w":"blade","k":"bled","p":"n.","c":"刀身，劍身；刀片","es":"Be careful not to touch the sharp blade of the knife.","cs":"小心不要碰到刀子鋒利的刀片。","d":"The flat, cutting part of a tool or weapon; a single leaf of grass."},{"id":1208,"l":4,"w":"blend","k":"bl ɛn
