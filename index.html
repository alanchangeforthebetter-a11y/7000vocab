    applyTheme();
    document.getElementById('themeToggle').addEventListener('click', () => {
      saved.theme = saved.theme === 'dark' ? 'light' : 'dark';
      persist();
      applyTheme();
    });

    // Speech Synthesis
    function speak(text) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      // If word has slash like "Bible/bible", speak first part
      const clean = text.split('/')[0].trim();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'en-US';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }

    // Filter & Sort
    function updateDeck(resetIndex = true) {
      const q = state.search.trim().toLowerCase();
      filtered = VOCAB_DATA.filter(item => {
        if (state.level !== 'all' && String(item.l) !== state.level) return false;
        if (state.status === 'known' && !saved.known[item.id]) return false;
        if (state.status === 'unlearned' && saved.known[item.id]) return false;
        if (state.status === 'starred' && !saved.starred[item.id]) return false;
        if (q) {
          const hay = (item.w + ' ' + item.c + ' ' + item.p).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      if (state.shuffled) {
        for (let i = filtered.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
        }
      }

      if (resetIndex) {
        state.index = 0;
        state.listPage = 1;
      } else if (state.index >= filtered.length) {
        state.index = Math.max(0, filtered.length - 1);
      }

      updateProgress();
      renderCurrentTab();
    }

    function updateProgress() {
      // Progress based on current level filter (ignoring status/search so user sees overall level mastery)
      const levelPool = state.level === 'all'
        ? VOCAB_DATA
        : VOCAB_DATA.filter(i => String(i.l) === state.level);
      const knownCount = levelPool.filter(i => saved.known[i.id]).length;
      const pct = levelPool.length ? Math.round((knownCount / levelPool.length) * 100) : 0;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent = `${knownCount} / ${levelPool.length} 已熟記 (${pct}%)`;
      document.getElementById('totalSubtitle').textContent = `CEEC 大考中心 Level 3–6 · 共 ${VOCAB_DATA.length.toLocaleString()} 字`;
    }

    function renderCurrentTab() {
      document.getElementById('tab-flashcard').classList.toggle('hidden', state.tab !== 'flashcard');
      document.getElementById('tab-quiz').classList.toggle('hidden', state.tab !== 'quiz');
      document.getElementById('tab-list').classList.toggle('hidden', state.tab !== 'list');

      if (state.tab === 'flashcard') renderFlashcard();
      else if (state.tab === 'quiz') nextQuizQuestion();
      else if (state.tab === 'list') renderList();
    }

    // FLASHCARD RENDER
    function renderFlashcard() {
      const hasCards = filtered.length > 0;
      document.getElementById('flashcardContainer').classList.toggle('hidden', !hasCards);
      document.getElementById('cardControls').classList.toggle('hidden', !hasCards);
      document.getElementById('emptyCard').classList.toggle('hidden', hasCards);

      if (!hasCards) {
        document.getElementById('cardCounter').textContent = '0 / 0';
        return;
      }

      const item = filtered[state.index];
      state.flipped = false;
      document.getElementById('cardInner').classList.remove('flipped');
      document.getElementById('cardCounter').textContent = `第 ${state.index + 1} / ${filtered.length} 張`;

      // Front
      document.getElementById('frontLv').textContent = `Level ${item.l}`;
      document.getElementById('frontPos').textContent = item.p || '-';
      document.getElementById('frontKnown').classList.toggle('hidden', !saved.known[item.id]);

      if (!state.reverseDir) {
        document.getElementById('frontMain').textContent = item.w;
        document.getElementById('frontSub').textContent = item.k ? `[${item.k}]` : '';
      } else {
        document.getElementById('frontMain').textContent = item.c;
        document.getElementById('frontSub').textContent = item.p ? `(${item.p})` : '';
      }

      // Back
      document.getElementById('backWordBadge').textContent = `${item.w} ${item.k ? '[' + item.k + ']' : ''}`;
      document.getElementById('backPosBadge').textContent = item.p || '-';
      document.getElementById('backMeaning').textContent = state.reverseDir ? item.w : item.c;

      const defEl = document.getElementById('backDef');
      if (item.d) {
        defEl.textContent = item.d;
        defEl.classList.remove('hidden');
      } else {
        defEl.classList.add('hidden');
      }

      const exBox = document.getElementById('backExampleBox');
      if (item.es) {
        document.getElementById('backExEn').textContent = item.es;
        document.getElementById('backExZh').textContent = item.cs || '';
        exBox.classList.remove('hidden');
      } else {
        exBox.classList.add('hidden');
      }

      updateStarButtons(item.id);
      if (state.autoSpeak && !state.reverseDir) {
        speak(item.w);
      }
    }

    function updateStarButtons(id) {
      const isStar = !!saved.starred[id];
      ['starBtn', 'starBackBtn'].forEach(btnId => {
        const el = document.getElementById(btnId);
        el.textContent = isStar ? '★' : '☆';
        el.classList.toggle('starred', isStar);
      });
    }

    function flipCard() {
      if (!filtered.length) return;
      state.flipped = !state.flipped;
      document.getElementById('cardInner').classList.toggle('flipped', state.flipped);
    }

    function moveCard(delta) {
      if (!filtered.length) return;
      state.index = (state.index + delta + filtered.length) % filtered.length;
      renderFlashcard();
    }

    function toggleStarCurrent() {
      if (!filtered.length) return;
      const item = filtered[state.index];
      if (saved.starred[item.id]) delete saved.starred[item.id];
      else saved.starred[item.id] = 1;
      persist();
      updateStarButtons(item.id);
    }

    function markCurrent(isKnown) {
      if (!filtered.length) return;
      const item = filtered[state.index];
      if (isKnown) saved.known[item.id] = 1;
      else delete saved.known[item.id];
      persist();
      updateProgress();

      if (state.status === 'unlearned' && isKnown) {
        updateDeck(false);
      } else if (state.status === 'known' && !isKnown) {
        updateDeck(false);
      } else {
        moveCard(1);
      }
    }

    // QUIZ RENDER
    function nextQuizQuestion() {
      const hasEnough = filtered.length >= 4;
      document.getElementById('quizBox').classList.toggle('hidden', !hasEnough);
      document.getElementById('emptyQuiz').classList.toggle('hidden', hasEnough);
      if (!hasEnough) return;

      state.quizAnswered = false;
      document.getElementById('quizFeedback').classList.remove('show');

      const target = filtered[Math.floor(Math.random() * filtered.length)];
      state.quizCurrent = target;

      // Pick 3 distinct distractors
      const distractors = [];
      const used = new Set([target.id]);
      let guard = 0;
      while (distractors.length < 3 && guard < 100) {
        guard++;
        const cand = filtered[Math.floor(Math.random() * filtered.length)];
        if (!used.has(cand.id) && cand.c !== target.c) {
          used.add(cand.id);
          distractors.push(cand);
        }
      }

      const choices = [target, ...distractors].sort(() => Math.random() - 0.5);

      document.getElementById('quizLv').textContent = `Level ${target.l}`;
      document.getElementById('quizPos').textContent = target.p || '-';
      if (state.quizDir === 'en2zh') {
        document.getElementById('quizPrompt').textContent = target.w;
        document.getElementById('quizKk').textContent = target.k ? `[${target.k}]` : '';
      } else {
        document.getElementById('quizPrompt').textContent = target.c;
        document.getElementById('quizKk').textContent = '';
      }

      const optWrap = document.getElementById('quizOptions');
      optWrap.innerHTML = '';
      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt';
        btn.textContent = state.quizDir === 'en2zh' ? c.c : c.w;
        btn.addEventListener('click', () => handleQuizAnswer(btn, c, target));
        optWrap.appendChild(btn);
      });

      const qStar = document.getElementById('quizStarBtn');
      qStar.textContent = saved.starred[target.id] ? '★ 已收藏' : '⭐ 加入收藏';
    }

    function handleQuizAnswer(btn, chosen, target) {
      if (state.quizAnswered) return;
      state.quizAnswered = true;
      state.quizTotal++;

      const allBtns = document.querySelectorAll('.quiz-opt');
      allBtns.forEach(b => b.disabled = true);

      const isRight = chosen.id === target.id;
      if (isRight) {
        btn.classList.add('correct');
        state.quizScore++;
        state.quizStreak++;
      } else {
        btn.classList.add('wrong');
        state.quizStreak = 0;
        allBtns.forEach(b => {
          const rightText = state.quizDir === 'en2zh' ? target.c : target.w;
          if (b.textContent === rightText) b.classList.add('correct');
        });
      }

      document.getElementById('quizScore').textContent = state.quizScore;
      document.getElementById('quizTotal').textContent = state.quizTotal;
      document.getElementById('quizStreak').textContent = state.quizStreak;

      document.getElementById('quizFeedbackTitle').textContent = isRight
        ? '✅ 答對了！'
        : `❌ 答錯了，正確答案是：${target.w} — ${target.c}`;
      document.getElementById('quizFeedbackDetail').textContent = target.es
        ? `例句：${target.es}（${target.cs}）`
        : '';
      document.getElementById('quizFeedback').classList.add('show');
    }

    // LIST RENDER
    function renderList() {
      const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
      if (state.listPage > totalPages) state.listPage = totalPages;
      const start = (state.listPage - 1) * state.pageSize;
      const slice = filtered.slice(start, start + state.pageSize);

      const container = document.getElementById('listRows');
      if (!slice.length) {
        container.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-muted);">沒有符合條件的單字</div>';
      } else {
        container.innerHTML = slice.map((item, i) => `
          <div class="word-row">
            <div><span class="badge badge-lv">Lv.${item.l}</span></div>
            <div>
              <div class="list-word">${escapeHtml(item.w)} <span style="font-size:0.8rem; color:var(--text-muted); font-weight:500;">${escapeHtml(item.p)}</span></div>
              <div class="list-kk">${item.k ? '[' + escapeHtml(item.k) + ']' : ''}</div>
            </div>
            <div class="list-zh">${escapeHtml(item.c)}</div>
            <div class="list-actions">
              <button class="mini-btn" onclick="speakByIndex(${start + i})" title="發音">🔊</button>
              <button class="mini-btn" onclick="jumpToCard(${start + i})" title="查看單字卡">卡片</button>
            </div>
          </div>
        `).join('');
      }

      document.getElementById('listPageInfo').textContent = `第 ${state.listPage} / ${totalPages} 頁（共 ${filtered.length} 字）`;
      document.getElementById('listPrevBtn').disabled = state.listPage <= 1;
      document.getElementById('listNextBtn').disabled = state.listPage >= totalPages;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    window.speakByIndex = function(idx) {
      if (filtered[idx]) speak(filtered[idx].w);
    };

    window.jumpToCard = function(idx) {
      state.index = idx;
      state.tab = 'flashcard';
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'flashcard'));
      renderCurrentTab();
    };

    // Event Listeners
    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        state.tab = tab.dataset.tab;
        renderCurrentTab();
      });
    });

    document.querySelectorAll('#levelPills .pill').forEach(p => {
      p.addEventListener('click', () => {
        document.querySelectorAll('#levelPills .pill').forEach(x => x.classList.remove('active'));
        p.classList.add('active');
        state.level = p.dataset.level;
        updateDeck(true);
      });
    });

    document.querySelectorAll('#statusPills .pill').forEach(p => {
      p.addEventListener('click', () => {
        document.querySelectorAll('#statusPills .pill').forEach(x => x.classList.remove('active'));
        p.classList.add('active');
        state.status = p.dataset.status;
        updateDeck(true);
      });
    });

    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.search = e.target.value;
        updateDeck(true);
      }, 180);
    });

    document.getElementById('flashcardContainer').addEventListener('click', e => {
      if (e.target.closest('button')) return;
      flipCard();
    });

    document.getElementById('speakWordBtn').addEventListener('click', e => {
      e.stopPropagation();
      if (filtered[state.index]) speak(filtered[state.index].w);
    });
    document.getElementById('speakWordBackBtn').addEventListener('click', e => {
      e.stopPropagation();
      if (filtered[state.index]) speak(filtered[state.index].w);
    });
    document.getElementById('speakSentenceBtn').addEventListener('click', e => {
      e.stopPropagation();
      if (filtered[state.index]) speak(filtered[state.index].es);
    });

    document.getElementById('starBtn').addEventListener('click', e => { e.stopPropagation(); toggleStarCurrent(); });
    document.getElementById('starBackBtn').addEventListener('click', e => { e.stopPropagation(); toggleStarCurrent(); });

    document.getElementById('prevBtn').addEventListener('click', () => moveCard(-1));
    document.getElementById('nextBtn').addEventListener('click', () => moveCard(1));
    document.getElementById('markKnownBtn').addEventListener('click', () => markCurrent(true));
    document.getElementById('markReviewBtn').addEventListener('click', () => markCurrent(false));

    document.getElementById('shuffleBtn').addEventListener('click', function() {
      state.shuffled = !state.shuffled;
      this.classList.toggle('active', state.shuffled);
      this.textContent = state.shuffled ? '🔀 隨機：開' : '🔀 隨機順序';
      updateDeck(true);
    });

    document.getElementById('directionBtn').addEventListener('click', function() {
      state.reverseDir = !state.reverseDir;
      this.textContent = state.reverseDir ? '中 → 英' : '英 → 中';
      this.classList.toggle('active', state.reverseDir);
      renderFlashcard();
    });

    document.getElementById('autoSpeakBtn').addEventListener('click', function() {
      state.autoSpeak = !state.autoSpeak;
      this.classList.toggle('active', state.autoSpeak);
      this.textContent = state.autoSpeak ? '🔊 自動發音：開' : '🔊 自動發音：關';
    });

    document.getElementById('quizDirBtn').addEventListener('click', function() {
      state.quizDir = state.quizDir === 'en2zh' ? 'zh2en' : 'en2zh';
      this.textContent = state.quizDir === 'en2zh' ? '題目：英選中' : '題目：中選英';
      nextQuizQuestion();
    });
    document.getElementById('quizSpeakBtn').addEventListener('click', () => {
      if (state.quizCurrent) speak(state.quizCurrent.w);
    });
    document.getElementById('quizNextBtn').addEventListener('click', nextQuizQuestion);
    document.getElementById('quizStarBtn').addEventListener('click', function() {
      if (!state.quizCurrent) return;
      const id = state.quizCurrent.id;
      if (saved.starred[id]) delete saved.starred[id];
      else saved.starred[id] = 1;
      persist();
      this.textContent = saved.starred[id] ? '★ 已收藏' : '⭐ 加入收藏';
    });

    document.getElementById('listPrevBtn').addEventListener('click', () => { state.listPage--; renderList(); window.scrollTo(0,0); });
    document.getElementById('listNextBtn').addEventListener('click', () => { state.listPage++; renderList(); window.scrollTo(0,0); });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('確定要清除所有「已熟記」與「收藏」的學習紀錄嗎？')) {
        saved.known = {};
        saved.starred = {};
        persist();
        updateDeck(false);
      }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (document.activeElement.tagName === 'INPUT') return;
      if (state.tab !== 'flashcard') return;
      if (e.code === 'Space') { e.preventDefault(); flipCard(); }
      else if (e.key === 'ArrowRight') moveCard(1);
      else if (e.key === 'ArrowLeft') moveCard(-1);
      else if (e.key.toLowerCase() === 'a') { if (filtered[state.index]) speak(filtered[state.index].w); }
      else if (e.key.toLowerCase() === 's') toggleStarCurrent();
      else if (e.key === '1') markCurrent(true);
      else if (e.key === '2') markCurrent(false);
    });

    // Init
    updateDeck(true);
  </script>
</body>
</html>
