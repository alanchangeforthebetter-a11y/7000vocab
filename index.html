in chemistry; a person engaged in chemical research or experiments."},{"id":2355,"l":5,"w":"chestnut","k":"`t ʃɛs͵nʌt","p":"n.","c":"栗子","es":"We roasted chestnuts over an open fire on a cold evening.","cs":"在一個寒冷的夜晚，我們在爐火上烤栗子。","d":"A glossy brown edible nut that may be roasted; the tree that bears this nut."},{"id":2356,"l":5,"w":"chili","k":"`t ʃɪlɪ","p":"n.","c":"胡椒","es":"She likes to add a little extra chili powder to make the dish spicy.","cs":"她喜歡多加一點辣椒粉讓菜餚更辣。","d":"A small, hot-tasting pod of a variety of capsicum, used as a spice in cooking."},{"id":2357,"l":5,"w":"chimpanzee","k":"͵t ʃɪmpæ n`zi","p":"n.","c":"黑猩猩","es":"A clever chimpanzee at the zoo learned how to use a tablet.","cs":"動物園裡一隻聰明的黑猩猩學會了使用平板電腦。","d":"A great ape with large ears and mainly black coloration, native to the forests of Africa."},{"id":2358,"l":5,"w":"choir","k":"kwa ɪr","p":"n.","c":"唱詩班","es":"She sings alto in the church choir every Sunday.","cs":"她每週日在教堂唱詩班唱女低音。","d":"An organized group of singers, typically one that takes part in church services or performs in public."},{"id":2359,"l":5,"w":"chord","k":"k ɔrd","p":"n.","c":"和弦；和音","es":"The guitarist played a complex sequence of acoustic chords.","cs":"吉他手彈奏了一連串複雜的原聲和弦。","d":"A group of (typically three or more) notes sounded together, as a basis of harmony."},{"id":2360,"l":5,"w":"chubby","k":"`t ʃʌbɪ","p":"adj.","c":"圓胖的；豐滿的","es":"The baby had cute, chubby cheeks and a big smile.","cs":"這個嬰兒有可愛、圓胖的臉頰和一個大大的微笑。","d":"Plump and rounded in an endearing way."},{"id":2361,"l":5,"w":"circuit","k":"`s ɝkɪt","p":"n.","c":"電路","es":"An electrical short in the main circuit caused the power outage.","cs":"主電路中的電線短路導致了停電。","d":"A closed path through which an electric current flows; a roughly circular line or route."},{"id":2362,"l":5,"w":"cite","k":"sa ɪt","p":"vt.","c":"引用；引 …為證","es":"The professor asked the students to cite all their sources accurately.","cs":"教授要求學生準確地引用他們所有的來源。","d":"To quote (a passage, book, or author) as evidence for or justification of an argument or statement."},{"id":2363,"l":5,"w":"civic","k":"`s ɪvɪk","p":"adj.","c":"公民的；市民的","es":"They organized a campaign to encourage greater civic engagement.","cs":"他們組織了一場運動來鼓勵更高的公民參與。","d":"Relating to a city or town, especially its administration, or to the duties of its citizens."},{"id":2364,"l":5,"w":"clam","k":"klæ m","p":"n.","c":"蛤；鉗子","es":"We gathered buckets of fresh clams at low tide.","cs":"我們在退潮時採集了幾桶新鮮的蛤蜊。","d":"A marine bivalve mollusk with shells of equal size, often eaten as food."},{"id":2365,"l":5,"w":"clan","k":"klæ n","p":"n.","c":"氏族；部落","es":"The Scottish clan is famous for its distinctive tartan pattern.","cs":"這個蘇格蘭宗族以其獨特的格子圖案而聞名。","d":"A group of close-knit and interrelated families."},{"id":2366,"l":5,"w":"clasp","k":"klæ sp","p":"vt.vi.n.","c":"緊握；緊抱；擁抱","es":"She wore a necklace with a beautiful silver clasp.","cs":"她戴著一條有美麗銀色扣環的項鍊。","d":"To grasp something tightly with one's hand; a device with interlocking parts used for fastening."},{"id":2367,"l":5,"w":"clause","k":"kl ɔz","p":"n.","c":"子句；條款","es":"The contract includes a new clause regarding data protection.","cs":"這份合約包含了一條關於資料保護的新條款。","d":"A unit of grammatical organization next below the sentence; a distinct article or provision in a contract."},{"id":2368,"l":5,"w":"cling","k":"kl ɪŋ","p":"vi.","c":"黏著；纏著；緊抓","es":"The wet clothes cling to his skin after he fell into the river.","cs":"他掉進河裡後，濕衣服緊貼著他的皮膚。","d":"To hold on tightly to someone or something."},{"id":2369,"l":5,"w":"clockwise","k":"`kl ɑk͵wa ɪz","p":"adj.advt.","c":"順時針的 (地)","es":"To open the jar, turn the lid clockwise.","cs":"要打開這個罐子，請將蓋子順時針轉動。","d":"In the same direction as the way in which the hands of a clock move round."},{"id":2370,"l":5,"w":"clover","k":"`klov ɚ","p":"n.","c":"苜蓿；三葉草","es":"She searched the field hoping to find a four-leaf clover.","cs":"她在田野裡尋找，希望找到一片四葉草。","d":"A herbaceous plant of the pea family that has dense flower heads and leaves that are typically three-lobed."},{"id":2371,"l":5,"w":"cluster","k":"`kl ʌstɚ","p":"n.","c":"群；串；束","es":"A tight cluster of stars was visible through the telescope.","cs":"透過望遠鏡可以看到一群緊密的星星。","d":"A group of similar things or people positioned or occurring closely together."},{"id":2372,"l":5,"w":"clutch","k":"kl ʌtʃ","p":"vt.vi.n.","c":"抓住；離合器","es":"He had to clutch the steering wheel to keep the car steady.","cs":"他不得不緊緊抓住方向盤以保持汽車穩定。","d":"To grasp or catch eagerly or tightly; a mechanism for connecting and disconnecting an engine and the transmission system."},{"id":2373,"l":5,"w":"coastline","k":"`kost͵la ɪn","p":"n.","c":"海岸線","es":"The entire coastline of the island is protected as a nature reserve.","cs":"這個島的整個海岸線都作為自然保護區受到保護。","d":"The outline of a coast, especially with regard to its shape and appearance."},{"id":2374,"l":5,"w":"cocoon","k":"k ə`kun","p":"n.","c":"繭","es":"The silk worm spins a protective cocoon before becoming a moth.","cs":"蠶在變成蛾之前會吐出一個保護性的繭。","d":"A silky case spun by the larvae of many insects for protection in the pupal stage."},{"id":2375,"l":5,"w":"coil","k":"k ɔɪl","p":"n.v.","c":"線圈；捲；捲；盤繞","es":"The electrician unwound a large coil of copper wire.","cs":"電工解開了一大捲銅線。","d":"A length of something wound or arranged in a spiral or sequence of rings; to wind into a spiral."},{"id":2376,"l":5,"w":"colleague","k":"`k ɑlig","p":"n.","c":"同事","es":"He and his colleagues often collaborate on new projects.","cs":"他和他的同事們經常在新專案上合作。","d":"A person with whom one works, especially in a profession or business."},{"id":2377,"l":5,"w":"colonel","k":"`k ɝn!","p":"n.","c":"陸軍上校","es":"The colonel gave the order to advance across the field.","cs":"這位上校下達了越過田野推進的命令。","d":"An army officer of high rank, above a lieutenant colonel."},{"id":2378,"l":5,"w":"colonial","k":"k ə`lonj əl","p":"adj.","c":"殖民 (地)的","es":"The country is still dealing with the legacy of its colonial past.","cs":"這個國家仍在應對其殖民歷史的遺產。","d":"Relating to or characteristic of a colony or colonies."},{"id":2379,"l":5,"w":"combat","k":"`k ɑmbæ t","p":"n.vt.vi.","c":"戰鬥","es":"The soldiers were trained for close-quarters combat.","cs":"這些士兵接受了近距離戰鬥的訓練。","d":"Fighting between armed forces; to take action to reduce or destroy something bad."},{"id":2380,"l":5,"w":"comedian","k":"k ə`midɪən","p":"n.","c":"喜劇演員","es":"The comedian's stand-up routine had the audience roaring with laughter.","cs":"這位喜劇演員的單口相聲讓觀眾捧腹大笑。","d":"An entertainer whose act is designed to make an audience laugh."},{"id":2381,"l":5,"w":"comet","k":"`k ɑmɪt","p":"n.","c":"彗星","es":"The bright comet was visible in the sky for several weeks.","cs":"這顆明亮的彗星在天空中可見了好幾個星期。","d":"A celestial object consisting of a nucleus of ice and dust and a 'tail' of gas pointing away from the sun."},{"id":2382,"l":5,"w":"commentator","k":"`k ɑmən͵tetɚ","p":"n.","c":"評論家","es":"A political commentator offered his analysis of the election results.","cs":"一位政治評論員對選舉結果提供了他的分析。","d":"A person who delivers a live broadcast commentary on an event or performance."},{"id":2383,"l":5,"w":"commission","k":"k ə`mɪʃən","p":"n.v.","c":"傭金；委任","es":"She earns a small commission on every sale she makes.","cs":"她從她所做的每筆銷售中賺取一小筆佣金。","d":"An instruction, command, or duty given to a person; a percentage of a sale paid to a salesperson."},{"id":2384,"l":5,"w":"commodity","k":"k ə`mɑdətɪ","p":"n.","c":"商品；日用品","es":"Oil is a valuable and highly traded global commodity.","cs":"石油是一種有價值且交易量大的全球商品。","d":"A raw material or primary agricultural product that can be bought and sold."},{"id":2385,"l":5,"w":"commonplace","k":"`k ɑmən͵ples","p":"adj.","c":"平凡的","es":"Smartphones have become utterly commonplace in modern society.","cs":"智慧型手機在現代社會中已經變得完全普遍。","d":"Not unusual; ordinary."},{"id":2386,"l":5,"w":"communism","k":"`k ɑmjʊ͵nɪzəm","p":"n.","c":"共產主義","es":"The political science class discussed the history of communism.","cs":"政治學課討論了共產主義的歷史。","d":"A political theory advocating class war and leading to a society in which all property is publicly owned."},{"id":2387,"l":5,"w":"communist","k":"`k ɑmjʊ͵nɪst","p":"n.adj.","c":"共產主義者；共產主義的","es":"Historically, the two global powers were led by a communist government.","cs":"歷史上，這兩個全球大國曾由一個共產主義政府領導。","d":"A person who supports or believes in the principles of communism."},{"id":2388,"l":5,"w":"commute","k":"k ə`mjut","p":"vi.n.","c":"通勤","es":"He has a long daily commute from the suburbs to the city center.","cs":"他每天從郊區到市中心有很長的通勤路程。","d":"To travel some distance between one's home and place of work on a regular basis."},{"id":2389,"l":5,"w":"commuter","k":"k ə`mjut ɚ","p":"n.","c":"通勤者","es":"The train station is packed with commuters every morning.","cs":"每天早上火車站都擠滿了通勤者。","d":"A person who travels some distance to work on a regular basis."},{"id":2390,"l":5,"w":"compact","k":"k əm`pæ kt","p":"adj.","c":"緊密的；小巧的","es":"Her new apartment is small but very compact and efficiently designed.","cs":"她的新公寓很小，但設計得非常緊湊且高效。","d":"Closely and neatly packed together; dense or small."},{"id":2391,"l":5,"w":"compass","k":"`k ʌmpəs","p":"n.","c":"指南針","es":"We used a compass and map to navigate through the forest.","cs":"我們使用羅盤和地圖在森林中導航。","d":"An instrument containing a magnetized pointer that shows the direction of magnetic north."},{"id":2392,"l":5,"w":"compassion","k":"k əm`pæ ʃən","p":"n.","c":"同情","es":"She shows great compassion for the less fortunate members of society.","cs":"她對社會上較不幸的人表現出極大的同情心。","d":"Sympathetic pity and concern for the sufferings or misfortunes of others."},{"id":2393,"l":5,"w":"compassionate","k":"k əm`pæ ʃənet","p":"adj.","c":"有同情心 的","es":"The nurse was very compassionate and kind to all her patients.","cs":"這位護士對她所有的病人都非常有同情心和友善。","d":"Feeling or showing sympathy and concern for others."},{"id":2394,"l":5,"w":"compel","k":"k əm`pɛl","p":"vt.","c":"強迫","es":"The evidence was strong enough to compel a change in the jury's verdict.","cs":"這些證據足以迫使陪審團改變判決。","d":"To force or oblige someone to do something."},{"id":2395,"l":5,"w":"compliment","k":"`k ɑmpləmənt","p":"n.vt.","c":"恭維；稱讚","es":"She received a sincere compliment on her cooking skills.","cs":"她收到了對她烹飪技巧的真誠讚美。","d":"A polite expression of praise or admiration."},{"id":2396,"l":5,"w":"compound","k":"`k ɑmpaʊnd","p":"n.vt.","c":"混合物；合成","es":"Salt is a chemical compound made of sodium and chlorine.","cs":"鹽是由鈉和氯組成的化學化合物。","d":"A thing that is composed of two or more separate elements; a mixture."},{"id":2397,"l":5,"w":"comprehend","k":"͵k ɑmprɪ`hɛnd","p":"vt.","c":"理解","es":"It took him a while to fully comprehend the complexity of the theory.","cs":"他花了一段時間才完全理解這個理論的複雜性。","d":"To grasp mentally; understand."},{"id":2398,"l":5,"w":"comprehension","k":"͵k ɑmprɪ`hɛnʃən","p":"n.","c":"理解力","es":"The test measures a student's reading comprehension.","cs":"這項測驗測量學生的閱讀理解力。","d":"The action or capability of understanding something."},{"id":2399,"l":5,"w":"compromise","k":"`k ɑmprə͵maɪz","p":"n.vt.vi.","c":"妥協；讓步","es":"After a long discussion, they reached a compromise that satisfied everyone.","cs":"經過長時間討論，他們達成了一個讓每個人都滿意的妥協。","d":"An agreement or a settlement of a dispute that is reached by each side making concessions."},{"id":2400,"l":5,"w":"compute","k":"k əm`pjut","p":"vt.vi.n.","c":"計算","es":"The software can quickly compute complex mathematical equations.","cs":"該軟體可以快速計算複雜的數學方程式。","d":"To calculate or reckon (a figure or amount)."},{"id":2401,"l":5,"w":"computerize","k":"k əm`pjut ə͵raɪz","p":"vt.","c":"使電腦化","es":"The company plans to fully computerize its inventory system next month.","cs":"該公司計畫下個月將其庫存系統完全電腦化。","d":"To equip with or operate by computers."},{"id":2402,"l":5,"w":"comrade","k":"`k ɑmræ d","p":"n.","c":"夥伴","es":"He and his old army comrades still meet up once a year.","cs":"他和他以前的軍中戰友仍然每年聚會一次。","d":"A companion who shares one's activities or is a fellow member of an organization."},{"id":2403,"l":5,"w":"conceal","k":"k ən`sil","p":"vt.","c":"隱藏","es":"She tried to conceal her nervousness with a fixed smile.","cs":"她試圖用僵硬的微笑來隱藏她的緊張。","d":"To keep from sight; hide."},{"id":2404,"l":5,"w":"conceive","k":"k ən`siv","p":"vt.vi.","c":"想像","es":"It is difficult to conceive of a world without electricity.","cs":"很難想像一個沒有電的世界。","d":"To form or devise a plan or idea in the mind."},{"id":2405,"l":5,"w":"condemn","k":"k ən`dɛm","p":"vt.","c":"譴責","es":"World leaders condemned the act of violence in the strongest terms.","cs":"世界領袖以最強烈的措辭譴責了這一暴力行為。","d":"To express complete disapproval of, typically in public; to sentence someone to a punishment."},{"id":2406,"l":5,"w":"conduct","k":"k ən`dʌkt","p":"vt.vi.n.","c":"指揮；行為；行為；指導","es":"The scientists will conduct a new experiment in the lab.","cs":"科學家將在實驗室進行一項新實驗。","d":"The manner in which a person behaves; to organize and carry out."},{"id":2407,"l":5,"w":"confession","k":"k ən`fɛʃən","p":"n.","c":"坦白；懺悔","es":"After hours of questioning, the suspect finally made a confession.","cs":"經過數小時的審問，嫌疑人最終作了坦白。","d":"A formal statement admitting that one is guilty of a crime; acknowledgment of a fault."},{"id":2408,"l":5,"w":"confront","k":"k ən`frʌnt","p":"vt.","c":"面臨；遭遇","es":"We must confront the harsh reality of the situation.","cs":"我們必須面對形勢的嚴峻現實。","d":"To meet face-to-face with hostile or argumentative intent; to face up to and deal with a problem."},{"id":2409,"l":5,"w":"consent","k":"k ən`sɛnt","p":"vi.n.","c":"同意","es":"The medical procedure requires the patient's written consent.","cs":"該醫療程序需要病人的書面同意。","d":"Permission for something to happen or agreement to do something."},{"id":2410,"l":5,"w":"conserve","k":"k ən`sɝv","p":"vt.","c":"保存；節省","es":"We must take measures to conserve water during the drought.","cs":"在乾旱期間，我們必須採取措施節約用水。","d":"To protect something, especially an environmentally or culturally important place or thing, from harm or destruction."},{"id":2411,"l":5,"w":"considerate","k":"k ən`sɪdərɪt","p":"adj.","c":"體諒的","es":"It was very considerate of you to call and check on me.","cs":"您打電話來關心我，真是太體貼了。","d":"Careful not to cause inconvenience or hurt to others."},{"id":2412,"l":5,"w":"console","k":"k ən`sol","p":"vt.","c":"安慰","es":"She tried to console her friend after he lost his job.","cs":"在她的朋友失業後，她試圖安慰他。","d":"To comfort someone at a time of grief or disappointment."},{"id":2413,"l":5,"w":"constitutional","k":"͵k ɑnstə`tjuʃən!","p":"adj.","c":"憲法的","es":"The court ruled that the new law was not constitutional.","cs":"法院裁定這項新法律不符合憲法。","d":"Relating to an established set of principles governing a state."},{"id":2414,"l":5,"w":"contagious","k":"k ən`ted ʒəs","p":"adj.","c":"有傳染性的","es":"Laughter can be very contagious in a happy group.","cs":"在一個快樂的群體中，笑聲可以很有感染力。","d":"Spread from one person or organism to another by direct or indirect contact."},{"id":2415,"l":5,"w":"contaminate","k":"k ən`tæ m ə͵net","p":"vt.","c":"汙染","es":"The factory was fined for contaminating the local river.","cs":"該工廠因汙染當地河流而被罰款。","d":"To make something impure by exposure to or addition of a poisonous or polluting substance."},{"id":2416,"l":5,"w":"contemplate","k":"`k ɑntɛm͵plet","p":"vt.vi.","c":"深思","es":"He sat by the window, contemplating the meaning of life.","cs":"他坐在窗邊，沉思著生命的意義。","d":"To look thoughtfully for a long time at; to think deeply about."},{"id":2417,"l":5,"w":"contemporary","k":"k ən`tɛmpə͵rɛrɪ","p":"adj.","c":"當代的","es":"The gallery showcases modern and contemporary Asian art.","cs":"畫廊展示了現代和當代的亞洲藝術。","d":"Living or occurring at the same time; belonging to or occurring in the present."},{"id":2418,"l":5,"w":"contempt","k":"k ən`tɛmpt","p":"n.","c":"輕視","es":"She felt nothing but contempt for his dishonest behavior.","cs":"對於他不誠實的行為，她只感到蔑視。","d":"The feeling that a person or a thing is beneath consideration, worthless, or deserving scorn."},{"id":2419,"l":5,"w":"contend","k":"k ən`tɛnd","p":"vt.vi.","c":"爭論；競爭","es":"The two teams will contend for the national title next week.","cs":"這兩支隊伍將於下週爭奪全國冠軍頭銜。","d":"To struggle to surmount a difficulty or danger; to assert something as a position in an argument."},{"id":2420,"l":5,"w":"continental","k":"͵k ɑntə`nɛnt!","p":"adj.","c":"洲的；大陸的","es":"The weather patterns here are typical of a continental climate.","cs":"這裡的天氣模式是典型的大陸性氣候。","d":"Forming or belonging to a continent."},{"id":2421,"l":5,"w":"continuity","k":"͵k ɑntə`njuətɪ","p":"n.","c":"連貫性；持續性","es":"The film director edited the scenes carefully to maintain continuity.","cs":"電影導演仔細剪輯了這些場景以保持連續性。","d":"The unbroken and consistent existence or operation of something over a period of time."},{"id":2422,"l":5,"w":"convert","k":"k ən`vɝt","p":"vt.vi.","c":"轉換；變成","es":"The old warehouse was converted into modern apartments.","cs":"這座舊倉庫被改建成現代公寓。","d":"To cause to change in form, character, or function."},{"id":2423,"l":5,"w":"convict","k":"k ən`vɪkt","p":"vt.","c":"判...有罪；判決","es":"The jury took only an hour to convict the defendant of fraud.","cs":"陪審團只花了一個小時就宣判被告欺詐罪名成立。","d":"To declare someone to be guilty of a criminal offense by the verdict of a jury or judge."},{"id":2424,"l":5,"w":"copyright","k":"`k ɑpɪ͵raɪt","p":"n.","c":"版權；著作權","es":"You must obtain permission to reproduce material protected by copyright.","cs":"您必須獲得許可才能複製受版權保護的材料。","d":"The exclusive legal right given to an originator or an assignee to print, publish, perform, film, or record material."},{"id":2425,"l":5,"w":"coral","k":"`k ɔrəl","p":"n.","c":"珊瑚","es":"Divers explored the vibrant, colorful coral reef ecosystem.","cs":"潛水員探索了充滿活力、色彩斑斕的珊瑚礁生態系統。","d":"A hard stony substance secreted by certain marine coelenterates, typically forming large reefs in warm seas."},{"id":2426,"l":5,"w":"corporation","k":"͵k ɔrpə`reʃən","p":"n.","c":"股份有限公司","es":"She works in the legal department of a multinational corporation.","cs":"她在一家跨國公司的法律部門工作。","d":"A company or group of people authorized to act as a single entity and recognized as such in law."},{"id":2427,"l":5,"w":"correspondence","k":"͵k ɔrə`spɑndəns","p":"n.","c":"通信","es":"The archives contain decades of personal and professional correspondence.","cs":"檔案館藏有數十年的私人和專業信件。","d":"Communication by exchanging letters with someone."},{"id":2428,"l":5,"w":"corridor","k":"`k ɔrɪdɚ","p":"n.","c":"走廊；通道","es":"He walked down the long, empty corridor to the conference room.","cs":"他沿著空曠的長走廊走向會議室。","d":"A long passage in a building from which doors lead into rooms."},{"id":2429,"l":5,"w":"corrupt","k":"kə`rʌpt","p":"vt.vi.adj.","c":"腐敗 (的)","es":"The investigation revealed a system that was deeply corrupt.","cs":"調查揭示了一個根深蒂固腐敗的系統。","d":"Having or showing a willingness to act dishonestly in return for money or personal gain."},{"id":2430,"l":5,"w":"counsel","k":"`ka ʊns!","p":"n.vt.vi.","c":"忠告；商議","es":"The school provides professional counseling for students with stress.","cs":"學校為有壓力的學生提供專業的諮詢。","d":"Advice, especially that given formally."},{"id":2431,"l":5,"w":"counselor","k":"`ka ʊns!ɚ","p":"n.","c":"顧問；輔導員","es":"She met with her academic counselor to discuss her course selection.","cs":"她與她的學業顧問會面，討論她的課程選擇。","d":"A person trained to give guidance on personal, social, or psychological problems."},{"id":2432,"l":5,"w":"counterclockwise","k":"͵ka ʊntɚ`klɑk͵wa ɪz","p":"adj.advt.","c":"逆時針的 (地)","es":"To loosen the screw, turn it counterclockwise.","cs":"要鬆開螺絲，請逆時針轉動它。","d":"In the opposite direction to the way in which the hands of a clock move around."},{"id":2433,"l":5,"w":"coupon","k":"`kup ɑn","p":"n.","c":"折價券；優待券","es":"I used a two-dollar coupon to get a discount on the shampoo.","cs":"我使用了一張兩美元的優惠券來獲得洗髮精的折扣。","d":"A voucher entitling the holder to a discount for a particular product."},{"id":2434,"l":5,"w":"courtyard","k":"`kort`j ɑrd","p":"n.","c":"庭院","es":"The students gathered in the sunny inner courtyard during lunch break.","cs":"學生們在午休時間聚集在陽光充足的內院。","d":"An unroofed area that is completely or mostly enclosed by the walls of a large building."},{"id":2435,"l":5,"w":"cowardly","k":"`ka ʊɚdlɪ","p":"adj.advt.","c":"膽小的 (地)","es":"The knight was ashamed of his cowardly retreat from the battle.","cs":"這位騎士為自己在戰鬥中懦弱的撤退而感到羞恥。","d":"Lacking courage."},{"id":2436,"l":5,"w":"cozy","k":"`koz ɪ","p":"adj.","c":"舒適的","es":"We spent the cold evening in a cozy cabin by the fireplace.","cs":"我們在壁爐旁一個舒適的小木屋裡度過了寒冷的夜晚。","d":"Giving a feeling of comfort, warmth, and relaxation."},{"id":2437,"l":5,"w":"cracker","k":"`kræ k ɚ","p":"n.","c":"脆餅；爆竹","es":"She spread cheese on a salty cracker for a quick snack.","cs":"她把乳酪塗在鹹味餅乾上，作為快速點心。","d":"A thin, crisp wafer often eaten with cheese or other savory toppings."},{"id":2438,"l":5,"w":"crater","k":"`kret ɚ","p":"n.","c":"火山口","es":"They hiked to the rim of the volcano to look down into the large crater.","cs":"他們徒步到火山口邊緣，向下看那個巨大的坑。","d":"A large, bowl-shaped cavity in the ground or on the surface of a planet or the moon."},{"id":2439,"l":5,"w":"creak","k":"krik","p":"vt.vi.","c":"發出喀吱聲","es":"The old wooden floor began to creak as he stepped onto it.","cs":"當他踏上舊木地板時，它開始嘎吱作響。","d":"To make a harsh, high-pitched sound when being moved or when pressure or weight is applied."},{"id":2440,"l":5,"w":"creek","k":"krik","p":"n.","c":"小河","es":"We fished for trout in the shallow mountain creek.","cs":"我們在淺山溪裡釣鱒魚。","d":"A stream, brook, or minor tributary of a river."},{"id":2441,"l":5,"w":"crib","k":"kr ɪb","p":"n.","c":"嬰兒床","es":"The baby was sleeping peacefully in his new wooden crib.","cs":"嬰兒在他的新木製嬰兒床裡安詳地睡著。","d":"A child's bed with barred or latticed sides."},{"id":2442,"l":5,"w":"crocodile","k":"`kr ɑkə͵daɪl","p":"n.","c":"鱷魚","es":"Be careful not to swim in the river, as there are large crocodiles.","cs":"小心不要在河裡游泳，因為有大型鱷魚。","d":"A large predatory semiaquatic reptile with long jaws, long tail, short legs, and a horny textured skin."},{"id":2443,"l":5,"w":"crossing","k":"`kr ɔsɪŋ","p":"n.","c":"交叉點；十字路口","es":"Use the pedestrian crossing to safely get to the other side of the road.","cs":"使用人行穿越道安全地到達馬路的另一邊。","d":"A place where two roads, two railway lines, or a road and a railway line cross."},{"id":2444,"l":5,"w":"crouch","k":"kra ʊtʃ","p":"n.vt.vi.","c":"蹲伏","es":"The photographer had to crouch low to take a picture of the bird.","cs":"攝影師不得不低蹲才能拍到這隻鳥的照片。","d":"To adopt a position where the knees are bent and the upper body is brought forward and down."},{"id":2445,"l":5,"w":"crunch","k":"kr ʌntʃ","p":"vt.n.","c":"(發出 )嘎吱吱的聲音","es":"We heard the sound of tires crunching on the gravel road.","cs":"我們聽到輪胎在碎石路上嘎吱作響的聲音。","d":"To crush a hard food or substance with the teeth, making a loud sound."},{"id":2446,"l":5,"w":"crystal","k":"`kr ɪst!","p":"n.","c":"水晶","es":"The chandelier was decorated with beautiful, delicate crystals.","cs":"這盞吊燈裝飾著美麗、精緻的水晶。","d":"A piece of a homogeneous solid substance having a natural geometrically regular form."},{"id":2447,"l":5,"w":"cuisine","k":"kw ɪ`zin","p":"n.","c":"菜餚；烹飪","es":"French cuisine is famous for its rich sauces and elegant presentation.","cs":"法國菜以其濃郁的醬汁和優雅的擺盤而聞名。","d":"A style or method of cooking, especially as characteristic of a particular country or region."},{"id":2448,"l":5,"w":"curb","k":"k ɝb","p":"n.vt.","c":"路邊；邊欄；抑制","es":"He parked his car close to the curb to allow other traffic to pass.","cs":"他將車停在靠近路邊，讓其他車輛通過。","d":"A stone or concrete edging to a street or path; a check or restraint on something."},{"id":2449,"l":5,"w":"currency","k":"`k ɝənsɪ","p":"n.","c":"貨幣；流通","es":"The Euro is the official currency of many European countries.","cs":"歐元是許多歐洲國家的官方貨幣。","d":"A system of money in general use in a particular country."},{"id":2450,"l":5,"w":"curriculum","k":"k ə`rɪkjələm","p":"n.","c":"課程 (複:curricula)","es":"The school is reviewing its science curriculum for the coming academic year.","cs":"學校正在審查其下一學年的科學課程。","d":"The subjects comprising a course of study in a school or college."},{"id":2451,"l":5,"w":"curry","k":"`k ɝɪ","p":"n.","c":"咖哩","es":"She made a mild chicken curry served with white rice.","cs":"她做了一份溫和的雞肉咖哩，搭配白飯。","d":"A dish of meat, vegetables, etc., cooked in an Indian-style sauce of strong spices and turmeric."},{"id":2452,"l":5,"w":"customs","k":"`k ʌstəmz","p":"n.","c":"海關；關稅","es":"We had to declare all purchases when passing through customs.","cs":"我們在通過海關時必須申報所有購買的物品。","d":"The official department that administers and collects the duties levied by a government on imported goods."},{"id":2453,"l":5,"w":"dart","k":"d ɑrt","p":"n.v.","c":"鏢 ；投擲 ；急衝","es":"He threw the dart with a steady hand, hitting the bullseye.","cs":"他用穩定的手投出飛鏢，擊中了靶心。","d":"A small pointed missile that can be thrown or fired; to move or run somewhere suddenly or rapidly."},{"id":2454,"l":5,"w":"dazzle","k":"`dæ z!","p":"vt.","c":"使…目眩；耀眼","es":"The sunlight reflecting off the snow was enough to dazzle him.","cs":"陽光從雪上反射出來，足以使他眼花繚亂。","d":"To blind someone temporarily with bright light; to impress deeply."},{"id":2455,"l":5,"w":"decay","k":"d ɪ`ke","p":"n.vt.vi.","c":"腐朽；衰敗","es":"The wooden structure began to decay after years of exposure to rain.","cs":"這座木製結構在多年暴露於雨水後開始腐爛。","d":"To rot or decompose through the action of bacteria and fungi; the state or process of rotting."},{"id":2456,"l":5,"w":"deceive","k":"d ɪ`siv","p":"vt.vi.","c":"欺騙；蒙蔽","es":"The advertisement was cleverly designed to deceive consumers.","cs":"這個廣告被巧妙地設計來欺騙消費者。","d":"To cause someone to believe something that is not true, typically in order to gain some personal advantage."},{"id":2457,"l":5,"w":"declaration","k":"͵d ɛklə`reʃən","p":"n.","c":"宣言","es":"The two countries issued a joint declaration of peace.","cs":"這兩個國家發表了聯合和平聲明。","d":"A formal or explicit statement or announcement."},{"id":2458,"l":5,"w":"delegate","k":"`d ɛlə͵get","p":"n.v.","c":"代表團團員 ；派...為代表","es":"Each country sent two official delegates to the international conference.","cs":"每個國家都派了兩名官方代表參加國際會議。","d":"A person sent or authorized to represent others; to entrust a task or responsibility to another person."},{"id":2459,"l":5,"w":"delegation","k":"͵d ɛlə`geʃən","p":"n.","c":"代表團；委任","es":"The trade delegation is scheduled to meet with local businesses tomorrow.","cs":"貿易代表團預計明天會見當地企業。","d":"A body of delegates or representatives; a deputation."},{"id":2460,"l":5,"w":"democrat","k":"`d ɛmə͵kræ t","p":"n.","c":"民主主義者","es":"The newly elected official is a strong democrat who advocates for equality.","cs":"這位新當選的官員是一位主張平等的堅定民主主義者。","d":"An advocate or supporter of democracy."},{"id":2461,"l":5,"w":"denial","k":"d ɪ`naɪəl","p":"n.","c":"否認；拒絕","es":"Despite overwhelming evidence, he remained in denial of his actions.","cs":"儘管有壓倒性的證據，他仍然對自己的行為否認。","d":"The action of declaring something to be untrue."},{"id":2462,"l":5,"w":"descriptive","k":"d ɪ`skrɪptɪv","p":"adj","c":".描述的","es":"The author is skilled at writing vivid and descriptive passages.","cs":"這位作者擅長寫生動描寫的段落。","d":"Serving or seeking to describe."},{"id":2463,"l":5,"w":"despair","k":"d ɪ`spɛr","p":"n.vi.","c":"絕望","es":"The missing hikers were found alive, saving their family from despair.","cs":"失蹤的徒步旅行者被發現活著，使他們的家人免於絕望。","d":"The complete loss or absence of hope."},{"id":2464,"l":5,"w":"despise","k":"d ɪ`spaɪz","p":"vt.","c":"輕視","es":"She openly despises people who are rude to service staff.","cs":"她公開鄙視那些對服務人員粗魯的人。","d":"To feel a strong dislike for someone or something that you think is bad or worthless."},{"id":2465,"l":5,"w":"destination","k":"͵d ɛstə`neʃən","p":"n.","c":"目的地","es":"After a long flight, we finally reached our tropical vacation destination.","cs":"經過漫長的飛行，我們終於到達了我們的熱帶度假目的地。","d":"The place to which someone or something is going or being sent."},{"id":2466,"l":5,"w":"destiny","k":"`d ɛstənɪ","p":"n.","c":"命運","es":"He believes that meeting her was an act of destiny.","cs":"他相信與她相遇是命運的安排。","d":"The events that will necessarily happen to a particular person or thing in the future."},{"id":2467,"l":5,"w":"destructive","k":"d ɪ`strʌktɪv","p":"adj.","c":"有破壞性的","es":"The hurricane was incredibly destructive, causing widespread damage.","cs":"這場颶風具有難以置信的破壞性，造成了廣泛的損害。","d":"Causing great and irreparable harm or damage."},{"id":2468,"l":5,"w":"devotion","k":"d ɪ`voʃən","p":"n.","c":"奉獻；忠誠；熱愛","es":"Her devotion to her studies paid off with excellent grades.","cs":"她對學業的奉獻得到了回報，取得了優異的成績。","d":"Love, loyalty, or enthusiasm for a person, activity, or cause."},{"id":2469,"l":5,"w":"devour","k":"d ɪ`vaʊr","p":"vt.","c":"吞食","es":"The hungry campers quickly devoured the entire loaf of bread.","cs":"飢餓的露營者很快吞噬了整條麵包。","d":"To eat food or prey hungrily or quickly."},{"id":2470,"l":5,"w":"dialect","k":"`da ɪəlɛkt","p":"n.","c":"方言","es":"In that small region, people speak a unique local dialect.","cs":"在那個小地區，人們說著一種獨特的當地方言。","d":"A particular form of a language which is peculiar to a specific region or social group."},{"id":2471,"l":5,"w":"disbelief","k":"͵d ɪsbə`lif","p":"n.","c":"不信；懷疑","es":"She stared at the winning lottery ticket in utter disbelief.","cs":"她帶著完全的不相信盯著那張中獎的彩票。","d":"Inability to believe that something is true or real."},{"id":2472,"l":5,"w":"discard","k":"`d ɪskɑrd","p":"n.","c":"丟棄","es":"We were told to discard all the spoiled food from the refrigerator.","cs":"我們被告知要丟棄冰箱裡所有變質的食物。","d":"To get rid of someone or something as no longer useful or desirable."},{"id":2473,"l":5,"w":"disciple","k":"d ɪ`saɪp!","p":"n.","c":"信徒；門徒","es":"The philosopher was followed by a group of loyal disciples.","cs":"這位哲學家身後跟隨著一群忠實的門徒。","d":"A follower or student of a teacher, leader, or philosopher."},{"id":2474,"l":5,"w":"discriminate","k":"d ɪ`skrɪmə͵net","p":"vt.vi.","c":"辨別；歧視","es":"It is illegal to discriminate against someone based on their age.","cs":"歧視他人是違法的，不論其年齡為何。","d":"To recognize a distinction; to make an unjust or prejudicial distinction in the treatment of different categories of people."},{"id":2475,"l":5,"w":"dispense","k":"d ɪ`spɛns","p":"vt.","c":"分配；分送；執行","es":"The machine is designed to dispense cash quickly and securely.","cs":"這台機器設計用於快速且安全地發放現金。","d":"To distribute or provide (a service or information) to a number of people."},{"id":2476,"l":5,"w":"dispose","k":"d ɪ`spoz","p":"vt.vi.","c":"處理；整理；配置","es":"The company must legally dispose of hazardous waste.","cs":"該公司必須合法處理有害廢物。","d":"To get rid of by throwing away or giving or selling to someone else."},{"id":2477,"l":5,"w":"distinction","k":"d ɪ`stɪŋkʃən","p":"n.","c":"差別；卓越","es":"There is a clear distinction between a hobby and a career.","cs":"嗜好和職業之間有著明確的區別。","d":"A difference or contrast between similar things or people; excellence that sets someone or something apart from others."},{"id":2478,"l":5,"w":"distinctive","k":"d ɪ`stɪŋktɪv","p":"adj.","c":"有特色的","es":"The building has a very distinctive architectural style.","cs":"這座建築擁有非常獨特的建築風格。","d":"Characteristic of one person or thing, and so serving to distinguish it from others."},{"id":2479,"l":5,"w":"distress","k":"dɪ`strɛs","p":"n.v.","c":"痛苦；使痛苦","es":"The sailor sent out a signal of distress after his boat was damaged.","cs":"這位水手在船受損後發出了求救訊號。","d":"Extreme anxiety, sorrow, or pain; to cause someone anxiety, sorrow, or pain."},{"id":2480,"l":5,"w":"document","k":"`d ɑkjəmənt","p":"n.","c":"文件","es":"Please ensure all legal documents are signed before the deadline.","cs":"請確保所有法律文件在截止日期前簽署。","d":"A piece of written, printed, or electronic matter that provides information or evidence."},{"id":2481,"l":5,"w":"doorstep","k":"`dor͵st ɛp","p":"n.","c":"門階","es":"The package was left right on the doorstep this morning.","cs":"包裹今天早上被放在門階上。","d":"A step leading up to the outer door of a house."},{"id":2482,"l":5,"w":"doorway","k":"`dor͵we","p":"n.","c":"出入口","es":"He stood in the doorway, blocking the entrance to the room.","cs":"他站在門口，擋住了房間的入口。","d":"An entrance to a room or building through a door."},{"id":2483,"l":5,"w":"dormitory","k":"`d ɔrmə͵torɪ","p":"n.","c":"學生宿舍","es":"First-year students are required to live in the university dormitory.","cs":"一年級學生被要求住在大學宿舍。","d":"A large bedroom for a number of people in a school or institution."},{"id":2484,"l":5,"w":"dough","k":"do","p":"n.","c":"生麵團","es":"She kneaded the bread dough until it was smooth and elastic.","cs":"她揉捏麵包麵團直到它光滑且有彈性。","d":"A thick, malleable mixture of flour and liquid, used for baking into bread or pastry."},{"id":2485,"l":5,"w":"downward(s)","k":"`da ʊnwɚd(z)","p":"adj.advt.","c":"向下","es":"The chart showed a slight downward trend in sales last quarter.","cs":"圖表顯示上一季度銷售額有輕微的下降趨勢。","d":"Toward a lower place, point, or level."},{"id":2486,"l":5,"w":"drape","k":"drep","p":"n.v.","c":"簾 ；覆蓋","es":"She opened the thick velvet drapes to let the morning light in.","cs":"她拉開厚厚的絲絨窗簾，讓晨光照進來。","d":"To arrange loosely or casually on or around something; long curtains."},{"id":2487,"l":5,"w":"dreadful","k":"`dr ɛdfəl","p":"adj.","c":"畏懼的；可怕的","es":"The news of the accident was absolutely dreadful.","cs":"這個事故的消息絕對是可怕的。","d":"Causing or involving great suffering, fear, or unhappiness; extremely bad or serious."},{"id":2488,"l":5,"w":"dresser","k":"`dr ɛsɚ","p":"n.","c":"梳妝台； (劇場 )服裝員","es":"She kept her socks and underwear in the top drawer of the dresser.","cs":"她把她的襪子和內衣放在衣櫃最上面的抽屜裡。","d":"A piece of furniture with drawers, typically for storing clothes; a person whose job is to help actors dress."},{"id":2489,"l":5,"w":"dressing","k":"`dr ɛsɪŋ","p":"n.","c":"沙拉醬；服飾","es":"I prefer a simple oil and vinegar dressing on my salad.","cs":"我更喜歡我的沙拉上放簡單的油醋醬。","d":"A sauce for salads; a piece of material placed on a wound to protect it."},{"id":2490,"l":5,"w":"driveway","k":"`dra ɪv͵we","p":"n.","c":"私人車道","es":"Please park your car on the driveway so it doesn't block the street.","cs":"請將您的車停在車道上，這樣才不會擋住街道。","d":"A short road leading from a public road to a house or other building."},{"id":2491,"l":5,"w":"duration","k":"dj ʊ`reʃən","p":"n.","c":"持續期間","es":"The seminar will last for the duration of three hours.","cs":"這次研討會將持續三個小時。","d":"The time during which something continues."},{"id":2492,"l":5,"w":"dusk","k":"d ʌsk","p":"n.","c":"黃昏","es":"We finished our picnic just as the sun was setting at dusk.","cs":"太陽在黃昏時落下，我們剛好結束野餐。","d":"The darker stage of twilight."},{"id":2493,"l":5,"w":"dwarf","k":"dw ɔrf","p":"n.adj.","c":"矮子；矮小的","es":"In the fairy tale, Snow White meets seven kind dwarfs.","cs":"在童話故事中，白雪公主遇到了七個善良的小矮人。","d":"A member of a mythical race of short, stocky human-like creatures; unusually small."},{"id":2494,"l":5,"w":"dwell","k":"dw ɛl","p":"vi.","c":"居住","es":"The ancient tribe used to dwell in these caves thousands of years ago.","cs":"這個古老的部落在數千年前曾經居住在這些洞穴中。","d":"To live in or at a specified place."},{"id":2495,"l":5,"w":"dwelling","k":"`dw ɛlɪŋ","p":"n.","c":"住處","es":"The remote village consisted of only a few simple stone dwellings.","cs":"這個偏遠的村莊只由幾座簡單的石頭住所組成。","d":"A house, apartment, or other place of residence."},{"id":2496,"l":5,"w":"eclipse","k":"ɪ`klɪps","p":"n.vt.","c":"蝕","es":"Scientists gathered to observe the rare total solar eclipse.","cs":"科學家們聚集起來觀察罕見的日全食。","d":"An obscuring of the light from one celestial body by the passage of another."},{"id":2497,"l":5,"w":"eel","k":"il","p":"n.","c":"鰻；鱔魚","es":"The fisherman caught a long, slippery eel in his net.","cs":"這位漁夫在他的網中抓到了一條長而滑溜的鰻魚。","d":"A snakelike fish with a slender elongated body and poorly developed fins."},{"id":2498,"l":5,"w":"ego","k":"`igo","p":"n.","c":"自我；自我意識","es":"His massive ego makes it difficult for him to accept constructive criticism.","cs":"他強烈的自尊心（自負）讓他很難接受建設性的批評。","d":"A person's sense of self-esteem or self-importance."},{"id":2499,"l":5,"w":"elaborate","k":"ɪ`læ bə͵ret","p":"adj.v.","c":"精巧的 ；詳 述","es":"She wore an elaborate gown decorated with hundreds of pearls.","cs":"她穿著一件裝飾著數百顆珍珠的精心製作的禮服。","d":"Involving many carefully arranged parts or details; to develop or present in detail."},{"id":2500,"l":5,"w":"elevate","k":"` ɛlə͵vet","p":"vt.","c":"提升；抬高","es":"The city plans to elevate the train tracks to reduce traffic congestion.","cs":"該市計畫抬高火車軌道以減少交通擁堵。","d":"To raise or lift to a higher position."},{"id":2501,"l":5,"w":"embrace","k":"ɪm`bres","p":"vt.vi.n.","c":"擁抱","es":"They exchanged a warm embrace after being reunited.","cs":"他們在重聚後交換了一個溫暖的擁抱。","d":"To hold someone closely in one's arms, especially as a sign of affection."},{"id":2502,"l":5,"w":"endeavor","k":"ɪn`dɛvɚ","p":"vi.n.","c":"努力；盡力","es":"He will endeavor to complete the demanding task by the deadline.","cs":"他將努力在截止日期前完成這項要求很高的任務。","d":"An attempt to achieve a goal; to try hard to do or achieve something."},{"id":2503,"l":5,"w":"enroll","k":"ɪn`rol","p":"vt.vi.","c":"( 使…)註冊","es":"Many students enroll in language courses during the summer break.","cs":"許多學生在暑假期間報名參加語言課程。","d":"To officially register as a member of an institution or a student on a course."},{"id":2504,"l":5,"w":"enrollment","k":"ɪn`rolm ənt","p":"n.","c":"註冊","es":"University enrollment has seen a steady increase over the past decade.","cs":"大學註冊人數在過去十年中穩步增長。","d":"The action of enrolling or being enrolled."},{"id":2505,"l":5,"w":"ensure/insure","k":"ɪn`ʃʊr","p":"vt.","c":"確保","es":"We must ensure that all safety precautions are strictly followed.","cs":"我們必須確保所有安全預防措施都得到嚴格遵守。","d":"To make certain that something shall occur or be the case."},{"id":2506,"l":5,"w":"enterprise","k":"` ɛntɚ͵praɪz","p":"n.","c":"企業；事業心","es":"She launched a small cleaning enterprise that quickly expanded.","cs":"她創辦了一家小型清潔企業，並迅速擴大。","d":"A project or undertaking, typically one that is difficult or requires effort; a business or company."},{"id":2507,"l":5,"w":"enthusiastic","k":"ɪn͵θjuz ɪ`æ stɪk","p":"adj.","c":"熱心的","es":"The audience gave an enthusiastic round of applause to the band.","cs":"觀眾給予樂隊一陣熱情的掌聲。","d":"Having or showing intense and eager enjoyment, interest, or approval."},{"id":2508,"l":5,"w":"entitle","k":"ɪn`taɪt!","p":"vt.","c":"取名為 …；始有資格","es":"Being a full-time employee entitles you to health benefits.","cs":"作為一名全職員工，你有權獲得健康福利。","d":"To give someone a legal right or a just claim to receive or do something."},{"id":2509,"l":5,"w":"equate","k":"ɪ`kwet","p":"vt.","c":"使相等；同等看待","es":"Many people mistakenly equate money with happiness.","cs":"許多人錯誤地將金錢與幸福等同起來。","d":"To consider one thing to be the same as or equivalent to another."},{"id":2510,"l":5,"w":"erect","k":"ɪ`rɛkt","p":"vt.","c":"豎立；使直立","es":"The workers will erect a temporary fence around the construction site.","cs":"工人將在建築工地周圍豎立一道臨時圍欄。","d":"Rigidly upright or straight; to construct a building, wall, or other structure."},{"id":2511,"l":5,"w":"erupt","k":"ɪ`rʌpt","p":"vt.vi.","c":"爆發","es":"The volcano is expected to erupt within the next few months.","cs":"這座火山預計在接下來的幾個月內噴發。","d":"To break out or burst forth suddenly and dramatically (like a volcano)."},{"id":2512,"l":5,"w":"escort","k":"` ɛskɔrt","p":"n.vt.","c":"護送者；護送","es":"A police escort cleared the path for the president's motorcade.","cs":"警察護送隊為總統的車隊清出了道路。","d":"A person, vehicle, or group accompanying another for protection or as a mark of rank; to accompany in this way."},{"id":2513,"l":5,"w":"estate","k":"ɪs`tet","p":"n.","c":"財產","es":"He inherited a large country estate from his grandfather.","cs":"他從祖父那裡繼承了一座大型鄉村莊園。","d":"An extensive area of land in the country, usually with a large house; all the money and property owned by a person."},{"id":2514,"l":5,"w":"esteem","k":"ɪs`tim","p":"n.vt.","c":"尊重","es":"She is held in high esteem by her professional colleagues.","cs":"她受到她的專業同事的高度尊重。","d":"Respect and admiration, typically for a person."},{"id":2515,"l":5,"w":"eternal","k":"ɪ`tɝn!","p":"adj.","c":"不朽的；無休止的","es":"They exchanged vows of eternal love and fidelity.","cs":"他們交換了永恆的愛與忠誠的誓言。","d":"Lasting or existing forever; without end or beginning."},{"id":2516,"l":5,"w":"ethic(s)","k":"` ɛθɪk","p":"n.","c":"倫理標準","es":"The course covers the basic principles of professional ethics.","cs":"這門課程涵蓋了職業道德的基本原則。","d":"Moral principles that govern a person's behavior or the conducting of an activity."},{"id":2517,"l":5,"w":"evergreen","k":"` ɛvɚ͵grin","p":"n.adj.","c":"長青樹；常綠 的","es":"Pine trees are a common type of evergreen found in this area.","cs":"松樹是這個地區常見的一種常青樹。","d":"A plant that retains green leaves throughout the year."},{"id":2518,"l":5,"w":"exaggeration","k":"ɪg͵zæd ʒə`reʃən","p":"n.","c":"誇大；誇張","es":"His account of the events was full of obvious exaggerations.","cs":"他對事件的描述充滿了明顯的誇大。","d":"A statement that represents something as better or worse than it really is."},{"id":2519,"l":5,"w":"exceed","k":"ɪk`sid","p":"vt.vi.","c":"超過；勝過","es":"The actual cost of the project slightly exceeded the initial estimate.","cs":"該專案的實際成本略微超過了最初的估計。","d":"To be greater in number or size than; to go beyond what is allowed or stipulated."},{"id":2520,"l":5,"w":"excel","k":"ɪk`sɛl","p":"vt.vi.","c":"勝過；擅長","es":"She always excels in mathematics and science subjects.","cs":"她在數學和科學科目上總是表現出色。","d":"To be exceptionally good at or proficient in an activity or subject."},{"id":2521,"l":5,"w":"exceptional","k":"ɪk`sɛpʃən!","p":"adj.","c":"優異的","es":"The young musician showed exceptional talent from an early age.","cs":"這位年輕的音樂家從小就展現出非凡的天賦。","d":"Unusually good; outstanding."},{"id":2522,"l":5,"w":"excess","k":"ɪk`sɛs","p":"n.","c":"過度；過量","es":"Eating too much sugar is an excess that is bad for your health.","cs":"吃太多糖是一種對健康有害的過度行為。","d":"An amount of something that is more than necessary, permitted, or desirable."},{"id":2523,"l":5,"w":"exclaim","k":"ɪks`klem","p":"vt.vi.","c":"驚叫；呼喊","es":"\"What a beautiful view!\" she exclaimed with delight.","cs":"「多麼美麗的景色啊！」她高興地驚呼道。","d":"To cry out suddenly, especially in surprise, anger, or pain."},{"id":2524,"l":5,"w":"exclude","k":"ɪk`sklud","p":"vt.","c":"排除","es":"The club decided to exclude members who failed to pay their dues.","cs":"俱樂部決定排除未能繳納會費的成員。","d":"To deny someone access to or bar someone from a place, group, or privilege."},{"id":2525,"l":5,"w":"execute","k":"` ɛksɪ͵kjut","p":"vt.","c":"執行；處決","es":"The manager has a clear plan to execute the new marketing strategy.","cs":"經理有一個明確的計劃來執行新的營銷策略。","d":"To carry out or put into effect (a plan, order, or course of action); to carry out a sentence of death."},{"id":2526,"l":5,"w":"executive","k":"ɪg`zɛkjʊtɪv","p":"n.adj.","c":"執行者；行政官；執行的；行政上的","es":"She was promoted to a senior executive position last month.","cs":"她上個月被晉升為高級主管職位。","d":"Having the power to put plans, actions, or laws into effect; a senior manager."},{"id":2527,"l":5,"w":"exile","k":"` ɛksaɪl","p":"n.vt.","c":"放逐 (者) ；放逐","es":"The former president lived in political exile for ten years.","cs":"這位前總統在政治流亡中生活了十年。","d":"The state of being barred from one's native country; to expel someone."},{"id":2528,"l":5,"w":"extension","k":"ɪk`stɛnʃən","p":"n.","c":"延伸","es":"They are planning a large extension to the back of their house.","cs":"他們計畫在房子的後面進行一次大型擴建。","d":"A part that is added to something to enlarge or prolong it."},{"id":2529,"l":5,"w":"extensive","k":"ɪk`stɛnsɪv","p":"adj.","c":"廣泛的；延長的","es":"The police conducted an extensive search of the entire area.","cs":"警方對整個地區進行了廣泛的搜索。","d":"Covering or affecting a large area."},{"id":2530,"l":5,"w":"exterior","k":"ɪk`stɪrɪɚ","p":"adj.n.","c":"外部的；外部","es":"The exterior paint on the old building is peeling badly.","cs":"這座舊建築的外部油漆剝落得很嚴重。","d":"The outer surface or structure of something."},{"id":2531,"l":5,"w":"external","k":"ɪk`stɝnəl","p":"adj.","c":"外部的；客觀的","es":"The device can be powered by both internal and external batteries.","cs":"該設備可以由內部和外部電池供電。","d":"Belonging to or forming the outer surface or structure of something."},{"id":2532,"l":5,"w":"extinct","k":"ɪk`stɪŋkt","p":"adj.","c":"絕種的","es":"Dinosaurs have been extinct for millions of years.","cs":"恐龍已經滅絕了數百萬年。","d":"Having no living members (of a species, family, or other group)."},{"id":2533,"l":5,"w":"extraordinary","k":"ɪk`strɔrdn͵ɛrɪ","p":"adj.","c":"非凡的","es":"She showed an extraordinary ability to learn new languages quickly.","cs":"她展示了快速學習新語言的非凡能力。","d":"Very unusual or remarkable."},{"id":2534,"l":5,"w":"eyelash","k":"`a ɪ͵læʃ","p":"n.","c":"睫毛 (lash)","es":"She used a small brush to curl her long eyelashes.","cs":"她用一把小刷子來捲曲她長長的睫毛。","d":"Each of the short curved hairs growing on the edges of the eyelids."},{"id":2535,"l":5,"w":"eyelid","k":"`a ɪ͵lɪd","p":"n.","c":"眼皮；眼瞼","es":"His eyelids felt heavy after staying awake all night.","cs":"熬夜一晚後，他的眼皮感到很沉重。","d":"Each of the upper and lower folds of skin that cover the eye when closed."},{"id":2536,"l":5,"w":"fabric","k":"`fæ br ɪk","p":"n.","c":"布料；結構","es":"This dress is made from a lightweight, breathable linen fabric.","cs":"這件洋裝是用輕盈、透氣的亞麻布料製成的。","d":"Cloth or other material produced by weaving or knitting fibers; the basic structure of a building, organization, etc."},{"id":2537,"l":5,"w":"fad","k":"fæ d","p":"n.","c":"時尚","es":"Wearing neon colors was a popular fashion fad in the 1980s.","cs":"穿霓虹色是 20 世紀 80 年代流行的一個時尚風潮。","d":"An intense and widely shared enthusiasm for something, especially one that is short-lived; a craze."},{"id":2538,"l":5,"w":"falter","k":"`f ɔltɚ","p":"vi.","c":"蹣跚；搖晃","es":"The speaker's voice began to falter as he delivered the emotional tribute.","cs":"當他發表感人的悼詞時，演講者的聲音開始顫抖。","d":"To start to lose strength or momentum; to speak in a hesitant or unsteady voice."},{"id":2539,"l":5,"w":"fascinate","k":"`fæsn͵et","p":"vt.vi.","c":"使著迷；吸引","es":"The magician's tricks never fail to fascinate the children.","cs":"魔術師的把戲從不讓人著迷。","d":"To draw irresistibly the attention and interest of (someone)."},{"id":2540,"l":5,"w":"fatigue","k":"f ə`tig","p":"n.vt.vi.","c":"( 使…)極度疲勞","es":"The doctor diagnosed his constant tiredness as chronic fatigue.","cs":"醫生診斷他持續的疲倦是慢性疲勞。","d":"Extreme tiredness, typically resulting from mental or physical exertion or illness; to cause someone to feel exhausted."},{"id":2541,"l":5,"w":"federal","k":"`f ɛdərəl","p":"adj.","c":"聯邦的；同盟的","es":"The government is responsible for federal taxes and national defense.","cs":"聯邦政府負責聯邦稅收和國防。","d":"Having or relating to a system of government in which several states form a unity but remain independent in internal affairs."},{"id":2542,"l":5,"w":"feeble","k":"fib!","p":"adj.","c":"微弱的","es":"The old man's voice was feeble but his handshake was strong.","cs":"這位老人的聲音很微弱，但他的握手很有力。","d":"Lacking physical strength, especially as a result of age or illness; faint."},{"id":2543,"l":5,"w":"feminine","k":"`f ɛmənɪn","p":"adj.","c":"有女性氣質的","es":"She prefers clothes with soft colors and a feminine style.","cs":"她喜歡柔和色彩和女性化風格的衣服。","d":"Having qualities or an appearance traditionally associated with women or girls."},{"id":2544,"l":5,"w":"fertilizer","k":"`f ɝtl͵aɪzɚ","p":"n.","c":"肥料","es":"The farmer spread natural fertilizer on the fields to enrich the soil.","cs":"農民在田間撒播天然肥料以肥沃土壤。","d":"A chemical or natural substance added to soil or land to increase its fertility."},{"id":2545,"l":5,"w":"fiancé","k":"ˌfiɑn`se","p":"n.","c":"未婚夫","es":"She proudly introduced her fiancé to all her friends at the party.","cs":"她在派對上自豪地向所有朋友介紹她的未婚夫。","d":"A man to whom someone is engaged to be married."},{"id":2546,"l":5,"w":"fiancée","k":"ˌfiɑn`se","p":"n.","c":"未婚妻","es":"He bought a beautiful diamond ring for his fiancée.","cs":"他為他的未婚妻買了一枚美麗的鑽戒。","d":"A woman to whom someone is engaged to be married."},{"id":2547,"l":5,"w":"fiber","k":"`fa ɪbɚ","p":"n.","c":"纖維；構造","es":"Eating food high in fiber is good for your digestion.","cs":"吃高纖維的食物對消化有益。","d":"A thread or filament from which a vegetable tissue, mineral substance, or textile is formed."},{"id":2548,"l":5,"w":"fiddle","k":"`f ɪd!","p":"n.","c":"小提琴","es":"The musician played a lively tune on his wooden fiddle.","cs":"這位音樂家用他的木製小提琴演奏了一首活潑的曲子。","d":"A violin, especially when used to play folk music."},{"id":2549,"l":5,"w":"filter","k":"`f ɪltɚ","p":"n.v.","c":"過濾器；過濾","es":"The water pitcher has a built-in carbon filter to improve taste.","cs":"這個水壺內建了一個碳過濾器來改善味道。","d":"A porous device for removing impurities or solid particles from a liquid or gas passed through it; to pass through a filter."},{"id":2550,"l":5,"w":"fin","k":"f ɪn","p":"n.","c":"鰭；魚翅","es":"We watched the shark's dorsal fin cutting through the surface of the water.","cs":"我們看到鯊魚的背鰭劃過水面。","d":"A flattened appendage on various parts of the body of many aquatic vertebrates and some invertebrates, used for propelling, steering, and balancing."},{"id":2551,"l":5,"w":"fishery","k":"`f ɪʃərɪ","p":"n.","c":"魚場","es":"The local economy heavily depends on the thriving salmon fishery.","cs":"當地經濟嚴重依賴繁榮的鮭魚漁業。","d":"A place where fish are reared for commercial purposes; a fishing ground or area."},{"id":2552,"l":5,"w":"flake","k":"flek","p":"n.","c":"小薄片；玉米片","es":"She sprinkled dried chili flakes on her pizza for extra heat.","cs":"她在披薩上撒了乾辣椒片以增加辣度。","d":"A small, flat, very thin piece of something, typically one which has broken away or been peeled off from a larger piece."},{"id":2553,"l":5,"w":"flap","k":"flæ p","p":"vt.vi.n.","c":"拍打 (聲)","es":"The bird began to flap its wings rapidly to take off.","cs":"這隻鳥開始快速拍打翅膀起飛。","d":"To move (something) up and down or from side to side, often producing a noise; a piece of something attached on one side only."},{"id":2554,"l":5,"w":"flaw","k":"fl ɔ","p":"n.","c":"裂縫；瑕疵；缺點","es":"The expensive diamond was rejected due to a tiny, invisible flaw.","cs":"這顆昂貴的鑽石因一個微小、看不見的瑕疵而被拒絕。","d":"A mark, fault, or other imperfection that mars a substance or object; a weakness."},{"id":2555,"l":5,"w":"flick","k":"fl ɪk","p":"n.v.","c":"輕打聲；輕彈","es":"With a quick flick of his wrist, he sent the coin spinning into the air.","cs":"他快速輕彈手腕，將硬幣旋轉著拋向空中。","d":"A sudden sharp movement; to strike or propel (something) with a sudden quick movement of the fingers."},{"id":2556,"l":5,"w":"flip","k":"fl ɪp","p":"vt.vi.","c":"拋；使翻轉","es":"He was able to flip the pancake high into the air and catch it.","cs":"他能夠將鬆餅高高地翻轉到空中並接住。","d":"To turn over or cause to turn over with a sudden quick movement."},{"id":2557,"l":5,"w":"flourish","k":"`fl ɝɪʃ","p":"vi.","c":"興盛；茂盛","es":"The new business began to flourish in the healthy market.","cs":"這家新企業開始在健康的市場中蓬勃發展。","d":"To grow or develop in a healthy or vigorous way, especially as the result of a particularly favorable environment."},{"id":2558,"l":5,"w":"fluency","k":"`flu ənsɪ","p":"n.","c":"流利；流暢","es":"She achieved native-like fluency in French after living in Paris for a year.","cs":"在巴黎居住一年後，她的法語達到了近乎母語的流利度。","d":"The quality or condition of being fluent, in particular the ability to speak or write a foreign language easily and accurately."},{"id":2559,"l":5,"w":"foe","k":"fo","p":"n.","c":"仇敵；敵人","es":"The two armies prepared to face their long-standing foe.","cs":"兩支軍隊準備好面對他們長期的敵人。","d":"An enemy or opponent."},{"id":2560,"l":5,"w":"foil","k":"f ɔɪl","p":"n.","c":"箔；金屬薄片","es":"Wrap the leftovers tightly in aluminum foil before refrigerating them.","cs":"在冷藏剩菜前，用鋁箔將它們緊緊包好。","d":"Metal hammered or rolled into a thin flexible sheet."},{"id":2561,"l":5,"w":"folklore","k":"`fok͵lor","p":"n.","c":"民間傳說；習俗","es":"The children listened eagerly to the tales of local folklore.","cs":"孩子們熱切地聽著當地的民間傳說故事。","d":"The traditional beliefs, customs, and stories of a community, passed through the generations by word of mouth."},{"id":2562,"l":5,"w":"forgetful","k":"f ɚ`gɛtfəl","p":"adj.","c":"健忘的","es":"As she got older, she became increasingly forgetful of small details.","cs":"隨著年齡增長，她對小細節變得越來越健忘。","d":"Apt or likely not to remember."},{"id":2563,"l":5,"w":"format","k":"`f ɔrmæ t","p":"n.v.","c":"格式；格式化","es":"Please submit your essay in the correct file format as requested.","cs":"請按照要求以正確的檔案格式提交您的論文。","d":"The way in which something is arranged or set out; to arrange or put into a format."},{"id":2564,"l":5,"w":"foul","k":"fa ʊl","p":"adj.n.vi.","c":"惡臭的；邪惡的；犯規","es":"The room was filled with a foul odor from the old garbage.","cs":"房間裡充滿了舊垃圾傳來的惡臭。","d":"Offensive to the senses, especially through having a disgusting smell or taste; an unfair or invalid stroke or piece of play."},{"id":2565,"l":5,"w":"fowl","k":"fa ʊl","p":"n.","c":"家禽","es":"Chicken and duck are common types of domesticated fowl.","cs":"雞和鴨是常見的馴養家禽類型。","d":"A gallinaceous bird kept for its eggs and flesh; a domestic cock or hen."},{"id":2566,"l":5,"w":"fraction","k":"`fræ k ʃən","p":"n.","c":"分數【數學】 ；斷片","es":"Only a small fraction of the population uses public transport.","cs":"只有一小部分人口使用公共交通。","d":"A numerical quantity that is not a whole number; a small or tiny part, amount, or proportion of something."},{"id":2567,"l":5,"w":"framework","k":"`frem͵w ɝk","p":"n.","c":"架構；骨架","es":"The new policy provides a clear framework for decision-making.","cs":"新政策為決策提供了清晰的框架。","d":"An essential supporting structure of a building, vehicle, or object; a basic structure underlying a system."},{"id":2568,"l":5,"w":"frantic","k":"`fræ nt ɪk","p":"adj.","c":"狂亂的","es":"She made a frantic call for help after realizing she was locked out.","cs":"她意識到自己被鎖在外面後，慌亂地撥打了求救電話。","d":"Wild or distraught with fear, anxiety, or other emotion."},{"id":2569,"l":5,"w":"freight","k":"fret","p":"n.","c":"貨物","es":"The ship was delayed because of problems loading the heavy freight.","cs":"由於裝載重型貨物時出現問題，船隻被延誤了。","d":"Goods transported in bulk by truck, train, ship, or aircraft."},{"id":2570,"l":5,"w":"frontier","k":"fr ʌn`tɪr","p":"n.","c":"邊境","es":"Space exploration represents the last great frontier of discovery.","cs":"太空探索代表了最後的偉大發現領域。","d":"A line or border separating two countries; the extreme limit of settled land beyond which lies wilderness."},{"id":2571,"l":5,"w":"fume","k":"fjum","p":"n.","c":"( 有害，濃烈難聞的 )煙，氣","es":"The garage was filled with the toxic fumes of exhaust gas.","cs":"車庫裡充滿了廢氣的帶毒煙霧。","d":"Gas, smoke, or vapor that smells strongly or is dangerous to inhale."},{"id":2572,"l":5,"w":"fury","k":"`fj ʊrɪ","p":"n.","c":"盛怒","es":"She left the room in a blind fury after the argument.","cs":"爭吵之後，她帶著一陣狂怒離開了房間。","d":"Wild or violent anger."},{"id":2573,"l":5,"w":"fuse","k":"fjuz","p":"vt.vi.n.","c":"熔合；保險絲","es":"The lightning strike caused the main power fuse to blow.","cs":"雷擊導致主電源保險絲熔斷。","d":"To join or blend to form a single entity; a safety device consisting of a strip of wire that melts and breaks an electric circuit if the current exceeds a safe level."},{"id":2574,"l":5,"w":"fuss","k":"f ʌs","p":"n.vi.","c":"大驚小怪","es":"The children made a lot of fuss about going to bed late.","cs":"孩子們為晚睡而大驚小怪。","d":"A display of unnecessary or excessive excitement, activity, or interest."},{"id":2575,"l":5,"w":"gallop","k":"`gæ l əp","p":"n.vt.vi.","c":"疾馳","es":"The horse broke into a full gallop across the open field.","cs":"這匹馬在開闊的田野上全速疾馳起來。","d":"The fastest pace of a horse or other quadruped; to proceed at great speed."},{"id":2576,"l":5,"w":"garment","k":"`g ɑrmənt","p":"n.","c":"衣服；外表","es":"The museum displayed many historical garments from the 19th century.","cs":"博物館展示了許多 19 世紀的歷史服裝。","d":"An item of clothing."},{"id":2577,"l":5,"w":"gasp","k":"gæ sp","p":"n.vt.vi.","c":"喘氣","es":"She let out a sharp gasp of surprise when she saw the ring.","cs":"當她看到戒指時，她發出了一聲驚訝的尖銳喘息。","d":"To inhale suddenly with the mouth open, out of pain or astonishment."},{"id":2578,"l":5,"w":"gathering","k":"`gæ ð ərɪŋ","p":"n.","c":"聚集；集會","es":"A large gathering of people formed in the square.","cs":"廣場上聚集了大量的人群。","d":"An assembly or meeting, especially a social or festive one or one held for a specific purpose."},{"id":2579,"l":5,"w":"gay","k":"ge","p":"adj.n.","c":"同性戀的；男同性戀","es":"The city is known for its vibrant gay community.","cs":"這座城市以其充滿活力的同性戀社群而聞名。","d":"Homosexual (especially of a man); a homosexual person."},{"id":2580,"l":5,"w":"gender","k":"`d ʒɛndɚ","p":"n.","c":"性；性別","es":"The form requires you to state your gender.","cs":"該表格要求你填寫你的性別。","d":"The socially constructed roles, behaviors, expressions, and identities of girls, women, boys, men, and gender-diverse people."},{"id":2581,"l":5,"w":"geographic","k":"d ʒɪə`græ f ɪk","p":"adj.","c":"地理的","es":"We studied the geographic features of the region.","cs":"我們研究了該地區的地理特徵。","d":"Based on or derived from the physical features of an area."},{"id":2582,"l":5,"w":"geometry","k":"d ʒɪ`ɑmətrɪ","p":"n.","c":"幾何學","es":"I find geometry to be a challenging subject.","cs":"我覺得幾何學是一個具有挑戰性的科目。","d":"The branch of mathematics concerned with the properties and relations of points, lines, surfaces, solids, and higher dimensional analogs."},{"id":2583,"l":5,"w":"glacier","k":"`gle ʃɚ","p":"n.","c":"冰河","es":"The massive glacier slowly moved down the valley.","cs":"巨大的冰河緩慢地沿著山谷移動。","d":"A slowly moving mass or river of ice formed by the accumulation and compaction of snow on mountains or near the poles."},{"id":2584,"l":5,"w":"glare","k":"glɛr","p":"vt.vi.n.","c":"閃耀；怒視","es":"He gave me a fierce glare across the table.","cs":"他隔著桌子惡狠狠地怒視了我一眼。","d":"To stare in an angry or fierce way; a strong and dazzling light."},{"id":2585,"l":5,"w":"gleam","k":"glim","p":"n.vi.","c":"閃爍；一絲光線","es":"A faint gleam of light shone through the crack.","cs":"一絲微弱的光線透過裂縫照了進來。","d":"To shine brightly, especially with reflected light; a faint or brief light."},{"id":2586,"l":5,"w":"glee","k":"gli","p":"n.","c":"快樂；重唱曲","es":"The children shouted with glee when they saw the presents.","cs":"孩子們看到禮物時高興地歡呼起來。","d":"Great delight."},{"id":2587,"l":5,"w":"glitter","k":"`glɪtɚ","p":"n.vi.","c":"閃爍；閃光","es":"The calm surface of the lake glittered in the sunlight.","cs":"平靜的湖面在陽光下閃閃發光。","d":"To shine with a bright, shimmering, reflected light; tiny pieces of sparkling material used for decoration."},{"id":2588,"l":5,"w":"gloom","k":"glum","p":"n.","c":"黑暗；憂鬱","es":"The room was filled with gloom after the bad news.","cs":"壞消息傳來後，房間裡充滿了憂鬱。","d":"Partial or total darkness; a state of depression or despondency."},{"id":2589,"l":5,"w":"gnaw","k":"n ɔ","p":"vt.vi.","c":"咬；消耗","es":"The dog began to gnaw on the bone.","cs":"狗開始啃咬那根骨頭。","d":"To bite at or nibble something persistently."},{"id":2590,"l":5,"w":"gobble","k":"`g ɑb!","p":"n.vi.","c":"火雞咯咯叫 ；狼吞虎嚥","es":"He tends to gobble his food down quickly.","cs":"他傾向於快速地狼吞虎嚥他的食物。","d":"To eat (something) hurriedly and noisily; the characteristic sound made by a turkey."},{"id":2591,"l":5,"w":"gorge","k":"g ɔrdʒ","p":"n.vt.vi.","c":"峽谷；狼吞虎嚥","es":"The river cut a deep gorge through the mountains.","cs":"這條河流在山脈中切出了一道深邃的峽谷。","d":"A narrow valley between hills or mountains, typically with steep rocky walls and a stream running through it; to eat a large amount greedily."},{"id":2592,"l":5,"w":"gorgeous","k":"`g ɔrdʒəs","p":"adj.","c":"華麗的；極好的","es":"She looked absolutely gorgeous in her evening gown.","cs":"她穿著晚禮服看起來絕對華麗極了。","d":"Beautiful; very attractive."},{"id":2593,"l":5,"w":"gorilla","k":"g ə`rɪlə","p":"n.","c":"大猩猩；大塊頭","es":"A silverback gorilla is the dominant male of the group.","cs":"銀背大猩猩是群體中佔主導地位的雄性。","d":"A powerfully built great ape with a large head and short neck, found in the forests of central Africa."},{"id":2594,"l":5,"w":"gospel","k":"`g ɑsp!","p":"n.","c":"福音；教條","es":"He preaches the gospel of healthy living.","cs":"他宣揚健康生活的教條（福音）。","d":"The teaching or revelation of Christ; a thing that is absolutely true."},{"id":2595,"l":5,"w":"grant","k":"græ nt","p":"vt.n.","c":"承認；允許；給予 ；授予物；獎學金","es":"The university decided to grant him a full scholarship.","cs":"大學決定授予他全額獎學金。","d":"To agree to give or allow (something requested); a sum of money given by an organization for a particular purpose."},{"id":2596,"l":5,"w":"gravity","k":"`græ v ətɪ","p":"n.","c":"重力","es":"The laws of gravity affect everything on Earth.","cs":"重力定律影響著地球上的一切事物。","d":"The force that attracts a body toward the center of the earth, or toward any other physical body having mass."},{"id":2597,"l":5,"w":"graze","k":"grez","p":"vt.vi.n.","c":"放牧；擦過","es":"The sheep graze peacefully in the meadow.","cs":"綿羊在草地上和平地吃草。","d":"(Of cattle, sheep, etc.) to eat grass in a field; to scrape the skin of (a body part) so as to break the surface but cause little or no bleeding."},{"id":2598,"l":5,"w":"grease","k":"gris","p":"n.","c":"油脂","es":"You need to apply some grease to the gears.","cs":"你需要給這些齒輪上點油脂。","d":"A thick oily substance, especially as used as a lubricant."},{"id":2599,"l":5,"w":"greed","k":"grid","p":"n.","c":"貪心；貪婪","es":"His insatiable greed led to his downfall.","cs":"他永不滿足的貪婪導致了他的垮台。","d":"Intense and selfish desire for something, especially wealth, power, or food."},{"id":2600,"l":5,"w":"grim","k":"gr ɪm","p":"adj.","c":"嚴厲的；無情的","es":"The boss gave a grim warning about layoffs.","cs":"老闆發出了關於裁員的嚴厲警告。","d":"Forbidding or uninviting; relentlessly harsh or stern."},{"id":2601,"l":5,"w":"grip","k":"gr ɪp","p":"n.vt.vi.","c":"緊握；理解","es":"I couldn't get a grip on the slippery rope.","cs":"我無法緊握住那條滑溜的繩子。","d":"To take and keep a firm hold of; a firm hold or tight grasp."},{"id":2602,"l":5,"w":"groan","k":"gron","p":"n.vt.vi.","c":"呻吟","es":"He let out a painful groan after falling.","cs":"他摔倒後發出了一聲痛苦的呻吟。","d":"To make a deep inarticulate sound in response to pain or despair; a low creaking sound made by an object under pressure."},{"id":2603,"l":5,"w":"gross","k":"gros","p":"adj.","c":"總的；粗略的","es":"The company's gross income for the year was impressive.","cs":"該公司今年的總收入令人印象深刻。","d":"Unattractively large or bloated; (of income) without deduction of tax or other contributions."},{"id":2604,"l":5,"w":"growl","k":"gra ʊl","p":"vt.vi.n.","c":"嚎叫；咆哮","es":"The angry dog began to growl at the stranger.","cs":"那隻生氣的狗開始對陌生人咆哮。","d":"(Of an animal, especially a dog) to make a low guttural sound of hostility in the throat."},{"id":2605,"l":5,"w":"grumble","k":"`gr ʌmb!","p":"n.vt.vi.","c":"抱怨；怨言","es":"The customers began to grumble about the slow service.","cs":"顧客們開始抱怨服務緩慢。","d":"To complain or protest about something in a bad-tempered but typically muted way."},{"id":2606,"l":5,"w":"guideline","k":"`ga ɪd͵laɪn","p":"n.","c":"準則","es":"Follow the safety guidelines when operating the machinery.","cs":"操作機械時請遵循安全準則。","d":"A general rule, principle, or piece of advice."},{"id":2607,"l":5,"w":"gulp","k":"g ʌlp","p":"n.vt.vi.","c":"狼吞虎嚥","es":"He took a large gulp of water after the race.","cs":"賽後他大口地喝了一大口水。","d":"To swallow (drink or food) quickly or in large mouthfuls, often audibly."},{"id":2608,"l":5,"w":"gust","k":"g ʌst","p":"n.","c":"強風；爆發","es":"A sudden gust of wind blew the door shut.","cs":"一陣突如其來的強風把門吹關了。","d":"A brief, strong rush of wind."},{"id":2609,"l":5,"w":"gut","k":"g ʌt","p":"n.","c":"腸子；內臟；勇氣","es":"You need to have guts to face such a challenge.","cs":"你需要有勇氣來面對這樣的挑戰。","d":"The stomach or belly; personal courage and determination."},{"id":2610,"l":5,"w":"gypsy","k":"`d ʒɪpsɪ","p":"n.","c":"吉普賽人","es":"The film portrays the life of a traveling gypsy family.","cs":"這部電影描寫了一個四處旅行的吉普賽家庭的生活。","d":"A member of a traveling people with dark skin and hair who speak Romany and traditionally live by seasonal work, itinerant trade, and fortune-telling."},{"id":2611,"l":5,"w":"hail","k":"hel","p":"n.vt.","c":"冰雹；歡呼","es":"Farmers cheered the unexpected hail shower, despite the damage.","cs":"農民們為這場出乎意料的冰雹歡呼，儘管造成了損害。","d":"Pellets of frozen rain; to enthusiastically acclaim or celebrate something."},{"id":2612,"l":5,"w":"hairstyle / hairdo","k":"`h ɛr͵staɪl","p":"n.","c":"髮 型","es":"She decided on a new short hairstyle for the summer.","cs":"她決定夏天換個新的短髮型。","d":"A particular way in which a person's hair is cut or arranged."},{"id":2613,"l":5,"w":"handicap","k":"`hæ nd ɪ͵kæ p","p":"n.vt.","c":"障礙；妨礙","es":"A lack of funding is a major handicap to the project.","cs":"缺乏資金是該計畫的一個主要障礙。","d":"A circumstance that makes progress or success difficult; a disability."},{"id":2614,"l":5,"w":"handicraft","k":"`hæ nd ɪ͵kræ ft","p":"n.","c":"手工藝品","es":"She bought a beautiful piece of local handicraft.","cs":"她買了一件漂亮的當地手工藝品。","d":"A particular skill of making decorative objects by hand."},{"id":2615,"l":5,"w":"hardy","k":"`h ɑrdɪ","p":"adj.","c":"吃苦耐勞的；強壯的；大膽 的","es":"Only the hardy plants survived the severe winter.","cs":"只有耐寒的植物在嚴冬中存活下來。","d":"Robust; capable of enduring difficult conditions."},{"id":2616,"l" ed a hound to track the missing sheep.","cs":"農夫用一隻獵犬來追蹤失蹤的綿羊。","d":"A dog of a breed used for hunting, especially one able to track by scent."},{"id":2644,"l":5,"w":"housing","k":"`ha ʊzɪŋ","p":"n.","c":"住宅","es":"The government plans to increase affordable housing.","cs":"政府計劃增加可負擔的住宅。","d":"Houses and apartments considered collectively."},{"id":2645,"l":5,"w":"hover","k":"`h ʌvɚ","p":"n.vi.","c":"空中盤旋","es":"The helicopter continued to hover above the landing pad.","cs":"直升機繼續在停機坪上方盤旋。","d":"To remain in one place in the air."},{"id":2646,"l":5,"w":"howl","k":"ha ʊl","p":"n.v.","c":"號叫","es":"The wolf let out a long, mournful howl.","cs":"狼發出了一聲長長、悲傷的號叫。","d":"A long, loud, doleful cry uttered by an animal such as a dog or wolf."},{"id":2647,"l":5,"w":"hurl","k":"h ɝl","p":"vt.vi.n.","c":"用力投擲","es":"He had to hurl the heavy sack onto the truck.","cs":"他必須用力將沉重的麻袋投擲到卡車上。","d":"To throw with great force."},{"id":2648,"l":5,"w":"hymn","k":"`h ɪm","p":"n.","c":"聖歌讚美詩","es":"The choir sang a beautiful Christmas hymn.","cs":"唱詩班唱了一首優美的聖誕聖歌。","d":"A religious song or poem of praise to God or a god."},{"id":2649,"l":5,"w":"idiot","k":"` ɪdɪət","p":"n.","c":"白癡","es":"Don't be an idiot; that's clearly the wrong answer.","cs":"別當個白癡；那顯然是錯誤的答案。","d":"A stupid person."},{"id":2650,"l":5,"w":"immense","k":"ɪ`mɛns","p":"adj.","c":"廣大；無限的","es":"The desert stretches out over an immense area.","cs":"這片沙漠延伸了廣大的區域。","d":"Extremely large or great, especially in scale or degree."},{"id":2651,"l":5,"w":"imperial","k":"ɪm`pɪrɪəl","p":"adj.","c":"帝國的","es":"The museum displayed artifacts from the Roman imperial era.","cs":"博物館展示了羅馬帝國的時代文物。","d":"Relating to an empire or an emperor."},{"id":2652,"l":5,"w":"impose","k":"ɪm`poz","p":"vt.","c":"徵(稅)；加負擔於 …","es":"The city council decided to impose a new tax on property.","cs":"市議會決定對房產徵收一項新稅。","d":"To force (something unwelcome or unfamiliar) to be accepted or put in place."},{"id":2653,"l":5,"w":"impulse","k":"` ɪmpʌls","p":"n.","c":"衝動","es":"She bought the shoes on a sudden impulse.","cs":"她一時衝動買了這雙鞋。","d":"A sudden strong and unreflective urge or desire to act."},{"id":2654,"l":5,"w":"incense","k":"` ɪnsɛns","p":"n.","c":"香","es":"The scent of burning incense filled the temple.","cs":"燃燒的香氣味充滿了寺廟。","d":"A gum, spice, or other substance that is burned for the sweet smell it produces."},{"id":2655,"l":5,"w":"index","k":"` ɪndɛks","p":"n.vt.vi.","c":"索引；指數","es":"You can find the topic listed in the book's index.","cs":"你可以在這本書的索引中找到這個主題。","d":"An alphabetical list of records or items; an indicator, sign, or measure of something."},{"id":2656,"l":5,"w":"indifference","k":"ɪn`dɪfərəns","p":"n.","c":"冷淡；不重要","es":"His indifference to his friend's suffering was shocking.","cs":"他對朋友的痛苦表現出的冷淡令人震驚。","d":"Lack of interest, concern, or sympathy."},{"id":2657,"l":5,"w":"indifferent","k":"ɪn`dɪfərənt","p":"adj.","c":"漠不關心的","es":"She remained indifferent despite the exciting news.","cs":"儘管有令人興奮的消息，她仍然漠不關心。","d":"Having no particular interest or sympathy; unconcerned."},{"id":2658,"l":5,"w":"indignant","k":"ɪn`dɪgnənt","p":"adj.","c":"憤慨的","es":"He was indignant at the unfair treatment.","cs":"他對不公平的待遇感到憤慨。","d":"Feeling or showing anger or annoyance at what is perceived as unfair treatment."},{"id":2659,"l":5,"w":"indispensable","k":"͵ ɪndɪs`pɛnsəb!","p":"adj.","c":"必需的","es":"Water is an indispensable resource for life.","cs":"水是生命必需的資源。","d":"Absolutely necessary."},{"id":2660,"l":5,"w":"induce","k":"ɪn`djus","p":"vt.","c":"誘導；導致","es":"They tried to induce him to change his mind.","cs":"他們試圖誘導他改變主意。","d":"To succeed in persuading or influencing (someone) to do something; to bring about."},{"id":2661,"l":5,"w":"indulge","k":"ɪn`dʌldʒ","p":"vt.vi.","c":"縱容","es":"Parents should avoid indulgeing their children too much.","cs":"父母應該避免過度縱容他們的孩子。","d":"To allow oneself to enjoy the pleasure of."},{"id":2662,"l":5,"w":"infinite","k":"` ɪnfənɪt","p":"adj.","c":"無限的；極大的","es":"The universe seems to be infinite and expanding.","cs":"宇宙似乎是無限的且正在膨脹。","d":"Limitless or endless in space, extent, or size; impossible to measure or calculate."},{"id":2663,"l":5,"w":"inherit v","k":"ɪn`hɛrɪt","p":"t.","c":"繼承","es":"He will inherit the family business next year.","cs":"他將在明年繼承家族企業。","d":"To receive (money, property, or a title) as an heir at the death of the previous holder."},{"id":2664,"l":5,"w":"initiate","k":"ɪ`nɪʃɪɪt","p":"vt.","c":"開始；創始","es":"The committee will initiate a new research project.","cs":"委員會將開始一項新的研究計畫。","d":"To cause (a process or action) to begin."},{"id":2665,"l":5,"w":"inland","k":"` ɪnlənd","p":"adj.","c":"內地的","es":"They traveled to the inland regions of the country.","cs":"他們前往該國的內地地區。","d":"Situated in the interior of a country rather than on the coast."},{"id":2666,"l":5,"w":"innumerable","k":"ɪ`njum ərəb!","p":"adj.","c":"數不清的","es":"There are innumerable stars in the night sky.","cs":"夜空中數不清的星星。","d":"Too many to be counted."},{"id":2667,"l":5,"w":"inquire","k":"ɪn`kwa ɪr","p":"vt.vi.","c":"詢問；調查","es":"She wanted to inquire about the job vacancy.","cs":"她想詢問有關職位空缺的事。","d":"To ask for information from someone."},{"id":2668,"l":5,"w":"institute","k":"` ɪnstətjut","p":"vt.n.","c":"設立 ；機構","es":"The government plans to institute a new policy.","cs":"政府計劃設立一項新政策。","d":"To set in motion or establish; an organization having a particular object or common factor."},{"id":2669,"l":5,"w":"insure","k":"ɪn`ʃʊr","p":"vt.","c":"投保；保證","es":"You should insure your valuables against theft.","cs":"你應該為你的貴重物品投保以防盜竊。","d":"To arrange for compensation in the event of damage to or loss of property, or injury/death."},{"id":2670,"l":5,"w":"intent","k":"ɪn`tɛnt","p":"n.adj.","c":"意圖；熱切的","es":"His intent was to help, not to harm.","cs":"他的意圖是幫助，而不是傷害。","d":"Intention or purpose; resolving or determined to do something."},{"id":2671,"l":5,"w":"interference","k":"ˌɪntɚ`fɪrəns","p":"n.","c":"妨礙；干涉","es":"The company strongly opposes any government interference in its daily operations.","cs":"這家公司強烈反對政府對其日常營運的任何干涉。","d":"The action of interfering or the process of being interfered with."},{"id":2672,"l":5,"w":"interior","k":"ɪn`tɪrɪɚ","p":"adj.","c":"內部的","es":"The police investigated the interior of the abandoned building.","cs":"警方調查了這棟廢棄建築的內部。","d":"Situated within or inside; relating to the inside; the inner part of something."},{"id":2673,"l":5,"w":"interpretation","k":"ɪn͵tɝprɪ`teʃən","p":"n.","c":"闡明；翻譯","es":"We need a clear interpretation of the rules.","cs":"我們需要對規則進行清晰的闡明（翻譯）。","d":"The action of explaining the meaning of something."},{"id":2674,"l":5,"w":"interpreter","k":"ɪn`tɝprɪtɚ","p":"n.","c":"口譯員","es":"She works as an interpreter for international conferences.","cs":"她在國際會議上擔任口譯員。","d":"A person who interprets, especially one who translates speech orally."},{"id":2675,"l":5,"w":"intuition","k":"͵ ɪntju` ɪʃən","p":"n.","c":"直覺","es":"He acted on his intuition and turned left.","cs":"他憑著直覺行事，向左轉。","d":"The ability to understand something immediately, without the need for conscious reasoning."},{"id":2676,"l":5,"w":"inward","k":"` ɪnwɚd","p":"adj.","c":"內部的；精神上的","es":"She kept her inward thoughts to herself.","cs":"她把內部的想法藏在心裡。","d":"Directed or proceeding toward the inside; relating to the mind or spirit."},{"id":2677,"l":5,"w":"inward(s)","k":"` ɪnwɚd","p":"n.","c":"內部；裡面","es":"The letter was addressed to the company's inwards department.","cs":"這封信是寄給公司內部部門的。","d":"Toward the inside."},{"id":2678,"l":5,"w":"isle","k":"a ɪl","p":"n.","c":"小島","es":"The small isle was a popular tourist destination.","cs":"這個小島是一個受歡迎的旅遊目的地。","d":"An island or peninsula, especially a small one."},{"id":2679,"l":5,"w":"issue","k":"` ɪʃjʊ","p":"n.v.","c":"議題；發行 ；發行","es":"The newspaper will issue a statement tomorrow.","cs":"報紙將在明天發行一份聲明。","d":"An important topic or problem for debate or discussion; to supply or distribute."},{"id":2680,"l":5,"w":"ivy","k":"`a ɪvɪ","p":"n.","c":"常春藤","es":"The old stone wall was covered in thick ivy.","cs":"古老的石牆被濃密的常春藤覆蓋著。","d":"A woody evergreen Eurasian climbing plant, typically with dark green, five-pointed leaves."},{"id":2681,"l":5,"w":"jack","k":"d ʒæ k","p":"n.","c":"男人；侍者；水手","es":"The ship's jack was a friendly, seasoned sailor.","cs":"這艘船的水手是一位友善、經驗豐富的水手。","d":"A man or boy; a sailor or a worker."},{"id":2682,"l":5,"w":"jade","k":"d ʒed","p":"n.","c":"玉","es":"She wore a beautiful necklace made of jade.","cs":"她戴著一條漂亮的玉項鍊。","d":"A hard, typically green stone used for ornaments and implements."},{"id":2683,"l":5,"w":"janitor","k":"`d ʒænɪtɚ","p":"n.","c":"管理員；看門人","es":"The janitor is responsible for cleaning the school hallways.","cs":"管理員負責清潔學校走廊。","d":"A person employed as a caretaker of a building; a custodian."},{"id":2684,"l":5,"w":"jasmine","k":"`d ʒæ smɪn","p":"n.","c":"茉莉","es":"The sweet scent of jasmine filled the garden.","cs":"甜美的茉莉花香充滿了花園。","d":"A shrub or climbing plant that bears fragrant flowers."},{"id":2685,"l":5,"w":"jaywalk","k":"`d ʒe͵wɔk","p":"vi.","c":"擅自穿越馬路","es":"It is dangerous to jaywalk in heavy traffic.","cs":"在交通繁忙時擅自穿越馬路是很危險的。","d":"To cross or walk in the street or road unlawfully or without regard for approaching traffic."},{"id":2686,"l":5,"w":"jeer","k":"d ʒɪr","p":"vt.vi.n.","c":"嘲弄","es":"The crowd began to jeer at the losing team.","cs":"人群開始嘲弄輸掉的隊伍。","d":"To make rude and mocking remarks, typically in a loud voice."},{"id":2687,"l":5,"w":"jingle","k":"`d ʒɪŋg!","p":"n.vi.","c":"叮噹聲；發出叮噹聲","es":"I could hear the jingle of keys in his pocket.","cs":"我能聽到他口袋裡鑰匙叮噹作響的聲音。","d":"A light ringing sound such as that made by metal objects being shaken together."},{"id":2688,"l":5,"w":"jolly","k":"`d ʒɑlɪ","p":"adj.","c":"快活的","es":"He was in a very jolly mood after the party.","cs":"派對後他心情非常快活。","d":"Happy and cheerful."},{"id":2689,"l":5,"w":"journal ist","k":"`d ʒɝnəlɪst","p":"n.","c":"新聞 \\撰稿記者","es":"The journalist spent weeks investigating the story.","cs":"這位新聞記者花了數週時間調查這則故事。","d":"A person who writes for newspapers, magazines, or news websites or prepares news to be broadcast."},{"id":2690,"l":5,"w":"journalism","k":"`d ʒɝn!͵ɪzm","p":"n.","c":"新聞工作","es":"She decided to study journalism in college.","cs":"她決定在大學裡學習新聞工作。","d":"The activity or profession of writing for newspapers, magazines, or news websites or preparing news to be broadcast."},{"id":2691,"l":5,"w":"jug","k":"d ʒʌg","p":"n.","c":"水罐","es":"Please fill the jug with fresh water.","cs":"請將水罐裝滿新鮮的水。","d":"A large container for liquids, with a narrow mouth and typically a handle."},{"id":2692,"l":5,"w":"jury","k":"`d ʒʊrɪ","p":"n.","c":"陪審團","es":"The jury reached a unanimous verdict.","cs":"陪審團達成了一致的裁決。","d":"A body of people sworn to give a verdict in a legal case on the basis of evidence submitted to them in court."},{"id":2693,"l":5,"w":"justify","k":"`d ʒʌstə͵faɪ","p":"vt.vi.","c":"認為正當；為 ...辯 護","es":"She tried to justify her decision to quit.","cs":"她試圖為她辭職的決定辯護。","d":"To show or prove to be right or reasonable."},{"id":2694,"l":5,"w":"juvenile","k":"`d ʒuvən!","p":"n.adj.","c":"少年；少年的","es":"The law is designed to protect juvenile offenders.","cs":"這項法律旨在保護少年罪犯。","d":"Of, for, or relating to young people; a young person."},{"id":2695,"l":5,"w":"kin","k":"k ɪn","p":"n.","c":"親屬","es":"All her close kin attended the family reunion.","cs":"她所有親近的親屬都參加了家庭聚會。","d":"One's family and relations."},{"id":2696,"l":5,"w":"kindle","k":"`k ɪnd!","p":"vt.vi.","c":"點燃；激起；照亮","es":"He used a match to kindle the dry wood.","cs":"他用火柴點燃了乾柴。","d":"To light or set on fire; to arouse or inspire (an emotion or feeling)."},{"id":2697,"l":5,"w":"knowledgeable","k":"`n ɑlɪdʒəb!","p":"adj.","c":"博學的","es":"She is very knowledgeable about ancient history.","cs":"她對古代歷史非常博學。","d":"Intelligent and well-informed."},{"id":2698,"l":5,"w":"lad","k":"læ d","p":"n.","c":"少年；小夥子；老友","es":"The young lad helped the old woman carry her groceries.","cs":"這位年輕的少年幫助那位老婦人提雜貨。","d":"A boy or young man."},{"id":2699,"l":5,"w":"lame","k":"lem","p":"adj.v.","c":"跛腳 ；使…跛腳","es":"He used a cane because he was slightly lame.","cs":"他用手杖，因為他有點跛腳。","d":"(Of a person or animal) unable to walk normally because of an injury or illness affecting the leg or foot."},{"id":2700,"l":5,"w":"landlady","k":"`lænd͵led ɪ","p":"n.","c":"女房東","es":"The landlady collected the rent on the first of the month.","cs":"女房東在每月一號收房租。","d":"A woman who rents out land, a building, or accommodation."},{"id":2701,"l":5,"w":"landlord","k":"`lænd͵l ɔrd","p":"n.","c":"地主","es":"The landlord is responsible for maintaining the property.","cs":"地主（房東）負責維護房產。","d":"A man (in legal use also a woman) who rents out land, a building, or accommodation."},{"id":2702,"l":5,"w":"laser","k":"`lezɚ","p":"n.","c":"雷射","es":"The scientist used a powerful laser in the experiment.","cs":"科學家在實驗中使用了強大的雷射。","d":"A device that generates an intense beam of coherent monochromatic light."},{"id":2703,"l":5,"w":"latitude","k":"`læ t ə͵tjud","p":"n.","c":"緯度","es":"The ship's position was calculated using latitude and longitude.","cs":"船的位置是使用緯度和經度計算出來的。","d":"The angular distance of a place north or south of the earth's equator."},{"id":2704,"l":5,"w":"lawmaker","k":"`lɔ`mek ɚ","p":"n.","c":"立法之人","es":"The lawmaker proposed a new bill on environmental protection.","cs":"這位立法之人提出了一項關於環境保護的新法案。","d":"A person who makes laws; a legislator."},{"id":2705,"l":5,"w":"layer","k":"`leɚ","p":"n.","c":"(一)層","es":"The cake had three delicious layers of frosting.","cs":"這個蛋糕有三層美味的糖霜。","d":"A sheet, quantity, or thickness of material, typically one of several, covering a surface or body."},{"id":2706,"l":5,"w":"league","k":"lig","p":"n.","c":"聯盟","es":"The team joined a new professional league.","cs":"這支隊伍加入了一個新的職業聯盟。","d":"A collection of people, countries, or groups that combine for a particular purpose, typically mutual protection or cooperation."},{"id":2707,"l":5,"w":"legislation","k":"͵lɛdʒɪs`leʃən","p":"n.","c":"制定法律","es":"The committee is responsible for new legislation.","cs":"該委員會負責制定新的法律。","d":"Laws, considered collectively; the process of making or enacting laws."},{"id":2708,"l":5,"w":"lessen","k":"`lɛsn","p":"vi. vt.","c":"減少","es":"The heavy rain will gradually lessen over the next few hours.","cs":"在接下來的幾個小時裡，大雨將會逐漸減少。","d":"To make or become less; diminish."},{"id":2709,"l":5,"w":"lest","k":"lɛst","p":"conj.","c":"以免","es":"Take an umbrella lest it should rain later.","cs":"帶把傘，以免待會兒下雨。","d":"With the intention of preventing (something undesirable); to avoid the risk of."},{"id":2710,"l":5,"w":"lieutenant","k":"lu`tɛnənt","p":"n.","c":"中尉","es":"She was promoted to lieutenant after serving for two years.","cs":"她在服役兩年後被提升為中尉。","d":"A deputy or substitute acting for a superior; a rank of officer in the army or navy."},{"id":2711,"l":5,"w":"lifelong","k":"`laɪf͵lɔŋ","p":"adj.","c":"一輩子的","es":"He made a lifelong commitment to charity work.","cs":"他對慈善工作做出了一輩子的承諾。","d":"Lasting or remaining in a particular state throughout a person's life."},{"id":2712,"l":5,"w":"likelihood","k":"`laɪklɪ͵hʊd","p":"n.","c":"相似之處","es":"There is little likelihood of rain today.","cs":"今天下雨的可能性很小。","d":"The state or fact of something's being likely; probability."},{"id":2713,"l":5,"w":"lime","k":"laɪm","p":"n.","c":"石灰","es":"The gardener spread lime on the lawn to improve the soil.","cs":"園丁在草坪上撒了石灰來改善土壤。","d":"A white alkaline substance consisting of calcium oxide; a rounded citrus fruit."},{"id":2714,"l":5,"w":"limp","k":"lɪmp","p":"vi.n.","c":"跛行","es":"The injured dog could only limp slowly down the street.","cs":"受傷的狗只能沿著街道慢慢地跛行。","d":"To walk with difficulty, typically because of a damaged or stiff leg or foot."},{"id":2715,"l":5,"w":"linger","k":"`lɪŋgɚ","p":"vi.","c":"徘徊","es":"She liked to linger in the bookstore after closing time.","cs":"她喜歡在打烊後在書店裡徘徊。","d":"To stay in a place longer than necessary because of a reluctance to leave."},{"id":2716,"l":5,"w":"livestock","k":"`laɪv͵stɑk","p":"n.","c":"家畜","es":"The farmer keeps a variety of livestock
