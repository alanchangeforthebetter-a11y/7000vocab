.","c":"活潑的，輕快的","es":"The town has a very lively nightlife.","cs":"這個城鎮有非常熱鬧的夜生活。","d":"Full of life and energy; active and cheerful."},{"id":546,"l":3,"w":"liver","k":"ˋlɪvɚ","p":"n.","c":"肝臟","es":"A healthy liver is essential for good digestion.","cs":"健康的肝臟對良好的消化至關重要。","d":"A large glandular organ in the abdomen that processes blood and secretes bile."},{"id":547,"l":3,"w":"load","k":"lod","p":"n.vt.","c":"裝載；裝載量；負擔","es":"He carried a heavy load of books in his backpack.","cs":"他的背包裡裝著沉甸甸的一堆書。","d":"A heavy or bulky thing that is being carried or lifted; to place a load on or into."},{"id":548,"l":3,"w":"lobby","k":"ˋlɑbɪ","p":"n. vt.","c":"大廳；會客室；對(議員等 )進行遊說","es":"We waited for him in the hotel lobby.","cs":"我們在飯店大廳等他。","d":"A room providing a space for waiting or meeting just inside the entrance to a large building; to seek to influence."},{"id":549,"l":3,"w":"lobster","k":"ˋlɑbstɚ","p":"n.","c":"龍蝦","es":"We ordered fresh grilled lobster for dinner.","cs":"我們點了新鮮烤龍蝦當晚餐。","d":"A large marine crustacean with stalked eyes and large claws, cooked for food."},{"id":550,"l":3,"w":"lollipop","k":"ˋlɑlɪ͵pɑp","p":"n.","c":"棒棒糖","es":"The child was happily licking a colorful lollipop.","cs":"孩子高興地舔著一支五顏六色的棒棒糖。","d":"A large, flat, hard sweet on a stick."},{"id":551,"l":3,"w":"loose","k":"lus","p":"adj.","c":"鬆的，寬的；鬆散的","es":"The dog got loose and ran out the door.","cs":"狗掙脫了繩子跑出門。","d":"Not firmly or tightly fixed in place; relaxed."},{"id":552,"l":3,"w":"loosen","k":"ˋlusn","p":"vt.vi.","c":"鬆開，解開","es":"Please loosen your grip on the steering wheel.","cs":"請放鬆你對方向盤的握力。","d":"To make or become less tight or secure."},{"id":553,"l":3,"w":"lord","k":"lɔrd","p":"n.","c":"統治者；君主；上帝；閣下","es":"In the past, the local lord owned all the land.","cs":"過去，當地領主擁有所有的土地。","d":"A master or ruler; a British nobleman."},{"id":554,"l":3,"w":"loudspeaker","k":"ˋlaʊdˋspik ɚ","p":"n.","c":"擴聲器，喇叭","es":"The announcement was made over the loudspeaker.","cs":"擴音器發出了廣播。","d":"An apparatus that converts electrical impulses into sound; a speaker."},{"id":555,"l":3,"w":"luggage","k":"ˋlʌgɪdʒ","p":"n.","c":"【主英】行李","es":"Please collect your luggage from the carousel.","cs":"請從行李輸送帶領取您的行李。","d":"Suitcases or bags used when traveling; baggage."},{"id":556,"l":3,"w":"lullaby","k":"ˋlʌlə͵baɪ","p":"n.","c":"催眠曲，搖籃曲","es":"The mother sang a soft lullaby to her baby.","cs":"母親給她的嬰兒唱了一首柔和的搖籃曲。","d":"A quiet, gentle song sung to put a child to sleep."},{"id":557,"l":3,"w":"lung","k":"lʌŋ","p":"n.","c":"肺，肺臟","es":"Smoking causes damage to the lungs.","cs":"吸菸會對肺部造成損害。","d":"Either of the two breathing organs in the chest of vertebrates."},{"id":558,"l":3,"w":"magical","k":"ˋmæd ʒɪk!","p":"adj.","c":"魔術的，魔法的","es":"The show featured many magical tricks and illusions.","cs":"演出中有很多神奇的戲法和幻覺。","d":"Possessing or using powers of magic; enchanting."},{"id":559,"l":3,"w":"magnet","k":"ˋmægn ɪt","p":"n.","c":"磁鐵，磁石","es":"A magnet will attract any metal containing iron.","cs":"磁鐵會吸引任何含鐵的金屬。","d":"A piece of iron or steel that has the property of attracting iron or steel objects."},{"id":560,"l":3,"w":"maid","k":"med","p":"n.","c":"少女， (未婚的 )年輕女子； 女僕","es":"The hotel maid came in to clean the room.","cs":"飯店的女僕進來打掃房間。","d":"A female domestic servant."},{"id":561,"l":3,"w":"major","k":"ˋmed ʒɚ","p":"adj.n.","c":"較大的；主要的； 成年人；陸軍少校；主修","es":"There has been a major change in company policy.","cs":"公司的政策發生了重大變化。","d":"Important, serious, or significant; a rank in the military."},{"id":562,"l":3,"w":"majority","k":"məˋdʒɔrətɪ","p":"n.","c":"大多數，過半數","es":"The majority of students voted for the class trip.","cs":"大多數學生投票贊成班級旅行。","d":"The greater number; more than half."},{"id":563,"l":3,"w":"mall","k":"mɔl","p":"n.","c":"購物中心","es":"We went to the shopping mall to buy some new clothes.","cs":"我們去了購物中心買新衣服。","d":"A large covered shopping area; a shaded public walk."},{"id":564,"l":3,"w":"manage","k":"ˋmæn ɪdʒ","p":"vt.","c":"管理；經營；設法做到","es":"Can you manage to finish this report by Friday?","cs":"你能設法在週五之前完成這份報告嗎？","d":"To be in charge of or control (a business or organization); to succeed in doing."},{"id":565,"l":3,"w":"manageable","k":"ˋmæn ɪdʒəb!","p":"adj.","c":"易辦的；可管理的","es":"The task was large, but broken down into manageable steps.","cs":"任務很大，但被分解成可管理的步驟。","d":"Able to be controlled or dealt with without difficulty."},{"id":566,"l":3,"w":"management","k":"ˋmæn ɪdʒmənt","p":"n.","c":"管理；經營","es":"The new management is making a lot of changes.","cs":"新的管理階層正在進行許多變革。","d":"The process of dealing with or controlling things or people."},{"id":567,"l":3,"w":"manager","k":"ˋmæn ɪdʒɚ","p":"n.","c":"負責人；主任，經理","es":"I spoke to the store manager about the problem.","cs":"我和商店經理談了這個問題。","d":"A person responsible for controlling or administering all or part of a company or organization."},{"id":568,"l":3,"w":"mankind","k":"ˋmæn͵ka ɪnd","p":"n.","c":"男人；人類","es":"Protecting the environment is a concern for all of mankind.","cs":"保護環境是所有人類的共同關注點。","d":"Human beings collectively."},{"id":569,"l":3,"w":"manners","k":"ˋmæn ɚz","p":"n.","c":"禮貌；規矩","es":"Good manners are important when meeting new people.","cs":"結識新朋友時，良好的禮儀很重要。","d":"A person's way of behaving toward others; social customs."},{"id":570,"l":3,"w":"marble","k":"ˋmɑrb!","p":"n.","c":"大理石 ；彈珠","es":"The statue was carved from white marble.","cs":"這座雕像由白色大理石雕刻而成。","d":"A hard, crystalline metamorphic rock, often polished and used in sculpture and architecture."},{"id":571,"l":3,"w":"march","k":"mɑrtʃ","p":"n.vi.","c":"行軍；遊行抗議； 進行曲；行軍","es":"The protesters held a silent march through the city.","cs":"抗議者在城市中舉行了無聲的遊行。","d":"To walk in a military manner with a regular, measured tread."},{"id":572,"l":3,"w":"marvelous","k":"ˋmɑrvələs","p":"adj.","c":"令人驚歎的；非凡的","es":"The view from the top of the tower was truly marvelous.","cs":"從塔頂看到的景色實在是太了不起了。","d":"Extremely good or wonderful."},{"id":573,"l":3,"w":"mathematical","k":"͵mæθ əˋmæt ɪk!","p":"adj.","c":"數學的","es":"She solved the complex mathematical equation quickly.","cs":"她很快地解開了複雜的數學方程式。","d":"Relating to or using mathematics."},{"id":574,"l":3,"w":"mathematics","k":"͵mæθ əˋmæt ɪks","p":"n.","c":"數學","es":"He chose to study pure mathematics at university.","cs":"他選擇在大學學習純數學。","d":"The science of number, quantity, and space."},{"id":575,"l":3,"w":"mature","k":"məˋtjʊr","p":"adj. vi.vt.","c":"成熟的；變成熟","es":"She is very mature for her age.","cs":"相對於她的年齡來說，她非常成熟。","d":"Having reached a full state of physical or mental development."},{"id":576,"l":3,"w":"mayor","k":"ˋmeɚ","p":"n.","c":"市長，鎮長","es":"The city mayor gave a speech at the opening ceremony.","cs":"市長在開幕典禮上發表了演講。","d":"The elected head of a city or town government."},{"id":577,"l":3,"w":"meadow","k":"ˋmɛdo","p":"n.","c":"草地，牧草地","es":"The cows were grazing peacefully in the green meadow.","cs":"奶牛在綠色的草地上平靜地吃草。","d":"A piece of grassland, especially one used for hay."},{"id":578,"l":3,"w":"meaningful","k":"ˋmin ɪŋfəl","p":"adj.","c":"有意義的；意味深長的","es":"She wants her work to be meaningful and make a difference.","cs":"她希望她的工作是有意義的，並能產生影響。","d":"Having a serious, important, or worthwhile quality or purpose."},{"id":579,"l":3,"w":"meanwhile","k":"ˋmin͵hwa ɪl","p":"n.adv.","c":"其時；在此同時","es":"I waited for the bus; meanwhile, I read a book.","cs":"我等公車；同時，我讀了一本書。","d":"At the same time; in the intervening period."},{"id":580,"l":3,"w":"medal","k":"ˋmɛd!","p":"n.","c":"獎章，紀念章，勛章","es":"He was awarded a gold medal for winning the race.","cs":"他因贏得比賽而獲得金牌。","d":"A metal disc or piece of metal, typically awarded for an achievement."},{"id":581,"l":3,"w":"medical","k":"ˋmɛdɪk!","p":"adj.","c":"醫學的；醫療的","es":"She is considering a career in the medical field.","cs":"她正在考慮從事醫學領域的工作。","d":"Relating to the science or practice of medicine."},{"id":582,"l":3,"w":"medium","k":"ˋmid ɪəm","p":"n.","c":"中間，中庸；媒體 (複數 media n.新聞媒體 )","es":"I ordered a medium pizza for myself.","cs":"我為自己點了一個中等大小的披薩。","d":"A middle state or degree; a means by which something is communicated."},{"id":583,"l":3,"w":"melt","k":"mɛlt","p":"vt.vi.","c":"融化；熔化","es":"The snow began to melt as the sun came out.","cs":"太陽出來後，雪開始融化。","d":"To become liquid by heating."},{"id":584,"l":3,"w":"membership","k":"ˋmɛmbɚ͵ʃɪp","p":"n.","c":"會員身分 (或地 位、資格 )","es":"You need to pay an annual fee for club membership.","cs":"你需要支付俱樂部會員的年費。","d":"The state of being a member of a group or organization."},{"id":585,"l":3,"w":"memorize","k":"ˋmɛmə͵raɪz","p":"vt.","c":"記住；背熟","es":"She had to memorize a long poem for the class.","cs":"她必須記住一首長詩以應付課程。","d":"To commit to memory; learn by heart."},{"id":586,"l":3,"w":"mend","k":"mɛnd","p":"vt.","c":"修理，修補","es":"Can you mend this hole in my sock?","cs":"你能修補我襪子上的這個洞嗎？","d":"To repair (something broken or damaged)."},{"id":587,"l":3,"w":"mental","k":"ˋmɛnt!","p":"adj.","c":"精神的，心理的","es":"Good physical health often leads to better mental health.","cs":"良好的身體健康通常會帶來更好的心理健康。","d":"Relating to the mind."},{"id":588,"l":3,"w":"mention","k":"ˋmɛnʃən","p":"vt.","c":"提到，說起","es":"Did he mention where he was going?","cs":"他有提到他要去哪裡嗎？","d":"To refer to something briefly and without going into detail."},{"id":589,"l":3,"w":"merchant","k":"ˋmɝtʃənt","p":"n.","c":"商人","es":"The city was a center for trade with many foreign merchants.","cs":"這座城市是一個貿易中心，有許多外國商人。","d":"A person or company involved in wholesale trade, especially one dealing with foreign countries."},{"id":590,"l":3,"w":"merry","k":"ˋmɛrɪ","p":"adj.","c":"歡樂的，愉快的","es":"Everyone wished each other a Merry Christmas.","cs":"大家互相祝賀聖誕快樂。","d":"Cheerful and lively."},{"id":591,"l":3,"w":"mess","k":"mɛs","p":"n.vt.","c":"混亂 ；弄亂","es":"The children made a terrible mess in the kitchen.","cs":"孩子們在廚房裡弄得一團糟。","d":"A state of disorder or untidiness; a dirty or confused state."},{"id":592,"l":3,"w":"microphone","k":"ˋmaɪkrə͵fon","p":"n.","c":"麥克風 (mike)","es":"The speaker adjusted the height of the microphone.","cs":"演講者調整了麥克風的高度。","d":"An instrument for converting sound waves into electrical energy, used for recording or amplifying."},{"id":593,"l":3,"w":"microwave","k":"ˋmaɪkro͵wev","p":"n.vt.","c":"微波爐 ；用微波爐熱 (食物 )","es":"Just heat the leftovers in the microwave oven.","cs":"只要用微波爐加熱剩菜就行了。","d":"An electric oven that heats food using electromagnetic waves."},{"id":594,"l":3,"w":"might","k":"maɪt","p":"aux.","c":"(may的過去式 )可能；可以","es":"I might go to the party, but I'm not sure yet.","cs":"我可能會去派對，但我還不確定。","d":"Great strength or power; used to express possibility or permission."},{"id":595,"l":3,"w":"mighty","k":"ˋmaɪtɪ","p":"adj.","c":"強大的；強有力的","es":"The small stream turned into a mighty river after the storm.","cs":"暴風雨後，小溪變成了一條強大的河流。","d":"Possessing or exhibiting great power or strength."},{"id":596,"l":3,"w":"mill","k":"mɪl","p":"n.","c":"磨坊；麵粉廠","es":"The old water mill is now a museum.","cs":"這座舊水磨坊現在是一座博物館。","d":"A building equipped with machinery for grinding grain into flour; a factory."},{"id":597,"l":3,"w":"millionaire","k":"͵mɪljənˋɛr","p":"n.","c":"百萬富翁","es":"She became a millionaire after selling her tech startup.","cs":"賣掉她的科技新創公司後，她成了百萬富翁。","d":"A person whose assets are worth one million or more units of currency."},{"id":598,"l":3,"w":"miner","k":"ˋmaɪnɚ","p":"n.","c":"礦工","es":"The coal miners worked deep underground.","cs":"煤礦工在地下深處工作。","d":"A person who works in a mine."},{"id":599,"l":3,"w":"minor","k":"ˋmaɪnɚ","p":"adj.n.","c":"較少的； 次要的 ；未成年的；副修的； 未成年人","es":"The car accident caused only minor damage.","cs":"這場車禍只造成了輕微的損害。","d":"Lesser in importance, seriousness, or size; a person under the age of full legal responsibility."},{"id":600,"l":3,"w":"minority","k":"maɪˋnɔrətɪ","p":"n.","c":"少數；少數民族；未成年身分","es":"Women are still a minority in senior management.","cs":"女性在高級管理職位中仍然是少數。","d":"The smaller number or part; a group differing from the majority."},{"id":601,"l":3,"w":"miracle","k":"ˋmɪrək!","p":"n.","c":"奇蹟；奇蹟般的人 (或物 )","es":"It was a miracle that no one was seriously hurt.","cs":"沒有人受重傷真是個奇蹟。","d":"An extraordinary and welcome event that is not explicable by natural or scientific laws and is therefore attributed to a divine agency."},{"id":602,"l":3,"w":"misery","k":"ˋmɪzərɪ","p":"n.","c":"不幸；悲","es":"The flood caused widespread misery and suffering.","cs":"洪水造成了普遍的痛苦和磨難。","d":"A state or feeling of great distress or unhappiness."},{"id":603,"l":3,"w":"missile","k":"ˋmɪs!","p":"n.","c":"飛彈，導彈","es":"The defense system can shoot down incoming missiles.","cs":"防禦系統可以擊落來襲的導彈。","d":"An object or weapon that is forcibly propelled at a target."},{"id":604,"l":3,"w":"missing","k":"ˋmɪsɪŋ","p":"adj.","c":"失蹤的，行蹤不明的","es":"Have you seen my keys? They're missing.","cs":"你有看到我的鑰匙嗎？它們不見了。","d":"Not found or not present."},{"id":605,"l":3,"w":"mission","k":"ˋmɪʃən","p":"n.","c":"使命，任務","es":"Their mission is to save the endangered sea turtles.","cs":"他們的任務是拯救瀕臨滅絕的海龜。","d":"An important assignment or task, often involving travel."},{"id":606,"l":3,"w":"mist","k":"mɪst","p":"n.","c":"薄霧","es":"A thick mist covered the hills in the morning.","cs":"早上，濃濃的霧氣籠罩著群山。","d":"A cloud of tiny water droplets suspended in the atmosphere; fog."},{"id":607,"l":3,"w":"mixture","k":"ˋmɪkstʃɚ","p":"n.","c":"混合，混合物","es":"Add the flour to the mixture slowly.","cs":"將麵粉慢慢加入混合物中。","d":"A substance made by mixing other substances together."},{"id":608,"l":3,"w":"mob","k":"mɑb","p":"n.","c":"暴民","es":"An angry mob gathered outside the government building.","cs":"一群憤怒的暴民聚集在政府大樓外。","d":"A large, disorderly crowd of people."},{"id":609,"l":3,"w":"mobile","k":"ˋmob ɪl","p":"adj.","c":"可動的，移動式的","es":"She works as a mobile hairdresser, visiting clients at home.","cs":"她是一名流動美髮師，上門服務客戶。","d":"Able to move or be moved freely or easily."},{"id":610,"l":3,"w":"moist","k":"mɔɪst","p":"adj.","c":"潮濕的；含淚的","es":"The cake was deliciously soft and moist.","cs":"蛋糕軟糯且濕潤，非常美味。","d":"Slightly wet; damp."},{"id":611,"l":3,"w":"moisture","k":"ˈmɔɪstʃər","p":"n.","c":"濕氣；水分","es":"The desert air is lacking in moisture.","cs":"沙漠的空氣缺乏水分。","d":"Water or other liquid diffused in a small quantity as vapor, especially in the atmosphere, or condensed on a surface."},{"id":612,"l":3,"w":"monk","k":"mʌŋk","p":"n.","c":"和尚；僧侶；修道士","es":"The Buddhist monk dedicated his life to meditation.","cs":"這位佛教徒將一生奉獻給冥想。","d":"A member of a religious community of men typically living under vows of poverty, chastity, and obedience."},{"id":613,"l":3,"w":"mood","k":"mud","p":"n.","c":"心情，心境","es":"She was in a good mood after her vacation.","cs":"度假後她的心情很好。","d":"A temporary state of mind or feeling."},{"id":614,"l":3,"w":"mop","k":"mɑp","p":"n. vt.vi.","c":"拖把；用拖把拖洗","es":"Please use the mop to clean up the spilled juice.","cs":"請用拖把清理灑出的果汁。","d":"A tool consisting of a mass of coarse strings or a sponge on a stick, used for soaking up liquid or cleaning floors."},{"id":615,"l":3,"w":"moral","k":"ˋmɔrəl","p":"adj.","c":"道德 (上)的","es":"The story teaches a clear moral lesson about honesty.","cs":"這個故事教導了一個關於誠實的明確道德教訓。","d":"Concerned with the principles of right and wrong behavior; a lesson taught by a story."},{"id":616,"l":3,"w":"motel","k":"moˋt ɛl","p":"n.","c":"汽車旅館","es":"We stayed at a cheap motel on the side of the highway.","cs":"我們住在高速公路旁一家便宜的汽車旅館。","d":"A roadside hotel designed primarily for motorists."},{"id":617,"l":3,"w":"motor","k":"ˋmot ɚ","p":"n.","c":"馬達，發動機","es":"The small motor runs on batteries.","cs":"這個小馬達靠電池運轉。","d":"A machine that produces motion or power; an engine."},{"id":618,"l":3,"w":"murder","k":"ˋmɝdɚ","p":"n. vt.vi.","c":"謀殺；謀殺罪；謀殺","es":"The police are investigating the brutal murder.","cs":"警方正在調查這起殘酷的謀殺案。","d":"The unlawful premeditated killing of one human being by another."},{"id":619,"l":3,"w":"muscle","k":"ˋmʌs!","p":"n.","c":"肌肉","es":"Running helps to build leg muscles.","cs":"跑步有助於鍛鍊腿部肌肉。","d":"A band or bundle of fibrous tissue in a human or animal body that has the ability to contract, producing movement."},{"id":620,"l":3,"w":"mushroom","k":"ˋmʌʃrʊm","p":"n. vi.","c":"蘑菇；雨後春筍般地湧現","es":"I picked some wild mushrooms in the forest.","cs":"我在森林裡採摘了一些野蘑菇。","d":"A fungus with a rounded cap and stalk, many of which are edible."},{"id":621,"l":3,"w":"musical","k":"ˋmjuz ɪk!","p":"adj.","c":"音樂的","es":"The high school is putting on a musical this spring.","cs":"這所高中今年春天將上演一齣音樂劇。","d":"Relating to music; skilled in or fond of music."},{"id":622,"l":3,"w":"mystery","k":"ˋmɪstərɪ","p":"n.","c":"神祕 ；神祕的事物","es":"The origin of the stone circle remains a mystery.","cs":"石圈的起源仍然是一個謎。","d":"Something that is difficult or impossible to understand or explain."},{"id":623,"l":3,"w":"nanny","k":"ˋnæn ɪ","p":"n.","c":"【主英】保姆","es":"The family hired a nanny to look after their three young children.","cs":"這家人僱用了一個保姆來照顧他們的三個年幼孩子。","d":"A person, typically a woman, employed to look after a child in its own home."},{"id":624,"l":3,"w":"nap","k":"næ p","p":"n.","c":"打盹兒，午睡","es":"The toddler usually takes an afternoon nap for two hours.","cs":"這個學步的孩子通常會在下午小睡兩個小時。","d":"A short sleep, usually during the day."},{"id":625,"l":3,"w":"native","k":"ˋnetɪv","p":"adj. n.","c":"天生的；祖國的；土著的；本地人，本國人","es":"She is a native speaker of both English and French.","cs":"她是英語和法語的母語人士。","d":"A person born in a specified place or associated with a place by birth."},{"id":626,"l":3,"w":"navy","k":"ˋnevɪ","p":"n.","c":"海軍","es":"He joined the navy right after finishing high school.","cs":"他高中畢業後就加入了海軍。","d":"The branch of a nation's armed services that conducts military operations at sea."},{"id":627,"l":3,"w":"necessity","k":"nəˋsɛsətɪ","p":"n.","c":"需要，必要性 ；必需品","es":"Water is an absolute necessity for human life.","cs":"水是人類生命絕對的必需品。","d":"The state or fact of being required; something essential."},{"id":628,"l":3,"w":"necktie","k":"ˋnɛk͵taɪ","p":"n.","c":"領帶","es":"He straightened his necktie before entering the meeting.","cs":"他在進入會議前整理了他的領帶。","d":"A long, narrow piece of fabric worn under the collar of a shirt, tied in a knot at the front."},{"id":629,"l":3,"w":"neighborhood","k":"ˋnebɚ͵hʊd","p":"n.","c":"鄰近地區","es":"We live in a quiet, friendly neighborhood.","cs":"我們住一個安靜、友善的鄰近地區。","d":"A district or area of a town or city, especially a residential one."},{"id":630,"l":3,"w":"nerve","k":"nɝv","p":"n.","c":"神經","es":"The injury damaged the nerve in his leg.","cs":"這次受傷損害了他腿部的神經。","d":"A bundle of fibers in the body that transmits impulses of sensation and motion; courage."},{"id":631,"l":3,"w":"nervous","k":"ˋnɝvəs","p":"adj.","c":"神經質的；緊張不安的","es":"She felt nervous before giving the presentation.","cs":"在做簡報前，她感到很緊張。","d":"Easily agitated or distressed; relating to the nerves."},{"id":632,"l":3,"w":"network","k":"ˋnɛt͵wɝk","p":"n.","c":"廣播 (電視 )網；電腦網路","es":"The company has a network of stores across the country.","cs":"這家公司在全國各地設有一個商店網絡。","d":"An arrangement of intersecting lines or channels; a group of connected people or systems."},{"id":633,"l":3,"w":"nickname","k":"ˋnɪk͵nem","p":"n.vt.","c":"綽號 ；給…起綽號","es":"His nickname in high school was \"Speedy\" because he ran fast.","cs":"他在高中時的綽號是「快手」，因為他跑得很快。","d":"A familiar or humorous name given to a person instead of or as well as the real name."},{"id":634,"l":3,"w":"noble","k":"ˋnob!","p":"adj.","c":"高貴的，高尚的","es":"He made a noble effort to help the poor.","cs":"他為幫助窮人做出了高尚的努力。","d":"Belonging to a hereditary class with high social or political status; admirable."},{"id":635,"l":3,"w":"normal","k":"ˋnɔrm!","p":"adj.","c":"正常的，正規的","es":"It's normal to feel tired after a long flight.","cs":"長途飛行後感到疲倦是正常的。","d":"Conforming to a standard; typical, usual, or expected."},{"id":636,"l":3,"w":"novelist","k":"ˋnɑv!ɪst","p":"n.","c":"小說家","es":"The acclaimed novelist released her tenth book this year.","cs":"這位備受讚譽的小說家今年發行了她的第十本書。","d":"A person who writes novels."},{"id":637,"l":3,"w":"nun","k":"nʌn","p":"n.","c":"尼姑；修女","es":"A nun dedicated her life to religious service.","cs":"一位修女將她的一生奉獻給了宗教服務。","d":"A member of a religious community of women living under vows of poverty, chastity, and obedience."},{"id":638,"l":3,"w":"oak","k":"ok","p":"n.","c":"橡樹 ；橡木","es":"The ancient oak tree stood tall in the middle of the field.","cs":"這棵古老的橡樹高聳地立在田野中央。","d":"A large, common tree that produces acorns and hard wood."},{"id":639,"l":3,"w":"observe","k":"əbˋzɝv","p":"vt.vi.","c":"觀察；看 (注意 )到","es":"Scientists will observe the animals' behavior in the wild.","cs":"科學家將觀察這些動物在野外的行為。","d":"To watch carefully the way something happens; to notice."},{"id":640,"l":3,"w":"obvious","k":"ˋɑbvɪəs","p":"adj.","c":"明顯的；顯著的","es":"It was obvious that she was trying to hide something.","cs":"很明顯她在試圖隱藏一些東西。","d":"Easily perceived or understood; clear, plain, or apparent."},{"id":641,"l":3,"w":"occasion","k":"əˋkeʒən","p":"n.","c":"場合，時機","es":"A wedding is a very happy and important occasion.","cs":"婚禮是一個非常快樂且重要的場合。","d":"A particular time or instance of an event."},{"id":642,"l":3,"w":"odd","k":"ɑd","p":"adj.","c":"奇特的，古怪的；奇數的","es":"The number seven is an odd number.","cs":"數字七是一個奇數。","d":"Different from what is expected; strange; (of a number) not divisible by two."},{"id":643,"l":3,"w":"onto","k":"ˋɑntu","p":"prep.","c":"到...之上","es":"The cat jumped onto the kitchen counter.","cs":"貓跳到了廚房的櫃檯上。","d":"Moving to a position on the surface of."},{"id":644,"l":3,"w":"operator","k":"ˋɑpə͵retɚ","p":"n.","c":"操作者；接線生","es":"Please contact the telephone operator if you have trouble dialing.","cs":"如果您撥號有困難，請聯繫電話接線員。","d":"A person who operates a machine or system."},{"id":645,"l":3,"w":"opportunity","k":"͵ɑpɚˋtjun ətɪ","p":"n.","c":"機會","es":"This new job offers a great opportunity for growth.","cs":"這份新工作提供了很好的成長機會。","d":"A set of circumstances that makes it possible to do something; a chance."},{"id":646,"l":3,"w":"opposite","k":"ˋɑpəzɪt","p":"n.a.prep.","c":"對立 (相反 )物 ；相反的 ；在…對面","es":"The bakery is opposite the bank.","cs":"麵包店在銀行的對面。","d":"Situated at the other side or end; completely different."},{"id":647,"l":3,"w":"optimistic","k":"͵ɑptəˋmɪstɪk","p":"adj.","c":"樂觀的","es":"She is always optimistic about the future.","cs":"她對未來總是抱持樂觀的態度。","d":"Hopeful and confident about the future."},{"id":648,"l":3,"w":"origin","k":"ˋɔrədʒɪn","p":"n.","c":"起源；開端； 出身","es":"The scientists investigated the origin of the mysterious sound.","cs":"科學家調查了這個神秘聲音的起源。","d":"The point or manner in which something arises or is derived."},{"id":649,"l":3,"w":"original","k":"əˋrɪdʒən!","p":"adj.","c":"最初的，原始的；有獨創性的","es":"He designed a unique and original piece of artwork.","cs":"他設計了一件獨特且原創的藝術品。","d":"Present or existing from the beginning; the first or earliest."},{"id":650,"l":3,"w":"orphan","k":"ˋɔrfən","p":"n.","c":"孤兒","es":"The story is about an orphan who searches for his family.","cs":"這個故事是關於一個尋找家人的孤兒。","d":"A child whose parents are dead."},{"id":651,"l":3,"w":"ought to","k":"ˋɔtə","p":"aux.","c":"(表示義務，責任，願望 等)應當，應該","es":"You ought to apologize for being so rude.","cs":"你應該為你的粗魯行為道歉。","d":"Used to express duty or correctness; should."},{"id":652,"l":3,"w":"outdoor","k":"ˋaʊt͵dor","p":"adj.","c":"戶外的，露天的","es":"We prefer outdoor activities like cycling and hiking.","cs":"我們更喜歡騎自行車和徒步等戶外活動。","d":"Located, done, or used in the open air."},{"id":653,"l":3,"w":"outdoors","k":"ˋaʊtˋdorz","p":"advt.","c":"在戶外，在野外","es":"It's a beautiful day, so let's eat outdoors.","cs":"今天天氣很好，我們到戶外用餐吧。","d":"In or into the open air."},{"id":654,"l":3,"w":"outer","k":"ˋaʊtɚ","p":"adj.","c":"外面的，外表的","es":"The outer layer of the coat is waterproof.","cs":"這件外套的外層是防水的。","d":"Situated on the outside."},{"id":655,"l":3,"w":"outline","k":"ˋaʊt͵laɪn","p":"n. vt.","c":"外形；輪廓；概要；畫出 …的輪廓","es":"She quickly sketched an outline of the human body.","cs":"她快速地勾勒出人體的輪廓。","d":"A drawing or sketch showing only the exterior lines; a summary."},{"id":656,"l":3,"w":"overcoat","k":"ˋovɚ͵kot","p":"n.","c":"外套，大衣","es":"He put on his heavy overcoat before going outside.","cs":"他在出門前穿上他厚重的大衣。","d":"A long, warm coat worn over other clothes in cold weather."},{"id":657,"l":3,"w":"owe","k":"o","p":"vt.","c":"欠(債等 )；把 ...歸功於","es":"I owe you twenty dollars for the concert ticket.","cs":"我欠你二十美元的音樂會門票錢。","d":"To have an obligation to pay or repay (something, especially money)."},{"id":658,"l":3,"w":"ownership","k":"ˋonɚ͵ʃɪp","p":"n.","c":"所有權；物主身分","es":"Proof of ownership is required to claim the prize.","cs":"領取獎品需要提供所有權證明。","d":"The state or fact of owning something."},{"id":659,"l":3,"w":"pad","k":"pæ d","p":"n.","c":"襯墊；護墊；便條紙簿；印泥","es":"I always keep a note pad and pen next to my phone.","cs":"我總是將一個便條本和筆放在電話旁邊。","d":"A thick piece of soft material used to protect or cushion; a tablet of paper."},{"id":660,"l":3,"w":"pail","k":"pel","p":"n.","c":"提桶","es":"The farmer carried a pail of fresh milk.","cs":"農夫提著一桶新鮮牛奶。","d":"A bucket."},{"id":661,"l":3,"w":"pal","k":"pæ l","p":"n.","c":"【口】伙伴；好友","es":"My old school pal called me last night.","cs":"我這位舊友昨晚打電話給我。","d":"A friend."},{"id":662,"l":3,"w":"palace","k":"ˋpælɪs","p":"n.","c":"皇宮，宮殿","es":"The royal palace is open to visitors during the summer.","cs":"這座皇家宮殿在夏季對遊客開放。","d":"The official residence of a sovereign, president, or bishop."},{"id":663,"l":3,"w":"pale","k":"pel","p":"adj.","c":"蒼白的，灰白的","es":"She looked pale and weak after being sick.","cs":"她生病後看起來蒼白而虛弱。","d":"Light in color or having little color."},{"id":664,"l":3,"w":"pancake","k":"ˋpæn͵kek","p":"n.","c":"薄煎餅，薄烤餅","es":"I ordered a stack of pancakes with maple syrup.","cs":"我點了一疊淋上楓糖漿的鬆餅。","d":"A thin, flat cake made of batter and cooked on a hot griddle."},{"id":665,"l":3,"w":"panic","k":"ˋpæn ɪk","p":"n.","c":"恐慌，驚慌","es":"There was a moment of panic when the lights went out.","cs":"燈熄滅時，有一陣恐慌。","d":"Sudden uncontrollable fear or anxiety."},{"id":666,"l":3,"w":"parade","k":"pəˋred","p":"n.vi.","c":"行進，遊行","es":"The whole town came out to watch the holiday parade.","cs":"全鎮的人都出來觀看節日遊行。","d":"A public procession, especially one celebrating a special day or event."},{"id":667,"l":3,"w":"paradise","k":"ˋpærə͵daɪs","p":"n.","c":"天堂；樂園","es":"The tropical island felt like a peaceful paradise.","cs":"這個熱帶島嶼感覺像是一個寧靜的天堂。","d":"(In some religions) heaven; an extremely beautiful, peaceful, or perfect place."},{"id":668,"l":3,"w":"parcel","k":"ˋpɑrs!","p":"n.","c":"小包，包裹","es":"I received a small parcel in the mail this morning.","cs":"我今天早上收到了一個郵寄的包裹。","d":"An object or collection of objects wrapped in paper in order to be carried or sent by mail."},{"id":669,"l":3,"w":"participate","k":"pɑrˋtɪsə͵pet","p":"vi.","c":"參加，參與","es":"Everyone is encouraged to participate in the discussion.","cs":"鼓勵每個人都參與討論。","d":"To take part in an activity or event."},{"id":670,"l":3,"w":"passage","k":"ˋpæs ɪdʒ","p":"n.","c":"通行；通路；走廊；(文章，樂曲等的 )一段","es":"He read a short passage from the novel.","cs":"他從小說中讀了一小段段落。","d":"A narrow way allowing movement from one place to another; a section of text."},{"id":671,"l":3,"w":"passion","k":"ˋpæʃən","p":"n.","c":"熱情，激情","es":"Teaching is not just a job for her; it's a passion.","cs":"對她來說，教學不只是一份工作，而是一種熱情。","d":"Strong and barely controllable emotion; intense desire."},{"id":672,"l":3,"w":"passport","k":"ˋpæs͵port","p":"n.","c":"護照；通行證","es":"Remember to bring your passport to the airport.","cs":"記得帶你的護照去機場。","d":"An official document issued by a government, certifying the holder's identity and citizenship and entitling them to travel abroad."},{"id":673,"l":3,"w":"password","k":"ˋpæs͵w ɝd","p":"n.","c":"密碼：口令；暗語","es":"You need a strong password to protect your account.","cs":"你需要一個高強度的密碼來保護你的帳戶。","d":"A secret word or phrase that must be used to gain admission or access."},{"id":674,"l":3,"w":"patience","k":"ˋpeʃəns","p":"n.","c":"耐心；忍耐；耐性","es":"Dealing with customers requires a lot of patience.","cs":"處理客戶需要很大的耐心。","d":"The capacity to accept or tolerate delay, trouble, or suffering without getting angry or upset."},{"id":675,"l":3,"w":"pause","k":"pɔz","p":"n.vi.","c":"暫停；中斷","es":"The speaker took a brief pause to drink some water.","cs":"演講者短暫停頓了一下喝水。","d":"A temporary stop in action or speech."},{"id":676,"l":3,"w":"pave","k":"pev","p":"vt.","c":"鋪設，築 (路等 )","es":"The city plans to pave the dirt road next month.","cs":"市政府計畫下個月鋪設這條泥土路。","d":"To cover (a piece of ground) with concrete, stone, or asphalt to make a path or road."},{"id":677,"l":3,"w":"pavement","k":"ˋpevm ənt","p":"n.","c":"【英】人行道","es":"The child was riding his bike along the pavement.","cs":"孩子沿著人行道騎著他的自行車。","d":"A hard surface on which people walk, usually beside a road; sidewalk (US)."},{"id":678,"l":3,"w":"paw","k":"pɔ","p":"n.","c":"腳爪；爪子","es":"The dog lifted its paw to shake hands.","cs":"狗抬起它的爪子來握手。","d":"The foot of an animal (such as a cat, dog, or bear) having claws or pads."},{"id":679,"l":3,"w":"pay2","k":"pe","p":"n.","c":"薪俸；報酬 (salary/wage(s))","es":"The long hours and low pay made her quit the job.","cs":"工時長和低工資使她辭去了這份工作。","d":"To give (someone) money in exchange for goods or services."},{"id":680,"l":3,"w":"pea","k":"pi","p":"n.","c":"豌豆","es":"The side dish included carrots and green peas.","cs":"配菜包括胡蘿蔔和綠豌豆。","d":"A small, spherical green seed or fruit of a climbing plant, eaten as a vegetable."},{"id":681,"l":3,"w":"peak","k":"pik","p":"n.","c":"山頂，山峰","es":"We reached the peak of the mountain before sunrise.","cs":"我們在日出前到達了山頂。","d":"The pointed top of a mountain; the highest point or level."},{"id":682,"l":3,"w":"pearl","k":"pɝl","p":"n.","c":"珍珠","es":"She wore a necklace made of white pearls.","cs":"她戴了一條由白色珍珠製成的項鍊。","d":"A hard, lustrous spherical substance produced within the soft tissue of a shelled mollusk."},{"id":683,"l":3,"w":"peel","k":"pil","p":"vt.","c":"削去 …的皮，剝去 …的殼","es":"Remember to peel the potatoes before you boil them.","cs":"記得在煮馬鈴薯之前要削皮。","d":"To remove the outer covering or skin from (a fruit or vegetable)."},{"id":684,"l":3,"w":"peep","k":"pip","p":"vi.n.","c":"窺，偷看","es":"I took a quick peep through the keyhole.","cs":"我從鑰匙孔裡快速地偷看了一眼。","d":"To look quickly and cautiously through a small opening."},{"id":685,"l":3,"w":"pen or fruit preserved in brine or vinegar; a difficult situation."},{"id":694,"l":3,"w":"pill","k":"pɪl","p":"n.","c":"藥丸，藥片","es":"Take one pill before going to bed.","cs":"睡前服用一顆藥。","d":"A small round mass of solid medicine for swallowing."},{"id":695,"l":3,"w":"pilot","k":"ˋpaɪlət","p":"n.","c":"領航員； (飛機等的 )駕駛員","es":"The pilot safely landed the plane in the storm.","cs":"飛行員在暴風雨中安全降落了飛機。","d":"A person who operates the flying controls of an aircraft; a person who steers a ship."},{"id":696,"l":3,"w":"pine","k":"paɪn","p":"n.","c":"松樹 ；松木","es":"They planted several young pine trees near the fence.","cs":"他們在籬笆附近種植了幾棵幼小的松樹。","d":"An evergreen cone-bearing tree with long needles."},{"id":697,"l":3,"w":"pint","k":"paɪnt","p":"n.","c":"品脫 (英美容量或液量名 )","es":"I ordered a pint of beer at the pub.","cs":"我在酒吧點了一品脫啤酒。","d":"A unit of liquid or dry capacity equal to one eighth of a gallon."},{"id":698,"l":3,"w":"pit","k":"pɪt","p":"n.","c":"窪坑，凹處","es":"They dug a large pit in the ground to plant the tree.","cs":"他們在地上挖了一個大坑來種樹。","d":"A large hole or depression in the ground; the stone of a fruit."},{"id":699,"l":3,"w":"pity","k":"ˋpɪtɪ","p":"n.vt.","c":"憐憫；同情 ；可惜的事，憾事 ；同情 …","es":"It's a pity that you can't come to the party.","cs":"你不能來參加派對真是可惜。","d":"The feeling of sorrow and compassion caused by the suffering and misfortunes of others."},{"id":700,"l":3,"w":"plastic","k":"ˋplæst ɪk","p":"adj.","c":"塑膠的；塑性的","es":"We should try to use less plastic packaging.","cs":"我們應該盡量少用塑膠包裝。","d":"A synthetic material made from polymers, capable of being molded."},{"id":701,"l":3,"w":"plenty","k":"ˈplenti","p":"n.","c":"豐富；充足","es":"There is plenty of food for everyone at the party.","cs":"派對上有足夠的食物給每一個人。","d":"A large or sufficient amount or quantity; enough."},{"id":702,"l":3,"w":"plug","k":"plʌg","p":"n.","c":"插頭，插塞 vt.把...塞住，堵塞","es":"Remember to plug in the television before turning it on.","cs":"記得在打開電視前要插上插頭。","d":"A piece of material used to stop a hole; a device for connecting to an electrical socket."},{"id":703,"l":3,"w":"plum","k":"plʌm","p":"n.","c":"李子；梅子","es":"She made a delicious jam with fresh plums.","cs":"她用新鮮的李子做了一種美味的果醬。","d":"A round or oval fruit that is purple, reddish, or yellow when ripe, with a smooth skin."},{"id":704,"l":3,"w":"plumber","k":"ˋplʌmɚ","p":"n.","c":"水管工人","es":"We called a plumber to fix the leaky faucet.","cs":"我們叫了個水管工來修理漏水的水龍頭。","d":"A person who installs and repairs the pipes and fittings of water supply, sanitation, or heating systems."},{"id":705,"l":3,"w":"pole","k":"pol","p":"n.","c":"柱；竿","es":"The flag flew high on the flagpole.","cs":"旗幟在旗杆上高高飄揚。","d":"A long, rounded piece of wood or metal; the extreme ends of the earth's axis."},{"id":706,"l":3,"w":"political","k":"pəˋlɪtɪk!","p":"adj.","c":"政治的","es":"The debate focused on the current political situation.","cs":"這次辯論聚焦在當前的政治局勢。","d":"Relating to the government or public affairs of a country."},{"id":707,"l":3,"w":"politician","k":"͵pɑləˋtɪʃən","p":"n.","c":"政治家；政客","es":"The local politician is running for re-election.","cs":"這位地方政客正在競選連任。","d":"A person actively involved in party politics or holding public office."},{"id":708,"l":3,"w":"politics","k":"ˋpɑlətɪks","p":"n.","c":"政治 (學)","es":"He is very interested in international politics.","cs":"他對國際政治很感興趣。","d":"The activities associated with the governance of a country or area."},{"id":709,"l":3,"w":"poll","k":"pol","p":"n.","c":"投票，選舉；民意測驗","es":"A recent poll showed public support for the new law.","cs":"最近的一項民意調查顯示公眾支持這項新法律。","d":"The process of voting in an election; a survey of public opinion."},{"id":710,"l":3,"w":"pollute","k":"pəˋlut","p":"vt.","c":"汙染","es":"Factories often pollute the air and rivers.","cs":"工廠經常污染空氣和河流。","d":"To contaminate (water, the air, or a place) with harmful or poisonous substances."},{"id":711,"l":3,"w":"pony","k":"ˋponɪ","p":"n.","c":"小馬","es":"The little girl loved riding her small pony.","cs":"小女孩喜歡騎她的小矮種馬。","d":"A horse of a small breed."},{"id":712,"l":3,"w":"pop1","k":"pɑp","p":"vt. vi.","c":"爆裂；發出砰 (或啪 )的響聲","es":"The balloon made a loud pop when it burst.","cs":"氣球爆裂時發出很大的砰聲。","d":"(Verb/Noun) To make a light explosive sound; a popular music style."},{"id":713,"l":3,"w":"pop2","k":"pɑp","p":"adj.","c":"通俗的，流行的 (popular)","es":"I heard the cork pop when he opened the champagne.","cs":"他打開香檳時，我聽到了軟木塞砰的一聲。","d":"(Verb/Noun) To make a light explosive sound; a popular music style."},{"id":714,"l":3,"w":"porcelain","k":"ˋpɔrslɪn","p":"n.","c":"瓷；(總稱 )瓷器 (china)","es":"She collects antique blue and white porcelain plates.","cs":"她收藏古董藍白瓷器盤子。","d":"A white vitrified ceramic material; china."},{"id":715,"l":3,"w":"portion","k":"ˋporʃən","p":"n.","c":"部分","es":"The restaurant serves very generous portions of food.","cs":"這家餐廳提供的食物份量非常大方。","d":"A part of a larger amount or whole; a serving of food."},{"id":716,"l":3,"w":"portrait","k":"ˋportret","p":"n.","c":"肖像，畫像","es":"The artist painted a beautiful portrait of the Queen.","cs":"藝術家畫了一幅美麗的女王肖像。","d":"A painting, drawing, or photograph of a person, especially the face."},{"id":717,"l":3,"w":"postage","k":"ˋpost ɪdʒ","p":"n.","c":"郵資","es":"How much is the postage for a letter to Europe?","cs":"寄到歐洲的一封信的郵資是多少？","d":"The amount of money required to send a letter or parcel by post."},{"id":718,"l":3,"w":"poster","k":"ˋpost ɚ","p":"n.","c":"海報，廣告 (畫)；布告","es":"They hung a colorful movie poster on the wall.","cs":"他們在牆上掛了一張色彩鮮豔的電影海報。","d":"A large printed picture or notice put in a public place."},{"id":719,"l":3,"w":"postpone","k":"postˋpon","p":"vt.vi.","c":"延遲，延緩","es":"We have to postpone the meeting until next week.","cs":"我們必須將會議延期到下週。","d":"To cause or arrange for (something) to take place at a time later than that first scheduled."},{"id":720,"l":3,"w":"postponement","k":"postˋponm ənt","p":"n.","c":"延期；延緩","es":"The rain led to the postponement of the outdoor concert.","cs":"降雨導致了戶外音樂會的延期。","d":"The action of putting off an event or meeting until a later time."},{"id":721,"l":3,"w":"pottery","k":"ˋpɑtərɪ","p":"n.","c":"陶器 (ceramic(s))","es":"She took a class on how to make ceramic pottery.","cs":"她上了一堂關於如何製作陶瓷陶器的課程。","d":"Objects made from clay and fired in a kiln."},{"id":722,"l":3,"w":"pour","k":"por","p":"vt.","c":"倒，灌，注","es":"She began to pour the tea into the cups.","cs":"她開始將茶倒進杯子裡。","d":"To flow rapidly in a stream; to cause (a liquid) to flow."},{"id":723,"l":3,"w":"poverty","k":"ˋpɑvɚtɪ","p":"n.","c":"貧窮，貧困","es":"The government is working to reduce poverty in the city.","cs":"政府正努力減少城市中的貧窮。","d":"The state of being extremely poor."},{"id":724,"l":3,"w":"powder","k":"ˋpaʊdɚ","p":"n.","c":"粉，粉末","es":"She used face powder to set her makeup.","cs":"她使用臉部粉餅來定妝。","d":"Fine particles of a substance."},{"id":725,"l":3,"w":"practical","k":"ˋprækt ɪk!","p":"adj.","c":"實際的；實用的","es":"Learning a second language is a very practical skill.","cs":"學習第二語言是一種非常實用的技能。","d":"Of or concerned with the actual doing or use of something rather than with theory."},{"id":726,"l":3,"w":"prayer","k":"prɛr","p":"n.","c":"祈禱，禱告","es":"She offered a silent prayer for her sick grandfather.","cs":"她為生病的爺爺默默地祈禱。","d":"A solemn request or thanksgiving to God or another deity."},{"id":727,"l":3,"w":"precious","k":"ˋprɛʃəs","p":"adj.","c":"貴重的，珍貴的","es":"Water is a precious resource that must be conserved.","cs":"水是一種寶貴的資源，必須節約。","d":"Of great value; highly cherished."},{"id":728,"l":3,"w":"preparation","k":"͵prɛpəˋreʃən","p":"n.","c":"準備，預備","es":"The event required months of careful preparation.","cs":"這次活動需要數月仔細的準備。","d":"The action or process of making something ready for use or consideration."},{"id":729,"l":3,"w":"pressure","k":"ˋprɛʃɚ","p":"n.","c":"壓力；壓迫","es":"She is under a lot of pressure to meet the deadline.","cs":"她面臨著很大的壓力來趕上截止日期。","d":"The continuous physical force exerted on or against an object; the influence or demands of circumstances."},{"id":730,"l":3,"w":"pretend","k":"prɪˋtɛnd","p":"vt.","c":"假裝","es":"The children like to pretend to be superheroes.","cs":"孩子們喜歡假裝自己是超級英雄。","d":"To behave as if something is true when one knows it is not."},{"id":731,"l":3,"w":"prevent","k":"prɪˋvɛnt","p":"vt.","c":"防止，預防","es":"We need to take steps to prevent accidents in the workplace.","cs":"我們需要採取措施防止工作場所發生事故。","d":"To stop (something) from happening or arising."},{"id":732,"l":3,"w":"previous","k":"ˋprivi əs","p":"adj.","c":"以前的","es":"The current chapter builds on the ideas from the previous one.","cs":"目前的章節建立在前一個章節的想法之上。","d":"Existing or occurring before in time or order."},{"id":733,"l":3,"w":"priest","k":"prist","p":"n.","c":"牧師；神父","es":"The priest gave the sermon in the church.","cs":"牧師在教堂裡講道。","d":"An ordained minister of the Catholic, Orthodox, or Anglican Church."},{"id":734,"l":3,"w":"primary","k":"ˋpraɪ͵mɛrɪ","p":"adj.","c":"首要的，主要的","es":"The primary goal of this project is to save energy.","cs":"這個專案的主要目標是節省能源。","d":"Belonging to the first or highest rank or importance."},{"id":735,"l":3,"w":"probable","k":"ˋprɑbəb!","p":"adj.","c":"很可能發生的","es":"It is probable that the train will be delayed due to the snow.","cs":"火車很可能會因為下雪而延誤。","d":"Likely to happen or be the case."},{"id":736,"l":3,"w":"process","k":"ˋprɑsɛs","p":"n. vt.","c":"過程，進程；加工","es":"The application process takes about three weeks.","cs":"申請過程大約需要三週時間。","d":"A series of actions or steps taken to achieve a particular end."},{"id":737,"l":3,"w":"product","k":"ˋprɑdəkt","p":"n.","c":"產品","es":"The company is launching a new software product next month.","cs":"該公司下個月將推出一款新的軟體產品。","d":"An article or substance manufactured or refined for sale."},{"id":738,"l":3,"w":"profit","k":"ˋprɑfɪt","p":"n.vi.vt.","c":"利潤，盈利 ；有益 (於…)","es":"The business made a substantial profit last quarter.","cs":"該企業上個季度獲得了可觀的利潤。","d":"A financial gain, especially the difference between the amount earned and the amount spent in buying, operating, or producing something."},{"id":739,"l":3,"w":"program","k":"ˋprogræm","p":"n.","c":"節目；計畫； 【電腦】程式","es":"The concert program listed all the songs to be performed.","cs":"音樂會的節目表列出了所有將要表演的歌曲。","d":"A planned series of future events or performances; a set of instructions for a computer."},{"id":740,"l":3,"w":"promote","k":"prəˋmot","p":"vt.","c":"晉升；宣傳，推銷","es":"The company decided to promote her to team leader.","cs":"公司決定晉升她為團隊領導。","d":"To support or actively encourage (a cause, venture, or aim); to move to a higher position."},{"id":741,"l":3,"w":"proof","k":"pruf","p":"n.","c":"證據；物證","es":"Do you have any proof that you bought the item here?","cs":"你有任何證據證明你在這裡購買了這個物品嗎？","d":"Evidence or argument establishing a fact or the truth of a statement."},{"id":742,"l":3,"w":"proper","k":"ˋprɑpɚ","p":"adj.","c":"適合的，適當的","es":"Always ensure the proper use of safety equipment.","cs":"務必確保正確使用安全設備。","d":"Truly what something is said or regarded as; correct or suitable."},{"id":743,"l":3,"w":"property","k":"ˋprɑpɚtɪ","p":"n.","c":"財產，資產 ；特性 ；道具","es":"The house and the land it stands on are his private property.","cs":"這棟房子及其所在土地是他的私人財產。","d":"A thing or things belonging to someone; a quality or characteristic."},{"id":744,"l":3,"w":"proposal","k":"prəˋpoz!","p":"n.","c":"提議；求婚","es":"She submitted a detailed proposal for the new project.","cs":"她為新專案提交了一份詳細的提案。","d":"A plan or suggestion, especially a formal one, put forward for consideration."},{"id":745,"l":3,"w":"protection","k":"prəˋtɛkʃən","p":"n.","c":"保護，防護","es":"Sunglasses offer protection for your eyes against the sun.","cs":"太陽眼鏡為您的眼睛提供防曬保護。","d":"The action of keeping someone or something safe from injury, damage, or harm."},{"id":746,"l":3,"w":"protective","k":"prəˋtɛktɪv","p":"adj.","c":"保護的，防護的","es":"He put on protective gear before riding his motorcycle.","cs":"他在騎摩托車前穿上了防護裝備。","d":"Intended to protect someone or something."},{"id":747,"l":3,"w":"pub","k":"pʌb","p":"n.","c":"酒吧","es":"Let's meet at the local pub for a drink tonight.","cs":"我們今晚在當地酒吧見面喝一杯吧。","d":"A public house; a building licensed to sell alcoholic drinks to be consumed on the premises."},{"id":748,"l":3,"w":"punch","k":"pʌntʃ","p":"n.vi.vt.","c":"拳打；用拳猛擊","es":"The boxer landed a powerful punch to his opponent's stomach.","cs":"這位拳擊手對對手的腹部打出了一個強有力的一拳。","d":"A blow with the fist; a drink made of mixed ingredients."},{"id":749,"l":3,"w":"pure","k":"pjʊr","p":"adj.","c":"純粹的，不攙雜的；純潔的","es":"We drank the pure water from the mountain spring.","cs":"我們喝了山泉裡純淨的水。","d":"Not mixed or adulterated with any other substance or material."},{"id":750,"l":3,"w":"pursue","k":"pɚˋsu","p":"vt.","c":"追趕；追求","es":"She decided to pursue a career in graphic design.","cs":"她決定追求平面設計的職業生涯。","d":"To follow (someone or something) in order to catch or attain them."},{"id":751,"l":3,"w":"quarrel","k":"ˋkwɔrəl","p":"n.vi.","c":"爭吵","es":"The two friends had a small quarrel over money.","cs":"這兩個朋友為錢發生了一點爭吵。","d":"A heated argument or disagreement."},{"id":752,"l":3,"w":"queer","k":"kwɪr","p":"adj.","c":"奇怪的，古怪的","es":"He had a queer feeling that something was wrong.","cs":"他有一種奇怪的感覺，覺得有些不對勁。","d":"Strange; odd; or eccentric."},{"id":753,"l":3,"w":"quote","k":"kwot","p":"vt.vi. n.","c":"引用；引述；引語，引文","es":"Can you quote a famous line from Shakespeare?","cs":"你能引用一句莎士比亞的名言嗎？","d":"To repeat or copy out (a group of words) from a text or speech."},{"id":754,"l":3,"w":"racial","k":"ˋreʃəl","p":"adj.","c":"人種的，種族的","es":"The school is working to reduce racial tensions.","cs":"學校正在努力減少種族間的緊張關係。","d":"Relating to or based on race."},{"id":755,"l":3,"w":"radar","k":"ˋredɑr","p":"n.","c":"雷達","es":"Air traffic control uses radar to track planes.","cs":"航空交通管制使用雷達來追蹤飛機。","d":"A system for detecting the presence, direction, and speed of objects by sending out pulses of high-frequency electromagnetic waves."},{"id":756,"l":3,"w":"rag","k":"ræ g","p":"n.","c":"破布，碎布","es":"She used a wet rag to wipe down the table.","cs":"她用一塊濕布擦拭桌子。","d":"A piece of old cloth or fabric."},{"id":757,"l":3,"w":"raisin","k":"ˋrezn","p":"n.","c":"葡萄乾","es":"I like to bake oatmeal cookies with raisins.","cs":"我喜歡烤燕麥餅乾時加入葡萄乾。","d":"A dried grape."},{"id":758,"l":3,"w":"rank","k":"ræŋk","p":"n.vi.vt.","c":"等級；地位；把…評級","es":"He holds the highest rank in the military.","cs":"他擁有軍隊中的最高級別。","d":"A position in a hierarchy; to assign a position to."},{"id":759,"l":3,"w":"rate","k":"ret","p":"n.vt.","c":"比例；速度；等級 ；對…估價；對 …評價","es":"The bank offers a very low interest rate.","cs":"銀行提供的利率非常低。","d":"A measure, quantity, or frequency (often standardized) typically measured against another quantity or standard."},{"id":760,"l":3,"w":"raw","k":"rɔ","p":"adj.","c":"生的，未煮過的","es":"Do not eat chicken that is still raw.","cs":"不要吃仍然生的雞肉。","d":"(Of food) not cooked; in its natural state."},{"id":761,"l":3,"w":"ray","k":"re","p":"n.","c":"光線 ；射線","es":"The sun's rays broke through the clouds.","cs":"太陽的光線穿過了雲層。","d":"A line of light or heat, or an imaginary line that extends from a point."},{"id":762,"l":3,"w":"razor","k":"ˋrezɚ","p":"n.","c":"剃刀","es":"He used a sharp razor to shave his beard.","cs":"他使用鋒利的刮鬍刀來刮鬍子。","d":"An implement with a sharp blade used for shaving."},{"id":763,"l":3,"w":"react","k":"rɪˋækt","p":"vi.","c":"反應","es":"How did he react when you told him the news?","cs":"當你告訴他這個消息時，他有何反應？","d":"To act in response to something."},{"id":764,"l":3,"w":"reaction","k":"rɪˋækʃən","p":"n.","c":"反應","es":"Her immediate reaction was one of shock.","cs":"她即時的反應是震驚。","d":"An action or feeling caused by another event or situation."},{"id":765,"l":3,"w":"reasonable","k":"ˋrizn əb!","p":"adj.","c":"合理的；有理智的","es":"The price of the hotel room was quite reasonable.","cs":"這間飯店房間的價格相當合理。","d":"Having sound judgment; fair and sensible."},{"id":766,"l":3,"w":"receipt","k":"rɪˋsit","p":"n.","c":"收據","es":"Keep your receipt in case you need to return the item.","cs":"保留你的收據，以備你需要退貨時使用。","d":"A written acknowledgment that something has been received."},{"id":767,"l":3,"w":"receiver","k":"rɪˋsivɚ","p":"n.","c":"收件人；接待人；電話聽筒","es":"He shouted into the telephone receiver.","cs":"他對著電話聽筒大喊。","d":"A part of a telephone or radio that converts electric signals into sounds; a person who gets something."},{"id":768,"l":3,"w":"recognize","k":"ˋrɛkəg͵naɪz","p":"vt.","c":"認出；識別；承認","es":"I didn't recognize her with her new haircut.","cs":"她換了新髮型後，我沒有認出她。","d":"To identify (someone or something) from having encountered them before; to acknowledge."},{"id":769,"l":3,"w":"recorder","k":"rɪˋkɔrdɚ","p":"n.","c":"記錄者；錄音機；直笛","es":"She used a digital recorder to tape the interview.","cs":"她使用數位錄音機錄下了這次採訪。","d":"A device used to record sounds or images; a wind instrument."},{"id":770,"l":3,"w":"recover","k":"rɪˋkʌvɚ","p":"vt.vi.","c":"重新獲得；恢復；恢復","es":"It took him a long time to recover from his illness.","cs":"他花了很長時間才從疾病中康復。","d":"To return to a normal state of health, mind, or strength."},{"id":771,"l":3,"w":"reduce","k":"rɪˋdjus","p":"vt.vi.","c":"減少；縮小；降低","es":"We need to reduce the amount of plastic waste we produce.","cs":"我們需要減少我們產生的塑膠垃圾量。","d":"To make smaller or less in amount, degree, or size."},{"id":772,"l":3,"w":"regional","k":"ˋridʒən!","p":"adj.","c":"地區的","es":"The conference focused on regional issues in Asia.","cs":"這次會議聚焦於亞洲的地區性問題。","d":"Relating to or characteristic of a region."},{"id":773,"l":3,"w":"regret","k":"rɪˋgrɛt","p":"vt.vi.n.","c":"懊悔；因 …而遺憾","es":"He will always regret not finishing college.","cs":"他將永遠後悔沒有完成大學學業。","d":"To feel sadness, repentance, or disappointment over something that has happened or been done."},{"id":774,"l":3,"w":"relate","k":"rɪˋlet","p":"vt.","c":"講，敘述；使有聯繫","es":"I can easily relate to the main character in the movie.","cs":"我很容易與電影中的主角產生共鳴。","d":"To make a connection between; to tell (a story)."},{"id":775,"l":3,"w":"relax","k":"rɪˋlæks","p":"vt.vi.","c":"鬆弛，鬆懈，放鬆","es":"I like to relax by reading a book on the weekend.","cs":"我喜歡在週末透過閱讀來放鬆。","d":"To make or become less tense or anxious."},{"id":776,"l":3,"w":"release","k":"rɪˋlis","p":"vt.n.","c":"釋放，鬆開","es":"The company will release a new album next month.","cs":"這家公司下個月將發行一張新專輯。","d":"To allow or enable (something) to escape from a state of confinement; to make available to the public."},{"id":777,"l":3,"w":"reliable","k":"rɪˋlaɪəb!","p":"adj.","c":"可信賴的；可靠的","es":"She is a hard-working and very reliable employee.","cs":"她是一位勤奮且非常可靠的員工。","d":"Consistently good in quality or performance; able to be trusted."},{"id":778,"l":3,"w":"relief","k":"rɪˋlif","p":"n.","c":"緩和，減輕；救濟；補助","es":"It was a great relief to know the test results were negative.","cs":"知道檢測結果是陰性，讓人大大鬆了一口氣。","d":"A feeling of reassurance and relaxation following release from anxiety or distress."},{"id":779,"l":3,"w":"religion","k":"rɪˋlɪdʒən","p":"n.","c":"宗教","es":"Freedom of religion is guaranteed by the constitution.","cs":"宗教自由受到憲法的保障。","d":"A particular system of faith and worship."},{"id":780,"l":3,"w":"religious","k":"rɪˋlɪdʒəs","p":"adj.","c":"宗教的；虔誠的","es":"They attend religious services every Sunday.","cs":"他們每週日都會參加宗教儀式。","d":"Relating to or believing in a religion."},{"id":781,"l":3,"w":"rely","k":"rɪˋlaɪ","p":"vi.","c":"依靠，依賴","es":"You can always rely on him to tell the truth.","cs":"你可以永遠依賴他說實話。","d":"To depend on with complete trust or confidence."},{"id":782,"l":3,"w":"remain","k":"rɪˋmen","p":"vi.","c":"剩下；保持 …","es":"Only a few buildings remain after the fire.","cs":"火災後只剩下幾棟建築物。","d":"To continue to exist, especially after other parts have gone."},{"id":783,"l":3,"w":"remind","k":"rɪˋmaɪnd","p":"vt.","c":"提醒","es":"Please remind me to call the doctor tomorrow.","cs":"請提醒我明天打電話給醫生。","d":"To cause (someone) to remember something."},{"id":784,"l":3,"w":"remote","k":"rɪˋmot","p":"adj.","c":"遙遠的；偏僻的","es":"We stayed in a remote cabin deep in the woods.","cs":"我們住在樹林深處一間偏遠的小木屋裡。","d":"Situated far from the main centers of population; distant."},{"id":785,"l":3,"w":"remove","k":"rɪˋmuv","p":"vt.vi.","c":"移動，搬開；去掉，消除","es":"Remove your shoes before entering the house.","cs":"進入房子前請脫掉鞋子。","d":"To take (something) away or off from the position it occupies."},{"id":786,"l":3,"w":"renew","k":"rɪˋnju","p":"vt.vi.","c":"更新；復原","es":"I need to renew my driver's license this year.","cs":"我今年需要更新我的駕照。","d":"To resume (an activity) after an interruption; to extend the period of validity."},{"id":787,"l":3,"w":"rent","k":"rɛnt","p":"n.vt.vi.","c":"租金；出租","es":"We rent an apartment near the university campus.","cs":"我們在大學校園附近租了一間公寓。","d":"A tenant's regular payment to a landlord for the use of property."},{"id":788,"l":3,"w":"repair","k":"rɪˋpɛr","p":"vt.n.","c":"修理；修補","es":"I need to take my car to the shop for repair.","cs":"我需要把我的車送到修理店維修。","d":"To restore (something damaged or faulty) to a good condition."},{"id":789,"l":3,"w":"replace","k":"rɪˋples","p":"vt.","c":"取代","es":"We need to replace the old light fixture with a new one.","cs":"我們需要用一個新的燈具替換舊的。","d":"To put something back in a previous place; to take the place of."},{"id":790,"l":3,"w":"replacement","k":"rɪˋplesm ənt","p":"n.","c":"取代","es":"The company is looking for a replacement for the retired manager.","cs":"該公司正在為退休經理尋找替代者。","d":"The action or process of replacing something; a substitute."},{"id":791,"l":3,"w":"represent","k":"͵rɛprɪˋzɛnt","p":"vt.","c":"象徵；代表","es":"She was chosen to represent the school at the conference.","cs":"她被選中代表學校出席會議。","d":"To speak or act officially for (someone); to depict."},{"id":792,"l":3,"w":"representative","k":"rɛprɪˋzɛntətɪv","p":"n.","c":"典型，代表物","es":"He is the sales representative for the western region.","cs":"他是西部地區的銷售代表。","d":"A person chosen or appointed to act or speak for another or others."},{"id":793,"l":3,"w":"republic","k":"rɪˋpʌblɪk","p":"n.","c":"共和國","es":"The country is governed as a democratic republic.","cs":"這個國家以民主共和國的形式治理。","d":"A state in which supreme power is held by the people and their elected representatives."},{"id":794,"l":3,"w":"request","k":"rɪˋkwɛst","p":"n.vt.","c":"要求，請求","es":"The teacher accepted the student's request for an extension.","cs":"老師接受了學生延期的請求。","d":"An act of asking formally or politely for something."},{"id":795,"l":3,"w":"reserve","k":"rɪˋzɝv","p":"vt.n.","c":"預約，預訂；保留 ；儲備 (物)；儲備金","es":"I want to reserve a table for two at the restaurant.","cs":"我想在餐廳預訂一張兩人桌。","d":"To retain for future use; a supply of something not needed for immediate use."},{"id":796,"l":3,"w":"resist","k":"rɪˋzɪst","p":"vt.vi.","c":"抵抗，反抗","es":"She couldn't resist eating another piece of cake.","cs":"她無法抗拒再吃一塊蛋糕。","d":"To withstand the action or effect of; to oppose."},{"id":797,"l":3,"w":"resource","k":"rɪˋsors","p":"n.","c":"資源；物力","es":"Water is a vital natural resource.","cs":"水是一種重要的自然資源。","d":"A stock or supply of money, materials, staff, or other assets that can be drawn on by a person or organization."},{"id":798,"l":3,"w":"respond","k":"rɪˋspɑnd","p":"vt.vi.","c":"作答，回答","es":"Please respond to the email as soon as possible.","cs":"請盡快回覆這封電子郵件。","d":"To say something in reply; to react."},{"id":799,"l":3,"w":"response","k":"rɪˋspɑns","p":"n.","c":"回答；答覆","es":"His immediate response to the offer was enthusiastic.","cs":"他對這個提議的即時反應是熱烈的。","d":"A verbal or written answer; a reaction to something."},{"id":800,"l":3,"w":"responsibility","k":"rɪˌspɑːnsəˈbɪləti","p":"n.","c":"責任","es":"It is your responsibility to complete the task on time.","cs":"準時完成這項任務是你的責任。","d":"The state or fact of having a duty to deal with something or of having control over someone."},{"id":801,"l":3,"w":"restrict","k":"rɪˋstrɪkt","p":"vt.","c":"限制；限定","es":"The new policy will restrict the use of company computers.","cs":"新政策將限制公司電腦的使用。","d":"To put a limit on."},{"id":802,"l":3,"w":"reveal","k":"rɪˋvil","p":"vt.vi.","c":"展現；暴露；洩露","es":"The report will reveal the truth behind the scandal.","cs":"這份報告將揭示醜聞背後的真相。","d":"To make (previously unknown or secret information) known."},{"id":803,"l":3,"w":"ribbon","k":"ˋrɪbən","p":"n.","c":"緞帶；絲帶","es":"She tied the gift with a pink satin ribbon.","cs":"她用粉紅色的緞帶繫住了禮物。","d":"A long, narrow strip of fabric, used for decoration or tying."},{"id":804,"l":3,"w":"rid","k":"rɪd","p":"vt.","c":"使免除；使擺脫","es":"We need to get rid of all this old furniture.","cs":"我們需要擺脫所有這些舊傢俱。","d":"To make free of a troublesome or unwanted person or thing."},{"id":805,"l":3,"w":"riddle","k":"ˋrɪd!","p":"n.","c":"謎，謎語","es":"Can you solve this difficult riddle?","cs":"你能解開這個困難的謎語嗎？","d":"A question or statement designed to get a surprising or clever answer; a puzzling person or thing."},{"id":806,"l":3,"w":"ripe","k":"raɪp","p":"adj.","c":"成熟的","es":"The tomatoes are perfectly ripe and ready to be picked.","cs":"這些番茄完全成熟了，可以採摘了。","d":"(Of fruit or grain) fully developed and ready to be collected or eaten."},{"id":807,"l":3,"w":"risk","k":"rɪsk","p":"n.vt.","c":"危險，風險；冒…的風險","es":"He took a huge risk by investing all his money.","cs":"他將所有的錢都投資進去，冒了巨大的風險。","d":"A situation involving exposure to danger; the possibility that something unwelcome will happen."},{"id":808,"l":3,"w":"roar","k":"ror","p":"n.vt.vi.","c":"吼叫","es":"We heard the roar of the lion from across the field.","cs":"我們聽到獅子從田野對面傳來的吼聲。","d":"A full, deep, prolonged sound, typically made by a large animal or a crowd."},{"id":809,"l":3,"w":"roast","k":"rost","p":"n.vt.vi.","c":"烤，炙，烘","es":"We decided to roast a chicken for Sunday dinner.","cs":"我們決定烤一隻雞作為週日晚餐。","d":"To cook (meat or vegetables) by prolonged exposure to heat in an oven or over a fire."},{"id":810,"l":3,"w":"rob","k":"rɑb","p":"vt.vi.","c":"搶劫，劫掠","es":"The thief planned to rob the bank late at night.","cs":"小偷計畫深夜搶劫銀行。","d":"To take property illegally from (a person or place) by force or threat of force."},{"id":811,"l":3,"w":"robber","k":"ˋrɑbɚ","p":"n.","c":"搶劫者，強盜","es":"The police are searching for the bank robber.","cs":"警方正在搜捕銀行搶劫犯。","d":"A person who robs (steals from) another person or place."},{"id":812,"l":3,"w":"robbery","k":"ˋrɑbərɪ","p":"n.","c":"搶劫；盜取","es":"The museum was closed after the jewel robbery.","cs":"珠寶搶劫案發生後，博物館被關閉了。",
