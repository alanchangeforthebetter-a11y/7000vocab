 large amounts of money, especially by governments or large companies."},{"id":1540,"l":4,"w":"financial","k":"fa ɪˋnæn ʃəl","p":"adj.","c":"財政的；金融的；金 融界的","es":"The company is in a stable financial position after a strong year.","cs":"經過強勁的一年後，該公司處於穩定的財政狀況。","d":"Relating to finance or money."},{"id":1541,"l":4,"w":"firecracker","k":"ˋfa ɪr͵kræk ɚ","p":"n.","c":"爆竹，鞭炮","es":"The loud sound of the firecrackers woke the baby.","cs":"鞭炮巨大的聲音吵醒了嬰兒。","d":"A small paper cylinder containing an explosive and a fuse, set off to make a loud noise."},{"id":1542,"l":4,"w":"fireplace","k":"ˋfa ɪr͵ples","p":"n.","c":"壁爐","es":"We sat in front of the warm fireplace on the cold winter night.","cs":"我們在寒冷的冬夜裡坐在溫暖的壁爐前。","d":"A part of a room where a fire is built."},{"id":1543,"l":4,"w":"flatter","k":"ˋflæt ɚ","p":"vt.","c":"諂媚；奉承","es":"He tried to flatter the teacher into giving him a better grade.","cs":"他試圖奉承老師，讓他給他一個更好的分數。","d":"To lavish praise and compliments on (someone), often insincerely."},{"id":1544,"l":4,"w":"flee","k":"fli","p":"vi.vt.","c":"逃，逃走","es":"The refugees had to flee their home country due to the war.","cs":"難民不得不因為戰爭而逃離他們的祖國。","d":"To run away from a place or situation of danger."},{"id":1545,"l":4,"w":"flexible","k":"ˋfl ɛksəb!","p":"adj.","c":"可彎曲的；有彈性的；可變通的","es":"The yoga instructor is incredibly flexible.","cs":"這位瑜伽教練令人難以置信地有彈性。","d":"Able to be easily modified or adapted; capable of bending without breaking."},{"id":1546,"l":4,"w":"fluent","k":"ˋflu ənt","p":"adj.","c":"流利的，流暢的","es":"She is completely fluent in three different languages.","cs":"她能完全流利地說三種不同的語言。","d":"Able to express oneself easily and articulately."},{"id":1547,"l":4,"w":"flunk","k":"fl ʌŋk","p":"vt.vi.","c":"使(某人 )不及格；通不過 (考試等 )","es":"He was worried he might flunk the difficult math exam.","cs":"他擔心他可能會不及格這場困難的數學考試。","d":"To fail to reach the required standard in (an examination or course of study)."},{"id":1548,"l":4,"w":"flush","k":"fl ʌʃ","p":"vi.vt.n.","c":"湧； (臉)發紅 ；用水沖洗；使 (臉 )漲紅；.沖洗；紅光","es":"She felt her face flush with embarrassment after she tripped.","cs":"她絆倒後，感到她的臉因尷尬而臉紅。","d":"To become red in the face; to cleanse (something) by a sudden flow of water."},{"id":1549,"l":4,"w":"foam","k":"fom","p":"n.vi.","c":"泡沫；滅火泡沫 ；起泡 沫","es":"The beer had a thick white layer of foam on top.","cs":"啤酒上面有一層厚厚的白色泡沫。","d":"A mass of small bubbles formed on or in liquid."},{"id":1550,"l":4,"w":"forbid","k":"f ɚˋbɪd","p":"vt.","c":"禁止，不許","es":"The rules forbid students from using mobile phones during class.","cs":"規則禁止學生在課堂上使用手機。","d":"To refuse to allow (something)."},{"id":1551,"l":4,"w":"forecast","k":"ˋfor͵kæst","p":"n.vt.vi.","c":"預測，預報","es":"The weather forecast predicts heavy snow for the weekend.","cs":"天氣預報預測週末將有大雪。","d":"A prediction or estimate of future events."},{"id":1552,"l":4,"w":"formation","k":"f ɔrˋmeʃən","p":"n.","c":"形成，構成；構成物；隊形","es":"The air force planes flew in a perfect V-shaped formation.","cs":"空軍飛機以完美的 V 形隊形飛行。","d":"The action of forming or process of being formed; a structure or arrangement."},{"id":1553,"l":4,"w":"formula","k":"ˋf ɔrmjələ","p":"n.","c":"慣用語；慣例；處方【數】公式【化】分子式","es":"The scientist developed a complex mathematical formula.","cs":"這位科學家開發了一個複雜的數學公式。","d":"A set of fixed rules or methods for doing something; a list of ingredients."},{"id":1554,"l":4,"w":"fort","k":"fort","p":"n.","c":"堡壘，要塞","es":"The soldiers were posted to a remote desert fort.","cs":"士兵們被派駐到一個偏遠的沙漠堡壘。","d":"A military post or structure designed to be defended."},{"id":1555,"l":4,"w":"fortunate","k":"ˋf ɔrtʃənɪt","p":"adj.","c":"幸運的，僥倖的","es":"We were fortunate to find a parking space so close to the stadium.","cs":"我們很幸運能在離體育場這麼近的地方找到停車位。","d":"Favored by or involving good luck."},{"id":1556,"l":4,"w":"fossil","k":"ˋf ɑs!","p":"n.","c":"化石；頑固不化的人","es":"They discovered a perfectly preserved dinosaur fossil in the desert.","cs":"他們在沙漠中發現了一個保存完好的恐龍化石。","d":"The remains or impression of a prehistoric organism preserved in petrified form or as a mold or cast in rock."},{"id":1557,"l":4,"w":"foundation","k":"fa ʊnˋdeʃən","p":"n.","c":"建立，創辦 ；基礎；基金會； (建築物的 )地基","es":"The charity relies entirely on private donations for its foundation.","cs":"該慈善機構完全依賴私人捐款作為其基礎。","d":"The lowest load-bearing part of a building; an underlying basis or principle."},{"id":1558,"l":4,"w":"founder","k":"ˋfa ʊndɚ","p":"n.","c":"創立者；奠基者","es":"He is the original founder of the successful tech company.","cs":"他是這家成功科技公司的原始創辦人。","d":"A person who establishes (an organization or settlement); to sink (a boat)."},{"id":1559,"l":4,"w":"fragrance","k":"ˋfregr əns","p":"n.","c":"芬芳；香味；香氣","es":"The garden was filled with the sweet fragrance of roses.","cs":"花園裡充滿了玫瑰甜美的香味。","d":"A pleasant or sweet smell."},{"id":1560,"l":4,"w":"fragrant","k":"ˋfregr ənt","p":"adj.","c":"香的，芳香的","es":"The newly baked bread was wonderfully fragrant.","cs":"新烤好的麵包聞起來非常芳香的。","d":"Having a pleasant or sweet smell."},{"id":1561,"l":4,"w":"frame","k":"frem","p":"n.","c":"架構，骨架；結構；框架， 框子","es":"I bought a beautiful wooden frame for the new painting.","cs":"我為這幅新畫買了一個漂亮的木製框。","d":"A strong border or structure that holds or supports something."},{"id":1562,"l":4,"w":"freeway","k":"ˋfr ɪ͵we","p":"n.","c":"【美】高速公路","es":"We took the fastest route, which was the main city freeway.","cs":"我們走了最快的路線，那就是主要城市高速公路。","d":"A major road intended for fast traffic and having limited access; a highway."},{"id":1563,"l":4,"w":"frequency","k":"ˋfrikw ənsɪ","p":"n.","c":"頻率，次數","es":"The frequency of train delays has increased recently.","cs":"火車延誤的頻率最近增加了。","d":"The rate at which something occurs or is repeated over a particular period."},{"id":1564,"l":4,"w":"freshman","k":"ˋfr ɛʃmən","p":"n.","c":"(大學等的 )一年級生；新人","es":"She is a college freshman and is still adjusting to campus life.","cs":"她是一名大學新生，仍在適應校園生活。","d":"A student in the first year of high school or college."},{"id":1565,"l":4,"w":"frost","k":"fr ɑst","p":"n.vt.vi.","c":"霜 ；結霜","es":"A thin layer of white frost covered the grass this morning.","cs":"今天早上，一層薄薄的白色霜覆蓋了草地。","d":"A thin layer of ice crystals on a surface."},{"id":1566,"l":4,"w":"frown","k":"fra ʊn","p":"vi.vt.n.","c":"皺眉；表示不滿","es":"She couldn't hide her frown when she heard the bad news.","cs":"當她聽到這個壞消息時，她無法隱藏她的皺眉。","d":"To furrow one's brow in an expression of displeasure or concentration."},{"id":1567,"l":4,"w":"frustration","k":"͵fr ʌsˋtreʃən","p":"n.","c":"挫折，失敗","es":"He shouted in frustration when his computer crashed again.","cs":"當他的電腦再次崩潰時，他因挫敗而大喊。","d":"The feeling of being upset or annoyed as a result of being unable to change or achieve something."},{"id":1568,"l":4,"w":"fuel","k":"ˋfj ʊəl","p":"n.vt.vi.","c":"燃料 ；對…供給燃料；激 起；刺激","es":"The car needs more fuel to make the long journey.","cs":"汽車需要更多燃料才能完成這段長途旅程。","d":"Material such as coal, wood, or oil that is burned to produce heat or power."},{"id":1569,"l":4,"w":"fulfill","k":"f ʊlˋfɪl","p":"vt.","c":"執行 (命令 )；履行 (諾言)；完成 (任務 )；實現","es":"He was happy to finally fulfill his lifelong dream of traveling the world.","cs":"他很高興最終實現了他環遊世界的畢生夢想。","d":"To bring to completion or reality; to satisfy (a requirement or condition)."},{"id":1570,"l":4,"w":"fulfillment","k":"f ʊlˋfɪlmənt","p":"n.","c":"完成，履行；實現","es":"Achieving her degree brought her a great sense of fulfillment.","cs":"獲得學位給她帶來了巨大的成就感。","d":"The achievement of something desired, promised, or predicted."},{"id":1571,"l":4,"w":"functional","k":"ˋf ʌŋkʃən!","p":"adj.","c":"機能的","es":"The old phone is no longer stylish, but it is still fully functional.","cs":"這款舊手機不再時尚，但它仍然完全可使用的。","d":"Designed to be practical and useful rather than attractive; relating to the way something works."},{"id":1572,"l":4,"w":"fundamental","k":"͵f ʌndəˋmɛnt!","p":"adj.","c":"基礎的；根本 的","es":"Respect for human life is a fundamental principle of our society.","cs":"尊重人類生命是我們社會的一個基本原則。","d":"Forming a necessary base or core; of central importance."},{"id":1573,"l":4,"w":"funeral","k":"ˋfjun ərəl","p":"n.","c":"葬禮；葬儀","es":"The entire family gathered to attend the grandmother's funeral.","cs":"全家人聚集在一起參加祖母的葬禮。","d":"A ceremony or service held shortly after a person's death."},{"id":1574,"l":4,"w":"furious","k":"ˋfj ʊərɪəs","p":"adj.","c":"狂怒的；狂暴的，猛烈 的","es":"She was absolutely furious when she found out she had been lied to.","cs":"當她發現自己被騙時，她簡直非常憤怒。","d":"Extremely angry."},{"id":1575,"l":4,"w":"furnish","k":"ˋf ɝnɪʃ","p":"vt.","c":"給(房間 )配置 (傢俱等 )；裝 備；供應","es":"The apartment is currently empty, but we will furnish it with new items.","cs":"這間公寓目前是空的，但我們將用新物品佈置它。","d":"To provide (a house or room) with furniture and fittings."},{"id":1576,"l":4,"w":"furthermore","k":"ˋf ɝðɚˋmor","p":"advt.","c":"而且，此外","es":"It was too late to go, and furthermore, I didn't have the money.","cs":"現在去太晚了，此外，我也沒有錢。","d":"In addition; besides."},{"id":1577,"l":4,"w":"gallery","k":"ˋgæl ərɪ","p":"n.","c":"畫廊，美術館","es":"The art gallery is hosting a new exhibition of modern paintings.","cs":"藝術畫廊正在舉辦一個現代繪畫的新展覽。","d":"A room or building for the display of works of art; a balcony."},{"id":1578,"l":4,"w":"gangster","k":"ˋgæŋst ɚ","p":"n.","c":"(結成團伙的 )歹徒，匪 盜,流氓","es":"The movie tells the story of a famous Chicago gangster.","cs":"這部電影講述了一個著名的芝加哥歹徒的故事。","d":"A member of a gang of violent criminals."},{"id":1579,"l":4,"w":"gaze","k":"gez","p":"vi.n.","c":"凝視，注視，盯","es":"He held her hand and simply gazed into her eyes.","cs":"他握著她的手，只是靜靜地凝視著她的眼睛。","d":"To look steadily and intently at something."},{"id":1580,"l":4,"w":"gear","k":"g ɪr","p":"n.","c":"齒輪；傳動裝置； (汽車 )排檔；工具；設備，裝置","es":"The car struggled to climb the hill even in first gear.","cs":"汽車即使在一檔也很難爬上這座山。","d":"A set of rotating machine parts that transmit power or motion; equipment."},{"id":1581,"l":4,"w":"gene","k":"d ʒin","p":"n.","c":"【生】基因，遺傳因子","es":"Scientists have identified the gene responsible for the disease.","cs":"科學家已經確定了導致這種疾病的基因。","d":"A unit of heredity that is transferred from a parent to offspring."},{"id":1582,"l":4,"w":"generation","k":"͵d ʒɛnəˋreʃən","p":"n.","c":"世代，一代；產 生,發生","es":"The younger generation uses technology more often than their parents.","cs":"年輕一代比他們的父母更常使用科技。","d":"All of the people born and living at about the same time; a stage in a family's history."},{"id":1583,"l":4,"w":"generosity","k":"͵d ʒɛnəˋrɑsətɪ","p":"n.","c":"寬宏大量；慷慨","es":"His unexpected act of generosity helped the family through a tough time.","cs":"他出人意料的慷慨行為幫助這個家庭度過了難關。","d":"The quality of being kind and giving to others."},{"id":1584,"l":4,"w":"genius","k":"ˋdʒinjəs","p":"n.","c":"天資，天賦 ；天才， 英才","es":"Albert Einstein is considered one of the greatest geniuses of the 20th century.","cs":"阿爾伯特·愛因斯坦被認為是 20 世紀最偉大的天才之一。","d":"Exceptional intellectual or creative power or natural ability."},{"id":1585,"l":4,"w":"genuine","k":"ˋd ʒɛnjʊɪn","p":"adj.","c":"真的，非偽造的；真誠 的","es":"The painting is a genuine Picasso, confirmed by experts.","cs":"這幅畫是真正的畢卡索作品，已得到專家證實。","d":"Truly what something is said to be; authentic."},{"id":1586,"l":4,"w":"germ","k":"d ʒɝm","p":"n.","c":"細菌；微生物","es":"Handwashing is the best way to prevent the spread of germs.","cs":"洗手是防止細菌傳播的最佳方式。","d":"A microorganism, especially one that causes disease; a small mass of living substance capable of developing into an organism."},{"id":1587,"l":4,"w":"gifted","k":"ˋg ɪftɪd","p":"adj.","c":"有天資的，有天賦的","es":"She is a gifted musician who started playing piano at age three.","cs":"她是一位有天賦的音樂家，三歲就開始彈鋼琴。","d":"Having exceptional talent or natural ability."},{"id":1588,"l":4,"w":"gigantic","k":"d ʒaɪˋgænt ɪk","p":"adj.","c":"巨大的；巨人的","es":"The construction company is building a gigantic new skyscraper.","cs":"這家建築公司正在建造一棟巨大的新摩天大樓。","d":"Extremely large."},{"id":1589,"l":4,"w":"giggle","k":"ˋg ɪg!","p":"n.vi.","c":"咯咯地笑；傻笑","es":"The two girls tried to suppress a giggle during the serious lecture.","cs":"這兩個女孩在嚴肅的演講中試圖壓抑住咯咯的笑聲。","d":"To laugh lightly and repeatedly in a nervous or silly way."},{"id":1590,"l":4,"w":"ginger","k":"ˋd ʒɪndʒɚ","p":"n.","c":"薑； 【口】精力，活力","es":"I like to add fresh grated ginger to my stir-fry.","cs":"我喜歡在我的炒菜中加入新鮮磨碎的薑。","d":"A hot, fragrant spice made from the root of a plant."},{"id":1591,"l":4,"w":"glide","k":"gla ɪd","p":"n.vt.vi.","c":"滑動，滑行","es":"The ice skater seemed to glide effortlessly across the rink.","cs":"這位溜冰者似乎毫不費力地在溜冰場上滑行。","d":"To move with a smooth, continuous motion."},{"id":1592,"l":4,"w":"glimpse","k":"gl ɪmps","p":"n.vi.vt.","c":"瞥見；一瞥","es":"I only caught a brief glimpse of the celebrity before he rushed away.","cs":"在這位名人匆忙離開之前，我只瞥見了他一眼。","d":"A brief or momentary view."},{"id":1593,"l":4,"w":"globe","k":"glob","p":"n.","c":"球；球狀物；地球儀","es":"The children learned about different countries by looking at the globe.","cs":"孩子們通過看地球儀來了解不同的國家。","d":"The earth; a spherical model of the earth."},{"id":1594,"l":4,"w":"glorious","k":"ˋglor ɪəs","p":"adj.","c":"光榮的，榮耀的","es":"They celebrated their team's glorious victory in the final game.","cs":"他們慶祝他們的隊伍在決賽中的光榮勝利。","d":"Having or deserving great fame or admiration; magnificent."},{"id":1595,"l":4,"w":"goods","k":"g ʊdz","p":"n.","c":"商品；貨物","es":"The factory produces high-quality consumer goods.","cs":"這家工廠生產高品質的消費商品。","d":"Merchandise or possessions."},{"id":1596,"l":4,"w":"grace","k":"gres","p":"n.","c":"優美；優雅；感恩祈禱 ；(神的 ) 恩典","es":"The ballet dancer moved with incredible grace and elegance.","cs":"這位芭蕾舞者以令人難以置信的優雅和優美移動。","d":"Elegance and smoothness of movement; courteous goodwill."},{"id":1597,"l":4,"w":"graceful","k":"ˋgresf əl","p":"adj.","c":"優美的，雅緻的","es":"The swan is one of the most graceful birds on the lake.","cs":"天鵝是湖上最優雅的鳥類之一。","d":"Having or showing grace or elegance."},{"id":1598,"l":4,"w":"gracious","k":"ˈɡreɪʃəs","p":"adj.","c":"親切的；和藹的；慈祥 的","es":"She was a gracious host, making sure everyone felt comfortable.","cs":"她是一位親切的主人，確保每個人都感到舒適。","d":"Courteous, kind, and pleasant."},{"id":1599,"l":4,"w":"graduation","k":"͵græd ʒʊˋeʃən","p":"n.","c":"畢業 ；畢業典 禮","es":"She invited all her family to attend her college graduation ceremony.","cs":"她邀請了她所有的家人參加她的大學畢業典禮。","d":"The action of receiving or conferring an academic degree or diploma."},{"id":1600,"l":4,"w":"grammar","k":"ˋgræm ɚ","p":"n.","c":"文法","es":"You need to improve your English grammar to write better essays.","cs":"您需要改進您的英語文法才能寫出更好的文章。","d":"The whole system and structure of a language."},{"id":1601,"l":4,"w":"grammatical","k":"gr əˋmæt ɪk!","p":"adj.","c":"文法的；文法正 確的","es":"The sentence has a clear grammatical error in the verb tense.","cs":"這個句子在動詞時態上有一個明顯的文法錯誤。","d":"Conforming to the rules of grammar."},{"id":1602,"l":4,"w":"grapefruit","k":"ˋgrep͵frut","p":"n.","c":"葡萄柚","es":"I like to eat half a grapefruit for breakfast.","cs":"我喜歡早餐吃半個葡萄柚。","d":"A large, round, yellow citrus fruit with an acidic flavor."},{"id":1603,"l":4,"w":"grateful","k":"ˋgretf əl","p":"adj.","c":"感謝的，感激的","es":"I am sincerely grateful for all your support over the years.","cs":"我真誠地感激這些年來您所有的支持。","d":"Feeling or showing an appreciation for something received or done."},{"id":1604,"l":4,"w":"gratitude","k":"ˋgræt ə͵tjud","p":"n.","c":"感恩，感謝","es":"He expressed his gratitude to the rescue team for saving his life.","cs":"他對救援隊救了他的命表達了他的感激之情。","d":"The quality of being thankful; readiness to show appreciation."},{"id":1605,"l":4,"w":"grave1","k":"grev","p":"n.","c":"墓穴；埋葬處","es":"The soldier's remains were buried in a simple white grave.","cs":"這位士兵的遺體被安葬在一個簡單的白色墳墓裡。","d":"A place of burial for a dead body."},{"id":1606,"l":4,"w":"grave2","k":"grev","p":"adj.","c":"重大的；嚴重的；嚴肅的， 認真的","es":"The matter is extremely grave, and we must treat it seriously.","cs":"這件事非常嚴重的，我們必須認真對待。","d":"Giving cause for alarm; serious."},{"id":1607,"l":4,"w":"greasy","k":"ˋgriz ɪ","p":"adj.","c":"油汙的，油膩的；油滑的","es":"The burger was too greasy for me to finish.","cs":"這個漢堡對我來說太油膩了，我吃不完。","d":"Covered with, soaked in, or containing grease or oil."},{"id":1608,"l":4,"w":"greeting(s)","k":"ˋgrit ɪŋ","p":"n.","c":"問候，招呼； (生日等 的)祝願詞","es":"She sent her warm greetings to her family overseas.","cs":"她向她在海外的家人送去了溫暖的問候。","d":"A polite word or sign of welcome or recognition."},{"id":1609,"l":4,"w":"grief","k":"grif","p":"n.","c":"悲痛，悲傷","es":"The community shared the family's deep grief after the loss.","cs":"在失去親人後，社區分享了這個家庭深切的悲傷。","d":"Intense sorrow, especially caused by someone's death."},{"id":1610,"l":4,"w":"grieve","k":"griv","p":"vt.vi.","c":"( 使)悲傷； (使)苦惱","es":"The entire nation seemed to grieve the loss of the beloved leader.","cs":"整個國家似乎都在哀悼這位敬愛領袖的逝去。","d":"To feel intense sorrow or distress."},{"id":1611,"l":4,"w":"grind","k":"gra ɪnd","p":"vt.vi.","c":"磨(碎)；碾 (碎)","es":"She used a mortar and pestle to grind the spices into a fine powder.","cs":"她使用研缽和研杵將香料磨碎成細粉。","d":"To reduce (something) to small particles or powder by crushing it."},{"id":1612,"l":4,"w":"guarantee","k":"gæ r ənˋti","p":"n.vt.","c":"保證；商品保證；保 證書；保證；擔保","es":"The washing machine comes with a two-year guarantee against defects.","cs":"這台洗衣機提供兩年的缺陷保證。","d":"A formal promise or assurance that certain conditions will be fulfilled."},{"id":1613,"l":4,"w":"guilt","k":"g ɪlt","p":"n.","c":"有罪；犯罪；過失；內疚","es":"He felt a pang of guilt for lying to his best friend.","cs":"他因對他最好的朋友說謊而感到一陣內疚。","d":"The fact of having committed a specified or implied offense or crime."},{"id":1614,"l":4,"w":"guilty","k":"ˋg ɪltɪ","p":"adj.","c":"有罪的，犯 …罪的","es":"The jury found the defendant guilty on all charges.","cs":"陪審團裁定被告所有指控都有罪。","d":"Culpable of or responsible for a specified wrongdoing."},{"id":1615,"l":4,"w":"gulf","k":"g ʌlf","p":"n.","c":"海灣","es":"The country exports oil across the Persian Gulf.","cs":"這個國家透過波斯灣出口石油。","d":"A deep inlet of the sea almost surrounded by land, with a narrow mouth."},{"id":1616,"l":4,"w":"habitual","k":"h əˋbɪtʃʊəl","p":"adj.","c":"習慣的，習以為常的","es":"His habitual lateness for meetings became a problem.","cs":"他習慣性地開會遲到成為一個問題。","d":"Done or doing constantly or repeatedly."},{"id":1617,"l":4,"w":"halt","k":"h ɔlt","p":"n.vt.vi.","c":"暫停，停止；終止","es":"The police officer ordered the speeding car to come to a halt.","cs":"警察命令超速的汽車立即停止。","d":"To stop; a pause or brief stop."},{"id":1618,"l":4,"w":"handwriting","k":"ˋhænd͵ra ɪtɪŋ","p":"n.","c":"筆跡；書寫；手 寫","es":"Her elegant handwriting was very difficult to read.","cs":"她優雅的筆跡非常難以閱讀。","d":"Writing with a pen or pencil; a person's style of script."},{"id":1619,"l":4,"w":"harden","k":"ˋh ɑrdn","p":"vt.vi.","c":"( 使)變硬； (使)變堅固","es":"The melted plastic began to harden as it cooled down.","cs":"融化的塑膠在冷卻下來後開始變硬。","d":"To make or become hard or harder."},{"id":1620,"l":4,"w":"hardship","k":"ˋh ɑrdʃɪp","p":"n.","c":"艱難，困苦","es":"The pioneers faced great hardships settling the new territory.","cs":"先驅者在開拓新領土時面臨巨大的艱難。","d":"Severe suffering or privation."},{"id":1621,"l":4,"w":"hardware","k":"ˋh ɑrd͵w ɛr","p":"n.","c":"金屬器件，五金器 具；【電腦】硬體","es":"I need to buy some new computer hardware, like a better mouse.","cs":"我需要購買一些新的電腦硬體，比如一個更好的滑鼠。","d":"Tools, equipment, and other durable items; the mechanical, magnetic, and electronic devices composing a computer system."},{"id":1622,"l":4,"w":"harmonica","k":"h ɑrˋmɑnɪkə","p":"n.","c":"口琴","es":"The cowboy sat by the fire, playing a tune on his harmonica.","cs":"這位牛仔坐在火堆旁，吹奏著他的口琴。","d":"A small rectangular musical instrument played by breathing in and out through a row of holes."},{"id":1623,"l":4,"w":"harmony","k":"ˋh ɑrmənɪ","p":"n.","c":"和睦；和諧；和聲","es":"The couple lives in perfect harmony with their quiet neighbors.","cs":"這對夫婦與他們安靜的鄰居和睦相處。","d":"The agreement or concord between people or sounds; pleasing arrangement of parts."},{"id":1624,"l":4,"w":"harsh","k":"h ɑrʃ","p":"adj.","c":"粗糙的；刺耳的；澀口的；刺 鼻的","es":"The desert climate is very harsh and unforgiving.","cs":"沙漠氣候非常嚴酷和不饒人。","d":"Unpleasantly rough or jarring to the senses; cruel or severe."},{"id":1625,"l":4,"w":"haste","k":"hest","p":"n.","c":"急忙，迅速","es":"The decision was made in such haste that it was bound to fail.","cs":"這個決定是在如此倉促的情況下做出的，注定會失敗。","d":"Excessive speed of movement or action; hurry."},{"id":1626,"l":4,"w":"hasten","k":"ˋhesn","p":"vt.vi.","c":"催促；加速","es":"The approaching storm will hasten our departure from the beach.","cs":"即將到來的暴風雨將加速我們離開海灘。","d":"To be quick to do something; to cause to happen sooner."},{"id":1627,"l":4,"w":"hatred","k":"ˋhetr ɪd","p":"n.","c":"憎恨，增惡；敵意","es":"The war was fueled by years of mutual hatred between the two groups.","cs":"這場戰爭是由兩群人多年來的相互仇恨所助長。","d":"Intense dislike or ill will."},{"id":1628,"l":4,"w":"headphone(s)","k":"ˋh ɛd͵fon","p":"n.","c":"頭戴式耳機","es":"I listen to music through my noise-canceling headphones on the bus.","cs":"我在公車上透過我的降噪耳機聽音樂。","d":"A device worn over the ears to listen to audio."},{"id":1629,"l":4,"w":"healthful","k":"ˋh ɛlθfəl","p":"adj.","c":"有益於健康的","es":"Eating a lot of fresh fruits and vegetables is very healthful.","cs":"吃大量新鮮水果和蔬菜是非常有益健康的。","d":"Conducive to good health; healthy."},{"id":1630,"l":4,"w":"helicopter","k":"ˋh ɛlɪkɑptɚ","p":"n.","c":"直升機","es":"The rescue team arrived at the remote location by helicopter.","cs":"救援隊乘坐直升機到達了偏遠地區。","d":"A type of aircraft that obtains lift from horizontally revolving overhead blades."},{"id":1631,"l":4,"w":"herd","k":"h ɝd","p":"n.","c":"畜群；牧群","es":"The farmer used his dog to move the herd of sheep to a new field.","cs":"農夫用他的狗將一群綿羊趕到一個新的田地。","d":"A large group of animals, especially hoofed mammals, that live together."},{"id":1632,"l":4,"w":"hesitation","k":"͵h ɛzəˋteʃən","p":"n.","c":"躊躇，猶豫","es":"After a brief hesitation, she accepted the job offer.","cs":"經過短暫的猶豫，她接受了這份工作。","d":"The action of pausing before saying or doing something."},{"id":1633,"l":4,"w":"highly","k":"ˋha ɪlɪ","p":"advt.","c":"非常，很，高度地","es":"The critics highly praised the director's latest film.","cs":"評論家們高度讚揚了這位導演的最新電影。","d":"To a high degree; greatly."},{"id":1634,"l":4,"w":"homeland","k":"ˋhom͵lænd","p":"n.","c":"祖國；故國；家鄉","es":"The immigrants often felt homesick for their distant homeland.","cs":"這些移民經常對他們遙遠的祖國感到思鄉。","d":"A person's native land."},{"id":1635,"l":4,"w":"honeymoon","k":"ˋh ʌnɪ͵mun","p":"n.","c":"蜜月 (假期、旅行 )","es":"They spent their two-week honeymoon backpacking across Europe.","cs":"他們花了兩個星期的蜜月在歐洲背包旅行。","d":"A vacation taken by a newly married couple."},{"id":1636,"l":4,"w":"honorable","k":"ˋ ɑnərəb!","p":"adj.","c":"可尊敬的；高尚的；光榮的","es":"It was an honorable gesture to admit his mistake publicly.","cs":"公開承認他的錯誤是一個光榮的舉動。","d":"Worthy of honor and respect."},{"id":1637,"l":4,"w":"hook","k":"h ʊk","p":"n.","c":"鉤，掛鉤，魚鉤；鉤拳；鉤射","es":"She hung her jacket on the metal hook behind the door.","cs":"她將她的夾克掛在門後的金屬掛鉤上。","d":"A piece of metal or other material bent or curved and used to catch, hold, or pull something."},{"id":1638,"l":4,"w":"hopeful","k":"ˋhopf əl","p":"adj.","c":"有希望的；有前途的","es":"We are hopeful that a solution will be found soon.","cs":"我們對很快能找到解決方案感到有希望的。","d":"Feeling or inspiring optimism about a future event."},{"id":1639,"l":4,"w":"horizon","k":"h əˋraɪzn","p":"n.","c":"地平線；眼界；(知識、經驗的 )範圍","es":"The sun set slowly below the horizon, painting the sky orange.","cs":"太陽緩緩地落到地平線下，將天空染成橙色。","d":"The line where the earth's surface and the sky appear to meet."},{"id":1640,"l":4,"w":"horrify","k":"ˋh ɔrə͵faɪ","p":"vt.","c":"使恐懼，使驚懼","es":"The news report of the accident seemed to horrify everyone.","cs":"關於事故的新聞報導似乎使每個人都感到驚恐。","d":"To fill with horror or dread."},{"id":1641,"l":4,"w":"hose","k":"hoz","p":"n.","c":"軟管； (軟)水管","es":"He used a garden hose to water the newly planted flowers.","cs":"他使用花園軟管給新種植的花澆水。","d":"A flexible tube for conveying water."},{"id":1642,"l":4,"w":"host","k":"host","p":"n.vt.","c":"主人；節目 主持人；【生】宿主 ；主辦，主持","es":"The famous actor will host the awards ceremony this year.","cs":"這位著名演員將主持今年的頒獎典禮。","d":"A person who receives or entertains guests; an organism on which a parasite lives."},{"id":1643,"l":4,"w":"hostel","k":"ˋh ɑst!","p":"n.","c":"(青年 )旅舍","es":"We stayed in a cheap youth hostel during our trip to Berlin.","cs":"我們在柏林的旅行期間住在一間便宜的青年旅館。","d":"An establishment providing cheap food and lodging for a specific group (e.g., students or travelers)."},{"id":1644,"l":4,"w":"household","k":"ˋha ʊs͵hold","p":"n.","c":"一家人；家眷；家 庭","es":"The average household size in the city is three people.","cs":"該市的平均家庭規模是三個人。","d":"A house and its occupants regarded as a unit."},{"id":1645,"l":4,"w":"housewife","k":"ˋha ʊs͵wa ɪf","p":"n.","c":"家庭主婦","es":"She decided to become a housewife and dedicate her time to her children.","cs":"她決定成為一名家庭主婦，並將時間奉獻給她的孩子們。","d":"A married woman whose main occupation is managing her household."},{"id":1646,"l":4,"w":"housework","k":"ˋha ʊs͵wɝk","p":"n.","c":"家事","es":"He helps his wife with the housework every weekend.","cs":"他每週末都會幫助他的妻子做家務。","d":"Cleaning, cooking, and other tasks done in a home."},{"id":1647,"l":4,"w":"humanity","k":"hjuˋmæn ətɪ","p":"n.","c":"人性；人道； (總稱 ) 人；人類；人文學科","es":"We must not lose our sense of humanity in the face of conflict.","cs":"面對衝突，我們絕不能失去我們人性的感覺。","d":"The human race; the quality of being humane."},{"id":1648,"l":4,"w":"humidity","k":"hjuˋm ɪdətɪ","p":"n.","c":"濕氣，濕度","es":"The high humidity made the summer day feel even hotter.","cs":"高濕度讓這個夏日感覺更熱。","d":"The amount of water vapor in the air."},{"id":1649,"l":4,"w":"hurricane","k":"ˋh ɝɪ͵ken","p":"n.","c":"颶風，暴風雨","es":"The coast was devastated by a category 5 hurricane.","cs":"海岸被一場五級颶風摧毀。","d":"A storm with a violent wind, in particular a tropical cyclone."},{"id":1650,"l":4,"w":"hydrogen","k":"ˋha ɪdrədʒən","p":"n.","c":"【化】氫","es":"Water is a compound made of oxygen and hydrogen.","cs":"水是一種由氧和氫組成的化合物。","d":"A colorless, odorless, highly flammable gaseous element."},{"id":1651,"l":4,"w":"iceberg","k":"ˋa ɪs͵bɝg","p":"n.","c":"冰山；冷峻的人","es":"Only the tip of the iceberg was visible above the water.","cs":"只有冰山的一角在水面上可見。","d":"A large mass of ice floating in the sea."},{"id":1652,"l":4,"w":"identical","k":"a ɪˋdɛntɪk!","p":"adj.","c":"同一的；完全相同的； (雙胞 )同卵的","es":"The twins wore identical dresses to the party.","cs":"這對雙胞胎穿著一模一樣的裙子去參加派對。","d":"Exactly the same."},{"id":1653,"l":4,"w":"identification/ID","k":"a ɪ͵dɛntəfəˋkeʃən","p":"n.","c":"認出；識別；身分證明；身分證","es":"Please present your photo ID card at the security desk.","cs":"請在安全櫃台出示您的帶照片身分證。","d":"The action of identifying someone or something; a document proving one's identity."},{"id":1654,"l":4,"w":"identify","k":"a ɪˋdɛntə͵faɪ","p":"vt.vi.","c":"確認；識別；認 同…","es":"Scientists were unable to identify the mysterious plant species.","cs":"科學家無法識別這種神秘的植物物種。","d":"To establish or indicate who or what (someone or something) is."},{"id":1655,"l":4,"w":"idiom","k":"ˋɪdɪəm","p":"n.","c":"慣用語；成語","es":"\"Break a leg\" is a common English idiom meaning \"good luck.\"","cs":"「Break a leg」是一個常見的英語慣用語，意思是「祝好運」。","d":"A group of words established by usage as having a meaning not deducible from those of the individual words (e.g., over the moon)."},{"id":1656,"l":4,"w":"idle","k":"ˋa ɪd!","p":"adj.","c":"閒置的；空閒的；懶惰的；無 所事事的","es":"The factory's machines have been idle for over a month due to low demand.","cs":"由於需求低迷，這家工廠的機器已經閒置了一個多月。","d":"Avoiding work; lazy; not in use."},{"id":1657,"l":4,"w":"idol","k":"ˋa ɪd!","p":"n.","c":"偶像；受崇拜之人 (或物 )","es":"The young girl treated the famous pop star as her personal idol.","cs":"這位年輕女孩將這位著名流行歌星視為她的個人偶像。","d":"An image or representation of a god used as an object of worship; a person or thing greatly admired."},{"id":1658,"l":4,"w":"ignorant","k":"ˋ ɪgnərənt","p":"adj.","c":"無知的，不學無術的；不知道的","es":"Many people remain ignorant of the dangers of climate change.","cs":"許多人對氣候變化的危險仍然無知的。","d":"Lacking knowledge or awareness in general."},{"id":1659,"l":4,"w":"illustrate","k":"ˋ ɪləstret","p":"vt.","c":"(用圖，實例等 )說明， 闡明","es":"The teacher used charts and diagrams to illustrate the complex process.","cs":"老師使用圖表和圖解來說明複雜的過程。","d":"To provide (a book, newspaper, etc.) with pictures; to serve as an example of."},{"id":1660,"l":4,"w":"illustration","k":"ɪ͵lʌsˋtreʃən","p":"n.","c":"說明，圖示 ；實例；插圖","es":"The book features a beautiful illustration of a mythical creature.","cs":"這本書以一幅美麗的神話生物插圖為特色。","d":"A picture or drawing illustrating a book; an example clarifying a statement."},{"id":1661,"l":4,"w":"imaginable","k":"ɪˋmæd ʒɪnəb!","p":"adj.","c":"可想像得到的","es":"They tried every imaginable solution to the difficult problem.","cs":"他們嘗試了所有可想像的解決方案來解決這個難題。","d":"Possible to imagine or conceive."},{"id":1662,"l":4,"w":"imaginary","k":"ɪˋmæd ʒə͵nɛrɪ","p":"adj.","c":"想像中的；虛構 的","es":"The child had a funny imaginary friend named \"Bubble.\"","cs":"這個孩子有一個名叫「泡泡」的有趣想像中的朋友。","d":"Existing only in the imagination; not real."},{"id":1663,"l":4,"w":"imaginative","k":"ɪˋmæd ʒə͵netɪv","p":"adj.","c":"有想像力的","es":"She is a highly imaginative writer of science fiction.","cs":"她是一位極具想像力的科幻小說作家。","d":"Having or showing creativity or inventiveness."},{"id":1664,"l":4,"w":"imitate","k":"ˋ ɪmə͵tet","p":"vt.","c":"模仿","es":"Birds learn to sing by imitating the calls of older birds.","cs":"鳥類通過模仿老鳥的叫聲來學習唱歌。","d":"To copy (a person's speech or behavior)."},{"id":1665,"l":4,"w":"imitation","k":"͵ ɪməˋteʃən","p":"n.","c":"模仿，模擬 ；仿製品；贗品","es":"The diamond necklace turned out to be a cheap imitation.","cs":"這條鑽石項鍊結果是廉價的仿製品。","d":"A thing intended to simulate or copy something else."},{"id":1666,"l":4,"w":"immigrant","k":"ˋ ɪməgrənt","p":"n.adj.","c":"(外來 )移民，僑民 ；移入的","es":"The city has a large and diverse population of immigrants.","cs":"這座城市擁有大量且多樣化的移民人口。","d":"A person who comes to live permanently in a foreign country."},{"id":1667,"l":4,"w":"immigrate","k":"ˋ ɪmə͵gret","p":"vi.","c":"遷移；遷入","es":"My grandparents decided to immigrate to Canada in 1950.","cs":"我的祖父母決定在 1950 年移民到加拿大。","d":"To come to live permanently in a foreign country."},{"id":1668,"l":4,"w":"immigration","k":"͵ ɪməˋgreʃən","p":"n.","c":"移居；【美】 (總稱 )(外來的 )移民","es":"The government introduced stricter immigration laws last year.","cs":"政府去年引入了更嚴格的移民法。","d":"The action of coming to live permanently in a foreign country."},{"id":1669,"l":4,"w":"impact","k":"ˈɪmpækt","p":"vt.vi.n.","c":"衝擊，撞擊 ；衝擊，撞擊，碰撞","es":"The new policy will have a significant impact on small businesses.","cs":"這項新政策將對小型企業產生重大衝擊（影響）。","d":"The action of one object coming forcibly into contact with another; or a marked effect or influence."},{"id":1670,"l":4,"w":"imply","k":"ɪmˋpla ɪ","p":"vt.","c":"暗指；暗示","es":"His silence seemed to imply that he disagreed with the decision.","cs":"他的沉默似乎暗示他不同意這個決定。","d":"To strongly suggest the truth or existence of (something not expressly stated)."},{"id":1671,"l":4,"w":"impression","k":"ɪmˋpr ɛʃən","p":"n.","c":"印象","es":"The new manager made a positive first impression on the staff.","cs":"新經理給員工留下了積極的第一印象。","d":"An idea, feeling, or opinion about something or someone, especially one formed without conscious thought."},{"id":1672,"l":4,"w":"incident","k":"ˋ ɪnsədnt","p":"n.","c":"事件；事變 ；插曲","es":"The police are investigating a minor security incident at the bank.","cs":"警方正在調查銀行發生的一起輕微的安全事件。","d":"An event or occurrence."},{"id":1673,"l":4,"w":"including","k":"ɪnˋklud ɪŋ","p":"prep.","c":"包括；包含","es":"The price covers all expenses, including flights and accommodation.","cs":"價格涵蓋所有費用，包括機票和住宿。","d":"Comprising or containing as part of a whole."},{"id":1674,"l":4,"w":"indication","k":"͵ ɪndəˋkeʃən","p":"n.","c":"指示； 指點 ；徵兆；跡象","es":"A rising temperature is a strong indication of a fever.","cs":"體溫升高是發燒的一個強烈跡象。","d":"A sign or piece of information that suggests something."},{"id":1675,"l":4,"w":"industrialize","k":"ɪnˋdʌstrɪəl͵aɪz","p":"vt.vi.","c":"(使)工業化","es":"The government plans to rapidly industrialize the agricultural sector.","cs":"政府計畫迅速工業化農業部門。","d":"To develop industries in (a country or region) on a wide scale."},{"id":1676,"l":4,"w":"infant","k":"ˋ ɪnfənt","p":"n.","c":"嬰兒","es":"The hospital has a special ward for caring for premature infants.","cs":"醫院有一個專門照顧早產嬰兒的病房。","d":"A very young child or baby."},{"id":1677,"l":4,"w":"infect","k":"ɪnˋfɛkt","p":"vt.","c":"【醫】傳染；感染","es":"Be careful not to infect the wound with dirty hands.","cs":"小心不要用髒手感染傷口。","d":"To contaminate (a person or part of the body) with a disease."},{"id":1678,"l":4,"w":"infection","k":"ɪnˋfɛkʃən","p":"n.","c":"傳染；侵染","es":"She was hospitalized due to a severe chest infection.","cs":"她因嚴重的胸部感染而住院。","d":"The process of infecting or the state of being infected with a disease."},{"id":1679,"l":4,"w":"inflation","k":"ɪnˋfle ʃən","p":"n.","c":"通貨膨脹 ；充氣；膨脹","es":"High inflation is causing the price of basic goods to increase dramatically.","cs":"高通貨膨脹正導致基本商品的價格急劇上漲。","d":"A general increase in prices and fall in the purchasing value of money."},{"id":1680,"l":4,"w":"influential","k":"͵ ɪnflʊˋɛnʃəl","p":"adj.","c":"有影響力的；有權 勢的","es":"She is one of the most influential figures in modern technology.","cs":"她是現代科技界最具影響力的人物之一。","d":"Having great influence on someone or something."},{"id":1681,"l":4,"w":"information","k":"͵ ɪnfɚˋmeʃən","p":"n.","c":"消息；情報；資訊 ；詢問處","es":"Please provide all the necessary personal information on the form.","cs":"請在表格上提供所有必要的個人資訊。","d":"Facts provided or learned about something or someone."},{"id":1682,"l":4,"w":"informative","k":"ɪnˋfɔrmətɪv","p":"adj.","c":"教育性的；見聞 廣博的","es":"The documentary was highly informative and easy to follow.","cs":"這部紀錄片非常有教育意義且易於理解。","d":"Providing useful or interesting information."},{"id":1683,"l":4,"w":"ingredient","k":"ɪnˋgrid ɪənt","p":"n.","c":"(烹調的 )原料；(混合物的 )組成部分","es":"The recipe calls for three main ingredients: flour, eggs, and sugar.","cs":"這個食譜需要三種主要成分：麵粉、雞蛋和糖。","d":"A component part of any mixture."},{"id":1684,"l":4,"w":"initial","k":"ɪˋnɪʃəl","p":"adj.n.","c":"開始的，最初的；(字的 )起首字母","es":"The patient showed a positive initial response to the new treatment.","cs":"病人對新治療表現出積極的最初反應。","d":"Existing or occurring at the beginning."},{"id":1685,"l":4,"w":"innocence","k":"ˋ ɪnəsns","p":"n.","c":"無罪；清白；天真無邪， 純真","es":"The court proved the defendant's complete innocence.","cs":"法庭證明了被告完全的清白。","d":"The state of being innocent of a crime or wrongdoing."},{"id":1686,"l":4,"w":"input","k":"ˋ ɪn͵pʊt","p":"n.vt.","c":"投入；輸入","es":"The committee welcomes input and suggestions from the public.","cs":"委員會歡迎公眾的意見和建議。","d":"What is put in, taken in, or operated on by any process or system; contribution of information or ideas."},{"id":1687,"l":4,"w":"insert","k":"ɪnˋsɝt","p":"vt.","c":"插入；嵌入","es":"Please insert your credit card into the machine slot.","cs":"請將您的信用卡插入機器插槽。","d":"To place, fit, or push (something) into something else."},{"id":1688,"l":4,"w":"inspection","k":"ɪnˋspɛkʃən","p":"n.","c":"檢查，檢驗","es":"The health department conducted an unannounced inspection of the kitchen.","cs":"衛生部門對廚房進行了一次突擊檢查。","d":"Careful examination or scrutiny."},{"id":1689,"l":4,"w":"inspiration","k":"͵ ɪnspəˋreʃən","p":"n.","c":"靈感 ；鼓舞人心的人 (或事物 )","es":"Her grandmother's life story was a source of great inspiration to her.","cs":"她祖母的人生故事是她巨大的靈感來源。","d":"The process of being mentally stimulated to do or feel something; a sudden brilliant or creative idea."},{"id":1690,"l":4,"w":"inspire","k":"ɪnˋspa ɪr","p":"vt.vi.","c":"鼓舞，激勵","es":"The teacher's passion for history truly inspired the students.","cs":"老師對歷史的熱情真正激勵了學生。","d":"To fill (someone) with the urge or ability to do or feel something, especially creative."},{"id":1691,"l":4,"w":"install","k":"ɪnˋstɔl","p":"vt.","c":"安裝，設置","es":"It took several hours for the technician to install the new software.","cs":"技術人員花了幾個小時才安裝好新軟體。","d":"To place or fix (equipment or machinery) in position ready for use."},{"id":1692,"l":4,"w":"instinct","k":"ˋ ɪnstɪŋkt","p":"n.","c":"本能；天性 ；直 覺","es":"Her maternal instinct told her that something was wrong with the baby.","cs":"她的母性直覺告訴她嬰兒有些不對勁。","d":"An innate, typically fixed pattern of behavior in animals in response to certain stimuli."},{"id":1693,"l":4,"w":"instruct","k":"ɪnˋstrʌkt","p":"vt.","c":"指示，命令；教授；訓 練","es":"The pilot will instruct passengers on safety procedures before takeoff.","cs":"飛行員將在起飛前指導乘客安全程序。","d":"To tell or command someone to do something; to teach (someone) a subject or skill."},{"id":1694,"l":4,"w":"instructor","k":"ɪnˋstrʌktɚ","p":"n.","c":"教員；指導者；【美】大學講師","es":"She hired a driving instructor to help her pass the test.","cs":"她聘請了一位駕駛教練來幫助她通過考試。","d":"A person who teaches something."},{"id":1695,"l":4,"w":"insult","k":"ɪnˋsʌlt","p":"vt.n.","c":"侮辱，羞辱","es":"His rude remark was clearly meant as an insult.","cs":"他粗魯的言論顯然是為了侮辱。","d":"To speak to or treat with disrespect or scornful abuse."},{"id":1696,"l":4,"w":"insurance","k":"ɪnˋʃʊrəns","p":"n.","c":"保險；保險契約","es":"You must have car insurance before driving on public roads.","cs":"在公共道路上開車之前，您必須擁有汽車保險。","d":"An arrangement by which a company guarantees compensation for specified loss, damage, illness, or death in return for payment of a premium."},{"id":1697,"l":4,"w":"intellectual","k":"͵ ɪnt!ˋɛktʃʊəl","p":"adj.","c":"智力的；理智的；知識分子","es":"The university is a center for intellectual debate and research.","cs":"這所大學是一個知識辯論和研究的中心。","d":"Relating to the intellect; a person possessing a highly developed intellect."},{"id":1698,"l":4,"w":"intelligence","k":"ɪnˋtɛlədʒəns","p":"n.","c":"智慧；情報","es":"The spy agency collects intelligence about foreign governments.","cs":"間諜機構收集有關外國政府的情報。","d":"The ability to acquire and apply knowledge and skills."},{"id":1699,"l":4,"w":"intelligent","k":"ɪnˋtɛlədʒənt","p":"adj.","c":"聰明的；明智的","es":"Dolphins are known to be highly intelligent creatures.","cs":"海豚被認為是高度聰明的生物。","d":"Having or showing intelligence, especially of a high level."},{"id":1700,"l":4,"w":"intend","k":"ɪnˋtɛnd","p":"vt.","c":"想要；打算","es":"I didn't intend to offend anyone with my joke.","cs":"我並不是打算用我的笑話冒犯任何人。","d":"To have (a course of action) as one's purpose or aim."},{"id":1701,"l":4,"w":"intense","k":"ɪnˋtɛns","p":"adj.","c":"強烈的，劇烈的；熱情的","es":"The marathon runner felt an intense pain in his leg during the race.","cs":"這位馬拉松跑者在比賽中感到腿部有強烈的疼痛。","d":"Of extreme force, degree, or strength."},{"id":1702,"l":4,"w":"intensify","k":"ɪnˋtɛnsə͵faɪ","p":"vt.vi.","c":"加強，增強","es":"The government decided to intensify security measures after the threat.","cs":"政府決定在威脅之後加強安全措施。","d":"To make or become more intense."},{"id":1703,"l":4,"w":"intensity","k":"ɪnˋtɛnsətɪ","p":"n.","c":"(思想、感情的)強烈； (電、熱、光、聲等的 )強度","es":"The light's intensity can be adjusted with a simple dimmer switch.","cs":"光線的強度可以通過簡單的調光開關來調整。","d":"The quality of being intense."},{"id":1704,"l":4,"w":"intensive","k":"ɪnˋtɛnsɪv","p":"adj.","c":"加強的；密集的","es":"He enrolled in an intensive five-week language course.","cs":"他參加了一個為期五週的密集的語言課程。","d":"A concentrated effort on a small area or subject."},{"id":1705,"l":4,"w":"intention","k":"ɪnˋtɛnʃən","p":"n.","c":"意圖，意向，目的","es":"He apologized, claiming he had no bad intention.","cs":"他道歉，聲稱他沒有惡意的意圖。","d":"An aim or plan."},{"id":1706,"l":4,"w":"interact","k":"͵ ɪntəˋrækt","p":"vt.vi.","c":"互動； 互相作用","es":"Teachers must find ways to interact effectively with their students.","cs":"老師必須找到與學生有效互動的方法。","d":"To act in such a way as to have an effect on another."},{"id":1707,"l":4,"w":"interaction","k":"͵ ɪntəˋrækʃən","p":"n.","c":"互動； 互相作用","es":"There was minimal interaction between the two rivals during the meeting.","cs":"會議期間，這兩位對手之間只有極少的互動。","d":"Reciprocal action or influence."},{"id":1708,"l":4,"w":"interfere","k":"͵ ɪntɚˋfɪr","p":"vt.vi.","c":"妨礙；衝突","es":"Please stop trying to interfere in my personal affairs.","cs":"請停止試圖干涉我的私人事務。","d":"To intervene in a situation without invitation or necessity."},{"id":1709,"l":4,"w":"intermediate","k":"͵ ɪntɚˋmid ɪət","p":"adj.","c":"中間的，中等程 度的","es":"She is currently at the intermediate level in her piano lessons.","cs":"她目前的鋼琴課處於中級水平。","d":"Coming between two things in time, place, or order; in the middle."},{"id":1710,"l":4,"w":"interpret","k":"ɪnˋtɝprɪt","p":"vt.vi.","c":"解釋，說明，詮釋；口譯","es":"It is difficult to accurately interpret the meaning of the ancient symbols.","cs":"很難準確解釋這些古代符號的意義。","d":"To explain the meaning of (information, words, or actions); to translate orally."},{"id":1711,"l":4,"w":"interruption","k":"͵ ɪntəˋrʌpʃən","p":"n.","c":"中止；阻礙；干 擾","es":"She worked for six hours straight without a single interruption.","cs":"她連續工作了六個小時，沒有一次打斷。","d":"The action of interrupting or the state of being interrupted."},{"id":1712,"l":4,"w":"intimate","k":"ˋ ɪntəmɪt","p":"adj.","c":"親密的， 熟悉的","es":"They shared an intimate dinner with only their closest family members.","cs":"他們只與最親近的家人一起分享了一頓親密的晚餐。","d":"Closely familiar or related; private and personal."},{"id":1713,"l":4,"w":"intonation","k":"͵ ɪntoˋne ʃən","p":"n.","c":"語調；聲調","es":"Her cheerful intonation made her sound very friendly.","cs":"她歡快的語調使她聽起來非常友善。","d":"The rise and fall of the voice in speaking."},{"id":1714,"l":4,"w":"invade","k":"ɪnˋved","p":"vt.vi.","c":"侵入，侵略；侵犯","es":"The neighboring country threatened to invade the small island nation.","cs":"鄰國威脅要入侵這個小島國。","d":"To enter (a country or region) in military opposition."},{"id":1715,"l":4,"w":"invasion","k":"ɪnˋveʒən","p":"n.","c":"侵入，侵略；侵犯","es":"The sudden invasion of privacy by the press angered the celebrity.","cs":"媒體突然侵犯隱私的行為激怒了這位名人。","d":"An instance of invading a country or region with an armed force."},{"id":1716,"l":4,"w":"invention","k":"ɪnˋvɛnʃən","p":"n.","c":"發明，創造 ；發明物，創作品","es":"The internet is arguably the greatest invention of the 20th century.","cs":"網際網路可以說是 20 世紀最偉大的發明。","d":"The action of inventing something, typically a process or device."},{"id":1717,"l":4,"w":"invest","k":"ɪnˋvɛst","p":"vt.vi.","c":"投(資)","es":"He decided to invest a large sum of money in a new startup.","cs":"他決定將一大筆錢投資於一家新的初創公司。","d":"To commit (money) in order to earn a financial return."},{"id":1718,"l":4,"w":"investigation","k":"ɪn͵vɛstəˋgeʃən","p":"n.","c":"研究；調查","es":"The police launched a full-scale investigation into the robbery.","cs":"警方對這起搶劫案展開了全面調查。","d":"A formal inquiry or systematic study."},{"id":1719,"l":4,"w":"investment","k":"ɪnˋvɛstmənt","p":"n.","c":"投資；投資額","es":"Buying a house is often the biggest investment a person makes.","cs":"買房子通常是一個人最大的投資。","d":"The action or process of investing money for profit."},{"id":1720,"l":4,"w":"involve","k":"ɪnˋvɑlv","p":"vt.","c":"使捲入，連累；牽涉","es":"The job will involve a lot of travel and client meetings.","cs":"這份工作將涉及大量的出差和客戶會議。","d":"To include (something) as a necessary part or result."},{"id":1721,"l":4,"w":"involvement","k":"ɪnˋvɑlvmənt","p":"n.","c":"捲入，連累；牽 涉","es":"His political involvement began when he was a student activist.","cs":"他的政治參與始於他還是一名學生運動者的時候。","d":"The fact or condition of being involved in something."},{"id":1722,"l":4,"w":"isolate","k":"ˋa ɪs!͵et","p":"vt.vi.","c":"使孤立；使脫離","es":"They decided to isolate the sick patient to prevent the spread of the virus.","cs":"他們決定隔離生病的病人，以防止病毒傳播。","d":"To place or keep (someone or something) apart from others."},{"id":1723,"l":4,"w":"isolation","k":"͵a ɪs!ˋeʃən","p":"n.","c":"隔離；孤立 ;脫離； 【物】 絕緣","es":"The scientist worked in complete isolation for two years on the project.","cs":"這位科學家為了這個專案完全隔離工作了兩年。","d":"The process or fact of isolating or being isolated."},{"id":1724,"l":4,"w":"itch","k":"ɪtʃ","p":"n.vi.vt.","c":"(發)癢","es":"The mosquito bite caused an irritating itch on my arm.","cs":"蚊子叮咬在我的手臂上引起了惱人的癢。","d":"An uncomfortable sensation on the skin that causes a desire to scratch."},{"id":1725,"l":4,"w":"jealousy","k":"ˋd ʒɛləsɪ","p":"n.","c":"妒忌；猜忌","es":"His success aroused feelings of jealousy among his former colleagues.","cs":"他的成功在舊同事中引起了嫉妒的情緒。","d":"A feeling of unhappy or angry suspicion that a rival possesses something one desires."},{"id":1726,"l":4,"w":"junior","k":"ˋd ʒunjɚ","p":"adj.n.","c":"資淺的；(大學 )三年級 (生)的；地位較低的；晚輩","es":"He is a junior partner at the law firm, reporting to the seniors.","cs":"他是這家律師事務所的資淺合夥人，向資深合夥人報告。","d":"Of or denoting the younger of two people; relating to a lower standing or rank."},{"id":1727,"l":4,"w":"keen","k":"kin","p":"adj.","c":"熱心的，熱衷的；渴望的；敏 銳的","es":"She has a keen interest in studying ancient Egyptian history.","cs":"她對研究古埃及歷史有著熱衷的興趣。","d":"Having or showing eagerness or enthusiasm; (of a sense) highly developed."},{"id":1728,"l":4,"w":"knuckle","k":"ˋn ʌk!","p":"n.","c":"指(根)關節","es":"He cracked his knuckles nervously before the interview began.","cs":"在面試開始前，他緊張地發出指關節的聲音。","d":"A joint of a finger, especially that connecting a finger to the hand."},{"id":1729,"l":4,"w":"labor","k":"ˋleb ɚ","p":"n.vi.","c":"勞動 ；勞工 ；陣痛 ；勞動","es":"The factory relies on cheap manual labor to produce its goods.","cs":"這家工廠依靠廉價的體力勞動來生產其商品。","d":"Work, especially hard physical work."},{"id":1730,"l":4,"w":"laboratory","k":"ˋlæbr ə͵torɪ","p":"n.","c":"實驗室，研究室 (lab)","es":"Scientists are conducting complex experiments in the laboratory.","cs":"科學家正在實驗室進行複雜的實驗。","d":"A room or building equipped for scientific experiments, research, or testing."},{"id":1731,"l":4,"w":"lag","k":"læ g","p":"n.vi.vt.","c":"走得慢；落後；延遲","es":"There is always a slight time lag between speaking and the sound being heard online.","cs":"在說話和線上聽到聲音之間總會有一點點時間延遲。","d":"To fall behind in movement, progress, or development; a period of delay."},{"id":1732,"l":4,"w":"landmark","k":"ˋlænd͵m ɑrk","p":"n.","c":"地標，陸標；重大事件，里程碑","es":"The Eiffel Tower is a famous Parisian landmark.","cs":"艾菲爾鐵塔是著名的巴黎地標。","d":"An object or feature of a landscape or town that is easily seen and recognized; an important stage."},{"id":1733,"l":4,"w":"landscape","k":"ˋlænd͵skep","p":"n.","c":"( 陸上的 )風景， 景色","es":"We hired a professional to design the landscape of our new garden.","cs":"我們聘請了一位專業人士來設計我們新花園的景觀。","d":"All the visible features of an area of land, often considered in terms of their aesthetic appeal."},{"id":1734,"l":4,"w":"landslide","k":"ˋlænd͵sla ɪd","p":"n.","c":"山崩；土石流 (mudslide)","es":"Heavy rains caused a dangerous landslide that blocked the mountain road.","cs":"豪雨造成了一場危險的山崩，堵塞了山路。","d":"A mass of earth and rock sliding rapidly down a mountain; an overwhelming majority of votes."},{"id":1735,"l":4,"w":"largely","k":"ˋl ɑrdʒlɪ","p":"advt.","c":"大部分；主要地","es":"The success of the campaign depends largely on volunteer efforts.","cs":"這次活動的成功主要取決於志願者的努力。","d":"To a great extent; mostly."},{"id":1736,"l":4,"w":"lately","k":"`letlɪ","p":"adv.","c":"最近，近來","es":"She has been working very hard lately.","cs":"她最近工作非常努力。","d":"Recently; in the recent past."},{"id":1737,"l":4,"w":"launch","k":"l ɔntʃ","p":"vt.n.","c":"使(船)下水；發射；投擲；使升空","es":"The company plans to launch its new line of products next month.","cs":"該公司計畫下個月發布其新的產品線。","d":"To start or set in motion (an activity or enterprise); to send (a ship or rocket) into the water or sky."},{"id":1738,"l":4,"w":"lawful","k":"ˋl ɔfəl","p":"adj.","c":"合法的；法定的","es":"It is entirely lawful for citizens to peacefully protest.","cs":"公民和平抗議是完全合法的。","d":"Conforming to, permitted by, or recognized by law."},{"id":1739,"l":4,"w":"lead2","k":"lid","p":"vt.vi.n.","c":"引導；領 (路) ；鉛","es":"The sign will lead you directly to the museum entrance.","cs":"這個標誌將直接引導您到博物館入口。","d":"To guide or direct (a person or animal); to be the most important."},{"id":1740,"l":4,"w":"lean1","k":"lin","p":"n.vi.vt.","c":"傾斜；倚，靠","es":"He had to lean forward to hear what the speaker was saying.","cs":"他不得不傾身向前，以聽清楚演講者在說什麼。","d":"(Of a person or animal) thin, especially healthily so; containing little fat."},{"id":1741,"l":4,"w":"lean2","k":"lin","p":"adj.","c":"瘦的；無收成的","es":"The healthy recipe uses only very lean cuts of meat.","cs":"這個健康的食譜只使用非常瘦的肉塊。","d":"To incline or bend from a vertical position."},{"id":1742,"l":4,"w":"learned","k":"ˋl ɝnɪd","p":"adj.","c":"有學問的，博學的","es":"She is a highly learned scholar in classical literature.","cs":"她是一位在古典文學方面博學的學者。","d":"Having or showing profound knowledge; scholarly."},{"id":1743,"l":4,"w":"learning","k":"ˋl ɝnɪŋ","p":"n.","c":"學習；學問","es":"The students' active participation shows a great love for learning.","cs":"學生們的積極參與顯示出對學習的極大熱愛。","d":"The acquisition of knowledge or skills through study, experience, or being taught."},{"id":1744,"l":4,"w":"lecture","k":"ˋlɛktʃɚ","p":"n.vt.vi.","c":"授課；訓話，告誡 ；演講；給…講課；訓斥","es":"The visiting professor gave an engaging lecture on astronomy.","cs":"這位客座教授做了一場引人入勝的演講關於天文學。","d":"An educational talk to an audience, especially to students."},{"id":1745,"l":4,"w":"lecturer","k":"ˋl ɛktʃərɚ","p":"n.","c":"講演者","es":"He is a senior lecturer in the Department of Philosophy.","cs":"他是哲學系的資深講師。","d":"A person who gives lectures, especially at a university."},{"id":1746,"l":4,"w":"legend","k":"ˋl ɛdʒənd","p":"n.","c":"傳說；傳奇故事；傳奇 人物","es":"The story is based on an ancient local legend about a sea monster.","cs":"這個故事是基於一個關於海怪的古老當地傳說。","d":"A traditional story sometimes popularly regarded as historical but unauthenticated."},{"id":1747,"l":4,"w":"leisurely","k":"ˋli ʒɚlɪ","p":"adj.adv.","c":"從容不迫的，悠閒的；從容不迫地，慢慢地","es":"We took a leisurely walk along the river bank after dinner.","cs":"晚餐後，我們沿著河岸悠閒地散步。","d":"Done or proceeding at an unhurried pace."},{"id":1748,"l":4,"w":"license","k":"ˋla ɪsns","p":"n.","c":"執照，牌照；許可證","es":"You need a special license to operate heavy machinery.","cs":"您需要一個特殊的執照才能操作重型機械。","d":"A permit from an authority to own or use something."},{"id":1749,"l":4,"w":"lighten","k":"ˋla ɪtn","p":"vt.vi.","c":"變亮；發亮","es":"The sunrise began to lighten the sky from dark gray to soft blue.","cs":"日出開始將天空從深灰色照亮成柔和的藍色。","d":"To make or become less heavy or less dark."},{"id":1750,"l":4,"w":"limitation","k":"͵l ɪməˋteʃən","p":"n.","c":"限制，極限，限度","es":"The small budget placed a severe limitation on the project's scope.","cs":"緊縮的預算對專案的範圍造成了嚴重的限制。","d":"A restriction on the size or amount of something."},{"id":1751,"l":4,"w":"liquor","k":"ˋl ɪkɚ","p":"n.","c":"酒；含酒精飲料","es":"The store only sells beer and wine, not hard liquor.","cs":"這家商店只賣啤酒和葡萄酒，不賣烈性酒。","d":"Strong alcoholic drink; a liquid."},{"id":1752,"l":4,"w":"literary","k":"ˋl ɪtə͵rɛrɪ","p":"adj.","c":"文學的，文藝的；文言 的","es":"She spent her life studying literary works from the 19th century.","cs":"她的一生都在研究 19 世紀的文學作品。","d":"Concerning the writing, study, or content of literature."},{"id":1753,"l":4,"w":"literature","k":"ˋl ɪtərətʃɚ","p":"n.","c":"文學；文獻","es":"English literature is a required course for all first-year students.","cs":"英國文學是所有一年級學生的必修課。","d":"Written works, especially those considered of superior artistic merit."},{"id":1754,"l":4,"w":"loan","k":"lon","p":"n.","c":"借出；貸款","es":"She took out a small bank loan to start her business.","cs":"她向銀行申請了一筆小額貸款來開辦她的生意。","d":"A thing that is borrowed, especially a sum of money that is expected to be paid back."},{"id":1755,"l":4,"w":"location","k":"loˋke ʃən","p":"n.","c":"位置；場所，所在地","es":"The new factory will be built in a rural location outside the city.","cs":"新工廠將建在城市外的鄉村地點。","d":"A particular place or position."},{"id":1756,"l":4,"w":"locker","k":"ˋl ɑkɚ","p":"n.","c":"(體育館等公共場所的 )衣物 櫃","es":"I put my gym bag and coat inside my school locker.","cs":"我將我的健身包和外套放進了我的學校置物櫃。","d":"A small, lockable cupboard or compartment."},{"id":1757,"l":4,"w":"logic","k":"ˋl ɑdʒɪk","p":"n.","c":"邏輯；邏輯學","es":"There is no logic behind his sudden decision to quit.","cs":"他突然辭職的決定背後沒有任何邏輯。","d":"Reasoning conducted or assessed according to strict principles of validity."},{"id":1758,"l":4,"w":"logical","k":"ˋl ɑdʒɪk!","p":"adj.","c":"合邏輯的；合理的","es":"It seems logical to assume the power outage caused the computer crash.","cs":"假設停電導致電腦崩潰似乎是合乎邏輯的。","d":"Characterized by or capable of clear, sound reasoning."},{"id":1759,"l":4,"w":"lotion","k":"ˋlo ʃən","p":"n.","c":"(化妝等用的 )化妝水，護膚 液","es":"I use a moisturizing lotion every morning to keep my skin soft.","cs":"我每天早上使用保濕乳液來保持我的皮膚柔軟。","d":"A thick, smooth liquid preparation designed to be applied to the skin for medicinal or cosmetic purposes."},{"id":1760,"l":4,"w":"lousy","k":"ˋla ʊzɪ","p":"adj.","c":"【俚】不潔的；卑鄙的；討 厭的","es":"The weather was absolutely lousy for the whole weekend.","cs":"整個週末的天氣都非常糟糕。","d":"Very poor quality; dreadful."},{"id":1761,"l":4,"w":"loyal","k":"ˋl ɔɪəl","p":"adj.","c":"忠誠的，忠心的","es":"The politician has a small but extremely loyal group of supporters.","cs":"這位政治家擁有一群小但極其忠誠的支持者。","d":"Giving or showing firm and constant support or allegiance."},{"id":1762,"l":4,"w":"loyalty","k":"ˋl ɔɪəltɪ","p":"n.","c":"忠誠；忠心","es":"She was rewarded for her ten years of dedicated loyalty to the company.","cs":"她因為對公司十年如一日的忠誠忠心而獲得獎勵。","d":"The quality of being loyal."},{"id":1763,"l":4,"w":"lunar","k":"ˋlun ɚ","p":"adj.","c":"月的；月球上的；陰曆的","es":"The next total solar eclipse will occur during a full lunar cycle.","cs":"下一次日全食將發生在完整的月球週期期間。","d":"Relating to the moon."},{"id":1764,"l":4,"w":"luxurious","k":"l ʌgˋʒʊrɪəs","p":"adj.","c":"奢侈的；驕奢淫逸的","es":"They stayed in a luxurious five-star resort for their vacation.","cs":"他們在一個豪華的五星級度假村度過他們的假期。","d":"Extremely comfortable, elegant, or enjoyable, especially in a way that involves great expense."},{"id":1765,"l":4,"w":"luxury","k":"ˋl ʌkʃərɪ","p":"n.","c":"奢侈，奢華 ；奢侈品","es":"A private jet is a form of extreme luxury.","cs":"私人飛機是一種極度的奢侈。","d":"A state of great comfort or elegance, especially when involving great expense."},{"id":1766,"l":4,"w":"machinery","k":"m əˋʃinərɪ","p":"n.","c":"機器；機械","es":"The factory is full of heavy, loud machinery.","cs":"這家工廠充滿了笨重、嘈雜的機器。","d":"Machines or mechanisms collectively."},{"id":1767,"l":4,"w":"madam","k":"ˋmæd əm","p":"n.","c":"(對婦女的敬稱 )夫人， 太太；小姐 (ma’am )","es":"Excuse me, Madam, you dropped your glove.","cs":"對不起，女士，您掉了您的手套。","d":"A polite or respectful way of addressing a woman."},{"id":1768,"l":4,"w":"magnetic","k":"mægˋn ɛtɪk","p":"adj.","c":"磁鐵的；磁性的， 有魅力的","es":"The refrigerator door stays shut because of a magnetic strip.","cs":"冰箱門因為一條磁性條而保持關閉。","d":"Having the properties of a magnet; capable of being magnetized."},{"id":1769,"l":4,"w":"magnificent","k":"mægˋn ɪfəsənt","p":"adj.","c":"壯麗的，宏偉 的","es":"The view of the Grand Canyon was truly magnificent.","cs":"大峽谷的景色確實宏偉的。","d":"Impressively beautiful, elaborate, or extravagant; superb."},{"id":1770,"l":4,"w":"makeup1","k":"ˋmek ʌp","p":"n.","c":"虛構","es":"She spends an hour every morning putting on her makeup.","cs":"她每天早上花一個小時化妝。","d":"The constituents of something; composition."},{"id":1771,"l":4,"w":"makeup2","k":"ˋmek ʌp","p":"n.","c":"化妝品；補充；補考","es":"For the event, we will need a special makeup of volunteers and staff.","cs":"為了這次活動，我們將需要一個由志願者和工作人員組成的特別組成。","d":"Cosmetics applied to the face to improve its appearance."},{"id":1772,"l":4,"w":"manu facturer","k":"mæ nj əˋfækt ʃərɚ","p":"n.","c":"製造業者， 廠商","es":"The car manufacturer recalled thousands of vehicles due to a safety issue.","cs":"這家汽車製造商因安全問題召回了數千輛汽車。","d":"A person or company that makes goods for sale."},{"id":1773,"l":4,"w":"manual","k":"ˋmænj ʊəl","p":"n.adj.","c":"手冊，簡介；手的；手 工的","es":"He prefers to drive a car with a manual transmission.","cs":"他更喜歡開一輛手動變速的汽車。","d":"Of or done with the hands; a handbook of instructions."},{"id":1774,"l":4,"w":"manufacture","k":"͵mænj əˋfækt ʃɚ","p":"vt.vi.","c":"(大量 )製 造，加工","es":"The company plans to manufacture all its products locally.","cs":"該公司計畫在本地製造其所有產品。","d":"To make (something) typically on a large scale using machinery."},{"id":1775,"l":4,"w":"marathon","k":"ˋmær ə͵θɑn","p":"n.","c":"【體】 (可大寫 )馬拉 松賽跑","es":"She trained for six months to run her first full marathon.","cs":"她訓練了六個月才跑完她的第一個全程馬拉松。","d":"A long-distance running race of $26$ miles $385$ yards; a long, difficult task."},{"id":1776,"l":4,"w":"margin","k":"ˋm ɑrdʒɪn","p":"n.","c":"邊，邊沿，邊緣","es":"The paper had wide margins for the professor to write comments.","cs":"這張紙有寬闊的邊緣供教授寫評論。","d":"The edge or border of something; the difference between the cost and selling price."},{"id":1777,"l":4,"w":"maturity","k":"m əˋtjʊrətɪ","p":"n.","c":"成熟；完善","es":"It takes years for a young tree to reach full maturity.","cs":"一棵幼樹需要數年才能達到完全成熟。","d":"The state, fact, or period of being mature."},{"id":1778,"l":4,"w":"maximum","k":"ˋmæks əməm","p":"n.adj.","c":"最大量，最大數 ；最大的；最多的","es":"The elevator has a maximum capacity of ten people.","cs":"這部電梯的最大容量是十個人。","d":"The greatest or highest amount possible or attained."},{"id":1779,"l":4,"w":"measure2","k":"ˋm ɛʒɚ","p":"vt.n.","c":"測量；計量 ；措施；手段；方法","es":"The government will take strong measures to control the outbreak.","cs":"政府將採取強有力的措施來控制疫情。","d":"To ascertain the size, amount, or degree of (something) by using an instrument or standard."},{"id":1780,"l":4,"w":"mechanic","k":"m əˋkæn ɪk","p":"n.","c":"機械工，技工","es":"I took my car to the mechanic to fix the broken engine.","cs":"我把我的車開到技工那裡去修理壞掉的引擎。","d":"A person who repairs and maintains machinery."},{"id":1781,"l":4,"w":"mechanical","k":"m əˋkæn ɪk!","p":"adj.","c":"機械的，用機械的","es":"The watch stopped working due to a mechanical failure inside.","cs":"這隻手錶因內部的機械故障而停止工作。","d":"Relating to or operated by machinery; lacking thought or spontaneity."},{"id":1782,"l":4,"w":"memorable","k":"ˋm ɛmərəb!","p":"adj.","c":"值得懷念的；難忘 的","es":"We had a truly memorable trip to the ancient ruins.","cs":"我們在古代遺跡進行了一次真正值得紀念的旅行。","d":"Worth remembering or easily remembered."},{"id":1783,"l":4,"w":"memorial","k":"m əˋmor ɪəl","p":"n.","c":"紀念物；紀念碑；紀 念館","es":"A bronze statue was erected as a memorial to the war heroes.","cs":"豎立了一座銅像作為戰爭英雄的紀念碑。","d":"Something, especially a monument, intended to celebrate or honor the memory of a person or event."},{"id":1784,"l":4,"w":"mercy","k":"ˋm ɝsɪ","p":"n.","c":"慈悲，憐憫；仁慈，寬容","es":"The prisoner pleaded with the judge to show him mercy.","cs":"囚犯懇求法官對他表現出憐憫。","d":"Compassion or forgiveness shown toward someone whom it is within one's power to punish or harm."},{"id":1785,"l":4,"w":"mere","k":"m ɪr","p":"adj.","c":"僅僅的，只不過的","es":"It was a mere coincidence that they both arrived at the same time.","cs":"他們同時到達只是一個僅僅的巧合。","d":"No more than; only."},{"id":1786,"l":4,"w":"merit","k":"ˋm ɛrɪt","p":"n.","c":"長處，優點 ；功績，功勞","es":"The judges debated the merits of each painting before announcing the winner.","cs":"評審在宣布獲勝者之前討論了每幅畫的優點。","d":"The quality of being particularly good or worthy; a commendable quality."},{"id":1787,"l":4,"w":"messenger","k":"ˋm ɛsndʒɚ","p":"n.","c":"送信人； (電報郵件 的)信差","es":"A messenger delivered the urgent package to the office this morning.","cs":"一名信差今天早上將緊急包裹送到了辦公室。","d":"A person who carries a message or is employed to deliver messages."},{"id":1788,"l":4,"w":"messy","k":"ˋm ɛsɪ","p":"adj.","c":"凌亂的 ; 雜亂的 ; 邋遢的","es":"The children left their room completely messy with toys everywhere.","cs":"孩子們把他們的房間弄得一團亂，到處都是玩具。","d":"Untidy or dirty."},{"id":1789,"l":4,"w":"microscope","k":"ˋma ɪkrə͵skop","p":"n.","c":"顯微鏡","es":"Scientists use a powerful microscope to examine cells.","cs":"科學家使用強大的顯微鏡來檢查細胞。","d":"An optical instrument used to see very small objects."},{"id":1790,"l":4,"w":"mild","k":"ma ɪld","p":"adj.","c":"溫和的，溫柔的","es":"The winter this year was very mild with hardly any snow.","cs":"今年的冬天非常溫和，幾乎沒有下雪。","d":"Not severe, harsh, or extreme."},{"id":1791,"l":4,"w":"mineral","k":"ˋm ɪnərəl","p":"n.adj.","c":"礦物；礦泉水；礦物的","es":"Drinking water should contain a healthy amount of necessary minerals.","cs":"飲用水應含有健康量的必需礦物質。","d":"A naturally occurring inorganic substance with a definite chemical composition."},{"id":1792,"l":4,"w":"minimum","k":"ˋm ɪnəməm","p":"n.adj.","c":"最小量，最小數；最小的，最少的，最低的","es":"You must be 18 years old to meet the minimum age requirement.","cs":"您必須年滿 18 歲才能達到最低年齡要求。","d":"The least or smallest amount or quantity possible, attainable, or required."},{"id":1793,"l":4,"w":"minister","k":"ˋm ɪnɪstɚ","p":"n.","c":"部長；大臣；牧師","es":"The country's Foreign Minister signed the treaty yesterday.","cs":"該國的對外部長昨天簽署了條約。","d":"A head of a government department; a member of the clergy."},{"id":1794,"l":4,"w":"ministry","k":"ˋm ɪnɪstrɪ","p":"n.","c":"(常大寫 )(政府的 )部","es":"The Ministry of Education controls the national school curriculum.","cs":"教育部控制著國家學校課程。","d":"A government department headed by a minister."},{"id":1795,"l":4,"w":"mischief","k":"ˋm ɪstʃɪf","p":"n.","c":"頑皮，淘氣；胡鬧","es":"The little boy was always getting into mischief around the house.","cs":"這個小男孩總是在屋子裡搞惡作劇。","d":"Playful misbehavior or trouble-making."},{"id":1796,"l":4,"w":"miserable","k":"ˋm ɪzərəb!","p":"adj.","c":"不幸的；悲哀的","es":"She felt miserable after failing the driving test for the third time.","cs":"她第三次駕駛考試失敗後感到痛苦的。","d":"Wretchedly unhappy or uncomfortable."},{"id":1797,"l":4,"w":"misfortune","k":"m ɪsˋfɔrtʃən","p":"n.","c":"不幸 ；不幸的 事","es":"It was a great misfortune that his new business failed so quickly.","cs":"他的新事業這麼快就失敗是一個巨大的不幸。","d":"Bad luck."},{"id":1798,"l":4,"w":"mislead","k":"m ɪsˋlid","p":"vt.","c":"誤導；把 …引入歧途","es":"The company was accused of using false advertising to mislead customers.","cs":"這家公司被指控使用虛假廣告誤導顧客。","d":"To cause (someone) to have a wrong idea or impression."},{"id":1799,"l":4,"w":"misunderstand","k":"ˋm ɪsʌndɚˋstænd","p":"vt.","c":"誤會；曲 解","es":"It is easy to misunderstand instructions when they are not clear.","cs":"當指示不清楚時，很容易誤解。","d":"To fail to understand (something or someone) correctly."},{"id":1800,"l":4,"w":"moderate","k":"ˋm ɑdərɪt","p":"adj.","c":"適度的；有節制的；溫和的","es":"The wind was only moderate, making it a pleasant day for sailing.","cs":"風力只是適中的，使得這是一個愉快的航行日。","d":"Average in amount, intensity, quality, or degree; not extreme."},{"id":1801,"l":4,"w":"modest","k":"ˋm ɑdɪst","p":"adj.","c":"謙虛的，審慎的","es":"Despite his great success, he remains a humble and modest person.","cs":"儘管他取得了巨大的成功，但他仍然是一個謙遜謙虛的人。","d":"Unassuming in the estimation of one's abilities or achievements; relatively small."},{"id":1802,"l":4,"w":"modesty","k":"ˋm ɑdɪstɪ","p":"n.","c":"謙遜，虛心","es":"Her modesty about her achievements made her even more respected.","cs":"她對自己成就的謙遜使她更加受到尊敬。","d":"The quality or state of being modest."},{"id":1803,"l":4,"w":"monitor","k":"ˋm ɑnətɚ","p":"n.","c":"監視器； (學校的 )班長， 級長 vt.監控；監聽","es":"The nurse had to monitor the patient's heart rate continuously.","cs":"護士必須持續監測病人的心率。","d":"A device used for observing, checking, or keeping a continuous record of something."},{"id":1804,"l":4,"w":"monthly","k":"ˋm ʌnθlɪ","p":"adj.adv.n.","c":"每月的；每月一次的；每月；月刊","es":"I pay a monthly fee for my internet service.","cs":"我為我的網路服務支付每月的費用。","d":"Done, produced, or occurring once a month."},{"id":1805,"l":4,"w":"monument","k":"ˈmɑːnjumənt","p":"n.","c":"紀念碑 ，紀念塔， 紀念館","es":"The statue stands as a monument to the soldiers who died in the war.","cs":"這座雕像是為了紀念在戰爭中犧牲的士兵而立的紀念碑。","d":"A statue, building, or other structure erected to commemorate a famous person or event."},{"id":1806,"l":4,"w":"moreover","k":"morˋov ɚ","p":"advt.","c":"並且，加之，此外","es":"I don't like the color; moreover, the price is too high.","cs":"我不喜歡這個顏色；此外，價格也太高了。","d":"In addition to what has been said; besides."},{"id":1807,"l":4,"w":"mostly","k":"ˋmostl ɪ","p":"advt.","c":"大多數地，大部分地","es":"The food at the party was mostly vegetarian dishes.","cs":"派對上的食物主要是素食菜餚。","d":"In the main; generally."},{"id":1808,"l":4,"w":"motivate","k":"ˋmot ə͵vet","p":"vt.","c":"給…動機；刺激；激 發","es":"A good leader knows how to motivate their team members effectively.","cs":"一位好的領導者知道如何有效地激勵他們的團隊成員。","d":"To provide (someone) with a reason for doing something."},{"id":1809,"l":4,"w":"motivation","k":"͵mot əˋveʃən","p":"n.","c":"動機；刺激；推 動","es":"His strong motivation to succeed drives all his actions.","cs":"他成功的強烈動機驅動著他所有的行動。","d":"The reason or reasons one has for acting or behaving in a particular way."},{"id":1810,"l":4,"w":"mountainous","k":"ˋma ʊntənəs","p":"adj.","c":"多山的；有山的","es":"We spent our vacation hiking in the rugged mountainous region.","cs":"我們在崎嶇的多山的地區徒步旅行度過假期。","d":"Having many mountains."},{"id":1811,"l":4,"w":"mow","k":"mo","p":"vt.vi.","c":"( 用鐮刀等 )刈(草等 )","es":"I need to mow the lawn this weekend before the grass gets too long.","cs":"我需要在本週末割草坪，以免草長得太長。","d":"To cut down (grass or crops) with a machine or scythe."},{"id":1812,"l":4,"w":"muddy","k":"ˋm ʌdɪ","p":"adj.","c":"多爛泥的；泥濘的","es":"After the rain, the field was completely muddy and wet.","cs":"下雨後，田野完全是泥濘的和潮濕的。","d":"Covered in or full of mud."},{"id":1813,"l":4,"w":"multiple","k":"ˋm ʌltəp!","p":"adj.","c":"複合的；多樣的","es":"The patient suffered multiple injuries in the car accident.","cs":"這位病人在車禍中遭受了多重傷害。","d":"Having or involving several parts, elements, or members."},{"id":1814,"l":4,"w":"murderer","k":"ˋm ɝdərɚ","p":"n.","c":"謀殺犯，兇手","es":"The police finally arrested the suspected murderer after a long chase.","cs":"警方在長期追捕後終於逮捕了涉嫌殺人犯。","d":"A person who commits murder."},{"id":1815,"l":4,"w":"murmur","k":"ˋm ɝmɚ","p":"n.vt.vi.","c":"低語聲；輕柔持續的聲音；私語，小聲說話","es":"The audience began to murmur in excitement as the lights dimmed.","cs":"燈光變暗時，觀眾開始興奮地低語。","d":"A soft, low, and indistinct sound made by a person or group of people."},{"id":1816,"l":4,"w":"mustache","k":"ˋm ʌstæʃ","p":"n.","c":"髭，小鬍子","es":"The old gentleman had a large, gray mustache.","cs":"這位老紳士有著一個大而灰白的小鬍子。","d":"A strip of hair left to grow above the upper lip."},{"id":1817,"l":4,"w":"mutual","k":"ˋmjut ʃʊəl","p":"adj.","c":"相互的，彼此的；共有 (同)的","es":"They shared a mutual respect and admiration for each other's work.","cs":"他們對彼此的工作有著相互的尊重和欽佩。","d":"(Of a feeling or action) experienced or done by each of two or more parties toward the other."},{"id":1818,"l":4,"w":"mysterious","k":"m ɪsˋtɪrɪəs","p":"adj.","c":"神祕的；不可思議 的","es":"A mysterious package arrived at the office with no return address.","cs":"一個神秘的包裹送到了辦公室，沒有回郵地址。","d":"Difficult or impossible to understand, explain, or identify."},{"id":1819,"l":4,"w":"namely","k":"ˋneml ɪ","p":"advt.","c":"即，那就是","es":"There is one major problem, namely, the lack of funding.","cs":"這裡有一個主要問題，即是缺乏資金。","d":"That is to say; specifically."},{"id":1820,"l":4,"w":"nationality","k":"͵næ ʃəˋnælətɪ","p":"n.","c":"國籍","es":"She has dual nationality, holding both French and Canadian passports.","cs":"她擁有雙重國籍，持有法國和加拿大護照。","d":"The status of belonging to a particular nation; a group of people sharing a common origin."},{"id":1821,"l":4,"w":"nearsighted","k":"ˋn ɪrˋsaɪtɪd","p":"adj.","c":"近視的；目光短淺 的","es":"She has been nearsighted since she was a child and wears glasses.","cs":"她從小就近視，戴著眼鏡。","d":"Unable to see things clearly unless they are relatively close to the eyes; short-sighted."},{"id":1822,"l":4,"w":"needy","k":"ˋnid ɪ","p":"adj.","c":"貧窮的","es":"The church collects food donations for the needy in the community.","cs":"教會在社區為貧困者收集食物捐贈。","d":"(Of a person) lacking the necessities of life; very poor."},{"id":1823,"l":4,"w":"neglect","k":"n ɪgˋlɛkt","p":"vt.n.","c":"忽視，忽略","es":"The house was clearly old and showed signs of long-term neglect.","cs":"這棟房子明顯很舊，並顯示出長期忽視的跡象。","d":"The state of being uncared for; to fail to care for."},{"id":1824,"l":4,"w":"negotiate","k":"n ɪˋgoʃɪ͵et","p":"vt.vi.","c":"談判，協商","es":"The two sides spent hours trying to negotiate a fair contract.","cs":"雙方花了數小時試圖談判達成一份公平的合約。","d":"To try to reach an agreement or compromise by discussion."},{"id":1825,"l":4,"w":"nevertheless","k":"͵n ɛvɚðəˋlɛs","p":"advt.","c":"不過，然而 = nonetheless","es":"The hike was difficult; nevertheless, we all enjoyed the challenge.","cs":"這次徒步旅行很困難；儘管如此，我們都喜歡這個挑戰。","d":"In spite of that; yet."},{"id":1826,"l":4,"w":"nightmare","k":"ˋna ɪt͵mɛr","p":"n.","c":"夢魘；惡夢","es":"The terrible memory of the accident often gives her a nightmare.","cs":"事故的可怕記憶經常讓她做惡夢。","d":"A frightening or unpleasant dream; a very difficult or unpleasant situation."},{"id":1827,"l":4,"w":"nonsense","k":"ˋn ɑnsɛns","p":"n.int.","c":"胡說；胡鬧；胡說 ! 廢話！","es":"His claim that he can fly is complete nonsense.","cs":"他聲稱他會飛完全是胡說八道。","d":"Spoken or written words that have no meaning or make no sense."},{"id":1828,"l":4,"w":"noun","k":"na ʊn","p":"n.","c":"【文】名詞","es":"In the sentence \"The cat sat on the mat,\" \"cat\" and \"mat\" are nouns.","cs":"在句子「貓坐在墊子上」中，「貓」和「墊子」是名詞。","d":"A word (other than a pronoun) used to identify any of a class of people, places, or things."},{"id":1829,"l":4,"w":"nowadays","k":"ˋna ʊə͵dez","p":"advt.","c":"現今，時下","es":"Nowadays, most people communicate using smartphones and email.","cs":"現今，大多數人使用智慧型手機和電子郵件進行交流。","d":"At the present time."},{"id":1830,"l":4,"w":"nuclear","k":"ˋnjukl ɪɚ","p":"adj.","c":"核心的，中心的；原子 核的","es":"The international community is concerned about nuclear proliferation.","cs":"國際社會對核擴散感到擔憂。","d":"Relating to the nucleus of an atom or the use of energy released from it."},{"id":1831,"l":4,"w":"numerous","k":"ˋnjum ərəs","p":"adj.","c":"許多的，很多的","es":"There were numerous errors in the report that needed correcting.","cs":"報告中有許多的錯誤需要修正。","d":"Great in number; many."},{"id":1832,"l":4,"w":"nursery","k":"ˋn ɝsərɪ","p":"n.","c":"幼兒室，育兒室；苗圃；養魚場","es":"She works as a teacher in a private day nursery for toddlers.","cs":"她在一家私人日託幼兒園擔任教師，照顧幼兒。","d":"A room or other area set aside for the use of babies and young children; a place where young plants are grown."},{"id":1833,"l":4,"w":"nylon","k":"ˋna ɪlɑn","p":"n.","c":"尼龍","es":"The backpack is made of strong, waterproof nylon fabric.","cs":"這個背包是由堅固、防水的尼龍布料製成的。","d":"A tough, light, elastic synthetic polymer used for fabrics and ropes."},{"id":1834,"l":4,"w":"obedience","k":"əˋbidj əns","p":"n.","c":"服從，順從","es":"The soldier showed strict obedience to his commanding officer.","cs":"這名士兵對他的指揮官表現出嚴格的服從。","d":"Compliance with an order, request, or law or submission to another's authority."},{"id":1835,"l":4,"w":"obedient","k":"əˋbidj ənt","p":"adj.","c":"服從的，順從的","es":"The dog is very well-trained and extremely obedient.","cs":"這隻狗訓練有素，非常聽話的。","d":"Complying or willing to comply with an order or request."},{"id":1836,"l":4,"w":"objection","k":"əbˋdʒɛkʃən","p":"n.","c":"反對；異議","es":"The defense lawyer raised an immediate objection to the question.","cs":"辯護律師立即對這個問題提出了反對。","d":"An expression or feeling of disapproval or opposition."},{"id":1837,"l":4,"w":"objective1","k":"əbˋdʒɛktɪv","p":"adj.","c":"客觀的，無偏見的","es":"The primary objective of the meeting is to set the budget for next year.","cs":"會議的首要目標是設定明年的預算。","d":"Not influenced by personal feelings or opinions in considering facts; goal-oriented."},{"id":1838,"l":4,"w":"objective2","k":"əbˋdʒɛktɪv","p":"n.","c":"目的，目標","es":"As a journalist, you must maintain an objective and unbiased view.","cs":"作為一名記者，您必須保持客觀的和公正的觀點。","d":"A thing aimed at or sought; a goal."},{"id":1839,"l":4,"w":"observation","k":"͵ ɑbzɝˋveʃən","p":"n.","c":"觀察；觀測","es":"The scientist's new theory is based on years of careful observation.","cs":"這位科學家的新理論基於多年的仔細觀察。","d":"The action or process of observing something carefully in order to gain information."},{"id":1840,"l":4,"w":"obstacle","k":"ˋ ɑbstək!","p":"n.","c":"障礙 (物)；妨礙","es":"Lack of funding proved to be the biggest obstacle to the project.","cs":"缺乏資金被證明是這個專案最大的障礙。","d":"A thing that blocks one's way or prevents or hinders progress."},{"id":1841,"l":4,"w":"obtain","k":"əbˋten","p":"vt.","c":"得到，獲得","es":"She hopes to obtain a visa to study abroad next semester.","cs":"她希望下學期能獲得簽證出國留學。","d":"To get, acquire, or secure (something)."},{"id":1842,"l":4,"w":"occasional","k":"əˋkeʒən!","p":"adj.","c":"偶爾的，非經常的","es":"The park is quiet, with only the occasional dog walker passing by.","cs":"公園很安靜，只有偶爾的遛狗者經過。","d":"Occurring, appearing, or done infrequently and irregularly."},{"id":1843,"l":4,"w":"occupation","k":"͵ ɑkjəˋpeʃən","p":"n.","c":"佔領 ；職業","es":"Teaching is a highly respected occupation in many countries.","cs":"教學在許多國家是一種高度受人尊敬的職業。","d":"A person's regular paid employment or profession; the act of occupying a place."},{"id":1844,"l":4,"w":"occupy","k":"ˋ ɑkjə͵paɪ","p":"vt.","c":"佔領，佔據","es":"The children would occupy themselves with building sandcastles on the beach.","cs":"孩子們會用在海灘上建造沙堡來使自己忙碌。","d":"To reside or be based in (a place); to fill or use up (time or space)."},{"id":1845,"l":4,"w":"offend","k":"əˋfɛnd","p":"vt.","c":"冒犯；觸怒","es":"I hope my casual remark didn't offend anyone.","cs":"我希望我隨意的評論沒有冒犯任何人。","d":"To cause (someone) to feel upset, annoyed, or resentful."},{"id":1846,"l":4,"w":"offense","k":"əˋfɛns","p":"n.","c":"罪過；犯法 (行為 )；進 攻，攻擊","es":"The politician was charged with a serious financial offense.","cs":"這位政治家被控一項嚴重的金融罪行。","d":"A breach of a law or rule; an illegal act."},{"id":1847,"l":4,"w":"offensive","k":"əˋfɛnsɪv","p":"adj.","c":"冒犯的；進攻的","es":"His jokes were not funny; in fact, they were quite offensive.","cs":"他的笑話並不好笑；事實上，它們相當冒犯的。","d":"Causing someone to feel deeply hurt, upset, or angry; aggressive or attacking."},{"id":1848,"l":4,"w":"opera","k":"ˋ ɑpərə","p":"n.","c":"歌劇 ；歌劇院 ；歌劇 藝術","es":"We bought tickets to see a famous Italian opera at the city theater.","cs":"我們買了票去看市劇院的一部著名義大利歌劇。","d":"A dramatic work in one or more acts, set to music for singers and instrumentalists."},{"id":1849,"l":4,"w":"operation","k":"͵ ɑpəˋreʃən","p":"n.","c":"操作；運轉 ；手 術","es":"The patient is recovering well after the heart operation.","cs":"病人在心臟手術後恢復良好。","d":"The action of functioning or producing an effect; a surgical procedure."},{"id":1850,"l":4,"w":"oppose","k":"əˋpoz","p":"vt.vi.","c":"反對；反抗","es":"Most community members strongly oppose the plan to build a new factory.","cs":"大多數社區成員強烈反對建造新工廠的計畫。","d":"To disapprove of and attempt to prevent (something)."},{"id":1851,"l":4,"w":"oral","k":"ˋor əl","p":"adj.","c":"口頭的，口述的","es":"Students will have an oral examination on the vocabulary next week.","cs":"學生們下週將進行一次關於詞彙的口頭考試。","d":"Spoken rather than written; relating to the mouth."},{"id":1852,"l":4,"w":"orbit","k":"ˋ ɔrbɪt","p":"n.vt.","c":"(天體等的 )運行軌道；環繞 (天體等 )的軌道運行","es":"The new satellite was launched into orbit around the Earth.","cs":"新衛星被發射進入繞地球的軌道。","d":"The curved path of a celestial object or spacecraft around a star, planet, or moon."},{"id":1853,"l":4,"w":"orchestra","k":"ˋ ɔrkɪstrə","p":"n.","c":"管弦樂隊 [C]","es":"The school orchestra performs a concert at the end of every semester.","cs":"學校管弦樂團在每個學期結束時都會舉行一場音樂會。","d":"A group of instrumentalists, especially one combining string, woodwind, brass, and percussion sections."},{"id":1854,"l":4,"w":"organic","k":"ɔrˋgæn ɪk","p":"adj.","c":"有機體的，生物的；器 官的","es":"I prefer to buy organic fruits and vegetables from the local market.","cs":"我更喜歡從當地市場購買有機的水果和蔬菜。","d":"Relating to or derived from living matter; without artificial chemicals."},{"id":1855,"l":4,"w":"otherwise","k":"ˋ ʌðɚ͵waɪz","p":"advt.","c":"否則 ,不然；用別 的方法","es":"You must study hard; otherwise, you will fail the exam.","cs":"您必須努力學習；否則，您將會考試不及格。","d":"In circumstances different from those present or expected."},{"id":1856,"l":4,"w":"outcome","k":"ˋa ʊt͵kʌm","p":"n.","c":"結果；結局","es":"We are all anxiously awaiting the outcome of the election.","cs":"我們都在焦急地等待選舉的結果。","d":"The way a thing turns out; a consequence."},{"id":1857,"l":4,"w":"outstanding","k":"ˋa ʊtˋstænd ɪŋ","p":"adj.","c":"顯著的；傑出的","es":"She received an award for her outstanding contribution to the arts.","cs":"她因對藝術的傑出貢獻而獲得獎項。","d":"Excellent; clearly noticeable; (of a debt) unpaid."},{"id":1858,"l":4,"w":"oval","k":"ˋov!","p":"n.adj.","c":"卵形 (物) ；橢圓形的","es":"The meeting table in the conference room is oval shaped.","cs":"會議室裡的會議桌是橢圓形的。","d":"Having a rounded shape like an egg or an elongated circle."},{"id":1859,"l":4,"w":"overcome","k":"͵ov ɚˋkʌm","p":"vt.vi.","c":"戰勝；克服","es":"She worked hard to overcome her fear of public speaking.","cs":"她努力克服她對公開演講的恐懼。","d":"To succeed in dealing with (a problem or difficulty)."},{"id":1860,"l":4,"w":"overlook","k":"͵ov ɚˋlʊk","p":"vt.vi.","c":"眺望，俯瞰；看漏， 忽略","es":"We have a beautiful apartment that overlooks the park.","cs":"我們有一間可以俯瞰公園的美麗公寓。","d":"To fail to notice (something); to have a view of (something) from above."},{"id":1861,"l":4,"w":"overnight","k":"ˋov ɚˋnaɪt","p":"adj.advt.","c":"整夜；一夜間， 突然","es":"We drove the whole day and stayed overnight at a cheap motel.","cs":"我們開了一整天的車，並在一家便宜的汽車旅館過夜。","d":"For the duration of a night; happening in a very short time."},{"id":1862,"l":4,"w":"overtake","k":"͵ov ɚˋtek","p":"vt.vi.","c":"追上；趕上；超車","es":"The fast sports car quickly overtook the slow truck on the highway.","cs":"這輛快速的跑車在高速公路上很快地超車了這輛慢速的卡車。","d":"To catch up with and pass (someone or something)."},{"id":1863,"l":4,"w":"overthrow","k":"ˋov ɚθro","p":"vt.vi.","c":"打倒；推翻","es":"The rebels successfully managed to overthrow the oppressive government.","cs":"叛軍成功地推翻了這個壓迫性的政府。","d":"To remove forcibly from power; an act of removing from power."},{"id":1864,"l":4,"w":"oxygen","k":"ˋ ɑksədʒən","p":"n.","c":"【化】氧；氧氣","es":"Plants release oxygen into the atmosphere, which we need to breathe.","cs":"植物將氧氣釋放到大氣中，這是我們呼吸所必需的。","d":"A colorless, odorless reactive gaseous element essential to life."},{"id":1865,"l":4,"w":"pace","k":"pes","p":"n.vi.","c":"一步； 步速；速度；踱步， 慢慢地走","es":"The runner started the race at a very fast pace.","cs":"這位跑者以非常快的速度開始了比賽。","d":"A single step taken when walking or running; the speed at which something happens."},{"id":1866,"l":4,"w":"panel","k":"ˋpæn!","p":"n.","c":"嵌(鑲)板； 【機】控制板；專 門小組","es":"The plane's control panel was covered in hundreds of switches.","cs":"這架飛機的控制面板上覆蓋著數百個開關。","d":"A flat, usually rectangular piece of material that forms a part of a wall, door, or cabinet."},{"id":1867,"l":4,"w":"parachute","k":"ˋpær ə͵ʃut","p":"n.","c":"降落傘","es":"The soldier jumped out of the plane with a parachute.","cs":"這位士兵帶著降落傘跳出了飛機。","d":"A cloth canopy that opens to slow the descent of a person or object falling from an aircraft."},{"id":1868,"l":4,"w":"paragraph","k":"ˋpær ə͵græ f","p":"n.","c":"(文章的 )段，節","es":"Please summarize the main idea of the first paragraph.","cs":"請總結第一個段落的主要思想。","d":"A distinct section of a piece of writing, usually dealing with a single theme and indicated by a new line."},{"id":1869,"l":4,"w":"partial","k":"ˋp ɑrʃəl","p":"adj.","c":"部分的，局部的；不公平 的，偏袒的","es":"The building sustained only partial damage from the small fire.","cs":"這棟建築物只受到小火造成的部分損壞。","d":"Existing only in part; favoring one side in a dispute."},{"id":1870,"l":4,"w":"participation","k":"p ɑr͵tɪsəˋpeʃən","p":"n.","c":"參加，參與","es":"High student participation made the school event a success.","cs":"高學生參與率使學校活動取得了成功。","d":"The action of taking part in something."},{"id":1871,"l":4,"w":"participle","k":"ˋp ɑrtəsəp!","p":"n.","c":"【文】分詞","es":"The word 'broken' is the past participle of 'break'.","cs":"單字「broken」是「break」的過去分詞。","d":"A word formed from a verb and used as an adjective or to form compound tenses."},{"id":1872,"l":4,"w":"partnership","k":"ˋp ɑrtnɚ͵ʃɪp","p":"n.","c":"合夥 (或合作 )關 係","es":"The two companies formed a strategic partnership.","cs":"這兩家公司形成了戰略夥伴關係。","d":"The state of being partners; a business owned by two or more people."},{"id":1873,"l":4,"w":"passive","k":"ˋpæs ɪv","p":"adj.","c":"被動的；消極的","es":"The students were encouraged to be active, not passive, learners.","cs":"鼓勵學生做主動的，而不是被動的學習者。","d":"Accepting or allowing what happens or what others do without active response or resistance."},{"id":1874,"l":4,"w":"pasta","k":"ˋp ɑstə","p":"n.","c":"麵糰；義大利麵 (包括通心粉， 細麵條等 )","es":"We made a large bowl of homemade tomato pasta.","cs":"我們做了一大碗自製番茄義大利麵。","d":"A dish originally from Italy consisting of dough made from durum wheat and water, extruded or stamped into various shapes."},{"id":1875,"l":4,"w":"pebble","k":"ˋp ɛb!","p":"n.","c":"小卵石","es":"The children collected smooth, round pebbles on the beach.","cs":"孩子們在海灘上收集光滑、圓形的鵝卵石。","d":"A small stone, typically rounded and worn smooth by water."},{"id":1876,"l":4,"w":"peculiar","k":"p ɪˋkjulj ɚ","p":"adj.","c":"奇怪的；乖癖的","es":"The man had a peculiar habit of talking to himself.","cs":"這位男子有一個奇怪的自言自語的習慣。","d":"Different from what is normal or expected; strange."},{"id":1877,"l":4,"w":"pedal","k":"ˋp ɛd!","p":"n.","c":"踏板；腳蹬","es":"She pressed the accelerator pedal to speed up the car.","cs":"她踩下了油門踏板以加速汽車。","d":"A foot-operated lever or control."},{"id":1878,"l":4,"w":"peer","k":"p ɪr","p":"n.vt.","c":"(地位，能力等 )同等的人；同輩；與 …同等","es":"Teenagers are often influenced heavily by their social peers.","cs":"青少年經常受到他們的社會同儕的嚴重影響。","
