d":"To look intently or with difficulty at someone or something; a person of the same age, status, or ability."},{"id":1879,"l":4,"w":"penalty","k":"`pɛnəltɪ","p":"n.","c":"處罰；刑罰","es":"The maximum penalty for this crime is ten years in prison.","cs":"這項罪行的最高刑罰是十年監禁。","d":"A punishment imposed for breaking a law, rule, or contract."},{"id":1880,"l":4,"w":"percent","k":"p ɚˋsɛnt","p":"n.","c":"百分之一 ；百分率","es":"Only ten percent of the tickets remain unsold.","cs":"只有百分之十的門票尚未售出。","d":"One part in every hundred."},{"id":1881,"l":4,"w":"percentage","k":"p ɚˋsɛntɪdʒ","p":"n.","c":"比例；部分","es":"The percentage of people with access to the internet is increasing.","cs":"能夠上網的人的百分比正在增加。","d":"A rate, number, or amount in each hundred."},{"id":1882,"l":4,"w":"perfection","k":"p ɚˋfɛkʃən","p":"n.","c":"完美","es":"The sculptor aimed for absolute perfection in his work.","cs":"這位雕塑家在他的作品中追求絕對的完美。","d":"The state of being complete and correct in every way; the highest degree of excellence."},{"id":1883,"l":4,"w":"perfume","k":"ˋp ɝfjum","p":"n.","c":"香水；香料","es":"She sprayed a little perfume on her wrist before leaving.","cs":"她在離開前在手腕上噴了一點香水。","d":"A fragrant liquid typically made from essential oils and fixatives."},{"id":1884,"l":4,"w":"permanent","k":"ˋp ɝmənənt","p":"adj.n.","c":"永久的，永恆的；燙髮","es":"The tattoo is a permanent mark on his skin.","cs":"這個刺青是他皮膚上的一個永久的印記。","d":"Lasting or intended to last or remain unchanged indefinitely."},{"id":1885,"l":4,"w":"persuasion","k":"p ɚˋswe ʒən","p":"n.","c":"說服，勸說","es":"She used her powers of persuasion to get the best deal.","cs":"她利用她的說服能力來獲得最好的交易。","d":"The action or process of persuading someone to do or believe something."},{"id":1886,"l":4,"w":"persuasive","k":"pɚˋswes ɪv","p":"adj.","c":"勸說的；有說服力 的","es":"The lawyer made a highly persuasive argument to the jury.","cs":"這位律師向陪審團提出了極具說服力的論點。","d":"Good at persuading someone to do or believe something."},{"id":1887,"l":4,"w":"pessimistic","k":"͵p ɛsəˋmɪstɪk","p":"adj.","c":"悲觀的；悲觀主義的","es":"Despite the positive news, he remained pessimistic about the future.","cs":"儘管有積極的消息，他對未來仍然保持悲觀的。","d":"Tending to see the worst aspect of things or believe that the worst will happen."},{"id":1888,"l":4,"w":"petal","k":"ˋp ɛt!","p":"n.","c":"花瓣","es":"The rose petals were a beautiful, deep red color.","cs":"玫瑰的花瓣是美麗的深紅色。","d":"Each of the segments of the corolla of a flower, which are typically colored."},{"id":1889,"l":4,"w":"phenomenon","k":"f əˋnɑmə͵nɑn","p":"n.","c":"現象 (複數： phenomena, phenomenons)","es":"The Northern Lights are a natural phenomenon visible near the poles.","cs":"北極光是一種在極地附近可見的自然現象。","d":"A fact or situation that is observed to exist or happen, especially one whose cause or explanation is in question."},{"id":1890,"l":4,"w":"philosopher","k":"f əˋlɑsəfɚ","p":"n.","c":"哲學家 •","es":"Plato was a famous Greek philosopher who lived in the 4th century BC.","cs":"柏拉圖是一位生活在公元前 4 世紀的著名希臘哲學家。","d":"A person engaged in philosophy; a thinker."},{"id":1891,"l":4,"w":"philosophical","k":"ˌfɪləˈsɑːfɪkl","p":"adj.","c":"哲學的 ,冷 靜的 ,哲學上的","es":"He remained philosophical about the bad news, accepting it calmly.","cs":"他對這個壞消息保持哲學般的態度，冷靜地接受了它。","d":"Relating to the study of philosophy; or showing a calm attitude towards difficulties."},{"id":1892,"l":4,"w":"philosophy","k":"f əˋlɑsəfɪ","p":"n.","c":"哲學 ；人生觀；主義","es":"She teaches ancient Greek philosophy at the university.","cs":"她在大學教授古希臘哲學。","d":"The study of the fundamental nature of knowledge, reality, and existence."},{"id":1893,"l":4,"w":"photography","k":"f əˋtɑgrəfɪ","p":"n.","c":"攝影術","es":"She is studying professional photography at a specialized art school.","cs":"她在一所專門的藝術學校學習專業攝影。","d":"The art or practice of taking and processing photographs."},{"id":1894,"l":4,"w":"physical","k":"ˋf ɪzɪk!","p":"adj.","c":"身體的，肉體的；物理 (學) 的","es":"He undergoes a routine physical examination every year.","cs":"他每年都會進行一次例行身體的檢查。","d":"Relating to the body as opposed to the mind; relating to things perceived through the senses."},{"id":1895,"l":4,"w":"physician","k":"f ɪˋzɪʃən","p":"n.","c":"醫師；內科醫生 (doctor)","es":"You must consult a licensed physician before taking this medication.","cs":"在服用這種藥物之前，您必須諮詢執業內科醫生。","d":"A person qualified to practice medicine; a doctor."},{"id":1896,"l":4,"w":"physicist","k":"ˋf ɪzɪsɪst","p":"n.","c":"物理學家","es":"The research team includes a world-renowned nuclear physicist.","cs":"這個研究團隊包括一位世界知名的核物理學家。","d":"A scientist who specializes in physics."},{"id":1897,"l":4,"w":"physics","k":"ˋf ɪzɪks","p":"n.","c":"物理學","es":"He is struggling with the advanced concepts in college physics.","cs":"他正在努力應對大學物理學中的進階概念。","d":"The science that deals with matter, energy, motion, and force."},{"id":1898,"l":4,"w":"pianist","k":"p ɪˋænɪst","p":"n.","c":"鋼琴家；鋼琴演奏者","es":"The young pianist won first prize in the national music competition.","cs":"這位年輕的鋼琴家贏得了全國音樂比賽的第一名。","d":"A person who plays the piano."},{"id":1899,"l":4,"w":"pickpocket","k":"ˋp ɪk͵pɑkɪt","p":"n.","c":"扒手","es":"A pickpocket tried to steal his wallet while he was on the crowded train.","cs":"一個扒手在他擁擠的火車上時試圖偷他的皮夾。","d":"A thief who steals things from people's pockets in a crowd."},{"id":1900,"l":4,"w":"pioneer","k":"͵pa ɪəˋnɪr","p":"n.","c":"拓荒者；先驅者 vt.開闢，倡導","es":"Marie Curie was a true pioneer in the field of radio-activity.","cs":"瑪麗·居里是放射性領域一位真正的先驅。","d":"A person who is among the first to explore or settle a new area; a developer of new things."},{"id":1901,"l":4,"w":"pirate","k":"ˋpa ɪrət","p":"n.vt.vi.","c":"海盜；劫掠者；剽竊者；(以海盜方式 )掠奪；盜版","es":"The story is about a brave sailor who defeats a notorious sea pirate.","cs":"這個故事是關於一個打敗臭名昭著的海上海盜的勇敢水手。","d":"A person who attacks and robs ships at sea."},{"id":1902,"l":4,"w":"plentiful","k":"ˋpl ɛntɪfəl","p":"adj.","c":"豐富的，充足的","es":"Food was plentiful at the harvest festival dinner.","cs":"豐收節晚餐上的食物很豐富的。","d":"Existing in or affording great quantities or supply."},{"id":1903,"l":4,"w":"plot","k":"pl ɑt","p":"n.","c":"陰謀；祕密計畫； (小說，戲劇 等的 )情節", g, and usually preceding, a noun or pronoun and expressing a relation to another word (e.g., to, with, from)."},{"id":1920,"l":4,"w":"presentation","k":"͵priz ɛnˋteʃən","p":"n.","c":"贈送；顯示；演 出","es":"He gave a detailed presentation on the company's annual sales.","cs":"他就公司的年度銷售進行了詳細的簡報。","d":"The giving of something to someone; a public performance or display."},{"id":1921,"l":4,"w":"preservation","k":"͵pr ɛzɚˋveʃən","p":"n.","c":"保護；保存；防腐","es":"The preservation of historical buildings is important for the city's heritage.","cs":"歷史建築的保存對於城市的遺產非常重要。","d":"The action of preserving something."},{"id":1922,"l":4,"w":"preserve","k":"pr ɪˋzɝv","p":"vt.vi.","c":"保存，保藏；維護","es":"We must work to preserve the national park's natural beauty.","cs":"我們必須努力保護國家公園的自然美景。","d":"To maintain (something) in its original or existing state; to protect."},{"id":1923,"l":4,"w":"prevention","k":"pr ɪˋvɛnʃən","p":"n.","c":"預防，防止","es":"Fire prevention is the responsibility of everyone in the building.","cs":"預防火災是建築中每個人的責任。","d":"The action of stopping something from happening or arising."},{"id":1924,"l":4,"w":"prime","k":"pra ɪm","p":"adj.","c":"最初的；原始的；主要的；首位的","es":"His prime motivation for the job was the high salary.","cs":"他擔任這份工作的主要動機是高薪水。","d":"Of main importance; the period of a person's life when they are strongest."},{"id":1925,"l":4,"w":"primitive","k":"ˋpr ɪmətɪv","p":"adj.","c":"原始的；遠古的","es":"The tribe still lives in a primitive way, relying on hunting and gathering.","cs":"這個部落仍然以原始的方式生活，依靠狩獵和採集。","d":"Relating to the character of an early stage in the evolutionary or historical development of something."},{"id":1926,"l":4,"w":"privacy","k":"ˋpra ɪvəsɪ","p":"n.","c":"私下；私事；私生活；隱私","es":"She values her personal privacy and rarely uses social media.","cs":"她珍視她的個人隱私，很少使用社交媒體。","d":"The state or condition of being free from being observed or disturbed by other people."},{"id":1927,"l":4,"w":"privilege","k":"ˋpr ɪv!ɪdʒ","p":"n.","c":"特權；優特","es":"It is a privilege to be invited to attend the exclusive event.","cs":"被邀請參加這個專屬活動是一種榮幸。","d":"A special right, advantage, or immunity granted or available only to a particular person or group."},{"id":1928,"l":4,"w":"procedure","k":"pr əˋsidʒɚ","p":"n.","c":"程序；手續；步驟","es":"The doctor explained the complex medical procedure step by step.","cs":"醫生一步一步解釋了複雜的醫療程序。","d":"An established or official way of doing something."},{"id":1929,"l":4,"w":"proceed","k":"pr əˋsid","p":"vt.vi.","c":"繼續進行；開始，著 手","es":"After the storm passed, we were finally able to proceed with our journey.","cs":"暴風雨過後，我們終於能夠繼續進行我們的旅程。","d":"To begin a course of action; to move forward."},{"id":1930,"l":4,"w":"production","k":"pr əˋdʌkʃən","p":"n.","c":"生產；製作","es":"Factory production has increased by 15% this quarter.","cs":"本季度工廠生產量增加了 15%。","d":"The action of manufacturing or growing something in large quantities."},{"id":1931,"l":4,"w":"productive","k":"pr əˋdʌktɪv","p":"adj.","c":"生產的；多產的；肥沃的","es":"I had a very productive day and finished all my assignments.","cs":"我度過了非常有成效的一天，完成了所有作業。","d":"Achieving or producing a significant amount or result."},{"id":1932,"l":4,"w":"profession","k":"pr əˋfɛʃən","p":"n.","c":"(尤指受過專門訓練者，如律師，醫生，教師的 )職業","es":"Teaching is a demanding but rewarding profession.","cs":"教學是一種要求很高但有回報的職業。","d":"A paid occupation, especially one that involves prolonged training and a formal qualification."},{"id":1933,"l":4,"w":"professional","k":"pr əˋfɛʃən!","p":"n.adj.","c":"職業選手；專家， 內行 ；職業 (上)的","es":"The chef offers professional cooking lessons on weekends.","cs":"這位廚師在週末提供專業的烹飪課程。","d":"Relating to or belonging to a profession; a person engaged in a specified activity as their main paid occupation."},{"id":1934,"l":4,"w":"professor","k":"pr əˋfɛsɚ","p":"n.","c":"教授","es":"She became a full professor at the university after earning her Ph.D.","cs":"她在獲得博士學位後成為這所大學的正式教授。","d":"A teacher of the highest rank in a university or college."},{"id":1935,"l":4,"w":"profitable","k":"ˋpr ɑfɪtəb!","p":"adj.","c":"有利的，贏利的；有 益的","es":"Starting a small cafe proved to be a very profitable venture.","cs":"開一家小咖啡館被證明是一項非常有利可圖的事業。","d":"(Of an activity or enterprise) yielding profit or financial gain."},{"id":1936,"l":4,"w":"prominent","k":"ˋpr ɑmənənt","p":"adj.","c":"突出的；顯著的；卓越的","es":"He is a prominent figure in the local business community.","cs":"他是當地商界一位重要的人物。","d":"Important; famous; standing out so as to be seen easily."},{"id":1937,"l":4,"w":"promising","k":"ˋpr ɑmɪsɪŋ","p":"adj.","c":"有希望的，有前途的","es":"The young athlete is a very promising contender for the next Olympics.","cs":"這位年輕運動員是下一屆奧運會一位非常有希望的競爭者。","d":"Showing signs of future success."},{"id":1938,"l":4,"w":"promotion","k":"pr əˋmoʃən","p":"n.","c":"晉級；發揚；提倡；促銷","es":"The new manager received a quick promotion after only a year on the job.","cs":"這位新經理在工作僅一年後就獲得了快速晉升。","d":"The action of advancing or raising someone to a higher position or rank; publicity."},{"id":1939,"l":4,"w":"prompt1","k":"pr ɑmpt","p":"adj.","c":"敏捷的，及時的，迅速 的","es":"You should give a prompt reply to the client's email.","cs":"您應該對客戶的電子郵件給予迅速的回覆。","d":"Done without delay; quick."},{"id":1940,"l":4,"w":"prompt2","k":"pr ɑmpt","p":"vt.","c":"促使；激勵；慫恿","es":"The speech was given without any notes, only a few written prompts.","cs":"這場演講沒有任何筆記，只有一些書面提示。","d":"To cause or bring about (an action or feeling)."},{"id":1941,"l":4,"w":"pronoun","k":"ˋprona ʊn","p":"n.","c":"【文】代名詞","es":"The word 'she' is a third-person singular pronoun.","cs":"單字「she」是第三人稱單數代名詞。","d":"A word that can function by itself as a noun phrase and that refers either to the participants in the discourse (e.g., I, you) or to someone or something mentioned elsewhere (e.g., she, it, this)."},{"id":1942,"l":4,"w":"pronunciation","k":"pr ə͵nʌnsɪˋeʃən","p":"n.","c":"發音；發音法","es":"His English pronunciation is excellent, even though he is not a native speaker.","cs":"儘管他不是母語人士，他的英語發音非常出色。","d":"The way in which a word is pronounced."},{"id":1943,"l":4,"w":"prosper","k":"ˋpr ɑspɚ","p":"vi.vt.","c":"(使)繁榮， (使)昌盛；(使)成功","es":"The small business began to prosper once the economy improved.","cs":"一旦經濟好轉，這家小企業就開始繁榮起來。","d":"To succeed in material terms; be financially successful."},{"id":1944,"l":4,"w":"prosperity","k":"pr ɑsˋpɛrətɪ","p":"n.","c":"興旺，繁榮，昌盛， 成功","es":"The nation is currently enjoying a period of great economic prosperity.","cs":"這個國家目前正享受著一段偉大的經濟繁榮期。","d":"The state of being successful usually by making a lot of money."},{"id":1945,"l":4,"w":"prosperous","k":"ˋpr ɑspərəs","p":"adj.","c":"興旺的，繁榮的， 昌盛的","es":"We wish you a happy and prosperous New Year.","cs":"我們祝您新年快樂、繁榮的。","d":"Successful in material terms; flourishing financially."},{"id":1946,"l":4,"w":"protein","k":"ˋproti ɪn","p":"n.","c":"蛋白質","es":"Meat, eggs, and beans are all good sources of protein.","cs":"肉類、雞蛋和豆類都是蛋白質的良好來源。","d":"An organic compound essential to all living organisms as a structural component of body tissues."},{"id":1947,"l":4,"w":"protest","k":"pr əˋtɛst","p":"vi.n.","c":"抗議，反對","es":"Workers staged a peaceful protest outside the factory demanding better pay.","cs":"工人們在工廠外舉行了和平抗議，要求提高工資。","d":"A statement or action expressing disapproval of or objection to something."},{"id":1948,"l":4,"w":"proverb","k":"ˋpr ɑvɝb","p":"n.","c":"諺語，俗語","es":"The old proverb says, \"Where there's a will, there's a way.\"","cs":"這句古老的諺語說：「有志者事竟成。」","d":"A short, well-known saying stating a general truth or piece of advice."},{"id":1949,"l":4,"w":"psychological","k":"͵sa ɪkəˋlɑdʒɪk!","p":"adj.","c":"心理學的","es":"The patient is receiving treatment for a psychological disorder.","cs":"這位患者正在接受心理上的疾病治療。","d":"Relating to the mind or to psychology."},{"id":1950,"l":4,"w":"psychologist","k":"sa ɪˋkɑlədʒɪst","p":"n.","c":"心理學家","es":"She is training to become a clinical psychologist.","cs":"她正在培訓成為一名臨床心理學家。","d":"An expert or specialist in psychology."},{"id":1951,"l":4,"w":"psychology","k":"sa ɪˋkɑlədʒɪ","p":"n.","c":"心理學","es":"He is studying child psychology at university.","cs":"他在大學裡學習兒童心理學。","d":"The scientific study of the human mind and its functions, especially those affecting behavior."},{"id":1952,"l":4,"w":"publication","k":"͵p ʌblɪˋkeʃən","p":"n.","c":"出版；發行 ；出版物；刊物","es":"The magazine's first publication date was set for next month.","cs":"這本雜誌的首個出版日期定於下個月。","d":"The preparation and issuing of a book or journal for public sale; a book or journal issued for public sale."},{"id":1953,"l":4,"w":"publicity","k":"p ʌbˋlɪsətɪ","p":"n.","c":"(公眾的 )注意，名聲；宣傳","es":"The film generated a lot of negative publicity due to the star's comments.","cs":"由於這位明星的評論，這部電影產生了許多負面宣傳。","d":"Attention or notice directed at someone or something by the media."},{"id":1954,"l":4,"w":"publish","k":"ˋp ʌblɪʃ","p":"vt.vi.","c":"出版；發行","es":"The author hopes to publish his first novel next year.","cs":"這位作者希望明年能出版他的第一本小說。","d":"To prepare and issue (a book, journal, or piece of music) for public sale."},{"id":1955,"l":4,"w":"publisher","k":"ˋp ʌblɪʃɚ","p":"n.","c":"出版 (或發行 )者","es":"The book's publisher decided to print an additional 10,000 copies.","cs":"這本書的出版商決定再印刷 10,000 本。","d":"A person or company that prepares and issues books, journals, or music for sale."},{"id":1956,"l":4,"w":"pursuit","k":"p ɚˋsut","p":"n.","c":"追蹤，追擊；追求，尋求","es":"He moved to Paris in pursuit of his dream of becoming an artist.","cs":"他搬到巴黎，追逐他成為藝術家的夢想。","d":"The action of following or pursuing someone or something; an activity that one engages in as a pastime."},{"id":1957,"l":4,"w":"quake","k":"kwek","p":"n.vi.","c":"顫抖，哆嗦；震動","es":"The small quake shook the glasses on the shelf but caused no damage.","cs":"這場小地震搖晃了架子上的玻璃杯，但沒有造成損壞。","d":"To shake or tremble; an earthquake."},{"id":1958,"l":4,"w":"quilt","k":"kw ɪlt","p":"n.","c":"被(子)；被褥","es":"She made a beautiful handmade quilt from different colored fabrics.","cs":"她用不同顏色的布料做了一條漂亮的手工棉被。","d":"A warm bed covering made of padding enclosed between two layers of fabric."},{"id":1959,"l":4,"w":"quotation","k":"kwoˋte ʃən","p":"n.","c":"引用，引證 ；引 文；語錄","es":"He started his speech with a famous quotation from a former president.","cs":"他以一位前總統的著名引文開始了他的演講。","d":"A group of words taken from a text or speech and repeated by someone other than the original author or speaker."},{"id":1960,"l":4,"w":"rage","k":"red ʒ","p":"n.vi.","c":"(一陣 )狂怒，盛怒；發怒， 怒斥","es":"She flew into a rage when she realized her car had been stolen.","cs":"當她意識到自己的車被偷時，她勃然大怒。","d":"Violent uncontrollable anger."},{"id":1961,"l":4,"w":"rainfall","k":"ˋren͵f ɔl","p":"n.","c":"降雨，下雨","es":"The region has experienced a significant drop in annual rainfall.","cs":"這個地區的年降雨量顯著下降。","d":"The amount of rain that falls in a particular area during a particular amount of time."},{"id":1962,"l":4,"w":"realistic","k":"r ɪəˋlɪstɪk","p":"adj.","c":"現實的，注重實際的；現實主義的","es":"We need to set realistic goals that we can actually achieve.","cs":"我們需要設定我們可以實際實現的現實的目標。","d":"Representing things in a way that is accurate and true to life; sensible and practical."},{"id":1963,"l":4,"w":"rebel vi造反；反叛","k":"r ɪˋbɛl","p":"n.","c":"造反者；反抗者","es":"The citizens decided to rebel against the unfair new taxes.","cs":"公民們決定反抗不公平的新稅收。","d":"A person who rises in opposition or armed resistance against an established government or ruler."},{"id":1964,"l":4,"w":"recall","k":"r ɪˋkɔl","p":"n.vt.vi.","c":"回想，回憶","es":"I can barely recall the events of that evening.","cs":"我幾乎無法回想起那個晚上的事件。","d":"To bring (a fact, event, or situation) back into one's mind; to remember."},{"id":1965,"l":4,"w":"reception","k":"r ɪˋsɛpʃən","p":"n.","c":"接收；接待；歡迎；接待會","es":"The wedding reception will be held at a seaside hotel.","cs":"婚禮招待會將在一家海濱飯店舉行。","d":"The action or process of receiving something; an area in a hotel or office where guests are welcomed."},{"id":1966,"l":4,"w":"recipe","k":"ˋr ɛsəpɪ","p":"n.","c":"食譜","es":"She followed the family recipe to bake her grandmother's famous cake.","cs":"她按照家庭食譜烤了她祖母著名的蛋糕。","d":"A set of instructions for preparing a particular dish."},{"id":1967,"l":4,"w":"recite","k":"riˋsa ɪt","p":"vt.vi.","c":"背誦；朗誦","es":"The students were asked to recite a poem they had memorized.","cs":"學生們被要求背誦一首他們已背下的詩。","d":"To repeat aloud (a poem or passage) from memory."},{"id":1968,"l":4,"w":"recognition","k":"͵r ɛkəgˋnɪʃən","p":"n.","c":"認出，識別；認 可","es":"The artist finally received international recognition for his work.","cs":"這位藝術家的作品終於獲得了國際認可。","d":"Identification of a person or thing from previous encounters or knowledge."},{"id":1969,"l":4,"w":"recovery","k":"r ɪˋkʌvərɪ","p":"n.","c":"重獲；恢復，復甦","es":"The doctor is pleased with the patient's fast recovery after the illness.","cs":"醫生對病人在患病後快速恢復感到滿意。","d":"A return to a normal state of health, mind, or strength."},{"id":1970,"l":4,"w":"recreation","k":"͵r ɛkrɪˋeʃən","p":"n.","c":"消遣；娛樂","es":"Reading and hiking are my favorite forms of recreation.","cs":"閱讀和徒步旅行是我最喜歡的消遣方式。","d":"Activity done for enjoyment when one is not working."},{"id":1971,"l":4,"w":"recycle","k":"riˋsa ɪk!","p":"vt.","c":"使再循環；再利用","es":"We try to recycle all paper, glass, and plastic waste at home.","cs":"我們試著在家中回收所有紙張、玻璃和塑膠垃圾。","d":"To convert (waste) into reusable material."},{"id":1972,"l":4,"w":"reduction","k":"r ɪˋdʌkʃən","p":"n.","c":"減少；削減； 【數】簡化","es":"The company announced a significant reduction in the price of their newest product.","cs":"該公司宣布其最新產品的價格大幅降低。","d":"The action or fact of making something smaller or less in amount, degree, or size."},{"id":1973,"l":4,"w":"refer","k":"r ɪˋfɝ","p":"vt.vi.","c":"把…歸因於；將 …提交 ；談到；參考；打聽；涉及","es":"The manager will refer your question to the specialist team.","cs":"經理會將您的問題轉交給專家團隊。","d":"To mention or allude to (something); to pass (a matter) to for a decision."},{"id":1974,"l":4,"w":"reference","k":"ˋr ɛfərəns","p":"n.","c":"提及；提交；參考","es":"Please provide the names and contact details of two professional references.","cs":"請提供兩位專業推薦人的姓名和聯絡方式。","d":"The action of mentioning or alluding to something; a source of information."},{"id":1975,"l":4,"w":"reflect","k":"r ɪˋflɛkt","p":"vt.vi.","c":"反射；思考，反省","es":"The smooth surface of the lake began to reflect the clear blue sky.","cs":"湖泊光滑的表面開始反射清澈的藍天。","d":"To throw back (light, heat, or sound); to show an image of; to think deeply or carefully."},{"id":1976,"l":4,"w":"reflection","k":"r ɪˋflɛkʃən","p":"n.","c":"反射；回響；深思， 熟慮","es":"He looked at his own reflection in the mirror and smiled.","cs":"他看著鏡子裡自己的倒影，笑了。","d":"The throwing back of light, heat, or sound by a surface; serious thought or consideration."},{"id":1977,"l":4,"w":"reform","k":"͵r ɪˋfɔrm","p":"n.vt.","c":"改革，革新","es":"The government has promised to reform the country's tax system.","cs":"政府已承諾改革國家的稅收制度。","d":"The improvement or amendment of what is wrong, corrupt, or unsatisfactory."},{"id":1978,"l":4,"w":"refresh","k":"r ɪˋfrɛʃ","p":"vt.vi.","c":"(使)清新；消除 (…)疲勞","es":"I took a short walk to refresh my mind before the next meeting.","cs":"我短暫散步以在下一次會議前提振我的精神。","d":"To give (someone) new strength or energy; to update."},{"id":1979,"l":4,"w":"refugee","k":"͵r ɛfjʊˋdʒi","p":"n.","c":"難民；流亡者","es":"The organization is working to provide aid to the war refugees.","cs":"這個組織正在努力向戰爭難民提供援助。","d":"A person who has been forced to leave their country in order to escape war, persecution, or natural disaster."},{"id":1980,"l":4,"w":"refusal","k":"r ɪˋfjuz!","p":"n.","c":"拒絕","es":"Her flat refusal to help was disappointing to everyone.","cs":"她斷然拒絕提供幫助讓所有人都很失望。","d":"The act of refusing to do or accept something."},{"id":1981,"l":4,"w":"regarding","k":"r ɪˋgɑrdɪŋ","p":"prep.","c":"關於；就 …而論","es":"I have a question regarding the submission deadline for the project.","cs":"我有一個關於專案提交截止日期的問題。","d":"Concerning; with regard to."},{"id":1982,"l":4,"w":"register","k":"ˋr ɛdʒɪstɚ","p":"n.vt.vi.","c":"登記，註冊","es":"You need to register your car with the local transport office.","cs":"您需要向當地的交通辦公室註冊您的汽車。","d":"To record or enroll formally."},{"id":1983,"l":4,"w":"registration","k":"͵r ɛdʒɪˋstreʃən","p":"n.","c":"登記，註冊，掛 號","es":"All guests must complete their registration before receiving their room keys.","cs":"所有客人都必須在領取房間鑰匙之前完成他們的登記。","d":"The action or process of registering or being registered."},{"id":1984,"l":4,"w":"regulate","k":"ˋr ɛgjə͵let","p":"vt.vi.","c":"管理；控制；校準；調節","es":"New laws have been introduced to regulate the banking industry.","cs":"已經引入新的法律來規範銀行業。","d":"To control or maintain the rate or speed of (a machine or process) so that it operates properly."},{"id":1985,"l":4,"w":"regulation","k":"͵r ɛgjəˋleʃən","p":"n.","c":"規章；規則 ；管 理；調整","es":"The new traffic regulations state that all cyclists must wear helmets.","cs":"新的交通規定要求所有騎自行車的人必須戴頭盔。","d":"A rule or directive made and maintained by an authority."},{"id":1986,"l":4,"w":"rejection","k":"r ɪˋdʒɛkʃən","p":"n.","c":"拒絕；退回； 【醫】 排斥","es":"She was disappointed by the rejection letter from the university.","cs":"她對大學的拒絕信感到失望。","d":"The dismissal or refusing to accept a proposal or idea."},{"id":1987,"l":4,"w":"relative1","k":"ˋr ɛlətɪv","p":"n.adj.","c":"親戚，親屬； 【文】關係詞 ；與…有關係的","es":"He is a distant relative of the famous movie star.","cs":"他是這位著名影星的一個遠房親戚。","d":"Considered in relation or in proportion to something else."},{"id":1988,"l":4,"w":"relative2","k":"ˋr ɛlətɪv","p":"adj.","c":"相對的，比較的","es":"The cost of living is high relative to the average income.","cs":"生活費用相對於平均收入來說很高。","d":"A person connected by blood or marriage."},{"id":1989,"l":4,"w":"relaxation","k":"͵rilæksˋe ʃən","p":"n.","c":"鬆弛，放鬆","es":"I find that reading a book is the best way for relaxation.","cs":"我發現閱讀書籍是最好的放鬆方式。","d":"The state of being relaxed or free from tension and anxiety."},{"id":1990,"l":4,"w":"relieve","k":"r ɪˋliv","p":"vt.vi.","c":"緩和，減輕；解除","es":"Taking aspirin can help to relieve headache pain.","cs":"服用阿斯匹靈可以幫助減輕頭痛。","d":"To cause (pain, distress, or difficulty) to become less severe or serious."},{"id":1991,"l":4,"w":"reluctant","k":"r ɪˋlʌktənt","p":"adj.","c":"不情願的；勉強的","es":"He was reluctant to admit that he had made a mistake.","cs":"他不情願承認自己犯了一個錯誤。","d":"Unwilling and hesitant."},{"id":1992,"l":4,"w":"remark","k":"r ɪˋmɑrk","p":"vi.n.","c":"談到；評論；說；注意；察覺","es":"He made a quick, clever remark that made everyone laugh.","cs":"他說了一句機智、巧妙的話語，讓所有人都笑了。","d":"A written or spoken comment."},{"id":1993,"l":4,"w":"remarkable","k":"r ɪˋmɑrkəb!","p":"adj.","c":"值得注意的；非凡 卓越的","es":"She has shown a remarkable improvement in her exam scores.","cs":"她的考試成績顯示出非凡的進步。","d":"Worthy of attention; striking."},{"id":1994,"l":4,"w":"remedy","k":"ˋr ɛmədɪ","p":"n.","c":"治療；治療法；藥物","es":"Traditional medicine offers a natural remedy for cold symptoms.","cs":"傳統醫學為感冒症狀提供了一種自然的療法。","d":"A medicine or treatment for a disease or injury; to put right."},{"id":1995,"l":4,"w":"repetition","k":"͵r ɛpɪˋtɪʃən","p":"n.","c":"重複；反覆","es":"The repetition of key ideas helped the audience remember them.","cs":"關鍵思想的重複幫助觀眾記住了它們。","d":"The action of repeating something."},{"id":1996,"l":4,"w":"representation","k":"͵r ɛprɪzɛnˋteʃən","p":"n.","c":"代表；代表 權；表示，表現","es":"The graph provides a clear representation of the survey data.","cs":"這張圖表清晰地呈現了調查數據。","d":"The action of speaking or acting on behalf of someone; a depiction of something."},{"id":1997,"l":4,"w":"reputation","k":"͵r ɛpjəˋteʃən","p":"n.","c":"名譽，名聲","es":"The company has an excellent reputation for customer service.","cs":"這家公司在客戶服務方面有極好的聲譽。","d":"The beliefs or opinions that are generally held about someone or something."},{"id":1998,"l":4,"w":"rescue","k":"ˋr ɛskju","p":"n.vt.","c":"援救；營救","es":"The Coast Guard conducted a dramatic rescue of the stranded sailors.","cs":"海岸警衛隊對被困的水手進行了一次戲劇性的救援。","d":"To save (someone) from a dangerous or difficult situation."},{"id":1999,"l":4,"w":"research","k":"r ɪˋsɝtʃ","p":"n.vi.vt.","c":"( 學術 )研究；調查， 探究","es":"Scientists are conducting new research into climate change.","cs":"科學家們正在進行有關氣候變化的新研究。","d":"The systematic investigation into materials and sources in order to establish facts and reach new conclusions."},{"id":2000,"l":4,"w":"researcher","k":"riˋs ɝtʃɚ","p":"n.","c":"研究員；調查者","es":"The lead researcher presented his findings at the conference.","cs":"這位首席研究員在會議上介紹了他的研究結果。","d":"A person who carries out academic or scientific research."},{"id":2001,"l":4,"w":"resemble","k":"r ɪˋzɛmb!","p":"vt.","c":"像，類似","es":"The little boy strongly resembles his father when he was young.","cs":"這個小男孩年輕時非常像他的父親。","d":"To have qualities or features in common with (someone or something); look or seem like."},{"id":2002,"l":4,"w":"reservation","k":"͵r ɛzɚˋveʃən","p":"n.","c":"保留 (意見 )；自然保護區；預訂的房間(或席座 )","es":"We made a dinner reservation for 7:00 pm at the new restaurant.","cs":"我們在新餐廳預訂了晚上 7 點的晚餐預約。","d":"An arrangement by which something is secured in advance; a doubt or misgiving."},{"id":2003,"l":4,"w":"resign","k":"r ɪˋzaɪn","p":"vt.vi.","c":"放棄，辭職","es":"She decided to resign from her position as team leader.","cs":"她決定辭去她作為團隊領導的職位。","d":"To voluntarily leave a job or other position."},{"id":2004,"l":4,"w":"resignation","k":"͵r ɛzɪgˋneʃən","p":"n.","c":"辭職；放棄；辭 呈","es":"The manager handed in his formal resignation letter today.","cs":"這位經理今天遞交了他的正式辭職信。","d":"The act of giving up a job or office; an unresisting acceptance of an undesirable situation."},{"id":2005,"l":4,"w":"resistance","k":"r ɪˋzɪstəns","p":"n.","c":"抵抗，反抗 ，抵抗力；電阻","es":"The new material offers strong resistance to fire and heat.","cs":"這種新材料對火和熱提供了強大的抵抗力。","d":"The act of resisting or opposing something."},{"id":2006,"l":4,"w":"resolution","k":"͵r ɛzəˋluʃən","p":"n.","c":"決心；決定 ；(會議等的 )正式決定【電腦】解析度","es":"The UN passed a resolution to address the humanitarian crisis.","cs":"聯合國通過了一項決議來應對人道主義危機。","d":"A firm decision to do or not to do something; the quality of being resolute."},{"id":2007,"l":4,"w":"resolve","k":"r ɪˋzɑlv","p":"vt.vi.","c":"決心，決定；解決 ;解 答；議決","es":"The two nations met to resolve their long-standing border conflict.","cs":"這兩個國家會面以解決他們長期存在的邊境衝突。","d":"To settle or find a solution to (a problem)."},{"id":2008,"l":4,"w":"respectable","k":"r ɪˋspɛktəb!","p":"adj.","c":"值得尊敬的","es":"She comes from a well-known, respectable family in the town.","cs":"她來自鎮上一個知名、值得尊敬的家庭。","d":"Regarded by society as proper, correct, and good."},{"id":2009,"l":4,"w":"respectful","k":"r ɪˋspɛktfəl","p":"adj.","c":"恭敬的；尊敬人的","es":"The students were taught to be respectful towards their elders.","cs":"學生們被教導要對長輩保持尊重的態度。","d":"Showing or feeling respect."},{"id":2010,"l":4,"w":"restore","k":"rɪ`stɔr","p":"vt.vi.","c":"恢復；使復原；修復， 整修","es":"The government is trying to restore public confidence in the economy.","cs":"政府正試圖恢復公眾對經濟的信心。","d":"to return something or someone to an earlier good condition or position."},{"id":2011,"l":4,"w":"restriction","k":"r ɪˋstrɪkʃən","p":"n.","c":"限制；約束","es":"There are strict restrictions on the use of water during the drought.","cs":"在乾旱期間，用水有嚴格的限制。","d":"A limiting condition or measure."},{"id":2012,"l":4,"w":"retain","k":"r ɪˋten","p":"vt.","c":"保留，保持","es":"The company plans to retain all its current employees after the merger.","cs":"該公司計畫在合併後保留所有現有員工。","d":"To continue to have (something); keep possession of."},{"id":2013,"l":4,"w":"retire","k":"r ɪˋtaɪr","p":"vt.vi.","c":"(使)退休； (令)退役","es":"He plans to retire early and spend his time traveling.","cs":"他計畫提前退休，並將時間用於旅行。","d":"To leave one's job and cease to work, typically upon reaching a certain age."},{"id":2014,"l":4,"w":"retirement","k":"r ɪˋtaɪrmənt","p":"n.","c":"退休；退職","es":"She received a gold watch as a gift upon her retirement.","cs":"她在退休時收到了一塊金錶作為禮物。","d":"The action or fact of leaving one's job and ceasing to work."},{"id":2015,"l":4,"w":"retreat","k":"r ɪˋtrit","p":"n.vi.vt.","c":"撤退；隱退處；休養所；撤退，退卻","es":"The soldiers were ordered to retreat to a safer position.","cs":"士兵們被命令撤退到一個更安全的位置。","d":"To withdraw from enemy forces as a result of defeat or a tactical decision."},{"id":2016,"l":4,"w":"reunion","k":"riˋjunj ən","p":"n.","c":"再聯合； (親友等的 )團 聚，重聚","es":"The class organized a ten-year school reunion party.","cs":"這個班級組織了一場十年校友聚會派對。","d":"The action of being reunited; a social gathering of people who have not met for some time."},{"id":2017,"l":4,"w":"revenge","k":"r ɪˋvɛndʒ","p":"vt.n.","c":"替…報仇；報仇；報復","es":"He vowed to take revenge on the person who wronged him.","cs":"他發誓要對冤枉他的人進行報復。","d":"The action of inflicting hurt or harm on someone for an injury or wrong suffered."},{"id":2018,"l":4,"w":"revise","k":"r ɪˋvaɪz","p":"vt.vi.","c":"修訂；校訂","es":"The author had to revise the entire second chapter of the book.","cs":"作者必須修改這本書的整個第二章。","d":"To re-examine and make alterations to (written or printed matter)."},{"id":2019,"l":4,"w":"revision","k":"r ɪˋvɪʒən","p":"n.","c":"修訂；修訂本，訂正版","es":"The final version of the report included several major revisions.","cs":"報告的最終版本包括了幾項重大的修改。","d":"The action of revising (a book, piece of writing, etc.)."},{"id":2020,"l":4,"w":"revolution","k":"͵r ɛvəˋluʃən","p":"n.","c":"革命； (天體的 )運 行，公轉","es":"The invention of the internet marked a technological revolution.","cs":"網際網路的發明標誌著一場技術革命。","d":"A forcible overthrow of a government or social order; a sudden, dramatic change."},{"id":2021,"l":4,"w":"revolutionary","k":"͵r ɛvəˋluʃən͵ɛrɪ","p":"adj.","c":"革命的","es":"The company's new product is truly revolutionary in the market.","cs":"這家公司的新產品在市場上是真正的革命性的。","d":"Involving or causing a complete or dramatic change; a person who promotes radical change."},{"id":2022,"l":4,"w":"reward","k":"r ɪˋwɔrd","p":"n.vt.","c":"報答；報償；獎賞","es":"He received a monetary reward for returning the lost wallet.","cs":"他因歸還失物而獲得了金錢獎勵。","d":"A thing given in recognition of one's service, effort, or achievement."},{"id":2023,"l":4,"w":"rhyme","k":"ra ɪm","p":"n.vi.","c":"韻，韻腳；押韻","es":"The children read a book of poems with simple, funny rhymes.","cs":"孩子們讀了一本有簡單、有趣韻腳的詩集。","d":"Correspondence of sound between words or the endings of words, especially when used at the ends of lines of poetry."},{"id":2024,"l":4,"w":"rhythm","k":"ˋr ɪðəm","p":"n.","c":"節奏；韻律 ；節拍","es":"She danced gracefully to the fast rhythm of the music.","cs":"她隨著音樂快速的節奏優雅地跳舞。","d":"A strong, regular, repeated pattern of movement or sound."},{"id":2025,"l":4,"w":"romance","k":"roˋmæns","p":"n.","c":"愛情小說；浪漫情調","es":"The film is a classic Hollywood romance set in the 1940s.","cs":"這部電影是一部設定在 1940 年代的經典好萊塢浪漫故事。","d":"A feeling of excitement and mystery associated with love; a love affair."},{"id":2026,"l":4,"w":"roughly","k":"ˋr ʌflɪ","p":"advt.","c":"粗糙地；粗略地；大體上；大約","es":"The repair job will cost roughly five hundred dollars.","cs":"維修工作將大致花費五百美元。","d":"In a manner lacking refinement or gentleness; approximately."},{"id":2027,"l":4,"w":"route","k":"rut","p":"n.","c":"路；路線；航線","es":"We took the scenic coastal route instead of the freeway.","cs":"我們選擇了風景優美的沿海路線，而不是高速公路。","d":"A way or course taken in getting from a starting point to a destination."},{"id":2028,"l":4,"w":"ruin","k":"ˋr ʊɪn","p":"n.vt.vi.","c":"毀滅；崩潰；毀壞 ；廢墟；遺跡；毀滅；崩潰","es":"The old castle has been left to slowly ruin over centuries.","cs":"這座古老的城堡已被放任數世紀，緩慢地毀壞。","d":"The physical destruction or disintegration of something; to cause to fail."},{"id":2029,"l":4,"w":"rural","k":"ˋr ʊrəl","p":"adj.","c":"農村的；田園的","es":"She prefers the quiet life in a rural village over the city.","cs":"她喜歡鄉村的安靜生活勝過城市。","d":"Relating to the country rather than the town."},{"id":2030,"l":4,"w":"sacrifice","k":"ˋsækr ə͵faɪs","p":"n.vt.","c":"(供神的 )牲禮，祭品；犧牲；犧牲；獻出","es":"She had to sacrifice a lot of her free time to finish the project.","cs":"她不得不犧牲大量的空閒時間來完成這個專案。","d":"An act of slaughtering an animal or person or surrendering a possession as an offering to a god; a loss."},{"id":2031,"l":4,"w":"salary","k":"ˋsæl ərɪ","p":"n.","c":"薪資，薪水","es":"The average monthly salary in this industry is quite high.","cs":"這個行業的平均月薪水相當高。","d":"A fixed regular payment, typically paid on a monthly or annual basis, made by an employer to an employee."},{"id":2032,"l":4,"w":"salesperson","k":"ˋselz͵p ɚsn","p":"n.","c":"店員，售貨員 (salesman)","es":"The salesperson was very helpful in explaining the features of the car.","cs":"這位銷售人員在解釋汽車功能方面非常有幫助。","d":"A person whose job is to sell goods or services."},{"id":2033,"l":4,"w":"saleswoman","k":"ˋselz͵w ʊmən","p":"n.","c":"女店員；售貨 員","es":"The top saleswoman in the department won a trip to Hawaii.","cs":"部門中頂尖的女銷售員贏得了夏威夷之旅。","d":"A woman whose job is to sell goods or services."},{"id":2034,"l":4,"w":"satellite","k":"ˋsæt!͵a ɪt","p":"n.","c":"衛星；人造衛星","es":"The weather forecast relies on images sent from satellites in space.","cs":"天氣預報依賴於從太空中的衛星傳送的圖像。","d":"An artificial body placed in orbit around the earth or another planet to collect or transmit information; a celestial body orbiting a planet or star."},{"id":2035,"l":4,"w":"satisfaction","k":"͵sæt ɪsˋfæk ʃən","p":"n.","c":"滿意，滿足","es":"She derived great satisfaction from helping others in need.","cs":"她從幫助有需要的人那裡獲得了巨大的滿足。","d":"Fulfillment of one's wishes, expectations, or needs; the pleasure derived from this."},{"id":2036,"l":4,"w":"scarcely","k":"ˋsk ɛrslɪ","p":"advt.","c":"幾乎不，幾乎沒有","es":"He had scarcely started eating when the phone rang loudly.","cs":"他幾乎還沒有開始吃飯，電話就大聲響起。","d":"Only just; almost not."},{"id":2037,"l":4,"w":"scenery","k":"ˋs inərɪ","p":"n.","c":"風景，景色","es":"The train ride offered beautiful views of the mountain scenery.","cs":"這趟火車之旅提供了美麗的山間風景。","d":"The natural features of a landscape considered in terms of their appearance."},{"id":2038,"l":4,"w":"scold","k":"skold","p":"vt.vi.n.","c":"罵，責罵","es":"The mother gently scolded her child for drawing on the walls.","cs":"母親溫和地責罵她的孩子在牆上亂畫。","d":"To rebuke (someone) angrily."},{"id":2039,"l":4,"w":"scratch","k":"skræ t ʃ","p":"n.vt.vi.","c":"抓；搔；擦；刮","es":"The cat left a long scratch mark on the wooden door.","cs":"貓在木門上留下了一道長長的刮痕。","d":"To mark or wound (someone or something) with a sharp object."},{"id":2040,"l":4,"w":"screwdriver","k":"ˋskru͵dra ɪvɚ","p":"n.","c":"螺絲起子","es":"He used a screwdriver to remove the old door handle.","cs":"他使用一把螺絲起子拆下舊門把手。","d":"A tool for turning screws, typically with a handle and a metal shank."},{"id":2041,"l":4,"w":"sculpture","k":"ˋsk ʌlptʃɚ","p":"n.","c":"雕塑品；雕像 ；雕 刻術","es":"The museum installed a new abstract metal sculpture in the courtyard.","cs":"博物館在庭院裡安裝了一個新的抽象金屬雕塑。","d":"The art of making two- or three-dimensional forms by carving stone, casting metal, or molding clay."},{"id":2042,"l":4,"w":"seagull","k":"ˋsig ʌl","p":"n.","c":"海鷗 (gull)","es":"A seagull swooped down to try and steal a chip from my hand.","cs":"一隻海鷗俯衝下來，試圖從我手中偷走一片薯條。","d":"A large bird typically with white and gray plumage and a heavy bill, living near the sea."},{"id":2043,"l":4,"w":"senior","k":"ˋsinj ɚ","p":"adj.n.","c":"年長的，前輩的；四年級生的；學長；前輩；上司","es":"The most difficult courses are reserved for senior university students.","cs":"最困難的課程是為大四學生保留的。","d":"Of or for older people; having a higher position or rank."},{"id":2044,"l":4,"w":"settler","k":"ˋs ɛtlɚ","p":"n.","c":"移居者；殖民者； (糾紛等 的)解決者","es":"The early settlers faced many challenges in the new land.","cs":"早期定居者在新土地上面臨許多挑戰。","d":"A person who moves into a new country or area to establish a permanent residence."},{"id":2045,"l":4,"w":"severe","k":"s əˋvɪr","p":"adj.","c":"嚴重的；劇烈的；嚴厲的；嚴肅的","es":"The region experienced a severe drought that lasted for three years.","cs":"這個地區經歷了一場持續三年的嚴重的乾旱。","d":"Very intense; harsh or strict."},{"id":2046,"l":4,"w":"shameful","k":"ˋ ʃemfəl","p":"adj.","c":"可恥的，丟臉的","es":"It was a shameful moment when the politician was caught lying.","cs":"當這位政治家被抓到說謊時，這是一個可恥的時刻。","d":"Causing shame."},{"id":2047,"l":4,"w":"shaver","k":"ˋ ʃevɚ","p":"n.","c":"理髮師；刮鬍鬚的用具","es":"He used his electric shaver to quickly trim his beard.","cs":"他使用他的電動刮鬍刀快速修剪鬍鬚。","d":"An electric razor; a young person."},{"id":2048,"l":4,"w":"shelter","k":"ˋ ʃɛltɚ","p":"n.","c":"遮蓋物；躲避處；避難所 vt.遮蔽；庇護","es":"We took shelter from the rain under a large tree.","cs":"我們在一棵大樹下躲避雨水。","d":"A place providing protection from bad weather or danger."},{"id":2049,"l":4,"w":"shift","k":"ʃɪft","p":"vt.vi.n.","c":"轉移；移動，換 (檔) ；轉換；轉移；輪班","es":"The factory workers have to work an eight-hour night shift.","cs":"工廠工人必須上八小時的夜班。","d":"A slight change in position, direction, or tendency; a person's scheduled period of work."},{"id":2050,"l":4,"w":"shortsighted","k":"ˋ ʃɔrtˋsaɪtɪd","p":"adj.","c":"近視的；目光短淺 的","es":"Investing all your money in a risky venture is a shortsighted decision.","cs":"將所有錢投資於一項有風險的事業是一個目光短淺的決定。","d":"Unable to see things clearly unless they are relatively close to the eyes; nearsighted."},{"id":2051,"l":4,"w":"shrug","k":"ʃrʌg","p":"n.vi.vt.","c":"( 表示疑惑，蔑視，無奈 等)聳肩","es":"When asked if he knew the answer, he simply gave an indifferent shrug.","cs":"當被問及是否知道答案時，他只是冷漠地聳聳肩。","d":"To raise (one's shoulders) slightly and momentarily to express doubt, ignorance, or indifference."},{"id":2052,"l":4,"w":"shuttle","k":"ˋ ʃʌt!","p":"n.","c":"(紡織機的 )梭子；接駁車；太空梭；羽毛球","es":"A free shuttle bus runs between the airport and the hotel.","cs":"一輛免費的接駁車在機場和飯店之間運行。","d":"A form of transport that travels regularly between two places."},{"id":2053,"l":4,"w":"sightseeing","k":"ˋsa ɪt͵siɪŋ","p":"n.","c":"觀光，遊覽","es":"They spent the day sightseeing and visiting all the major landmarks.","cs":"他們花了一天觀光，參觀了所有主要地標。","d":"The activity of visiting places of interest."},{"id":2054,"l":4,"w":"signature","k":"ˋs ɪgnətʃɚ","p":"n.","c":"簽名，簽署； (人物 ) 識別標誌","es":"Please write your full name and signature at the bottom of the form.","cs":"請在表格底部寫上您的全名和簽名。","d":"A person's name written in a distinctive way as a form of identification or authorization."},{"id":2055,"l":4,"w":"significance","k":"s ɪgˋnɪfəkəns","p":"n.","c":"重要性，重要","es":"The discovery has major significance for the future of medicine.","cs":"這項發現對醫學的未來具有重大的重要性。","d":"The quality of being worthy of attention; importance."},{"id":2056,"l":4,"w":"sincerity","k":"s ɪnˋsɛrətɪ","p":"n.","c":"真實；誠心誠意","es":"The boss doubted the sincerity of the employee's apology.","cs":"老闆懷疑這位員工道歉的誠意。","d":"The quality or state of being sincere or genuine."},{"id":2057,"l":4,"w":"singular","k":"ˋs ɪŋgjəlɚ","p":"adj.n.","c":"【文】單數的；【文】 單數 (形)","es":"The word 'dog' is the singular form of 'dogs'.","cs":"單字「dog」是「dogs」的單數形式。","d":"Referring to just one person or thing; exceptionally good or unique."},{"id":2058,"l":4,"w":"site","k":"sa ɪt","p":"n.","c":"地點，場所； 【電腦】網點","es":"The construction workers prepared the site for the new building.","cs":"建築工人準備了新建築的地點。","d":"An area of ground on which a town, building, or monument is constructed; a location."},{"id":2059,"l":4,"w":"sketch","k":"sk ɛtʃ","p":"n.vt.vi.","c":"速寫，素描","es":"He quickly drew a sketch of the model's face with charcoal.","cs":"他用木炭快速畫了一張模特兒臉部的素描。","d":"A rough or unfinished drawing or painting."},{"id":2060,"l":4,"w":"sledge","k":"sl ɛdʒ","p":"n.vt.vi.","c":"雪橇 ；乘雪橇 ；用雪橇 運送 (=sled)","es":"The children loved riding the wooden sledge down the snowy hill.","cs":"孩子們喜歡乘坐木製雪橇滑下雪坡。","d":"A vehicle on runners, used for sliding over snow or ice; a large, heavy hammer."},{"id":2061,"l":4,"w":"sleigh","k":"sle","p":"n.vt.vi.","c":"雪橇 ；乘雪橇 ；用雪橇運送 (=sled)","es":"The image of Santa Claus in a sleigh is traditional at Christmas.","cs":"聖誕老人坐在雪橇上的形象是聖誕節的傳統。","d":"A sled on runners pulled by horses or reindeer over snow or ice."},{"id":2062,"l":4,"w":"slight","k":"sla ɪt","p":"adj.","c":"輕微的；微小的；少量的","es":"I felt a slight chill when the wind blew through the window.","cs":"當風吹過窗戶時，我感到了一點輕微的寒意。","d":"Small in degree; to insult (someone) by treating them without proper respect."},{"id":2063,"l":4,"w":"slogan","k":"ˋslog ən","p":"n.","c":"口號，標語","es":"The company adopted a new marketing slogan for its campaign.","cs":"這家公司為其活動採用了一個新的行銷標語。","d":"A short and striking or memorable phrase used in advertising or politics."},{"id":2064,"l":4,"w":"smog","k":"sm ɑg","p":"n.","c":"煙霧 (= smoke and fog)","es":"The city was covered in a thick layer of industrial smog.","cs":"這座城市被一層厚厚的工業煙霧覆蓋。","d":"Fog or haze intensified by smoke or other pollutants."},{"id":2065,"l":4,"w":"sneeze","k":"sniz","p":"vi.n.","c":"打噴嚏 ；噴嚏 (聲)","es":"The dust caused him to sneeze violently several times.","cs":"灰塵讓他猛烈地打噴嚏了好幾次。","d":"To expel air from the nose and mouth by a sudden involuntary spasm."},{"id":2066,"l":4,"w":"sob","k":"s ɑb","p":"vi.vt.n.","c":"嗚咽；啜泣","es":"She began to sob quietly after hearing the bad news.","cs":"聽到壞消息後，她開始輕聲啜泣。","d":"To cry noisily, making loud, convulsive gasps."},{"id":2067,"l":4,"w":"socket","k":"ˋs ɑkɪt","p":"n.","c":"托座，承口； 【電】插座；插口","es":"I need to find a spare wall socket to charge my phone.","cs":"我需要找到一個備用的牆上插座來充電我的手機。","d":"A natural or artificial hollow into which something fits; an electrical outlet."},{"id":2068,"l":4,"w":"software","k":"ˋs ɔft͵wɛr","p":"n.","c":"【電腦】軟體","es":"The new computer comes pre-installed with the latest operating software.","cs":"這台新電腦預裝了最新的作業軟體。","d":"The programs and other operating information used by a computer."},{"id":2069,"l":4,"w":"solar","k":"ˋsol ɚ","p":"adj.","c":"太陽的；日光的","es":"The roof is covered with solar panels to generate electricity.","cs":"屋頂覆蓋著太陽能板以發電。","d":"Relating to the sun."},{"id":2070,"l":4,"w":"sophomore","k":"ˋs ɑfmor","p":"n.","c":"(大學，高中的 )二年 級學生","es":"He is currently a sophomore in his second year of high school.","cs":"他目前是一名高中二年級的二年級學生。","d":"A student in the second year of high school or college."},{"id":2071,"l":4,"w":"sorrowful","k":"ˋs ɑrəfəl","p":"adj.","c":"悲傷的，傷心的","es":"The entire community was sorrowful after the town leader passed away.","cs":"鎮領導去世後，整個社區都感到悲傷的。","d":"Feeling or showing deep distress or sadness."},{"id":2072,"l":4,"w":"souvenir","k":"͵suv əˋnɪr","p":"n.","c":"紀念品，紀念物","es":"I bought a small carved wooden elephant as a souvenir of my trip.","cs":"我買了一隻小型的木雕大象作為旅行的紀念品。","d":"A thing that is kept as a reminder of a person, place, or event."},{"id":2073,"l":4,"w":"spare","k":"sp ɛr","p":"vt. a.","c":"分出，騰出 (時間 )；節 約  多餘的；備用的","es":"Luckily, I keep a spare key hidden just in case I lose mine.","cs":"幸運的是，我藏了一把備用鑰匙以防我弄丟我的。","d":"Additional to what is required for ordinary use; extra."},{"id":2074,"l":4,"w":"spark","k":"sp ɑrk","p":"n.vt.","c":"火花，火星；發動；點燃","es":"The friction between the stones produced a small fiery spark.","cs":"石頭之間的摩擦產生了一個微小的火焰火花。","d":"A small fiery particle thrown off from a burning substance; a small flash of light."},{"id":2075,"l":4,"w":"sparkle","k":"ˋsp ɑrk!","p":"n.vi.","c":"火花；閃耀，閃光 ；發火花；閃耀","es":"The diamond ring began to sparkle brightly under the sunlight.","cs":"鑽戒在陽光下開始閃耀出亮光。","d":"To shine brightly with flashes of light."},{"id":2076,"l":4,"w":"sparrow","k":"ˋspæro","p":"n.","c":"麻雀","es":"A small brown sparrow was chirping loudly on the windowsill.","cs":"一隻棕色的小麻雀在窗台上大聲鳴叫。","d":"A small, brown and grey bird that is common in most parts of the world."},{"id":2077,"l":4,"w":"spear","k":"sp ɪr","p":"n.","c":"矛；魚叉","es":"The ancient hunter used a wooden spear to catch fish.","cs":"這位古代獵人使用木製矛來捕魚。","d":"A weapon with a long shaft and a pointed head, used for thrusting or throwing."},{"id":2078,"l":4,"w":"species","k":"ˋspi ʃiz","p":"n.","c":"種類； 【生】物種","es":"Scientists are working to protect endangered species around the world.","cs":"科學家們正在努力保護世界各地瀕危的物種。","d":"A group of living organisms consisting of similar individuals capable of exchanging genes."},{"id":2079,"l":4,"w":"spicy","k":"ˈspaɪsi","p":"adj.","c":"加有香料的；香的；辛辣的","es":"I really enjoy eating spicy food like Thai curry.","cs":"我非常喜歡吃像泰式咖哩這樣的辛辣食物。","d":"Flavored with or containing strong spices; hot to the taste."},{"id":2080,"l":4,"w":"spiritual","k":"ˋsp ɪrɪtʃʊəl","p":"adj.","c":"精神 (上)的，心靈的","es":"He went on a long retreat to focus on his spiritual growth.","cs":"他進行了一次長期的靜修，以專注於他的精神的成長。","d":"Relating to or affecting the human spirit or soul."},{"id":2081,"l":4,"w":"splendid","k":"ˋspl ɛndɪd","p":"adj.","c":"有光彩的；燦爛的；極 好的","es":"We had a splendid time at the dinner party last night.","cs":"我們昨晚在晚宴上度過了一段極好的時光。","d":"Magnificent; very impressive."},{"id":2082,"l":4,"w":"split","k":"spl ɪt","p":"vt.vi.n.","c":"劈開；切開 ；裂縫，裂痕； (體操中的 )劈腿","es":"The long wooden fence began to split after years of sun and rain.","cs":"這道長長的木柵欄在多年的日曬雨淋後開始裂開。","d":"To break or cause to break lengthwise; a division."},{"id":2083,"l":4,"w":"sportsman","k":"ˋsportsm ən","p":"n.","c":"喜好運動的人；運 動員","es":"He is known for being a true gentleman and an excellent sportsman.","cs":"他以一位真正的紳士和出色的運動員而聞名。","d":"A man who takes part in sports, especially one who is highly skilled."},{"id":2084,"l":4,"w":"sportsmanship","k":"ˋsportsm ən͵ʃɪp","p":"n.","c":"運動員精 神","es":"The team showed great sportsmanship by shaking hands after the loss.","cs":"該隊在輸掉比賽後透過握手展現了偉大的運動家精神。","d":"Fair and generous behavior or treatment of others, especially in a sports contest."},{"id":2085,"l":4,"w":"status","k":"ˋstet əs","p":"n.","c":"地位，身分；情形，狀況","es":"He achieved celebrity status after his movie became a hit.","cs":"他的電影大受歡迎後，他獲得了名人地位。","d":"Relative social or professional position; position in relation to others."},{"id":2086,"l":4,"w":"stem","k":"st ɛm","p":"n.vi.","c":"莖， (樹)幹， (葉)柄 ；起源於，由 …而造成","es":"The rose has a long, thorny stem.","cs":"這朵玫瑰有一個長而多刺的莖。","d":"The main body or stalk of a plant; to originate from."},{"id":2087,"l":4,"w":"stingy","k":"ˋst ɪndʒɪ","p":"adj.","c":"吝嗇的，小氣的","es":"He is so stingy that he never buys gifts for anyone.","cs":"他非常吝嗇，從不為任何人買禮物。","d":"Unwilling to give or spend; not generous."},{"id":2088,"l":4,"w":"strengthen","k":"ˋstr ɛŋθən","p":"vt.vi.","c":"加強；增強；鞏 固","es":"The government plans to strengthen border security measures.","cs":"政府計畫加強邊境安全措施。","d":"To make or become stronger."},{"id":2089,"l":4,"w":"strive","k":"stra ɪv","p":"vi.","c":"努力，苦幹，奮鬥","es":"You must strive for excellence in all your academic work.","cs":"您必須在所有學術工作中努力追求卓越。","d":"To make great efforts to achieve or obtain something."},{"id":2090,"l":4,"w":"stroke1","k":"strok","p":"n.","c":"打，擊，敲； (病)突然發作；中風","es":"The patient suffered a major stroke and needed rehabilitation.","cs":"這位病人遭受了一次重大的中風，需要復健。","d":"An act of hitting or striking; a sudden disabling attack, especially due to a blockage of blood to the brain."},{"id":2091,"l":4,"w":"stroke2","k":"strok","p":"vt.n.","c":"( 用手 )撫，摸，捋","es":"She gently stroked the cat's fur to comfort it.","cs":"她輕輕地撫摸貓的毛來安慰牠。","d":"To gently move one's hand over (a surface)."},{"id":2092,"l":4,"w":"submarine","k":"ˋs ʌbmə͵rin","p":"n.adj.","c":"潛水艇；海底的","es":"The explorer used a small research submarine to go deep underwater.","cs":"這位探險家使用一艘小型研究潛水艇深入水下。","d":"A warship designed to operate completely submerged in the sea."},{"id":2093,"l":4,"w":"suggestion","k":"s əˋdʒɛstʃən","p":"n.","c":"建議，提議；暗示","es":"I have a small suggestion for improving the new design.","cs":"我有一個關於改進新設計的微小建議。","d":"An idea or plan put forward for consideration."},{"id":2094,"l":4,"w":"summarize","k":"ˋs ʌmə͵raɪz","p":"vt.vi.","c":"總結，概述","es":"Please summarize the main points of the chapter in one page.","cs":"請在一頁內總結本章的主要觀點。","d":"To give a brief statement of the main points of (something)."},{"id":2095,"l":4,"w":"surf","k":"s ɝf","p":"vt.vi.","c":"衝浪；快速瀏覽","es":"He loves to surf the massive waves on the coast of Hawaii.","cs":"他喜歡在夏威夷海岸衝巨大的海浪。","d":"To ride on the crest of a wave, typically on a surfboard."},{"id":2096,"l":4,"w":"surgeon","k":"ˋs ɝdʒən","p":"n.","c":"外科醫生","es":"The complex procedure was performed by a specialized cardiac surgeon.","cs":"這個複雜的手術是由一位專門的心臟外科醫生進行的。","d":"A medical practitioner specialized in surgery."},{"id":2097,"l":4,"w":"surgery","k":"ˋs ɝdʒərɪ","p":"n.","c":"外科， (外科 )手術 ；手術室","es":"She had to undergo knee surgery after the sports injury.","cs":"運動受傷後，她不得不接受膝蓋手術。","d":"Medical treatment involving incision with instruments."},{"id":2098,"l":4,"w":"surrender","k":"s əˋrɛndɚ","p":"vi.vt.n.","c":"投降，自首","es":"The enemy forces finally agreed to surrender after the long siege.","cs":"經過長時間的圍攻，敵軍最終同意投降。","d":"To stop resisting an enemy or opponent and submit to their authority."},{"id":2099,"l":4,"w":"surroundings","k":"s əˋraʊndɪŋz","p":"n.","c":"環境；周圍的事 物","es":"The hotel is situated in beautiful, peaceful surroundings.","cs":"這家飯店坐落在美麗、寧靜的環境中。","d":"The things and conditions around a person or thing."},{"id":2100,"l":4,"w":"suspicious","k":"s əˋspɪʃəs","p":"adj.","c":"猜疑的，可疑的","es":"The police officer's suspicious was aroused by the man's nervous behavior.","cs":"這位警察的懷疑被這名男子緊張的行為所激起。","d":"Having or showing a cautious distrust of someone or something."},{"id":2101,"l":4,"w":"sway","k":"swe","p":"vt.vi.n.","c":"搖動，搖擺","es":"The trees began to sway violently in the strong wind.","cs":"樹木在強風中開始猛烈搖擺。","d":"To move or cause to move slowly or rhythmically backward and forward."},{"id":2102,"l":4,"w":"syllable","k":"ˋs ɪləb!","p":"n.","c":"音節","es":"The word 'beautiful' has three syllables: beau-ti-ful.","cs":"單字「beautiful」有三個音節：beau-ti-ful。","d":"A unit of pronunciation having one vowel sound, with or without surrounding consonants."},{"id":2103,"l":4,"w":"sympathetic","k":"͵s ɪmpəˋθɛtɪk","p":"adj.","c":"同情的；有同情 心的","es":"She was very sympathetic after hearing about his recent troubles.","cs":"聽到他最近的麻煩後，她表示非常同情的。","d":"Feeling, showing, or expressing sympathy."},{"id":2104,"l":4,"w":"sympathy","k":"ˋs ɪmpəθɪ","p":"n.","c":"同情，同情心","es":"I offer my deep sympathy to the family for their loss.","cs":"我對這個家庭的損失表示深切的同情。","d":"Feelings of pity and sorrow for someone else's misfortune."},{"id":2105,"l":4,"w":"symphony","k":"ˋs ɪmfənɪ","p":"n.","c":"交響樂，交響曲","es":"The orchestra will perform Beethoven's Fifth Symphony tonight.","cs":"管弦樂團今晚將演奏貝多芬的第五交響曲。","d":"An elaborate musical composition for a full orchestra, typically in four movements."},{"id":2106,"l":4,"w":"syrup","k":"ˋs ɪrəp","p":"n.","c":"糖漿；果汁","es":"She poured maple syrup over the pancakes for breakfast.","cs":"她在早餐時將楓樹糖漿倒在鬆餅上。","d":"A thick, sweet liquid made by dissolving sugar in water, often containing flavoring or medicine."},{"id":2107,"l":4,"w":"systematic","k":"͵s ɪstəˋmæt ɪk","p":"adj.","c":"有系統的；有條 理的","es":"The technician used a systematic approach to troubleshoot the complex machine.","cs":"技術人員使用系統的方法來排除複雜機器的故障。","d":"Done or acting according to a fixed plan or system; methodical."},{"id":2108,"l":4,"w":"tap1","k":"tæ p","p":"n. vi.","c":"塞子，栓子；竊 聽器 裝上塞子 (嘴子 )","es":"I heard someone tap lightly on the window.","cs":"我聽到有人輕輕地敲擊窗戶。","d":"A device giving control over the flow of a liquid from a pipe or container (faucet)."},{"id":2109,"l":4,"w":"tap2","k":"tæ p","p":"n.vt.vi.","c":"輕拍，輕叩，輕敲","es":"I turned on the tap to fill the glass with water.","cs":"我打開了水龍頭用水裝滿玻璃杯。","d":"To strike lightly and quickly."},{"id":2110,"l":4,"w":"technician","k":"t ɛkˋnɪʃən","p":"n.","c":"技術人員，技師","es":"We called a computer technician to fix the network problem.","cs":"我們叫了一位電腦技術人員來解決網路問題。","d":"A person skilled in the practical application of a science or art."},{"id":2111,"l":4,"w":"technologic al","k":"tɛknəˋlɑdʒɪk!","p":"adj.","c":"技術 (學)的， 工藝 (學)的","es":"This device represents a huge technological leap forward.","cs":"這個裝置代表了巨大的技術上的飛躍。","d":"Relating to or involving technology."},{"id":2112,"l":4,"w":"telegram","k":"ˋt ɛlə͵græ m","p":"n.","c":"電報","es":"The good news was sent to the family via an old-fashioned telegram.","cs":"好消息是以一份老式的電報發送給這個家庭的。","d":"A message sent by telegraph and delivered in written form."},{"id":2113,"l":4,"w":"telegraph","k":"ˋt ɛlə͵græ f","p":"n.","c":"電報","es":"The invention of the telegraph revolutionized communication.","cs":"電報的發明徹底改變了通訊。","d":"A system for transmitting messages from a distance along a wire, creating signals by making and breaking an electrical connection."},{"id":2114,"l":4,"w":"telescope","k":"ˋt ɛlə͵skop","p":"n.","c":"(單筒 )望遠鏡","es":"Astronomers use a powerful telescope to observe distant galaxies.","cs":"天文學家使用強大的望遠鏡來觀察遙遠的星系。","d":"An optical instrument designed to make distant objects appear nearer."},{"id":2115,"l":4,"w":"tendency","k":"ˋt ɛndənsɪ","p":"n.","c":"傾向；癖性；趨勢， 潮流","es":"He has a tendency to overthink small problems.","cs":"他有傾向對小問題想太多。","d":"An inclination toward a particular characteristic or type of behavior."},{"id":2116,"l":4,"w":"tense","k":"t ɛns","p":"adj.n.","c":"拉緊的，繃緊的；【文】 (動詞的 )時態，時式","es":"The atmosphere in the room was very tense before the results were announced.","cs":"在結果公佈之前，房間裡的氣氛非常緊張的。","d":"Stretched tight or rigid; nervous or anxious; a set of verb forms."},{"id":2117,"l":4,"w":"tension","k":"ˋt ɛnʃən","p":"n.","c":"拉緊，繃緊 ；(精神上 的)緊張","es":"The political tension between the two countries has recently increased.","cs":"這兩個國家之間的政治緊張局勢最近有所增加。","d":"The state of being stretched tight; mental or emotional strain."},{"id":2118,"l":4,"w":"terrify","k":"ˋt ɛrə͵faɪ","p":"vt.vi.","c":"使害怕，使恐怖","es":"The thought of falling from the high cliff would terrify anyone.","cs":"從高懸崖墜落的想法會使任何人感到恐懼。","d":"To fill with extreme fear."},{"id":2119,"l":4,"w":"terror","k":"ˋt ɛrɚ","p":"n.","c":"恐怖，驚駭 ；引起恐怖的事物 (或人 )","es":"The loud thunder and lightning filled the small child with terror.","cs":"巨大的雷聲和閃電讓這個小孩子充滿了恐懼。","d":"Extreme fear."},{"id":2120,"l":4,"w":"theme","k":"θim","p":"n.","c":"論題，話題；主題，主題思想","es":"The main theme of the novel is the struggle between good and evil.","cs":"這部小說的主要主題是善與惡之間的鬥爭。","d":"The subject of a talk, piece of writing, or exhibition; a recurring idea."},{"id":2121,"l":4,"w":"thorough","k":"ˋθ ɝo","p":"adj.","c":"徹底的；完全的","es":"The mechanic gave the car a thorough inspection.","cs":"這位技工對汽車進行了一次徹底的檢查。","d":"Done or acting accurately and with great attention to detail."},{"id":2122,"l":4,"w":"thoughtful","k":"ˋθ ɔtfəl","p":"adj.","c":"深思的；細心的；體貼 的","es":"It was very thoughtful of him to bring flowers for the host.","cs":"他為主人帶來鮮花是非常體貼的。","d":"Showing consideration for the needs of other people; quiet and reflective."},{"id":2123,"l":4,"w":"timid","k":"ˋt ɪmɪd","p":"adj.","c":"膽小的，易受驚的","es":"The timid child hid behind his mother when strangers approached.","cs":"當陌生人靠近時，這個膽小的孩子躲在他母親身後。","d":"Showing a lack of courage or confidence; easily frightened."},{"id":2124,"l":4,"w":"tiresome","k":"ˋta ɪrsəm","p":"adj.","c":"使人疲勞的；令人厭倦 的","es":"Repetitive tasks like folding laundry can be quite tiresome.","cs":"像折疊衣物這樣重複性的任務可能會非常令人厭倦的。","d":"Causing one to feel bored or annoyed."},{"id":2125,"l":4,"w":"tolerable","k":"ˋt ɑlərəb!","p":"adj.","c":"可忍受的；可容忍的","es":"The pain was intense, but still tolerable with the medication.","cs":"疼痛很劇烈，但在藥物的幫助下仍然是可忍受的。","d":"Able to be endured; moderately good."},{"id":2126,"l":4,"w":"tolerance","k":"ˋt ɑlərəns","p":"n.","c":"寬容，寬大 ；忍耐 (力)","es":"We should show greater tolerance for different cultures and beliefs.","cs":"我們應該對不同的文化和信仰表現出更大的容忍。","d":"The ability or willingness to tolerate something; the maximum allowable deviation."},{"id":2127,"l":4,"w":"tolerant","k":"ˋt ɑlərənt","p":"adj.","c":"忍受的，容忍的","es":"She is very tolerant of her loud and messy roommate.","cs":"她對她吵鬧又凌亂的室友非常寬容的。","d":"Showing willingness to allow the existence of opinions or behavior that one does not necessarily agree with."},{"id":2128,"l":4,"w":"tolerate","k":"ˋt ɑlə͵ret","p":"vt.vi.","c":"忍受；容忍","es":"I cannot tolerate that kind of rude behavior in my house.","cs":"我不能容忍在我家裡出現那種粗魯的行為。","d":"To accept or endure (someone or something unpleasant or disliked) without protest."},{"id":2129,"l":4,"w":"tomb","k":"tum","p":"n.","c":"墓；墓碑","es":"Archaeologists discovered an ancient royal tomb in the valley.","cs":"考古學家在山谷中發現了一座古代皇家墳墓。","d":"A large vault, chamber, or grave for the dead."},{"id":2130,"l":4,"w":"tough","k":"t ʌf","p":"adj.","c":"堅韌的；強壯的；棘手的，費 勁的","es":"Finishing the marathon in the heat was a really tough challenge.","cs":"在高溫下跑完馬拉松是一個非常艱難的挑戰。","d":"Strong enough to withstand adverse conditions or rough handling; difficult and resilient."},{"id":2131,"l":4,"w":"tragedy","k":"ˋtræd ʒədɪ","p":"n.","c":"悲劇體裁 ；(一齣 ) 悲劇","es":"The sudden loss of the ship was a terrible sea tragedy.","cs":"這艘船突然失事是一場可怕的海上悲劇。","d":"An event causing great suffering, destruction, and distress, such as a serious accident or disaster."},{"id":2132,"l":4,"w":"tragic","k":"ˋtræd ʒɪk","p":"adj.","c":"悲劇的；悲慘的，不幸的","es":"The car crash was a tragic event that resulted in three deaths.","cs":"這場車禍是一件悲慘的事件，導致三人死亡。","d":"Causing or characterized by extreme distress or sorrow."},{"id":2133,"l":4,"w":"transfer","k":"trænsˋf ɝ","p":"vt.vi.n.","c":"轉換；換車；轉校 ；遷移；調任 (者)；轉校 (生)","es":"The company plans to transfer the employee to the overseas branch office.","cs":"該公司計畫將這位員工調職到海外分公司。","d":"To move from one place to another."},{"id":2134,"l":4,"w":"transform","k":"trænsˋf ɔrm","p":"vt.vi.","c":"( 使)改變； (使) 改觀","es":"The internet has completely transformed the way we communicate.","cs":"網際網路已徹底改變了我們溝通的方式。","d":"To make a dramatic change in the form, appearance, or character of."},{"id":2135,"l":4,"w":"translate","k":"trænsˋlet","p":"vt.vi.","c":"翻譯，轉譯","es":"Can you translate this German document into English for me?","cs":"您能為我翻譯這份德文文件成英文嗎？","d":"To express the meaning of (words or text) in another language."},{"id":2136,"l":4,"w":"translation","k":"trænsˋle ʃən","p":"n.","c":"翻譯 ；譯文；譯本","es":"The new book is a French novel with a beautiful English translation.","cs":"這本新書是一本有優美英文翻譯的法國小說。","d":"The process of translating words or text from one language into another."},{"id":2137,"l":4,"w":"translator","k":"trænsˋlet ɚ","p":"n.","c":"翻譯員，翻譯者，翻 譯家","es":"A professional translator was hired for the international conference.","cs":"國際會議聘請了一位專業翻譯員。","d":"A person who translates from one language into another."},{"id":2138,"l":4,"w":"transportation","k":"͵trænsp ɚˋteʃən","p":"n.","c":"運輸 ;運 輸工具","es":"The city needs a better public transportation system to reduce traffic jams.","cs":"這個城市需要一個更好的公共運輸系統來減少交通堵塞。","d":"The action of transporting someone or something or the means of being transported."},{"id":2139,"l":4,"w":"tremendous","k":"tr ɪˋmɛndəs","p":"adj.","c":"巨大的，極大的","es":"The movie was a tremendous success, earning millions at the box office.","cs":"這部電影取得了巨大的成功，在票房上賺了數百萬。","d":"Extremely large or powerful; excellent."},{"id":2140,"l":4,"w":"tribal","k":"tra ɪb!","p":"adj.","c":"部落的，種族的","es":"The film explores the customs and beliefs of a remote tribal society.","cs":"這部電影探索了一個偏遠部落的社會習俗和信仰。","d":"Relating to a tribe or tribes."},{"id":2141,"l":4,"w":"triumph","k":"ˋtra ɪəmf","p":"n.","c":"(大)勝利； (大)成功 vi.獲得勝利 (或成功 )","es":"Winning the championship was the greatest triumph of his career.","cs":"贏得冠軍是他職業生涯中最偉大的勝利。","d":"A great victory or achievement."},{"id":2142,"l":4,"w":"troublesome","k":"ˋtr ʌb!səm","p":"adj.","c":"麻煩的，棘手的","es":"Dealing with all the paperwork for the visa was very troublesome.","cs":"處理所有簽證文件非常麻煩的。","d":"Causing difficulty or annoyance."},{"id":2143,"l":4,"w":"tug-of-war","k":"t ʌg əv wɔr","p":"n.","c":"拔河 (比賽 )","es":"The two teams competed in a fierce game of tug-of-war.","cs":"這兩支隊伍進行了一場激烈的拔河比賽。","d":"A contest in which two teams pull at opposite ends of a rope."},{"id":2144,"l":4,"w":"twinkle","k":"ˋtw ɪŋk!","p":"n.vi.","c":"( 星等 )閃爍；閃耀","es":"At night, the distant stars began to twinkle in the dark sky.","cs":"在晚上，遙遠的星星開始在黑暗的天空中閃爍。","d":"(Of a star or light) to shine with a rapidly changing brightness; to sparkle."},{"id":2145,"l":4,"w":"typist","k":"ˋta ɪpɪst","p":"n.","c":"打字員；打字者","es":"The job requires a skilled and fast typist to transcribe notes.","cs":"這份工作需要一位熟練且快速的打字員來轉錄筆記。","d":"A person who types, especially one employed to do so."},{"id":2146,"l":4,"w":"underpass","k":"ˋ ʌndɚ͵pæ s","p":"n.","c":"地下道；地下人行 道","es":"We drove through the underpass to avoid the busy intersection.","cs":"我們開車穿過地下道以避開繁忙的十字路口。","d":"A road or tunnel passing under another road or railroad."},{"id":2147,"l":4,"w":"unique","k":"juˋnik","p":"adj.","c":"唯一的，獨一無二的","es":"Each snowflake has a unique shape and structure.","cs":"每個雪花都有一個獨特的形狀和結構。","d":"Being the only one of its kind; unlike anything else."},{"id":2148,"l":4,"w":"universal","k":"͵jun əˋvɝs!","p":"adj.","c":"全體的；普遍的；一 般的","es":"The desire for happiness is a universal human feeling.","cs":"對幸福的渴望是一種普遍的人類情感。","d":"Relating to, affecting, or true for all people or things; worldwide."},{"id":2149,"l":4,"w":"university","k":"ˌjuːnɪˈvɜːrsəti","p":"n.","c":"大學","es":"She applied to a prestigious university to study medicine.","cs":"她申請了一所知名大學攻讀醫學。","d":"An educational institution designed for instruction, examination, or both, of students in many branches of advanced learning."},{"id":2150,"l":4,"w":"upload","k":"ʌpˋlod","p":"vt.vi.","c":"【電腦】上傳","es":"You need to upload your completed assignment to the class website.","cs":"您需要將完成的作業上傳到課程網站。","d":"To transfer (data) from one computer system to another, typically a smaller one to a larger one."},{"id":2151,"l":4,"w":"urban","k":"ˋ ɝbən","p":"adj.","c":"城市的","es":"She moved from a urban environment to a quieter, rural area.","cs":"她從都市的環境搬到了更安靜的鄉村地區。","d":"Relating to a city or town."},{"id":2152,"l":4,"w":"urge","k":"ɝdʒ","p":"vt.vi.n.","c":"催促；力勸；慫恿 ；強烈的慾望；衝動","es":"I felt a sudden urge to call my old friend after seeing his photo.","cs":"看到他照片後，我感到一股想打電話給老朋友的突然衝動。","d":"To try earnestly or persistently to persuade (someone to do something); a strong desire or impulse."},{"id":2153,"l":4,"w":"urgent","k":"ˋ ɝdʒənt","p":"adj.","c":"緊急的，急迫的","es":"The patient needs an urgent operation to save his life.","cs":"這位病人需要進行一個緊急的手術來挽救他的生命。","d":"Requiring immediate action or attention."},{"id":2154,"l":4,"w":"usage","k":"ˋjus ɪdʒ","p":"n.","c":"使用，用法","es":"The grammar book explains the proper usage of all common idioms.","cs":"這本語法書解釋了所有常見成語的正確用法。","d":"The action of using something or the fact of being used."},{"id":2155,"l":4,"w":"vain","k":"ven","p":"adj.","c":"愛虛榮的，自負的；徒然的， 無益的","es":"All his efforts to fix the broken computer proved to be in vain.","cs":"他所有修復這台壞電腦的努力都證明是徒勞的。","d":"Producing no result; useless; excessively proud of one's own appearance or achievements."},{"id":2156,"l":4,"w":"vast","k":"væ st","p":"adj.","c":"廣闊的，廣大的，巨大的；巨 額的","es":"The explorers looked out across the vast expanse of the ocean.","cs":"探險者們眺望著海洋廣闊的延伸。","d":"Of very great extent or quantity; immense."},{"id":2157,"l":4,"w":"vegetarian","k":"͵v ɛdʒəˋtɛrɪən","p":"n.","c":"素食者；食草動 物 a.素食主義者的；吃素的","es":"As a vegetarian, she eats no meat, fish, or poultry.","cs":"作為一個素食者，她不吃肉、魚或家禽。","d":"A person who does not eat meat or fish."},{"id":2158,"l":4,"w":"verb","k":"v ɝb","p":"n.","c":"【文】動詞","es":"In the sentence \"The cat is sleeping,\" \"is sleeping\" is the main verb phrase.","cs":"在句子「貓正在睡覺」中，「is sleeping」是主要的動詞片語。","d":"A word used to describe an action, state, or occurrence."},{"id":2159,"l":4,"w":"very2","k":"ˋv ɛrɪ","p":"adv.adj.","c":"非常，很 ；正是；恰好是","es":"She was walking at a very slow pace down the hill.","cs":"她正以非常慢的速度走下山。","d":"(Adverb) To a great extent or degree; extremely."},{"id":2160,"l":4,"w":"vessel","k":"ˋv ɛs!","p":"n.","c":"船，艦；容器，器皿；血管， 脈管","es":"A large oil vessel blocked the Suez Canal for several days.","cs":"一艘大型油輪堵塞了蘇伊士運河好幾天。","d":"A ship or large boat; a hollow container, especially one used to hold liquid."},{"id":2161,"l":4,"w":"vinegar","k":"ˋv ɪnɪgɚ","p":"n.","c":"醋","es":"The recipe calls for two tablespoons of white wine vinegar.","cs":"這個食譜需要兩湯匙的白葡萄酒醋。","d":"A sour-tasting liquid used as a condiment or preservative, made from fermented wine or cider."},{"id":2162,"l":4,"w":"violate","k":"ˋva ɪə͵let","p":"vt.vi.","c":"違犯；違反；侵犯","es":"Anyone who attempts to violate the law will be punished.","cs":"任何試圖違反法律的人都將受到懲罰。","d":"To break or fail to comply with (a rule or formal agreement)."},{"id":2163,"l":4,"w":"violation","k":"͵vaɪəˋleʃən","p":"n.","c":"違反；違背 ；違 反行為","es":"Running a red light is a serious traffic violation.","cs":"闖紅燈是一個嚴重的交通違規。","d":"The action of violating or the state of being violated."},{"id":2164,"l":4,"w":"virgin","k":"ˋv ɝdʒɪn","p":"n.adj.","c":"處女 ,未婚女子；處女的， 貞潔的","es":"The remote island contains areas of untouched virgin rainforest.","cs":"這個偏遠的島嶼包含未受破壞的原始雨林區域。","d":"A person who has never had sexual intercourse."},{"id":2165,"l":4,"w":"virtue","k":"ˋv ɝtʃu","p":"n.","c":"善，德 ；美德，德行","es":"Patience is generally considered a highly desirable virtue.","cs":"忍耐通常被認為是一種非常令人嚮往的美德。","d":"Behavior showing high moral standards; a good or admirable quality."},{"id":2166,"l":4,"w":"virus","k":"ˋva ɪrəs","p":"n.","c":"病毒；濾過性病毒","es":"The computer suddenly crashed because it had been infected with a virus.","cs":"電腦突然崩潰，因為它感染了病毒。","d":"An infectious agent that typically consists of a nucleic acid molecule in a protein coat, which is too small to be seen by light microscopy."},{"id":2167,"l":4,"w":"visual","k":"ˋv ɪʒuəl","p":"adj.","c":"視力的；視覺的；光學的","es":"The movie is stunning, with incredible visual effects.","cs":"這部電影令人驚嘆，擁有令人難以置信的視覺上的效果。","d":"Relating to seeing or sight."},{"id":2168,"l":4,"w":"vital","k":"ˋva ɪt!","p":"adj.","c":"生命的；維持生命所必需的","es":"Regular exercise is vital for maintaining long-term good health.","cs":"規律運動對於保持長期的良好健康是至關重要的。","d":"Absolutely necessary or important; essential."},{"id":2169,"l":4,"w":"volcano","k":"v ɑlˋkeno","p":"n.","c":"火山","es":"The dormant volcano last erupted over a hundred years ago.","cs":"這座休眠的火山上次噴發是在一百多年前。","d":"A mountain or hill having a crater or vent through which lava, rock fragments, hot vapor, and gas are being or have been erupted."},{"id":2170,"l":4,"w":"voluntary","k":"ˋv ɑlən͵tɛrɪ","p":"adj.","c":"自願的，志願 的","es":"The work was completely voluntary and no one received any pay.","cs":"這項工作完全是自願的，沒有人領取任何報酬。","d":"Done, given, or acting of one's own free will."},{"id":2171,"l":4,"w":"volunteer","k":"͵v ɑlənˋtɪr","p":"n.vi.vt.","c":"志願者，義工；自願 (做)","es":"He decided to volunteer his time at the local animal shelter.","cs":"他決定在當地的動物收容所擔任志工。","d":"A person who freely offers to take part in an enterprise or undertake a task."},{"id":2172,"l":4,"w":"vowel","k":"ˋva ʊəl","p":"n.","c":"【文】母音","es":"The letters 'a', 'e', 'i', 'o', and 'u' are the five English vowels.","cs":"字母 'a'、'e'、'i'、'o' 和 'u' 是五個英語母音。","d":"A speech sound produced by the open passage of air through the vocal cords; a letter representing this sound."},{"id":2173,"l":4,"w":"voyage","k":"ˋv ɔɪɪdʒ","p":"n.","c":"航海，航行","es":"The long sea voyage across the Atlantic took over three months.","cs":"橫渡大西洋的漫長海上航行花費了三個多月。","d":"A long journey involving travel by sea or in space."},{"id":2174,"l":4,"w":"walnut","k":"ˋw ɔlnət","p":"n.","c":"胡桃；胡桃樹","es":"She baked a rich chocolate cake with crushed walnuts inside.","cs":"她烤了一個裡面有碎核桃的濃郁巧克力蛋糕。","d":"An edible nut with a hard, wrinkled shell and a convoluted edible kernel."},{"id":2175,"l":4,"w":"website","k":"ˋw ɛb͵saɪt","p":"n.","c":"【電腦】網站","es":"I found all the information I needed on the company's website.","cs":"我在公司的網站上找到了我需要的所有資訊。","d":"A set of related web pages containing content such as text, images, and videos."},{"id":2176,"l":4,"w":"weekly","k":"ˋwikl ɪ","p":"adj.adv.n.","c":"每週的；一週一次的 ；每週；每週一次 ；週刊","es":"The club holds a weekly meeting every Friday afternoon.","cs":"這個俱樂部每週五下午舉行一次每週的會議。","d":"Done, produced, or occurring once a week."},{"id":2177,"l":4,"w":"welfare","k":"ˋw ɛl͵fɛr","p":"n.","c":"福利；幸福","es":"The government provides a range of social welfare programs for citizens.","cs":"政府為公民提供一系列社會福利計畫。","d":"The health, happiness, and fortunes of a person or group."},{"id":2178,"l":4,"w":"wit","k":"w ɪt","p":"n.","c":"機智；智慧","es":"His sharp wit and humor made him very popular at parties.","cs":"他敏銳的機智和幽默使他在派對上非常受歡迎。","d":"Mental sharpness and inventiveness; keen intelligence."},{"id":2179,"l":4,"w":"witch","k":"w ɪtʃ","p":"n.","c":"女巫，巫婆","es":"The story is about a brave girl who defeats a wicked witch.","cs":"這個故事是關於一個打敗邪惡女巫的勇敢女孩。","d":"A woman thought to have magical powers, especially evil ones."},{"id":2180,"l":4,"w":"withdraw","k":"w ɪðˋdrɔ","p":"vt.vi.","c":"抽回；收回；取回；提領 (錢)","es":"I need to withdraw some money from the ATM before the trip.","cs":"我需要在旅行前從自動提款機提款一些錢。","d":"To remove or take away (something) from a particular place or position."},{"id":2181,"l":4,"w":"witness","k":"ˋw ɪtnɪs","p":"n.vt.","c":"目擊者；見證人；目擊","es":"The police asked if anyone had witnessed the accident.","cs":"警察詢問是否有人目擊到這場事故。","d":"A person who sees an event, typically a crime or accident, take place."},{"id":2182,"l":4,"w":"wizard","k":"ˋw ɪzɚd","p":"n.","c":"男巫；術士","es":"The fantasy novel features a powerful, mysterious wizard.","cs":"這部奇幻小說中有一個強大、神秘的巫師。","d":"A man who has magical powers; a skilled person."},{"id":2183,"l":4,"w":"wreck","k":"r ɛk","p":"n.vt.vi.","c":"(船等的 )失事，遇難 ；船難 事故；( 使)失事","es":"The storm left a lot of wreck and damage along the coast.","cs":"這場暴風雨在海岸沿線留下了許多殘骸和損壞。","d":"The destruction of a ship at sea; a severely damaged vehicle or building."},{"id":2184,"l":4,"w":"wrinkle","k":"ˋr ɪŋk!","p":"n.vt.vi.","c":"皺紋；(使)起皺紋","es":"She smoothed out the annoying wrinkle in her skirt before the meeting.","cs":"她在會議前把裙子上惱人的皺紋弄平。","d":"A slight line or fold in something, especially fabric or the skin."},{"id":2185,"l":4,"w":"yearly","k":"ˋj ɪrlɪ","p":"adj.adv.n.","c":"每年的，一年一次的；每年，一年一度；年刊","es":"The company holds a yearly conference to discuss its future plans.","cs":"該公司每年舉行一次年度會議來討論其未來計畫。","d":"Done, produced, or occurring once every year."},{"id":2186,"l":4,"w":"yogurt","k":"ˋjog ɚt","p":"n.","c":"酸奶酪；酵母乳 (yoghourt)","es":"She mixed fresh fruit with plain yogurt for a healthy breakfast.","cs":"她將新鮮水果和原味優格混合在一起作為健康的早餐。","d":"A semi-solid food made from milk fermented by bacteria."},{"id":2187,"l":4,"w":"youthful","k":"ˋjuθf əl","p":"adj.","c":"年輕的；青年的；富青春 活力的","es":"Despite her age, she has a very youthful and energetic appearance.","cs":"儘管她年紀不輕，但她有著非常年輕的和充滿活力的外表。","d":"Remaining young and vigorous; characteristic of a young person."},{"id":2188,"l":5,"w":"AI","k":"͵ɑrtə`fɪʃəl","p":"n.","c":"人工智慧","es":"AI is rapidly changing many aspects of modern life.","cs":"人工智慧正在迅速改變現代生活的許多方面。","d":"The development of computer systems capable of performing tasks that typically require human intelligence."},{"id":2189,"l":5,"w":"Celsius","k":"`sɛlsɪəs","p":"n.adj.","c":"攝氏 ；攝氏的","es":"Water freezes at zero degrees Celsius.","cs":"水在零度攝氏下結冰。","d":"A scale of temperature on which water freezes at 0° and boils at 100°."},{"id":2190,"l":5,"w":"Fahrenheit","k":"`fæ r ən͵haɪt","p":"adj.n.","c":"華氏的；華氏溫度計","es":"The temperature reached 100 degrees Fahrenheit yesterday.","cs":"昨天的氣溫達到了 100 華氏度。","d":"A scale of temperature on which water freezes at 32° and boils at 212°."},{"id":2191,"l":5,"w":"abide","k":"ə`baɪd","p":"vt.vi.","c":"遵守","es":"We must abide by the rules set by the school.","cs":"我們必須遵守學校制定的規則。","d":"To accept or act in accordance with a rule, decision, or recommendation."},{"id":2192,"l":5,"w":"abolish","k":"ə`bɑlɪʃ","p":"vt.","c":"廢止","es":"The government plans to abolish the old law next year.","cs":"政府計畫明年廢除這項舊法律。","d":"To formally put an end to a system, practice, or institution."},{"id":2193,"l":5,"w":"abortion","k":"ə`bɔrʃən","p":"n.","c":"墮胎","es":"The topic of abortion is a complex and highly sensitive issue.","cs":"墮胎這個話題是一個複雜且高度敏感的議題。","d":"The deliberate termination of a human pregnancy."},{"id":2194,"l":5,"w":"abrupt","k":"ə`brʌpt","p":"adj.","c":"突然的","es":"The car came to an abrupt stop right at the intersection.","cs":"車子在十字路口突然中止。","d":"Sudden and unexpected."},{"id":2195,"l":5,"w":"absurd","k":"əb`sɝd","p":"adj.","c":"荒謬的","es":"It's absurd to think that money can buy happiness.","cs":"認為金錢可以買到幸福是荒謬的。","d":"Wildly unreasonable, illogical, or inappropriate."},{"id":2196,"l":5,"w":"abundant","k":"ə`bʌndənt","p":"adj.","c":"豐富的","es":"The region is known for its abundant natural resources.","cs":"這個地區以其豐富的自然資源而聞名。","d":"Existing or available in large quantities; plentiful."},{"id":2197,"l":5,"w":"academy","k":"ə`kæ d əmɪ","p":"n.","c":"學院","es":"She decided to attend a military academy after high school.","cs":"高中畢業後，她決定進入一所軍事學院。","d":"A place of study or training in a specialized field."},{"id":2198,"l":5,"w":"accustom","k":"ə`kʌstəm","p":"vt.","c":"使…習慣","es":"You must accustom yourself to the cold climate here.","cs":"你必須使自己習慣這裡寒冷的氣候。","d":"To make someone or something familiar with a new condition or environment."},{"id":2199,"l":5,"w":"ace","k":"es","p":"n.","c":"么點；王牌","es":"He is the ace of the tennis team and their best player.","cs":"他是網球隊的王牌，也是他們最好的球員。","d":"A playing card with a single spot on it, ranked as the highest card in its suit; a person who excels at a particular sport or activity."},{"id":2200,"l":5,"w":"acknowledge","k":"ək`nɑlɪdʒ","p":"vt.","c":"承認","es":"He refused to acknowledge the possibility of failure.","cs":"他拒絕承認失敗的可能性。","d":"To accept or admit the existence or truth of something."},{"id":2201,"l":5,"w":"acknowledgement","k":"ək`nɑlɪdʒmənt","p":"n.","c":"承認","es":"She received an official acknowledgement of her application.","cs":"她收到了她的申請的正式確認。","d":"The acceptance of the truth or existence of something; an expression of gratitude."},{"id":2202,"l":5,"w":"acne","k":"`æ kn ɪ","p":"n.","c":"粉刺","es":"Teenagers often struggle with persistent acne problems.","cs":"青少年經常與持續的青春痘問題抗爭。","d":"A skin condition characterized by red pimples, especially on the face."},{"id":2203,"l":5,"w":"admiral","k":"`æ dm ərəl","p":"n.","c":"海軍上將","es":"The admiral commanded the entire fleet of warships.","cs":"海軍上將指揮著整個戰艦艦隊。","d":"A commander of a fleet or naval squadron, representing a very high rank in the navy."},{"id":2204,"l":5,"w":"adolescence","k":"æ d!` ɛsns","p":"n.","c":"青春期","es":"Adolescence is a period of rapid physical and mental change.","cs":"青春期是身體和心理快速變化的時期。","d":"The transitional period of physical and psychological development between childhood and adulthood."},{"id":2205,"l":5,"w":"adolescent","k":"͵æd!` ɛsnt","p":"adj.","c":"青春期的","es":"The study focuses on the behavior of adolescent boys and girls.","cs":"這項研究著重於青春期的男孩和女孩的行為。","d":"(Of a young person) in the process of developing from a child into an adult."},{"id":2206,"l":5,"w":"adore","k":"ə`dor","p":"vt.","c":"珍愛","es":"He truly adores his fiancée and can't wait to marry her.","cs":"他真心愛慕他的未婚妻，迫不及待地想娶她。","d":"To love and respect someone deeply."},{"id":2207,"l":5,"w":"adulthood","k":"ə`dʌlthʊd","p":"n.","c":"成年時期","es":"Taking on responsibility is a key step into adulthood.","cs":"承擔責任是邁入成年的關鍵一步。","d":"The state or condition of being fully grown or mature."},{"id":2208,"l":5,"w":"advertiser","k":"`æ dv ɚ͵taɪzɚ","p":"n.","c":"登廣告者","es":"The magazine relies heavily on its major advertisers for revenue.","cs":"這本雜誌嚴重依賴其主要廣告商的收入。","d":"A person or company that pays to promote a product, service, or event."},{"id":2209,"l":5,"w":"affection","k":"ə`fɛkʃən","p":"n.","c":"情愛","es":"He showed his affection for his family through small gestures.","cs":"他透過一些小舉動表達了他對家人的愛意。","d":"A gentle feeling of fondness or liking."},{"id":2210,"l":5,"w":"agenda","k":"ə`dʒɛndə","p":"n.","c":"議程","es":"The first item on the meeting agenda is the budget review.","cs":"會議議程上的第一項是預算審查。","d":"A list of items to be discussed at a formal meeting."},{"id":2211,"l":5,"w":"agony","k":"`æ g ənɪ","p":"n.","c":"痛苦","es":"He was in agony after breaking his leg in the accident.","cs":"他的腿在事故中骨折後，他處於極大的痛苦之中。","d":"Extreme physical or mental suffering."},{"id":2212,"l":5,"w":"agricultural","k":"͵ægr ɪ`kʌltʃərəl","p":"adj.","c":"農業的","es":"The country's economy is mainly based on agricultural production.","cs":"該國的經濟主要基於農業生產。","d":"Relating to the practice of farming, including cultivating soil and rearing animals."},{"id":2213,"l":5,"w":"airtight","k":"` ɛr͵taɪt","p":"adj.","c":"密閉的","es":"Keep the cookies in an airtight container to keep them fresh.","cs":"將餅乾放在密封的容器中以保持新鮮。","d":"Not allowing air to escape or pass through."},{"id":2214,"l":5,"w":"airway","k":"` ɛr͵we","p":"n.","c":"呼吸道； (礦井的 )風道","es":"The doctor checked to ensure the patient's airway was clear.","cs":"醫生檢查以確保病患的呼吸道暢通。","d":"The passage by which air reaches a person's lungs; a designated route for aircraft."},{"id":2215,"l":5,"w":"aisle","k":"a ɪl","p":"n.","c":"走道；通道","es":"I couldn't reach the cereal box from the center of the aisle.","cs":"我在走道中央無法搆到麥片盒。","d":"A passage between rows of seats in a building, airplane, or train."},{"id":2216,"l":5,"w":"algebra","k":"`æ ld ʒəbrə","p":"n.","c":"代數","es":"She is struggling with the advanced concepts in algebra.","cs":"她正在為代數中的進階概念而苦苦掙扎。","d":"A branch of mathematics in which letters and symbols are used to represent numbers and quantities in formulas and equations."},{"id":2217,"l":5,"w":"alien","k":"`el ɪən","p":"n.adj.","c":"外國人；外星人；外星的；外國的","es":"The film tells the story of an alien who lands on Earth.","cs":"這部電影講述了一個降落在地球上的外星人的故事。","d":"Belonging to a foreign country or nation; a theoretical being from another world."},{"id":2218,"l":5,"w":"allergic","k":"ə`lɝdʒɪk","p":"adj.","c":"過敏的","es":"He is severely allergic to peanuts and must avoid them.","cs":"他對花生嚴重過敏，必須避開它們。","d":"Caused by or relating to an abnormal immune response to a specific substance."},{"id":2219,"l":5,"w":"allergy","k":"`æ l ɚdʒɪ","p":"n.","c":"過敏","es":"Her seasonal allergy makes her sneeze a lot in the spring.","cs":"她的季節性過敏讓她在春天經常打噴嚏。","d":"A damaging immune response by the body to a substance, such as pollen or a particular food."},{"id":2220,"l":5,"w":"alligator","k":"`æ l ə͵getɚ","p":"n.","c":"鱷魚","es":"The swamp is home to several large alligators.","cs":"這個沼澤是幾隻大型短吻鱷的家。","d":"A large semiaquatic reptile similar to a crocodile but with a broader and shorter head."},{"id":2221,"l":5,"w":"ally","k":"ə`laɪ","p":"n.","c":"同盟者","es":"During the war, the two nations acted as close allyies.","cs":"在戰爭期間，這兩個國家是親密的盟友。","d":"A state formally cooperating with another for a military or other purpose; a person or organization that cooperates with another."},{"id":2222,"l":5,"w":"alter","k":"` ɔltɚ","p":"vt.vi.","c":"改變","es":"She had to alter the dress because it was too long.","cs":"她必須修改這件洋裝，因為它太長了。","d":"To change or cause to change in character or composition."},{"id":2223,"l":5,"w":"alternate","k":"` ɔltɚnɪt","p":"vt.vi.adj.n.","c":"替換 (者)","es":"We will alternate
