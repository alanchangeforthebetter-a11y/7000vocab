 on his farm.","cs":"這位農夫在他的農場裡飼養了各種家畜。","d":"Farm animals regarded as an asset."},{"id":2717,"l":5,"w":"lizard","k":"`lɪzɚd","p":"n.","c":"蜥蜴","es":"A tiny lizard scurried across the path.","cs":"一隻小小的蜥蜴快速地跑過小徑。","d":"A reptile that typically has a long body and tail, four legs, movable eyelids, and a rough, scaly, or spiny skin."},{"id":2718,"l":5,"w":"locomotive","k":"͵lok ə`mot ɪv","p":"n.","c":"火車頭","es":"The steam locomotive pulled the long train of cars.","cs":"蒸汽火車頭拖著長長的車廂。","d":"A powered railway vehicle used for pulling trains."},{"id":2719,"l":5,"w":"locust","k":"`lok əst","p":"n.","c":"蝗蟲","es":"A swarm of locusts destroyed the entire crop.","cs":"一群蝗蟲摧毀了全部莊稼。","d":"A large and mainly tropical grasshopper which undergoes swarming phases."},{"id":2720,"l":5,"w":"lodge","k":"lɑdʒ","p":"n.","c":"小屋","es":"We stayed in a small wooden lodge by the lake.","cs":"我們住在湖邊的一間木製小屋裡。","d":"A small house at the gates of a park or in the grounds of a large house."},{"id":2721,"l":5,"w":"lofty","k":"`lɔftɪ","p":"adj.","c":"崇高的","es":"He expressed a lofty goal of eradicating poverty.","cs":"他表達了根除貧困的崇高目標。","d":"Of imposing height; of a noble or exalted nature."},{"id":2722,"l":5,"w":"logo","k":"`logo","p":"n.","c":"標誌","es":"The company is updating its official logo.","cs":"該公司正在更新其官方標誌。","d":"A symbol or other design adopted by an organization to identify its products, uniform, vehicles, etc."},{"id":2723,"l":5,"w":"lonesome","k":"`lons əm","p":"adj.","c":"寂寞的","es":"He felt lonesome after all his friends had left.","cs":"所有的朋友都離開後，他感到很寂寞。","d":"Solitary or lonely."},{"id":2724,"l":5,"w":"longitude","k":"`lɑndʒə͵tjud","p":"n.","c":"經度","es":"The plane's route was determined by longitude and latitude.","cs":"飛機的路線由經度和緯度決定。","d":"The angular distance of a place east or west of the meridian at Greenwich, England."},{"id":2725,"l":5,"w":"lottery","k":"`lɑtərɪ","p":"n.","c":"彩券；樂透","es":"She won a large sum of money in the national lottery.","cs":"她在全國彩券中贏了一大筆錢。","d":"A means of raising money by selling numbered tickets and giving prizes to the holders of numbers drawn at random."},{"id":2726,"l":5,"w":"lotus","k":"`lotəs","p":"n.","c":"蓮花","es":"The pink lotus flowers floated on the pond.","cs":"粉紅色的蓮花漂浮在池塘上。","d":"A large water lily of aquatic habitats."},{"id":2727,"l":5,"w":"lumber","k":"`lʌmbɚ","p":"n.","c":"木材","es":"The truck was loaded with freshly cut lumber.","cs":"卡車上裝載著剛砍伐的木材。","d":"Timber sawn into rough planks or otherwise partly prepared."},{"id":2728,"l":5,"w":"lump","k":"lʌmp","p":"n.","c":"團；塊","es":"He felt a hard lump on his head after the fall.","cs":"跌倒後，他覺得頭上有一個硬硬的腫塊。","d":"A compact mass of a substance, especially one without a definite or regular shape."},{"id":2729,"l":5,"w":"magnify","k":"`mæ gn ə͵faɪ","p":"vt.vi.","c":"放大；擴大","es":"The telescope can magnify distant objects.","cs":"望遠鏡可以放大遠處的物體。","d":"To make (something) appear larger than it is, especially with a lens or microscope."},{"id":2730,"l":5,"w":"maiden","k":"`medn","p":"n.","c":"少女","es":"The young maiden was hesitant to speak.","cs":"那位年輕的少女猶豫著不說話。","d":"A girl or young woman, especially an unmarried one."},{"id":2731,"l":5,"w":"mainland","k":"`menl ənd","p":"n.","c":"大陸","es":"Most of the country's population lives on the mainland.","cs":"該國大部分人口居住在大陸上。","d":"A large continuous extent of land that includes the greater part of a country or territory."},{"id":2732,"l":5,"w":"mainstream","k":"`men͵strim","p":"n.","c":"主流","es":"His views are outside the political mainstream.","cs":"他的觀點不屬於政治主流。","d":"The ideas, attitudes, or activities that are regarded as normal or conventional."},{"id":2733,"l":5,"w":"maintenance","k":"`ment ənəns","p":"n.","c":"維持；保持","es":"Regular maintenance is essential for a car's longevity.","cs":"定期維護對汽車的壽命至關重要。","d":"The process of maintaining or preserving someone or something, or the state of being maintained."},{"id":2734,"l":5,"w":"majestic","k":"mə`dʒɛstɪk","p":"adj.","c":"雄偉的；威嚴的","es":"The cathedral is a truly majestic example of Gothic architecture.","cs":"這座大教堂是哥德式建築中一個真正雄偉的範例。","d":"Having or showing impressive beauty or dignity."},{"id":2735,"l":5,"w":"majesty","k":"`mæ d ʒɪstɪ","p":"n.","c":"雄偉；莊嚴","es":"She addressed the Queen with the respect due to her majesty.","cs":"她以對女王陛下應有的尊敬稱呼她。","d":"Impressive stateliness, dignity, or beauty; royal power."},{"id":2736,"l":5,"w":"mammal","k":"`mæ m!","p":"n.","c":"哺乳類","es":"Whales and dolphins are classified as marine mammals.","cs":"鯨魚和海豚被歸類為海洋哺乳類。","d":"A warm-blooded vertebrate animal of a class that is distinguished by the possession of hair or fur, the secretion of milk by females, and the birth of live young."},{"id":2737,"l":5,"w":"manifest","k":"`mæ n ə͵fɛst","p":"adj.","c":"顯然的；明白的","es":"His anger was manifest in his tightly clenched fists.","cs":"他的憤怒明顯地表現在他緊握的拳頭上。","d":"Clear or obvious to the eye or mind; to display or show."},{"id":2738,"l":5,"w":"mansion","k":"`mæ n ʃən","p":"n.","c":"大廈；府邸","es":"The old mansion was turned into a luxury hotel.","cs":"這座古老的大廈被改建成了一家豪華飯店。","d":"A large, impressive house."},{"id":2739,"l":5,"w":"maple","k":"`mep!","p":"n.","c":"楓樹；楓葉","es":"The red and yellow maple leaves signaled autumn.","cs":"紅色和黃色的楓葉預示著秋天。","d":"A tree or shrub with lobed leaves, winged fruits, and colorful autumn foliage."},{"id":2740,"l":5,"w":"marginal","k":"`mɑrdʒɪn!","p":"adj.","c":"邊緣的","es":"The area is considered a marginal habitat for the species.","cs":"該地區被認為是該物種的邊緣的棲息地。","d":"Of, relating to, or situated at the edge or margin of something; minor and not important."},{"id":2741,"l":5,"w":"marine","k":"mə`rin","p":"adj.","c":"海的；海生的","es":"They are studying the behavior of marine life.","cs":"他們正在研究海洋生物的行為。","d":"Of, found in, or produced by the sea."},{"id":2742,"l":5,"w":"marshal","k":"`mɑrʃəl","p":"n.","c":"元帥；高級將官","es":"The funeral procession was led by a military marshal.","cs":"葬禮隊伍由一位軍事元帥領頭。","d":"An officer of the highest rank in the armed forces of some countries."},{"id":2743,"l":5,"w":"martial","k":"`mɑrʃəl","p":"adj.","c":"好戰的；戰爭的","es":"The country has a long history of martial arts.","cs":"這個國家有悠久的戰爭的（武術的）歷史。","d":"Of or appropriate to war; warlike."},{"id":2744,"l":5,"w":"marvel","k":"`mɑrv!","p":"n.v.","c":"令人驚奇的人事物；(對…)感到驚訝","es":"The new bridge is a modern marvel of engineering.","cs":"這座新橋是現代工程的一個令人驚奇的人事物。","d":"A wonderful or astonishing person or thing; to be filled with wonder or astonishment."},{"id":2745,"l":5,"w":"masculine","k":"`mæ skj əlɪn","p":"adj.","c":"男子氣概的","es":"He has a very masculine way of speaking.","cs":"他說話的方式非常有男子氣概的。","d":"Having qualities or appearance traditionally associated with men."},{"id":2746,"l":5,"w":"mash","k":"mæʃ","p":"n.","c":"糊狀物","es":"She made a creamy mash of potatoes.","cs":"她做了一份奶油狀的馬鈴薯糊狀物。","d":"A uniform mass made by crushing a substance into a soft pulp."},{"id":2747,"l":5,"w":"massage","k":"mə`sɑʒ","p":"n.vt.","c":"按摩","es":"She went for a relaxing back massage.","cs":"她去做了一個放鬆的背部按摩。","d":"The rubbing and kneading of muscles and joints of the body with the hands, especially to relieve tension or pain."},{"id":2748,"l":5,"w":"massive","k":"`mæ s ɪv","p":"adj.","c":"巨大的","es":"The old building was constructed with massive stone blocks.","cs":"這座老建築是用巨大的石塊建造的。","d":"Large and heavy or solid; exceptionally large."},{"id":2749,"l":5,"w":"masterpiece","k":"`mæ st ɚ͵pis","p":"n.","c":"傑作","es":"The painting is considered the artist's finest masterpiece.","cs":"這幅畫被認為是這位藝術家最傑出的傑作。","d":"A work of outstanding artistry, skill, or workmanship."},{"id":2750,"l":5,"w":"mayonnaise","k":"͵meə`nez","p":"n.","c":"美乃滋","es":"I prefer my sandwiches with a lot of mayonnaise.","cs":"我喜歡我的三明治裡有很多美乃滋。","d":"A thick, creamy dressing consisting of egg yolks beaten with oil and vinegar."},{"id":2751,"l":5,"w":"meantime","k":"`min͵ta ɪm","p":"n.advt.","c":"同時","es":"In the meantime, please prepare the presentation slides.","cs":"同時，請準備好簡報幻燈片。","d":"Meanwhile; the time before something happens or before a specified period ends."},{"id":2752,"l":5,"w":"mechanics","k":"mə`kæ n ɪks","p":"n.","c":"力學；機械學","es":"He is studying theoretical mechanics at university.","cs":"他在大學學習理論力學。","d":"The branch of applied mathematics dealing with motion and forces; the machinery or working parts of something."},{"id":2753,"l":5,"w":"mediate","k":"`mid ɪ͵et","p":"vt.vi.adj.","c":"居中調停；居間的","es":"The diplomat offered to mediate the dispute.","cs":"這位外交官提出要居中調停這場爭端。","d":"To intervene between people in a dispute in order to bring about an agreement or reconciliation."},{"id":2754,"l":5,"w":"menace","k":"`mɛnɪs","p":"n.vt.vi.","c":"威脅","es":"The rising crime rate is a menace to the city.","cs":"上升的犯罪率對城市來說是一個威脅。","d":"A person or thing that is likely to cause harm; a threat or danger."},{"id":2755,"l":5,"w":"mermaid","k":"`mɝ͵med","p":"n.","c":"美人魚","es":"Legends say that a mermaid lives in that cove.","cs":"傳說中，一條美人魚住在那個小海灣裡。","d":"A fictitious or mythical half-human sea creature with the head and trunk of a woman and the tail of a fish."},{"id":2756,"l":5,"w":"midst","k":"mɪdst","p":"n.","c":"中間","es":"He found peace in the midst of the chaos.","cs":"他在混亂的中間找到了平靜。","d":"In the middle of."},{"id":2757,"l":5,"w":"migrant","k":"`maɪgrənt","p":"adj.n.","c":"移居的；移民","es":"Many migrant workers come to the city for jobs.","cs":"許多移居的（移民）工人來到這座城市尋找工作。","d":"A person or animal that moves from one region, place, or country to another."},{"id":2758,"l":5,"w":"mileage","k":"`maɪlɪdʒ","p":"n.","c":"里程數","es":"The car's mileage is very high for its age.","cs":"這輛車的里程數對於它的年齡來說非常高。","d":"A number of miles traveled or covered."},{"id":2759,"l":5,"w":"milestone","k":"`maɪl͵ston","p":"n.","c":"里程碑","es":"The signing of the treaty was a historic milestone.","cs":"條約的簽署是一個歷史性的里程碑。","d":"A stone set up beside a road to mark the distance in miles to a particular place; a significant event or stage."},{"id":2760,"l":5,"w":"mingle","k":"`mɪŋg!","p":"vt.vi.","c":"混合","es":"The two different crowds began to mingle easily.","cs":"兩群不同的人開始輕鬆地混合在一起。","d":"To mix or cause to mix together."},{"id":2761,"l":5,"w":"minimal","k":"`mɪnəməl","p":"adj.","c":"最小的","es":"The required change was only minimal.","cs":"所需的改變只是最小的。","d":"Of a minimum amount, quantity, or degree; negligible."},{"id":2762,"l":5,"w":"mint","k":"mɪnt","p":"n.","c":"薄荷","es":"She grew fresh mint in her herb garden.","cs":"她在她的藥草園裡種植了新鮮的薄荷。","d":"An aromatic plant whose leaves are used as a culinary herb."},{"id":2763,"l":5,"w":"miser","k":"`maɪzɚ","p":"n.","c":"吝嗇鬼；守財奴","es":"The old man was a known miser who lived in a small, cold house despite having millions in the bank.","cs":"這位老人是出了名的守財奴，儘管銀行裡有幾百萬，卻住在寒冷窄小的房子裡。","d":"A person who hoards wealth and spends as little money as possible."},{"id":2764,"l":5,"w":"mistress","k":"`mɪstrɪs","p":"n.","c":"女主人","es":"The wealthy mistress of the estate was very generous.","cs":"這位富有的莊園女主人非常慷慨。","d":"A woman in a position of authority or control."},{"id":2765,"l":5,"w":"moan","k":"mon","p":"n.vi.vt.","c":"呻吟","es":"He let out a soft moan of relief.","cs":"他發出了一聲輕微的解脫的呻吟。","d":"A long, low sound made by a person expressing physical or mental suffering."},{"id":2766,"l":5,"w":"mock","k":"mɑk","p":"vt.vi.n.","c":"嘲笑","es":"They tried to mock his accent, but he ignored them.","cs":"他們試圖嘲笑他的口音，但他忽略了他們。","d":"To tease or laugh at in a scornful or contemptuous manner."},{"id":2767,"l":5,"w":"mode","k":"mod","p":"n.","c":"模式","es":"The software has a secure operating mode.","cs":"該軟體有一個安全的運行模式。","d":"A way or manner in which something occurs or is experienced, expressed, or done."},{"id":2768,"l":5,"w":"modernize","k":"`mɑdɚn͵aɪz","p":"n.","c":"現代化","es":"The city is trying to modernize its public transportation system.","cs":"該城市正試圖現代化其公共交通系統。","d":"To adapt (something) to modern needs or habits, typically by installing modern equipment."},{"id":2769,"l":5,"w":"modify","k":"`mɑdə͵faɪ","p":"vt.","c":"修改","es":"They need to modify the schedule to fit everyone.","cs":"他們需要修改時間表以適應每個人。","d":"To make partial or minor changes to (something), typically so as to improve it or to make it less extreme."},{"id":2770,"l":5,"w":"mold (2)","k":"mold","p":"n.","c":"模型；模式； 鑄模","es":"The ceramic bowl was shaped in a decorative mold.","cs":"這個陶瓷碗是在一個裝飾性的模型中成形的。","d":"A hollow container used to give shape to molten or hot liquid material."},{"id":2771,"l":5,"w":"molecule","k":"`mɑlə͵kjul","p":"n.","c":"分子","es":"Water is made up of hydrogen and oxygen molecules.","cs":"水是由氫和氧的分子組成的。","d":"A group of atoms bonded together, representing the smallest fundamental unit of a chemical compound."},{"id":2772,"l":5,"w":"monarch","k":"`mɑnɚk","p":"n.","c":"君王","es":"The people still respect the power of their monarch.","cs":"人們仍然尊重他們的君王的權力。","d":"A sovereign head of state, especially a king, queen, or emperor."},{"id":2773,"l":5,"w":"monstrous","k":"`mɑnstrəs","p":"adj.","c":"似怪物的","es":"The damage caused by the storm was monstrous.","cs":"風暴造成的損害是似怪物的（巨大的）。","d":"Having the ugly or frightening appearance of a monster."},{"id":2774,"l":5,"w":"mortal","k":"`mɔrt!","p":"adj.","c":"會死的；致命的","es":"All living things are mortal.","cs":"所有生物都是會死的。","d":"(Of a living human being, often in contrast to a divine being) subject to death; causing or liable to cause death."},{"id":2775,"l":5,"w":"moss","k":"mɔs","p":"n.","c":"苔藓","es":"The old tree trunk was covered in green moss.","cs":"老樹幹上覆蓋著綠色的苔蘚。","d":"A small, flowerless, green plant that lacks true roots and grows in low carpets or rounded cushions in damp habitats."},{"id":2776,"l":5,"w":"motherhood","k":"`mʌðɚhʊd","p":"n.","c":"母親身分","es":"She embraces the challenges of motherhood.","cs":"她擁抱母親身分所帶來的挑戰。","d":"The state of being a mother."},{"id":2777,"l":5,"w":"motive","k":"`mot ɪv","p":"n.","c":"動機","es":"We need to understand the killer's motive.","cs":"我們需要了解兇手的動機。","d":"A reason for doing something, especially one that is hidden or not obvious."},{"id":2778,"l":5,"w":"mound","k":"maʊnd","p":"n.","c":"丘","es":"The hiker rested on a small grassy mound.","cs":"這位徒步旅行者在一個長滿草的小丘上休息。","d":"A rounded mass projecting above a surface; a small hill."},{"id":2779,"l":5,"w":"mount","k":"maʊnt","p":"vt.vi.n.","c":"登上；底座","es":"The rider prepared to mount the horse.","cs":"騎手準備登上馬。","d":"To climb up; to organize and initiate; a backing or setting on which a picture or gem is set."},{"id":2780,"l":5,"w":"mourn","k":"morn","p":"vi.vt.","c":"哀悼","es":"The family gathered to mourn the loss of their grandfather.","cs":"家人聚集在一起哀悼他們祖父的逝去。","d":"To feel or show deep sorrow or regret for (someone or their death)."},{"id":2781,"l":5,"w":"mower","k":"`mo ɚ","p":"n.","c":"刈草機","es":"He used a push mower to cut the grass.","cs":"他使用推式刈草機來割草。","d":"A machine used for cutting grass."},{"id":2782,"l":5,"w":"mumble","k":"`mʌmb!","p":"vt.vi.n.","c":"咕噥","es":"The shy child would only mumble a reply.","cs":"這位害羞的孩子只會咕噥地回答。","d":"To say something indistinctly and quietly, making it difficult for others to hear."},{"id":2783,"l":5,"w":"muscular","k":"`mʌskjəlɚ","p":"adj.","c":"肌肉發達的","es":"The athlete has a very muscular build.","cs":"這位運動員有非常肌肉發達的體格。","d":"Relating to or affecting the muscles; having well-developed muscles."},{"id":2784,"l":5,"w":"muse","k":"mjuz","p":"vi.vt.n.","c":"沉思","es":"She would often muse about the meaning of life.","cs":"她經常沉思生命的意義。","d":"To be absorbed in thought; a person or personified force who is the source of inspiration for a creative artist."},{"id":2785,"l":5,"w":"mustard","k":"`mʌstɚd","p":"n.","c":"芥末","es":"I like to put mustard on my hot dogs.","cs":"我喜歡在熱狗上放芥末。","d":"A hot-tasting yellow or brown paste made from the crushed seeds of certain plants, typically eaten with meat or used as a cooking ingredient."},{"id":2786,"l":5,"w":"mutter","k":"`mʌtɚ","p":"vi.vt.n.","c":"咕噥","es":"He began to mutter under his breath about the unfair rules.","cs":"他開始低聲咕噥著抱怨不公平的規則。","d":"To say something in a low or barely audible voice, especially in dissatisfaction or irritation."},{"id":2787,"l":5,"w":"mutton","k":"`mʌtn","p":"n.","c":"羊肉","es":"They served roast mutton for dinner.","cs":"他們晚餐供應烤羊肉。","d":"The flesh of sheep, especially mature sheep, used as food."},{"id":2788,"l":5,"w":"myth","k":"mɪθ","p":"n.","c":"神話","es":"Greek myths are full of gods and heroes.","cs":"希臘神話充滿了神祇和英雄。","d":"A traditional story, especially one concerning the early history of a people or explaining some natural or social phenomenon."},{"id":2789,"l":5,"w":"nag","k":"næ g","p":"vt.vi.","c":"使煩惱；嘮叨","es":"Stop nagging me about cleaning my room!","cs":"不要再嘮叨我打掃房間了！","d":"To annoy someone by complaining or repeatedly asking them to do something."},{"id":2790,"l":5,"w":"naive","k":"nɑ`iv","p":"adj.","c":"天真的","es":"She was too naive to suspect the deception.","cs":"她太天真了，沒有懷疑這個騙局。","d":"Showing a lack of experience, wisdom, or judgment."},{"id":2791,"l":5,"w":"nasty","k":"`næ st ɪ","p":"adj.","c":"猥褻的；險惡的","es":"The children encountered a nasty dog on the street.","cs":"孩子們在街上遇到了一隻險惡的狗。","d":"Highly unpleasant, especially to the senses; physically repugnant."},{"id":2792,"l":5,"w":"navigate","k":"`næ v ə͵get","p":"vt.vi.","c":"導航；航行","es":"The captain had to navigate the ship through thick fog.","cs":"船長必須在濃霧中導航船隻。","d":"To plan and direct the route or course of a ship, aircraft, or other form of transport."},{"id":2793,"l":5,"w":"newscast","k":"`njuz͵kæst","p":"n.","c":"新聞廣播","es":"I caught the evening newscast to get the latest updates.","cs":"我收看了晚間新聞廣播以獲取最新資訊。","d":"A broadcast of news on radio or television."},{"id":2794,"l":5,"w":"nibble","k":"`nɪb!","p":"vt.vi.n.","c":"一點一點的嚙咬","es":"The rabbit began to nibble on a piece of carrot.","cs":"兔子開始一點一點的嚙咬一片紅蘿蔔。","d":"To take small bites out of."},{"id":2795,"l":5,"w":"nickel","k":"`nɪk!","p":"n.","c":"鎳","es":"The coin is made of nickel.","cs":"這枚硬幣是由鎳製成的。","d":"A silvery-white metal, the chemical element of atomic number 28; a five-cent coin in the US and Canada."},{"id":2796,"l":5,"w":"nightingale","k":"`naɪtɪŋ͵gel","p":"n.","c":"夜鶯","es":"The song of the nightingale is very beautiful.","cs":"夜鶯的歌聲非常優美。","d":"A small Eurasian thrush that sings beautifully, especially at night."},{"id":2797,"l":5,"w":"nominate","k":"`nɑmə͵net","p":"vt.","c":"提名","es":"The committee decided to nominate her for the award.","cs":"委員會決定提名她參選該獎項。","d":"To propose or formally enter as a candidate for election or for an honor or award."},{"id":2798,"l":5,"w":"nonetheless","k":"͵nʌnðə`lɛs","p":"advt.conj.","c":"然而","es":"It was a difficult task; nonetheless, they finished it.","cs":"這是一項艱難的任務；然而，他們完成了。","d":"In spite of that; nevertheless."},{"id":2799,"l":5,"w":"nonviolent","k":"͵nɑn`vaɪələnt","p":"adj.","c":"非暴力的","es":"He advocates a nonviolent approach to solving conflicts.","cs":"他主張用非暴力的方法解決衝突。","d":"Using peaceful means rather than force, especially to bring about political or social change."},{"id":2800,"l":5,"w":"nostril","k":"`nɑstrɪl","p":"n.","c":"鼻孔","es":"He took a deep breath through his nostrils.","cs":"他通過他的鼻孔深吸了一口氣。","d":"Either of two external openings of the nasal cavity in vertebrates that admit air to the lungs and smells to the olfactory nerves."},{"id":2801,"l":5,"w":"notable","k":"`not əb!","p":"adj.","c":"著名的","es":"She is a notable figure in the field of science.","cs":"她是科學領域一個著名的人物。","d":"Worthy of attention or notice; remarkable."},{"id":2802,"l":5,"w":"noticeable","k":"`not ɪsəb!","p":"adj.","c":"顯著的","es":"There has been a noticeable improvement in his behavior.","cs":"他的行為有顯著的改善。","d":"Easily seen or noticed; clear or apparent."},{"id":2803,"l":5,"w":"notify","k":"`not ə͵faɪ","p":"vt.","c":"通知；告知","es":"Please notify the office if you plan to take a leave of absence.","cs":"如果你打算請假，請通知辦公室。","d":"To inform someone of something, typically in a formal or official manner."},{"id":2804,"l":5,"w":"notion","k":"`noʃən","p":"n.","c":"概念；想法","es":"He has a strange notion about how the world works.","cs":"他對世界運作方式有一個奇怪的概念。","d":"A conception of or belief about something."},{"id":2805,"l":5,"w":"novice","k":"`nɑvɪs","p":"n.","c":"新手","es":"As a novice, he still has much to learn.","cs":"作為一個新手，他還有很多東西要學。","d":"A person new to or inexperienced in a field or situation."},{"id":2806,"l":5,"w":"nowhere","k":"`no͵hw ɛr","p":"n.advt.","c":"不知名的地方","es":"The lost hiker was found in the middle of nowhere.","cs":"這位迷路的徒步旅行者在不知名的地方被找到。","d":"Not in or to any place; not anywhere."},{"id":2807,"l":5,"w":"nucleus","k":"`njukl ɪəs","p":"n.","c":"核","es":"The atom's nucleus contains protons and neutrons.","cs":"原子的核包含質子和中子。","d":"The central and most important part of an object, movement, or group, forming the basis for its activity and growth."},{"id":2808,"l":5,"w":"nude","k":"njud","p":"adj.","c":"裸的；不加修飾的","es":"The statue was a realistic carving of a nude figure.","cs":"這座雕像是裸的人物的逼真雕刻。","d":"Wearing no clothes; naked."},{"id":2809,"l":5,"w":"oar","k":"or","p":"n.","c":"槳","es":"The rowers dipped their oars into the water.","cs":"划船者將他們的槳浸入水中。","d":"A pole with a flat blade, pivoting in an oarlock, used to row or steer a boat through the water."},{"id":2810,"l":5,"w":"oasis","k":"o`es ɪs","p":"n.","c":"綠洲","es":"The travelers were overjoyed to find an oasis in the desert.","cs":"旅行者們很高興在沙漠中找到一片綠洲。","d":"A fertile spot in a desert where water is found."},{"id":2811,"l":5,"w":"oath","k":"oθ","p":"n.","c":"誓言","es":"He took an oath to tell the truth.","cs":"他立下誓言要說實話。","d":"A solemn promise, often invoking a divine witness, regarding one's future action or behavior."},{"id":2812,"l":5,"w":"oatmeal","k":"`ot͵mil","p":"n.","c":"燕麥粥","es":"She ate a bowl of hot oatmeal for breakfast.","cs":"她早餐吃了一碗熱騰騰的燕麥粥。","d":"Meal made from ground oats, used in making porridge, oatcakes, etc."},{"id":2813,"l":5,"w":"oblong","k":"`ɑbloŋ","p":"n.","c":"矩形；橢圓形","es":"The conference table was oblong in shape.","cs":"會議桌的形狀是矩形的。","d":"An object or flat figure in an elongated rectangle or oval shape."},{"id":2814,"l":5,"w":"observer","k":"əb`zɝvɚ","p":"n.","c":"觀測員","es":"The observer noted the change in the star's brightness.","cs":"觀測員注意到恆星亮度的變化。","d":"A person who watches or notices something."},{"id":2815,"l":5,"w":"obstinate","k":"`ɑbstənɪt","p":"adj.","c":"頑固的","es":"She is very obstinate and rarely changes her mind.","cs":"她非常頑固，很少改變主意。","d":"Stubbornly refusing to change one's opinion or chosen course of action, despite attempts to persuade one to do so."},{"id":2816,"l":5,"w":"occurrence","k":"ə`kɝəns","p":"n.","c":"事件","es":"The sudden storm was an unexpected occurrence.","cs":"突如其來的風暴是一個意料之外的事件。","d":"An incident or event."},{"id":2817,"l":5,"w":"octopus","k":"`ɑktəpəs","p":"n.","c":"章魚","es":"The divers spotted a large octopus hiding in the rocks.","cs":"潛水員發現一隻大章魚藏在岩石中。","d":"A cephalopod mollusk with eight sucker-bearing arms, a soft body, strong beak-like jaws, and no internal shell."},{"id":2818,"l":5,"w":"odds","k":"ɑds","p":"n.","c":"機會","es":"The odds are stacked against us, but we must try.","cs":"機會對我們不利，但我們必須嘗試。","d":"The ratio between the amounts staked by the parties to a bet, based on the expected probability either way."},{"id":2819,"l":5,"w":"odor","k":"`odɚ","p":"n.","c":"香味；臭味","es":"The kitchen was filled with the pleasant odor of baking bread.","cs":"廚房裡充滿了烤麵包令人愉快的香味。","d":"A distinctive smell, especially an unpleasant one."},{"id":2820,"l":5,"w":"olive","k":"`ɑlɪv","p":"n.","c":"橄欖","es":"She enjoys eating seasoned olives as an appetizer.","cs":"她喜歡吃調味過的橄欖作為開胃菜。","d":"A small oval fruit with a hard pit and bitter flesh, green when unripe and generally black when fully ripe."},{"id":2821,"l":5,"w":"opponent","k":"ə`ponənt","p":"n.","c":"對手","es":"His political opponent delivered a powerful speech.","cs":"他的政治對手發表了一篇有力的演講。","d":"Someone who competes against or fights another in a contest, game, or argument; a rival or adversary."},{"id":2822,"l":5,"w":"optimism","k":"`ɑptəmɪzəm","p":"n.","c":"樂觀主義","es":"Her unwavering optimism is contagious.","cs":"她堅定不移的樂觀主義富有感染力。","d":"Hopefulness and confidence about the future or the successful outcome of something."},{"id":2823,"l":5,"w":"orchard","k":"`ɔrtʃɚd","p":"n.","c":"果園","es":"We spent the afternoon picking apples in the orchard.","cs":"我們在果園裡摘了一下午的蘋果。","d":"A piece of land planted with fruit trees."},{"id":2824,"l":5,"w":"organizer","k":"`ɔrgə͵naɪzɚ","p":"n.","c":"組織者","es":"She was the main organizer of the charity event.","cs":"她是這次慈善活動的主要組織者。","d":"A person who coordinates the planning and execution of a specific event or activity."},{"id":2825,"l":5,"w":"orient","k":"`orɪənt","p":"n.","c":"東方","es":"They traveled to the Orient to study ancient cultures.","cs":"他們前往東方研究古代文化。","d":"The countries of Asia, especially eastern Asia."},{"id":2826,"l":5,"w":"oriental","k":"͵orɪ`ɛnt!","p":"adj.","c":"東方的","es":"She prefers oriental rugs for her living room.","cs":"她喜歡用東方的（東方風格的）地毯裝飾她的客廳。","d":"Of, from, or characteristic of Asia, especially East Asia."},{"id":2827,"l":5,"w":"ornament","k":"`ɔrnəmənt","p":"n.","c":"裝飾品","es":"The vase served as a beautiful ornament on the mantelpiece.","cs":"這個花瓶在壁爐架上是一個美麗的裝飾品。","d":"A thing used to make something look more attractive but usually having no practical purpose, especially a small object such as a figurine."},{"id":2828,"l":5,"w":"orphanage","k":"`ɔrfənɪdʒ","p":"n.","c":"孤兒","es":"The children from the orphanage visited the farm.","cs":"來自孤兒院的孩子們參觀了農場。","d":"A residential institution for the care and education of orphans."},{"id":2829,"l":5,"w":"ostrich","k":"`ɑstrɪtʃ","p":"n.","c":"鴕鳥","es":"The ostrich is the world's largest flightless bird.","cs":"鴕鳥是世界上最大的不會飛的鳥。","d":"A flightless swift-running African bird with a long neck, long legs, and two toes on each foot. It is the largest living bird."},{"id":2830,"l":5,"w":"ounce","k":"aʊns","p":"n.","c":"盎司","es":"The recipe calls for six ounces of flour.","cs":"食譜需要六盎司麵粉。","d":"A unit of weight of one sixteenth of a pound avoirdupois (approximately 28 grams)."},{"id":2831,"l":5,"w":"outdo","k":"͵aʊt`du","p":"vt.","c":"勝過；超越","es":"It will be difficult to outdo their previous performance.","cs":"要勝過他們以前的表現將會很困難。","d":"To be more successful than."},{"id":2832,"l":5,"w":"outgoing","k":"`aʊt͵goɪŋ","p":"adj.","c":"外向的； 外出的","es":"She is a very friendly and outgoing person.","cs":"她是一個非常友善和外向的人。","d":"Friendly and socially confident; leaving an office or position."},{"id":2833,"l":5,"w":"output","k":"`aʊt͵pʊt","p":"n.vt.","c":"出產；生產","es":"The factory's output increased significantly this quarter.","cs":"這家工廠本季度的出產（產量）顯著增加。","d":"The amount of something produced by a person, machine, or industry."},{"id":2834,"l":5,"w":"outsider","k":"`aʊt`saɪdɚ","p":"n.","c":"局外人","es":"He felt like an outsider in the new office.","cs":"他在新辦公室裡感覺自己像個局外人。","d":"A person who does not belong to a particular group."},{"id":2835,"l":5,"w":"outskirts","k":"`aʊt͵skɝts","p":"n.","c":"郊區","es":"They live on the outskirts of the capital city.","cs":"他們住在首都的郊區。","d":"The outer parts of a town or city."},{"id":2836,"l":5,"w":"outward","k":"`aʊtwɚd","p":"adj.advt.","c":"往外去的 (地)","es":"The sign showed the ship's outward bound direction.","cs":"牌子顯示了船隻往外去的方向。","d":"Of, on, or from the outside; relating to the external appearance of something."},{"id":2837,"l":5,"w":"outward(s)","k":"ˈaʊtwədz","p":"advt.","c":"往外去","es":"He stepped outwards from the building into the rain.","cs":"他從建築物裡往外去走進雨中。","d":"Toward the outside."},{"id":2838,"l":5,"w":"overall","k":"`ovɚ͵ɔl","p":"adj.adv.n.","c":"全部的；大體上來說；連身工作服","es":"The overall goal is to improve customer satisfaction.","cs":"全部的目標是提高客戶滿意度。","d":"Taking everything into account; a loose-fitting coat or one-piece garment worn over ordinary clothes for protection against dirt or heavy wear."},{"id":2839,"l":5,"w":"overdo","k":"͵ovɚ`du","p":"vt.vi.","c":"(把…) 做得過分","es":"Be careful not to overdo the salt in the soup.","cs":"小心不要在湯裡做得過分（放太多鹽）。","d":"To do, use, or carry to excess; exaggerate."},{"id":2840,"l":5,"w":"overeat","k":"`ovɚ`it","p":"vi.vt.","c":"過度飲食","es":"It's easy to overeat during the holidays.","cs":"在節日期間很容易過度飲食。","d":"To eat too much."},{"id":2841,"l":5,"w":"overflow","k":"͵ovɚ`flo","p":"vi.vt.","c":"氾濫","es":"The river is expected to overflow its banks tonight.","cs":"預計這條河將在今晚氾濫。","d":"To flow over the brim of a receptacle; to be too full to hold its contents."},{"id":2842,"l":5,"w":"overhear","k":"͵ovɚ`hɪr","p":"vt.vi.","c":"無意中聽到","es":"I accidentally overheard their conversation in the hallway.","cs":"我在走廊上無意中聽到了他們的談話。","d":"To hear (someone or something) without meaning to or without the knowledge of the speaker."},{"id":2843,"l":5,"w":"oversleep","k":"`ovɚ`slip","p":"vi.vt.","c":"睡過頭","es":"She set an alarm to avoid oversleeping.","cs":"她設了鬧鐘以避免睡過頭。","d":"To sleep longer or later than one intended."},{"id":2844,"l":5,"w":"overwhelm","k":"͵ovɚ`hwɛlm","p":"vt.","c":"戰勝；淹沒","es":"The sheer number of tasks threaten to overwhelm him.","cs":"任務的數量之多威脅要淹沒他。","d":"To bury or drown beneath a huge mass; to defeat completely."},{"id":2845,"l":5,"w":"overwork","k":"`ovɚ`wɝk","p":"vt.vi.","c":"過度工作","es":"He collapsed from overwork after a week of late nights.","cs":"在熬夜一週後，他因過度工作而倒下。","d":"To work too hard or too much."},{"id":2846,"l":5,"w":"oyster","k":"`ɔɪstɚ","p":"n.","c":"蛤蠣","es":"I ordered a dozen fresh oysters for the appetizer.","cs":"我點了一打新鮮的蛤蠣作為開胃菜。","d":"Any of a number of bivalve mollusks with rough irregular shells. Several kinds are eaten (especially raw) as a delicacy and may be farmed for food or pearls."},{"id":2847,"l":5,"w":"ozone","k":"`ozon","p":"n.","c":"臭氧","es":"The ozone layer protects us from the sun's radiation.","cs":"臭氧層保護我們免受太陽輻射。","d":"A colorless unstable toxic gas with a pungent odor and powerful oxidizing properties, formed from oxygen by electrical discharges or ultraviolet light."},{"id":2848,"l":5,"w":"pacific","k":"pə`sɪfɪk","p":"adj.","c":"和平的","es":"They hope to reach a pacific resolution to the conflict.","cs":"他們希望達成一個和平的解決方案來解決衝突。","d":"Peaceful in character or intent."},{"id":2849,"l":5,"w":"packet","k":"`pæ k ɪt","p":"n.","c":"小包裹","es":"He received a small packet containing seeds in the mail.","cs":"他收到了一個郵寄的裝有種子的小包裹。","d":"A paper or cardboard container, typically one in which goods are packed to be sold."},{"id":2850,"l":5,"w":"paddle","k":"`pæ d!","p":"n.","c":"槳","es":"She used a wooden paddle to stir the soup.","cs":"她用一個木製的槳來攪拌湯。","d":"A short pole with a broad blade at one or both ends, used without an oarlock to move a small boat or canoe through the water."},{"id":2851,"l":5,"w":"pane","k":"pen","p":"n.","c":"窗玻璃","es":"A bird flew directly into the window pane.","cs":"一隻鳥直接撞上了窗戶玻璃。","d":"A single sheet of glass in a window or door."},{"id":2852,"l":5,"w":"paradox","k":"`pæ r ə͵dɑks","p":"n.","c":"自相矛盾的人事物","es":"It's a paradox that a long life can feel so short.","cs":"長壽卻感覺如此短暫，這是一個自相矛盾的人事物。","d":"A seemingly absurd or self-contradictory statement or proposition that when investigated or explained may prove to be well founded or true."},{"id":2853,"l":5,"w":"parallel","k":"`pæ r ə͵lɛl","p":"adj.","c":"平行的；並聯的","es":"The two lines are exactly parallel to each other.","cs":"這兩條線彼此完全平行。","d":"(Of lines, planes, surfaces, or objects) side by side and having the same distance continuously between them."},{"id":2854,"l":5,"w":"parlor","k":"`pɑrlɚ","p":"n.","c":"起居室","es":"The family gathered in the parlor for tea.","cs":"一家人聚集在起居室喝茶。","d":"A sitting room in a private house."},{"id":2855,"l":5,"w":"participant","k":"pɑr`tɪsəpənt","p":"n.","c":"參與者","es":"Every participant received a certificate of completion.","cs":"每位參與者都收到了結業證書。","d":"A person who takes part in something."},{"id":2856,"l":5,"w":"particle","k":"`pɑrtɪk!","p":"n.","c":"微粒","es":"The air in the old room was filled with dust particles.","cs":"舊房間裡的空氣中充滿了灰塵微粒。","d":"A minute portion of matter."},{"id":2857,"l":5,"w":"partly","k":"`pɑrtlɪ","p":"advt.","c":"部分地","es":"The project was funded partly by private donations.","cs":"該項目部分地由私人捐款資助。","d":"To some extent; not completely."},{"id":2858,"l":5,"w":"passionate","k":"`pæʃənɪt","p":"adj.","c":"熱情的","es":"He delivered a passionate speech about human rights.","cs":"他發表了一篇關於人權的熱情的演講。","d":"Showing or caused by strong feelings or a strong belief."},{"id":2859,"l":5,"w":"pastime","k":"`pæs͵ta ɪm","p":"n.","c":"消遣、娛樂","es":"Reading is her favorite pastime.","cs":"閱讀是她最喜歡的消遣。","d":"An activity that someone does regularly for enjoyment rather than work; a hobby."},{"id":2860,"l":5,"w":"pastry","k":"`pestr ɪ","p":"n.","c":"酥皮點心","es":"The bakery is famous for its delicate fruit pastry.","cs":"這家烘焙店以其精緻的水果酥皮點心而聞名。","d":"A dough of flour, fat, and water, used as a base and covering in baked dishes such as pies."},{"id":2861,"l":5,"w":"patch","k":"pæ tʃ","p":"n.","c":"補釘；貼片","es":"She sewed a decorative patch onto the ripped jeans.","cs":"她在撕裂的牛仔褲上縫了一個裝飾性的補釘。","d":"A piece of cloth or other material used to mend or strengthen a torn or weak point."},{"id":2862,"l":5,"w":"patent","k":"`pæ tnt","p":"n.","c":"專利","es":"The inventor applied for a patent on his new device.","cs":"這位發明家為他的新設備申請了專利。","d":"A government authority or license conferring a right or title for a set period, especially the sole right to exclude others from making, using, or selling an invention."},{"id":2863,"l":5,"w":"patriot","k":"`petr ɪət","p":"n.","c":"愛國者","es":"He is a true patriot who loves his country deeply.","cs":"他是一位深愛自己國家的真正愛國者。","d":"A person who vigorously supports their country and is prepared to defend it against enemies or detractors."},{"id":2864,"l":5,"w":"patrol","k":"pə`trol","p":"n.vi.vt.","c":"巡邏","es":"The guards are scheduled to patrol the area hourly.","cs":"警衛計劃每小時在該地區巡邏一次。","d":"To keep watch over (an area) by regularly walking or traveling around or through it."},{"id":2865,"l":5,"w":"patron","k":"`petr ən","p":"n.","c":"贊助者；主顧","es":"The restaurant owner greets all his regular patrons warmly.","cs":"餐廳老闆熱情地迎接他所有常規的主顧。","d":"A person who gives financial or other support to a person, organization, cause, or activity; a customer, especially a regular one, of a store, restaurant, or theater."},{"id":2866,"l":5,"w":"peacock","k":"`pik ɑk","p":"n.","c":"孔雀","es":"The male peacock fans out its beautiful tail feathers.","cs":"雄孔雀會展開其美麗的尾羽。","d":"A male peafowl, which has very long tail feathers that have eye-like markings and can be erected and fanned out in display."},{"id":2867,"l":5,"w":"peasant","k":"`pɛznt","p":"n.","c":"佃農","es":"The novel tells the story of a poor peasant family.","cs":"這部小說講述了一個貧窮佃農家庭的故事。","d":"A poor farmer of low social status who owns or rents a small piece of land for cultivation (chiefly in historical use or with reference to subsistence farming in poorer countries)."},{"id":2868,"l":5,"w":"peck","k":"pɛk","p":"vt.vi.n.","c":"啄","es":"The chicken began to peck at the grain on the ground.","cs":"雞開始啄地上的穀物。","d":"(Of a bird) strike or bite something with its beak."},{"id":2869,"l":5,"w":"peddler","k":"`pɛdlɚ","p":"n.","c":"小販","es":"A street peddler was selling flowers on the corner.","cs":"一位街頭小販在角落裡賣花。","d":"A person who goes from place to place selling small items."},{"id":2870,"l":5,"w":"peek","k":"pik","p":"vi.n.","c":"偷看；窺視","es":"She took a quick peek through the keyhole.","cs":"她透過鑰匙孔快速地偷看了一眼。","d":"To look quickly, typically in a furtive manner."},{"id":2871,"l":5,"w":"peg","k":"pɛg","p":"n.","c":"栓；樁","es":"He hammered a small wooden peg into the ground.","cs":"他將一根小的木樁敲入地面。","d":"A short cylindrical piece of wood, metal, or plastic, typically tapered at one end, that is used for holding things together, hanging things on, or marking a position."},{"id":2872,"l":5,"w":"penetrate","k":"`pɛnə͵tret","p":"vt.vi.","c":"穿透","es":"The drill bit managed to penetrate the thick steel plate.","cs":"鑽頭成功地穿透了厚鋼板。","d":"To succeed in forcing a way into or through (a thing)."},{"id":2873,"l":5,"w":"perceive","k":"pɚ`siv","p":"vt.","c":"察覺；感知","es":"She could perceive a sense of nervousness in his voice.","cs":"她能察覺到他聲音中的一絲緊張感。","d":"To become aware or conscious of (something); come to realize or understand."},{"id":2874,"l":5,"w":"perch","k":"pɝtʃ","p":"n.v.","c":"棲木；(使)棲息","es":"A colourful parrot was sitting on a wooden perch.","cs":"一隻色彩鮮豔的鸚鵡正棲息在一個木製棲木上。","d":"A place where a bird sits or rests; to sit on something high or narrow."},{"id":2875,"l":5,"w":"performer","k":"pɚ`fɔrmɚ","p":"n.","c":"表演者","es":"The performer received a standing ovation for her dance.","cs":"這位表演者因她的舞蹈獲得了起立鼓掌。","d":"A person who entertains an audience."},{"id":2876,"l":5,"w":"peril","k":"`pɛrəl","p":"n.","c":"危險的事物","es":"The mountaineers faced the constant peril of avalanches.","cs":"登山者面臨著雪崩的持續危險。","d":"Serious and immediate danger."},{"id":2877,"l":5,"w":"perish","k":"`pɛrɪʃ","p":"vi.vt.","c":"消滅；枯萎","es":"Millions of fish perished due to the polluted water.","cs":"數百萬條魚因水污染而死亡（消滅）。","d":"To suffer death, typically in a violent, sudden, or untimely way."},{"id":2878,"l":5,"w":"permissible","k":"pɚ`mɪsəb!","p":"adj.","c":"可允許的","es":"Smoking is not permissible inside the building.","cs":"在大樓內吸煙是可允許的（不被允許）。","d":"Permitted; allowed."},{"id":2879,"l":5,"w":"persist","k":"pɚ`sɪst","p":"vi.vt.","c":"堅持 (說)","es":"She decided to persist in her studies despite the difficulties.","cs":"儘管困難重重，她決定堅持她的學業。","d":"To continue firmly or obstinately in an opinion or a course of action in spite of difficulty, opposition, or failure."},{"id":2880,"l":5,"w":"personnel","k":"͵pɝsn`ɛl","p":"n.","c":"(總稱 )人員","es":"The company needs to hire more technical personnel.","cs":"該公司需要招聘更多技術人員。","d":"People employed in an organization or engaged in an organized undertaking such as military service."},{"id":2881,"l":5,"w":"pessimism","k":"`pɛsəmɪzəm","p":"n.","c":"悲觀主義","es":"His natural pessimism leads him to expect the worst.","cs":"他天生的悲觀主義使他預期最壞的情況。","d":"A tendency to see the worst aspect of things or believe that the worst will happen; a lack of hope or confidence in the future."},{"id":2882,"l":5,"w":"pier","k":"pɪr","p":"n.","c":"碼頭","es":"They walked along the wooden pier overlooking the sea.","cs":"他們沿著俯瞰大海的木製碼頭散步。","d":"A structure leading out from the shore into a body of water, in particular."},{"id":2883,"l":5,"w":"pilgrim","k":"`pɪlgrɪm","p":"n.","c":"朝聖者；香客","es":"Many pilgrims travel to the holy city each year.","cs":"每年有許多朝聖者前往這座聖城。","d":"A person who journeys to a sacred place for religious reasons."},{"id":2884,"l":5,"w":"pillar","k":"`pɪlɚ","p":"n.","c":"柱子","es":"The ancient temple was supported by massive stone pillars.","cs":"這座古老的寺廟由巨大的石柱子支撐著。","d":"A tall vertical structure of stone, wood, or metal, used as a support for a building, or as an ornament or monument."},{"id":2885,"l":5,"w":"pimple","k":"`pɪmp!","p":"n.","c":"面匏","es":"She noticed a small red pimple on her chin.","cs":"她注意到她的下巴上長了一個小小的紅面匏。","d":"A small hard inflamed spot on the skin."},{"id":2886,"l":5,"w":"pinch","k":"pɪntʃ","p":"vt.vi.n.","c":"擰；夾","es":"She gave her brother a gentle pinch on the arm.","cs":"她輕輕地捏了一下她兄弟的胳膊。","d":"To grip (something, typically a person's flesh) tightly and sharply between finger and thumb."},{"id":2887,"l":5,"w":"piss","k":"pɪs","p":"vi.vt.n.","c":"小便","es":"The cat decided to piss on the carpet.","cs":"貓決定在地毯上小便。","d":"To urinate."},{"id":2888,"l":5,"w":"pistol","k":"`pɪst!","p":"n.","c":"手槍","es":"The officer drew his service pistol.","cs":"這位警官拔出了他的配備手槍。","d":"A small firearm designed to be held in one hand."},{"id":2889,"l":5,"w":"plague","k":"pleg","p":"n.vt.","c":"瘟疫；鼠疫；討厭的人；使…苦惱 (折磨 )","es":"The Black Plague swept across Europe in the 14th century.","cs":"黑瘟疫在14世紀席捲了歐洲。","d":"A contagious bacterial disease characterized by fever and delirium; to cause continual trouble or distress to."},{"id":2890,"l":5,"w":"plantation","k":"plæ n`te ʃən","p":"n.","c":"農園；造林地","es":"The new owner is developing a banana plantation.","cs":"新主人正在開發一個香蕉農園。","d":"An estate on which crops such as coffee, sugar, and tobacco are cultivated by resident labor."},{"id":2891,"l":5,"w":"playwright","k":"`ple͵ra ɪt","p":"n.","c":"劇作家","es":"William Shakespeare is a famous English playwright.","cs":"威廉·莎士比亞是一位著名的英國劇作家。","d":"A person who writes plays."},{"id":2892,"l":5,"w":"plea","k":"pli","p":"n.","c":"請求、懇託；藉口","es":"The charity issued a public plea for donations.","cs":"該慈善機構發布了一項公開的請求捐款。","d":"A request made in an urgent and emotional manner."},{"id":2893,"l":5,"w":"plead","k":"plid","p":"vt.vi.","c":"( 為…)辯護；承認","es":"The lawyer will plead the defendant's case in court.","cs":"律師將在法庭上為被告辯護。","d":"To make an emotional appeal; to present and argue for (a position), especially in court or in another public context."},{"id":2894,"l":5,"w":"pledge","k":"plɛdʒ","p":"n.vt.","c":"保證；立誓","es":"They made a solemn pledge to support each other.","cs":"他們立下莊嚴的保證要互相支持。","d":"A solemn promise or undertaking."},{"id":2895,"l":5,"w":"plow","k":"plaʊ","p":"n.vt.vi.","c":"犁；耕地","es":"The farmer used a tractor to plow the field.","cs":"農夫使用拖拉機犁田。","d":"A large farming implement with one or more blades fixed in a frame, drawn by a tractor or by animals and used for cutting furrows in the soil and turning it over, to prepare for the planting of seeds."},{"id":2896,"l":5,"w":"pluck","k":"plʌk","p":"vt.vi.n.","c":"拔","es":"She was careful to pluck the sour apples from the branch.","cs":"她小心地從樹枝上拔下那些酸蘋果。","d":"To take hold of (something) and quickly remove it from its place."},{"id":2897,"l":5,"w":"plunge","k":"plʌndʒ","p":"vt.vi.n.","c":"( 使)投入；跳入","es":"The diver took a deep breath and took the plunge into the water.","cs":"潛水員深吸了一口氣，跳入水中。","d":"To jump or dive quickly and energetically."},{"id":2898,"l":5,"w":"pocketbook","k":"`pɑkɪt͵bʊk","p":"n.","c":"袖珍書","es":"He carried a small leather pocketbook with him.","cs":"他隨身攜帶一個小皮革袖珍書（皮夾）。","d":"A woman's handbag or a small bag or case for carrying money and personal items."},{"id":2899,"l":5,"w":"poetic","k":"po`ɛtɪk","p":"adj.","c":"詩的","es":"His writing style is very elegant and poetic.","cs":"他的寫作風格非常優雅且詩的。","d":"Relating to or used in poetry."},{"id":2900,"l":5,"w":"poke","k":"pok","p":"vt.vi.n.","c":"戳","es":"Don't poke the animal with a stick.","cs":"不要用棍子戳動物。","d":"To jab or prod (someone or something), especially with one's finger or a blunt object."},{"id":2901,"l":5,"w":"polar","k":"`pol ɚ","p":"adj.","c":"極地的","es":"Scientists are concerned about the melting of the polar ice caps.","cs":"科學家們擔心極地的冰蓋融化。","d":"Relating to the North or South Pole."},{"id":2902,"l":5,"w":"porch","k":"port ʃ","p":"n.","c":"門廊；入口處","es":"We sat on the front porch and watched the rain.","cs":"我們坐在前門廊上，看著雨。","d":"A covered shelter projecting in front of the entrance of a building."},{"id":2903,"l":5,"w":"potential","k":"pə`tɛnʃəl","p":"adj.","c":"潛在的","es":"The new recruit has great potential as a leader.","cs":"這位新兵作為領導者有巨大的潛在的可能性。","d":"Having or showing the capacity to become or develop into something in the future."},{"id":2904,"l":5,"w":"poultry","k":"`poltr ɪ","p":"n.","c":"家禽","es":"The farm specializes in raising free-range poultry.","cs":"這個農場專門飼養放養的家禽。","d":"Domestic fowl, such as chickens, turkeys, ducks, and geese."},{"id":2905,"l":5,"w":"prairie","k":"`prɛrɪ","p":"n.","c":"大草原； 牧場","es":"Bison once roamed freely across the vast prairie.","cs":"以前，野牛曾在廣闊的大草原上自由漫遊。","d":"A large open area of grassland, especially in the Mississippi River valley."},{"id":2906,"l":5,"w":"preach","k":"pritʃ","p":"vt.vi.n.","c":"傳道；鼓吹","es":"The minister began to preach his sermon.","cs":"牧師開始傳道他的布道。","d":"To deliver a sermon or religious address to an assembled group of people, typically in church."},{"id":2907,"l":5,"w":"precaution","k":"prɪ`kɔʃən","p":"n.","c":"預防 (措施 )；警惕","es":"Take the necessary precautions before traveling.","cs":"在旅行前採取必要的預防措施。","d":"A measure taken in advance to prevent something dangerous, unpleasant, or inconvenient from happening."},{"id":2908,"l":5,"w":"preference","k":"`prɛfərəns","p":"n.","c":"偏好的事物","es":"She stated her preference for chocolate ice cream.","cs":"她表明了她偏好的事物是巧克力冰淇淋。","d":"A greater liking for one alternative over another or others."},{"id":2909,"l":5,"w":"prehistoric","k":"͵prih ɪs`tɔrɪk","p":"adj.","c":"史前的","es":"Dinosaurs lived during the prehistoric era.","cs":"恐龍生活在史前的時代。","d":"Relating to or denoting the period before written records."},{"id":2910,"l":5,"w":"prevail","k":"prɪ`vel","p":"vi.","c":"戰勝","es":"Justice will eventually prevail over evil.","cs":"正義最終將戰勝邪惡。","d":"To prove more powerful than opposing forces; be victorious."},{"id":2911,"l":5,"w":"preview","k":"`pri͵vju","p":"n.vt.","c":"預習","es":"The teacher asked us to preview the next chapter.","cs":"老師要求我們預習下一章。","d":"An inspection or viewing of something before it is bought or becomes generally known and available."},{"id":2912,"l":5,"w":"prey","k":"pre","p":"n.","c":"獵物","es":"The lioness dragged its prey back to the den.","cs":"獅子將它的獵物拖回巢穴。","d":"An animal that is hunted and killed by another for food."},{"id":2913,"l":5,"w":"priceless","k":"`pra ɪslɪs","p":"adj.","c":"無價的","es":"This antique vase is truly priceless.","cs":"這個古董花瓶是真正無價的。","d":"So precious that its value cannot be determined."},{"id":2914,"l":5,"w":"prick","k":"prɪk","p":"vt.vi.n.","c":"刺(痛)","es":"The sharp needle gave his finger a quick prick.","cs":"鋒利的針迅速刺了一下他的手指。","d":"To make a small hole in (something) with a sharp point; pierce slightly."},{"id":2915,"l":5,"w":"prior","k":"`pra ɪɚ","p":"adj.","c":"優先的","es":"The event requires prior registration.","cs":"該活動要求優先的（事先）註冊。","d":"Existing or coming before in time, order, or importance."},{"id":2916,"l":5,"w":"priority","k":"praɪ`ɔrətɪ","p":"n.","c":"優先 (權)","es":"Safety is our number one priority.","cs":"安全是我們的頭號優先權。","d":"The fact or condition of being regarded or treated as more important."},{"id":2917,"l":5,"w":"procession","k":"prə`sɛʃən","p":"n.","c":"行進隊伍","es":"The funeral procession moved slowly down the street.","cs":"送葬隊伍緩緩地沿著街道移動。","d":"A number of people or vehicles moving forward in an orderly fashion, especially as part of a ceremony or festival."},{"id":2918,"l":5,"w":"profile","k":"`profa ɪl","p":"n.","c":"輪廓；外型；人物簡介","es":"The magazine published a profile of the young entrepreneur.","cs":"雜誌刊登了這位年輕企業家的人物簡介。","d":"An outline of something, especially a person's face, as seen from one side; a short article giving a description of a person or organization."},{"id":2919,"l":5,"w":"prolong","k":"prə`lɔŋ","p":"vt.","c":"延長；拖長","es":"They had to prolong their stay due to the storm.","cs":"由於暴風雨，他們不得不延長逗留時間。","d":"To lengthen or extend in duration or space."},{"id":2920,"l":5,"w":"prop","k":"prɑp","p":"n.vt.","c":"支柱；支撐；道具 (property)","es":"They used a wooden prop to keep the door open.","cs":"他們用一根木支柱來保持門開著。","d":"A pole or beam used as a temporary support or to keep something in position; a portable object other than furniture or costumes used on the set of a play or movie."},{"id":2921,"l":5,"w":"prophet","k":"`prɑfɪt","p":"n.","c":"先知","es":"The ancient prophet foretold the future.","cs":"古代先知預言了未來。","d":"A person regarded as an inspired teacher or proclaimer of the will of God."},{"id":2922,"l":5,"w":"proportion","k":"prə`porʃən","p":"n.","c":"比例；比率","es":"The proportion of men to women in the class is equal.","cs":"班上男女的比例是相等的。","d":"A part, share, or number considered in comparative relation to a whole."},{"id":2923,"l":5,"w":"prospect","k":"`prɑspɛkt","p":"n.","c":"指望；預期；景象","es":"The job has excellent prospects for promotion.","cs":"這份工作有很好的晉升指望。","d":"The possibility or likelihood of some future event occurring."},{"id":2924,"l":5,"w":"province","k":"`prɑvɪns","p":"n.","c":"省","es":"Quebec is the largest province in Canada.","cs":"魁北克是加拿大最大的省。","d":"A principal administrative division of certain countries or empires."},{"id":2925,"l":5,"w":"prune (1)","k":"prun","p":"n.v.","c":"梅乾 (2) ；修剪","es":"She likes to eat dried prunes for fiber.","cs":"她喜歡吃曬乾的梅乾來攝取纖維。","d":"A plum preserved by drying, having a black, wrinkled appearance; to trim (a tree, shrub, or bush) by cutting away dead or overgrown branches or stems."},{"id":2926,"l":5,"w":"publicize","k":"`pʌblɪ͵saɪz","p":"vt.","c":"宣傳；公布","es":"The company hired a firm to publicize their new product.","cs":"該公司聘請了一家公司來宣傳他們的新產品。","d":"To make (something) widely known."},{"id":2927,"l":5,"w":"puff","k":"pʌf","p":"n.","c":"泡芙","es":"He enjoyed a delicious cream puff for dessert.","cs":"他享用了一個美味的奶油泡芙作為甜點。","d":"A short, explosive burst of breath or wind; a light pastry."},{"id":2928,"l":5,"w":"pulse","k":"pʌls","p":"n.","c":"脈搏","es":"The nurse checked the patient's pulse.","cs":"護士檢查了病人的脈搏。","d":"A rhythmical throbbing of the arteries as blood is propelled through them, typically as felt in the wrists or neck."},{"id":2929,"l":5,"w":"purchase","k":"`pɝtʃəs","p":"vt.n.","c":"購買","es":"I need to purchase a new coat for the winter.","cs":"我需要購買一件新外套過冬。","d":"To acquire (something) by paying for it; buy."},{"id":2930,"l":5,"w":"pyramid","k":"`pɪrəmɪd","p":"n.","c":"金字塔","es":"The Great Pyramid of Giza is a wonder of the ancient world.","cs":"吉薩大金字塔是古代世界的一個奇觀。","d":"A monumental structure with a square or triangular base and sloping sides that meet in a point at the top, especially one built of stone as a royal tomb in ancient Egypt."},{"id":2931,"l":5,"w":"quack","k":"kwæ k","p":"n.","c":"呱呱聲；庸醫","es":"The doctor was later exposed as a quack.","cs":"這位醫生後來被揭露為一個庸醫。","d":"The characteristic harsh sound made by a duck; a person who dishonestly claims to have special knowledge and skill in some field, typically in medicine."},{"id":2932,"l":5,"w":"qualify","k":"`kw ɑlə͵faɪ","p":"vt.vi.","c":"使合格；取得資格","es":"She needs to qualify for the final round of the competition.","cs":"她需要取得資格才能參加決賽。","d":"To be entitled to a particular benefit or privilege by fulfilling a necessary condition."},{"id":2933,"l":5,"w":"quart","k":"kwɔrt","p":"n.","c":"夸脫 (英美容量單位 )","es":"He poured a quart of milk into the pitcher.","cs":"他將一夸脫牛奶倒入水罐中。","d":"A unit of liquid capacity equal to a quarter of a gallon or two pints, equivalent in the US to approximately 0.94 liter and in Britain to approximately 1.13 liters."},{"id":2934,"l":5,"w":"quest","k":"kwɛst","p":"n.vi.vt.","c":"尋求；追求","es":"The knights went on a quest for the Holy Grail.","cs":"騎士們踏上尋求聖杯的尋求（探索）之旅。","d":"A long or arduous search for something."},{"id":2935,"l":5,"w":"quiver","k":"`kw ɪvɚ","p":"vi.vt.n.","c":"發抖；(使)顫動","es":"The sudden noise made the cat quiver with fear.","cs":"突如其來的噪音讓貓因害怕而顫抖。","d":"To tremble or shake with a slight rapid motion."},{"id":2936,"l":5,"w":"rack (1)","k":"ræ k","p":"n.vt.","c":"架子；把…放架子上；折磨；過度使用","es":"She hung the clothes on the drying rack.","cs":"她把衣服掛在晾衣架子上。","d":"A framework, typically with rails, bars, hooks, or pegs, for holding or storing things."},{"id":2937,"l":5,"w":"radish","k":"`ræ d ɪʃ","p":"n.","c":"蘿蔔","es":"He grated the radish to add to the salad.","cs":"他把蘿蔔磨碎加入沙拉中。","d":"A swollen pungent-tasting edible root, especially a variety that is small, spherical, and red, and eaten raw with salad."},{"id":2938,"l":5,"w":"radius","k":"`red ɪəs","p":"n.","c":"半徑","es":"The bike has a turning radius of one meter.","cs":"這輛自行車的轉彎半徑是一米。","d":"A straight line from the center to the circumference of a circle or sphere."},{"id":2939,"l":5,"w":"ragged","k":"`ræ g ɪd","p":"adj.","c":"破爛的","es":"The beggar was wearing old, ragged clothes.","cs":"這位乞丐穿著破舊、破爛的衣服。","d":"(Of cloth or clothes) old and torn."},{"id":2940,"l":5,"w":"rail","k":"rel","p":"n.","c":"欄杆；扶手； 鐵軌","es":"Be careful not to fall over the loose rail.","cs":"小心不要被鬆動的欄杆絆倒。","d":"A bar or series of bars, typically fixed on upright supports, serving as part of a fence or barrier or used to hang things on."},{"id":2941,"l":5,"w":"rally","k":"`ræ l ɪ","p":"vt.vi.n.","c":"重整旗鼓； 集合","es":"The politician held a large election rally in the park.","cs":"這位政治家在公園舉行了一場大型選舉集會。","d":"A mass meeting of people making a political protest or showing support for a cause; to bring or come together in order to support a person or cause."},{"id":2942,"l":5,"w":"ranch","k":"ræ nt ʃ","p":"n.","c":"大牧場","es":"The movie is set on a large cattle ranch.","cs":"這部電影的背景設定在一個大型牛牧場。","d":"A large farm, especially in the western US and Canada, where cattle or other animals are bred and raised."},{"id":2943,"l":5,"w":"rascal","k":"`ræ sk!","p":"n.","c":"流氓；無賴","es":"The little rascal played a trick on his sister.","cs":"這個小流氓（小淘氣）對他姐姐惡作劇。","d":"A mischievous or cheeky person, especially a child or man (typically used in an affectionate way)."},{"id":2944,"l":5,"w":"ratio","k":"`reʃo","p":"n.","c":"比例","es":"The ratio of students to teachers is twenty to one.","cs":"學生與老師的比例是二十比一。","d":"The quantitative relation between two amounts showing the number of times one value contains or is contained within the other."},{"id":2945,"l":5,"w":"rattle","k":"`ræ t!","p":"vt.vi.n.","c":"(使發出 )喀喀聲","es":"The baby shook the toy and made a rattleing noise.","cs":"寶寶搖晃著玩具，發出了喀喀聲。","d":"To make a rapid succession of short, sharp knocking sounds, typically as a result of shaking and striking repeatedly against a hard surface or object."},{"id":2946,"l":5,"w":"realm","k":"rɛlm","p":"n.","c":"王國","es":"The king's authority extended throughout his entire realm.","cs":"國王的權威遍及他整個王國。","d":"A kingdom."},{"id":2947,"l":5,"w":"reap","k":"rip","p":"v.","c":"收割","es":"The company is now reaping the benefits of its early investments in technology.","cs":"這家公司現在正獲得其早期投資科技所帶來的收益。","d":"To cut or gather (a crop or harvest)."},{"id":2948,"l":5,"w":"rear","k":"rɪr","p":"n.v.","c":"後方；撫養；高聳","es":"She sat in the rear of the concert hall.","cs":"她坐在音樂廳的後方。","d":"The back part of something, especially a building or vehicle; to bring up and care for (a child) until they are fully grown, especially in a particular manner or place."},{"id":2949,"l":5,"w":"reckless","k":"`rɛklɪs","p":"adj.","c":"魯莽的","es":"Driving while tired is a reckless thing to do.","cs":"疲勞駕駛是件魯莽的事情。","d":"(Of a person or their actions) without thinking or caring about the consequences of an action."},{"id":2950,"l":5,"w":"reckon","k":"`rɛkən","p":"vt.vi.","c":"計算；認為","es":"I reckon we will arrive sometime after noon.","cs":"我認為我們會在中午之後的某個時候到達。","d":"To establish by calculation; consider or regard in a specified way."},{"id":2951,"l":5,"w":"recommend","k":"͵rɛkə`mɛnd","p":"vt.vi.","c":"推薦","es":"I can highly recommend this book to you.","cs":"我可以強烈地向你推薦這本書。","d":"To put forward (someone or something) with approval as being suitable for a particular purpose or role."},{"id":2952,"l":5,"w":"reef","k":"rif","p":"n.","c":"礁石","es":"The ship ran aground on the coral reef.","cs":"這艘船在珊瑚礁石上擱淺了。","d":"A ridge of jagged rock, coral, or sand just above or below the surface of the sea."},{"id":2953,"l":5,"w":"reel","k":"ril","p":"n.","c":"(一)捲、捆","es":"She carefully wound the thread onto the reel.","cs":"她小心翼翼地將線纏繞到一捲（線軸）上。","d":"A cylinder on which film, wire, thread, or other flexible materials can be wound."},{"id":2954,"l":5,"w":"referee","k":"͵rɛfə`ri","p":"n.","c":"裁判 (籃球、足球、拳擊 )","es":"The referee blew the whistle to end the game.","cs":"裁判吹響哨子結束比賽。","d":"An official who watches a game or match closely to ensure that the rules are adhered to and (in some sports) to arbitrate on matters arising from the play."},{"id":2955,"l":5,"w":"refuge","k":"`rɛfjudʒ","p":"n.","c":"避難所","es":"They sought refuge from the storm in the old barn.","cs":"他們在舊穀倉裡尋求躲避風暴的避難所。","d":"A condition of being safe or sheltered from pursuit, danger, or trouble."},{"id":2956,"l":5,"w":"refute","k":"rɪ`fjut","p":"vt.","c":"駁斥、反駁","es":"He tried to refute the professor's theory with new evidence.","cs":"他試圖用新的證據駁斥教授的理論。","d":"To prove (a statement or theory) to be wrong or false; disprove."},{"id":2957,"l":5,"w":"reign","k":"ren","p":"n.","c":"(君王 )在位期間","es":"The king's reign lasted for over fifty years.","cs":"國王的在位期間持續了五十多年。","d":"The period during which a sovereign rules."},{"id":2958,"l":5,"w":"rejoice","k":"rɪ`dʒɔɪs","p":"vi.vt.","c":"歡欣；快樂","es":"The whole town gathered to rejoice at the victory.","cs":"整個城鎮聚集在一起歡欣慶祝勝利。","d":"To feel or show great joy or delight."},{"id":2959,"l":5,"w":"relic","k":"`rɛlɪk","p":"n.","c":"遺物","es":"The museum displayed an ancient relic from the dig site.","cs":"博物館展示了一件從挖掘地點出土的古代遺物。","d":"An object surviving from an earlier time, especially one of historical or sentimental interest."},{"id":2960,"l":5,"w":"reminder","k":"rɪ`maɪndɚ","p":"n.","c":"提醒物","es":"The note served as a valuable reminder of his promise.","cs":"這張紙條是他承諾的一個寶貴提醒物。","d":"A thing that causes someone to remember something."},{"id":2961,"l":5,"w":"repay","k":"rɪ`pe","p":"vt.vi.","c":"回報","es":"I need to repay the money I borrowed from my brother.","cs":"我需要回報（償還）我從我兄弟那裡借來的錢。","d":"To pay back (money owed to someone)."},{"id":2962,"l":5,"w":"reproduce","k":"͵ripr ə`djus","p":"vt.vi.","c":"繁殖","es":"The artist used a machine to reproduce the sculptures.","cs":"藝術家使用機器來繁殖（複製）雕塑。","d":"To produce a copy or representation of; (of an organism) produce offspring."},{"id":2963,"l":5,"w":"reptile","k":"`rɛpt!","p":"n.","c":"爬蟲類","es":"Snakes are classified as reptiles.","cs":"蛇被歸類為爬蟲類。","d":"A cold-blooded vertebrate of a class that includes snakes, lizards, crocodiles, turtles, and tortoises. They are distinguished by having a dry scaly skin, and typically laying soft-shelled eggs on land."},{"id":2964,"l":5,"w":"republican","k":"rɪ`pʌblɪkən","p":"adj.","c":"共和政體的","es":"The country operates under a republican form of government.","cs":"該國在共和政體的政府形式下運作。","d":"Belonging to, or characteristic of a republic."},{"id":2965,"l":5,"w":"resent","k":"rɪ`zɛnt","p":"vt.","c":"怨恨","es":"She began to resent his constant criticism.","cs":"她開始怨恨他持續不斷的批評。","d":"To feel bitterness or indignation at (a circumstance, action, or person)."},{"id":2966,"l":5,"w":"resentment","k":"r ɪ`zɛntmənt","p":"n.","c":"怨恨","es":"The disagreement caused a deep resentment between the two friends.","cs":"意見不合在兩個朋友之間造成了深深的怨恨。","d":"Bitter indignation at having been treated unfairly."},{"id":2967,"l":5,"w":"reside","k":"rɪ`zaɪd","p":"vi.","c":"居住","es":"She has lived and resided in this city her whole life.","cs":"她一生都在這個城市生活和居住。","d":"To have one's permanent home in a particular place."},{"id":2968,"l":5,"w":"residence","k":"`rɛzədəns","p":"n.","c":"住所","es":"The President's official residence is the White House.","cs":"總統的官方住所是白宮。","d":"A person's home; the place where someone lives."},{"id":2969,"l":5,"w":"resident","k":"`rɛzədənt","p":"n.","c":"居民","es":"He is a long-time resident of the neighborhood.","cs":"他是這個社區的長期居民。","d":"A person who lives somewhere permanently or on a long-term basis."},{"id":2970,"l":5,"w":"resort","k":"rɪ`zɔrt","p":"vi.n.","c":"訴諸於 …；渡假勝地","es":"The family chose a beach resort for their vacation.","cs":"這家人選擇了一個海灘渡假勝地來度假。","d":"To turn to and adopt (a strategy or course of action, especially a disagreeable or undesirable one) so as to resolve a difficult situation; a place that is a popular destination for vacations or recreation, or which is frequented for a particular purpose."},{"id":2971,"l":5,"w":"restrain","k":"rɪ`stren","p":"vt.","c":"抑制","es":"The police had to restrain the aggressive crowd.","cs":"警察不得不抑制（約束）具攻擊性的人群。","d":"To prevent (someone or something) from doing something; keep under control or within limits."},{"id":2972,"l":5,"w":"resume","k":"rɪ`zjum","p":"vt.vi.","c":"重新開始 ；繼續","es":"After a break, the speaker will resume his presentation.","cs":"休息之後，演講者將重新開始他的簡報。","d":"To begin to do or pursue (something) again after a pause or interruption."},{"id":2973,"l":5,"w":"retort","k":"rɪ`tɔrt","p":"vt.vi.n.","c":"反擊；反駁","es":"She was quick to retort to his sarcastic comment.","cs":"她很快地反駁他的諷刺性評論。","d":"To say something in answer to a remark or accusation, typically in a sharp, angry, or wittily incisive manner."},{"id":2974,"l":5,"w":"reverse","k":"rɪ`vɝs","p":"adj.vt.vi.n.","c":"顛倒 (的)；倒轉","es":"The process needs to be carried out in reverse order.","cs":"這個過程需要以顛倒的順序執行。","d":"Going in or turned toward the direction opposite to that previously stated; move backward."},{"id":2975,"l":5,"w":"revive","k":"rɪ`vaɪv","p":"vi.vt.","c":"( 使)復甦","es":"The doctor performed CPR to revive the unconscious patient.","cs":"醫生進行了心肺復甦術來復甦失去知覺的病人。","d":"To restore to life or consciousness."},{"id":2976,"l":5,"w":"revolt","k":"rɪ`volt","p":"vi.vt.n.","c":"造反；使厭惡；反叛","es":"The people threatened to revolt against the harsh new laws.","cs":"人們威脅要造反對抗嚴苛的新法律。","d":"To rise in rebellion; cause to feel disgust."},{"id":2977,"l":5,"w":"revolve","k":"rɪ`vɑlv","p":"vi.vt.","c":"( 使)旋轉","es":"The Earth revolves around the Sun.","cs":"地球繞著太陽旋轉。","d":"To move in a circle on a central axis."},{"id":2978,"l":5,"w":"rhinoceros","k":"raɪ`nɑsərəs","p":"n.","c":"犀牛 (rhino )","es":"The safari guide pointed out a large rhinoceros.","cs":"野生動物導遊指著一隻大型犀牛。","d":"A large, heavily built plant-eating mammal with one or two horns on the nose and thick folded skin, native to Africa and southern Asia. All kinds have become endangered through hunting."},{"id":2979,"l":5,"w":"rib","k":"rɪb","p":"n.","c":"肋骨","es":"He broke a rib playing football.","cs":"他在踢足球時摔斷了一根肋骨。","d":"Each of a series of slender curved bones articulated in pairs to the spine (twelve pairs in humans), protecting the thoracic cavity and its organs."},{"id":2980,"l":5,"w":"ridge","k":"rɪdʒ","p":"n.","c":"山脊；梁","es":"We hiked along the narrow ridge of the mountain.","cs":"我們沿著山脈狹窄的山脊徒步旅行。","d":"A long narrow hilltop, mountain range, or watershed."},{"id":2981,"l":5,"w":"ridiculous","k":"rɪ`dɪkjələs","p":"adj.","c":"荒謬的","es":"The suggestion was completely ridiculous.","cs":"這個建議是完全荒謬的。","d":"Deserving or inviting derision or mockery; absurd."},{"id":2982,"l":5,"w":"rifle","k":"`raɪf!","p":"n.","c":"步槍","es":"The soldier carried his rifle during the mission.","cs":"士兵在任務中攜帶他的步槍。","d":"A gun, especially one fired from shoulder level, having a long spirally grooved barrel intended to make a bullet spin and thereby have greater accuracy over a long distance."},{"id":2983,"l":5,"w":"rigid","k":"`rɪdʒɪd","p":"adj.","c":"嚴苛的","es":"The company has a rigid set of rules that must be followed.","cs":"這家公司有一套嚴苛的規則必須遵守。","d":"Unable to bend or be forced out of shape; not flexible."},{"id":2984,"l":5,"w":"rim","k":"rɪm","p":"n.","c":"邊緣","es":"The glass shattered when it hit the rim of the table.","cs":"玻璃撞到桌子邊緣時碎裂了。","d":"The upper or outer edge of an object, typically something circular or approximately circular."},{"id":2985,"l":5,"w":"rip","k":"rɪp","p":"vt.vi.n.","c":"撕扯；裂開；裂縫","es":"She used scissors to rip the fabric apart.","cs":"她用剪刀把布料撕扯開。","d":"To tear or pull (something) quickly or forcibly away from something or someone."},{"id":2986,"l":5,"w":"ripple","k":"`rɪp!","p":"n.","c":"漣漪","es":"A small stone caused a ripple in the still water.","cs":"一塊小石頭在靜止的水面上引起了漣漪。","d":"A small wave or series of waves on the surface of water, especially as caused by an object dropping into it or a slight breeze."},{"id":2987,"l":5,"w":"rival","k":"`raɪv!","p":"n.","c":"對手","es":"The two companies are fierce rivals in the market.","cs":"這兩家公司是市場上激烈的對手。","d":"A person or thing competing with another for the same objective or for superiority in the same field of activity."},{"id":2988,"l":5,"w":"roam","k":"rom","p":"vi.vt.n.","c":"漫遊","es":"The traveler liked to roam the countryside.","cs":"這位旅行者喜歡在鄉間漫遊。","d":"To move about or travel aimlessly or unsystematically, especially over a wide area."},{"id":2989,"l":5,"w":"robin","k":"`rɑbɪn","p":"n.","c":"知更鳥","es":"A bright red robin landed on the window sill.","cs":"一隻鮮紅色的知更鳥停在了窗臺上。","d":"A small Old World thrush with a red breast and brown back, noted for its cheerful song."},{"id":2990,"l":5,"w":"robust","k":"rə`bʌst","p":"adj.","c":"強健的","es":"He is a man of robust health and great energy.","cs":"他是一個身體強健、精力充沛的人。","d":"Sturdy in construction (of an object); strong and healthy; vigorous."},{"id":2991,"l":5,"w":"rod","k":"rɑd","p":"n.","c":"棍子","es":"The old man leaned on his walking rod.","cs":"老人拄著他的手杖（棍子）。","d":"A thin straight bar, especially of wood or metal."},{"id":2992,"l":5,"w":"rubbish","k":"`rʌbɪʃ","p":"n.","c":"垃圾","es":"Please put the rubbish in the bin.","cs":"請把垃圾扔進垃圾桶。","d":"Waste material; refuse or litter."},{"id":2993,"l":5,"w":"rugged","k":"`rʌgɪd","p":"adj.","c":"高低不平的","es":"The hikers struggled up the steep, rugged path.","cs":"徒步旅行者們艱難地爬上陡峭、高低不平的小徑。","d":"(Of ground or terrain) having a broken, rocky, and uneven surface."},{"id":2994,"l":5,"w":"rumble","k":"`rʌmb!","p":"vi.vt.n.","c":"隆隆響","es":"We could hear the distant rumble of thunder.","cs":"我們可以聽到遠處雷聲的隆隆響。","d":"To make a continuous deep, resonant sound."},{"id":2995,"l":5,"w":"rustle","k":"`rʌs!","p":"vi.vt.n.","c":"沙沙作響","es":"The dry leaves began to rustle in the wind.","cs":"乾燥的樹葉開始在風中沙沙作響。","d":"To make a soft, muffled crackling sound like that made by the movement of dry leaves or paper."},{"id":2996,"l":5,"w":"sacred","k":"`sekr ɪd","p":"adj.","c":"神聖的","es":"The ancient temple is a sacred site.","cs":"這座古老的寺廟是一個神聖的地點。","d":"Connected with God (or the gods) or dedicated to a religious purpose and so deserving veneration."},{"id":2997,"l":5,"w":"saddle","k":"`sæ d!","p":"n.","c":"馬鞍","es":"He put the saddle on the horse's back.","cs":"他把馬鞍放在馬背上。","d":"A seat fastened on the back of a horse or other animal for riding, typically made of leather and raised at the front and rear."},{"id":2998,"l":5,"w":"saint","k":"sent","p":"n.","c":"聖徒","es":"Saint Patrick is the patron saint of Ireland.","cs":"聖徒帕特里克是愛爾蘭的主保聖人。","d":"A person acknowledged as holy or virtuous and typically regarded as being in heaven after death."},{"id":2999,"l":5,"w":"salmon","k":"`sæ m ən","p":"n.","c":"鮭魚","es":"Fresh salmon is a delicacy in this restaurant.","cs":"新鮮鮭魚是這家餐廳的美味佳餚。","d":"A large edible fish that is a popular sporting fish, much prized for its pink flesh. Salmon mature in the sea but migrate to freshwater streams to spawn."},{"id":3000,"l":5,"w":"salute","k":"sə`lut","p":"vt.vi.n.","c":"敬禮","es":"The soldiers were trained to perform a formal salute.","cs":"士兵們被訓練執行正式的敬禮。","d":"A gesture of respect, homage, or polite recognition or endeavor, especially one made to or by a person when arriving or departing."},{"id":3001,"l":5,"w":"sanctuary","k":"`sæŋkt ʃʊ͵ɛrɪ","p":"n.","c":"聖殿；庇護所","es":"The church was a sanctuary for those seeking peace.","cs":"教會是那些尋求和平者的聖殿（庇護所）。","d":"A place of refuge or safety; a nature reserve."},{"id":3002,"l":5,"w":"sandal","k":"`sæ nd!","p":"n.","c":"涼鞋","es":"She wore comfortable leather sandals on the beach.","cs":"她在海灘上穿著舒適的皮革涼鞋。","d":"A light shoe with either an openwork upper or straps attaching the sole to the foot."},{"id":3003,"l":5,"w":"savage","k":"`sæ v ɪdʒ","p":"adj.n.","c":"野蠻的；野蠻人","es":"The explorer encountered a savage tribe deep in the jungle.","cs":"探險家在叢林深處遇到了一個野蠻的部落。","d":"Fierce, violent, and uncontrolled; (chiefly in historical or literary contexts) a member of a people regarded as primitive and uncivilized."},{"id":3004,"l":5,"w":"scan","k":"skæ n","p":"vt.vi.n.","c":"掃描","es":"He used a machine to scan the old photographs.","cs":"他使用機器掃描舊照片。","d":"To look at all parts of (something) carefully in order to detect some feature."},{"id":3005,"l":5,"w":"scandal","k":"`skæ nd!","p":"n.","c":"醜聞","es":"The politician was involved in a major financial scandal.","cs":"這位政治家捲入了一樁重大的金融醜聞。","d":"An action or event regarded as morally or legally wrong and causing general public outrage."},{"id":3006,"l":5,"w":"scar","k":"skɑr","p":"n.","c":"傷痕","es":"The old burn wound left a permanent scar.","cs":"舊的燒傷留下了一個永久的傷痕。","d":"A mark left on the skin or within body tissue where a wound, burn, or sore has not healed completely and fibrous connective tissue has developed."},{"id":3007,"l":5,"w":"scent","k":"sɛnt","p":"n.","c":"香氣","es":"The dog followed the scent of the rabbit.","cs":"狗循著兔子的香氣（氣味）追蹤。","d":"A distinctive-smelling liquid used as a perfume."},{"id":3008,"l":5,"w":"scheme","k":"skim","p":"n.","c":"計畫","es":"The government announced a new economic scheme.","cs":"政府宣布了一項新的經濟計畫。","d":"A large-scale systematic plan or arrangement for attaining some particular object or putting a particular idea into effect."},{"id":3009,"l":5,"w":"scorn","k":"skɔrn","p":"n.vt.vi.","c":"輕蔑","es":"He treated her suggestions with utter scorn.","cs":"他對她的建議完全抱以輕蔑。","d":"The feeling or belief that someone or something is worthless or despicable; contempt."},{"id":3010,"l":5,"w":"scramble","k":"`skræ mb!","p":"vi.n.vt.","c":"爬行；倉促湊成","es":"The children had to scramble over the rocky hill.","cs":"孩子們不得不爬行過這座多岩石的山丘。","d":"To make one's way quickly or awkwardly up a steep gradient or over rough ground by using one's hands as well as one's feet."},{"id":3011,"l":5,"w":"scrap","k":"skræ p","p":"n.vt.","c":"碎片；當廢紙扔掉","es":"We used a scrap of paper to write down the number.","cs":"我們用了一張碎片（碎紙）來寫下號碼。","d":"A small piece or amount of something, especially one that is left over after the greater part has been used."},{"id":3012,"l":5,"w":"scrape","k":"skrep","p":"vt.vi.n.","c":"刮；擦","es":"He had to scrape the old paint off the wall.","cs":"他不得不刮掉牆上的舊油漆。","d":"To rub or cause to rub by accident against a rough or hard surface, causing damage or injury."},{"id":3013,"l":5,"w":"scroll","k":"skrol","p":"n.","c":"卷軸","es":"The ancient document was carefully preserved on a scroll.","cs":"這份古老的文件被小心地保存在一個卷軸上。","d":"A roll of parchment or paper for writing or painting on."},{"id":3014,"l":5,"w":"sculptor","k":"`skʌlptɚ","p":"n.","c":"雕刻家","es":"The famous sculptor exhibited his latest marble statue.","cs":"這位著名的雕刻家展出了他最新的大理石雕像。","d":"An artist who makes sculptures."},{"id":3015,"l":5,"w":"secure","k":"sɪ`kjʊr","p":"adj.v.","c":"安全的 ；(使)變安全","es":"Keep your valuables locked away to keep them secure.","cs":"把你的貴重物品鎖起來，讓它們安全。","d":"Fixed or fastened so as not to give way, become loose, or be lost; to make secure."},{"id":3016,"l":5,"w":"segment","k":"`sɛgmənt","p":"n.","c":"部分","es":"The pie was cut into six equal segments.","cs":"餡餅被切成六個相等部分。","d":"Each of the parts into which something is or may be divided."},{"id":3017,"l":5,"w":"sensation","k":"sɛn`seʃən","p":"n.","c":"感覺；轟動 (的事 )","es":"The news of the invention caused a great sensation.","cs":"這項發明的消息引起了巨大的轟動。","d":"A physical feeling or perception resulting from something that happens to or comes into contact with the body."},{"id":3018,"l":5,"w":"sensitivity","k":"͵sɛnsə`tɪvətɪ","p":"n.","c":"敏感","es":"Her high sensitivity to criticism made her feel hurt.","cs":"她對批評的極高敏感度讓她感到受傷。","d":"The quality or condition of being sensitive."},{"id":3019,"l":5,"w":"sentiment","k":"`sɛntəmənt","p":"n.","c":"情緒","es":"The strong national sentiment was evident in the parade.","cs":"強烈的民族情緒在遊行中很明顯。","d":"A feeling or emotion."},{"id":3020,"l":5,"w":"sergeant","k":"`sɑrdʒənt","p":"n.","c":"陸軍中士","es":"He was promoted from corporal to sergeant.","cs":"他從下士晉升為中士。","d":"A noncommissioned officer in the armed forces, in particular (in the US Army or Marine Corps) an NCO ranking above corporal and below staff sergeant, or (in the US Air Force) an NCO ranking above airman and below staff sergeant."},{"id":3021,"l":5,"w":"series","k":"`siriz","p":"n.","c":"系列","es":"The bookstore sells a complete series of detective novels.","cs":"這家書店出售一套完整的偵探小說系列。","d":"A number of things, events, or people of a similar kind or related nature coming one after another."},{"id":3022,"l":5,"w":"sermon","k":"`sɝmən","p":"n.","c":"佈道","es":"The minister delivered a powerful sermon on forgiveness.","cs":"牧師發表了一篇關於寬恕的有力佈道。","d":"A talk on a religious or moral subject, especially one given during a church service and based on a passage from the Bible."},{"id":3023,"l":5,"w":"server","k":"`sɝvɚ","p":"n.","c":"服務生；發球員；伺服器","es":"The restaurant server brought us the menu.","cs":"餐廳服務生給我們拿來了菜單。","d":"A person or thing that provides a service or commodity, in particular; a computer or computer program that manages access to a centralized resource or service in a network."},{"id":3024,"l":5,"w":"setting","k":"`sɛtɪŋ","p":"n.","c":"安裝；環境；背景； 佈景","es":"The play requires a very detailed and realistic setting.","cs":"這齣戲需要一個非常詳細且逼真的佈景（背景）。","d":"The place or type of surroundings where something is positioned or where an event takes place."},{"id":3025,"l":5,"w":"shabby","k":"`ʃæbɪ","p":"adj.","c":"破爛的","es":"He was wearing a shabby old coat.","cs":"他穿著一件破爛的舊外套。","d":"In poor condition through long or hard use or lack of care."},{"id":3026,"l":5,"w":"sharpen","k":"`ʃɑrpn","p":"vt.vi.","c":"( 使)變銳利；磨尖","es":"He used a whetstone to sharpen the knife.","cs":"他用磨刀石來磨尖刀子。","d":"To make or become sharp or sharper."},{"id":3027,"l":5,"w":"shatter","k":"`ʃætɚ","p":"vt.vi.","c":"粉碎","es":"The glass dropped and shattered on the floor.","cs":"玻璃掉在地上粉碎了。","d":"To break suddenly and violently into pieces."},{"id":3028,"l":5,"w":"sheriff","k":"`ʃɛrɪf","p":"n.","c":"警長","es":"The county sheriff is the highest law enforcement officer.","cs":"縣警長是最高的執法官員。","d":"(In the US) an elected officer in a county who is responsible for keeping the peace."},{"id":3029,"l":5,"w":"shield","k":"`ʃild","p":"n.","c":"盾牌","es":"The knight carried a large, engraved shield.","cs":"騎士攜帶著一個刻有圖案的大盾牌。","d":"A broad piece of metal or another suitable material, held by straps or a handle attached on one side, used as a protection against blows or missiles."},{"id":3030,"l":5,"w":"shiver","k":"`ʃɪvɚ","p":"vi.n.","c":"打顫","es":"She began to shiver uncontrollably from the cold.","cs":"她因寒冷開始無法控制地打顫。","d":"(Of a person or animal) shake slightly and uncontrollably as a result of being cold, frightened, or excited."},{"id":3031,"l":5,"w":"shortage","k":"`ʃɔrtɪdʒ","p":"n.","c":"短缺","es":"There is a serious shortage of clean drinking water.","cs":"嚴重短缺乾淨的飲用水。","d":"A state or situation in which something needed cannot be obtained in sufficient amounts."},{"id":3032,"l":5,"w":"shortcoming","k":"`ʃɔrt͵kʌmɪŋ","p":"n.","c":"缺點","es":"His main shortcoming is his lack of patience.","cs":"他的主要缺點是缺乏耐心。","d":"A fault or failure to meet a certain standard, typically in a person's character, a plan, or a system."},{"id":3033,"l":5,"w":"shove","k":"ʃʌv","p":"vt.vi.","c":"推","es":"The crowd began to shove their way forward.","cs":"人群開始向前推擠。","d":"To push roughly."},{"id":3034,"l":5,"w":"shred","k":"ʃrɛd","p":"n.vt.","c":"碎片；切成條狀","es":"The document was torn into a thousand shreds.","cs":"這份文件被撕成一千塊碎片。","d":"A strip of some material, such as paper, cloth, or food, that has been torn, cut, or scraped from something larger."},{"id":3035,"l":5,"w":"shriek vi .","k":"ʃrik","p":"n.","c":"尖叫","es":"She let out a piercing shriek when she saw the mouse.","cs":"她看到老鼠時發出了一聲刺耳的尖叫。","d":"Utter a high-pitched piercing sound or words, especially as an expression of terror, pain, or excitement."},{"id":3036,"l":5,"w":"shrine","k":"ʃraɪn","p":"n.","c":"聖壇","es":"Pilgrims visited the religious shrine to pray.","cs":"朝聖者們參觀了這座宗教聖壇祈禱。","d":"A place regarded as holy because of its associations with a divinity or a sacred person or relic, typically marked by a building or other construction."},{"id":3037,"l":5,"w":"shrub","k":"ʃrʌb","p":"n.","c":"灌木","es":"The garden path was lined with low shrubs.","cs":"花園小徑兩旁種著低矮的灌木。","d":"A woody plant that is smaller than a tree and has several main stems arising at or near the ground."},{"id":3038,"l":5,"w":"shudder","k":"`ʃʌdɚ","p":"vi.n.","c":"發抖","es":"He gave a small shudder as the cold wind blew past.","cs":"寒風吹過時，他輕微地發抖了一下。","d":"(Of a person) tremble convulsively, typically as a result of fear or revulsion."},{"id":3039,"l":5,"w":"shutter","k":"`ʃʌtɚ","p":"n.","c":"百葉窗；快門","es":"The photographer pressed the shutter at the exact right moment to capture the bird in flight.","cs":"攝影師在最準確的瞬間按下快門，捕捉到了鳥兒飛翔的畫面。","d":"Each of a pair of hinged panels, often louvered, fixed inside or outside a window that can be closed for security or privacy or to keep out light; a device that opens and closes to expose the film in a camera."},{"id":3040,"l":5,"w":"silkworm","k":"`sɪlk͵wɝm","p":"n.","c":"蠶","es":"The farmers cultivate silkworms for silk production.","cs":"農民們飼養蠶來生產絲綢。","d":"A commercially bred caterpillar that spins a silk cocoon from which silk is obtained."},{"id":3041,"l":5,"w":"simmer","k":"`sɪmɚ","p":"vi.vt.n.","c":"燉","es":"Let the sauce simmer gently for about twenty minutes.","cs":"讓醬汁溫和地燉煮大約二十分鐘。","d":"(Of water or food) stay just below the boiling point while being heated."},{"id":3042,"l":5,"w":"skeleton","k":"`skɛlətn","p":"n.","c":"骨骸","es":"The complete human skeleton was displayed in the museum.","cs":"完整的人體骨骸在博物館展出。","d":"An internal or external framework of bone, cartilage, or other rigid material supporting or containing the body of an animal or plant."},{"id":3043,"l":5,"w":"skull","k":"skʌl","p":"n.","c":"頭蓋骨","es":"The doctor explained the functions of the human skull.","cs":"醫生解釋了人體頭蓋骨的功能。","d":"A framework of bone or cartilage enclosing the brain of a vertebrate; the skeleton of a person's or animal's head."},{"id":3044,"l":5,"w":"slam","k":"slæ m","p":"vt.vi.n.","c":"猛地關上；砰然聲","es":"He was so angry that he slammed the door shut.","cs":"他非常生氣，以至於他猛地關上了門。","d":"To shut (a door, window, or lid) forcefully and loudly."},{"id":3045,"l":5,"w":"slap","k":"slæ p","p":"n.vt.vi.","c":"摑","es":"She gave him a playful slap on the back.","cs":"她在他背上摑了一掌。","d":"To hit or strike with the flat of the hand or other flat object."},{"id":3046,"l":5,"w":"slaughter","k":"`slɔtɚ","p":"vt.n.","c":"屠宰","es":"The ethical treatment of animals during slaughter is debated.","cs":"動物在屠宰過程中的倫理待遇受到了爭論。","d":"To kill (animals) for food."},{"id":3047,"l":5,"w":"slay","k":"sle","p":"vt.vi.","c":"殺害","es":"The ancient hero was destined to slay the dragon.","cs":"這位古代英雄註定要殺害這條龍。","d":"To kill in a violent way."},{"id":3048,"l":5,"w":"sloppy","k":"`slɑpɪ","p":"adj.","c":"草率的","es":"He did a very sloppy job on the report.","cs":"他在報告上做得非常草率的。","d":"Careless and unsystematic; excessively casual."},{"id":3049,"l":5,"w":"slump","k":"slʌmp","p":"vi.vt.n.","c":"( 使)衰落","es":"The company's sales figures began to slump.","cs":"公司的銷售數字開始衰落。","d":"Sit, lean, or fall heavily and limply, especially with a bent back; a sudden severe or prolonged fall in the price, value, or amount of something."},{"id":3050,"l":5,"w":"sly","k":"slaɪ","p":"adj.","c":"狡猾的","es":"The sly fox managed to steal the cheese unseen.","cs":"這隻狡猾的狐狸在沒被發現的情況下成功偷走了起司。","d":"Having or showing a cunning and deceitful nature."},{"id":3051,"l":5,"w":"smash","k":"smæ ʃ","p":"vt.vi.n.","c":"粉碎","es":"The vase fell and smashed into pieces.","cs":"花瓶掉下來粉碎成碎片。","d":"To violently break (something) into pieces."},{"id":3052,"l":5,"w":"snarl","k":"snɑr!","p":"vi.vt.n.","c":"吠；咆哮","es":"The angry dog began to snarl at the postman.","cs":"這隻生氣的狗開始對郵遞員咆哮。","d":"(Of an animal such as a dog) make an aggressive growl with bared teeth."},{"id":3053,"l":5,"w":"snatch","k":"snæ t ʃ","p":"vt.vi.n.","c":"奪走","es":"The thief tried to snatch the woman's handbag.","cs":"小偷試圖奪走那位女士的手提包。","d":"To quickly seize (something) in a rude or eager way."},{"id":3054,"l":5,"w":"sneak","k":"snik","p":"vi.vt.n.","c":"偷偷地走 /做","es":"We decided to sneak into the cinema without tickets.","cs":"我們決定偷偷地走進電影院，沒有買票。","d":"To move or go in a furtive or stealthy manner."},{"id":3055,"l":5,"w":"sneaker(s)","k":"`snik ɚ","p":"n.","c":"運動鞋；鬼祟的人","es":"He put on his favorite pair of sneakers for the run.","cs":"他穿上他最喜歡的那雙運動鞋去跑步。","d":"A soft shoe with a rubber sole worn for sports or casual occasions."},{"id":3056,"l":5,"w":"sniff","k":"snɪf","p":"vt.vi.n.","c":"嗅","es":"The dog began to sniff at the package curiously.","cs":"狗開始好奇地嗅著包裹。","d":"To draw in air audibly through the nose to detect a smell, to stop it from running, or to express contempt."},{"id":3057,"l":5,"w":"snore","k":"snor","p":"vi.n.","c":"打呼","es":"His loud snores kept everyone in the room awake.","cs":"他響亮的打呼聲讓房間裡的每個人都醒著。","d":"To breathe with a snorting or grunting sound while asleep."},{"id":3058,"l":5,"w":"snort","k":"snɔrt","p":"vi.vt.n.","
